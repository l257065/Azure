<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Azure 考照練習</title>
<!--
  選擇入口頁。這一頁**沒有密碼、也不需要**——它只是兩個連結，不含任何題目內容。
  題目在兩個練習頁裡，那兩份是加密的（見 AZ104/README.md）。

  兩份練習頁共用 sessionStorage 的同一把鑰匙，所以解鎖其中一頁之後，
  從這裡點進另一頁不會再問密碼（同一個分頁工作階段內）。
-->
<style>
 :root{color-scheme:dark}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;
      font:16px/1.6 system-ui,"Noto Sans TC",sans-serif;background:#0f172a;color:#e2e8f0}
 .box{width:min(94vw,44rem)}
 h1{margin:0 0 .3rem;font-size:1.45rem;letter-spacing:.02em}
 .lede{margin:0 0 1.75rem;color:#94a3b8;font-size:.92rem}
 .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
 a.card{display:block;padding:1.4rem 1.5rem;border-radius:14px;text-decoration:none;
        background:#1e293b;color:inherit;border:1px solid #334155;
        transition:transform .12s ease,border-color .12s ease,background .12s ease}
 a.card:hover{transform:translateY(-2px);border-color:#2563eb;background:#22304a}
 .code{font-size:1.3rem;font-weight:700;letter-spacing:.03em}
 .name{margin-top:.15rem;color:#cbd5e1;font-size:.95rem}
 .meta{margin-top:.9rem;color:#94a3b8;font-size:.82rem}
 .lock{display:inline-block;margin-top:.9rem;padding:.12rem .55rem;border-radius:999px;
       border:1px solid #475569;color:#94a3b8;font-size:.75rem}
 footer{margin-top:1.75rem;color:#64748b;font-size:.8rem;line-height:1.7}
</style>
</head>
<body>
<div class="box">
  <h1>Azure 考照練習</h1>
  <p class="lede">選一份開始。兩份都需要密碼；解鎖其中一份之後，切到另一份不用再輸入。</p>

  <div class="grid">
    <a class="card" href="AZ900/az900-practice.html">
      <div class="code">AZ-900</div>
      <div class="name">Azure Fundamentals</div>
      <div class="meta">718 題（自製 244 ＋ 文件 474）</div>
      <span class="lock">🔒 需要密碼</span>
    </a>

    <a class="card" href="AZ104/az104-practice.html">
      <div class="code">AZ-104</div>
      <div class="name">Azure Administrator</div>
      <div class="meta">563 題（Q606 題庫）</div>
      <span class="lock">🔒 需要密碼</span>
    </a>
  </div>

  <footer>
    四種原廠題型（單複選／是非表／拖放／下拉）、模擬考、錯題本、星號題、統計與進度續作。<br>
    中英對照，可切換「中／中+EN／EN」。
  </footer>
</div>
</body>
</html>
