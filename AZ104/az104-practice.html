<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AZ-104 練習 · Azure Administrator Drill</title>
<script>
/* 主題在畫面畫出來之前就先套用，避免重新整理時閃一下白底 */
try{
  var t = localStorage.getItem("az104.theme.v1");
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
}catch(e){}
</script>
<style>
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#F3F7F7; --sunken:#E4EAEB;
  --ink:#0F1618; --ink-dim:#5B696E; --ink-faint:#8A979B;
  --line:#D2DBDD; --line-strong:#B6C3C6;
  --accent:#0A6B75; --accent-soft:#D9EDEF; --on-accent:#FFFFFF;
  --ok:#1C7A4B; --ok-soft:#DFF1E7;
  --bad:#B0392C; --bad-soft:#FBE4E1;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1214; --surface:#141C1F; --surface-2:#1A2429; --sunken:#0A0F11;
    --ink:#E3EBED; --ink-dim:#93A4A9; --ink-faint:#6C7C81;
    --line:#253238; --line-strong:#3A4A50;
    --accent:#3FC2CD; --accent-soft:#12333A; --on-accent:#04191C;
    --ok:#54C489; --ok-soft:#123326;
    --bad:#F17A6C; --bad-soft:#3A1B18;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1214; --surface:#141C1F; --surface-2:#1A2429; --sunken:#0A0F11;
  --ink:#E3EBED; --ink-dim:#93A4A9; --ink-faint:#6C7C81;
  --line:#253238; --line-strong:#3A4A50;
  --accent:#3FC2CD; --accent-soft:#12333A; --on-accent:#04191C;
  --ok:#54C489; --ok-soft:#123326;
  --bad:#F17A6C; --bad-soft:#3A1B18;
}
:root[data-theme="light"]{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#F3F7F7; --sunken:#E4EAEB;
  --ink:#0F1618; --ink-dim:#5B696E; --ink-faint:#8A979B;
  --line:#D2DBDD; --line-strong:#B6C3C6;
  --accent:#0A6B75; --accent-soft:#D9EDEF; --on-accent:#FFFFFF;
  --ok:#1C7A4B; --ok-soft:#DFF1E7;
  --bad:#B0392C; --bad-soft:#FBE4E1;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topH,100px) + 16px);scroll-padding-bottom:76px}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px; line-height:1.65;
}
.mono,.chip,.kbd{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","Consolas","Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
}

/* ---------- shell ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  margin:0 -14px;padding:10px 14px 0;
}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;min-height:34px}
.brand h1{font-size:1.02rem;margin:0;letter-spacing:.01em;font-weight:650;white-space:nowrap}
.brand .sub{
  font-size:.66rem;letter-spacing:.1em;color:var(--ink-faint);
  font-family:ui-monospace,monospace;white-space:nowrap;
  border:1px solid var(--line);border-radius:999px;padding:2px 8px;
}
.brand .sub[data-src="doc"]{color:var(--bad);border-color:var(--bad)}
.brand .spacer{margin-left:auto}
.brand .hits{display:inline-flex;align-self:center;line-height:0}
.brand .hits img{height:20px;width:auto;opacity:.85}
.brand .hits:hover img{opacity:1}
@media (max-width:380px){.brand .hits{display:none}}
.ch-btn{
  background:none;border:1px solid var(--line);color:var(--ink-dim);flex:0 0 auto;
  border-radius:999px;height:34px;padding:0 11px;font:inherit;font-size:.78rem;cursor:pointer;line-height:1;
}
.ch-btn.only-ico{width:34px;padding:0;font-size:.95rem}
.ch-btn .lbl{margin-left:5px}
/* 窄螢幕：統計／模擬考只留圖示，頂列才擠得下一行 */
@media (max-width:600px){
  .ch-btn .lbl{display:none}
  .ch-btn{width:34px;padding:0;font-size:.95rem}
}
@media (max-width:470px){ .brand .sub{display:none} }
@media (max-width:360px){ .brand h1{font-size:.95rem} }
.ch-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.ch-btn[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:650}
/* 題數說明：紅圈驚嘆號，窄螢幕也不縮成無框圖示 */
.ch-btn.info{
  color:var(--bad);border-color:var(--bad);font-weight:700;font-size:1rem;
  width:34px;padding:0;margin-right:2px;
}
.ch-btn.info:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* 語言：三段式，直接點選 */
.langseg{display:inline-flex;align-self:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langseg button{
  appearance:none;background:none;border:0;border-left:1px solid var(--line);
  color:var(--ink-dim);font:inherit;font-size:.76rem;line-height:1;
  height:34px;padding:0 10px;cursor:pointer;white-space:nowrap;
}
.langseg button:first-child{border-left:0}
.langseg button:hover{color:var(--ink);background:var(--surface-2)}
.langseg button[aria-pressed="true"]{
  background:var(--accent);color:var(--on-accent);font-weight:650;
}
.langseg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:400px){.langseg button{padding:0 8px;font-size:.72rem}}
/* 頂列多了一顆「!」，窄螢幕不收緊就會擠成兩行。
   放在這裡是因為要蓋掉上面 .ch-btn.only-ico 與 400px 的語言鈕規則 */
@media (max-width:470px){
  .brand{gap:5px}
  .ch-btn,.ch-btn.only-ico{width:30px;padding:0;font-size:.92rem}
  .ch-btn.info{margin-right:0}
  .langseg button{padding:0 6px;font-size:.72rem}
}
/* 360–400px（iPhone SE 這種寬度）還差幾個像素，標題再縮一級就排得下 */
@media (max-width:400px){ .brand h1{font-size:.92rem} }
@media (max-width:365px){ .brand h1{font-size:.86rem} .langseg button{padding:0 5px} }
/* 題庫來源：沿用三段式外觀，但用不同色帶區分，避免和語言鈕混淆 */
.srcseg button[aria-pressed="true"]{background:var(--ink-dim);color:var(--bg)}
.srcseg button[data-src="doc"][aria-pressed="true"]{background:var(--bad);color:#fff}
.ch-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 設定面板 ---------- */
.cfgrow{display:flex;align-items:center;gap:12px;margin:14px 0 0}
.cfgrow .k{
  flex:0 0 62px;font-family:ui-monospace,monospace;font-size:.7rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;
}
.cfghint{margin:6px 0 0 74px;font-size:.76rem;color:var(--ink-faint);line-height:1.5}
@media (max-width:400px){
  .cfgrow{flex-wrap:wrap;gap:6px}
  .cfgrow .k{flex:0 0 100%}
  .cfghint{margin-left:0}
}
.cfgact{
  appearance:none;font:inherit;font-size:.8rem;cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 14px;
}
.cfgact:hover{border-color:var(--bad);color:var(--bad)}
.cfgact.armed{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:650}
.cfgact:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

nav.tabs{display:flex;gap:2px}
nav.tabs button{
  flex:1;appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--ink-dim);padding:9px 4px 10px;cursor:pointer;font:inherit;font-size:.8rem;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;
}
nav.tabs button .num{
  font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.1em;color:var(--ink-faint);
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:650}
nav.tabs button[aria-selected="true"] .num{color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:6px}

/* ---------- 進度列 ---------- */
.bar{height:3px;background:var(--sunken);margin:0 -14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

/* ---------- 題目 ---------- */
.qhead{display:flex;align-items:center;gap:7px;margin:16px 0 10px;flex-wrap:wrap}
.qhead .spacer{margin-left:auto}
.eyebrow{
  font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);
}
.score{
  font-family:ui-monospace,monospace;font-size:.74rem;color:var(--ink-dim);
  border:1px solid var(--line);border-radius:999px;padding:2px 10px;
}
/* 題目列上的小圖示鈕（星號）：跟計分徽章同高，不再自己佔一列 */
.icobtn{
  appearance:none;background:none;border:1px solid var(--line);color:var(--ink-faint);
  border-radius:999px;width:26px;height:26px;line-height:1;font-size:.86rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;
}
.icobtn:hover{border-color:var(--line-strong);color:var(--ink)}
.icobtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icobtn.star[aria-pressed="true"]{background:var(--star-soft);border-color:var(--star);color:var(--star)}
.icobtn[hidden]{display:none}
.score.timer{color:var(--accent);border-color:var(--accent)}
.score.timer.warn{color:var(--bad);border-color:var(--bad);font-weight:650}

/* 跳題：輸入題號直接跳到那一題 */
.jump{display:inline-flex;align-items:center;gap:5px}
.jump input{
  width:66px;font:inherit;font-family:ui-monospace,monospace;font-size:.74rem;
  color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;
  -moz-appearance:textfield;appearance:textfield;
}
.jump input::-webkit-outer-spin-button,
.jump input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jump button{
  font:inherit;font-size:.72rem;line-height:1;color:var(--ink-dim);cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
}
.jump button:hover{border-color:var(--line-strong);color:var(--ink)}
.jump input:focus-visible,.jump button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jump[data-off="1"]{opacity:.4;pointer-events:none}
.jmsg{font-size:.72rem;color:var(--ink-dim)}
.jmsg:empty{display:none}
.jmsg.bad{color:var(--bad)}

.prompt{
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:4px;padding:14px 16px;margin-bottom:14px;
}
.prompt .qtext{margin:0 0 10px;font-size:1.04rem;font-weight:600;line-height:1.7}
.prompt .qtext:last-child{margin-bottom:0}
/* 每題都一樣的制式前言：降重量並和真正的題目分開 */
.prompt .qnote{
  margin:0 0 10px;padding:0 0 9px;border-bottom:1px dashed var(--line);
  font-size:.82rem;font-weight:400;line-height:1.65;color:var(--ink-faint);
}
/* 螢光筆：標出題目裡的決勝條件，對應原始 PDF 的紅框，但改成劃重點的樣子 */
mark.hl{
  background:linear-gradient(transparent 55%, rgba(255,214,0,.62) 55%);
  color:inherit;padding:0 1px;border-radius:2px;
}
@media (prefers-color-scheme: dark){
  mark.hl{background:linear-gradient(transparent 55%, rgba(255,214,0,.30) 55%)}
}
:root[data-theme="dark"] mark.hl{background:linear-gradient(transparent 55%, rgba(255,214,0,.30) 55%)}
:root[data-theme="light"] mark.hl{background:linear-gradient(transparent 55%, rgba(255,214,0,.62) 55%)}
.expl mark.hl{background:linear-gradient(transparent 60%, rgba(255,214,0,.45) 60%)}
.prompt .meta{
  margin:0 0 8px;font-family:ui-monospace,monospace;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);
}
/* 核對狀態：這一題是「從拆開的子題合併還原」的，還沒回頭跟原始文件逐字核對過 */
.prompt .chk{
  display:inline-block;margin-left:8px;padding:1px 7px;border-radius:3px;
  font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:0;text-transform:none;
  border:1px solid var(--line-strong);color:var(--ink-dim);background:var(--surface-2);
  cursor:help;
}
.prompt .chk.wait{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.prompt .chk.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
/* ext：原始 PDF 沒有這個題號，是由外部來源補入的。用藍紫色與另兩種狀態明顯區分 */
.prompt .chk.ext{border-color:#7a5af5;color:#7a5af5;background:rgba(122,90,245,.10)}
.prompt .chk.act{cursor:pointer}
.prompt .chk.act:hover{border-color:var(--accent);color:var(--accent)}
/* 原文對照：切出來看原始文件長什麼樣，確認改寫後沒有跑掉 */
.v0box{
  display:none;margin:0 0 14px;padding:12px 14px;border:1px dashed var(--line-strong);
  border-radius:4px;background:var(--sunken);color:var(--ink-dim);
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  font-size:.8rem;line-height:1.75;white-space:pre-wrap;
}
.v0box.show{display:block}
.v0box .lab{
  display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:6px;
}
.prompt .multi{
  display:inline-block;margin-top:9px;font-size:.78rem;color:var(--bad);
  border:1px solid var(--bad);border-radius:3px;padding:1px 8px;
}
/* 選滿了就轉綠：一眼看得出這題已經湊齊 N 項，可以往下一題 */
.prompt .multi.done{color:var(--ok);border-color:var(--ok)}
/* 想選第 N+1 項、或沒選滿就要繼續：閃一下提醒 */
.prompt .multi.warn{background:var(--bad-soft);font-weight:650;animation:multibump .32s ease}
@keyframes multibump{
  0%{transform:translateX(0)} 25%{transform:translateX(-4px)}
  60%{transform:translateX(4px)} 100%{transform:translateX(0)}
}

.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:11px 13px;font:inherit;font-size:.94rem;line-height:1.6;color:var(--ink);
  cursor:pointer;min-height:46px;
}
.opt:hover{border-color:var(--line-strong)}
.opt .key{
  flex:0 0 auto;width:24px;height:24px;border-radius:3px;margin-top:1px;
  border:1px solid var(--line-strong);background:var(--sunken);color:var(--ink-dim);
  font-family:ui-monospace,monospace;font-size:.78rem;font-weight:650;
  display:flex;align-items:center;justify-content:center;
}
/* 服務圖示：原題的答案區是入口網站的服務列（圖示＋名稱），有 ico 就照原樣顯示。
   圖示是 Microsoft 官方 Azure 圖示包的 SVG，內嵌成 data URI，不連外。 */
.opt .oico{
  flex:0 0 auto;width:26px;height:26px;margin-top:-1px;
  object-fit:contain;                /* SVG 比例不一，統一裝進 26×26 不變形 */
}
.ro .oico{
  flex:0 0 auto;width:20px;height:20px;object-fit:contain;margin-right:2px;
}
/* 題目裡的表格（原題就有一張表，例如 #187） */
.qtbl{border-collapse:collapse;margin:8px 0 2px;font-size:.9rem}
.qtbl th,.qtbl td{border:1px solid var(--line-strong);padding:5px 12px;text-align:left}
.qtbl th{background:var(--sunken);font-weight:650}

/* look-nav：原題的答案區是入口網站的深色左側欄（#168） */
.opts.look-nav{gap:0;border-radius:4px;overflow:hidden;background:#1b1b1b;padding:4px 0}
.opts.look-nav .opt{
  background:transparent;border:0;border-radius:0;color:#f3f3f3;
  padding:9px 14px;min-height:42px;align-items:center;
}
.opts.look-nav .opt:hover{background:#2f2f2f}
.opts.look-nav .opt .key{background:#333;border-color:#555;color:#ccc}
.opts.look-nav .opt[aria-pressed="true"]{background:#0e5a8a}
.opts.look-nav .opt.ok{background:rgba(45,150,90,.35)}
.opts.look-nav .opt.bad{background:rgba(190,60,60,.35)}
.opts.look-nav .opt.miss{background:rgba(45,150,90,.18);outline:1px dashed var(--ok);outline-offset:-2px}

/* look-icons：原廠考試只給一張工具列的圖，選項就是圖示本身（#215） */
.opts.look-icons{flex-direction:row;flex-wrap:wrap;gap:10px}
.opts.look-icons .opt{
  width:auto;flex-direction:column;align-items:center;gap:6px;
  padding:10px 12px;min-height:0;
}
.opts.look-icons .opt .oico{width:34px;height:34px}

.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.opt[aria-pressed="true"] .key{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt.miss .key{color:var(--ok);border-color:var(--ok)}
.opt[disabled]{cursor:default}

.verdict{
  margin:0 0 14px;padding:11px 14px;border-radius:4px;font-size:.92rem;
  border:1px solid var(--line);background:var(--surface-2);display:none;
}
.verdict.show{display:block}
.verdict.pass{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.verdict.fail{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

.expl{
  display:none;margin:0 0 14px;padding:11px 14px;border-left:2px solid var(--accent);
  background:var(--surface-2);border-radius:0 3px 3px 0;
  font-size:.88rem;line-height:1.8;color:var(--ink-dim);
  white-space:pre-line;          /* 解析裡的換行要保留，方案／層級才能條列 */
}
.expl.show{display:block}
.expl b{color:var(--accent);font-weight:600}
.expl .lab{
  display:block;font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:4px;
}

/* ---------- 成績單 ---------- */
.report{display:none}
.report.show{display:block}
.bigscore{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:20px 16px;text-align:center;margin-bottom:14px;
}
.bigscore .pct{font-family:ui-monospace,monospace;font-size:2.6rem;font-weight:700;line-height:1.1}
.bigscore .pct.pass{color:var(--ok)}
.bigscore .pct.fail{color:var(--bad)}
.bigscore .cap{font-size:.86rem;color:var(--ink-dim);margin-top:6px}
.dbreak{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.dbreak .row{
  display:flex;align-items:center;gap:10px;font-size:.88rem;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 13px;
}
.dbreak .row .n{margin-left:auto;font-family:ui-monospace,monospace;color:var(--ink-dim)}
.rev{margin-bottom:12px}
.rev .item{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:11px 13px;margin-bottom:8px;font-size:.9rem;
}
.rev .item.wrong{border-left:3px solid var(--bad)}
.rev .item.right{border-left:3px solid var(--ok)}
.rev .item .q{font-weight:600;margin:0 0 6px;line-height:1.6}
.rev .item .ln{margin:0;font-size:.85rem;color:var(--ink-dim);line-height:1.75}
.rev .item .ln .you{color:var(--bad)}
.rev .item .ln .cor{color:var(--ok);font-weight:600}
/* 檢討時把全部選項列出來：正解綠、你選錯紅、沒選到的錯誤選項淡灰 */
.rev .ropts{display:flex;flex-direction:column;gap:4px;margin:9px 0 10px}
.rev .ro{
  display:flex;align-items:flex-start;gap:8px;padding:6px 9px;border-radius:3px;
  font-size:.86rem;line-height:1.55;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-dim);
}
.rev .ro .k{
  flex:0 0 auto;width:19px;height:19px;border-radius:2px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-size:.7rem;font-weight:650;
  border:1px solid var(--line-strong);background:var(--sunken);
}
.rev .ro .t{flex:1}
.rev .ro .tag{flex:0 0 auto;align-self:center;font-size:.72rem;font-weight:650;white-space:nowrap}
.rev .ro.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rev .ro.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.rev .ro.miss{border-color:var(--ok);border-style:dashed;background:var(--ok-soft);color:var(--ok)}
.rev .ro.miss .k{color:var(--ok);border-color:var(--ok);background:transparent}
.rev .ro.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.rev .ro.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.rev .ro.none{opacity:.6}

/* ---------- 底部動作列 ---------- */
.actions{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.actions .row{max-width:760px;margin:0 auto;display:flex;gap:8px}
button.act{
  flex:1;min-height:46px;border-radius:4px;font:inherit;font-size:.92rem;font-weight:600;
  cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
}
button.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.act.ghost{flex:0 0 auto;padding:0 14px;color:var(--ink-dim);font-weight:500}
/* 上一題：只用箭頭，把橫向空間讓給真正要按的主動作 */
button.act.arrow{
  flex:0 0 auto;width:48px;padding:0;font-size:1.3rem;font-weight:400;color:var(--ink-dim);
}
button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.act:active{transform:translateY(1px)}
button.act[hidden]{display:none}
button.act[disabled]{opacity:.45;cursor:default}

.hint{font-size:.82rem;color:var(--ink-dim);margin:10px 2px 0;line-height:1.75}
.hint code{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:.9em}
/* 使用說明：預設收起，需要時再展開，平常不要擋住題目 */
.hintbox{margin:18px 0 0}
.hintbox > summary{
  list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  font-size:.78rem;color:var(--ink-faint);padding:4px 2px;user-select:none;
}
.hintbox > summary::-webkit-details-marker{display:none}
.hintbox > summary::before{content:"▸";font-size:.7rem;transition:transform .15s}
.hintbox[open] > summary::before{transform:rotate(90deg)}
.hintbox > summary:hover{color:var(--ink-dim)}
.hintbox > summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.empty{
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:4px;
  padding:26px 16px;text-align:center;color:var(--ink-dim);font-size:.9rem;line-height:1.8;
}
/* ---------- 原廠題型 1：HOTSPOT 是非表（每句各自選 Yes / No） ---------- */
.hs{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.hs .hrow{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;
}
.hs .hrow .st{flex:1;font-size:.94rem;line-height:1.6}
.hs .yn{display:inline-flex;flex:0 0 auto;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.hs .yn button{
  appearance:none;background:var(--surface);border:0;border-left:1px solid var(--line);
  color:var(--ink-dim);font:inherit;font-size:.84rem;font-weight:650;line-height:1;
  min-height:38px;min-width:52px;padding:0 10px;cursor:pointer;
}
.hs .yn button:first-child{border-left:0}
.hs .yn button:hover:not([disabled]){background:var(--surface-2);color:var(--ink)}
.hs .yn button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hs .yn button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hs .yn button[disabled]{cursor:default}
/* 批改後：整列標出對錯，並把正解那一顆標綠 */
.hs .hrow.ok{border-color:var(--ok);background:var(--ok-soft)}
.hs .hrow.bad{border-color:var(--bad);background:var(--bad-soft)}
.hs .yn button.ans{background:var(--ok);color:#fff}
.hs .yn button.wrongpick{background:var(--bad);color:#fff}
.hs .hrow .mk{flex:0 0 auto;font-size:.8rem;font-weight:650}
.hs .hrow.ok .mk{color:var(--ok)}
.hs .hrow.bad .mk{color:var(--bad)}
@media (max-width:520px){
  .hs .hrow{flex-wrap:wrap}
  .hs .hrow .st{flex:1 0 100%}
}

/* ---------- 原廠題型 2：DRAG DROP 配對 ---------- */
.dd{margin-bottom:14px}
.dd .lab{
  font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 6px;
}
.dd .bank{
  display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;padding:10px;
  background:var(--sunken);border:1px dashed var(--line-strong);border-radius:4px;min-height:52px;
}
.dd .chip{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;
  padding:7px 13px;font:inherit;font-size:.88rem;line-height:1.4;color:var(--ink);
  cursor:grab;min-height:36px;display:inline-flex;align-items:center;
}
.dd .chip:hover{border-color:var(--accent)}
.dd .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.dd .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dd .chip.dragging{opacity:.45}
.dd .chip[disabled]{cursor:default;opacity:.55}
.dd .rows{display:flex;flex-direction:column;gap:8px}
.dd .drow{
  display:flex;align-items:stretch;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px;
}
.dd .slot{
  flex:0 0 40%;min-height:44px;border:1px dashed var(--line-strong);border-radius:4px;
  background:var(--surface-2);color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:6px 9px;font-size:.86rem;line-height:1.45;cursor:pointer;
}
.dd .slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.dd .slot.over{border-color:var(--accent);background:var(--accent-soft)}
.dd .slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 巢狀方框答案區（#227 縱深防禦）：一層包一層，靠 div 真的巢狀來產生同心效果，
   每層都疊一點藍，越內層自然越深，跟原題的圖一樣。 */
.nest{margin-top:4px}
.nest .nlay{
  border:1px solid var(--line-strong);border-radius:3px;
  padding:5px 7px 7px;background:rgba(56,120,190,.07);
}
.nest .nlay + .nlay{margin-top:0}
.nest .nrow{
  text-align:center;font-weight:650;font-size:.92rem;
  padding:7px 8px;margin-bottom:5px;letter-spacing:.02em;
}
.nest .nrow.nslot{padding:0;margin-bottom:5px}
/* 空格用整條的按鈕，讓拖放目標夠大 */
.nest .nrow.nslot .slot{width:100%;margin:0}
/* 這裡不能用 display:flex —— paintHl() 會把描述拆成「文字節點 + <mark>」多個子節點，
   一旦父層是 flex 容器，它們就各自變成 flex item 排成一列，中文會被擠成一字一行。
   要讓它們照一般的行內文字流動，維持 block。 */
.dd .desc{flex:1;align-self:center;font-size:.92rem;line-height:1.6}
.dd .drow.ok .slot{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dd .drow.bad .slot{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dd .drow .fix{
  display:block;margin-top:4px;font-size:.78rem;font-weight:600;color:var(--ok);
}
@media (max-width:520px){
  .dd .drow{flex-direction:column;gap:7px}
  .dd .slot{flex:1 0 auto;width:100%}
}

/* ---------- 原廠題型 3：HOTSPOT 下拉選單 ---------- */
.dl{margin-bottom:14px}
.dl .sent{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:14px 16px;font-size:1rem;line-height:2.4;
}
.dl .sent .ln{display:block}
.dl .sent .ln + .ln{margin-top:10px}
.dl select{
  font:inherit;font-size:.92rem;font-weight:600;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:4px;
  padding:6px 9px;margin:0 3px;max-width:100%;min-height:38px;cursor:pointer;
  vertical-align:middle;
}
.dl select:hover{border-color:var(--accent)}
.dl select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dl select.picked{border-color:var(--accent);background:var(--accent-soft)}
.dl select.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dl select.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dl select[disabled]{opacity:1;cursor:default}
.dl .fix{display:block;margin-top:8px;font-size:.84rem;font-weight:600;color:var(--ok)}

/* ---------- 成績單：新題型的檢討列 ---------- */
.rev .rh{
  display:flex;align-items:flex-start;gap:8px;padding:6px 9px;border-radius:3px;
  font-size:.86rem;line-height:1.55;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-dim);margin-bottom:4px;
}
.rev .rh .t{flex:1}
.rev .rh .yn{flex:0 0 auto;font-family:ui-monospace,monospace;font-size:.76rem;font-weight:650;white-space:nowrap}
.rev .rh.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rev .rh.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =====================================================================
   星號 / 標記 / 作答總覽
   ===================================================================== */
:root{--star:#B8860B;--star-soft:#FAF0D8}
@media (prefers-color-scheme: dark){:root{--star:#E9B949;--star-soft:#392D11}}
:root[data-theme="dark"]{--star:#E9B949;--star-soft:#392D11}
:root[data-theme="light"]{--star:#B8860B;--star-soft:#FAF0D8}

.qtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.qtools:empty{display:none}
.tbtn{
  appearance:none;background:none;border:1px solid var(--line);color:var(--ink-dim);
  border-radius:999px;font:inherit;font-size:.76rem;line-height:1;height:30px;padding:0 12px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.tbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn.star[aria-pressed="true"]{background:var(--star-soft);border-color:var(--star);color:var(--star);font-weight:650}
.tbtn.flag[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:650}
.tbtn.reset{margin-left:auto;color:var(--ink-faint)}
.tbtn.reset.armed{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:650}

/* 分頁上的小圓點：這個分頁還有沒做完的進度 */
nav.tabs .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin-left:5px;vertical-align:.15em;
}
.notebox{
  flex:1 1 100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:.85rem;line-height:1.5;padding:8px 10px;
  resize:vertical;min-height:46px;
}
.notebox:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.notebox::placeholder{color:var(--ink-faint)}

/* 逐題檢討裡的標記／備註 */
.rev .flagln{color:var(--bad);font-size:.82rem}
.rev .flagln b{font-weight:650}

/* 作答總覽（交卷前的確認畫面，仿原廠 Review screen） */
.ovwrap{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);
  display:none;overflow:auto;padding:22px 14px;
}
.ovwrap.show{display:block}
.ovcard{
  max-width:760px;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.ovcard h2{margin:0 0 4px;font-size:1.02rem;font-weight:650}
.ovcard .ovsub{margin:0;color:var(--ink-dim);font-size:.86rem}
.ovcard .ovsub .warnnum{color:var(--bad);font-weight:650}
.ovlegend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 2px;font-size:.74rem;color:var(--ink-dim)}
.ovlegend span{display:inline-flex;align-items:center;gap:5px}
.ovlegend i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2)}
.ovlegend i.done{background:var(--accent-soft);border-color:var(--accent)}
.ovlegend i.blank{border-style:dashed}
.ovlegend i.flag{border-color:var(--bad);border-width:2px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:12px 0 14px}
.ovcell{
  position:relative;appearance:none;font:inherit;font-size:.84rem;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-dim);
  border-radius:9px;padding:10px 0;text-align:center;
  font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;
}
.ovcell:hover{border-color:var(--line-strong);color:var(--ink)}
.ovcell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.ovcell.blank{border-style:dashed;color:var(--ink-faint)}
/* 標記只加紅框與角標，不蓋掉「已作答／未作答」的底色，兩種資訊要同時看得出來 */
.ovcell.flag{border-color:var(--bad);border-width:2px}
.ovcell.flag::after{
  content:"⚑";position:absolute;top:-8px;right:-6px;font-size:.78rem;line-height:1;
  color:#fff;background:var(--bad);border-radius:50%;width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;
}
.ovcell.cur{box-shadow:0 0 0 2px var(--ink) inset}
.ovnotes{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.ovnotes .lab{
  font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);display:block;margin-bottom:6px;
}
.ovnote{
  display:block;width:100%;text-align:left;appearance:none;background:var(--surface-2);
  border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;
  font:inherit;font-size:.82rem;color:var(--ink);padding:7px 10px;margin-bottom:6px;cursor:pointer;
}
.ovnote:hover{border-color:var(--line-strong);border-left-color:var(--bad)}
.ovnote .n{font-family:ui-monospace,monospace;color:var(--bad);font-weight:650;margin-right:6px}
.ovnote .memo{color:var(--ink-dim)}
.ovbtns{display:flex;gap:8px;margin-top:14px}
.ovbtns button{
  flex:1;appearance:none;font:inherit;font-size:.9rem;cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:11px 10px;font-weight:600;
}
.ovbtns button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ovbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- 題數說明面板 ---------- */
.infosec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.infosec .lab{
  font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);display:block;margin-bottom:6px;
}
.infosec p{margin:0 0 8px;font-size:.88rem;line-height:1.7}
.infosec p:last-child{margin-bottom:0}
.infomath{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;margin:10px 0 0;
  font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:.9rem;
}
.infomath b{color:var(--accent);font-size:1.05rem}
.infomath .why{font-family:inherit;font-size:.78rem;color:var(--ink-dim)}
.infonums{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 0}
.infonums i{
  font-style:normal;font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:.82rem;color:var(--bad);background:var(--bad-soft);
  border:1px solid var(--bad);border-radius:8px;padding:4px 9px;
}
/* ---------- 統計面板 ---------- */
.stsec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.stsec:first-of-type{border-top:0;margin-top:8px;padding-top:0}
.stsec > .lab{
  font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);display:block;margin-bottom:8px;
}
.stsec .none{color:var(--ink-faint);font-size:.84rem;margin:2px 0 0}
.stnow{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
}
.stnow .big{font-family:ui-monospace,monospace;font-size:1.3rem;font-weight:650;color:var(--accent)}
.stnow .cap{font-size:.82rem;color:var(--ink-dim)}

/* 領域強弱長條 */
.dbar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.dbar .nm{
  flex:0 0 9.6em;font-size:.85rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dbar .nm i{
  font-family:ui-monospace,monospace;font-style:normal;font-size:.7rem;
  color:var(--ink-faint);margin-right:5px;
}
.dbar .track{flex:1;height:9px;border-radius:999px;background:var(--sunken);overflow:hidden}
.dbar .track i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .3s}
.dbar.hi .track i{background:var(--ok)}
.dbar.lo .track i{background:var(--bad)}
.dbar .pc{
  flex:0 0 5.2em;text-align:right;font-family:ui-monospace,monospace;font-size:.8rem;
  font-variant-numeric:tabular-nums;color:var(--ink-dim);
}
.dbar .pc b{color:var(--ink);font-weight:650}
.dhint{font-size:.78rem;color:var(--ink-faint);margin:-2px 0 0}

/* 常錯題 */
.wq{
  display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;appearance:none;
  background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--bad);
  border-radius:9px;font:inherit;font-size:.82rem;color:var(--ink);
  padding:8px 10px;margin-bottom:6px;cursor:pointer;
}
.wq:hover{border-color:var(--line-strong);border-left-color:var(--bad)}
.wq .rate{
  flex:0 0 auto;font-family:ui-monospace,monospace;font-size:.76rem;color:var(--bad);font-weight:650;
  border:1px solid var(--bad);border-radius:6px;padding:1px 6px;line-height:1.5;
}
.wq .tx{flex:1;line-height:1.45}
.wq .tx small{display:block;color:var(--ink-faint);font-size:.72rem;margin-top:2px}
.wq .st{flex:0 0 auto;color:var(--ink-faint);font-size:.95rem}
.wq[aria-pressed="true"] .st{color:var(--star)}

/* 歷次成績 */
.hrow2{
  display:flex;align-items:center;gap:9px;font-size:.82rem;
  border-bottom:1px dashed var(--line);padding:7px 2px;
}
.hrow2:last-child{border-bottom:0}

 o:["kubectl 命令","az aks 命令","Set-AzVm 指令程式","Azure 入口網站","Set-AzAks 指令程式"],
 a:[0,1],
 e:"本題（Quiz12 來源）標記的正確答案是 kubectl 與 az aks：kubectl autoscale 指令可以針對「特定的部署 (deployment)」設定 Pod 層級的自動調整（例如依 CPU 使用率調整 Pod 數量上下限）；az aks update 則是在「節點集區」層級啟用並設定叢集自動調整器（自動增減節點數）。\n不過同樣情境在 AZ104-Q90（Quiz3 來源）標記的正確答案卻是 az aks 命令與 Azure 入口網站。\n這是題庫本身的來源分歧：kubectl autoscale 調的其實是 Pod（工作負載）層級的自動調整，跟題目問的「叢集自動調整器（節點層級）」嚴格來說是兩個不同的功能，Q90 版本（az aks／入口網站）在概念上更貼近「叢集」自動調整；但忠實依本卷來源標記為準，請注意這一題在不同版本的考古題裡有爭議。",
 en:{q:"Which two tools should you use?",
  o:["the kubectl command","the az aks command","the Set-AzVm cmdlet","the Azure portal","the Set-AzAks cmdlet"],
  e:"This source marks kubectl and az aks as correct. Note: the same scenario in Q90 (a different source) marks az aks and the Azure portal instead — a known discrepancy. Strictly, kubectl autoscale configures pod-level (workload) autoscaling, not the cluster/node-level autoscaler the question asks about, making Q90's combination arguably more precise."}},

{n:412, code:"AZ104-Q412", d:2, od:3, t:"設定鄰近放置群組", tEn:"Configuring a proximity placement group", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q92 是同一組情境的重複題，這裡表格資訊完整保留。\n你有一個 Azure 訂用帳戶，內含下表所示的資源：\n| 名稱 | 類型 | 資源群組 | 地區 |\n|---|---|---|---|\n| RG1 | 資源群組 | 不適用 | Central US |\n| RG2 | 資源群組 | 不適用 | West US |\n| VMSS1 | 虛擬機器擴展集 | RG2 | West US |\n| Proximity1 | 鄰近放置群組 | RG1 | Central US |\n| Proximity2 | 鄰近放置群組 | RG2 | West US |\n| Proximity3 | 鄰近放置群組 | RG1 | Central US |\n你需要替 VMSS1 設定鄰近放置群組。⟦你應該使用哪一個鄰近放置群組？⟧",
 o:["僅 Proximity2","Proximity1、Proximity2 和 Proximity3","僅 Proximity1","僅 Proximity1 和 Proximity3"],
 a:[0],
 e:"VMSS1 所在的資源群組 RG2 位於 West US，三個鄰近放置群組裡只有 Proximity2 也在 West US（且同屬 RG2），所以只能用 Proximity2；Proximity1、Proximity3 都在 Central US，地區不符。",
 en:{q:"Which proximity placement groups should you use?",
  o:["Proximity2 only","Proximity1, Proximity2, and Proximity3","Proximity1 only","Proximity1 and Proximity3 only"],
  e:"VMSS1 (in RG2, West US) matches only Proximity2, which is also in West US."}},

{n:413, code:"AZ104-Q413", d:3, od:5, t:"Log Analytics 查詢語法", tEn:"Log Analytics query syntax", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q19、Q32、Q429、Q433 是同一組情境的重複題，只是選項組合不同。\n你有一個 Log Analytics 工作區 Workspace1，你需要從一個名為 Event 的資料表查出錯誤事件。⟦你應該執行哪個查詢？⟧",
 o:["Get-Event Event | where {$_.EventType == \"error\"}","search in (Event) \"error\"","select * from Event where EventType == \"error\"","search in (Event) * | where EventType -eq \"error\""],
 a:[1],
 e:"要在特定資料表裡搜尋字串，緊接在 search 運算子後面加上資料表名稱即可，search in (Event) \"error\" 是合法的 KQL 語法。Get-Event 是 PowerShell 語法、select * from 是 SQL 語法，都不是 KQL；第四個選項語法本身不正確（search in 後面的萬用字元 * 與 where 子句的組合方式不對）。",
 en:{q:"Which query should you run in Workspace1?",
  o:["Get-Event Event | where {$_.EventType == \"error\"}","search in (Event) \"error\"","select * from Event where EventType == \"error\"","search in (Event) * | where EventType -eq \"error\""],
  e:"`search in (Event) \"error\"` is valid KQL syntax for searching a specific table."}},

{n:414, code:"AZ104-Q414", d:2, od:3, t:"用 CORS 讓另一個網域呼叫 API", tEn:"Using CORS to allow cross-domain calls", k:"mc",
 src:"quiz12:html",
 q:"一家公司在 Azure App Service 上跑了一個應用程式，想讓這個應用程式跟另一個網域上的應用程式互相溝通。⟦以下哪個設定可以達成這個需求？⟧",
 o:["替 App Service 啟用 CORS","替 App Service 啟用自動調整","替 App Service 啟用 OAuth","替 App Service 啟用 API 定義"],
 a:[0],
 e:"App Service 支援跨來源資源共用 (CORS)，可以讓 JavaScript 用戶端對架設在 API 應用程式上的 API 發出跨網域呼叫；App Service 讓你不用寫任何程式碼，就能直接在設定裡開放 CORS 存取。自動調整跟跨網域通訊無關；OAuth 是身分驗證機制，不是解決跨網域呼叫本身的機制；API 定義是描述 API 規格用的（例如 OpenAPI/Swagger），不是啟用跨網域存取的開關。",
 en:{q:"Which of the below configurations will make this possible?",
  o:["Enable CORS for the App Service.","Enable Autoscale for the App Service.","Enable OAuth for the App Service.","Enable API Definition for the App Service."],
  e:"App Service's built-in CORS support lets you configure cross-domain access without writing code."}},

{n:415, code:"AZ104-Q415", d:2, od:3, t:"搬移 Web App 到另一個資源群組", tEn:"Moving a web app to another resource group", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q20 是同一組情境的重複題。\n你有一個 Azure 訂用帳戶 Subscription1，內含下表所示的資源群組：\n| 名稱 | 地區 | 原則 |\n|---|---|---|\n| RG1 | West Europe | Policy1 |\n| RG2 | North Europe | Policy2 |\n| RG3 | France Central | Policy3 |\nRG1 有一個 Web 應用程式 WebApp1，位於 West Europe。你把 WebApp1 搬到 RG2。⟦這個搬移動作會有什麼效果？⟧",
 o:["WebApp1 的 App Service 方案仍留在 West Europe，Policy2 套用到 WebApp1。","WebApp1 的 App Service 方案搬到 North Europe，Policy2 套用到 WebApp1。","WebApp1 的 App Service 方案仍留在 West Europe，Policy1 套用到 WebApp1。","WebApp1 的 App Service 方案搬到 North Europe，Policy1 套用到 WebApp1。"],
 a:[0],
 e:"應用程式執行的地區取決於它所在 App Service 方案的地區，方案地區無法變更、也不會因為搬移資源群組而跟著搬，所以仍留在 West Europe。Azure Policy 套用與否看資源目前所在的資源群組，搬到 RG2 之後就改套用 RG2 的 Policy2。",
 en:{q:"What is the effect of the move?",
  o:["The App Service plan for WebApp1 remains in West Europe. Policy2 applies to WebApp1.","The App Service plan for WebApp1 moves to North Europe. Policy2 applies to WebApp1.","The App Service plan for WebApp1 remains in West Europe. Policy1 applies to WebApp1.","The App Service plan for WebApp1 moves to North Europe. Policy1 applies to WebApp1."],
  e:"The App Service plan's region never changes; policy applicability follows the current resource group (RG2 → Policy2)."}},

{n:416, code:"AZ104-Q416", d:1, od:1, t:"訂用帳戶擁有者繼承資源群組權限", tEn:"Subscription Owner inherits resource group permissions", k:"mc",
 src:"quiz12:html",
 q:"一個訂用帳戶 Subscription1 裡有三個資源群組：Development、Test、Production。Thomas、Logan、Guy 透過 RBAC 被指派了角色來存取這個訂用帳戶的資源：Logan 可以對 Development 與 Test 資源群組裡所有運算與儲存體資源做讀寫操作；Guy 是 Development 與 Test 資源群組的擁有者；Thomas 是 Subscription1 的擁有者。⟦如果需要，誰能刪除整個 Development 資源群組與裡面所有的資源？⟧",
 o:["Guy 與 Thomas 都可以","只有 Thomas 可以","只有 Guy 可以","Logan 與 Guy 都可以"],
 a:[0],
 e:"RBAC 的權限會沿著範圍階層向下繼承：訂用帳戶層級的權限會套用到底下所有資源群組與資源。Thomas 是訂用帳戶擁有者，等於在所有資源群組（含 Development）都自動具備擁有者權限；Guy 本身就直接是 Development 資源群組的擁有者。兩人都具備刪除整個資源群組的權限。Logan 只有讀寫權限（不是擁有者），沒有刪除資源群組本身的權限。",
 en:{q:"If necessary, who would be able to delete the entire Development resource group and all resources within it?",
  o:["Both Guy and Thomas","Only Thomas","Only Guy","Both Logan and Guy"],
  e:"RBAC permissions inherit down the scope hierarchy; the subscription Owner (Thomas) automatically has Owner rights on every resource group, and Guy is already a direct Owner of Development."}},

{n:417, code:"AZ104-Q417", d:3, od:4, t:"分散連線到多台 VM", tEn:"Spreading connections across VMs", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q21 是同一組情境的重複題。\n使用者從家裡（點對站 VPN）或客戶端點（站對站 VPN）存取 Azure 資源，一個業務應用程式 App1 跑在好幾台虛擬機器上。你需要確保連到 App1 的連線平均分散到所有虛擬機器上。⟦有哪兩種可能的 Azure 服務可以使用？⟧（每個正確答案各自是完整的解法。）",
 o:["內部負載平衡器","公用負載平衡器","Azure 內容傳遞網路 (CDN)","Traffic Manager","Azure 應用程式閘道"],
 a:[0,4],
 e:"不論 P2S 或 S2S VPN 進來的流量，最終都是虛擬網路內部的流量，要用能放在前端子網路處理內部流量分流的服務：內部負載平衡器與應用程式閘道都適合。公用負載平衡器面向的是公開網際網路流量；CDN 是靜態內容快取；Traffic Manager 是跨地區的 DNS 層級導向，都不適合這裡的情境。",
 en:{q:"What are two possible Azure services that you can use?",
  o:["an internal load balancer","a public load balancer","an Azure Content Delivery Network (CDN)","Traffic Manager","an Azure Application Gateway"],
  e:"Traffic arriving via VPN is internal to the VNet, so it needs an internal-facing distribution service: internal load balancer or Application Gateway."}},

{n:418, code:"AZ104-Q418", d:1, od:1, t:"資源鎖定跟 RBAC 的差異", tEn:"How resource locks differ from RBAC", k:"mc",
 src:"quiz12:html",
 q:"⟦以下哪一項正確描述了角色型存取控制 (RBAC) 跟資源鎖定 (resource locks) 之間的差異？⟧",
 o:["資源鎖定會套用限制在所有使用者與角色上","RBAC 會套用限制在所有使用者與角色上","資源鎖定只對使用者套用限制","RBAC 只對角色套用限制"],
 a:[0],
 e:"資源鎖定（例如唯讀或刪除鎖定）一旦套用，會擋下「所有」使用者與角色的對應操作，不管你被指派了多高的權限（甚至是擁有者），都一樣會被鎖定擋下，這是它跟 RBAC 最大的不同：RBAC 是「依身分決定能不能做某件事」，鎖定則是「不管身分是誰，這個範圍內就是不准做某件事」。",
 en:{q:"Which of the following statements correctly describes the difference between role-based access controls (RBAC) and resource locks?",
  o:["Resource locks apply a restriction across all users and roles","RBAC applies a restriction across all users and roles","Resource locks apply a restriction to users only","RBAC applies a restriction to roles only."],
  e:"Unlike RBAC (identity-based permissions), resource locks block the restricted action for everyone regardless of role, including Owners."}},

{n:419, code:"AZ104-Q419", d:1, od:1, t:"識別低使用率 VM", tEn:"Identifying underutilized VMs", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q22 是同一組情境的重複題。\n你有 100 台虛擬機器，需要快速找出使用率偏低、可以換成更便宜方案的虛擬機器。⟦你應該用哪一個刀鋒選單？⟧",
 o:["Monitor","Advisor","Metrics","Customer insights"],
 a:[1],
 e:"Azure Advisor 會分析既有資源設定與使用情形，主動找出可以省錢的建議，這些建議集中在 Advisor 儀表板的「成本」分頁。",
 en:{q:"Which blade should you use?",
  o:["Monitor","Advisor","Metrics","Customer insights"],
  e:"Azure Advisor identifies idle/underutilized resources and surfaces cost recommendations."}},

{n:420, code:"AZ104-Q420", d:2, od:2, t:"Import/Export 服務支援的帳戶", tEn:"Storage accounts supported by Import/Export", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q38 是同一組情境的重複題，這裡表格資訊完整保留。\n你有一個 Azure 訂用帳戶 Subscription1，內含下表所示的儲存體帳戶：\n| 名稱 | 帳戶類型 | 帳戶內含的 Azure 服務資料 |\n|---|---|---|\n| storage1 | Storage（一般用途 v1） | 檔案 (File) |\n| storage2 | StorageV2（一般用途 v2） | 檔案、資料表 |\n| storage3 | StorageV2（一般用途 v2） | 佇列 |\n| storage4 | BlobStorage | Blob |\n你打算用 Azure Import/Export 服務把資料從 Subscription1 匯出。你需要判斷哪個儲存體帳戶可以用來匯出資料。⟦你應該辨識出哪一個？⟧",
 o:["storage1","storage2","storage3","storage4"],
 a:[3],
 e:"Import/Export 服務的「匯出（Export）」功能只支援 Blob 儲存體這個服務項目，storage1（檔案）、storage2（檔案/資料表）、storage3（佇列）帳戶裡都沒有 Blob 資料可以匯出；只有 storage4（BlobStorage 帳戶類型，內含 Blob 資料）符合。",
 en:{q:"You need to identify which storage account can be used to export the data. What should you identify?",
  o:["storage1","storage2","storage3","storage4"],
  e:"Export only supports Blob storage; only storage4 (BlobStorage account containing Blob data) qualifies."}},

{n:421, code:"AZ104-Q421", d:1, od:1, t:"邀請外部合作夥伴", tEn:"Inviting an external partner", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q23 是同一組情境的重複題。\n你有一個 Azure AD 租用戶 contoso.onmicrosoft.com，使用者管理員角色指派給了 Admin1。一位外部合作夥伴用 Microsoft 帳戶 user1@outlook.com。Admin1 嘗試邀請這位外部合作夥伴登入，收到「Generic authorization exception」的錯誤訊息。⟦你需要確保 Admin1 可以邀請這位外部合作夥伴，應該怎麼做？⟧",
 o:["在「使用者」設定刀鋒選單修改「外部共同作業設定」","在「自訂網域名稱」刀鋒選單新增一個自訂網域","在「組織關聯性」刀鋒選單新增一個身分識別提供者","在「角色與系統管理員」刀鋒選單把「安全性系統管理員」角色指派給 Admin1"],
 a:[0],
 e:"這個錯誤通常是租用戶的「外部共同作業設定」限制了可以發出邀請的人員範圍，導致 Admin1 無法邀請來賓，要調整這項設定放寬邀請權限。",
 en:{q:"What should you do?",
  o:["From the Users settings blade, modify the External collaboration settings.","From the Custom domain names blade, add a custom domain.","From the Organizational relationships blade, add an identity provider.","From the Roles and administrators blade, assign the Security administrator role to Admin1."],
  e:"The tenant's External collaboration settings control who can invite B2B guests."}},

{n:422, code:"AZ104-Q422", d:3, od:4, t:"用服務標籤放行對 Key Vault 的流量", tEn:"Using a service tag to allow traffic to Key Vault", k:"mc",
 src:"quiz12:html",
 q:"你有一個 Azure 訂用帳戶，內含 10 台虛擬機器、一個金鑰保存庫 Vault1、一個網路安全性群組 NSG1，全部資源都部署在 East US 地區。這些虛擬機器由 NSG1 保護，NSG1 設定成封鎖所有對外的網際網路流量。你需要確保這些虛擬機器可以存取 Vault1，⟦解決方案必須採用最小權限原則、並把管理成本降到最低⟧。你應該把 NSG1 輸出安全性規則的目的地設定成什麼？",
 o:["一個應用程式安全性群組","一個服務標籤 (service tag)","一個 IP 位址範圍"],
 a:[1],
 e:"服務標籤代表一組由微軟自動維護的 IP 位址集合（這裡對應 AzureKeyVault 這個服務標籤），設定成目的地後，NSG 規則就能精準只放行到 Key Vault 服務的流量，而且微軟更新底層 IP 時規則會自動跟著更新，不需要手動維護，同時符合最小權限與最省管理成本兩項要求。應用程式安全性群組是用來分組「你自己的資源（VM）」，不是用來代表外部 Azure 服務的目的地；手動填 IP 位址範圍能做到類似效果，但 Key Vault 服務背後的 IP 會變動，用固定 IP 範圍需要持續手動維護，管理成本更高。",
 en:{q:"What should you configure as the destination of the outbound security rule for NSG1?",
  o:["an application security group","a service tag","an IP address range"],
  e:"A service tag (AzureKeyVault) represents Microsoft-maintained IP ranges that auto-update, minimizing admin effort while staying least-privilege."}},

{n:423, code:"AZ104-Q423", d:3, od:4, t:"啟用流量分析所需角色", tEn:"Role required to enable Traffic Analytics", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q25~Q27、Q209 是同一組情境的重複解法題。\n你需要確保 Admin1 被指派了啟用訂用帳戶「流量分析」功能所需的角色。\n⟦解法：在訂用帳戶層級，把「網路參與者」角色指派給 Admin1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。啟用流量分析要求在訂用帳戶範圍具備「擁有者、參與者、讀取者、網路參與者」其中一種角色，網路參與者符合條件。",
 en:{q:"Solution: You assign the Network Contributor role at the subscription level to Admin1. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Network Contributor is one of the four qualifying roles."}},

{n:424, code:"AZ104-Q424", d:3, od:4, t:"啟用流量分析所需角色", tEn:"Role required to enable Traffic Analytics", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q25~Q27、Q209、Q423 情境完全相同，只是提出的解法不同。\n（情境同 Q423。）⟦解法：在訂用帳戶層級，把「擁有者」角色指派給 Admin1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。擁有者本來就包含在「擁有者、參與者、讀取者、網路參與者」這四個可以啟用流量分析的角色之中。",
