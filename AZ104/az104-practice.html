  o:["Yes","No"],
  e:"Yes. Owner is one of the four qualifying roles."}},

{n:425, code:"AZ104-Q425", d:1, od:1, t:"批次邀請沒有這個入口網站操作", tEn:"There's no \"bulk invite\" portal operation", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q381~Q383 是同一組情境的重複解法題。\n你需要替 CSV 檔裡的 500 位外部使用者，各自在 contoso.com 建立一個來賓使用者帳戶。\n⟦解法：在 Azure 入口網站的 Azure AD 裡，使用「大量邀請使用者 (Bulk invite users)」操作。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。Azure 入口網站的大量操作是「大量建立使用者 (Bulk create user)」，建立的是一般成員帳戶，不是邀請外部使用者的來賓帳戶；要邀請外部使用者，正確做法是用 New-AzureADMSInvitation 指令程式（可寫成指令碼批次執行）。",
 en:{q:"Solution: From Azure AD in the Azure portal, you use the Bulk invite users operation. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. The portal's bulk operation creates regular member accounts, not guest invitations; use New-AzureADMSInvitation instead."}},

{n:426, code:"AZ104-Q426", d:1, od:1, t:"最小權限部署 VM 與網路", tEn:"Least-privilege VM & network management", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q28 是同一組情境的重複題。\n你需要確保 User1 可以部署虛擬機器、也可以管理虛擬網路，⟦解決方案必須採用最小權限原則⟧。你應該指派哪一個 RBAC 角色給 User1？",
 o:["擁有者","虛擬機器參與者","參與者","虛擬機器系統管理員登入"],
 a:[2],
 e:"「虛擬機器參與者」管不到虛擬網路；「虛擬機器系統管理員登入」只是登入既有 VM 的權限。同時要能部署 VM 又管理虛擬網路，符合的只有「參與者」，且它不能指派角色給別人，比擁有者更貼近最小權限。",
 en:{q:"Which role-based access control (RBAC) role should you assign to User1?",
  o:["Owner","Virtual Machine Contributor","Contributor","Virtual Machine Administrator Login"],
  e:"Contributor manages both VMs and virtual networks but, unlike Owner, cannot assign roles."}},

{n:427, code:"AZ104-Q427", d:2, od:3, t:"用 Azure AD 憑證部署 Web App 內容", tEn:"Deploying web app content with Azure AD credentials", k:"mc",
 src:"quiz12:html",
 q:"你有一個 Azure App Service Web 應用程式 App1，打算用 Web Deploy 部署。你需要確保 App1 的開發人員可以用自己的 Azure AD 憑證部署內容到 App1，⟦解決方案必須採用最小權限原則⟧。你應該怎麼做？",
 o:["把「擁有者」角色指派給開發人員","替 FTPS 設定應用程式層級的憑證","把「網站參與者 (Website Contributor)」角色指派給開發人員","替 FTPS 設定使用者層級的憑證"],
 a:[2],
 e:"要用 Azure AD 身分（而不是另外的部署密碼）部署內容，開發人員要被指派具備部署權限的 Azure RBAC 角色，「網站參與者」角色範圍剛好涵蓋部署網站內容所需的權限，又不像擁有者那樣權限過大。FTPS 的應用程式層級或使用者層級憑證是「部署密碼」這條路線，跟「用 Azure AD 憑證部署」的需求方向不同，且這些部署密碼本來就跟 Azure 訂用帳戶憑證是分開的兩套。",
 en:{q:"What should you do?",
  o:["Assign the Owner role to the developers","Configure app-level credentials for FTPS","Assign the Website Contributor role to the developers","Configure user-level credentials for FTPS"],
  e:"Website Contributor grants exactly the RBAC permissions needed to deploy via Azure AD identity, without Owner's excess privilege."}},

{n:428, code:"AZ104-Q428", d:1, od:1, t:"啟用受控識別", tEn:"Enabling a managed identity", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q29 是同一組情境的重複題。\n你有一台虛擬機器 VM1，位於資源群組 RG1，VM1 上執行的服務將用來部署資源到 RG1。你需要確保 VM1 上執行的服務可以用 VM1 自己的身分管理 RG1 裡的資源。⟦你應該最先做什麼？⟧",
 o:["在 Azure 入口網站修改 VM1 的「受控識別」設定","在 Azure 入口網站修改 RG1 的「存取控制 (IAM)」設定","在 Azure 入口網站修改 VM1 的「存取控制 (IAM)」設定","在 Azure 入口網站修改 RG1 的「原則」設定"],
 a:[0],
 e:"要讓 VM 上的服務「用 VM 自己的身分」驗證，第一步一定是先在 VM1 啟用受控識別，這樣 Azure AD 才會替 VM1 建立一個身分，之後才輪到在 RG1 的 IAM 把角色指派給這個身分。",
 en:{q:"What should you do first?",
  o:["From the Azure portal, modify the Managed Identity settings of VM1","From the Azure portal, modify the Access control (IAM) settings of RG1","From the Azure portal, modify the Access control (IAM) settings of VM1","From the Azure portal, modify the Policies settings of RG1"],
  e:"A managed identity must be enabled on VM1 first, before it can be granted any role on RG1's IAM."}},

{n:429, code:"AZ104-Q429", d:3, od:5, t:"Log Analytics 查詢語法", tEn:"Log Analytics query syntax", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q19、Q32、Q413、Q433 是同一組情境的重複題，只是選項組合不同。\n你需要從一個名為 Event 的資料表查出錯誤事件。⟦你應該執行哪個查詢？⟧",
 o:["select * from Event where EventType == \"error\"","Event | search \"error\"","Event | where EventType is \"error\"","Get-Event Event | where {$_.EventType == \"error\"}"],
 a:[1],
 e:"search 運算子可以寫成「資料表 | search \"關鍵字\"」，Event | search \"error\" 是合法的 KQL。where 運算子要用 == 不是 is；select * from、Get-Event 都不是 KQL 語法。",
 en:{q:"Which query should you run in Workspace1?",
  o:["select * from Event where EventType == \"error\"","Event | search \"error\"","Event | where EventType is \"error\"","Get-Event Event | where {$_.EventType == \"error\"}"],
  e:"`Table | search \"term\"` is valid KQL; the other options use incorrect syntax."}},

{n:430, code:"AZ104-Q430", d:3, od:4, t:"委派 DNS 子網域", tEn:"Delegating a DNS subdomain", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q31 是同一組情境的重複題。\n你有一個 Azure DNS 區域 adatum.com，需要把子網域 research.adatum.com 委派給 Azure 裡另一台不同的 DNS 伺服器。⟦你應該怎麼做？⟧",
 o:["在 adatum.com 區域建立一筆名稱為 research 的 NS 記錄","在 adatum.com 區域建立一筆名稱為 research 的 PTR 記錄","修改 adatum.com 的 SOA 記錄","在 adatum.com 區域建立一筆名稱為 *.research 的 A 記錄"],
 a:[0],
 e:"要委派子網域，標準做法是在父網域區域裡建立一筆該子網域名稱的 NS 記錄，指向負責該子網域的名稱伺服器清單。",
 en:{q:"What should you do?",
  o:["Create an NS record named research in the adatum.com zone.","Create a PTR record named research in the adatum.com zone.","Modify the SOA record of adatum.com.","Create an A record named *.research in the adatum.com zone."],
  e:"Delegating a subdomain requires an NS record in the parent zone."}},

{n:431, code:"AZ104-Q431", d:1, od:1, t:"擴大自訂角色的可指派範圍", tEn:"Expanding a custom role's assignable scope", k:"mc",
 src:"quiz12:html",
 q:"你有兩個 Azure 訂用帳戶 Sub1、Sub2。一位系統管理員建立了一個自訂角色，可指派範圍 (assignable scope) 設定成 Sub1 裡的資源群組 RG1。你需要確保這個自訂角色可以套用到 Sub1 與 Sub2 裡的任何資源群組，⟦解決方案必須把管理成本降到最低⟧。你應該怎麼做？",
 o:["選取這個自訂角色，把 Sub1 與 Sub2 加進可指派範圍，並把 RG1 從可指派範圍移除","替 Sub1 建立一個新的自訂角色，替 Sub2 建立一個新的自訂角色，把角色從 RG1 移除","替 Sub1 建立一個新的自訂角色，並把 Sub2 加進可指派範圍，把角色從 RG1 移除","選取這個自訂角色，把 Sub1 加進可指派範圍，把 RG1 從可指派範圍移除，再替 Sub2 建立一個新的自訂角色"],
 a:[0],
 e:"自訂角色的可指派範圍可以直接編輯，不需要為每個訂用帳戶各自重建一個角色——直接修改既有這個自訂角色的可指派範圍，加入 Sub1 與 Sub2（兩個完整的訂用帳戶範圍，涵蓋底下所有資源群組），並移除原本太窄的 RG1，就能達成「套用到 Sub1、Sub2 裡任何資源群組」的需求，而且是修改既有角色，管理成本最低。重新建立多個角色，或混用「改範圍」跟「建新角色」，都比直接編輯範圍更費工。",
 en:{q:"What should you do?",
  o:["Select the custom role and add Sub1 and Sub2 to the assignable scopes. Remove RG1 from the assignable scopes.","Create a new custom role for Sub1. Create a new custom role for Sub2. Remove the role from RG1.","Create a new custom role for Sub1 and add Sub2 to the assignable scopes. Remove the role from RG1.","Select the custom role and add Sub1 to the assignable scopes. Remove RG1 from the assignable scopes. Create a new custom role for Sub2."],
  e:"Editing the existing custom role's assignable scopes to include both subscriptions (removing the narrower RG1 scope) is the lowest-effort path."}},

{n:432, code:"AZ104-Q432", d:1, od:1, t:"跨租用戶建立使用者", tEn:"Creating users across AAD tenants", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q1~Q3、Q168 是同一組情境的重複解法題，這裡表格資訊完整保留。\n你的 Azure AD 租用戶 contoso.onmicrosoft.com 裡有下表的使用者：\n| 使用者 | 角色 | 範圍 |\n|---|---|---|\n| User1 | 全域系統管理員 | Azure AD |\n| User2 | 全域系統管理員 | Azure AD |\n| User3 | 使用者系統管理員 | Azure AD |\n| User4 | 擁有者 | Azure 訂用帳戶 |\nUser1 建立了一個新的 Azure AD 租用戶 external.contoso.onmicrosoft.com。你需要在這個新租用戶中建立使用者帳戶。\n⟦解法：指示 User3 去建立這些使用者帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。User3 是「原本」租用戶的使用者系統管理員，管理範圍只限原本這個租用戶，對全新獨立的 external.contoso.onmicrosoft.com 租用戶沒有任何權限。",
 en:{q:"Solution: You instruct User3 to create the user accounts. Does that meet the goal?",
  o:["Yes","No"],
  e:"No. User3's User administrator role is scoped to the original tenant only, with no authority in the brand-new tenant."}},

{n:433, code:"AZ104-Q433", d:3, od:5, t:"Log Analytics 查詢語法", tEn:"Log Analytics query syntax", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q19、Q32、Q413、Q429 是同一組情境的重複題，只是選項組合不同。\n你需要從一個名為 Event 的資料表查出錯誤事件。⟦你應該執行哪個查詢？⟧",
 o:["Get-Event Event | where {$_.EventType == \"error\"}","Event | search \"error\"","select * from Event where EventType == \"error\"","search in (Event) * | where EventType -eq \"error\""],
 a:[1],
 e:"search 運算子提供跨資料表/欄位的搜尋能力，語法「資料表 | search \"關鍵字\"」是合法 KQL。",
 en:{q:"Which query should you run in Workspace1?",
  o:["Get-Event Event | where {$_.EventType == \"error\"}","Event | search \"error\"","select * from Event where EventType == \"error\"","search in (Event) * | where EventType -eq \"error\""],
  e:"`Event | search \"error\"` is valid KQL search syntax."}},

{n:434, code:"AZ104-Q434", d:1, od:1, t:"跨租用戶建立使用者", tEn:"Creating users across AAD tenants", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q1~Q3、Q168、Q432 情境完全相同，只是提出的解法不同。\n（情境同 Q432。）⟦解法：指示 User4 去建立這些使用者帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。User4 只是原本訂用帳戶的擁有者，這是 Azure RBAC 角色，跟 Azure AD 的身分管理權限完全是兩回事，在任何租用戶都不能建立使用者。",
 en:{q:"Solution: You instruct User4 to create the user accounts. Does that meet the goal?",
  o:["Yes","No"],
  e:"No. User4 is merely a subscription Owner (RBAC), which grants no Azure AD identity-management rights."}},

{n:435, code:"AZ104-Q435", d:3, od:4, t:"公用 DNS 區域委派", tEn:"Public DNS zone delegation", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q33 是同一組情境的重複題。\n你有一個已註冊的 DNS 網域 contoso.com，也在 Azure 建立了一個同名的公用 DNS 區域。你需要確保這個區域裡建立的記錄可以從網際網路解析得到。⟦你應該怎麼做？⟧",
 o:["在 contoso.com 建立 NS 記錄","在 DNS 網域註冊業者修改 SOA 記錄","在 contoso.com 建立 SOA 記錄","在 DNS 網域註冊業者修改 NS 記錄"],
 a:[3],
 e:"必須回到網域註冊業者，把該網域的 NS 記錄改成指向 Azure DNS 區域配發的名稱伺服器，網際網路上的查詢才會被正確委派到 Azure DNS。",
 en:{q:"What should you do?",
  o:["Create NS records in contoso.com.","Modify the SOA record in the DNS domain registrar.","Create the SOA record in contoso.com.","Modify the NS records in the DNS domain registrar."],
  e:"The registrar's NS records must point to the Azure DNS zone's name servers."}},

{n:436, code:"AZ104-Q436", d:1, od:1, t:"跨多個訂用帳戶管理角色指派", tEn:"Managing role assignments across many subscriptions", k:"mc",
 src:"quiz12:html",
 q:"你有 15 個 Azure 訂用帳戶，以及一個含安全性群組 Group1 的 Azure AD 租用戶。你打算再購買更多訂用帳戶。你需要確保 Group1 可以管理現有以及未來新購買的訂用帳戶的角色指派，⟦解決方案必須採用最小權限原則，並把管理成本降到最低⟧。你應該怎麼做？",
 o:["把根管理群組的「擁有者」角色指派給 Group1","把根管理群組的「使用者存取系統管理員」角色指派給 Group1","建立一個新的管理群組，把「使用者存取系統管理員」角色指派給 Group1","建立一個新的管理群組，把「擁有者」角色指派給 Group1"],
 a:[1],
 e:"每個租用戶都有一個內建的「根 (Root)」管理群組，所有管理群組與訂用帳戶最終都會歸到它底下，在根管理群組層級指派角色，可以自動涵蓋現有「以及未來新建立」的所有訂用帳戶，不用每買一個新訂用帳戶就手動再指派一次，管理成本最低。「使用者存取系統管理員」角色專門用來授予別人存取權（管理角色指派），符合「管理角色指派」這個具體需求，比「擁有者」（權限過大，還能管理資源本身）更貼近最小權限。另外建立新的管理群組，反而涵蓋不到「既有」的 15 個訂用帳戶（除非額外把它們都搬進新群組，更費工）。",
 en:{q:"What should you do?",
  o:["Assign Group1 the Owner role for the root management group.","Assign Group1 the User Access Administrator role for the root management group.","Create a new management group and assign Group1 the User Access Administrator role for the group.","Create a new management group and assign Group1 the Owner role for the group."],
  e:"The root management group automatically covers all current and future subscriptions; User Access Administrator (not Owner) is the least-privilege fit for managing role assignments."}},

{n:437, code:"AZ104-Q437", d:2, od:2, t:"用 Azure AD 身分存取檔案共用前要先啟用 AD DS 驗證", tEn:"Enabling AD DS auth before Azure AD identity access to file shares", k:"mc",
 src:"quiz12:html",
 q:"你有一個 Azure 儲存體帳戶 storage1，內含一個檔案共用 share1。這個訂用帳戶連結到一個混合式 Azure AD 租用戶，裡面有一個安全性群組 Group1。你需要把「儲存體檔案資料 SMB 共用進階參與者」角色授予 Group1。⟦你應該最先做什麼？⟧",
 o:["替 storage1 啟用 Active Directory Domain Service (AD DS) 驗證","用檔案總管設定共用層級的權限","用檔案總管掛接 share1","建立一個私人端點"],
 a:[0],
 e:"要讓 Azure 檔案共用支援用 Azure AD 身分（含混合式環境裡同步自內部部署 AD 的身分）做 SMB 驗證，必須先完成前置設定，其中一項就是替儲存體帳戶啟用 Active Directory Domain Service (AD DS) 驗證（混合式環境常見做法是啟用「AD DS 對 Azure 檔案的驗證」），完成後才能繼續用 Azure RBAC 把資料層級角色（例如 SMB 共用進階參與者）指派給 Azure AD 的身分主體。共用層級權限、掛接共用、建立私人端點都是後續或替代的操作，不是啟用 Azure AD 身分驗證的先決條件。",
 en:{q:"What should you do first?",
  o:["Enable Active Directory Domain Service (AD DS) authentication for storage1.","Grant share-level permissions by using File Explorer.","Mount share1 by using File Explorer.","Create a private endpoint."],
  e:"AD DS authentication for Azure Files must be enabled first before assigning data-plane RBAC roles to Azure AD identities."}},

{n:438, code:"AZ104-Q438", d:1, od:1, t:"委派 Reader 角色指派權", tEn:"Delegating Reader role assignment", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q14、Q404 是同一組情境的重複題，只是選項組合不同。\n（情境同 Q404：User1 要能把 VNet1 的讀取者角色指派給其他使用者。）⟦你應該怎麼做？⟧",
 o:["把 User1 從 Subscription1 的安全性讀取者角色移除，並替 User1 指派 RG1 的參與者角色","替 User1 指派 VNet1 的「擁有者」角色","替 User1 指派 VNet1 的「參與者」角色","替 User1 指派 VNet1 的「網路參與者」角色"],
 a:[1],
 e:"要指派角色給別人，一定要有 Microsoft.Authorization/roleAssignments/write 權限。這個選項組合裡沒有「使用者存取系統管理員」可選，但「擁有者」角色同樣具備這項權限（擁有者＝完整存取權限＋能委派存取權給別人），設在 VNet1 這個範圍符合需求，是這一版選項裡唯一符合的答案（另一版選項的正解是「使用者存取系統管理員」，見 Q404，兩者都是官方認可的正解，差別只在於各版選項裡有沒有列出「使用者存取系統管理員」這個更精準、權限更小的選項）。",
 en:{q:"What should you do?",
  o:["Remove User1 from the Security Reader role for Subscription1. Assign User1 the Contributor role for RG1.","Assign User1 the Owner role for VNet1.","Assign User1 the Contributor role for VNet1.","Assign User1 the Network Contributor role for VNet1."],
  e:"Owner has full access including the right to delegate access to others; among this option set (which lacks User Access Administrator), it's the correct fit — the other accepted answer, seen in Q404's option set, is User Access Administrator."}},

{n:439, code:"AZ104-Q439", d:1, od:1, t:"依辦公室分權管理使用者", tEn:"Delegating user management per office", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q210 是同一組情境的重複題。\n你有三個辦公室與一個 Azure AD 租用戶，你需要把「使用者管理」權限分別授予各辦公室的地方系統管理員。⟦你應該使用什麼？⟧",
 o:["Azure AD 角色","系統管理單位 (administrative units)","Azure AD 授權管理裡的存取套件","Azure 角色"],
 a:[1],
 e:"系統管理單位可以把一部分使用者、群組畫成管理範圍，再把角色指派在這個範圍內，符合「各辦公室各自有自己的地方系統管理員」這種分權需求。",
 en:{q:"What should you use?",
  o:["Azure AD roles","administrative units","access packages in Azure AD entitlement management","Azure roles"],
  e:"Administrative units scope role assignments to a defined subset of users/groups, matching per-office delegation."}},

{n:440, code:"AZ104-Q440", d:1, od:1, t:"批次刪除使用者要準備的欄位", tEn:"Fields required for bulk-deleting users", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q208 是同一組情境的重複題。\n你打算在 Azure AD 系統管理中心用「大量刪除」刪除多個使用者，需要建立並上傳一個大量刪除用的檔案。⟦這個檔案裡應該包含哪些使用者屬性？⟧",
 o:["僅每位使用者的使用者主要名稱與使用地點","僅每位使用者的使用者主要名稱","僅每位使用者的顯示名稱","僅每位使用者的顯示名稱與使用地點","每位使用者的顯示名稱與使用者主要名稱"],
 a:[1],
 e:"大量刪除用的 CSV 範本只要求「使用者主要名稱」這一欄，就足以唯一識別要刪除的使用者。",
 en:{q:"Which user attributes should you include in the file?",
  o:["The user principal name and usage location of each user only","The user principal name of each user only","The display name of each user only","The display name and usage location of each user only","The display name and user principal name of each user only"],
  e:"Only the user principal name is required to uniquely identify each user."}},

{n:441, code:"AZ104-Q441", d:3, od:4, t:"啟用流量分析所需角色", tEn:"Role required to enable Traffic Analytics", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q209 是同一組情境的重複題。\n你需要確保 Admin1 被指派了啟用訂用帳戶「流量分析」功能所需的角色。\n⟦解法：在訂用帳戶層級，把「Traffic Manager 參與者」角色指派給 Admin1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。啟用流量分析要求「擁有者、參與者、讀取者、網路參與者」其中一種角色，「Traffic Manager 參與者」不在其中。",
 en:{q:"Solution: You assign the Traffic Manager Contributor role at the subscription level to Admin1. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Traffic Manager Contributor isn't one of the four qualifying roles."}},

{n:442, code:"AZ104-Q442", d:2, od:2, t:"Import/Export 匯出支援的資料", tEn:"Data exportable via Import/Export", k:"mc",
 src:"quiz12:html",
 q:"注意：本題與 AZ104-Q41 是同一組情境的重複題。\n你的資料分別存放在下表所示的位置：\n| 名稱 | 類型 |\n|---|---|\n| container1 | Blob 容器 |\n| share1 | Azure 檔案共用 |\n| DB1 | SQL 資料庫 |\n| Table1 | Azure 資料表 |\n你打算用一個名為 Export1 的 Import/Export 匯出工作。⟦你應該辨識出哪一項資料可以用 Export1 匯出？⟧",
 o:["DB1","container1","share1","Table1"],
 a:[1],
 e:"Import/Export 服務的「匯出」功能只支援 Blob 儲存體，只有 container1（Blob 容器）符合。",
 en:{q:"Which data should you identify?",
  o:["DB1","container1","share1","Table1"],
  e:"Export only supports Blob storage; container1 is the only Blob container listed."}},


{n:363, code:"AZ104-Q363", d:2, od:3, t:"用 DSC 建立設定基準", tEn:"Using DSC to establish a configuration baseline", k:"mc",
 src:"quiz11:html",
 q:"你的技術長想替 Azure 虛擬機器基礎架構，建立一套適用於環境中所有資源的基準高品質標準來管理。⟦可以用哪個工具來實作這個需求？⟧",
 o:["VM 存取擴充功能 (VM Access extension)","Azure VM 代理程式擴充功能","PowerShell DSC","Bitlocker"],
 a:[2],
 e:"「設定管理 (Configuration Management)」正是在做「替環境裡所有資源建立基準品質標準」這件事，PowerShell Desired State Configuration (DSC) 就是入口網站裡其中一種設定管理工具，用宣告式的方式描述期望狀態（多半以 MOF 這類產業標準格式呈現），並持續確保資源維持在這個狀態。VM 存取擴充功能是用來重設 VM 帳密/RDP 存取用的；VM 代理程式擴充功能只是代理程式本身，不是設定管理工具；Bitlocker 是磁碟加密功能，跟建立品質標準無關。",
 en:{q:"What tool can be used to implement this request?",
  o:["VM Access extension","Azure VM agent extension","PowerShell DSC","Bitlocker"],
  e:"PowerShell DSC is a configuration management tool for declaring and enforcing a baseline desired state across resources."}},

{n:364, code:"AZ104-Q364", d:3, od:4, t:"SQL AlwaysOn 監聽器用的健康探測", tEn:"Health probe for a SQL AlwaysOn listener", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q198~Q200、Q366、Q367 是同一組情境的重複解法題。\n公司在 Azure 虛擬機器上設定了 SQL Server Always On 可用性群組，你需要設定一個 Azure 內部負載平衡器作為接聽程式 (listener)。\n⟦解法：建立一個 HTTP 健康探測，通訊埠設為 1433。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。健康探測要用「TCP」通訊協定去偵測指定的埠／協定是否有正常回應，SQL Server 不會回應 HTTP 請求，用 HTTP 探測永遠會判定不健康。",
 en:{q:"Solution: You create an HTTP health probe on port 1433. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Health probes check whether the specified port/protocol responds; SQL Server doesn't respond to HTTP."}},

{n:365, code:"AZ104-Q365", d:3, od:4, t:"監控 ExpressRoute 連線健康狀態", tEn:"Monitoring ExpressRoute connection health", k:"mc",
 src:"quiz11:html",
 q:"你正在把既有應用程式從內部部署伺服器搬到 Azure 虛擬網路上的資源，內部部署網路與 Azure 目前透過 ExpressRoute 連線。\n你需要確保這條 ExpressRoute 連線隨時保持健康。⟦你可以用哪個 Network Watcher 服務來監控這條連線？⟧",
 o:["連線監視器（前身為 Network Performance Monitor）","流量分析 (Traffic Analytics)","VPN 疑難排解","連線監視器（傳統版）"],
 a:[0],
 e:"新版的連線監視器（前身是 Network Performance Monitor 服務）是一套雲端混合式網路監控方案，能監控網路基礎架構裡多個節點之間的效能、服務與應用程式端點的連線，以及 Azure ExpressRoute 的效能，正符合這裡的需求。要注意 Azure 還有一個舊版、同樣叫「連線監視器」的服務，但現在已經改名為「連線監視器（傳統版）」，功能較舊，不是這裡要選的。",
 en:{q:"What Network Watcher service can you utilize to monitor the connection?",
  o:["Connection Monitor (formerly Network Performance Monitor)","Traffic Analytics","VPN Troubleshoot","Connection Monitor (Classic)"],
  e:"The (new) Connection Monitor monitors network performance including ExpressRoute; the legacy service of the same name has been renamed Connection Monitor Classic."}},

{n:366, code:"AZ104-Q366", d:3, od:4, t:"SQL AlwaysOn 監聽器用的健康探測", tEn:"Health probe for a SQL AlwaysOn listener", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q198~Q200、Q364、Q367 情境完全相同，只是提出的解法不同。\n（情境同 Q364。）⟦解法：把「工作階段持續性 (Session persistence)」設為「用戶端 IP」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。工作階段持續性解決的是黏性工作階段需求，跟 AlwaysOn 監聽器需要的「正確判斷主要複本」完全是兩回事。",
 en:{q:"Solution: You set Session persistence to Client IP. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Session persistence addresses sticky sessions, unrelated to correctly identifying the primary replica."}},

{n:367, code:"AZ104-Q367", d:3, od:4, t:"SQL AlwaysOn 監聽器用的健康探測", tEn:"Health probe for a SQL AlwaysOn listener", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q198~Q200、Q364、Q366 情境完全相同，只是提出的解法不同。\n（情境同 Q364。）⟦解法：啟用浮動 IP (Floating IP)。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。每個可用性群組各自用一個獨立的接聽程式與獨立的 IP，同一個負載平衡器可以承載多個接聽程式的 IP；後端集區只加入 VM 的主要 IP（次要 IP 不支援浮動 IP），並且要啟用浮動 IP，監聽器才能正確把流量路由到目前的主要複本。",
 en:{q:"Solution: You enable Floating IP. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. Floating IP is required for the listener to correctly route to the current primary replica."}},

{n:368, code:"AZ104-Q368", d:2, od:3, t:"可用性設定組的正確分層設計", tEn:"Correct tiering design for Availability Sets", k:"mc",
 src:"quiz11:html",
 q:"一家公司打算部署一組 Web 伺服器與資料庫伺服器，想透過可用性設定組達到高可用性。⟦以下哪一種是建議的設計做法？⟧",
 o:["把 Web 伺服器與資料庫伺服器放進同一個可用性設定組","一半的 Web 伺服器與一半的資料庫伺服器放進一個可用性設定組，另一半放進另一個","把所有 Web 伺服器放進一個可用性設定組，資料庫伺服器放進另一個","每台 Web 伺服器與資料庫伺服器都各自有自己的可用性設定組"],
 a:[2],
 e:"可用性設定組的設計原則是「同一種用途（角色）的伺服器放在同一組」，也就是應用程式伺服器、Web 伺服器各自有自己的可用性設定組，確保應用程式的每一層在任何時間點都至少有一台執行個體在運作。把不同角色混在同一組、或拆成一半一半，都沒辦法確保「每一層」各自維持可用；每台都各自一個設定組則失去了設定組讓「同一層」互相備援的意義。",
 en:{q:"Which of the following is the recommended design practice to use?",
  o:["Place the web servers and database servers in the same availability set.","Place half of the web servers and half of the database servers in one availability set, and the other half in another availability set.","Place all the web servers in one availability set and the database servers in another availability set.","Have an availability set for each web server and database server."],
  e:"Best practice groups servers of the same role/tier into their own Availability Set, ensuring each application tier always has an instance running."}},

{n:369, code:"AZ104-Q369", d:3, od:5, t:"設定固定內部 IP", tEn:"Configuring a static internal IP", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q201 是同一組情境的重複題。\n你公司有兩台內部部署伺服器 SRV01、SRV02，一個跑在 SRV01 上的應用程式會用 IP 位址直接呼叫 SRV02 上的一個服務。你打算把它搬到同一子網路裡的兩台 Azure 虛擬機器上。你需要把這兩台虛擬機器設定成固定的內部 IP 位址。⟦你應該怎麼做？⟧",
 o:["執行 New-AzureRMVMConfig PowerShell 指令程式","執行 Set-AzureSubnet PowerShell 指令程式","在 Azure 管理入口網站修改虛擬機器屬性","在 Windows「網路和共用中心」修改 IP 內容","執行 Set-AzureStaticVNetIP PowerShell 指令程式"],
 a:[4],
 e:"Set-AzureStaticVNetIP 指令程式專門用來替既有虛擬機器指定固定內部 IP，搭配 Update-AzureVM 套用（過程會重新啟動 VM）。在作業系統內部手動改 IP，不會被 Azure 平台的配置機制承認。",
 en:{q:"What should you do?",
  o:["Run the New-AzureRMVMConfig PowerShell cmdlet.","Run the Set-AzureSubnet PowerShell cmdlet.","Modify the VM properties in the Azure Management Portal.","Modify the IP properties in Windows Network and Sharing Center.","Run the Set-AzureStaticVNetIP PowerShell cmdlet."],
  e:"Set-AzureStaticVNetIP assigns a static internal IP to an existing VM; OS-level changes aren't recognized by the platform."}},

{n:370, code:"AZ104-Q370", d:3, od:4, t:"不經過公網的大量資料傳輸", tEn:"High-volume data transfer avoiding the public internet", k:"mc",
 src:"quiz11:html",
 q:"一家公司需要把內部部署資料中心連到 Azure，有大量工作負載要定期在兩邊之間傳輸資料，出於安全考量不想讓資料經過公用網際網路。⟦這家公司應該選擇哪種連線方式？⟧",
 o:["建立站對站 (Site-to-Site) 連線","建立點對站 (Point-to-Site) 連線","建立 ExpressRoute 連線","建立 VNet 對 VNet 連線"],
 a:[2],
 e:"ExpressRoute 連線的行為就像內部部署資料中心與 Azure 之間的一條專用連線，走的是私有連線（透過連線業者），不經過公用網際網路。站對站與點對站連線都要經過網際網路（走 IPsec 通道加密，但實體路徑仍是公網），不適合安全考量優先、且資料量龐大的情境。",
 en:{q:"Which of the following connections should the company opt for to establish this connection?",
  o:["Create a Site-to-Site connection","Create a Point-to-Site connection","Create an ExpressRoute connection","Create a VNet-to-VNet connection"],
  e:"ExpressRoute is a dedicated private connection that doesn't traverse the public internet, unlike S2S/P2S connections."}},

{n:371, code:"AZ104-Q371", d:1, od:1, t:"最少需要幾張網路介面卡", tEn:"Minimum number of NICs needed", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q202 是同一組情境的重複題。\n你需要在公司的虛擬網路子網路裡部署五台虛擬機器，每台都要同時有公用與私人 IP 位址，五台的輸入／輸出安全性規則必須完全相同。⟦這個設定最少需要幾張網路介面卡？⟧",
 o:["5","10","20","40"],
 a:[0],
 e:"每台虛擬機器只需要一張網路介面卡就能同時掛公用與私人 IP，並套用 NSG 規則，五台最少五張就夠。",
 en:{q:"Which of the following is the least amount of network interfaces needed for this configuration?",
  o:["5","10","20","40"],
  e:"One NIC per VM suffices for both IP types plus NSG rules; five VMs need only five NICs."}},

{n:372, code:"AZ104-Q372", d:2, od:3, t:"容錯網域的循環分配", tEn:"Round-robin fault domain assignment", k:"mc",
 src:"quiz11:html",
 q:"你正在建立 10 台虛擬機器，打算放進一個可用性設定組以達到高可用性。你把容錯網域數設定成目標地區支援的最大值，也就是 3。⟦最後會有幾台虛擬機器落在第一個容錯網域？⟧",
 o:["4","3","5","10"],
 a:[0],
 e:"容錯網域是用循環（round-robin）的方式依序分配給每一台新建立的虛擬機器：第 1 台進第 1 個容錯網域、第 2 台進第 2 個、第 3 台進第 3 個，第 4 台又輪回第 1 個容錯網域，以此類推。10 台 VM、3 個容錯網域，分配結果是第 1、4、7、10 台落在第一個容錯網域，共 4 台。",
 en:{q:"How many of your virtual machines will end up in the first fault domain?",
  o:["4","3","5","10"],
  e:"VMs are assigned to fault domains round-robin; with 3 domains and 10 VMs, VMs 1, 4, 7, and 10 land in the first domain — 4 total."}},

{n:373, code:"AZ104-Q373", d:1, od:1, t:"最少需要幾個網路安全性群組", tEn:"Minimum number of NSGs needed", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q203 是同一組情境的重複題。\n（情境同 Q371。）⟦這個設定最少需要幾個網路安全性群組 (NSG)？⟧",
 o:["4","3","2","1"],
 a:[3],
 e:"一個 NSG 可以同時關聯多張網路介面卡；五台規則完全一樣，建立一個 NSG、同時關聯到五張網路介面卡即可。",
 en:{q:"Which of the following is the least amount of security groups needed for this configuration?",
  o:["4","3","2","1"],
  e:"One NSG can be associated with multiple NICs; since all rules are identical, one NSG suffices."}},

{n:374, code:"AZ104-Q374", d:2, od:3, t:"獨立處理程序跑背景影像處理", tEn:"Running image processing as a separate process", k:"mc",
 src:"quiz11:html",
 q:"公司有一個應用程式，讓使用者上傳圖片並套用不同濾鏡處理，目前跑在內部部署，你要替它設計 Azure 上的解決方案，⟦要求：把管理成本降到最低、支援部署晉升 (promoted deployment)、影像處理程式碼要以獨立於 Web 應用程式的處理程序執行⟧。哪個選項最適合？",
 o:["WebJobs","IaaS 虛擬機器","Azure HPC","Azure HDInsight"],
 a:[0],
 e:"WebJobs 是 Azure App Service 的一項功能，可以在跟 Web 應用程式相同的內容環境下、但以獨立處理程序的方式執行程式或指令碼，正符合「獨立處理程序」的需求；用 App Service 承載能把管理成本降到最低，而且 Web 應用程式支援部署位置（deployment slots），可以做部署晉升。IaaS VM 需要自己管理作業系統與基礎架構，管理成本較高；HPC、HDInsight 是巨量運算/資料分析用的服務，跟這裡「影像濾鏡處理＋部署晉升＋低管理成本」的需求不符。",
 en:{q:"Which option is best?",
  o:["WebJobs","laaS VMs","Azure HPC","Azure HDInsight"],
  e:"WebJobs run as a separate process within the same App Service context, minimizing management effort while supporting deployment slots for promotion."}},

{n:375, code:"AZ104-Q375", d:3, od:5, t:"即時還原只能救回原本那台 VM（來源分歧的一題）", tEn:"Instant Restore recovers only to the original VM (a known source discrepancy)", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q204 情境完全相同（同一個題目、同樣四個選項），但兩份來源標記的正確答案不同，屬於已知的來源分歧，見解析。\n公司的 Azure 訂用帳戶裡有跑 Windows Server 2016 的虛擬機器，其中一台每天都用 Azure Backup 即時還原備份。這台 VM 感染了加密勒索軟體，你決定要救回檔案。⟦以下哪一項描述是正確的？⟧",
 o:["只能把檔案救回受感染的那台 VM","可以把檔案救回訂用帳戶裡的任何一台 VM","只能把檔案救回一台新的 VM","沒辦法救回這些檔案"],
 a:[0],
 e:"本題（Quiz11 來源）標記的正確答案是「只能救回受感染的那台 VM 本身」。\n不過同樣情境在 AZ104-Q204（Quiz6 來源）標記的正確答案卻是「可以救回訂用帳戶裡任何一台 VM」，理由是即時還原掛接的磁碟快照，複製目的地理論上不限定機器。\n這是題庫本身的來源分歧（不同抄錄版本給出不同的社群票選答案）。就 Azure 實際行為而言，即時還原掛接快照後，可以從掛接出來的磁碟把檔案複製到「任何能存取這個掛接點的機器」，理論上不必侷限於受感染的那台，Q204 的說法更貼近實際操作彈性；但忠實依本卷來源標記為準，請注意這一題在不同版本的考古題裡有爭議，兩種說法並存。",
 en:{q:"Which of the following is TRUE in this scenario?",
  o:["You can only recover the files to the infected VM.","You can recover the files to any VM within the company's subscription.","You can only recover the files to a new VM.","You will not be able to recover the files."],
  e:"This source marks \"only the infected VM\" as correct. Note: the same scenario in Q204 (a different source) marks \"any VM in the subscription\" as correct instead — a known discrepancy between dump versions; in practice, Instant Restore's mounted snapshot can typically be accessed from more than just the original VM."}},

{n:376, code:"AZ104-Q376", d:3, od:4, t:"逐條規則查看 NSG 允許/拒絕的流量", tEn:"Per-rule visibility into NSG allowed/denied traffic", k:"mc",
 src:"quiz11:html",
 q:"⟦如果你想逐條規則檢視網路安全性群組允許或拒絕了哪些傳入請求的詳細資訊，應該用哪個 Network Watcher 服務？⟧",
 o:["NSG 流程記錄檔 (NSG Flow Logs)","診斷記錄檔 (Diagnostic Logs)","Network Performance Monitor","IP Flow Verify"],
 a:[0],
 e:"NSG 流程記錄檔是 Network Watcher 的功能，會記錄透過某個 NSG 的所有輸入／輸出 IP 流量資訊，包含逐條規則允許或拒絕的詳細記錄，正符合這裡的需求。診斷記錄檔是比較廣泛的平台記錄；Network Performance Monitor 監控的是延遲效能；IP Flow Verify 只做「單次」的允許/拒絕測試，不是持續性的逐條規則記錄。",
 en:{q:"If you want to review detailed information about what incoming requests have been allowed or denied by network security groups on a per-rule basis, what Network Watcher service will best assist you?",
  o:["NSG Flow Logs","Diagnostic Logs","Network Performance Monitor","IP Flow Verify"],
  e:"NSG flow logs record per-rule ingress/egress traffic details continuously."}},

{n:377, code:"AZ104-Q377", d:3, od:5, t:"用度量找效能問題", tEn:"Using metrics to diagnose performance issues", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q206 是同一組情境的重複題。\n你負責管理一套跑在 Azure 上、目前有效能問題的解決方案，需要根據 Azure 基礎架構相關的度量找出原因。⟦你應該使用哪個工具？⟧",
 o:["Azure Traffic Analytics","Azure Monitor","Azure 活動記錄","Azure Advisor"],
 a:[1],
 e:"Azure Monitor 把度量存放在為時間序列分析優化的資料庫裡，適合設定警示與快速找出效能異常。",
 en:{q:"Which of the following is the tool you should use?",
  o:["Azure Traffic Analytics","Azure Monitor","Azure Activity Log","Azure Advisor"],
  e:"Azure Monitor's time-series metrics database is built for this kind of performance diagnosis."}},

{n:378, code:"AZ104-Q378", d:3, od:5, t:"地端伺服器備份多做的兩個步驟", tEn:"Extra steps for backing up on-premises servers", k:"mc",
 src:"quiz11:html",
 q:"你打算設定一個 Recovery Services 保存庫，同時備份內部部署伺服器與 Azure 虛擬機器磁碟。⟦內部部署伺服器需要、但 Azure 虛擬機器不需要的步驟是什麼？⟧（選 2 個答案）",
 o:["安裝 Recovery Services 代理程式","註冊你的內部部署伺服器","設定備份原則","設定保存庫的儲存體複寫方式"],
 a:[0,1],
 e:"要用 Azure Backup 備份內部部署伺服器，必須先在該伺服器上下載並安裝 Recovery Services 代理程式，還要先把伺服器「註冊」到保存庫，建立安全的通訊管道；Azure 虛擬機器則是透過平台層級的擴充功能整合，不需要另外安裝代理程式或手動註冊。設定備份原則、設定保存庫儲存體複寫方式，這兩項不管是地端伺服器還是 Azure VM 都一樣需要，不是地端才特有的步驟。",
 en:{q:"What steps are required for on-premise servers that are not required for Azure VMs? (Choose 2 answers)",
  o:["Install a recovery service agent","Register your on-premise server","Configure a backup policy","Configure the vault storage replication"],
  e:"On-premises servers need the Recovery Services Agent installed and the server registered with the vault; Azure VMs integrate at the platform level without these steps."}},

{n:379, code:"AZ104-Q379", d:3, od:5, t:"Azure Backup 支援的 VM 範圍很廣", tEn:"Azure Backup's broad VM support", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q207 是同一組情境的重複題。\n你打算用 Azure Backup 排程備份公司的虛擬機器到 Recovery Services 保存庫。⟦以下哪些虛擬機器可以備份？⟧（全選符合的選項。）",
 o:["跑 Windows 10 的虛擬機器","跑 Windows Server 2012 或更新版本的虛擬機器","目前沒有被關機的虛擬機器","跑 Debian 8.2 以上版本的虛擬機器","已經被關機的虛擬機器"],
 a:[0,1,2,3,4],
 e:"Azure Backup 支援 Windows Server 2008 起的 64 位元版本、64 位元 Windows 10、Debian 7.9 以上版本，且不論目前是執行中還是已關機／離線，都可以排入備份排程，五個選項全部符合。",
 en:{q:"Which of the following VMs can you back up? Choose all that apply.",
  o:["VMs that run Windows 10.","VMs that run Windows Server 2012 or higher.","VMs that have NOT been shut down.","VMs that run Debian 8.2+.","VMs that have been shut down."],
  e:"Azure Backup's support matrix covers all these OS versions and both running/shut-down states."}},

{n:380, code:"AZ104-Q380", d:2, od:2, t:"AzCopy 複製資料夾到容器", tEn:"AzCopy copying a folder to a container", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q37 是同一組情境的重複題。\n你有一台內部部署伺服器，裡面有一個資料夾 D:\\Folder1。你需要把它的內容複製到 Azure 儲存體帳戶 contosodata 的 public 容器。⟦你應該執行哪個命令？⟧",
 o:["az storage blob copy start D:\\Folder1 https://contosodata.blob.core.windows.net/public","azcopy sync D:\\folder1 https://contosodata.blob.core.windows.net/public -snapshot","azcopy copy D:\\folder1 https://contosodata.blob.core.windows.net/public -recursive","az storage blob copy start-batch D:\\Folder1 https://contosodata.blob.core.windows.net/public"],
 a:[2],
 e:"azcopy copy 加上 --recursive，可以把一個資料夾連同底下所有檔案複製到 Blob 容器，符合需求。azcopy sync 是「同步」語意，行為不同；az storage blob copy start／start-batch 是複製既有 Blob 用的，不是從本機資料夾上傳。",
 en:{q:"Which command should you run?",
  o:["az storage blob copy start D:\\Folder1 https://contosodata.blob.core.windows.net/public","azcopy sync D:\\folder1 https://contosodata.blob.core.windows.net/public -snapshot","azcopy copy D:\\folder1 https://contosodata.blob.core.windows.net/public -recursive","az storage blob copy start-batch D:\\Folder1 https://contosodata.blob.core.windows.net/public"],
  e:"azcopy copy --recursive copies a local directory (and its files) into a blob container."}},

{n:381, code:"AZ104-Q381", d:1, od:1, t:"批次建立來賓帳戶不能用一般建立指令", tEn:"Bulk guest creation can't use the regular user-creation cmdlet", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 Q382、Q383 是同一組情境的重複解法題。\n你有一個 Azure AD 租用戶 contoso.com，以及一份含 500 位外部使用者姓名與電子郵件的 CSV 檔。你需要替這 500 位外部使用者，各自在 contoso.com 建立一個來賓使用者帳戶。\n⟦解法：寫一個 PowerShell 指令碼，對每位使用者執行 New-AzureADUser 指令程式。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。New-AzureADUser 建立的是租用戶「自己」的一般成員帳戶，不是邀請「外部」使用者成為來賓帳戶的正確做法；要邀請外部使用者，應該用 New-AzureADMSInvitation 指令程式（見 Q383）。",
 en:{q:"Solution: You create a PowerShell script that runs the New-AzureADUser cmdlet for each user. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. New-AzureADUser creates regular member accounts, not guest invitations; use New-AzureADMSInvitation instead."}},

{n:382, code:"AZ104-Q382", d:1, od:1, t:"批次建立來賓帳戶不能用入口網站的一般建立", tEn:"Bulk guest creation isn't the portal's bulk create user operation", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 Q381、Q383 情境完全相同，只是提出的解法不同。\n（情境同 Q381。）⟦解法：在 Azure 入口網站的 Azure AD 裡，使用「大量建立使用者 (Bulk create user)」操作。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「大量建立使用者」建立的同樣是租用戶內部的一般成員帳戶，不是邀請外部使用者成為來賓帳戶的機制；正確做法是用 New-AzureADMSInvitation 指令程式逐一（或批次）邀請外部使用者。",
 en:{q:"Solution: From Azure AD in the Azure portal, you use the Bulk create user operation. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Bulk create user also creates regular member accounts, not guest invitations."}},

{n:383, code:"AZ104-Q383", d:1, od:1, t:"用邀請指令程式建立來賓帳戶", tEn:"Using the invitation cmdlet to create guest accounts", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 Q381、Q382 情境完全相同，只是提出的解法不同。\n（情境同 Q381。）⟦解法：寫一個 PowerShell 指令碼，對每位外部使用者執行 New-AzureADMSInvitation 指令程式。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。New-AzureADMSInvitation 指令程式專門用來邀請新的外部使用者加入你的目錄（以來賓帳戶身分），寫成指令碼對 CSV 裡的 500 位使用者各自執行一次，正確達成需求。",
 en:{q:"Solution: You create a PowerShell script that runs the New-AzureADMSInvitation cmdlet for each external user. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. New-AzureADMSInvitation is specifically designed to invite external users as guests into the directory."}},

{n:384, code:"AZ104-Q384", d:3, od:4, t:"專用連線搭配容忍延遲的容錯移轉", tEn:"Dedicated connection with a latency-tolerant failover", k:"mc",
 src:"quiz11:html",
 q:"一家公司要把內部部署資料中心連到 Azure，想要一條專用連線，同時要有容錯移轉連線；容錯移轉連線可以接受延遲增加，公司有 500 多位員工要用到這條連線。⟦你會選哪種連線類型？⟧",
 o:["主要與容錯移轉連線都用站對站","主要連線用站對站，容錯移轉連線用點對站","主要連線用 ExpressRoute，容錯移轉連線用站對站","主要連線用站對站，容錯移轉連線用 ExpressRoute"],
 a:[2],
 e:"ExpressRoute 行為上像是內部部署資料中心與 Azure 之間的專用連線，適合當「主要」連線；容錯移轉那條因為公司能接受延遲增加，可以用站對站 VPN（走公網、成本較低），這種「ExpressRoute 主要＋站對站容錯移轉」的組合是常見的實務模式。點對站是給個別使用者用的，不適合承載 500 多位員工的整體連線需求，也不是容錯移轉整條網路連線的做法。",
 en:{q:"Which of the following connection types would you use?",
  o:["Site-to-Site for the main and failover connection.","Site-to-Site for the main and Point-to-Site for the failover connection.","ExpressRoute for the main connection and Site-to-Site for the failover connection.","Site-to-Site for the main and ExpressRoute for the failover connection."],
  e:"ExpressRoute as the dedicated primary, with a latency-tolerant Site-to-Site VPN as failover, is the common pattern."}},

{n:385, code:"AZ104-Q385", d:3, od:4, t:"跨租用戶連接虛擬網路最簡單的方式", tEn:"Simplest way to connect VNets across tenants", k:"mc",
 src:"quiz11:html",
 q:"你的 IT 顧問公司最近跟另外兩家不同地區的公司合作，三個辦公室各自在 Azure 有自己的資源、各自獨立的訂用帳戶與 Azure AD 租用戶。你打算之後把這些辦公室合併成單一 Azure AD 租用戶，但現階段想先在維持各自獨立租用戶的情況下，把幾個不同訂用帳戶裡的虛擬網路連起來。⟦哪個 Azure 解決方案是最簡單的做法？⟧",
 o:["建立 VNet 對等互連連線","建立虛擬網路閘道","建立分割式檢視 (split-horizon) 的 DNS 區域","建立 VNet 對 VNet VPN"],
 a:[1],
 e:"雖然 VNet 對等互連現在已經支援跨訂用帳戶、甚至跨 Azure AD 租用戶的情境，但這一題官方標記的正解仍是「舊世代的虛擬網路閘道（也就是 VPN 閘道）」方案——這反映的是題庫較舊版本的認定（對等互連的跨租用戶能力是後來才逐步擴大支援範圍的）。虛擬網路閘道／VNet 對 VNet VPN 的做法歷史上一直都能跨訂用帳戶、跨租用戶運作，所以在題庫寫成的當下被視為「最簡單」的做法。DNS 分割式檢視解決的是名稱解析問題，不是打通網路連線本身。",
 en:{q:"What Azure solution is the easiest way to accomplish this?",
  o:["Create VNet peering connection","Create Virtual Network Gateways","Create a DNS zone with split-horizon view","Create a VNet-to-VNet VPN"],
  e:"The source marks the older Virtual Network Gateway (VPN-based) approach as correct, reflecting that VNet peering's cross-tenant support was expanded later; gateway-based connections have long supported cross-subscription/cross-tenant scenarios."}},

{n:386, code:"AZ104-Q386", d:1, od:1, t:"AKS 整合 Azure AD", tEn:"AKS Azure AD integration", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q4 是同一組情境的重複題。\n你的訂用帳戶連結到一個名為 contoso.com 的 Azure AD 租用戶，並有一個 AKS 叢集 AKS1。系統管理員回報無法把 AKS1 的存取權授予 contoso.com 的使用者。⟦你應該最先做什麼？⟧",
 o:["在 contoso.com 修改「組織關聯性」設定","在 contoso.com 建立 OAuth 2.0 授權端點","重新建立 AKS1","在 AKS1 建立一個命名空間"],
 a:[1],
 e:"叢集管理員可以依使用者身分或目錄群組成員資格設定 Kubernetes RBAC，Azure AD 驗證是透過 OpenID Connect（建構在 OAuth 2.0 協定上）提供給 AKS 叢集的，所以要先建立 OAuth 2.0 的授權端點，叢集才能整合 Azure AD 驗證。",
 en:{q:"What should you do first?",
  o:["From contoso.com, modify the Organization relationships settings.","From contoso.com, create an OAuth 2.0 authorization endpoint.","Recreate AKS1.","From AKS1, create a namespace."],
  e:"Azure AD authentication for AKS is provided via OpenID Connect built on OAuth 2.0; the authorization endpoint must be created first."}},

{n:387, code:"AZ104-Q387", d:3, od:4, t:"VPN 閘道與子網路的錯誤敘述", tEn:"False statement about VPN Gateways and subnets", k:"mc",
 src:"quiz11:html",
 q:"⟦以下關於 Azure VPN 閘道與子網路的敘述，哪一項是錯的？⟧",
 o:["建立內部部署到虛擬網路的連線時，子網路位址範圍不能重疊","VPN 閘道需要一個特定名稱為 GatewaySubnet 的閘道子網路","虛擬機器不能部署在閘道子網路上","建立 VNet 對 VNet 連線時，子網路位址範圍可以重疊"],
 a:[3],
 e:"不論是內部部署到虛擬網路的連線，還是 VNet 對 VNet 連線，兩邊的子網路位址範圍都「不能」重疊，所以「VNet 對 VNet 可以重疊」這句是錯的（也就是本題要選的答案）。VPN 閘道確實需要一個名稱固定為 GatewaySubnet 的閘道子網路，而且虛擬機器不能部署在這個子網路上，這兩句都是對的敘述。",
 en:{q:"Which of the following statements about Azure VPN Gateways and subnets is false?",
  o:["When creating on-premises to virtual network (VNet) connections, there cannot be overlapping subnet address ranges","VPN Gateways require a specific gateway subnet that must be named GatewaySubnet","Virtual machines cannot be deployed on a gateway subnet","When creating VNet-to-VNet connections there can be overlapping subnet address ranges"],
  e:"Overlapping subnet ranges are disallowed for both on-premises and VNet-to-VNet connections; the statement claiming otherwise is the false one."}},

{n:388, code:"AZ104-Q388", d:1, od:1, t:"群組到期原則", tEn:"Group expiration policy", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q5 是同一組情境的重複題。\n你有一個 Microsoft 365 租用戶與一個 Azure AD 租用戶 contoso.com，打算讓三位使用者存取一個暫時性的 SharePoint 文件庫，⟦解決方案必須確保群組會在 180 天後自動刪除⟧。你應該建立哪兩種群組？（每個正確答案各自是完整的解法。）",
 o:["採用「指派 (Assigned)」成員資格類型的 Microsoft 365 群組","採用「指派」成員資格類型的安全性群組","採用「動態使用者 (Dynamic User)」成員資格類型的 Microsoft 365 群組","採用「動態使用者」成員資格類型的安全性群組","採用「動態裝置」成員資格類型的安全性群組"],
 a:[0,2],
 e:"群組到期原則只能套用在 Microsoft 365 群組上，安全性群組不支援，所以不論成員資格類型是「指派」還是「動態使用者」，只要是 Microsoft 365 群組都符合需求。",
 en:{q:"Which two groups should you create? Each correct answer presents a complete solution.",
  o:["a Microsoft 365 group that uses the Assigned membership type","a Security group that uses the Assigned membership type","a Microsoft 365 group that uses the Dynamic User membership type","a Security group that uses the Dynamic User membership type","a Security group that uses the Dynamic Device membership type"],
  e:"Expiration policy only applies to Microsoft 365 groups, regardless of membership type."}},

{n:389, code:"AZ104-Q389", d:1, od:1, t:"Azure Policy 的錯誤敘述", tEn:"Incorrect statement about Azure Policy", k:"mc",
 src:"quiz11:html",
 q:"⟦以下關於 Azure Policy 建立的資源原則，哪一項敘述是錯的？⟧",
 o:["Azure Policy 會掃描 Azure 資源，找出不符合已定義原則的情況","它套用在 Azure 資源上，不是套用在 Azure 訂閱者或使用者上","原則一旦建立，會同時套用到新資源與既有資源","使用者可以用自訂原則查詢語法在 Azure Policy 裡搜尋"],
 a:[3],
 e:"Azure Policy 只針對 Azure「資源」定義原則（不是針對訂閱者/使用者本身）；原則建立後會套用到新建、更新過的、以及既有的資源；服務每小時會掃描一次找出不合規的情況；但 Azure Policy 並不支援使用者自訂「原則查詢語法」去搜尋，這句是錯的敘述。",
 en:{q:"Which of the following statements is incorrect regarding a resource policy created using Azure Policy?",
  o:["Azure Policy scans Azure resources for noncompliance with defined resource policies.","It applies to Azure resources, not Azure subscribers or users.","Once a policy is created, it applies to both new and existing resources.","Users can search through Azure policy with custom policy queries."],
  e:"Azure Policy does not support custom policy query syntax; the other three statements are accurate."}},

{n:390, code:"AZ104-Q390", d:2, od:3, t:"跨訂用帳戶搬移資源", tEn:"Moving resources across subscriptions", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q7 是同一組情境的重複題。\n你有一個 Azure 訂用帳戶 AZPT1，內含 storage1（儲存體帳戶）、VNET1（虛擬網路）、VM1（虛擬機器）、VM1Managed（VM1 的受控磁碟）、RVAULT1（VM1 站台復原用的 Recovery Services 保存庫）。你建立了一個新的訂用帳戶 AZPT2，需要判斷哪些資源可以搬到 AZPT2。⟦應該辨識出哪些資源？⟧",
 o:["僅 VM1、storage1、VNET1 和 VM1Managed","僅 VM1 和 VM1Managed","VM1、storage1、VNET1、VM1Managed 和 RVAULT1","僅 RVAULT1"],
 a:[2],
 e:"透過 Azure 入口網站可以把 VM 連同相依資源（儲存體帳戶、虛擬網路、受控磁碟）一起搬到另一個訂用帳戶；Recovery Services 保存庫現在也支援搬到新的資源群組或新的訂用帳戶，所以五項資源全部可以搬遷。",
 en:{q:"Which resources should you identify?",
  o:["VM1, storage1, VNET1, and VM1Managed only","VM1 and VM1Managed only","VM1, storage1, VNET1, VM1Managed, and RVAULT1","RVAULT1 only"],
  e:"All five resources, including the Recovery Services vault, can be moved to another subscription."}},

{n:391, code:"AZ104-Q391", d:2, od:3, t:"獨立 VM 無法事後加入可用性設定組", tEn:"Standalone VMs can't be added to an Availability Set after the fact", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q330 是同一組情境的重複題。\n系統管理員為一個新的 Web 服務部署了兩台獨立的 Azure 虛擬機器，你想把它們加進一個可用性設定組的容錯網域，在入口網站嘗試時卻收到錯誤訊息無法完成。⟦這是什麼原因？⟧",
 o:["在 Azure 入口網站沒有勾選必要的「獨立」參數","不能把執行中的獨立虛擬機器加進可用性設定組","虛擬機器的作業系統跟容錯網域不相容","加入獨立虛擬機器之前，必須先暫停或停止可用性設定組"],
 a:[1],
 e:"可用性設定組成員資格要在建立虛擬機器的當下就指定，既有的獨立虛擬機器沒辦法事後直接移入。",
 en:{q:"What is the reason for this?",
  o:["You did not check the required \"Standalone\" parameter in Azure Portal","You may not add running standalone VMs to availability sets","The VMs operating system is not compatible with fault domains.","The availability set has to be paused or stopped before standalone VMs can be added."],
  e:"Availability Set membership must be set at VM creation time; existing standalone VMs can't be added afterward."}},

{n:392, code:"AZ104-Q392", d:1, od:1, t:"市集項目授權條款", tEn:"Marketplace legal terms", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q8 是同一組情境的重複題。\n新建立的 Azure 訂用帳戶裡，使用者 Admin1 用 Azure PowerShell 部署 ARM 範本時，收到「尚未接受這項市集資源的法律條款」的錯誤訊息。⟦你需要確保 Admin1 能成功部署，應該怎麼做？⟧",
 o:["用 Azure PowerShell 執行 Set-AzApiManagementSubscription 指令程式","在 Azure 入口網站註冊 Microsoft.Marketplace 資源提供者","用 Azure PowerShell 執行 Set-AzMarketplaceTerms 指令程式","在 Azure 入口網站把「帳單系統管理員」角色指派給 Admin1"],
 a:[2],
 e:"Set-AzMarketplaceTerms 指令程式可以程式化地接受市集項目的授權條款，之後範本部署才不會再被擋下。",
 en:{q:"What should you do?",
  o:["From Azure PowerShell, run the Set-AzApiManagementSubscription cmdlet","From the Azure portal, register the Microsoft.Marketplace resource provider","From Azure PowerShell, run the Set-AzMarketplaceTerms cmdlet","From the Azure portal, assign the Billing administrator role to Admin1"],
  e:"Set-AzMarketplaceTerms programmatically accepts the Marketplace item's legal terms."}},

{n:393, code:"AZ104-Q393", d:1, od:1, t:"用標記追蹤各部門支出", tEn:"Using tags to track spending by department", k:"mc",
 src:"quiz11:html",
 q:"公司的營運擴大，費用也隨之增加，你需要辨識出 IT 部門與開發部門各自使用 Azure 資源產生的費用。⟦你應該用哪個 Azure 服務或工具，更好地依部門了解組織的資源支出？⟧",
 o:["Azure Advisor","Azure 預算 (Azure Budget)","Azure 價格計算機","Azure 資源標記"],
 a:[3],
 e:"用標記追蹤成本是常見做法：替資源加上依部門、專案、環境等維度的標記（例如 Department=IT／Development），之後就能在成本分析報表裡依標記篩選、彙總，看出各部門各自花了多少錢。Advisor 給的是最佳實務建議；預算是設定花費上限與警示，不是拆解「依部門」的分析工具；價格計算機是部署前的估價工具，不是分析既有支出的工具。",
 en:{q:"Which Azure service or tool should you use to better understand your organization's resource expenses by department?",
  o:["Azure Advisor","Azure Budget","Azure Price Calculator","Azure Resource Tags"],
  e:"Tags let you group resources by department, project, etc., which cost analysis can then filter/aggregate by."}},

{n:394, code:"AZ104-Q394", d:1, od:1, t:"指派系統管理員角色", tEn:"Assigning an admin role", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q9 是同一組情境的重複題。\n你有一個 Azure AD 租用戶，內有 5,000 個使用者帳戶，你建立了一個新帳戶 AdminUser1，需要把「使用者管理員」角色指派給它。⟦你應該在使用者帳戶內容頁裡設定什麼？⟧",
 o:["在「授權」刀鋒選單指派一個新授權","在「目錄角色」刀鋒選單修改目錄角色","在「群組」刀鋒選單邀請這個帳戶加入新群組"],
 a:[1],
 e:"要指派系統管理角色，做法是打開該使用者的內容頁，進入「目錄角色」刀鋒選單，新增角色並選擇要指派的系統管理角色。",
 en:{q:"What should you do from the user account properties?",

{n:395, code:"AZ104-Q395", d:2, od:2, t:"磁碟加密的金鑰管理難題", tEn:"Key management complexity in disk encryption", k:"mc",
 src:"quiz11:html",
 q:"你的組織想保護存放在 Azure 虛擬機器環境裡的客戶個資，你建議使用 Azure 磁碟加密（Linux 與 Windows VM 都適用）。雖然加密流程本身很簡單，用 PowerShell 部署一個 VM 擴充功能就能完成，⟦但這個流程有一個會增加複雜度的注意事項是什麼？⟧",
 o:["啟用 Bitlocker 與 Azure Backup 服務是互斥的，不能同時使用","Bitlocker 沒辦法有效加密作業系統","必須有一套機制來管理加密磁碟所用的加密金鑰","建立加密金鑰的過程本身很複雜"],
 a:[2],
 e:"啟用磁碟加密只是第一步，真正麻煩的是後續怎麼管理這些加密金鑰——鎖起來的東西總要有人保管鑰匙才能重新打開。Azure 提供 Key Vault 服務，專門用來管理與控管磁碟加密金鑰及雲端應用程式/服務使用的密鑰，就是為了解決這個管理難題。Bitlocker 與 Azure Backup 並非互斥；Bitlocker 本身可以有效加密作業系統磁碟；建立金鑰本身的過程並不複雜，複雜的是「管理」金鑰。",
 en:{q:"What is one caveat to the process that adds a level of complexity?",
  o:["Bitlocker enabled and Azure Backup Service are mutually exclusive processes.","Bitlocker is ineffective at encrypting the operating system.","A mechanism must be in place to manage the encryption keys for the encrypted disk.","The process of creating the encryption keys is complex."],
  e:"Managing the resulting encryption keys (typically via Azure Key Vault) is the real complexity, not the encryption step itself."}},

{n:396, code:"AZ104-Q396", d:1, od:1, t:"指派 Azure AD Premium 授權", tEn:"Assigning Azure AD Premium licenses", k:"mc",

 a:[0],
 e:"要讓特定使用者用到已購買的 Premium 授權功能，必須明確把授權指派給他們，到「授權」刀鋒選單操作即可。",
 en:{q:"What should you do?",

{n:397, code:"AZ104-Q397", d:2, od:3, t:"ARM 範本的 dependsOn 陣列", tEn:"The dependsOn array in an ARM template", k:"mc",
 src:"quiz11:html",
 q:"下面是一份部署 Windows VM 的 ARM 範本片段，用來建立網路介面卡，這張網路介面卡需要一個公用 IP 位址與一個虛擬網路。範本片段（節錄，`dependsOn` 陣列裡已經有一項是虛擬網路的資源識別碼）：\n```json\n{\n  \"apiVersion\": \"2016-03-30\",\n  \"type\": \"Microsoft.Network/networkInterfaces\",\n  \"name\": \"[variables('nicName')]\",\n  \"location\": \"[resourceGroup().location]\",\n  \"dependsOn\": [\n    ____填空____,\n    \"[resourceId('Microsoft.Network/virtualNetworks/', variables('virtualNetworkName'))]\"\n  ]\n}\n```\n⟦下面哪個選項應該填進 dependsOn 陣列的空格，才能達成「需要公用 IP 位址與虛擬網路」這個目的？⟧",
 o:["\"[resourceId('Microsoft.Network/publicIPAddresses/', variables('publicIPAddressName'))]\"","\"[resourceId('Microsoft.Network/networkInterfaces/', variables('nicName'))]\"","\"[reference(variables('publicIPAddressName')).dnsSettings.fqdn]\"","\"[resourceId('Microsoft.Storage/storageAccounts/', variables('storageAccountName'))]\""],
 a:[0],
 e:"`dependsOn` 屬性的作用是延後某個資源的建立，直到它依賴的其他資源先存在為止。這張網路介面卡需要「公用 IP 位址」與「虛擬網路」都先建立好，陣列裡已經有虛擬網路那一項，空格要填的自然是公用 IP 位址的資源識別碼。網路介面卡自己依賴自己（第二個選項）沒有意義；`reference()` 取的是屬性值，不是拿來當依賴宣告用的；儲存體帳戶跟建立網路介面卡無關。",
 en:{q:"Which of the answers below belong in the dependsOn array to accomplish that objective?",
  o:["\"[resourceId('Microsoft.Network/publicIPAddresses/', variables('publicIPAddressName'))]\"","\"[resourceId('Microsoft.Network/networkInterfaces/', variables('nicName'))]\"","\"[reference(variables('publicIPAddressName')).dnsSettings.fqdn]\"","\"[resourceId('Microsoft.Storage/storageAccounts/', variables('storageAccountName'))]\""],
  e:"dependsOn delays resource creation until dependencies exist; the NIC needs the public IP address resource ID alongside the already-listed VNet dependency."}},

{n:398, code:"AZ104-Q398", d:3, od:5, t:"ITSM 連接器", tEn:"IT Service Management Connector", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q11 是同一組情境的重複題。\n你有一個 Azure 訂用帳戶 Subscription1，以及一套內部部署的 Microsoft System Center Service Manager。Subscription1 裡有一台虛擬機器 VM1。你需要確保當 VM1 的可用記憶體低於 10% 時，Service Manager 會收到警示。⟦你應該最先做什麼？⟧",
 o:["建立一個自動化 Runbook","部署一個函式應用程式","部署 IT Service Management Connector (ITSM)","建立一個通知"],
 a:[2],
 e:"ITSMC 是專門把 Azure 監控警示串接到外部 ITSM 系統的元件，要讓地端 Service Manager 收到 Azure 警示，第一步就是部署並設定 ITSMC。",
 en:{q:"What should you do first?",
  o:["Create an automation runbook","Deploy a function app","Deploy the IT Service Management Connector (ITSM)","Create a notification"],

{n:399, code:"AZ104-Q399", d:1, od:1, t:"消費者身分識別管理用 Azure AD B2C", tEn:"Azure AD B2C for consumer identity management", k:"mc",
 src:"quiz11:html",
 q:"⟦替消費者導向的 Web 與行動應用程式，啟用雲端身分識別管理解決方案，應該使用哪個 Microsoft Azure Active Directory 解決方案？⟧",
 o:["Azure Active Directory B2C","Azure Active Directory","Azure Active Directory 網域服務","Azure 多重要素驗證"],
 a:[0],
 e:"Azure AD B2C 是專門為「消費者導向」應用程式設計的身分識別平台，讓消費者可以用既有的社群帳號（Facebook、Google、Amazon、LinkedIn）或自建帳密（本機帳戶）註冊登入你的應用程式，並提供一套安全、標準化、可擴充原則的整合方式，取代開發者自己寫一套帳密系統。一般的 Azure AD 是給組織內部員工／協作對象用的身分服務，不是設計給大量外部消費者用的；網域服務是提供傳統 AD DS 相容功能（如 LDAP、Kerberos）的服務；多重要素驗證是驗證強化功能，不是完整的身分管理平台。",
 en:{q:"Which Microsoft Azure Active Directory solution should you use to enable a cloud identity management solution for your consumer-facing web and mobile applications?",
  o:["Azure Active Directory B2C","Azure Active Directory","Azure Active Directory Domain Services","Azure Multi-Factor Authentication"],
  e:"Azure AD B2C is purpose-built for consumer identity management, including social and local account sign-in."}},

{n:400, code:"AZ104-Q400", d:1, od:1, t:"Azure AD 加入裝置的本機管理員", tEn:"Local admins on Azure AD joined devices", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q12 是同一組情境的重複題。\n你訂閱了 Azure AD Premium P2，需要把使用者 admin1@contoso.com 加進所有將加入 Azure AD 網域的電腦的本機系統管理員。⟦你應該在 Azure AD 設定什麼？⟧",
 o:["「裝置」刀鋒選單的裝置設定","「MFA 伺服器」刀鋒選單的提供者","「使用者」刀鋒選單的使用者設定","「群組」刀鋒選單的一般設定"],
 a:[0],
 e:"要指定額外的人自動成為所有 Azure AD 加入裝置的本機系統管理員，要到「裝置」刀鋒選單的「裝置設定」裡設定「Additional local administrators on Azure AD joined devices」。",

{n:401, code:"AZ104-Q401", d:1, od:1, t:"依規則自動檢查資源合規性（來源正解與解析矛盾，已修正）", tEn:"Auto-checking resources against custom rules (source correction)", k:"mc",
 src:"quiz11:html",
 q:"注意：來源網頁把「Initialize change tracking with Azure Automation and Log Analytics」標成正確答案，但同一則來源自己附的解析文字卻寫著「Azure Policy 才是唯一能讓你指定需求、並依需求檢視資源的選項」——兩者互相矛盾，判斷是來源資料標記錯誤。依 Azure 實際功能與這段解析本身的論點，已改標為「用 Azure Policy 建立資源原則」為正確答案，並在此註明更動理由。\n你檢視最近上線的應用程式，發現幾項可能影響效能或安全性的變更，擔心 IT 管理團隊沒有依照公司規範檢查這些領域。你想自動化一套流程，依你指定的規則檢查 Azure 資源（含儲存體帳戶與虛擬機器），並在不合規時自動收到通知。⟦你可以採取什麼步驟達成這個目標？⟧",
 o:["用 Azure Policy 建立資源原則", "實作「唯讀」資源鎖定", "用 Azure Log Analytics 建立警示", "用 Azure Automation 與 Log Analytics 啟用變更追蹤"],
 a:[0],
 e:"Azure Policy 正是用來「指定你自訂的資源規則、並持續掃描既有與新建資源是否符合這些規則」的服務，不合規的資源會被標記出來，也可以搭配 Azure Monitor 對「原則合規狀態變化」設定警示，完整符合「依規則自動檢查＋自動通知不合規」的需求。「唯讀」鎖定只是防止修改／刪除，不會檢查任何自訂規則；Log Analytics 警示要有資料來源與查詢邏輯才能運作，本身不提供「定義規則、掃描資源合規性」的框架；Azure Automation 的變更追蹤功能，追的是 VM 內部檔案／登錄機／軟體的異動，不是「資源設定是否符合你指定的規則」這種較廣泛的合規檢查，跟題目情境不符。",
 en:{q:"What steps can you take to accomplish this goal?",
  o:["Create resource policies with Azure Policy.","Implement 'Read-Only' resource locks.","Create alerts using Azure Log Analytics.","Initialize change tracking with Azure Automation and Log Analytics."],
  e:"Corrected from the source's marked answer: the source's own explanation text argues for Azure Policy (\"the only option that allows you to specify requirements and review resources against those requirements\"), which contradicts its marked-correct option (Automation change tracking). Change tracking monitors file/registry/software drift on VMs, not general custom-rule compliance across resource types — Azure Policy fits the scenario."}},

{n:402, code:"AZ104-Q402", d:3, od:5, t:"刪除有備份的資源群組", tEn:"Deleting a resource group with backups", k:"mc",
 src:"quiz11:html",
 q:"注意：本題與 AZ104-Q13 是同一組情境的重複題，這裡表格資訊完整保留。\n你有一個 Azure 訂用帳戶，內含一個資源群組 RG26。RG26 位於 West Europe，用來建立某個專案的臨時資源，內含下表所示的資源：\n| 名稱 | 類型 | 地區 |\n|---|---|---|\n| VM1 | 虛擬機器 | North Europe |\n| RGV1 | Recovery Services 保存庫 | North Europe |\n| SQLD01 | Azure VM 裡的 SQL Server | North Europe |\n| sa001 | 儲存體帳戶 | West Europe |\nSQLDB01 已設定備份到 RGV1。\n專案結束後，你嘗試從 Azure 入口網站刪除 RG26，但刪除失敗。你需要成功刪除 RG26。⟦你應該最先做什麼？⟧",
 o:["刪除 VM1","停止 VM1","停止 SQLDB01 的備份","刪除 sa001"],
 a:[2],
 e:"資源群組刪除失敗最常見的原因，是群組裡有資源被 Recovery Services 保存庫的備份鎖住——只要有作用中的備份設定，就無法直接刪除該資源，進而擋下整個資源群組的刪除。必須先停止 SQLDB01 的備份，才能繼續刪除 RG26。",
 en:{q:"What should you do first?",
  o:["Delete VM1","Stop VM1","Stop the backup of SQLDB01","Delete sa001"],
  e:"An active Recovery Services backup blocks deletion of both the resource and the resource group; the backup must be stopped first."}},


{n:323, code:"AZ104-Q323", d:2, od:3, t:"部署含自訂根憑證的 VM", tEn:"Deploying a VM with a custom trusted root CA", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q177 是同一組情境的重複題。\n你打算在公司的 Azure 訂用帳戶部署一台 Ubuntu Server 虛擬機器。\n你需要做客製化部署，包含加入一個特定的信任根憑證授權單位 (CA)。⟦你應該用什麼來建立這台虛擬機器？⟧",
 o:["New-AzureRmVm 指令程式","New-AzVM 指令程式","Create-AzVM 指令程式","az vm create 命令"],
 a:[3],
 e:"az vm create 搭配 --custom-data 參數，可以傳入一份 cloud-init 設定檔，在建立階段就把信任根憑證等客製化設定套用進去（若設定檔不在工作目錄，要記得用完整路徑）。這是 Linux VM 自動化部署搭配自訂設定的標準做法；其餘選項要嘛是已淘汰的舊指令、要嘛根本不是真實存在的指令程式。",
 en:{q:"Which of the following should you use to create the virtual machine?",
  o:["The New-AzureRmVm cmdlet.","The New-AzVM cmdlet.","The Create-AzVM cmdlet.","The az vm create command."],
  e:"az vm create with --custom-data lets you pass a cloud-init config file to apply customizations (like a trusted root CA) at creation time."}},

{n:324, code:"AZ104-Q324", d:1, od:1, t:"資源標記的錯誤敘述", tEn:"False statements about resource tagging", k:"mc",
 src:"quiz10:html",
 q:"⟦以下關於資源標記 (tagging) 的敘述，哪兩項是錯誤的？⟧（選 2 個答案）",
 o:["替資源加標記，需要對該資源類型有寫入權限","資源群組上的標記，會被群組內的資源繼承","Azure 傳統 (Classic) 部署模式的資源不能套用標記","替資源群組加上標記後，之後新增進這個資源群組的資源會繼承這個標記"],
 a:[1,3],
 e:"這兩句都是錯的，共通的誤解是「資源群組的標記會自動套用到裡面的資源」：實際上資源群組本身的標記，不管是原本就有的資源、還是之後新加進來的資源，都不會自動繼承。標記要嘛手動逐一設定，要嘛用 Azure Policy 的 Modify／Append 效果強制套用。替資源加標記確實需要該資源類型的寫入權限，這句是對的；傳統部署模式的資源確實不支援標記，這句也是對的。",
 en:{q:"Which statements regarding resource tagging is false? (Choose 2 answers)",
  o:["Tagging a resource requires write access permission for the resource type.","Tags to a resource group are inherited by resources within the group","Tags cannot be applied to Azure Classic deployment resources.","After a resource group has been tagged, any new resources added to the resource group inherit the resource group's tags."],
  e:"Resource group tags are never automatically inherited by resources within the group, whether pre-existing or newly added — both inheritance-related statements are false."}},

{n:325, code:"AZ104-Q325", d:3, od:5, t:"跨地區的 VM 備份保存庫", tEn:"Vault region matching for VM backup", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q89 是同一組情境的重複題，這裡表格資訊完整保留。\n你有一個 Azure 訂用帳戶 Subscription1，內含下表所示的資源：\n| 名稱 | 類型 | 地區 | 資源群組 |\n|---|---|---|---|\n| RG1 | 資源群組 | West Europe | 不適用 |\n| RG2 | 資源群組 | North Europe | 不適用 |\n| Vault1 | Recovery Services 保存庫 | West Europe | RG1 |\n你在 Subscription1 建立了下表所示的虛擬機器：\n| 名稱 | 資源群組 | 地區 | 作業系統 |\n|---|---|---|---|\n| VM1 | RG1 | West Europe | Windows Server 2016 |\n| VM2 | RG1 | North Europe | Windows Server 2016 |\n| VM3 | RG2 | West Europe | Windows Server 2016 |\n| VMA | RG1 | West Europe | Ubuntu Server 18.04 |\n| VMB | RG1 | North Europe | Ubuntu Server 18.04 |\n| VMC | RG2 | West Europe | Ubuntu Server 18.04 |\n你打算用 Vault1 備份盡量多台虛擬機器。⟦哪些虛擬機器可以備份到 Vault1？⟧",
 o:["僅 VM1","僅 VM3 和 VMC","VM1、VM2、VM3、VMA、VMB 和 VMC","僅 VM1、VM3、VMA 和 VMC","僅 VM1 和 VM3"],
 a:[3],
 e:"Recovery Services 保存庫要保護的資源，必須跟保存庫在「同一個地區」——這裡是 West Europe，資源群組（RG1／RG2）不是判斷依據，重點是虛擬機器本身的地區。VM1、VM3、VMA、VMC 都位於 West Europe，符合條件；VM2、VMB 位於 North Europe，跟 Vault1 地區不符，不能用它備份。",
 en:{q:"Which virtual machines can be backed up to Vault1?",
  o:["VM1 only","VM3 and VMC only","VM1, VM2, VM3, VMA, VMB, and VMC","VM1, VM3, VMA, and VMC only","VM1 and VM3 only"],
  e:"A vault can only back up VMs in its own region (West Europe here); VM2 and VMB are in North Europe and don't qualify."}},

{n:326, code:"AZ104-Q326", d:1, od:1, t:"用標記關聯資源與部門", tEn:"Using tags to associate resources with departments", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q173 是同一組情境的重複題。\n你公司有好幾個部門，每個部門都有自己的虛擬機器，全部放在同一個資源群組 RG1。你想要把每台虛擬機器跟它所屬的部門建立關聯。⟦你應該怎麼做？⟧",
 o:["替每個部門建立 Azure 管理群組","替每個部門建立一個資源群組","把標記 (tags) 指派給虛擬機器","修改虛擬機器的設定"],
 a:[2],
 e:"標記是附加在 Azure 資源上的中繼資料鍵值對，例如 Department=Sales，能讓你依組織需要的維度（這裡是部門）分類、篩選資源，不需要搬動或重新調整既有的資源群組結構。管理群組是管理多個訂用帳戶的階層，跟單一資源群組內的分類無關；替每個部門建資源群組要搬動現有資源。",
 en:{q:"What should you do?",
  o:["Create Azure Management Groups for each department.","Create a resource group for each department.","Assign tags to the virtual machines.","Modify the settings of the virtual machines."],
  e:"Tags are key-value metadata you attach to resources for exactly this kind of classification, without restructuring resource groups."}},

{n:327, code:"AZ104-Q327", d:1, od:1, t:"設定條件式存取原則", tEn:"Configuring a conditional access policy", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q174~Q176 是同一組情境的重複解法題。\n你打算實作一個 Azure AD 條件式存取原則，要求全域系統管理員群組成員從不受信任的位置連線時，使用多重要素驗證 (MFA) 且必須是 Azure AD 加入的裝置。\n⟦解法：到多重要素驗證頁面修改使用者設定。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。多重要素驗證頁面的使用者設定，沒辦法設定「特定群組」「不受信任的位置」「要求裝置合規」這類條件式存取才有的精細條件，必須在條件式存取原則本身的授予控制設定（見 Q329）。",
 en:{q:"Solution: You access the multi-factor authentication page to alter the user settings. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. This page can't set the group/location conditions or device-compliance requirement; use the Conditional Access policy's grant controls."}},

{n:328, code:"AZ104-Q328", d:1, od:1, t:"設定條件式存取原則", tEn:"Configuring a conditional access policy", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q174~Q176、Q327 情境完全相同，只是提出的解法不同。\n（情境同 Q327。）⟦解法：到 Azure 入口網站修改這個條件式存取原則的「工作階段控制 (session control)」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。工作階段控制設定的是登入後的工作階段行為，不是「要求 MFA」與「要求裝置合規」這兩項所在的地方；正確設定 MFA 的方式是透過條件式存取原則的授予控制。",
 en:{q:"Solution: You access the Azure portal to alter the session control of the policy. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Configuring MFA correctly happens through the policy's grant controls, not session controls."}},

{n:329, code:"AZ104-Q329", d:1, od:1, t:"設定條件式存取原則", tEn:"Configuring a conditional access policy", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q174~Q176、Q327、Q328 情境完全相同，只是提出的解法不同。\n（情境同 Q327。）⟦解法：到 Azure 入口網站修改這個條件式存取原則的「授予控制 (grant control)」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。條件式存取原則就像一道閘門：先用條件（指派對象＝全域系統管理員群組、位置＝不受信任的位置）篩出哪些人會被攔下來，再用授予控制決定「要通過這道閘門，必須符合什麼」——這裡勾選要求 MFA 與要求裝置合規（Azure AD 加入的裝置），正好完整符合需求。",
 en:{q:"Solution: You access the Azure portal to alter the grant control of the policy. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. Grant controls are where you require MFA and a compliant/Azure AD joined device."}},

{n:330, code:"AZ104-Q330", d:2, od:3, t:"獨立 VM 無法事後加入可用性設定組", tEn:"Standalone VMs can't be added to an Availability Set after the fact", k:"mc",
 src:"quiz10:html",
 q:"你的系統管理員為一個新的 Web 服務部署了兩台獨立的 Azure 虛擬機器。你想把這兩台 VM 加進一個可用性設定組的容錯網域。在入口網站嘗試這麼做時，收到錯誤訊息，無法完成。⟦這是什麼原因？⟧",
 o:["你在 Azure 入口網站沒有勾選必要的「獨立 (Standalone)」參數","不能把執行中的獨立虛擬機器加進可用性設定組","虛擬機器的作業系統跟容錯網域不相容","加入獨立虛擬機器之前，必須先暫停或停止可用性設定組"],
 a:[1],
 e:"可用性設定組要在「建立虛擬機器的當下」就指定，沒有加入設定組的既有虛擬機器（獨立虛擬機器）事後沒辦法直接移進去；要讓這兩台 VM 受可用性設定組保護，必須刪除後在建立時就指定可用性設定組重新建立，而不是找一個介面選項就能把既有 VM 拉進去。選項裡提到的「勾選必要參數」「作業系統不相容」「暫停設定組」都不是真正的原因。",
 en:{q:"When you attempt to do this in the portal, you receive an error message preventing you from completing the task. What is the reason for this?",
  o:["You did not check the required \"Standalone\" parameter in Azure Portal","You may not add running standalone VMs to availability sets","The VMs operating system is not compatible with fault domains.","The availability set has to be paused or stopped before standalone VMs can be added."],
  e:"Availability Set membership must be set at VM creation time; existing standalone VMs can't be moved into one afterward."}},

{n:331, code:"AZ104-Q331", d:2, od:2, t:"用來搬移儲存體資料的命令列工具", tEn:"Command-line tool for moving storage data", k:"mc",
 src:"quiz10:html",
 q:"⟦哪一個 Azure 工具是雲端的命令列服務，用來在 Azure 儲存體帳戶之間複製與搬移資料？⟧",
 o:["AzCopy","Import/Export 服務","Azure Data Box","Azure Storage Explorer"],
 a:[0],
 e:"AzCopy 是一套命令列工具，可以把資料從既有的一般用途儲存體帳戶複製進 Blob 儲存體帳戶，也可以把內部部署裝置上的資料上傳進 Blob 儲存體，是儲存體帳戶之間搬移/複製資料的標準命令列工具。Import/Export 服務是靠寄送實體磁碟做大量資料搬遷；Data Box 是實體裝置搬遷方案；Storage Explorer 是圖形化介面工具，不是命令列服務。",
 en:{q:"Which Azure tool is a cloud-based, command-line service for copying and migrating data between Azure Storage accounts?",
  o:["AzCopy","Import/Export Service","Azure Data Box","Azure Storage Explorer"],
  e:"AzCopy is the command-line utility for copying/migrating data into and between Azure Storage accounts."}},

{n:332, code:"AZ104-Q332", d:1, od:1, t:"MFA 使用模式無法直接改", tEn:"MFA usage model can't be switched in place", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q178~Q180 是同一組情境的重複解法題。\n公司的多重要素驗證 (MFA) 目前使用「按次驗證」的使用模式，併購後新加進 Azure AD 的員工也要用 MFA，⟦而且必須改成「按啟用使用者計費」的使用模式⟧。\n⟦解法：透過 Azure 入口網站重新設定既有的使用模式。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。既有 MFA 供應商的使用模式無法原地切換（不論用入口網站還是命令列都不行），必須改建立一個新的供應商、並用既有供應商的資料重新啟用伺服器。",
 en:{q:"Solution: You reconfigure the existing usage model via the Azure portal. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. The usage model of an existing provider can't be changed in place through any interface."}},

{n:333, code:"AZ104-Q333", d:1, od:1, t:"MFA 使用模式無法直接改", tEn:"MFA usage model can't be switched in place", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q178~Q180、Q332 情境完全相同，只是提出的解法不同。\n（情境同 Q332。）⟦解法：透過 Azure CLI 重新設定既有的使用模式。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。跟入口網站一樣，既有供應商的使用模式沒辦法透過任何介面原地切換，一定要新建供應商才行。",
 en:{q:"Solution: You reconfigure the existing usage model via the Azure CLI. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Same limitation regardless of interface used."}},

{n:334, code:"AZ104-Q334", d:3, od:4, t:"偵測攻擊流量用流量分析", tEn:"Using Traffic Analytics to detect attack traffic", k:"mc",
 src:"quiz10:html",
 q:"你懷疑駭客與機器人一直在攻擊你的應用程式網路。⟦哪一個 Azure Network Watcher 的網路監控／分析工具最適合你的需求？⟧",
 o:["連線監視器 (Connection Monitor)","Network Performance Monitor","安全性群組檢視 (Security Group View)","流量分析 (Traffic Analytics)"],
 a:[3],
 e:"流量分析是一套雲端方案，分析 Network Watcher 收集的 NSG 流程記錄檔 (flow logs)，提供雲端網路裡「使用者與應用程式活動」的深入分析，能看出異常的來源與流量型態，正適合用來調查可疑的攻擊流量。連線監視器與 Network Performance Monitor 專注在連線可達性與延遲；安全性群組檢視只是列出目前套用的規則，不是分析流量行為的工具。",
 en:{q:"What Azure Network Watcher network monitoring or analysis tool would best fit your needs?",
  o:["Connection Monitor","Network Performance Monitor","Security Group View","Traffic Analytics"],
  e:"Traffic Analytics analyzes NSG flow logs to surface insights into traffic patterns, ideal for investigating suspicious activity."}},

{n:335, code:"AZ104-Q335", d:1, od:1, t:"立即觸發 Azure AD Connect 同步", tEn:"Triggering an immediate Azure AD Connect sync", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q181~Q183 是同一組情境的重複解法題。\n你需要立刻把內部部署 Active Directory 新建立的使用者，複寫到混合共存的 Azure AD。\n⟦解法：用「Active Directory 站台和服務」，強制某台網域控制站的通用類別目錄複寫。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。這只會強制內部部署網域控制站之間的複寫，跟同步到 Azure AD 是兩回事；正確做法是執行 PowerShell 的 Start-ADSyncSyncCycle -PolicyType Delta（增量同步，若要求完整同步則用 Initial）。",
 en:{q:"Solution: You use Active Directory Sites and Services to force replication of the Global Catalog on a domain controller. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. That forces on-premises DC replication only; run Start-ADSyncSyncCycle -PolicyType Delta to sync to Azure AD."}},

{n:336, code:"AZ104-Q336", d:1, od:1, t:"立即觸發 Azure AD Connect 同步", tEn:"Triggering an immediate Azure AD Connect sync", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q181~Q183、Q335 情境完全相同，只是提出的解法不同。\n（情境同 Q335。）⟦解法：重新啟動某台網域控制站的 NetLogon 服務。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。NetLogon 服務負責網域控制站的驗證相關功能，跟觸發 Azure AD Connect 同步循環無關；正確做法是執行 Start-ADSyncSyncCycle -PolicyType Delta。",
 en:{q:"Solution: You restart the NetLogon service on a domain controller. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. NetLogon is unrelated to triggering an Azure AD Connect sync; use Start-ADSyncSyncCycle -PolicyType Delta instead."}},

{n:337, code:"AZ104-Q337", d:3, od:5, t:"跨雲端與地端的效能監控", tEn:"Performance monitoring across clouds and on-premises", k:"mc",
 src:"quiz10:html",
 q:"⟦哪個 Azure 服務不只能監控部署在 Azure 上的方案的效能度量，也能監控部署在地端、Google Cloud、Amazon Web Services 上的方案？⟧",
 o:["Azure Application Insights","Azure Monitor","Azure Log Analytics","Azure Network Watcher"],
 a:[0],
 e:"Application Insights 是應用程式效能監控 (APM) 服務，透過在應用程式裡安裝 SDK 或代理程式來收集效能資料，這個做法跟應用程式實際跑在哪個雲端或地端無關，所以可以同時監控部署在 Azure、GCP、AWS 或內部部署的應用程式。Azure Monitor、Log Analytics 是 Azure 平台層級監控的核心服務、主要鎖定 Azure 資源；Network Watcher 是 Azure 虛擬網路專用的診斷工具。",
 en:{q:"Which Azure service can provide performance metrics of not only solutions deployed on Azure, but also solutions hosted on-premise as well as Google Cloud and Amazon Web Services?",
  o:["Azure Application Insights","Azure Monitor","Azure Log Analytics","Azure Network Watcher"],
  e:"Application Insights instruments the application itself via SDK/agent, so it works regardless of which cloud or on-premises environment hosts it."}},

{n:338, code:"AZ104-Q338", d:2, od:2, t:"跨地區可讀取的儲存體備援", tEn:"Cross-region readable storage redundancy", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q184 是同一組情境的重複題。\n公司在 Los Angeles 與 New York 有資料中心，正設定成異地叢集站台。你需要建議一種儲存體備援選項，滿足：資料存放在多個節點、跨地理位置存放、次要位置也能讀取。⟦你應該建議哪一種？⟧",
 o:["異地備援儲存體 (GRS)","唯讀異地備援儲存體 (RA-GRS)","區域備援儲存體 (ZRS)","本地備援儲存體 (LRS)"],
 a:[1],
 e:"「次要位置也能讀取」是決勝條件：GRS 的次要位置平常不能直接讀取，只有 RA-GRS 額外開放次要位置的唯讀存取，同時仍滿足多節點與跨地理位置。ZRS 只在同一地區內的多個可用性區域複寫，不是跨地理區域；LRS 只在單一資料中心複寫。",
 en:{q:"Which of the following Azure stored redundancy options should you recommend?",
  o:["Geo-redundant storage","Read-only geo-redundant storage","Zone-redundant storage","Locally redundant storage"],
  e:"RA-GRS is the only option offering readable secondary-location access alongside multi-node, cross-region replication."}},

{n:339, code:"AZ104-Q339", d:1, od:1, t:"Azure AD 加入不需要哪個條件", tEn:"What Azure AD Join does NOT require", k:"mc",
 src:"quiz10:html",
 q:"⟦部署 Azure AD 加入 (Azure AD Join) 時，以下哪一項不是必要條件？⟧",
 o:["一個 Azure AD 訂用帳戶","一個 Azure AD Premium 訂用帳戶","行動裝置管理 (MDM)","部署 Azure AD Connect"],
 a:[3],
 e:"Azure AD Connect 是用來把「內部部署 Active Directory」跟 Azure AD 同步的元件，屬於混合共存情境才需要；Azure AD 加入（讓裝置直接加入雲端的 Azure AD，屬於純雲端情境，跟地端網域無關）不需要它。Azure AD 訂用帳戶是基本要求；Premium 訂用帳戶在需要更進階功能（例如 MDM 自動註冊）時才需要；行動裝置管理（如 Intune）在需要管理裝置合規性等情境下也是常見需求，都比 Azure AD Connect 更直接相關。",
 en:{q:"What is not a requirement to deploy Azure AD Join?",
  o:["An Azure AD subscription","An Azure AD Premium subscription","Mobile device management","A deployment of Azure AD Connect"],
  e:"Azure AD Connect syncs an on-premises AD with Azure AD (hybrid scenario); Azure AD Join itself is a pure cloud scenario and doesn't require it."}},

{n:340, code:"AZ104-Q340", d:2, od:3, t:"查看部署範本", tEn:"Viewing the template used for a deployment", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q185~Q187 是同一組情境的重複解法題。\n同事 Jon Ross 用一份 ARM 範本部署了一台虛擬機器與一個新的儲存體帳戶。你想查看他用的那份範本。\n⟦解法：到「虛擬機器」刀鋒選單查看。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。部署歷程（含範本）記錄在資源群組層級，不在個別虛擬機器資源上。",
 en:{q:"Solution: You access the Virtual Machine blade. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Deployment history is tracked at the resource group level."}},

{n:341, code:"AZ104-Q341", d:2, od:3, t:"查看部署範本", tEn:"Viewing the template used for a deployment", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q185~Q187、Q340 情境完全相同，只是提出的解法不同。\n（情境同 Q340。）⟦解法：到「資源群組」刀鋒選單查看。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。到資源群組刀鋒選單點「部署」，選取那一次部署再點「檢視範本」，就能看到當時用的完整範本。",
 en:{q:"Solution: You access the Resource Group blade. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. The Deployments blade under the resource group lets you view the template used."}},

{n:342, code:"AZ104-Q342", d:2, od:3, t:"查看部署範本", tEn:"Viewing the template used for a deployment", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q185~Q187、Q340、Q341 情境完全相同，只是提出的解法不同。\n（情境同 Q340。）⟦解法：到「容器 (Container)」刀鋒選單查看。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。Blob 容器的刀鋒選單管理的是容器內的物件，跟這次部署的範本紀錄無關。",
 en:{q:"Solution: You access the Container blade. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. The blob container blade is unrelated to deployment history."}},

{n:343, code:"AZ104-Q343", d:3, od:4, t:"讓流量先經過虛擬設備", tEn:"Routing traffic through a virtual appliance first", k:"mc",
 src:"quiz10:html",
 q:"你有好幾台虛擬機器，流量必須先經過一個自訂的防火牆虛擬設備過濾。⟦以下哪個方式最適合用來讓流量先導向這個虛擬設備，再到達你的虛擬機器？⟧",
 o:["使用者定義路由 (User-defined routes)","網路安全性群組","Azure Traffic Manager","Azure 應用程式閘道"],
 a:[0],
 e:"使用者定義路由（UDR）可以覆寫 Azure 預設的路由規則，把原本要直接送到目的地虛擬機器的流量，改成先繞道送到指定的下一躍點（這裡是防火牆虛擬設備的 IP），設備檢查/過濾完再繼續送到真正的目的地，正是這種「強迫流量先經過某個檢查點」情境的標準做法。NSG 只能允許或拒絕流量，不能「導流」到別的設備；Traffic Manager 是 DNS 層級的跨地區流量導向；應用程式閘道是第 7 層負載平衡/WAF，不是通用的流量重導向機制。",
 en:{q:"Which of the following is the best way to direct traffic through the virtual appliance before it reaches your virtual machines?",
  o:["User-defined routes","Network security groups","Azure Traffic Manager","Azure Application Gateway"],
  e:"A user-defined route overrides default routing to send traffic to the appliance as a next hop before reaching the destination VMs."}},

{n:344, code:"AZ104-Q344", d:2, od:3, t:"調整可用性設定組裡的 VM 大小", tEn:"Resizing a VM inside an Availability Set", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q188 是同一組情境的重複題。\n你公司有三台虛擬機器，都在同一個可用性設定組裡。你嘗試調整其中一台的大小，收到配置失敗的錯誤訊息，但必須成功完成這次調整。⟦你應該怎麼做？⟧",
 o:["只需要停止其中一台虛擬機器","停止其中兩台虛擬機器","停止全部三台虛擬機器","把要調整的虛擬機器從可用性設定組移除"],
 a:[2],
 e:"同一個可用性設定組裡所有執行中的虛擬機器，必須共用同一組實體硬體叢集；要調整到需要不同硬體的規格，必須先把「整個可用性設定組」的所有虛擬機器都停止，才能進行調整，調整完再逐一重新啟動。",
 en:{q:"Which of the following actions should you take?",
  o:["You should only stop one of the VMs.","You should stop two of the VMs.","You should stop all three VMs.","You should remove the necessary VM from the availability set."],
  e:"All VMs in an Availability Set share the same hardware cluster; resizing to different hardware requires stopping all of them."}},

{n:345, code:"AZ104-Q345", d:2, od:3, t:"把容器化應用程式部署到 AKS 的步驟", tEn:"Steps to deploy a containerized app to AKS", k:"mc",
 src:"quiz10:html",
 q:"你已經把應用程式容器化、放進 Azure Container Registry，建立了映像檔並推送到登錄中心，也建立了一個 AKS 叢集。現在你要把這個容器化的應用程式部署到 AKS 叢集上。⟦你需要完成哪三個步驟？⟧（選 3 個答案）",
 o:["取得憑證，讓 kubectl 指令可以對 Kubernetes 叢集做驗證","建立一份宣告所需 Kubernetes 資源的清單檔 (manifest file)","在叢集裡建立這些資源","建立一個服務主體，讓叢集能跟 Azure 資源互動"],
 a:[0,1,2],
 e:"要部署應用程式到已經存在的 AKS 叢集，依序要：先取得叢集認證（`az aks get-credentials`），讓本機的 kubectl 能對這個叢集做身分驗證；接著寫一份宣告要用到哪些 Kubernetes 資源（Deployment、Service 等）的清單檔（YAML）；最後用 `kubectl apply` 把清單檔套用進叢集，建立出這些資源。「建立服務主體」是叢集本身「被建立、佈建」時就要先準備好的前置條件（或由 AKS 自動代為建立），不是部署應用程式這個階段要做的事，題目也明確排除它。",
 en:{q:"Now you want to deploy the containerized application onto your AKS cluster. Which three steps do you need to complete? (Choose 3 answers)",
  o:["Get credentials to authenticate kubectl commands sent to the Kubernetes cluster.","Create a manifest file declaring the required Kubernetes resources.","Create the resources in the cluster","Create a service principal to allow your cluster to interact with Azure resources"],
  e:"Get cluster credentials, write a manifest, then apply it to create the resources; the service principal must already exist for cluster provisioning, not this deployment step."}},

{n:346, code:"AZ104-Q346", d:2, od:2, t:"搬移資料磁碟到另一台 VM（來源分歧的一題）", tEn:"Moving a data disk to another VM (a known source discrepancy)", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q189 情境完全相同（同一個題目、同樣四個選項），但兩份來源標記的正確答案不同，屬於已知的來源分歧，見解析。\n你有一台 Azure 虛擬機器 (VM)，掛接了一顆資料磁碟，你要把這顆資料磁碟改掛到另一台虛擬機器。⟦解決方案必須讓虛擬機器離線的時間降到最低，你應該最先做什麼？⟧",
 o:["停止掛著這顆資料磁碟的虛擬機器","停止要掛接這顆資料磁碟的目的地虛擬機器","卸離這顆資料磁碟","刪除掛著這顆資料磁碟的虛擬機器"],
 a:[0],
 e:"本題（Quiz10 來源）標記的正確答案是「先停止掛著資料磁碟的來源虛擬機器」，理由是：如果有服務正在對這顆磁碟寫入資料，直接線上卸離可能導致資料寫到一半被中斷、造成毀損，先停機能確保卸離時磁碟資料是完整、一致的狀態。\n不過同樣的情境在 AZ104-Q189（Quiz5 來源）裡，標記的正確答案卻是「直接卸離磁碟」（不需要先停機），理由是現代 Azure 平台支援線上卸離資料磁碟，能把離線時間降到最低。\n這是題庫本身的來源分歧（兩個不同的 ExamTopics 抄錄版本给出不同的社群票選答案），兩種說法各有依據：「先停機」更保守、確保資料一致性；「直接卸離」更符合題目字面要求的「離線時間降到最低」。忠實依本卷來源標記為準，但請注意這一題在不同版本的考古題裡有爭議。",
 en:{q:"Which of the following is the action you should take FIRST?",
  o:["Stop the VM that includes the data disk.","Stop the VM that the data disk must be attached to.","Detach the data disk.","Delete the VM that includes the data disk."],
  e:"This source marks \"stop the source VM first\" as correct (to avoid corrupting in-flight writes during detach). Note: the same scenario in Q189 (a different source) marks \"detach directly\" as correct instead, prioritizing minimal downtime — a known discrepancy between dump versions."}},

{n:347, code:"AZ104-Q347", d:3, od:5, t:"用 Webhook 通知自訂應用程式", tEn:"Using a webhook to notify a custom application", k:"mc",
 src:"quiz10:html",
 q:"公司在 Azure 上跑了一個 .NET 網頁應用程式，要求：只要發生異常活動（例如頁面請求速率異常飆高），就要通知一個自訂應用程式，以便相應處理。⟦以下哪個選項符合這個需求？⟧",
 o:["在 Azure 儀表板建立警示，並設定電子郵件警示，讓自訂應用程式去收信件內容","寫一支自訂的 PowerShell 工具，檢查應用程式的請求速率，再據此通知自訂應用程式","建立一個警示，用 Webhook 功能把通知送給自訂應用程式","寫一支自訂工具，持續監控並檢查應用程式的請求速率，再送出警示給自訂應用程式"],
 a:[2],
 e:"Webhook 可以把 Azure 警示通知直接路由到其他系統，讓那個系統做後續處理或自訂動作，是最直接、標準化的做法，大多數自訂系統都支援接收 Webhook。用電子郵件的話，還要額外解析郵件內容才能餵給自訂應用程式，多一道轉換；自己寫 PowerShell 或監控工具重新實作一套偵測與通知邏輯，等於重造輪子，管理成本高，不是理想做法。",
 en:{q:"Which option below meets this requirement?",
  o:["Create an alert in the Azure dashboard and configure the email alert. Ensure the custom application consumes the email alerts.","Create a custom powershell utility to check the application request rate and then alerts the custom application accordingly.","Create an alert and use the Webhook functionality to send the notification to the custom application.","Create a custom utility that monitors and checks the application request rate and then sends the alert to the custom application."],
  e:"Webhooks route an Azure alert notification directly to other systems for custom post-processing — the standard, low-effort approach."}},

{n:348, code:"AZ104-Q348", d:2, od:3, t:"容錯網域數設成最大值", tEn:"Setting fault domain count to maximum", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q190 是同一組情境的重複題。\n你需要用 ARM 範本把多台虛擬機器部署進同一個可用性設定組，⟦解決方案必須讓「發生硬體故障或維護時，能維持連線的虛擬機器數量」盡量多⟧。你應該把 platformFaultDomainCount 屬性設定成什麼值？",
 o:["10","30","最小值 (Min Value)","最大值 (Max Value)"],
 a:[3],
 e:"容錯網域數量越多，代表 VM 分散到越多組獨立硬體，單一硬體故障影響到的比例就越低。每個地區支援的容錯網域數不同（通常 2 或 3），要設成該地區支援的「最大值」，而不是寫死某個可能超出實際上限的數字，也不是設成最小值。",
 en:{q:"Which of the following is the value that you should configure for the platformFaultDomainCount property?",
  o:["10","30","Min Value","Max Value"],
  e:"Use the maximum fault domain count the region supports to maximize resilience."}},

{n:349, code:"AZ104-Q349", d:1, od:1, t:"用 Azure Policy 控制資源屬性", tEn:"Using Azure Policy to control resource properties", k:"mc",
 src:"quiz10:html",
 q:"用 ARM 範本部署資源時，⟦哪個功能可以讓你在組織內控制部署時的資源屬性？⟧",
 o:["Active Directory","API Management","Azure Policy","資源標記 (Resource tags)"],
 a:[2],
 e:"Azure Policy 讓你替組織裡的資源建立慣例規範，指定什麼情況下要套用哪種效果（例如只允許特定類型的虛擬機器、要求所有資源都要有特定標記），藉此控制成本、更容易管理資源。Active Directory 是身分服務；API Management 是管理 API 閘道用的服務；資源標記本身只是中繼資料，不會主動「控制」部署時的屬性（要搭配 Policy 的 Modify 效果才能強制套用）。",
 en:{q:"When using Azure Resource Manager (ARM) templates, what feature enables you to control resource properties during deployment in your organization?",
  o:["Active Directory","API Management","Azure Policy","Resource tags"],
  e:"Azure Policy establishes conventions and enforces effects on resource properties across the organization."}},

{n:350, code:"AZ104-Q350", d:2, od:3, t:"更新網域數設定", tEn:"Setting the update domain count", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q191 是同一組情境的重複題。\n（情境同 Q348：要讓維持連線的 VM 數量盡量多。）⟦你應該把 platformUpdateDomainCount 屬性設定成什麼值？⟧",
 o:["10","20","30","40"],
 a:[1],
 e:"可用性設定組預設有 5 個不可調整的更新網域，透過 Resource Manager 部署時 platformUpdateDomainCount 可以調高到最多 20 個，網域數越多，計畫性維護時同一時間受影響的 VM 比例越低，20 是目前支援的上限。",
 en:{q:"Which of the following is the value that you should configure for the platformUpdateDomainCount property?",
  o:["10","20","30","40"],
  e:"The property supports up to 20 update domains, the current maximum, minimizing simultaneous reboot impact."}},

{n:351, code:"AZ104-Q351", d:2, od:3, t:"擴展集依虛擬機器內部度量自動調整", tEn:"Scale set autoscale based on in-guest metrics", k:"mc",
 src:"quiz10:html",
 q:"⟦要讓 Azure 擴展集 (Scale Set) 依照虛擬機器「內部」的度量做自動調整，應該啟用哪個擴充功能？⟧",
 o:["Azure 診斷擴充功能 (Diagnostics Extension)","Azure DCS 擴充功能","Azure VM 擴充功能","Azure 自訂指令碼擴充功能"],
 a:[0],
 e:"自動調整功能要能運作，前提是每台虛擬機器都要能成功收集到度量資料；Azure 診斷擴充功能提供的監控與診斷能力，正好滿足自動調整資源所需要的度量收集需求（例如 VM 內部的 CPU、記憶體等客體層級數據），是這裡要啟用的擴充功能。其餘選項要嘛不是真實存在對應這個用途的擴充功能名稱，要嘛用途不符（自訂指令碼擴充功能是拿來跑安裝腳本的，不是收集度量）。",
 en:{q:"What extension should be enabled for Azure Scale sets to auto scale based on in-guest virtual machine metrics?",
  o:["Azure Diagnostics Extension","Azure DCS Extension","Azure VM Extension","Azure Custom Script Extension"],
  e:"Automatic scaling requires metrics collection from each VM, provided by the Azure Diagnostics Extension."}},

{n:352, code:"AZ104-Q352", d:2, od:2, t:"跨地端與雲端共用檔案", tEn:"Sharing files across on-premises and cloud VMs", k:"mc",
 src:"quiz10:html",
 q:"你公司有虛擬機器同時架設在 Azure 與內部部署，需要在這些虛擬機器之間共用檔案。⟦哪一種儲存體選項最符合這個需求？⟧",
 o:["用 Blob 儲存體存放檔案","用檔案儲存體 (File storage) 存放檔案","用資料表儲存體 (Table storage) 存放檔案","用佇列儲存體 (Queue storage) 存放檔案"],
 a:[1],
 e:"Azure 檔案儲存體是專門設計給「檔案共用」情境用的儲存體服務，透過標準 SMB 2.1 通訊協定公開檔案共用，內部部署的檔案也可以直接複製進 Azure 檔案儲存體，之後不管是 Azure 上的虛擬機器還是（透過 VPN/ExpressRoute 連線的）內部部署機器，都能像掛網路磁碟機一樣直接存取，正符合跨地端與雲端共用檔案的需求。Blob、資料表、佇列儲存體都不支援用檔案系統／SMB 的方式直接掛載存取。",
 en:{q:"Which storage option would best meet this requirement?",
  o:["Store the files using Blob storage.","Store the files using File storage.","Store the files using Table storage.","Store the files using Queue storage."],
  e:"Azure File storage exposes SMB file shares that both Azure and on-premises machines can mount directly."}},

{n:353, code:"AZ104-Q353", d:2, od:3, t:"新 VM 開機時自動跑腳本", tEn:"Running a script automatically on new VMs at first boot", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q192 是同一組情境的重複題。\n公司的內部部署虛擬環境跑在 Windows Server 2012 R2 Hyper-V 主機上，你寫了 PowerShell 指令碼要自動設定新建立的虛擬機器，打算建立好幾台新 VM，⟦需要一套方案確保這些指令碼會在新虛擬機器上執行⟧。以下哪個是最好的解法？",
 o:["在 %windir%\\setup\\scripts 目錄設定一個 SetupComplete.cmd 批次檔","設定一個群組原則物件 (GPO)，把指令碼當成登入腳本執行","設定一個群組原則物件 (GPO)，把指令碼當成啟動腳本執行","把指令碼放進一個新的虛擬硬碟 (VHD)"],
 a:[0],
 e:"把批次檔命名為 SetupComplete.cmd、放在 %windir%\\setup\\scripts 目錄下，Windows 安裝程式在每次部署新機器、安裝完成階段就會自動執行它，時機比「登入」或「開機」都更早、更確定（不依賴網域環境的原則套用時機）。",
 en:{q:"Which of the following is the best solution?",
  o:["Configure a SetupComplete.cmd batch file in the %windir%\\setup\\scripts directory.","Configure a Group Policy Object (GPO) to run the scripts as logon scripts.","Configure a Group Policy Object (GPO) to run the scripts as startup scripts.","Place the scripts in a new virtual hard disk (VHD)."],
  e:"SetupComplete.cmd runs automatically as Windows Setup finishes, earlier and more reliably than GPO logon/startup scripts."}},

{n:354, code:"AZ104-Q354", d:2, od:3, t:"晚上關機才能真正省錢", tEn:"Only deallocation stops billing overnight", k:"mc",
 src:"quiz10:html",
 q:"你是很在意成本的 IT 系統管理員，想在晚上把虛擬機器關掉省錢。⟦以下哪個是建議的做法？⟧",
 o:["寫一個作業系統層級的腳本，在系統內部關閉執行個體，讓 VM 狀態變成「已停止 (Stopped)」","從 Azure 入口網站或用 Azure Automation 停止虛擬機器，讓狀態變成「已停止（解除配置）」","不管是用作業系統腳本關機、還是用 Azure 入口網站關機都可以，只要狀態是「已停止」或「已停止（解除配置）」就好","用 Azure 命令列介面停止虛擬機器，讓狀態變成「已停止」"],
 a:[1],
 e:"只有虛擬機器狀態顯示「已停止（解除配置，Stopped Deallocated）」時，運算資源才會真正釋放、不再計費；如果只是在作業系統內部關機（狀態停在「已停止 (Stopped)」但沒有解除配置），底層配置的運算核心其實還留著，一樣會繼續計費。要達到真正省錢的效果，必須透過 Azure 入口網站或 Azure Automation 執行「停止」動作（觸發解除配置），而不是單純在作業系統裡關機。",
 en:{q:"What is a recommended method to do this?",
  o:["Create an operating system script that will turn off instances at the OS level, resulting in the VM state \"Stopped.\"","Stop VMs from the Azure portal or using Azure Automation, resulting in the VM state \"Stopped (Deallocated)\"","Shutting down your VMs either through an operating system script or using the Azure Portal will work, as long as the VM state is \"Stopped\" or \"Stopped (Deallocated).","Stop VMs using Azure Command Line Interface, resulting in the VM state \"Stopped.\""],
  e:"Only the \"Stopped (Deallocated)\" state releases compute resources and stops billing; an OS-level shutdown alone still leaves the VM allocated and billed."}},

{n:355, code:"AZ104-Q355", d:2, od:3, t:"上傳一般化的映像磁碟", tEn:"Uploading a generalized image disk", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q193 是同一組情境的重複題。\n公司打算在 Azure 部署好幾台作業系統與客製化軟體都相同的新虛擬機器，已經在內部部署設定了一台參考虛擬機器並一般化成映像。你需要把這個映像上傳到 Azure，讓建立新 Azure VM 時可以選用。⟦你應該使用哪個 PowerShell 指令程式？⟧",
 o:["Add-AzVM","Add-AzVhd","Add-AzImage","Add-AzImageDataDisk"],
 a:[1],
 e:"Add-AzVhd 指令程式專門把內部部署的 .vhd 檔案上傳成 Azure 儲存體帳戶裡的一顆固定大小虛擬硬碟，是把已一般化的參考機映像搬上 Azure 的標準做法。",
 en:{q:"Which PowerShell cmdlets should you use?",
  o:["Add-AzVM","Add-AzVhd","Add-AzImage","Add-AzImageDataDisk"],
  e:"Add-AzVhd uploads an on-premises .vhd file to blob storage as a fixed-size virtual hard disk."}},

{n:356, code:"AZ104-Q356", d:2, od:3, t:"低成本執行夜間背景工作", tEn:"Low-cost nightly background job", k:"mc",
 src:"quiz10:html",
 q:"你的主管想知道，怎麼樣最好地每晚啟動一個主控台應用程式，把上傳到某個 App Service Web 應用程式的檔案抓下來、放進 Blob 儲存體，⟦成本與管理成本都要考量進去⟧。⟦依你所知，哪個服務最適合？⟧",
 o:["WebJobs","Azure 邏輯應用程式","Azure Functions","Azure Automation"],
 a:[0],
