{sec:"S1", no:28, d:4, t:"AG 接聽程式的健康探查", tEn:"Health probe for an AG listener",
 q:"注意：本題與另外數題的情境完全相同，但每一題提出的解法不同，請個別判斷解法是否達成目標。\n你的公司在 Azure 虛擬機器（VM）上設定了 ⟦Microsoft SQL Server Always On 可用性群組⟧。\n你需要把一個⟦ Azure 內部負載平衡器設定成該可用性群組的接聽程式（listener）⟧。\n⟦解法：你在通訊埠 1433 上建立一個 HTTP 健康探查⟧。這個解法是否達成目標？",
 o:["是","否"],
 a:[1],
 e:"這個解法錯兩件事：**探查的協定錯了，探查的通訊埠也錯了。**\n先把 SQL Always On 可用性群組接聽程式需要的負載平衡器設定整組列出來：\n・**健康探查**：協定要用 **TCP**，通訊埠要用一個**專用的探查埠**（慣例是 59999），**不是** SQL 的 1433。原因是探查要問的是「這個節點現在是不是主要複本」，而回答這件事的是叢集在探查埠上開的接聽器；1433 上的 SQL 服務在次要複本上也是活的，用 1433 探查會讓每個節點都回報健康，流量就會被送到次要複本去。\n・**協定為什麼不能用 HTTP**：SQL Server 不是網頁服務，1433 上沒有 HTTP 端點，HTTP 探查永遠拿不到 200，所有節點都會被判定為不健康，接聽程式直接不通。HTTP／HTTPS 探查是給 App Service、IIS 這類有 URL 可以打的工作負載用的。\n・**負載平衡規則**：前端是接聽程式的 IP、後端集區是所有可用性群組的節點、通訊埠 1433 對 1433。\n・**浮動 IP（Floating IP，也叫 Direct Server Return）必須啟用**——這是接聽程式能運作的關鍵，見 `S1#30`。\n・**工作階段持續性**設成「無（None）」，見 `S1#29`。\n所以正確的探查是「TCP、埠 59999」。答案是「否」。\n記法：三個數字別搞混——**1433 是負載平衡規則的埠、59999 是健康探查的埠、探查協定一律 TCP**。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company has a ⟦Microsoft SQL Server Always On availability group⟧ configured on their Azure virtual machines (VMs).\nYou need to ⟦configure an Azure internal load balancer as a listener for the availability group⟧.\n⟦Solution: You create an HTTP health probe on port 1433⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"This solution gets two things wrong: **the probe protocol and the probe port.**\nThe full set of load balancer settings an Always On availability group listener needs:\n・**Health probe**: protocol must be **TCP**, on a **dedicated probe port** (59999 by convention), **not** SQL's 1433. The probe's real question is 'is this node currently the primary replica', and what answers it is the listener the cluster opens on the probe port. The SQL service on 1433 is alive on secondary replicas too, so probing 1433 makes every node report healthy and traffic gets sent to secondaries.\n・**Why not HTTP**: SQL Server is not a web service and there is no HTTP endpoint on 1433, so an HTTP probe never gets a 200, every node is marked unhealthy, and the listener simply does not work. HTTP/HTTPS probes are for workloads with a URL to hit, like App Service or IIS.\n・**Load balancing rule**: frontend is the listener IP, backend pool is all AG nodes, port 1433 to 1433.\n・**Floating IP (Direct Server Return) must be enabled** — the key to making the listener work; see `S1#30`.\n・**Session persistence** set to None; see `S1#29`.\nSo the correct probe is TCP on port 59999. The answer is No.\nMnemonic: keep the three numbers apart — **1433 is the load balancing rule port, 59999 is the health probe port, and the probe protocol is always TCP**."}},

{sec:"S1", no:29, d:4, t:"AG 接聽程式的工作階段持續性", tEn:"Session persistence for an AG listener",
 q:"注意：本題與另外數題的情境完全相同，但每一題提出的解法不同，請個別判斷解法是否達成目標。\n你的公司在 Azure 虛擬機器（VM）上設定了 ⟦Microsoft SQL Server Always On 可用性群組⟧。\n你需要把一個⟦ Azure 內部負載平衡器設定成該可用性群組的接聽程式（listener）⟧。\n⟦解法：你把工作階段持續性（Session persistence）設成用戶端 IP（Client IP）⟧。這個解法是否達成目標？",
 o:["是","否"],
 a:[1],
 e:"工作階段持續性（在 Azure 文件裡也叫工作階段親和性、分佈模式）決定**同一個用戶端的連線要不要固定送到同一台後端**。整組選項如下：\n・**無（None，五元組雜湊）** — 依來源 IP、來源埠、目的 IP、目的埠、協定五個值做雜湊，每一條新連線各自決定去哪台。**可用性群組接聽程式要用這個。**\n・**用戶端 IP（兩元組雜湊）** — 只看來源 IP 與目的 IP，同一個用戶端 IP 的所有連線都固定到同一台後端。\n・**用戶端 IP 與協定（三元組雜湊）** — 再加上協定。\n為什麼可用性群組不能用「用戶端 IP」：接聽程式要送到的是**當下的主要複本**，而主要複本會因為容錯移轉而換機器。決定該去哪一台的機制是**健康探查**——只有主要複本會在探查埠上回應。持續性設成用戶端 IP 之後，負載平衡器會想把同一個用戶端釘在原本那台上，跟「跟著主要複本走」的需求直接衝突；容錯移轉之後連線可能還是被導向已經變成次要複本的那台。\n這一組三題的完整正確設定：\n・健康探查 — **TCP、埠 59999**（不是 HTTP、不是 1433，見 `S1#28`）\n・負載平衡規則 — 1433 對 1433\n・**浮動 IP — 啟用**（正解，見 `S1#30`）\n・**工作階段持續性 — 無**\n・閒置逾時 — 建議調高（例如 30 分鐘），避免長查詢被切斷\n所以把持續性設成用戶端 IP 不但沒幫助，還會造成問題。答案是「否」。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company has a ⟦Microsoft SQL Server Always On availability group⟧ configured on their Azure virtual machines (VMs).\nYou need to ⟦configure an Azure internal load balancer as a listener for the availability group⟧.\n⟦Solution: You set Session persistence to Client IP⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"Session persistence (also called session affinity or distribution mode in the docs) decides **whether connections from the same client always go to the same backend**. The full set of options:\n・**None (five-tuple hash)** — hashes source IP, source port, destination IP, destination port and protocol, so each new connection is placed independently. **This is what an availability group listener needs.**\n・**Client IP (two-tuple hash)** — hashes source and destination IP only, pinning all connections from one client IP to one backend.\n・**Client IP and protocol (three-tuple hash)** — adds the protocol.\nWhy an availability group must not use Client IP: the listener must reach the **current primary replica**, and which machine that is changes on failover. What decides the destination is the **health probe** — only the primary responds on the probe port. Setting persistence to Client IP makes the load balancer try to pin a client to the machine it used before, which directly conflicts with 'follow the primary'; after a failover, connections can still be steered at a node that is now a secondary.\nThe complete correct configuration for this set of questions:\n・Health probe — **TCP on port 59999** (not HTTP, not 1433; see `S1#28`)\n・Load balancing rule — 1433 to 1433\n・**Floating IP — enabled** (the correct solution; see `S1#30`)\n・**Session persistence — None**\n・Idle timeout — raise it (e.g. 30 minutes) so long queries are not cut off\nSo setting persistence to Client IP not only fails to help, it causes problems. The answer is No."}},

{sec:"S1", no:30, d:4, t:"AG 接聽程式的浮動 IP", tEn:"Floating IP for an AG listener",
 q:"注意：本題與另外數題的情境完全相同，但每一題提出的解法不同，請個別判斷解法是否達成目標。\n你的公司在 Azure 虛擬機器（VM）上設定了 ⟦Microsoft SQL Server Always On 可用性群組⟧。\n你需要把一個⟦ Azure 內部負載平衡器設定成該可用性群組的接聽程式（listener）⟧。\n⟦解法：你啟用浮動 IP（Floating IP）⟧。這個解法是否達成目標？",
 o:["是","否"],
 a:[0],
 e:"這是這一組三題裡唯一達成目標的解法。**浮動 IP 是可用性群組接聽程式能運作的必要條件。**\n浮動 IP（又稱 Direct Server Return，DSR）改變的是負載平衡器如何處理目的位址：\n・**關閉浮動 IP（預設）** — 負載平衡器做目的位址轉譯：把封包的目的 IP 改寫成後端 VM 自己的私人 IP 再送進去。VM 看到的目的位址是自己的 IP。\n・**啟用浮動 IP** — **不改寫目的位址**，封包帶著接聽程式的 IP 原封不動送到後端 VM。VM 必須自己在某個網路介面上擁有那個 IP，才會收下這個封包。\n為什麼可用性群組非它不可：Always On 接聽程式的機制是 **Windows 容錯移轉叢集在主要複本節點上把接聽程式的 IP 綁在本機**（叢集資源）。容錯移轉時，這個 IP 會從舊的主要複本卸下、綁到新的主要複本上。所以封包必須以「接聽程式的 IP」為目的位址送到節點，節點才認得。如果負載平衡器把目的位址改寫成節點自己的私人 IP，SQL Server 的接聽程式端點就對不上，連線失敗。\n整組必要設定（三題合起來看）：\n・健康探查 — TCP、埠 59999（`S1#28` 的 HTTP／1433 是錯的）\n・工作階段持續性 — 無（`S1#29` 的用戶端 IP 是錯的）\n・**浮動 IP — 啟用**（本題，正解）\n・負載平衡規則 — 1433 對 1433，後端集區含所有複本節點\n・節點上要放叢集的探查埠接聽器，並把 `ProbePort` 設進叢集資源\n答案是「是」。\n記法：**接聽程式的 IP 由叢集綁在節點上，所以負載平衡器不能改目的位址** → 一定要開浮動 IP。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company has a ⟦Microsoft SQL Server Always On availability group⟧ configured on their Azure virtual machines (VMs).\nYou need to ⟦configure an Azure internal load balancer as a listener for the availability group⟧.\n⟦Solution: You enable Floating IP⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"This is the only solution of the three that meets the goal. **Floating IP is a hard requirement for an availability group listener.**\nFloating IP (also called Direct Server Return, DSR) changes how the load balancer treats the destination address:\n・**Floating IP off (default)** — the load balancer performs destination address translation, rewriting the packet's destination IP to the backend VM's own private IP. The VM sees its own address as the destination.\n・**Floating IP on** — the destination address is **not rewritten**; the packet arrives at the backend VM still addressed to the listener IP. The VM must itself own that IP on one of its interfaces to accept the packet.\nWhy an availability group cannot do without it: an Always On listener works by having the **Windows Failover Cluster bind the listener IP locally on the primary replica node** as a cluster resource. On failover, that IP is taken off the old primary and bound to the new one. So packets must arrive at the node addressed to the *listener IP* for the node to recognise them. If the load balancer rewrote the destination to the node's own private IP, it would not match SQL Server's listener endpoint and the connection would fail.\nThe complete set of required settings, taking all three questions together:\n・Health probe — TCP on port 59999 (`S1#28`'s HTTP on 1433 is wrong)\n・Session persistence — None (`S1#29`'s Client IP is wrong)\n・**Floating IP — enabled** (this question; correct)\n・Load balancing rule — 1433 to 1433, backend pool containing all replica nodes\n・A cluster probe-port listener on the nodes, with `ProbePort` set on the cluster resource\nThe answer is Yes.\nMnemonic: **the listener IP is bound on the node by the cluster, so the load balancer must not rewrite the destination** → Floating IP must be on."}},

{sec:"S1", no:31, d:4, t:"設定靜態私人 IP", tEn:"Setting a static private IP",
 q:"你的公司有兩台本地端伺服器，名為 SRV01 與 SRV02。開發人員寫了一個在 SRV01 上執行的應用程式，這個應用程式會⟦以 IP 位址⟧呼叫 SRV02 上的服務。\n你打算把這個應用程式移轉到 Azure 虛擬機器（VM）。你已在一個 Azure 虛擬網路的單一子網路裡設定了兩台 VM。\n你需要為這兩台 VM 設定⟦靜態的內部（私人）IP 位址⟧。你應該怎麼做？",
 o:["執行 New-AzureRMVMConfig PowerShell Cmdlet","執行 Set-AzureSubnet PowerShell Cmdlet","在 Azure 管理入口網站修改 VM 的屬性","在 Windows 的「網路和共用中心」修改 IP 屬性","執行 Set-AzureStaticVNetIP PowerShell Cmdlet"],
 a:[4],
 e:"先講一個**觀念性的大坑**：Azure VM 的私人 IP **絕對不要在客體作業系統裡設定**。\nAzure 的 DHCP 是位址的唯一權威來源。在 Windows 的「網路和共用中心」（或 Linux 的網路設定檔）手動填一個靜態 IP，只會讓客體 OS 的設定與 Azure 平台記錄的位址脫鉤——平台仍然認為那個 IP 是動態配置的，隨時可能配給別人；而且一旦 VM 被解除配置再啟動、拿到不同的位址，客體裡寫死的 IP 就完全連不上了。**正確做法一律是在 Azure 這一層把配置方式改成靜態**，客體 OS 繼續用 DHCP 自動取得。\n所以選項 D 是本題最重要的排除項——它看起來最直覺，但是實務上最糟的做法。\n其餘選項：\n・New-AzureRMVMConfig — 建立一個 VM 設定物件（後續餵給 New-AzureRmVM），跟指派靜態 IP 沒有直接關係。\n・Set-AzureSubnet — 動的是子網路層級的設定，不是單一 VM 的位址。\n・在入口網站修改 **VM** 的屬性 — 位址是掛在**網路介面（NIC）的 IP 設定**上，不在 VM 的屬性裡。入口網站的正確路徑是 VM →「網路」→ 點那張 NIC →「IP 設定」→ 選 ipconfig →「配置」改成「靜態」。\n・Set-AzureStaticVNetIP — 正解（依原始文件的標記）。\n⚠️ **這一題的 Cmdlet 已經過時。** `Set-AzureStaticVNetIP` 屬於早已淘汰的**傳統（Classic／ASM）**部署模型，用法是 `Get-AzureVM … | Set-AzureStaticVNetIP -IPAddress 192.168.4.7 | Update-AzureVM`。現行 Resource Manager 的做法是：\n・PowerShell：取得 NIC → `$nic.IpConfigurations[0].PrivateIpAllocationMethod = \"Static\"` → `Set-AzNetworkInterface`\n・Azure CLI：`az network nic ip-config update --private-ip-address 10.0.0.10 …`\n考試若給的是現行選項，要選 NIC／IP 設定那一條，不是這個舊 Cmdlet。",
 en:{q:"Your company has two on-premises servers named SRV01 and SRV02. Developers have created an application that runs on SRV01. The application calls a service on SRV02 ⟦by IP address⟧.\nYou plan to migrate the application on Azure virtual machines (VMs). You have configured two VMs on a single subnet in an Azure virtual network.\nYou need to configure the two VMs with ⟦static internal IP addresses⟧. What should you do?",
     o:["Run the New-AzureRMVMConfig PowerShell cmdlet.","Run the Set-AzureSubnet PowerShell cmdlet.","Modify the VM properties in the Azure Management Portal.","Modify the IP properties in Windows Network and Sharing Center.","Run the Set-AzureStaticVNetIP PowerShell cmdlet."],
     e:"First, a **conceptual trap**: never set an Azure VM's private IP inside the guest OS.\nAzure's DHCP is the single authority for addresses. Typing a static IP into Windows Network and Sharing Center (or a Linux network config file) only decouples the guest's setting from the address Azure has on record — the platform still considers that IP dynamically allocated and may hand it to someone else; and once the VM is deallocated and started again on a different address, the hard-coded guest IP becomes completely unreachable. **The correct approach is always to change the allocation method to Static at the Azure layer**, leaving the guest OS on DHCP.\nSo option D is the most important one to eliminate here: it looks the most intuitive and is the worst practice.\nThe rest:\n・New-AzureRMVMConfig — builds a VM configuration object (later fed to New-AzureRmVM); nothing directly to do with assigning a static IP.\n・Set-AzureSubnet — operates at subnet level, not on one VM's address.\n・Modifying the **VM** properties in the portal — the address lives on the **network interface's IP configuration**, not among the VM's properties. The correct portal path is VM → Networking → the NIC → IP configurations → the ipconfig → set Assignment to Static.\n・Set-AzureStaticVNetIP — correct, per the source document's marking.\n⚠️ **This cmdlet is obsolete.** `Set-AzureStaticVNetIP` belongs to the long-retired **Classic (ASM)** deployment model, used as `Get-AzureVM … | Set-AzureStaticVNetIP -IPAddress 192.168.4.7 | Update-AzureVM`. The current Resource Manager approach is:\n・PowerShell: get the NIC → `$nic.IpConfigurations[0].PrivateIpAllocationMethod = \"Static\"` → `Set-AzNetworkInterface`\n・Azure CLI: `az network nic ip-config update --private-ip-address 10.0.0.10 …`\nIf an exam offers the modern options, pick the NIC/IP-configuration route rather than this legacy cmdlet."}},

{sec:"S1", no:32, d:4, t:"最少需要幾張網路介面", tEn:"Minimum number of network interfaces",
 q:"你的公司有一個 Azure Active Directory（Azure AD）訂用帳戶。\n你需要把⟦五台虛擬機器（VM）⟧部署到公司虛擬網路的子網路裡。\n這些 VM 每一台都要同時有⟦一個公用 IP 和一個私人 IP⟧位址，而且所有這些虛擬機器的⟦入口與出口安全性規則必須完全相同⟧。\n下列哪一個是這個設定所需的⟦最少網路介面數量⟧？",
 o:["5","10","20","40"],
 a:[0],
 e:"關鍵在釐清「公用 IP 與私人 IP 的關係」——很多人以為要兩張網卡，其實不用。\nAzure 網路介面（NIC）的結構是這樣的：\n・一台 VM 至少要有 **1 張 NIC**（NIC 的數量上限依 VM 大小而定）。\n・一張 NIC 底下可以有一個或多個 **IP 設定（ipConfiguration）**。\n・**每一個 IP 設定必定有一個私人 IP，並且可以選擇性關聯一個公用 IP。**\n所以「同時有公用 IP 和私人 IP」是**同一個 IP 設定**上的兩個欄位，不是兩張網卡、也不是兩個 IP 設定。一台 VM 用 1 張 NIC、1 個 IP 設定就同時具備公用與私人位址。\n五台 VM × 每台 1 張 NIC ＝ **5 張**，正解是選項 A。\n其他選項是怎麼來的（都是常見的誤解）：\n・10 — 誤以為公用 IP 與私人 IP 各要一張 NIC（5 × 2）。\n・20 — 再多乘上入口／出口規則各一張（5 × 2 × 2）。\n・40 — 再乘一次。\n順帶把相關上限記一下：\n・NIC 數量上限依 VM 大小而定（例如 Standard_D2 是 2 張、D8 是 4 張），**不是想加幾張就幾張**。\n・**VM 建立之後不能加減 NIC 數量**，必須先停止並解除配置。\n・同一台 VM 的多張 NIC 必須位於同一個虛擬網路，但可以在不同子網路。\n・多 NIC 的常見用途是把管理流量與資料流量分開，或是網路虛擬設備（防火牆）需要內外兩側介面——本題沒有這種需求。\n延伸：下一題（`S1#33`）問同一個情境需要幾個安全性群組，答案是 1 個，靠的是「規則完全相同」這個條件。",
 en:{q:"Your company has an Azure Active Directory (Azure AD) subscription.\nYou need to deploy ⟦five virtual machines (VMs)⟧ to your company's virtual network subnet.\nThe VMs will each have both ⟦a public and a private IP address⟧. ⟦Inbound and outbound security rules for all of these virtual machines must be identical⟧.\nWhich of the following is the ⟦least amount of network interfaces⟧ needed for this configuration?",
     o:["5","10","20","40"],
     e:"The key is understanding how public and private IPs relate — many people assume two NICs are needed, and they are not.\nAn Azure network interface (NIC) is structured like this:\n・A VM needs at least **1 NIC** (the maximum depends on VM size).\n・A NIC can hold one or more **IP configurations (ipConfiguration)**.\n・**Every IP configuration has exactly one private IP and may optionally have one public IP associated with it.**\nSo 'both a public and a private IP' is two fields on the **same IP configuration** — not two NICs, and not even two IP configurations. One NIC with one IP configuration gives a VM both addresses.\nFive VMs × 1 NIC each = **5**, so option A is correct.\nWhere the other options come from (all common misconceptions):\n・10 — assuming a separate NIC for the public and the private IP (5 × 2).\n・20 — multiplying again for inbound and outbound rules (5 × 2 × 2).\n・40 — multiplying once more.\nWorth remembering the related limits:\n・The NIC ceiling depends on VM size (e.g. 2 for Standard_D2, 4 for D8) — you cannot simply add as many as you like.\n・**The number of NICs cannot be changed after the VM is created** without stopping and deallocating it first.\n・Multiple NICs on one VM must be in the same virtual network but may be in different subnets.\n・The usual reasons for multiple NICs are separating management from data traffic, or a network virtual appliance (firewall) needing inside and outside interfaces — neither applies here.\nRelated: the next question (`S1#33`) asks how many security groups the same scenario needs; the answer is 1, thanks to the 'rules must be identical' condition."}},

{sec:"S1", no:33, d:4, t:"最少需要幾個安全性群組", tEn:"Minimum number of security groups",
 q:"你的公司有一個 Azure Active Directory（Azure AD）訂用帳戶。\n你需要把⟦五台虛擬機器（VM）⟧部署到公司虛擬網路的子網路裡。\n這些 VM 每一台都要同時有一個公用 IP 和一個私人 IP 位址，而且所有這些虛擬機器的⟦入口與出口安全性規則必須完全相同⟧。\n下列哪一個是這個設定所需的⟦最少安全性群組數量⟧？",
 o:["4","3","2","1"],
 a:[3],
 e:"這一題的關鍵條件是「**所有 VM 的規則完全相同**」，而且五台 VM 都在**同一個子網路**裡。\n網路安全性群組（NSG）的關鍵性質：\n・**一個 NSG 可以同時關聯到多個子網路與多張 NIC**，不是一對一。所以規則相同的資源共用一個 NSG 就好。\n・NSG **同時包含入口與出口規則**，不需要為兩個方向各建一個。這是本題最容易踩的誤解。\n・關聯層級有兩種：**子網路**與**網路介面**。兩層都掛的話，入口流量先過子網路的 NSG 再過 NIC 的 NSG，出口反過來——兩層都要放行才通。\n・每個 NSG 預設就有六條無法刪除的規則（優先權 65000–65500）：允許 VNet 內部互通、允許 Azure 負載平衡器探查、拒絕其他所有入口；出口則允許 VNet 內部與網際網路、拒絕其他所有。自訂規則的優先權 100–4096，數字小的先套用。\n本題把一個 NSG 關聯到那個子網路，五台 VM 就同時套用相同的入口與出口規則，所以**最少 1 個**，正解是選項 D。\n其他選項是怎麼來的：\n・2 — 誤以為入口與出口要各一個 NSG。\n・3、4 — 再往上疊各種誤解（例如每個方向再乘上 NIC 層與子網路層）。\n實務建議：規則相同就掛在**子網路**層級，不要逐張 NIC 掛。新加入子網路的 VM 會自動繼承，不必記得補設定；而且要查有效規則時只有一層要看。\n延伸：需要按角色分組（例如網頁層／資料層）而不想寫死 IP 時，用**應用程式安全性群組（ASG）**當 NSG 規則的來源／目的，就能維持單一個 NSG 又區分角色。",
 en:{q:"Your company has an Azure Active Directory (Azure AD) subscription.\nYou need to deploy ⟦five virtual machines (VMs)⟧ to your company's virtual network subnet.\nThe VMs will each have both a public and a private IP address. ⟦Inbound and outbound security rules for all of these virtual machines must be identical⟧.\nWhich of the following is the ⟦least amount of security groups⟧ needed for this configuration?",
     o:["4","3","2","1"],
     e:"The binding condition is that **the rules must be identical for all the VMs**, and all five VMs are in the **same subnet**.\nKey properties of a network security group (NSG):\n・**One NSG can be associated with many subnets and many NICs at once** — it is not one-to-one. Resources needing the same rules can share a single NSG.\n・An NSG **contains both inbound and outbound rules**; you do not need one per direction. That is the misconception this question targets.\n・There are two association levels: **subnet** and **network interface**. If both are used, inbound traffic passes the subnet NSG then the NIC NSG, and outbound the other way round — both layers must allow it.\n・Every NSG starts with six undeletable default rules (priorities 65000–65500): allow VNet-inbound, allow Azure Load Balancer probes, deny all other inbound; outbound allows VNet and internet and denies the rest. Custom rules use priorities 100–4096, lower numbers evaluated first.\nAssociating one NSG with the subnet gives all five VMs the same inbound and outbound rules, so the minimum is **1** — option D.\nWhere the other options come from:\n・2 — assuming one NSG per direction.\n・3 and 4 — stacking further misconceptions on top (e.g. multiplying each direction by the NIC and subnet layers).\nPractical advice: when the rules are identical, associate at the **subnet** level rather than per NIC. VMs added to the subnet later inherit it automatically, and there is only one layer to inspect when checking effective rules.\nRelated: when you need to differentiate by role (web tier vs data tier) without hard-coding IPs, use **application security groups (ASGs)** as the source or destination of NSG rules, keeping a single NSG while still distinguishing roles."}},

{sec:"S1", no:34, d:5, t:"即時還原檔案復原", tEn:"Instant Restore file recovery",
 q:"你的公司的 Azure 訂用帳戶裡有跑 Windows Server 2016 的 Azure 虛擬機器（VM）。\n其中一台 VM 每天都用 ⟦Azure Backup 即時還原（Instant Restore）⟧備份。\n當這台 VM 被會加密資料的⟦勒索軟體⟧感染時，你決定要復原這台 VM 的⟦檔案⟧。\n下列哪一項在這個情境下是⟦正確⟧的？",
 o:["你只能把檔案復原到被感染的那台 VM","你可以把檔案復原到公司訂用帳戶內的任何一台 VM","你只能把檔案復原到一台新的 VM","你將無法復原這些檔案"],
 a:[1],
 e:"Azure Backup 的還原方式分成兩大類，這一題問的是**檔案層級**那一類：\n・**檔案復原（File recovery，逐檔還原）** — 從入口網站選一個復原點，按「檔案復原」下載一個指令碼（Windows 是 .exe、Linux 是 .py），**在任何一台機器上執行**。指令碼會把復原點以 iSCSI 掛載成本機磁碟，你就能像瀏覽普通磁碟一樣挑檔案複製出來，完成後按「解除掛載磁碟」。執行指令碼的機器只需要作業系統相容、有網路連得到，**不必是原本那台 VM**，也不限於新建的 VM。所以正解是「訂用帳戶內的任何一台 VM」。\n・**整機還原（Restore VM）** — 建立一台新 VM，或把磁碟換掉。這一類的限制比較多，見下一題 `S1#35`。\n關於**即時還原**：它會在快照建立後直接保留在 VM 所在的資源群組裡（預設保留 2 天，可設 1–5 天），不必等資料傳輸到保存庫就能還原，所以復原速度快很多。它影響的是「多快能還原」，不影響「能還原到哪裡」。\n逐一排除其他選項：\n・只能復原到被感染的那台 VM — 錯，而且在勒索軟體情境下這樣做很危險（那台機器還是被入侵的狀態）。\n・只能復原到一台新的 VM — 這是**整機還原**的限制（`S1#35`），不是檔案復原的限制。這兩題就是靠這個差異互相當干擾項。\n・無法復原 — 錯。備份存在保存庫裡，勒索軟體加密的是 VM 上的資料，動不到保存庫。\n實務提醒：勒索軟體事件要把檔案復原到一台**乾淨的**機器，不要還原回被感染的主機。保存庫本身也建議開啟軟刪除與 MUA（多使用者授權）防止備份被一併刪掉。",
 en:{q:"Your company's Azure subscription includes Azure virtual machines (VMs) that run Windows Server 2016.\nOne of the VMs is backed up every day using ⟦Azure Backup Instant Restore⟧.\nWhen the VM becomes infected with data encrypting ⟦ransomware⟧, you decide to recover the VM's ⟦files⟧.\nWhich of the following is ⟦TRUE⟧ in this scenario?",
     o:["You can only recover the files to the infected VM.","You can recover the files to any VM within the company's subscription.","You can only recover the files to a new VM.","You will not be able to recover the files."],
     e:"Azure Backup restores fall into two families, and this question is about the **file-level** one:\n・**File recovery (item-level restore)** — pick a recovery point in the portal, choose File Recovery, and download a script (.exe on Windows, .py on Linux) that you **run on any machine**. The script mounts the recovery point as local disks over iSCSI, so you can browse and copy out individual files, then click Unmount Disks when done. The machine running the script only needs a compatible OS and network access — it **does not have to be the original VM**, nor a newly created one. Hence 'any VM within the subscription' is correct.\n・**Whole-VM restore** — create a new VM or replace disks. This family has more restrictions; see the next question, `S1#35`.\nAbout **Instant Restore**: snapshots are retained in the VM's own resource group right after they are taken (2 days by default, configurable 1–5), so a restore can start without waiting for the data to transfer to the vault, making recovery much faster. It affects *how fast* you can restore, not *where to*.\nRuling out the other options:\n・Only to the infected VM — wrong, and in a ransomware scenario dangerous, since that machine is still compromised.\n・Only to a new VM — that is the restriction on **whole-VM restore** (`S1#35`), not on file recovery. These two questions use that difference as each other's distractor.\n・Unable to recover — wrong. The backups live in the vault; the ransomware encrypted data on the VM and cannot touch the vault.\nPractical note: in a ransomware incident, recover files to a **clean** machine rather than back onto the infected host. Also enable soft delete and multi-user authorisation on the vault so the backups themselves cannot simply be deleted."}},

{sec:"S1", no:35, d:5, t:"勒索軟體後還原整台 VM", tEn:"Restoring a whole VM after ransomware",
 q:"你的公司的 Azure 訂用帳戶裡有跑 Windows Server 2016 的 Azure 虛擬機器（VM）。\n其中一台 VM 每天都用 ⟦Azure Backup 即時還原（Instant Restore）⟧備份。\n當這台 VM 被會加密資料的⟦勒索軟體⟧感染時，你被要求要⟦還原這台 VM⟧。\n你應該採取下列哪一個動作？",
 o:["先刪除被感染的 VM，然後還原這台 VM","把這台 VM 還原到公司訂用帳戶內的任何一台 VM","把這台 VM 還原到一台新的 Azure VM","把這台 VM 還原到一台本地端 Windows 裝置"],
 a:[2],
 e:"這一題與前一題（`S1#34`）的差別只有一個字：前一題還原的是**檔案**，這一題還原的是**整台 VM**。兩者的限制完全不同。\nAzure Backup 對 VM 的還原選項整組列出：\n・**建立新的虛擬機器（Create new VM）** — 從復原點直接建出一台新 VM，指定名稱、資源群組、虛擬網路與子網路。**本題正解。**\n・**還原磁碟（Restore disks）** — 只把磁碟還原到指定的儲存體帳戶／資源群組，之後你自己用範本或 PowerShell 把 VM 組起來。適合需要客製 VM 設定（大小、擴充功能、可用性設定組）的情況。\n・**取代現有（Replace existing）** — 把原本那台 VM 的磁碟換成復原點的磁碟。原 VM 必須還存在，而且**只支援未加密的受控磁碟 VM**。\n・**跨區域還原（Cross Region Restore）** — 還原到配對區域，需要保存庫啟用 GRS 且開啟 CRR。\n逐一檢視選項：\n・先刪除被感染的 VM 再還原 — 沒必要，而且**是錯的順序**：刪掉 VM 會失去它的設定與網路關聯，而還原本來就可以直接建一台新的並存。在鑑識上也應該先保留被感染的機器（隔離而非刪除）。\n・還原到「任何一台 VM」 — 這是**檔案復原**的能力（`S1#34`），整機還原沒有「還原到某台既有 VM」這個選項；最接近的是「取代現有」，那也只能取代**原本那一台**，不是任意一台。\n・還原到一台新的 Azure VM — 正解。\n・還原到本地端 Windows 裝置 — Azure VM 的備份還原目標一律在 Azure 裡。要把資料落地只能走檔案復原把檔案抓下來。\n勒索軟體情境的正確處置順序：**隔離被感染的 VM（NSG 封鎖、不要急著刪）→ 挑一個感染前的復原點 → 還原成一台新的 VM → 確認乾淨後再切換流量**。",
 en:{q:"Your company's Azure subscription includes Azure virtual machines (VMs) that run Windows Server 2016.\nOne of the VMs is backed up every day using ⟦Azure Backup Instant Restore⟧.\nWhen the VM becomes infected with data encrypting ⟦ransomware⟧, you are required to ⟦restore the VM⟧.\nWhich of the following actions should you take?",
     o:["You should restore the VM after deleting the infected VM.","You should restore the VM to any VM within the company's subscription.","You should restore the VM to a new Azure VM.","You should restore the VM to an on-premise Windows device."],
     e:"This question differs from the previous one (`S1#34`) by a single word: that one restored **files**, this one restores the **whole VM**. The restrictions are quite different.\nThe full set of Azure Backup VM restore options:\n・**Create new VM** — build a new VM straight from the recovery point, specifying name, resource group, virtual network and subnet. **The answer here.**\n・**Restore disks** — restore only the disks to a chosen storage account / resource group, then assemble the VM yourself with a template or PowerShell. Suits cases needing custom VM settings (size, extensions, availability set).\n・**Replace existing** — swap the original VM's disks for the recovery point's disks. The original VM must still exist, and this **only supports unencrypted managed-disk VMs**.\n・**Cross Region Restore** — restore into the paired region; requires a GRS vault with CRR enabled.\nTaking the options in turn:\n・Deleting the infected VM first — unnecessary and **the wrong order**: deleting it loses its configuration and network associations, while a restore can simply create a new VM alongside. Forensically you should also preserve the infected machine (isolate, do not delete).\n・Restoring 'to any VM' — that is what **file recovery** can do (`S1#34`); whole-VM restore has no 'restore onto an existing VM of your choice' option. The closest is Replace existing, and that only replaces **the original** VM, not an arbitrary one.\n・Restoring to a new Azure VM — correct.\n・Restoring to an on-premises Windows device — Azure VM backup restores always land in Azure. Getting data on-premises means using file recovery to copy files out.\nThe correct ransomware sequence: **isolate the infected VM (block with NSG, do not rush to delete) → pick a pre-infection recovery point → restore as a new VM → verify it is clean before cutting traffic over.**"}},

{sec:"S1", no:36, d:5, t:"查基礎結構計量的工具", tEn:"Tool for infrastructure metrics",
 q:"你管理一個 Azure 上的解決方案，目前有⟦效能問題⟧。\n你需要從 ⟦Azure 基礎結構的計量（metrics）⟧找出效能問題的原因。\n下列哪一個是你應該使用的工具？",
 o:["Azure 流量分析（Azure Traffic Analytics）","Azure 監視器（Azure Monitor）","Azure 活動記錄（Azure Activity Log）","Azure Advisor"],
 a:[1],
 e:"關鍵字是「**計量（metrics）**」。把 Azure 的監控與建議工具整組分清楚，各自回答不同的問題：\n・**Azure 監視器（Azure Monitor）** — 監控的總入口，收兩大類資料：\n　・**計量（Metrics）** — 有時間戳記的數值，存在時間序列資料庫裡，粒度細（可到一分鐘）、查詢快，適合警示與快速找出問題。CPU、記憶體、磁碟 IOPS、網路輸送量、要求延遲都在這裡。**本題正解。**\n　・**記錄（Logs）** — 存進 Log Analytics 工作區，用 KQL 查詢，適合關聯分析與複雜查詢。\n・**Azure 活動記錄（Activity Log）** — 記的是**控制平面的操作**：誰在什麼時候建立／修改／刪除了哪個資源、服務健康事件。它回答「發生了什麼變更」，**不含效能計量**。\n・**Azure 流量分析（Traffic Analytics）** — 建立在 NSG 流量記錄之上，分析虛擬網路裡的流量樣式、熱門通訊對象、惡意流量。只看網路流量，不看 VM 的 CPU 或磁碟。\n・**Azure Advisor** — 依最佳做法給**建議**（成本、安全性、可靠性、效能、卓越營運）。它給的是「你應該改什麼」，不是即時的效能數據；而且它的效能建議是事後歸納，不能拿來診斷當下的問題。\n本題要的是基礎結構的效能數據，答案是 Azure 監視器。\n判斷訣竅：\n・出現「計量／metrics、CPU、延遲、輸送量、警示」→ **Azure Monitor**\n・出現「誰做了什麼、建立／刪除、稽核」→ **活動記錄**\n・出現「NSG 流量記錄、通訊樣式」→ **流量分析**\n・出現「建議、最佳做法、省錢」→ **Advisor**\n補充：VM 的客體作業系統內部計量（記憶體用量、磁碟剩餘空間）**預設不會出現在 Azure Monitor 的計量裡**，要另外安裝 Azure Monitor Agent 並設定資料收集規則才收得到。",
 en:{q:"You administer a solution in Azure that is currently having ⟦performance issues⟧.\nYou need to find the cause of the performance issues pertaining to ⟦metrics on the Azure infrastructure⟧.\nWhich of the following is the tool you should use?",
     o:["Azure Traffic Analytics","Azure Monitor","Azure Activity Log","Azure Advisor"],
     e:"The keyword is **metrics**. Separating Azure's monitoring and advisory tools, each answers a different question:\n・**Azure Monitor** — the umbrella entry point for monitoring, collecting two broad data types:\n　・**Metrics** — timestamped numeric values held in a time-series database: fine-grained (down to one minute), fast to query, well suited to alerting and quickly spotting problems. CPU, memory, disk IOPS, network throughput and request latency all live here. **The answer.**\n　・**Logs** — stored in a Log Analytics workspace and queried with KQL, suited to correlation and complex queries.\n・**Azure Activity Log** — records **control-plane operations**: who created, modified or deleted which resource and when, plus service health events. It answers 'what changed', and contains **no performance metrics**.\n・**Azure Traffic Analytics** — built on NSG flow logs; analyses traffic patterns in a virtual network, top talkers and malicious flows. Network traffic only — nothing about VM CPU or disk.\n・**Azure Advisor** — offers **recommendations** against best practices (cost, security, reliability, performance, operational excellence). It tells you what to change rather than giving live performance data, and its performance advice is retrospective, so it cannot diagnose a problem happening now.\nThis question wants infrastructure performance data, so the answer is Azure Monitor.\nRules of thumb:\n・'metrics, CPU, latency, throughput, alerts' → **Azure Monitor**\n・'who did what, created/deleted, audit' → **Activity Log**\n・'NSG flow logs, communication patterns' → **Traffic Analytics**\n・'recommendations, best practices, save money' → **Advisor**\nFurther: metrics from inside a VM's guest OS (memory usage, free disk space) **do not appear in Azure Monitor metrics by default** — you must install the Azure Monitor Agent and configure a data collection rule to gather them."}},

{sec:"S1", no:37, d:5, t:"Azure Backup 支援哪些 VM", tEn:"What Azure Backup supports",
 q:"你的公司有一個 Azure 訂用帳戶，裡面有一個 ⟦Recovery Services 保存庫⟧。\n你想用 Azure Backup 排程把公司的虛擬機器（VM）備份到這個 Recovery Services 保存庫。\n下列哪些 VM ⟦可以⟧備份？請選出所有適用的項目。",
 o:["跑 Windows 10 的 VM","跑 Windows Server 2012 或更新版本的 VM","還沒有關機的 VM（執行中）","跑 Debian 8.2+ 的 VM","已經關機的 VM"],
 a:[0,1,2,3,4],
 e:"這一題的答案是**全部五項都可以**，考的是「Azure Backup 的支援範圍比你想的寬」。逐項對照官方支援矩陣：\n・**Windows 10** — 支援。Azure Backup 支援 64 位元的 Windows 用戶端作業系統，Windows 10 在內。很多人以為備份只做伺服器版，這是第一個誤解。\n・**Windows Server 2012 或更新版本** — 支援。實際上支援範圍更寬，從 **Windows Server 2008 R2** 起（64 位元）都可以，所以「2012 或更新」當然涵蓋在內。\n・**沒有關機的 VM（執行中）** — 支援，而且這是常態。備份用的是 VM 快照，**執行中不需要停機**；Windows 靠 VSS 取得應用程式一致的快照，Linux 則可以用備份前後指令碼達到應用程式一致，否則是檔案系統一致。\n・**Debian 8.2+** — 支援。Azure Backup 支援的 Debian 從 **7.9+** 起算，8.2 在範圍內。（背後的認可散發套件清單還包含 Ubuntu、RHEL、SUSE、CentOS、Oracle Linux 等。）\n・**已經關機的 VM** — 支援。**已停止／已解除配置的 VM 也備份得起來**，只是取得的是**當機一致（crash-consistent）**的復原點，不是應用程式一致。這是第二個常見誤解——很多人以為 VM 關機就備份不了。\n所以五項全選。\n順便記一下真正**不支援**的邊界（考試更常考這些）：\n・單一 VM 每天最多備份 **9 次**（Azure VM 備份原則每天最多 1 次排程＋手動）。\n・**超過 32 TB 的磁碟**、以及某些超大型磁碟組態。\n・不支援備份**未受控（非受控）磁碟的部分情境**與 Ultra Disk（部分區域已支援，以文件為準）。\n・保存庫與要備份的 VM **必須在同一個區域**。\n・一台 VM **同一時間只能註冊到一個保存庫**。\n作答提醒：這是複選題，練習頁要求**剛好選滿 5 項**才能批改，這與原廠考試「選滿才放行」的行為一致。",
 en:{q:"Your company has an Azure subscription that includes a ⟦Recovery Services vault⟧.\nYou want to use Azure Backup to schedule a backup of your company's virtual machines (VMs) to the Recovery Services vault.\nWhich of the following VMs ⟦can you back up⟧? Choose all that apply.",
     o:["VMs that run Windows 10.","VMs that run Windows Server 2012 or higher.","VMs that have NOT been shut down.","VMs that run Debian 8.2+.","VMs that have been shut down."],
     e:"The answer is **all five**, and the point being tested is that Azure Backup's support envelope is wider than people assume. Against the official support matrix:\n・**Windows 10** — supported. Azure Backup covers 64-bit Windows client operating systems, Windows 10 included. Many assume backup is server-only; that is misconception one.\n・**Windows Server 2012 or higher** — supported. In fact the envelope is wider still, starting at **Windows Server 2008 R2** (64-bit), so '2012 or higher' is comfortably inside it.\n・**VMs that have NOT been shut down (running)** — supported, and this is the normal case. Backup uses a VM snapshot and needs **no downtime**; Windows gets an application-consistent snapshot via VSS, while Linux can reach application consistency with pre/post scripts and is otherwise file-system consistent.\n・**Debian 8.2+** — supported. Azure Backup supports Debian from **7.9+**, so 8.2 is within range. (The wider endorsed-distribution list also covers Ubuntu, RHEL, SUSE, CentOS and Oracle Linux.)\n・**VMs that have been shut down** — supported. **Stopped/deallocated VMs can be backed up**, though the recovery point is **crash-consistent** rather than application-consistent. That is misconception two — many assume a shut-down VM cannot be backed up.\nSo all five are selected.\nWorth memorising the genuine **limits** instead, since exams lean on these:\n・At most **9 backups per day** for a single VM (one scheduled plus on-demand, per Azure VM backup policy).\n・**Disks larger than 32 TB** and certain very large disk configurations.\n・Some unmanaged-disk scenarios and Ultra Disk (support varies by region; check the docs).\n・The vault and the VM **must be in the same region**.\n・A VM **can only be registered to one vault at a time**.\nAnswering note: this is a multi-select, and the practice page requires **exactly 5 selections** before it will grade — matching the real exam's behaviour of not letting you proceed until the required count is met."}},

{sec:"S1", no:38, d:1, t:"批次建立來賓使用者", tEn:"Bulk-creating guest users",
 q:"注意：本題屬於一系列情境相同的題目，每一題各自提出一個可能達成目標的解法。有些題組可能有多個正確解法，也有些可能沒有正確解法。\n在原廠考試中，回答本節的題目之後就**不能再回頭修改**，這些題目也不會出現在複習畫面上。\n你有一個名為 contoso.com 的 Azure Active Directory（Azure AD）租用戶。\n你有一個 CSV 檔，裡面是 ⟦500 位外部使用者⟧的名字與電子郵件地址。\n你需要在 contoso.com 裡為這 500 位外部使用者各建立一個⟦來賓使用者帳戶（guest user account）⟧。\n⟦解法：你寫一個 PowerShell 指令碼，對每一位使用者執行 New-AzureADUser Cmdlet⟧。這樣是否達成目標？",
 o:["是","否"],
 a:[1],
 e:"關鍵在「**來賓**使用者帳戶」這四個字。Azure AD 的使用者依 `userType` 分成兩種，建立方式完全不同：\n・**成員（Member）** — 屬於這個租用戶自己的使用者，在租用戶裡有密碼、由本租用戶負責驗證。用 **`New-AzureADUser`**（現行是 `New-MgUser`）建立，必須指定 `UserPrincipalName` 與密碼設定檔。\n・**來賓（Guest）** — 由**別的**目錄或任何電子郵件帳戶驗證的外部身分，透過 B2B 邀請加進來。用 **`New-AzureADMSInvitation`**（現行是 `New-MgInvitation`）建立，指定 `InvitedUserEmailAddress` 與 `InviteRedirectUrl`，Azure AD 會寄出邀請並在對方接受後建立來賓物件。\n所以本題的解法用錯了 Cmdlet：`New-AzureADUser` 建出來的是**成員**帳戶，而且它需要密碼與 UPN，對「外部使用者只有 email」的情境根本不適用。答案是「否」。\n這一組題目的三個解法對照：\n・`New-AzureADUser`（本題）— 建成員，不是來賓。**否。**\n・入口網站的「大量建立使用者（Bulk create user）」（`S1#39`）— 同樣是建**成員**。要邀來賓在入口網站得用「大量邀請使用者（Bulk invite users）」那個不同的作業。**否。**\n・`New-AzureADMSInvitation`（`S1#40`）— 正確的 B2B 邀請 Cmdlet。**是。**\n記法：**建自己人用 `…ADUser`／`…MgUser`；邀外部人用 `…Invitation`。** 看到「guest」「external」「B2B」就要找 Invitation。\n附帶一提：AzureAD 與 MSOnline 模組已於 2024 年停止支援，現在一律改用 Microsoft Graph PowerShell（`New-MgInvitation`）。考題仍沿用舊名稱。",
 en:{q:"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.\nIn the real exam you will NOT be able to return to a question in this section after answering it, and these questions do not appear in the review screen.\nYou have an Azure Active Directory (Azure AD) tenant named contoso.com.\nYou have a CSV file that contains the names and email addresses of ⟦500 external users⟧.\nYou need to create a ⟦guest user account⟧ in contoso.com for each of the 500 external users.\n⟦Solution: You create a PowerShell script that runs the New-AzureADUser cmdlet for each user⟧. Does this meet the goal?",
     o:["Yes","No"],
     e:"Everything turns on the word **guest**. Azure AD users come in two `userType` flavours, created quite differently:\n・**Member** — a user belonging to this tenant, with a password here, authenticated by this tenant. Created with **`New-AzureADUser`** (today `New-MgUser`), requiring a `UserPrincipalName` and a password profile.\n・**Guest** — an external identity authenticated by **another** directory or any email account, brought in through a B2B invitation. Created with **`New-AzureADMSInvitation`** (today `New-MgInvitation`), specifying `InvitedUserEmailAddress` and `InviteRedirectUrl`; Azure AD sends the invitation and creates the guest object once it is accepted.\nSo this solution uses the wrong cmdlet: `New-AzureADUser` produces a **member** account, and it needs a password and UPN, which does not fit 'external users for whom we only have an email address'. The answer is No.\nThe three solutions in this set:\n・`New-AzureADUser` (this question) — creates members, not guests. **No.**\n・The portal's Bulk create user operation (`S1#39`) — also creates **members**. Inviting guests in the portal requires the separate Bulk invite users operation. **No.**\n・`New-AzureADMSInvitation` (`S1#40`) — the correct B2B invitation cmdlet. **Yes.**\nMnemonic: **your own people use `…ADUser`/`…MgUser`; external people use `…Invitation`.** Whenever you see 'guest', 'external' or 'B2B', look for Invitation.\nAside: the AzureAD and MSOnline modules were retired in 2024; the current route is Microsoft Graph PowerShell (`New-MgInvitation`). Exam questions still use the old names."}},

{sec:"S1", no:39, d:1, t:"批次建立來賓使用者", tEn:"Bulk-creating guest users",
 q:"注意：本題屬於一系列情境相同的題目，每一題各自提出一個可能達成目標的解法。有些題組可能有多個正確解法，也有些可能沒有正確解法。\n在原廠考試中，回答本節的題目之後就**不能再回頭修改**，這些題目也不會出現在複習畫面上。\n你有一個名為 contoso.com 的 Azure Active Directory（Azure AD）租用戶。\n你有一個 CSV 檔，裡面是 ⟦500 位外部使用者⟧的名字與電子郵件地址。\n你需要在 contoso.com 裡為這 500 位外部使用者各建立一個⟦來賓使用者帳戶（guest user account）⟧。\n⟦解法：你在 Azure 入口網站的 Azure AD 裡使用「大量建立使用者（Bulk create user）」作業⟧。這樣是否達成目標？",
 o:["是","否"],
 a:[1],
 e:"這個解法的方向對了（用批次作業處理 500 筆），但**選錯了作業**。\nAzure 入口網站的 Azure AD →「使用者」底下有好幾個看起來很像的大量作業，各自做不同的事：\n・**大量建立使用者（Bulk create user）** — 上傳 CSV 建立**成員**帳戶。CSV 必填欄位是名稱、使用者主要名稱（UPN）、初始密碼。**這是本題的解法，建出來的是成員不是來賓。**\n・**大量邀請使用者（Bulk invite users）** — 上傳 CSV 送出 **B2B 邀請**，建立**來賓**帳戶。CSV 必填欄位是電子郵件地址與重新導向 URL。**這才是本題該用的作業。**\n・大量更新使用者、大量刪除使用者 — 顧名思義。\n・大量下載使用者 — 匯出清單。\n題目給的資料是「名字與電子郵件地址」，沒有 UPN 也沒有密碼——這正好對應「大量邀請」需要的欄位，也再一次說明要建的是來賓。用「大量建立」不但型別錯，CSV 欄位也對不上。答案是「否」。\n這一組三個解法對照：\n・`New-AzureADUser`（`S1#38`）— 建成員。否。\n・入口網站「大量建立使用者」（本題）— 建成員。否。\n・`New-AzureADMSInvitation`（`S1#40`）— B2B 邀請，建來賓。是。\n記法：入口網站裡 **create ＝ 自己人、invite ＝ 外部人**；PowerShell 裡 **ADUser ＝ 自己人、Invitation ＝ 外部人**。兩邊的字都一樣分。\n附帶一提：大量作業每次上限 **50,000 筆**，所以 500 筆一次就送得完；作業是非同步的，可以在「大量作業結果」頁面看進度與失敗清單。",
 en:{q:"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.\nIn the real exam you will NOT be able to return to a question in this section after answering it, and these questions do not appear in the review screen.\nYou have an Azure Active Directory (Azure AD) tenant named contoso.com.\nYou have a CSV file that contains the names and email addresses of ⟦500 external users⟧.\nYou need to create a ⟦guest user account⟧ in contoso.com for each of the 500 external users.\n⟦Solution: From Azure AD in the Azure portal, you use the Bulk create user operation⟧. Does this meet the goal?",
     o:["Yes","No"],
     e:"The instinct is right — use a bulk operation for 500 rows — but **the wrong operation is chosen**.\nUnder Azure AD → Users the portal offers several similar-looking bulk operations that do different things:\n・**Bulk create user** — upload a CSV to create **member** accounts. The required CSV columns are name, user principal name (UPN) and initial password. **This is the solution offered here, and it creates members, not guests.**\n・**Bulk invite users** — upload a CSV to send **B2B invitations**, creating **guest** accounts. The required CSV columns are email address and redirect URL. **This is the operation the question needs.**\n・Bulk update users, Bulk delete users — as their names suggest.\n・Bulk download users — export the list.\nThe data given is 'names and email addresses' — no UPN and no password — which matches exactly what Bulk invite needs, another hint that guests are wanted. Bulk create is wrong both in the object type it produces and in the CSV columns it expects. The answer is No.\nThe three solutions in this set:\n・`New-AzureADUser` (`S1#38`) — creates members. No.\n・Portal Bulk create user (this question) — creates members. No.\n・`New-AzureADMSInvitation` (`S1#40`) — B2B invitation, creates guests. Yes.\nMnemonic: in the portal, **create = your own people, invite = external people**; in PowerShell, **ADUser = your own people, Invitation = external people**. The wording splits the same way on both sides.\nAside: bulk operations accept up to **50,000 rows** at a time, so 500 goes in one pass; the operation is asynchronous and you can watch progress and failures on the Bulk operation results page."}},

 q:"注意：本題屬於一系列情境相同的題目，每一題各自提出一個可能達成目標的解法。有些題組可能有多個正確解法，也有些可能沒有正確解法。\n在原廠考試中，回答本節的題目之後就**不能再回頭修改**，這些題目也不會出現在複習畫面上。\n你有一個名為 contoso.com 的 Azure Active Directory（Azure AD）租用戶。\n你有一個 CSV 檔，裡面是 ⟦500 位外部使用者⟧的名字與電子郵件地址。\n你需要在 contoso.com 裡為這 500 位外部使用者各建立一個⟦來賓使用者帳戶（guest user account）⟧。\n⟦解法：你寫一個 PowerShell 指令碼，對每一位外部使用者執行 New-AzureADMSInvitation Cmdlet⟧。這樣是否達成目標？",

 e:"這是這一組三題裡唯一達成目標的解法。`New-AzureADMSInvitation` 就是 Azure AD **B2B 邀請**專用的 Cmdlet，用途正是「把一個外部使用者邀請進你的目錄」，建出來的物件 `userType` 就是 **Guest**。\n典型用法：\n```\nImport-Csv .\\users.csv | ForEach-Object {\n  New-AzureADMSInvitation `\n    -InvitedUserEmailAddress $_.Email `\n    -InvitedUserDisplayName  $_.Name `\n    -InviteRedirectUrl \"https://myapps.microsoft.com\" `\n    -SendInvitationMessage  $true\n}\n```\n・`InvitedUserEmailAddress` — 外部使用者的電子郵件，也是他的登入身分。\n・`InviteRedirectUrl` — 對方接受邀請後要導到哪裡（必填）。\n・`SendInvitationMessage` — 要不要真的寄出邀請信；設 `$false` 就只建立邀請並回傳 `InviteRedeemUrl`，由你自己發送。\n題目給的資料剛好就是「名字＋電子郵件」，與這個 Cmdlet 需要的欄位完全對上，不需要 UPN 也不需要密碼，因為驗證是由對方的家目錄負責。答案是「是」。\n這一組三個解法回顧：\n・`New-AzureADUser`（`S1#38`）— 建**成員**，還要 UPN 與密碼。否。\n・入口網站「大量建立使用者」（`S1#39`）— 也是建**成員**；要邀來賓得用「大量邀請使用者」。否。\n・`New-AzureADMSInvitation`（本題）— 正解。\n記法：**Invitation ＝ 外部人／來賓／B2B**，這是三題唯一的差異點。\n附帶一提：AzureAD 模組已於 2024 年停止支援，現行做法是 Microsoft Graph PowerShell 的 `New-MgInvitation`，參數名稱幾乎一樣（`-InvitedUserEmailAddress`、`-InviteRedirectUrl`）。另外要注意租用戶的**外部協作設定**可能限制誰能邀請來賓（來賓邀請者角色）以及允許哪些網域，設定太嚴的話指令碼會失敗。",
 en:{q:"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.\nIn the real exam you will NOT be able to return to a question in this section after answering it, and these questions do not appear in the review screen.\nYou have an Azure Active Directory (Azure AD) tenant named contoso.com.\nYou have a CSV file that contains the names and email addresses of ⟦500 external users⟧.\nYou need to create a ⟦guest user account⟧ in contoso.com for each of the 500 external users.\n⟦Solution: You create a PowerShell script that runs the New-AzureADMSInvitation cmdlet for each external user⟧. Does this meet the goal?",
     o:["Yes","No"],
     e:"This is the only solution of the three that meets the goal. `New-AzureADMSInvitation` is the cmdlet dedicated to Azure AD **B2B invitations**, whose whole purpose is inviting an external user into your directory, and the object it produces has `userType` **Guest**.\nTypical usage:\n```\nImport-Csv .\\users.csv | ForEach-Object {\n  New-AzureADMSInvitation `\n    -InvitedUserEmailAddress $_.Email `\n    -InvitedUserDisplayName  $_.Name `\n    -InviteRedirectUrl \"https://myapps.microsoft.com\" `\n    -SendInvitationMessage  $true\n}\n```\n・`InvitedUserEmailAddress` — the external user's email, which is also their sign-in identity.\n・`InviteRedirectUrl` — where to send them after they accept (required).\n・`SendInvitationMessage` — whether to actually send the invitation email; `$false` merely creates the invitation and returns an `InviteRedeemUrl` for you to distribute yourself.\nThe data given is precisely 'name + email address', matching this cmdlet's inputs exactly, with no UPN and no password needed because authentication stays with the user's home directory. The answer is Yes.\nRecapping the set:\n・`New-AzureADUser` (`S1#38`) — creates **members** and needs a UPN and password. No.\n・Portal Bulk create user (`S1#39`) — also creates **members**; inviting guests needs Bulk invite users. No.\n・`New-AzureADMSInvitation` (this question) — correct.\nMnemonic: **Invitation = external / guest / B2B** — the single distinguishing point across the three.\nAside: the AzureAD module was retired in 2024; the current route is Microsoft Graph PowerShell's `New-MgInvitation`, whose parameters are nearly identical (`-InvitedUserEmailAddress`, `-InviteRedirectUrl`). Also note that the tenant's **external collaboration settings** may restrict who can invite guests (the Guest Inviter role) and which domains are allowed; if these are locked down, the script will fail."}}

/* 目前作答中的題庫（由上方來源切換決定） */
let BANK = BANK_MINE;

/* =====================================================================
   來源座標：sec + no
   -----------------------------------------------------------------
   題庫 B 的每一題都直接記它在原始 PDF 的位置，不壓成一個合成數字：

       {sec:"S1",   no:1}    Question Set 1 · Question #1
       {sec:"T3",   no:2}    Testlet 3 · Question #2
       {sec:"NewQ", no:63}   NewQ #63

   來源 PDF 分成 Question Set 1–6、Testlet 1–10（案例研究）與兩份增題的 NewQ，
   **每一段的題號都從 1 重新算**，所以單靠一個號碼認不出是哪一題，一定要兩個欄位。
   直接存這兩格，維護的人打開題庫檔就能一比一對回 PDF，不必心算。

   題庫 A 是依大綱自己編寫的、沒有來源文件，所以沒有這兩個欄位——
   hasSrc() 為 false 的題目一律不顯示來源標籤，也不參與跳題與缺號統計。
   ===================================================================== */
const hasSrc = q => !!q && typeof q.sec === "string" && Number.isFinite(q.no);

/* 區段代號 → 看得懂的名字。中文意譯，英文照 PDF 原文 */
function secName(sec, en){
  let m;
  if((m = /^S(\d+)$/.exec(sec))) return en ? `Question Set ${m[1]}` : `題組 ${m[1]}`;
  if((m = /^T(\d+)$/.exec(sec))) return en ? `Testlet ${m[1]}`      : `案例 ${m[1]}`;
  if(sec === "NewQ")             return en ? "NewQ"                 : "增題";
  return sec;
}

/* 題目上方與解析標題用的來源標籤：「題組 1 · 第 1 題」/「Question Set 1 · #1」 */
const srcLabel = (q, en) => hasSrc(q)
  ? secName(q.sec, en) + (en ? ` · #${q.no}` : ` · 第 ${q.no} 題`) : "";

/* 排序與範圍顯示用的名次：題組 → 案例 → 增題，段內再依題號 */
function secRank(sec){
  let m;
  if((m = /^S(\d+)$/.exec(sec))) return 1000 + Number(m[1]);
  if((m = /^T(\d+)$/.exec(sec))) return 2000 + Number(m[1]);
  return 3000;
}
const srcRank = q => hasSrc(q) ? secRank(q.sec) * 1000 + q.no : Infinity;

/* 這一輪一段來源座標都沒有（題庫 A）時，右格的數字當「本輪第幾題」解。
   不會和任何 sec 撞名（sec 只有 S／T／NewQ）。 */
const JUMP_POS = "__pos__";

/* =====================================================================
   英文版題目：以中文題目為鍵，與中文題庫解耦，缺漏時自動退回中文。
   格式 "中文題目": [英文題目, [英文選項…（順序須與中文一致）], 英文解析]
   ===================================================================== */
const EN = {};
function mergeEN(){
  let n = 0;
  BANK_MINE.forEach(q=>{      /* EN 對照表只對應題庫 A；題庫 B 的英文直接寫在資料裡 */
    const e = EN[q.q];
    if(!e) return;
    if(e[1].length !== q.o.length){ console.warn("EN 選項數不符:", q.q); return; }
    q.en = {q:e[0], o:e[1].slice(), e:e[2]};
    n++;
  });
  EN.__count = n;
}

  "資源健康情況":"Resource Health","雲端採用架構":"Cloud Adoption Framework / CAF",
  "卓越營運":"Operational excellence","效能效率":"Performance efficiency",
  "成本最佳化":"Cost optimization","可靠性":"Reliability","安全性":"Security"
};
/* 長詞優先，避免「可用性區域」被短詞「區域」先吃掉 */
const GLOSSARY_KEYS = Object.keys(GLOSSARY_MAP).sort((a,b)=>b.length-a.length);
const GLOSSARY_RE = new RegExp(GLOSSARY_KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "g");

function withTerms(s){
  const seen = {};
  const str = String(s);
  return str.replace(GLOSSARY_RE, (m, ...args)=>{
    const at = args[args.length - 2];        // replace 的倒數第二個參數是位移
    if(seen[m]) return m;                    // 同一段只補第一次
    seen[m] = 1;
    const en = GLOSSARY_MAP[m];
    /* 文件題庫的選項本來就寫成「中文（English）」，後面已經有同一個英文了就別再補一次，
       否則會變成「可擴縮性（Scalability）（Scalability）」 */
    const after = str.slice(at + m.length, at + m.length + en.length + 6);
    if(new RegExp("^\\s*[（(]\\s*" + en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(after)) return m;
    return m + "（" + en + "）";
  });
}

/* =====================================================================
   螢光筆標記：題目文字中用 ⟦…⟧ 包住的片段會以螢光筆呈現。
   只標題目裡的關鍵條件，絕不標選項 —— 標了等於直接送答案。
   ===================================================================== */
const HL_RE = /⟦([^⟧]*)⟧/g;
const stripHl = s => String(s).replace(HL_RE, "$1");
/* 寫進 DOM（不使用 innerHTML，避免題目文字被當成 HTML） */
function paintHl(el, s){
  el.textContent = "";
  let last = 0, m;
  HL_RE.lastIndex = 0;
  while((m = HL_RE.exec(String(s))) !== null){
    if(m.index > last) el.append(document.createTextNode(String(s).slice(last, m.index)));
    const mk = document.createElement("mark");
    mk.className = "hl"; mk.textContent = m[1];
    el.append(mk);
    last = m.index + m[0].length;
  }
  if(last < String(s).length) el.append(document.createTextNode(String(s).slice(last)));
}
/* 成績單是用 innerHTML 組的：先跳脫，再把標記換成 <mark> */
const escHl = s => esc(String(s))
  .replace(/⟦/g, '<mark class="hl">').replace(/⟧/g, "</mark>")
  .replace(/\n/g, "<br>");

/* =====================================================================
   題型
   ---------------------------------------------------------------------
   mc  單選／複選            o[] 選項            a=[正解索引…]
   hs  HOTSPOT 是非表        s[] 敘述            a=[1,0,1]（1 是 / 0 否），逐句對應
   dd  DRAG DROP 配對        items[] 可拖曳項目   tgt[] 答案區描述
                                                a=[itemIdx…]，逐格對應 tgt
   dl  HOTSPOT 下拉選單      sent 含 {0}{1} 的句子 dd[][] 每格的選項清單
                                                a=[optIdx…]，逐格對應 dd
   ===================================================================== */
const kindOf = q => q.k || "mc";
const slotCount = q => {
  const k = kindOf(q);
  return k === "hs" ? q.s.length : k === "dd" ? q.tgt.length : k === "dl" ? q.dd.length : 0;
};

/* 依目前語言取出題目的文字。EN 缺漏時自動退回中文，不會出現空白題目。*/
function view(q){
  const en = S.lang === "en" && q.en, zhen = S.lang === "zhen";
  const T = s => zhen ? withTerms(s) : s;
  const src = en ? q.en : q;
  const V = {q:T(src.q), e:T(src.e || q.e), en:!!en};
  switch(kindOf(q)){
    case "hs": V.s = (src.s || q.s).map(T); break;
    case "dd": V.items = (src.items || q.items).map(T);
               V.tgt   = (src.tgt   || q.tgt  ).map(T); break;
    case "dl": V.sent = T(src.sent || q.sent);
               V.dd   = (src.dd || q.dd).map(list => list.map(T)); break;
    default:   V.o = (src.o || q.o).map(T);
  }
  return V;
}

/* ---------------------------------------------------------------------
   作答狀態：一律用陣列表示，好讓四種題型共用計分與成績單
     mc → [已選索引…]（排序過）
     hs → [1|0|null …] 每句一格
     dd → [itemIdx|null …] 每個答案區一格
     dl → [optIdx|null …] 每個下拉一格
   --------------------------------------------------------------------- */
function blankAns(q){
  const n = slotCount(q);
  return kindOf(q) === "mc" ? [] : new Array(n).fill(null);
}
const ansEmpty = (q, ans) => kindOf(q) === "mc"
  ? !ans.length
  : ans.every(v => v === null);
const ansFull = (q, ans) => kindOf(q) === "mc"
  ? !!ans.length
  : ans.every(v => v !== null);
/* 複選題要選滿幾項；單選與其他題型回傳 0 */
const mcNeed  = q => (kindOf(q) === "mc" && q.a.length > 1) ? q.a.length : 0;
/* 原廠考試的規則：複選題一定要「剛好」選滿 N 項才放你走 */
const mcShort = (q, ans) => { const n = mcNeed(q); return n > 0 && (ans || []).length !== n; };
/* 一題算不算「作答完成」：有作答，而且複選題有選滿 N 項（只選一半不算） */
const ansDone = (q, ans) => !!ans && !ansEmpty(q, ans) && !mcShort(q, ans);
/* 逐格比對；mc 因為順序無關，改用集合比對 */
const ansOK = (q, ans) => kindOf(q) === "mc"
  ? sameSet(ans, q.a)
  : ans.length === q.a.length && q.a.every((v,i) => ans[i] === v);
const YN = (v, en) => v === 1 ? (en ? "Yes" : "是") : v === 0 ? (en ? "No" : "否") : (en ? "—" : "—");

function recordAttempt(qKey, ok, reveal){

}

const S = {
