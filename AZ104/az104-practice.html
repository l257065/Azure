/* 匯出：把所有 az104.* 的資料包成一個檔 */
function exportSave(){
  const out = {app:"az104-practice", v:1, ts:Date.now(), data:{}};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("az104.") === 0) out.data[k] = localStorage.getItem(k);
  }
  const d = new Date();
  const name = `az104-progress-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
  const blob = new Blob([JSON.stringify(out)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  return name;
}

/* 匯入：整包覆蓋，所以先問過再做 */
function importSave(text){
  const o = JSON.parse(text);
  if(!o || o.app !== "az104-practice" || !o.data || typeof o.data !== "object")
    throw new Error("not an az900 save file");
  const keys = Object.keys(o.data).filter(k => k.indexOf("az104.") === 0);
  if(!keys.length) throw new Error("save file is empty");
  const old = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("az104.") === 0) old.push(k);
  }
  old.forEach(k => localStorage.removeItem(k));
  keys.forEach(k => localStorage.setItem(k, String(o.data[k])));
  return keys.length;
}

/* =====================================================================
   把「這一輪」封存成一筆成績紀錄
   整輪做完、或按「重新開始」把進度歸零時都會呼叫，所以每一輪各自獨立，
   統計面板才比得出來這次跟上次有沒有進步。
   ===================================================================== */
function logRound(rows){
  if(S.logged) return;
  const byD = {1:[0,0], 2:[0,0], 3:[0,0]};
  let right = 0, total = 0;

  if(rows){                                   /* 模擬考：逐題結果已經算好了 */
    rows.forEach(r=>{
      total++; if(r.ok) right++;
      const d = byD[r.q.d]; if(d){ d[1]++; if(r.ok) d[0]++; }
    });
  } else {                                    /* 練習：只算真的按過「批改」的題目 */
    S.pool.forEach((q,i)=>{
      const g = S.gr[i];
      if(!g || g.reveal) return;
      const ok = ansOK(q, S.answers[i] || blankAns(q));
      total++; if(ok) right++;
      const d = byD[q.d]; if(d){ d[1]++; if(ok) d[0]++; }
    });
  }
  if(!total) return;
  S.logged = true;
  pushHist({ts:Date.now(), k:S.exam ? "exam" : "practice", tab:S.tab, r:right, t:total, d:byD});
}

/* =====================================================================
   結算
   ===================================================================== */
function finishRound(){
  stopTimer();
  closeOverview();
  dropSess();                 /* 這個分頁整輪做完了，進度才歸零 */
  paintTabProgress();
  qbox.innerHTML = ""; qtools.innerHTML = "";
  starBtn.hidden = true;
  verdict.className = "verdict"; expl.className = "expl";
  barFill.style.width = "100%";

  let right = S.right, total = S.total;
  const rows = [];
  if(S.exam){
    right = 0; total = S.pool.length;
    S.pool.forEach((q,i)=>{
      const mine = S.answers[i] || blankAns(q);
      const ok = ansOK(q, mine);
      if(ok){ right++; wrongSet.delete(q.q); } else wrongSet.add(q.q);
      rows.push({q, mine, ok});
      /* 考試沒作答的題目不列入長期統計，免得時間到留白把「常錯題」灌爆 */
      if(!ansEmpty(q, mine)) recordAttempt(q.q, ok, false);
    });
    saveWrong();
  }
  logRound(S.exam ? rows : null);

  const EN = S.lang === "en";
  const pct = total ? Math.round(right/total*100) : 0;
  const passed = pct >= PASS;
  eyebrow.textContent = S.exam ? (EN ? "Mock exam · Result" : "模擬考 · 成績單")
                               : (EN ? "Round complete" : "這一輪結束");
  scoreEl.textContent = `${right} / ${total}`;

  let html = '<div class="bigscore">' +
    `<div class="pct ${passed?"pass":"fail"} mono">${pct}%</div>` +
    `<div class="cap">` +
    (EN ? `${right} / ${total} correct　` : `答對 ${right} / ${total} 題　`) +
    (S.exam ? (passed ? (EN?`at or above the ${PASS}% pass mark`:`達到 ${PASS}% 及格線`)
                      : (EN?`below the ${PASS}% pass mark`:`未達 ${PASS}% 及格線`)) : "") + "</div></div>";

  if(S.exam){
    const byD = {1:[0,0],2:[0,0],3:[0,0]};
    rows.forEach(r=>{ byD[r.q.d][1]++; if(r.ok) byD[r.q.d][0]++; });
    html += '<div class="dbreak">';
    [1,2,3].forEach(d=>{
      const [a,b] = byD[d];
      html += `<div class="row"><span>${esc(dname(d))}</span><span class="n">${a} / ${b}</span></div>`;
    });
    html += "</div>";

    html += '<div class="rev">';
    rows.forEach((r,i)=>{
      const RV = view(r.q);
      const sep = EN ? ", " : "、";
      const answered = !ansEmpty(r.q, r.mine);
      let body, mineTxt, corTxt;

      switch(kindOf(r.q)){

      /* 是非表：逐句列出你的判斷與正解 */
      case "hs":
        body = RV.s.map((text, si)=>{
          const my = r.mine[si], cor = r.q.a[si];
          const cls = my === cor ? "ok" : (my === null || my === undefined ? "none" : "bad");
          return `<div class="rh ${cls}"><span class="t">${escHl(text)}</span>` +
                 `<span class="yn">${EN?"you":"你"} ${YN(my,EN)} / ${EN?"ans":"正解"} ${YN(cor,EN)}</span></div>`;
        }).join("");
        mineTxt = answered ? r.mine.map(v=>YN(v,EN)).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map(v=>YN(v,EN)).join(sep);
        break;

      /* 配對：逐格列出描述、你放的項目與正解 */
      case "dd":
        body = RV.tgt.map((text, ti)=>{
          const my = r.mine[ti], cor = r.q.a[ti];
          const cls = my === cor ? "ok" : (my === null || my === undefined ? "none" : "bad");
          const myTxt = (my === null || my === undefined) ? (EN?"—":"—") : stripHl(RV.items[my]);
          return `<div class="rh ${cls}"><span class="t">${escHl(text)}</span>` +
                 `<span class="yn">${esc(myTxt)} / ${esc(stripHl(RV.items[cor]))}</span></div>`;
        }).join("");
        mineTxt = answered ? r.mine.map(v => v==null ? "—" : stripHl(RV.items[v])).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map(v => stripHl(RV.items[v])).join(sep);
        break;

      /* 下拉：逐格列出你選的與正解 */
      case "dl":
        body = RV.dd.map((list, g)=>{
          const my = r.mine[g], cor = r.q.a[g];
          const cls = my === cor ? "ok" : (my === null || my === undefined ? "none" : "bad");
          const myTxt = (my === null || my === undefined) ? (EN?"—":"—") : stripHl(list[my]);
          return `<div class="rh ${cls}"><span class="t">${EN?"Blank":"第"} ${g+1} ${EN?"":"格"}</span>` +
                 `<span class="yn">${esc(myTxt)} / ${esc(stripHl(list[cor]))}</span></div>`;
        }).join("");
        mineTxt = answered ? r.mine.map((v,g) => v==null ? "—" : stripHl(RV.dd[g][v])).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map((v,g) => stripHl(RV.dd[g][v])).join(sep);
        break;

      /* 單選／複選：全部選項都列出來，讓你看得到錯的錯在哪，而不是只給一個字母 */
      default:
        body = RV.o.map((text, oi)=>{
          const isAns = r.q.a.includes(oi), isMine = r.mine.includes(oi);
          const cls = isAns ? (isMine ? "ok" : "miss") : (isMine ? "bad" : "none");
          const tag = isAns
            ? (isMine ? (EN ? "✓ correct · your pick" : "✓ 正解 · 你選的")
                      : (EN ? "✓ correct answer"      : "✓ 正解"))
            : (isMine ? (EN ? "✗ your pick"           : "✗ 你選的") : "");
          /* 有服務圖示的題目，檢討時也要帶著圖，才跟作答畫面對得起來 */
          const ico = r.q.ico && r.q.ico[oi]
            ? `<img class="oico" src="${r.q.ico[oi]}" alt="">` : "";
          return `<div class="ro ${cls}"><span class="k">${LETTER[oi]}</span>${ico}` +
                 `<span class="t">${esc(stripHl(text))}</span>` +
                 (tag ? `<span class="tag">${tag}</span>` : "") + "</div>";
        }).join("");
        mineTxt = answered ? r.mine.map(x=>LETTER[x]).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map(x=>LETTER[x]).join(sep);
      }

      const sentTxt = kindOf(r.q) === "dl"
        ? `<p class="ln">${escHl(String(RV.sent).replace(/\{(\d+)\}/g, (m,g)=>"＿＿＿"))}</p>` : "";

      /* 考試時標記過的題目，檢討時把標記與備註一起帶出來 */
      const memo = (S.notes[i] || "").trim();
      const flagTxt = S.flags[i]
        ? `<p class="ln flagln">⚑ <b>${EN?"you flagged this":"你標記過這題"}</b>` +
          (memo ? `：${esc(memo)}` : "") + "</p>"
        : "";

      html += `<div class="item ${r.ok?"right":"wrong"}">` +
        `<p class="q">${r.ok?"✓":"✗"} ${i+1}. ${escHl(RV.q)}</p>` + sentTxt + flagTxt +
        `<div class="ropts">${body}</div>` +
        `<p class="ln">${EN?"Your answer":"你的答案"}：<span class="you">${esc(mineTxt)}</span>　` +
        `${EN?"Correct":"正確答案"}：<span class="cor">${esc(corTxt)}</span></p>` +
        `<p class="ln">${escHl(RV.e)}</p></div>`;
    });
    html += "</div>";
  } else {
    html += '<p class="hint">' + (EN
      ? "Hit “New round” to go again. Anything you missed is waiting in the Review list."
      : "按「再來一輪」重新出題（順序看「⚙ 設定 → 出題順序」）；答錯的題目已收進「錯題本」分頁。") + "</p>";
  }

  report.innerHTML = html;
  report.classList.add("show");
  /* 成績單上只需要一顆「再來一輪」，其餘按鈕收起來 */
  btnCheck.hidden = false; btnCheck.className = "act primary"; btnCheck.disabled = false;
  btnCheck.textContent = EN ? "New round" : "再來一輪";
  btnCheck.dataset.mode = "again";
  btnPrev.hidden = true; btnReveal.hidden = true; btnNext.hidden = true;
  paintJump();                /* 成績單畫面沒有「當前題目」，跳題先關掉 */
  window.scrollTo(0, 0);
}

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* =====================================================================
   模擬考計時
   ===================================================================== */
function fmt(s){ const m = Math.floor(s/60); return m + ":" + String(s%60).padStart(2,"0"); }
function startTimer(){
  S.left = EXAM_SEC;
  timerEl.hidden = false; timerEl.classList.remove("warn");
  timerEl.textContent = "⏱ " + fmt(S.left);
  S.timerId = setInterval(()=>{
    S.left--;
    timerEl.textContent = "⏱ " + fmt(Math.max(0,S.left));
    if(S.left <= 300) timerEl.classList.add("warn");
    if(S.left <= 0){ stopTimer(); finishRound(); }
  }, 1000);
}
function stopTimer(){
  if(S.timerId){ clearInterval(S.timerId); S.timerId = null; }
  if(!S.exam) timerEl.hidden = true;
}

/* =====================================================================
   跳題：輸入題號直接跳到那一題
   -----------------------------------------------------------------
   練習模式認的是「題目上標的題號」（Quiz20 題庫在題目本文上方標的 第 N 題 / #N），
   不是「本輪第幾題」——本輪順序是洗過的，本輪第 189 題可能是文件的第 316 題，
   要跳的當然是題目自己的號碼。自製題庫沒有題號，才用「本輪第幾題」。
   模擬考例外：那裡畫面上到處都是「作答總覽」的 1～40 編號，所以先當本輪的
   第幾題，超出範圍再拿題目自己的題號找一次。
   跳到哪裡都會在旁邊寫清楚是照哪一種號碼跳的。
   ===================================================================== */
const jumpForm = el("jumpForm"), jumpNo = el("jumpNo"), jumpBtn = el("jumpBtn"), jumpMsg = el("jumpMsg");
let jumpMsgId = null;

function sayJump(txt, bad){
  jumpMsg.textContent = txt || "";
  jumpMsg.className = "jmsg" + (bad ? " bad" : "");
  if(jumpMsgId){ clearTimeout(jumpMsgId); jumpMsgId = null; }
  if(txt) jumpMsgId = setTimeout(()=>{ jumpMsg.textContent = ""; jumpMsg.className = "jmsg"; }, 3000);
}

/* 沒題目、或整輪做完正在看成績單時就不給跳 */
const jumpOff = () => !S.pool.length || report.classList.contains("show");
/* 這一輪的題目有沒有自己的題號（Quiz20 題庫有，自製題庫沒有） */
const jumpNumbered = () => S.pool.some(q => q.n);
/* 輸入的數字要當成哪一種號碼："no" = 題目自己的題號、"pos" = 本輪第幾題 */
const jumpMode = () => (!S.exam && jumpNumbered()) ? "no" : "pos";
/* 這個分頁跳得到的題號範圍：分類分頁、錯題本只含部分題目，所以不是連號 */
function jumpRange(){
  const ns = S.pool.map(q => Number(q.n)).filter(Number.isFinite);
  return ns.length ? Math.min(...ns) + "-" + Math.max(...ns) : "";
}

function paintJump(){
  const EN = S.lang === "en";
  const off = jumpOff();
  const byNo = jumpMode() === "no";
  const cur = S.pool[S.idx];
  jumpForm.dataset.off = off ? "1" : "0";
  jumpNo.disabled = jumpBtn.disabled = off;
  /* 提示框裡放目前這一題的號碼，一眼就知道這個欄位認的是哪一種號碼 */
  jumpNo.placeholder = (byNo && cur && cur.n) ? "#" + cur.n : (EN ? "no." : "題號");
  jumpBtn.textContent = EN ? "Go" : "跳題";
  jumpForm.title = byNo
    ? (EN ? `Type the number printed on the question — the #N above the stem, not its position in this shuffled round — then press Enter (this tab holds ${S.pool.length} questions, nos. ${jumpRange()}). Press / to focus.`
          : `輸入題目上標的題號（題目本文上方那個「第 N 題」，不是本輪的第幾題）按 Enter 就跳過去（這個分頁收了 ${S.pool.length} 題，題號 ${jumpRange()}）。按 / 鍵可以快速跳到這個欄位。`)
    : (EN ? `Type a question number (1-${S.pool.length}, same numbering as the overview) and press Enter. Press / to focus.`
          : `輸入題號按 Enter 直接跳到那一題（本輪 1-${S.pool.length} 題，和「作答總覽」的編號一樣）。按 / 鍵可以快速跳到這個欄位。`);
  if(off) sayJump("");
}

function jumpTo(raw){
  const EN = S.lang === "en";
  if(jumpOff()) return false;
  const n = parseInt(String(raw).replace(/[^0-9]/g, ""), 10);   /* 連 #316、第 316 題 這種寫法也吃 */
  if(!Number.isFinite(n)){
    sayJump(EN ? "Enter a question number." : "請先輸入題號。", true);
    return false;
  }

  const findByNo = () => S.pool.findIndex(q => Number(q.n) === n);
  let i = -1, byNo = false;
  if(jumpMode() === "no"){
    i = findByNo(); byNo = i >= 0;                 /* 練習模式：只照題目自己的題號 */
  } else {
    if(n >= 1 && n <= S.pool.length) i = n - 1;    /* 本輪第幾題 */
    else if(jumpNumbered()){ i = findByNo(); byNo = i >= 0; }   /* 超出範圍才試題號 */
  }
  if(i < 0){
    sayJump(jumpMode() === "no"
      ? (EN ? `Question ${n} is not in this tab (${S.pool.length} questions, nos. ${jumpRange()}).`
            : `這個分頁裡沒有第 ${n} 題（這裡收了 ${S.pool.length} 題，題號 ${jumpRange()}）。`)
      : (EN ? `No question ${n} in this round (1-${S.pool.length}).`
            : `這一輪沒有第 ${n} 題（可跳 1-${S.pool.length} 題）。`), true);
    return false;
  }
  /* 跳到哪一題就講清楚是照哪一種號碼跳的，免得和另一種號碼搞混 */
  const qn = S.pool[i].n;
  const where = byNo
    ? (EN ? `question ${n} — no. ${i+1} of ${S.pool.length} this round`
          : `第 ${n} 題（本輪第 ${i+1} / ${S.pool.length} 題）`)
    : (EN ? `no. ${i+1} of this round${qn ? ` — question ${qn}` : ""}`
          : `本輪第 ${i+1} 題${qn ? `（題目上標的是第 ${qn} 題）` : ""}`);
  if(i === S.idx){
    sayJump((EN ? "Already on " : "已經在") + where + (EN ? "." : "了。"));
    return true;
  }
  closeOverview();
  S.idx = i;
  renderQ();
  window.scrollTo(0, 0);
  sayJump((EN ? "Jumped to " : "跳到") + where + (EN ? "." : "。"));
  return true;
}

jumpForm.addEventListener("submit", e=>{
  e.preventDefault();
  if(jumpTo(jumpNo.value)){ jumpNo.value = ""; jumpNo.blur(); }
});
/* 在輸入框裡按 Esc＝放棄跳題，把鍵盤還給作答（A-F、←／→） */
jumpNo.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ jumpNo.value = ""; jumpNo.blur(); e.stopPropagation(); }
});

/* =====================================================================
   事件
   ===================================================================== */
/* 模擬考沒作答就想往下一題：擋住並說明（原廠考試也是這樣，不給空著跳過）。
   練習模式有「跳過」，走不到這裡。 */
function nagUnanswered(part){
  const EN = S.lang === "en";
  verdict.className = "verdict show fail";
  verdict.textContent = part
    ? (EN ? "Some blanks are still empty — fill them all in before moving on."
          : "還有空格沒填，全部填完才能繼續。")
    : (EN ? "You have not answered this question yet. Answer it before moving on"
          + " — or jump to another number from the Overview to come back later."
          : "你還沒作答，答完才能按「下一題」；想先擱著晚點再看，可以從「作答總覽」跳到別題。");
  verdict.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* 模擬考往下一題之前的關卡（回傳 true＝擋下來了）：
   沒作答、複選題沒選滿、多格題型沒填完，都不放行——跟原廠考試一樣沒有「跳過」。
   「上一題」「作答總覽」「交卷」不受限制，真的想擱著就從總覽跳到別題。 */
function examGate(){
  const q = S.pool[S.idx];
  if(!q) return false;
  if(ansEmpty(q, S.ans)){ nagUnanswered(false); return true; }
  if(mcShort(q, S.ans)){ nagMulti(q); return true; }
  if(!ansFull(q, S.ans)){ nagUnanswered(true); return true; }
  return false;
}

btnPrev.addEventListener("click", prevQ);
btnCheck.addEventListener("click", ()=>{
  if(btnCheck.dataset.mode === "again"){ startRound(true); return; }
  if(S.exam){
    /* 複選題要選滿「需選 N 項」才能往下走，跟原廠考試一致 */
    if(examGate()) return;
    /* 最後一題的「下一題」不會直接交卷，而是先開總覽讓你檢查 */
    if(S.idx >= S.pool.length-1) openOverview(true); else { S.idx++; renderQ(); window.scrollTo(0,0); }
    return;
  }
  if(S.graded) nextQ(); else grade(false);
});
btnReveal.addEventListener("click", ()=>{
  if(S.exam){ openOverview(false); return; }
  grade(true);
});
btnNext.addEventListener("click", ()=>{
  if(S.exam){ openOverview(true); return; }   /* 交卷＝先進確認畫面，不直接給分 */
  nextQ();                                    /* 練習模式：跳過＝不批改直接走，這題不計分 */
});

/* 鍵盤：← → 翻題，Esc 關掉總覽 */
document.addEventListener("keydown", e=>{
  if(e.target.matches("input, textarea, select")) return;
  if(e.key === "Escape"){
    if(infowrap.classList.contains("show")){ closeInfo(); return; }
    if(cfgwrap.classList.contains("show")){ closeCfg(); return; }
    if(statwrap.classList.contains("show")){ closeStat(); return; }
    if(ovwrap.classList.contains("show")){ closeOverview(); return; }
  }
  if(ovwrap.classList.contains("show") || statwrap.classList.contains("show")
     || cfgwrap.classList.contains("show") || infowrap.classList.contains("show")) return;
  if(e.key === "/" && !jumpNo.disabled){ jumpNo.focus(); jumpNo.select(); e.preventDefault(); return; }
  if(e.key === "ArrowLeft" && !btnPrev.disabled){ prevQ(); }
  else if(e.key === "ArrowRight" && S.pool.length && S.idx < S.pool.length-1){
    /* 模擬考的 → 還是要過關卡（不能空著跳過）；練習模式的 → 就是「跳過」 */
    if(S.exam && examGate()) return;
    S.idx++; renderQ(); window.scrollTo(0,0);
  }
});

document.querySelectorAll("nav.tabs button").forEach((b,i)=>{
  b.addEventListener("click", ()=>{
    if(S.exam){   /* 模擬考進行中切分頁＝放棄本次考試 */
      S.exam = false; el("examBtn").setAttribute("aria-pressed","false");
      timerEl.hidden = true; stopTimer(); closeOverview(); applyLang();
    }
    S.tab = i;
    try{ localStorage.setItem(TAB_KEY, String(i)); }catch(e){}
    document.querySelectorAll("nav.tabs button").forEach((x,j)=>x.setAttribute("aria-selected", j===i));
    startRound();
    window.scrollTo(0, 0);
  });
});

el("examBtn").addEventListener("click", ()=>{
  S.exam = !S.exam;
  el("examBtn").setAttribute("aria-pressed", S.exam);
  timerEl.hidden = !S.exam;
  applyLang();
  startRound();
  window.scrollTo(0, 0);
});

function setLang(lang){
  if(LANGS.indexOf(lang) < 0 || lang === S.lang) return;
  S.lang = lang;
  applyLang();
  /* 只重畫當前題目：保留已選答案與已批改狀態，不重出題、不重複計分 */
  if(report.classList.contains("show")){ finishRound(); return; }
  const keep = S.ans.slice(), wasGraded = S.graded, wasReveal = S.lastReveal;
  renderQ();
  const q = S.pool[S.idx];
  if(q && keep.length){ S.ans = keep; reflectAns(q); }
  if(wasGraded) grade(wasReveal, false);
}

el("langSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-lang]");
  if(b) setLang(b.dataset.lang);
});

/* =====================================================================
   題庫來源：自製題庫 ⇄ Quiz20 題庫（分數、錯題本、模擬考各自獨立）
   ===================================================================== */
function setSource(src){
  if(src !== "mine" && src !== "doc") return;
  if(src === S.src) return;
  S.src = src;
  BANK = BANK_DOC;
  wrongSet = WRONG[src];
  starSet  = STAR[src];
  qstat    = QSTAT[src];
  hist     = HIST[src];
  closeStat(); closeCfg();
  el("srcSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.src === src);
  });
  try{ localStorage.setItem(SRC_KEY, src); }catch(e){}
  applyLang();          /* 頂列的題庫標籤要跟著換 */
  P_reset();
  startRound();
  window.scrollTo(0, 0);
}
/* 換題庫等於重開一輪：分數歸零，模擬考也結束 */
function P_reset(){
  closeOverview();
  if(S.exam){
    S.exam = false;
    el("examBtn").setAttribute("aria-pressed","false");
    timerEl.hidden = true; stopTimer();
    applyLang();
  }
  S.right = 0; S.total = 0;
  S.answers = []; S.gr = []; S.flags = []; S.notes = [];
}
el("srcSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-src]");
  if(b) setSource(b.dataset.src);
});

/* 主題切換 */
/* =====================================================================
   設定面板：題庫來源、主題、重新開始這一輪
   這三個都是「設定一次就很少動」的，收進來讓頂列只留常用的東西
   ===================================================================== */
const openCfg  = ()=>{ paintCfg(); cfgwrap.classList.add("show"); };
const closeCfg = ()=>{ cfgwrap.classList.remove("show"); resetArm(false); };

function setTheme(mode){
  if(mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
  else { document.documentElement.removeAttribute("data-theme"); mode = "system"; }
  try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
  paintCfg();
}
const themeMode = () => document.documentElement.getAttribute("data-theme") || "system";

function paintCfg(){
  el("srcSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.src === S.src));
  });
  el("orderSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.order === S.order));
  });
  const m = themeMode();
  el("themeSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.theme === m));
  });
}

/* 重新開始：按兩次才算數，避免一個手滑把整輪進度洗掉 */
let cfgArmed = false, cfgArmId = null;
function resetArm(on){
  cfgArmed = on;
  const b = el("cfgReset"), en = S.lang === "en";
  b.classList.toggle("armed", on);
  b.textContent = on ? (en ? "↻ Tap again to confirm" : "↻ 再按一次確認重來")
                     : (en ? "↻ Restart" : "↻ 重新開始");
  if(cfgArmId){ clearTimeout(cfgArmId); cfgArmId = null; }
  if(on) cfgArmId = setTimeout(()=>resetArm(false), 4000);
}

el("cfgBtn").addEventListener("click", openCfg);
el("cfgClose").addEventListener("click", closeCfg);
cfgwrap.addEventListener("click", e=>{ if(e.target === cfgwrap) closeCfg(); });
el("themeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-theme]");
  if(b) setTheme(b.dataset.theme);
});

/* 出題順序：只管練習模式。這一輪一題都還沒動就直接照新順序重出，
   已經做了一半就留到下一輪——不會為了換順序把作答進度默默洗掉。 */
function setOrder(mode){
  if(mode !== "seq" && mode !== "rand") return;
  if(mode === S.order){ paintCfg(); return; }
  S.order = mode;
  try{ localStorage.setItem(ORDER_KEY, mode); }catch(e){}
  paintCfg();
  if(!S.exam && S.idx === 0 && S.total === 0 && !S.graded && !answeredCount()
     && !report.classList.contains("show")){
    startRound(true);
    window.scrollTo(0, 0);
  }
}
el("orderSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-order]");
  if(b) setOrder(b.dataset.order);
});
el("cfgReset").addEventListener("click", ()=>{
  if(!cfgArmed){ resetArm(true); return; }
  resetArm(false);
  closeCfg();
  startRound(true);
  window.scrollTo(0, 0);
});

/* =====================================================================
   題數說明：解釋「PDF 題號的最大值」與「題庫實際題數」之間的差異
   缺號不是漏做，是原始文件本身就跳號。標題與內文數字全部從 BANK_DOC
   現算（docGaps()／infoBtnTitle()），之後補題或改題庫、跳號被補齊，
   這個面板會自己跟著更新，不會變成過期的說明。
   ===================================================================== */
const closeInfo = () => { infowrap.classList.remove("show"); infowrap.innerHTML = ""; };

function docGaps(){
  const nums = BANK_DOC.map(q => q.n).filter(n => Number.isFinite(n));
  if(!nums.length) return {total:0, max:0, gaps:[]};
  const max = Math.max(...nums), seen = new Set(nums), gaps = [];
  for(let i = 1; i <= max; i++) if(!seen.has(i)) gaps.push(i);
  return {total:nums.length, max, gaps};
}

function infoBtnTitle(en){
  const g = docGaps();
  if(!g.gaps.length) return en ? `Question count: all ${g.total} questions are present, no gaps`
                                : `題數說明：全部 ${g.total} 題都在，沒有跳號`;
  return en ? `Question count: why the document bank has ${g.total} questions, not ${g.max}`
            : `題數說明：Quiz20 題庫為什麼是 ${g.total} 題而不是 ${g.max}`;
}

function openInfo(){
  const EN = S.lang === "en";
  const g = docGaps();
  const hasGaps = g.gaps.length > 0;
  const chips = g.gaps.map(n => `<i>#${n}</i>`).join("");

  const body = EN ? `
    <h2>${hasGaps ? `Why ${g.total} questions, not ${g.max}?` : `All ${g.total} questions are present, no gaps`}</h2>
    <p class="ovsub">Nothing is missing — the document bank is complete.</p>
    <div class="infomath">
      <span>${g.max} − ${g.gaps.length}</span><span>=</span><b>${g.total}</b>
      <span class="why">highest number in the PDF − numbers the PDF skips = questions that actually exist</span>
    </div>
    <div class="infosec">
      <span class="lab">Skipped numbers</span>
      <p>These numbers do not exist in the source PDF. Every page was checked one by one — they were never transcribed because there is nothing there to transcribe.</p>
      <div class="infonums">${chips || "<i>none</i>"}</div>
      <p style="margin-top:10px">So <em>#${g.max}</em> is the highest question number, not the number of questions. Typing one of the numbers above into the jump box will simply find nothing.</p>
    </div>
    <div class="infosec">
      <span class="lab">Numbering</span>
      <p>Question numbers here are the PDF's own numbers, so anything you look up in the original document lands on the same question. That is also why the gaps were left as gaps instead of being closed up.</p>
    </div>` : `
    <h2>${hasGaps ? `為什麼是 ${g.total} 題，不是 ${g.max} 題？` : `全部 ${g.total} 題都在，沒有跳號`}</h2>
    <p class="ovsub">沒有漏做，Quiz20 題庫已經是完整的。</p>
    <div class="infomath">
      <span>${g.max} − ${g.gaps.length}</span><span>=</span><b>${g.total}</b>
      <span class="why">PDF 最大題號 − 原文跳掉的題號 ＝ 實際存在的題數</span>
    </div>
    <div class="infosec">
      <span class="lab">跳掉的題號</span>
      <p>這幾個題號在原始 PDF 裡根本不存在。已經逐頁比對確認過，不是轉錄時漏掉，是原本就沒有這幾題。</p>
      <div class="infonums">${chips || "<i>無</i>"}</div>
      <p style="margin-top:10px">所以 <em>#${g.max}</em> 是「最大題號」而不是「題目數量」。把上面任何一個號碼打進跳題欄，也只會找不到題目。</p>
    </div>
    <div class="infosec">
      <span class="lab">題號規則</span>
      <p>這裡的題號沿用 PDF 自己的編號，你在原始文件查到第幾題，這邊就是第幾題。缺號之所以留著不往前補，也是為了維持這個對應關係。</p>
    </div>`;

  infowrap.innerHTML = `<div class="ovcard">${body}
    <div class="ovbtns"><button type="button" class="go" data-act="close">${EN ? "Got it" : "知道了"}</button></div>
  </div>`;
  infowrap.classList.add("show");
}

el("infoBtn").addEventListener("click", openInfo);
infowrap.addEventListener("click", e=>{
  if(e.target === infowrap || e.target.closest('[data-act="close"]')) closeInfo();
});

/* 使用說明：收合狀態記起來，不用每次都收 */
hintBox.addEventListener("toggle", ()=>{
  try{ localStorage.setItem(HINT_KEY, hintBox.open ? "1" : "0"); }catch(e){}
});

/* 鍵盤：A-F 選項、Enter 批改／下一題 */
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const k = e.key.toUpperCase();
  const li = LETTER.indexOf(k);
  if(li > -1){
    const b = qbox.querySelectorAll(".opt")[li];
    if(b && !b.disabled){ b.click(); e.preventDefault(); }
    return;
  }
  if(e.key === "Enter"){ btnCheck.click(); e.preventDefault(); }
});

/* sticky 表頭高度 */
const topBar = document.querySelector("header.top");
const syncTop = () => document.documentElement.style.setProperty("--topH", topBar.offsetHeight + "px");
syncTop();
addEventListener("resize", syncTop);
addEventListener("orientationchange", syncTop);
if(window.ResizeObserver) new ResizeObserver(syncTop).observe(topBar);

try{
  const saved = localStorage.getItem(LANG_KEY);
  if(LANGS.indexOf(saved) > -1) S.lang = saved;
  const savedSrc = localStorage.getItem(SRC_KEY);
  if(BANK_DOC.length){ BANK = BANK_DOC; wrongSet = WRONG.doc; starSet = STAR.doc; }
  const savedTab = parseInt(localStorage.getItem(TAB_KEY), 10);
  if(savedTab >= 0 && savedTab <= 5) S.tab = savedTab;
  if(localStorage.getItem(HINT_KEY) === "1") hintBox.open = true;
  const savedOrder = localStorage.getItem(ORDER_KEY);
  if(savedOrder === "seq" || savedOrder === "rand") S.order = savedOrder;
}catch(e){}
document.querySelectorAll("nav.tabs button").forEach((b,i)=>b.setAttribute("aria-selected", i === S.tab));
mergeEN();
restoreSessions();     /* 上次沒做完的分頁進度，關掉瀏覽器再回來也接得下去 */
applyLang();
startRound();
</script>
