 e:"這是這一組三題裡唯一達成目標的解法。「某次部署實際用了哪一份範本」記錄在**部署歷程記錄**裡，而部署歷程記錄掛在資源群組上。\n完整路徑：\n・資源群組 → 選中那個 RG → 概觀頁面就會顯示「最後一次部署」的連結，點進去。\n・或直接從左側選單開「部署（Deployments）」，會列出這個資源群組的部署清單（每個資源群組保留最近 800 次）。\n・挑那一次部署 → 摘要頁會顯示部署狀態、各項作業、以及當初傳入的參數值。\n・按「檢視範本（View template）」就能看到當次真正用的 template.json 與 parameters.json，兩者都可以下載。\n為什麼其他兩個刀鋒不行：\n・虛擬機器刀鋒（`S1#13`）— 它的「匯出範本」是依現況重新產生的，不是原件；而且這次部署同時建了 VM 與儲存體帳戶，從 VM 匯出只會拿到 VM 那一段。\n・容器刀鋒（`S1#15`）— Blob 容器是儲存體帳戶底下的資料層物件，根本沒有部署歷程記錄。\n記法：「這次部署用了什麼範本」→ 資源群組的部署歷程記錄；「把現在的樣子變成範本」→ 資源或資源群組的匯出範本。\n領域歸屬：ARM 範本與 Bicep 在官方大綱屬於「部署與管理 Azure 運算資源」，所以這一組三題都算領域 3，不是治理。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company has an azure subscription that includes a storage account, a resource group, a blob container and a file share.\nA colleague named Jon Ross makes use of a ⟦solitary Azure Resource Manager (ARM) template⟧ to deploy a virtual machine and an additional Azure Storage account.\nYou want to ⟦review the ARM template that was used by Jon Ross⟧.\n⟦Solution: You access the Resource Group blade⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"This is the only solution of the three that meets the goal. Which template a particular deployment actually used is recorded in the **deployment history**, and deployment history hangs off the resource group.\nThe full path:\n・Resource groups → select the RG → the Overview page shows a link for the last deployment; click it.\n・Or open Deployments in the left menu, which lists the deployments for that resource group (the last 800 are kept per group).\n・Select that deployment → the summary shows its status, its operations, and the parameter values supplied at the time.\n・Choose View template to see the actual template.json and parameters.json used, both downloadable.\nWhy the other two blades fail:\n・The Virtual Machine blade (`S1#13`) — its Export template regenerates a template from the current state rather than returning the original, and since this deployment created a VM *and* a storage account, exporting from the VM yields only the VM portion.\n・The Container blade (`S1#15`) — a blob container is a data-plane object inside a storage account and has no deployment history at all.\nMnemonic: 'what template did this deployment use' → resource group deployment history; 'turn the current state into a template' → Export template.\nDomain note: ARM templates and Bicep sit under 'Deploy and manage Azure compute resources' in the official outline, so all three of these questions are domain 3, not governance."}},

{sec:"S1", no:15, d:3, t:"檢視 ARM 範本", tEn:"Reviewing an ARM template",
 q:"注意：本題與另外數題的情境完全相同，但每一題提出的解法不同，請個別判斷解法是否達成目標。\n你的公司有一個 Azure 訂用帳戶，裡面包含一個儲存體帳戶、一個資源群組、一個 Blob 容器和一個檔案共用。\n一位名叫 Jon Ross 的同事⟦用單一個 Azure Resource Manager（ARM）範本⟧部署了一台虛擬機器和一個額外的 Azure 儲存體帳戶。\n你想要⟦檢視 Jon Ross 所使用的那個 ARM 範本⟧。\n⟦解法：你進入「容器」刀鋒⟧。這個解法是否達成目標？",
 o:["是","否"],
 a:[1],
 e:"容器刀鋒完全不相干，這一題是三個解法裡最容易排除的。\n先把 Azure 儲存體的兩個層次分清楚：\n・控制平面（管理層）— 儲存體帳戶本身是一個 ARM 資源，它的建立、SKU、備援、網路規則都經過 Resource Manager，所以會留下部署歷程記錄。\n・資料平面（資料層）— Blob 容器、Blob、檔案共用、佇列、資料表都是儲存體帳戶**裡面**的物件，走的是儲存體自己的 REST 端點，**不是 ARM 資源**，因此完全沒有部署歷程記錄可看。\n所以進到容器刀鋒只會看到容器裡的 Blob 清單、存取層級、租用狀態這些東西，跟「Jon Ross 用了哪一份 ARM 範本」毫無關係。\n三個解法對照：\n・資源群組刀鋒（`S1#14`）— 正解。部署歷程記錄在這裡。\n・虛擬機器刀鋒（`S1#13`）— 只能匯出依現況重建的範本，而且看不到同批部署的儲存體帳戶。\n・容器刀鋒（本題）— 資料層物件，連部署歷程記錄的概念都沒有。\n答案是「否」。\n附帶一提：容器確實可以用 ARM 範本建立（`Microsoft.Storage/storageAccounts/blobServices/containers`），但那筆歷程記錄仍然掛在**資源群組**上，不是掛在容器刀鋒裡。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company has an azure subscription that includes a storage account, a resource group, a blob container and a file share.\nA colleague named Jon Ross makes use of a ⟦solitary Azure Resource Manager (ARM) template⟧ to deploy a virtual machine and an additional Azure Storage account.\nYou want to ⟦review the ARM template that was used by Jon Ross⟧.\n⟦Solution: You access the Container blade⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"The Container blade is entirely unrelated, making this the easiest of the three solutions to rule out.\nFirst separate the two planes of Azure Storage:\n・Control plane (management) — the storage account itself is an ARM resource. Its creation, SKU, redundancy and network rules all go through Resource Manager, so they leave deployment history.\n・Data plane — blob containers, blobs, file shares, queues and tables are objects *inside* the storage account, reached through Storage's own REST endpoints. They are **not** ARM resources and therefore have no deployment history to look at.\nSo the Container blade only shows you the blobs in the container, their access tier, lease state and so on — nothing about which ARM template Jon Ross used.\nThe three solutions side by side:\n・Resource group blade (`S1#14`) — correct; deployment history lives here.\n・Virtual Machine blade (`S1#13`) — can only export a template regenerated from current state, and cannot show the storage account deployed alongside it.\n・Container blade (this question) — a data-plane object, with no notion of deployment history at all.\nThe answer is No.\nAside: containers *can* be created from an ARM template (`Microsoft.Storage/storageAccounts/blobServices/containers`), but that history record still hangs off the **resource group**, not off the Container blade."}},

{sec:"S1", no:16, d:3, t:"調整可用性設定組裡的 VM 大小", tEn:"Resizing a VM in an availability set",
 q:"你的公司有三台虛擬機器（VM）放在同一個⟦可用性設定組（availability set）⟧裡。\n你嘗試調整其中一台 VM 的大小，卻收到⟦配置失敗（allocation failure）⟧的訊息。\n這台 VM 一定要調整大小成功。你應該採取下列哪一個動作？",
 o:["只需要停止其中一台 VM","停止其中兩台 VM","停止全部三台 VM","把那台 VM 從可用性設定組移除"],
 a:[2],
 e:"配置失敗的原因是：**同一個可用性設定組裡所有執行中的 VM，必須跑在同一個實體硬體叢集上。** 你想換的那個大小如果不屬於目前叢集支援的系列，Azure 就得把 VM 搬到另一個叢集，而只要還有別的 VM 在該叢集上執行，就搬不動。\n調整大小的三種情況：\n・新舊大小屬於**同一個硬體系列**（例如 Standard_D2s_v3 → D4s_v3）— 通常線上就能改，不必停機。\n・跨系列、但 VM **不在**可用性設定組裡 — 停這一台、改大小、再開機就好。\n・跨系列、而且 VM **在**可用性設定組裡（本題）— **必須把設定組裡的全部 VM 都停掉**（要「停止並解除配置」，不是只在作業系統裡關機），改完大小之後再一台一台開回來，Azure 才有機會把整組重新配置到支援新大小的叢集。\n逐一檢視選項：\n・只停一台、停兩台 — 只要還有一台在跑，叢集就換不了，配置失敗會再發生。\n・把 VM 移出可用性設定組 — **做不到**。VM 的可用性設定組成員資格在建立時決定，之後不能變更；要換就得刪掉 VM 再重建（保留磁碟）。這個選項本身就不成立。\n・停止全部三台 — 正解。\n提醒：停掉整組期間服務會中斷，所以實務上要排維護時段；另一種避免這件事的做法是改用**可用性區域**，它沒有「同一個硬體叢集」這個限制。",
 en:{q:"Your company has three virtual machines (VMs) that are included in an ⟦availability set⟧.\nYou try to resize one of the VMs, which returns an ⟦allocation failure⟧ message.\nIt is imperative that the VM is resized. Which of the following actions should you take?",
     o:["You should only stop one of the VMs.","You should stop two of the VMs.","You should stop all three VMs.","You should remove the necessary VM from the availability set."],
     e:"The allocation failure happens because **every running VM in an availability set must sit on the same physical hardware cluster.** If the size you want is not offered by the current cluster, Azure has to move the VM to a different cluster — and it cannot while other VMs in the set are still running there.\nThree resize situations:\n・New and old size are in the **same hardware family** (e.g. Standard_D2s_v3 → D4s_v3) — usually resizable online with no downtime.\n・Different family, VM **not** in an availability set — stop that one VM, resize, start it again.\n・Different family, VM **is** in an availability set (this question) — **all VMs in the set must be stopped** (stopped-deallocated, not merely shut down from inside the OS), then resized, then restarted one by one, so Azure can place the whole set on a cluster that supports the new size.\nTaking the options in turn:\n・Stopping one or two — as long as one VM is still running, the cluster cannot change and the allocation failure recurs.\n・Removing the VM from the availability set — **not possible**. Availability set membership is fixed at creation and cannot be changed; you would have to delete and recreate the VM (keeping its disks). The option is a non-starter.\n・Stopping all three — correct.\nNote: the whole set is offline while you do this, so schedule a maintenance window. The way to avoid the constraint altogether is **availability zones**, which have no same-hardware-cluster requirement."}},

{sec:"S1", no:17, d:3, t:"搬移資料磁碟", tEn:"Moving a data disk",
 q:"你有一台 Azure 虛擬機器（VM），上面掛著⟦一顆資料磁碟⟧。\n你被指派要把這顆資料磁碟掛到⟦另一台 Azure VM⟧ 上。\n你必須確保你的做法讓虛擬機器⟦離線的時間越短越好⟧。\n下列哪一個是你應該⟦最先⟧採取的動作？",
 o:["停止含有那顆資料磁碟的 VM","停止資料磁碟要掛上去的那台 VM","卸離（detach）那顆資料磁碟","刪除含有那顆資料磁碟的 VM"],
 a:[2],
 e:"關鍵在「最先」與「離線時間最短」這兩個限制。\nAzure 受控磁碟的卸離與掛載規則：\n・**卸離資料磁碟不需要停機。** 在入口網站進 VM →「磁碟」→ 在那一列按「中斷連結（Detach）」→ 儲存，VM 可以一直在跑。唯一該做的前置動作是先在作業系統裡把該磁碟卸載（Windows 用磁碟管理離線、Linux 用 umount），避免寫入中斷。\n・**掛載資料磁碟也不需要停機。** 目標 VM 執行中就能加上去，加完在作業系統裡上線／掛載即可。\n・**作業系統磁碟就不一樣**了，OS 磁碟要換必須先停止並解除配置 VM。本題是資料磁碟，不受這條限制。\n所以整個流程完全不需要停任何一台 VM，離線時間是零：\n1. 在來源 VM 的作業系統裡卸載該磁碟。\n2. 從來源 VM 卸離資料磁碟。\n3. 把磁碟掛到目標 VM。\n4. 在目標 VM 的作業系統裡上線／掛載。\n逐一檢視選項：\n・停止來源 VM、停止目標 VM — 兩者都會製造不必要的停機，與「離線時間最短」相違背。\n・刪除來源 VM — 更糟，而且完全沒必要（刪 VM 預設也不會刪資料磁碟，但這不是題目要的）。\n・卸離資料磁碟 — 正解，也是第一步。\n提醒：一顆受控磁碟同一時間只能掛在一台 VM 上（除非用共用磁碟 shared disk），所以一定要先卸離才能掛到別台。",
 en:{q:"You have an Azure virtual machine (VM) that has ⟦a single data disk⟧. You have been tasked with attaching this data disk to ⟦another Azure VM⟧.\nYou need to make sure that your strategy allows for the virtual machines to be ⟦offline for the least amount of time possible⟧.\nWhich of the following is the action you should take ⟦FIRST⟧?",
     o:["Stop the VM that includes the data disk.","Stop the VM that the data disk must be attached to.","Detach the data disk.","Delete the VM that includes the data disk."],
     e:"The two binding words are 'FIRST' and 'least amount of time offline'.\nThe rules for detaching and attaching Azure managed disks:\n・**Detaching a data disk needs no downtime.** In the portal: VM → Disks → Detach on that row → Save, all while the VM keeps running. The only prerequisite is unmounting the disk inside the OS first (offline it in Disk Management on Windows, umount on Linux) so writes are not cut off.\n・**Attaching a data disk needs no downtime either.** The target VM can be running; afterwards you bring the disk online / mount it in the OS.\n・**The OS disk is different** — swapping an OS disk does require the VM to be stopped-deallocated. This question is about a data disk, so that restriction does not apply.\nSo the whole operation requires stopping neither VM, and downtime is zero:\n1. Unmount the disk in the source VM's OS.\n2. Detach the data disk from the source VM.\n3. Attach the disk to the target VM.\n4. Bring it online / mount it in the target VM's OS.\nTaking the options in turn:\n・Stopping the source VM or the target VM — both create unnecessary downtime, contradicting the requirement.\n・Deleting the source VM — worse still, and entirely unnecessary.\n・Detaching the data disk — correct, and it is the first step.\nNote: a managed disk can only be attached to one VM at a time (unless it is a shared disk), so detaching first is mandatory."}},

{sec:"S1", no:18, d:3, t:"容錯網域數", tEn:"Fault domain count",
 q:"你的公司有一個 Azure 訂用帳戶。\n你需要用 Azure Resource Manager（ARM）範本部署數台 Azure 虛擬機器（VM），並且已知這些 VM 會放在⟦同一個可用性設定組⟧裡。\n你必須確保你設定的 ARM 範本能讓⟦盡可能多的 VM 在網狀架構故障或維護時仍然可以存取⟧。\n下列哪一個是你應該為 ⟦platformFaultDomainCount⟧ 屬性設定的值？",
 o:["10","30","最小值（Min Value）","最大值（Max Value）"],
 a:[3],
 e:"可用性設定組用兩種網域把 VM 打散，兩者的上限差很多，很容易記混：\n・**容錯網域（fault domain）** — 代表共用同一組機架、電源與網路交換器的一群伺服器。**每個區域只有 2 或 3 個**（依區域而定，受控磁碟一律最多 3）。防的是硬體故障。\n・**更新網域（update domain）** — 代表可以同時被重新開機做主機維護的一群 VM。**預設 5 個，ARM 部署最多可設到 20**。防的是計畫性維護造成的同時重啟。\n本題問的是容錯網域，所以候選值只有 2 或 3——**但區域不同上限也不同，範本裡寫死數字就會在只支援 2 個的區域部署失敗。** 這正是選項給「最大值」而不是給具體數字的原因：\n・10、30 — 遠超過容錯網域的上限，直接部署失敗。這兩個數字其實是更新網域的量級（20 是更新網域上限），是設計來混淆的干擾項。\n・最小值 — 會變成 1，等於完全沒有分散，與題目要求相反。\n・最大值 — 正解。讓平台自己取該區域支援的最大值（2 或 3），VM 就會盡可能分散在最多組獨立硬體上。\n記法：容錯網域 **2–3**（實體機架，數量少）、更新網域 **5–20**（維護批次，數量多）。看到 20 就是更新網域，看到 3 就是容錯網域。\n補充：想要更強的隔離就改用**可用性區域**，那是資料中心層級的分散，SLA 也從 99.95% 提高到 99.99%。",
 en:{q:"Your company has an Azure subscription.\nYou need to deploy a number of Azure virtual machines (VMs) using Azure Resource Manager (ARM) templates. You have been informed that the VMs will be included in ⟦a single availability set⟧.\nYou are required to make sure that the ARM template you configure allows for ⟦as many VMs as possible to remain accessible in the event of fabric failure or maintenance⟧.\nWhich of the following is the value that you should configure for the ⟦platformFaultDomainCount⟧ property?",
     o:["10","30","Min Value","Max Value"],
     e:"An availability set spreads VMs using two kinds of domain, and their limits differ enough that they are easy to confuse:\n・**Fault domain** — a group of servers sharing a rack, power source and network switch. There are **only 2 or 3 per region** (region dependent; managed disks cap at 3). It protects against hardware failure.\n・**Update domain** — a group of VMs that can be rebooted together for host maintenance. **5 by default, up to 20 in Resource Manager deployments.** It protects against simultaneous reboots during planned maintenance.\nThis question asks about fault domains, so the only plausible values are 2 or 3 — **but the ceiling varies by region, so hard-coding a number in the template will fail to deploy in a region that only supports 2.** That is exactly why the options offer 'Max Value' rather than a specific figure:\n・10 and 30 — far above the fault domain ceiling; deployment simply fails. These figures belong to the update domain scale (20 is the update domain maximum) and exist as distractors.\n・Min Value — resolves to 1, meaning no spreading at all, the opposite of the requirement.\n・Max Value — correct. Let the platform take the highest count the region supports (2 or 3), spreading the VMs across as many independent hardware groups as possible.\nMnemonic: fault domains **2–3** (physical racks, few); update domains **5–20** (maintenance batches, many). A 20 means update domain; a 3 means fault domain.\nFurther: for stronger isolation use **availability zones**, which spread across datacenters and raise the SLA from 99.95% to 99.99%."}},

{sec:"S1", no:19, d:3, t:"更新網域數", tEn:"Update domain count",
 q:"你的公司有一個 Azure 訂用帳戶。\n你需要用 Azure Resource Manager（ARM）範本部署數台 Azure 虛擬機器（VM），並且已知這些 VM 會放在⟦同一個可用性設定組⟧裡。\n你必須確保你設定的 ARM 範本能讓⟦盡可能多的 VM 在網狀架構故障或維護時仍然可以存取⟧。\n下列哪一個是你應該為 ⟦platformUpdateDomainCount⟧ 屬性設定的值？",
 o:["10","20","30","40"],
 a:[1],
 e:"這一題與前一題（`S1#18`）是同一個情境，只把屬性從容錯網域換成更新網域。兩個數字一定要分清楚：\n・**容錯網域（platformFaultDomainCount）** — 共用機架、電源、網路交換器的一群伺服器。每個區域只有 **2 或 3** 個（受控磁碟最多 3）。防硬體故障。\n・**更新網域（platformUpdateDomainCount）** — 可以同時被重新開機做主機維護的一群 VM。**預設 5 個**，Resource Manager 部署可以提高到**最多 20 個**。防計畫性維護造成的同時重啟。\n本題要「盡可能多的 VM 在維護時仍可存取」，也就是把 VM 分散到越多個更新網域越好，因為 Azure 一次只會重啟一個更新網域裡的 VM。更新網域越多，每一批被重啟的 VM 就越少。\n逐一檢視選項：\n・10 — 合法（在 1–20 之間）但不是最大，沒有把分散做到最好。\n・20 — 正解，這是 ARM 部署允許的上限。\n・30、40 — 超過上限，部署會失敗。\n記法：更新網域 **預設 5、上限 20**；容錯網域 **2 或 3**。這兩題就是靠這兩組數字互相當干擾項。\n實務提醒：更新網域設成 20 只有在 VM 數量夠多時才有意義。如果設定組裡只有 3 台 VM，設 20 個更新網域跟設 3 個沒有差別——VM 是依序輪流分配到各個更新網域的，網域數超過 VM 數就有空的網域。",
 en:{q:"Your company has an Azure subscription.\nYou need to deploy a number of Azure virtual machines (VMs) using Azure Resource Manager (ARM) templates. You have been informed that the VMs will be included in ⟦a single availability set⟧.\nYou are required to make sure that the ARM template you configure allows for ⟦as many VMs as possible to remain accessible in the event of fabric failure or maintenance⟧.\nWhich of the following is the value that you should configure for the ⟦platformUpdateDomainCount⟧ property?",
     o:["10","20","30","40"],
     e:"Same scenario as the previous question (`S1#18`), with the property switched from fault domains to update domains. The two figures must be kept apart:\n・**Fault domain (platformFaultDomainCount)** — servers sharing a rack, power source and network switch. Only **2 or 3** per region (3 max with managed disks). Protects against hardware failure.\n・**Update domain (platformUpdateDomainCount)** — VMs that can be rebooted together for host maintenance. **5 by default**, raisable to **20 maximum** in Resource Manager deployments. Protects against simultaneous reboots during planned maintenance.\nThe requirement is that as many VMs as possible stay reachable during maintenance, which means spreading them over as many update domains as possible: Azure only reboots the VMs in one update domain at a time, so more update domains means fewer VMs down per batch.\nTaking the options in turn:\n・10 — legal (within 1–20) but not the maximum, so spreading is not as good as it could be.\n・20 — correct; this is the ceiling for Resource Manager deployments.\n・30 and 40 — above the ceiling; deployment fails.\nMnemonic: update domains **5 by default, 20 max**; fault domains **2 or 3**. These two questions use each other's figures as distractors.\nPractical note: setting 20 update domains only helps if you have enough VMs. With only 3 VMs in the set, 20 update domains behaves no differently from 3 — VMs are assigned to update domains round-robin, so any count above the VM count simply leaves empty domains."}},

{sec:"S1", no:20, d:3, k:"dd", fix:true, t:"用 Key Vault 存範本密碼", tEn:"Storing a template password in Key Vault",
 q:"（原題為 DRAG DROP 拖放題）\n你下載了一份 Azure Resource Manager（ARM）範本，要用它部署多台虛擬機器（VM）。這份範本是依一台現有的 VM 產生的，但必須改成⟦參照一個管理員密碼⟧。\n你必須確保這個⟦密碼不會以純文字形式儲存⟧。\n你正準備建立達成目標所需的元件。你應該建立下列哪些東西？請把正確的項目從清單拖到答案區。",
 items:["Azure Key Vault","Azure 儲存體帳戶","Azure Active Directory（AD）身分識別保護","存取原則（access policy）","Azure 原則（Azure Policy）","備份原則（backup policy）"],
 tgt:["第 1 個","第 2 個"],
 a:[0,3],
 e:"ARM 範本要用密碼但不想讓密碼落在純文字裡，官方做法就是把密碼放進 **Azure Key Vault**，範本的參數檔改成用 `reference` 指向保存庫裡的祕密：\n```\n\"adminPassword\": {\n  \"reference\": {\n    \"keyVault\": { \"id\": \"/subscriptions/…/vaults/myVault\" },\n    \"secretName\": \"vmAdminPassword\"\n  }\n}\n```\n這樣參數檔裡只有保存庫與祕密的名稱，密碼本身從頭到尾沒有出現過。\n需要建立的兩個東西：\n\n【第 1 個】→ Azure Key Vault\n存放祕密的地方。建立時必須把 ⟦enabledForTemplateDeployment⟧（入口網站上是「Azure Resource Manager 用於範本部署」）打開，否則部署時取不到祕密——這是最常踩的坑。\n\n【第 2 個】→ 存取原則（access policy）\n光有保存庫不夠，還要授權「誰可以讀這個祕密」。部署範本的使用者或服務主體需要對祕密的 **Get** 權限。保存庫的權限模型有兩種：舊的存取原則（本題的選項），以及現在建議的 Azure RBAC（`Key Vault Secrets User` 角色）。\n\n其餘四個選項為什麼不對：\n・Azure 儲存體帳戶 — 可以放範本檔案，但把密碼放進去一樣是純文字，沒解決問題。\n・Azure AD 身分識別保護 — 偵測身分風險（外洩憑證、不尋常登入）的功能，與範本祕密無關。\n・Azure 原則 — 稽核與強制資源設定合規，管不到範本參數怎麼傳。\n・備份原則 — 定義備份頻率與保留期，完全不相干。\n注意：原題的答案區是兩個沒有標籤的空格，順序不是答案的一部分；這裡照原始文件圖上的上下順序排，實務上也是先有保存庫才能加存取原則。",
 en:{q:"(Originally a DRAG DROP question)\nYou have downloaded an Azure Resource Manager (ARM) template to deploy numerous virtual machines (VMs). The ARM template is based on a current VM, but must be adapted to ⟦reference an administrative password⟧.\nYou need to make sure that the ⟦password cannot be stored in plain text⟧.\nYou are preparing to create the necessary components to achieve your goal. Which of the following should you create to achieve your goal? Answer by dragging the correct option from the list to the answer area.",
     items:["An Azure Key Vault","An Azure Storage account","Azure Active Directory (AD) Identity Protection","An access policy","An Azure policy","A backup policy"],
     tgt:["Slot 1","Slot 2"],
     e:"When an ARM template needs a password but the password must not appear in plain text, the documented approach is to keep it in **Azure Key Vault** and have the parameter file `reference` the secret:\n```\n\"adminPassword\": {\n  \"reference\": {\n    \"keyVault\": { \"id\": \"/subscriptions/…/vaults/myVault\" },\n    \"secretName\": \"vmAdminPassword\"\n  }\n}\n```\nThe parameter file then contains only the vault and secret names; the password itself never appears.\nThe two things to create:\n\n[Slot 1] -> An Azure Key Vault\nWhere the secret lives. It must be created with ⟦enabledForTemplateDeployment⟧ turned on (in the portal, 'Azure Resource Manager for template deployment'), or the deployment cannot retrieve the secret — the most common trap here.\n\n[Slot 2] -> An access policy\nA vault alone is not enough; something must authorise *who* may read the secret. The user or service principal running the deployment needs **Get** permission on secrets. Key Vault offers two permission models: the older access policies (this question's option) and the now-recommended Azure RBAC (`Key Vault Secrets User` role).\n\nWhy the other four are wrong:\n・An Azure Storage account — can hold template files, but a password put there is still plain text, so it solves nothing.\n・Azure AD Identity Protection — detects identity risk (leaked credentials, atypical sign-ins); unrelated to template secrets.\n・An Azure policy — audits and enforces resource configuration compliance; it has no say in how template parameters are passed.\n・A backup policy — defines backup frequency and retention; entirely unrelated.\nNote: the original answer area is two unlabelled slots, so order is not part of the answer. This entry follows the top-to-bottom order shown in the source document, which also matches reality: the vault must exist before an access policy can be added to it."}},

{sec:"S1", no:21, d:3, t:"新 VM 自動執行指令碼", tEn:"Running scripts on new VMs",
 q:"你的公司有一個 Azure Active Directory（Azure AD）租用戶，並與本地端 Active Directory 網域設定為混合式共存。\n本地端的虛擬環境是跑在 Windows Server 2012 R2 Hyper-V 主機上的虛擬機器（VM）。\n你寫了一些 PowerShell 指令碼，用來⟦自動設定新建立的 VM⟧。你打算建立好幾台新的 VM。\n你需要一個方案，確保這些指令碼會在⟦新的 VM 上執行⟧。下列哪一個是最好的方案？",
 o:["在 %windir%\\setup\\scripts 目錄裡設定一個 SetupComplete.cmd 批次檔","設定一個群組原則物件（GPO），把指令碼當成登入指令碼執行","設定一個群組原則物件（GPO），把指令碼當成啟動指令碼執行","把指令碼放進一顆新的虛擬硬碟（VHD）"],
 a:[0],
 e:"本題的關鍵限制是「**新建立的**VM」——指令碼要在 VM 第一次完成安裝時就跑，而那個時間點 VM 還沒加入網域、也還沒有人登入。\n・SetupComplete.cmd — Windows 安裝程式的官方擴充點。放在 `%windir%\\Setup\\Scripts\\SetupComplete.cmd`，Windows 安裝的最後階段會**以 Local System 身分自動執行一次**，在使用者第一次登入畫面出現之前。它是隨映像帶走的，所以每一台從該映像產生的新 VM 都會跑。正解。\n・GPO 登入指令碼 — 要有人登入才會觸發，而且要先加入網域。新建立、無人登入的 VM 完全不會執行。\n・GPO 啟動指令碼 — 每次開機都跑（不只第一次），而且同樣要先加入網域才吃得到 GPO。時機與範圍都不對。\n・把指令碼放進新的 VHD — 只是把檔案放到某個地方，沒有任何機制去執行它。\n延伸：這一題問的是**本地端 Hyper-V** 的做法，所以答案是 Windows 安裝程式層級的 SetupComplete.cmd。同樣的需求在 **Azure 上**有更適合的工具：\n・自訂指令碼擴充功能（Custom Script Extension）— 由 VM Agent 執行，指定要從儲存體帳戶下載哪些檔案、執行哪一個 .ps1，還能傳參數。這是 Azure VM 部署後自動設定的標準做法。\n・Linux VM 則用 cloud-init 搭配 `az vm create --custom-data`（見 `S1#5`）。\n考試常把這兩組混在一起問，判斷點是「這台機器在哪裡」：本地端映像 → SetupComplete.cmd；Azure VM → 自訂指令碼擴充功能。",
 en:{q:"Your company has an Azure Active Directory (Azure AD) tenant that is configured for hybrid coexistence with the on-premises Active Directory domain.\nThe on-premise virtual environment consists of virtual machines (VMs) running on Windows Server 2012 R2 Hyper-V host servers.\nYou have created some PowerShell scripts to ⟦automate the configuration of newly created VMs⟧. You plan to create several new VMs.\nYou need a solution that ensures the scripts are ⟦run on the new VMs⟧. Which of the following is the best solution?",
     o:["Configure a SetupComplete.cmd batch file in the %windir%\\setup\\scripts directory.","Configure a Group Policy Object (GPO) to run the scripts as logon scripts.","Configure a Group Policy Object (GPO) to run the scripts as startup scripts.","Place the scripts in a new virtual hard disk (VHD)."],
     e:"The binding constraint is '**newly created** VMs' — the scripts must run as the VM finishes setup, at which point it has not joined the domain and nobody has logged on.\n・SetupComplete.cmd — the documented extension point of Windows Setup. Placed at `%windir%\\Setup\\Scripts\\SetupComplete.cmd`, the final stage of Windows setup **runs it once automatically as Local System**, before the first logon screen appears. It travels with the image, so every new VM built from that image runs it. Correct.\n・GPO logon scripts — need someone to log on, and need the machine domain-joined first. A freshly created VM with nobody logged on never runs them.\n・GPO startup scripts — run at every boot (not just the first), and again require domain membership before GPO applies. Wrong timing and wrong scope.\n・Placing the scripts in a new VHD — that only puts files somewhere; nothing executes them.\nGoing further: this question is about **on-premises Hyper-V**, hence a Windows Setup–level answer. The same requirement on **Azure** has better-suited tooling:\n・Custom Script Extension — run by the VM Agent; you specify which files to download from a storage account, which .ps1 to execute, and any arguments. This is the standard way to configure an Azure VM after deployment.\n・Linux VMs use cloud-init with `az vm create --custom-data` (see `S1#5`).\nExams like to mix these up; the deciding question is where the machine is: on-premises image → SetupComplete.cmd; Azure VM → Custom Script Extension."}},

{sec:"S1", no:22, d:3, t:"上傳自訂映像", tEn:"Uploading a custom image",
 q:"你的公司有一個 Azure Active Directory（Azure AD）租用戶，並與本地端 Active Directory 網域設定為混合式共存。\n你打算在 Azure 部署數台虛擬機器（VM），這些 VM 的作業系統與自訂軟體需求都相同。\n你在本地端虛擬環境設定好一台參考 VM，然後把它⟦一般化（generalize）⟧以建立一個映像。\n你需要把這個映像⟦上傳到 Azure⟧，讓它在建立新的 Azure VM 時可以被選用。你應該使用哪一個 PowerShell Cmdlet？",
 o:["Add-AzVM","Add-AzVhd","Add-AzImage","Add-AzImageDataDisk"],
 a:[1],
 e:"把本地端映像搬到 Azure 的完整流程分成三段，本題問的是第二段：\n1. **準備映像** — 在來源機器上執行 `sysprep /generalize /oobe /shutdown`（也就是題目說的「一般化」），把電腦 SID、電腦名稱、驅動程式繫結清掉，這樣從映像產生的每一台 VM 才會是獨立的機器。\n2. **上傳 VHD** — 用 `Add-AzVhd` 把本地的 .vhd 檔上傳成儲存體帳戶裡的固定式 VHD（或直接上傳成受控磁碟）。**這就是本題的正解。**\n3. **建立映像資源並部署** — 用 `New-AzImage` 從上傳好的 VHD／受控磁碟建立一個映像資源，之後 `New-AzVM` 就能指定這個映像來建立 VM。\n逐一檢視選項：\n・Add-AzVM — 不存在。建立 VM 的動詞是 `New-`，不是 `Add-`。\n・Add-AzVhd — 正解。它把本地端的 .vhd 上傳到 blob 儲存體，並在需要時自動轉成固定式格式（Azure 只吃固定式 VHD，不吃動態擴充）。\n・Add-AzImage — 不存在。建立映像資源用的是 `New-AzImage`。\n・Add-AzImageDataDisk — 存在，但它是**在既有的映像設定物件上再加一顆資料磁碟**，屬於第 3 段組映像時的輔助 Cmdlet，不是上傳。\n記法：PowerShell 的動詞有規矩——**`New-` 建立新資源、`Add-` 把東西加到既有物件上、`Set-` 改設定**。看到「上傳」這個動作只有 `Add-AzVhd` 這一個例外符合。\n注意兩件事：VHD 必須是**固定式**且大小為 1 MB 的整數倍；Azure 只支援 VHD，**不支援 VHDX**，Hyper-V 的 VHDX 要先用 `Convert-VHD` 轉檔。",
 en:{q:"Your company has an Azure Active Directory (Azure AD) tenant that is configured for hybrid coexistence with the on-premises Active Directory domain.\nYou plan to deploy several new virtual machines (VMs) in Azure. The VMs will have the same operating system and custom software requirements.\nYou configure a reference VM in the on-premise virtual environment. You then ⟦generalize⟧ the VM to create an image.\nYou need to ⟦upload the image to Azure⟧ to ensure that it is available for selection when you create the new Azure VMs. Which PowerShell cmdlets should you use?",
     o:["Add-AzVM","Add-AzVhd","Add-AzImage","Add-AzImageDataDisk"],
     e:"Moving an on-premises image to Azure has three stages, and this question asks about the second:\n1. **Prepare the image** — run `sysprep /generalize /oobe /shutdown` on the source machine (the 'generalize' step in the stem), clearing the machine SID, computer name and driver bindings so every VM built from the image is a distinct machine.\n2. **Upload the VHD** — use `Add-AzVhd` to upload the local .vhd as a fixed VHD in a storage account (or directly as a managed disk). **This is the answer.**\n3. **Create an image resource and deploy** — use `New-AzImage` to build an image resource from the uploaded VHD/managed disk, after which `New-AzVM` can create VMs from that image.\nTaking the options in turn:\n・Add-AzVM — does not exist. The verb for creating a VM is `New-`, not `Add-`.\n・Add-AzVhd — correct. It uploads a local .vhd to blob storage, converting to fixed format when needed (Azure accepts only fixed VHDs, not dynamically expanding ones).\n・Add-AzImage — does not exist; creating an image resource is `New-AzImage`.\n・Add-AzImageDataDisk — exists, but it **adds a data disk to an existing image configuration object**, a helper for stage 3 rather than an upload.\nMnemonic: PowerShell verbs are disciplined — **`New-` creates a resource, `Add-` adds something to an existing object, `Set-` changes configuration.** For the act of uploading, `Add-AzVhd` is the one exception that fits.\nTwo gotchas: the VHD must be **fixed** size and a whole number of MB; and Azure supports VHD only, **not VHDX**, so a Hyper-V VHDX must be converted first with `Convert-VHD`."}},

{sec:"S1", no:23, d:5, k:"dd", fix:true, t:"複寫 Hyper-V VM 到 Azure", tEn:"Replicating a Hyper-V VM to Azure",
 q:"（原題為 DRAG DROP 拖放題）\n你的公司有一個 Azure 訂用帳戶，裡面有數台 Azure 虛擬機器（VM），全部屬於同一個虛擬網路。\n公司另外有一台本地端 Hyper-V 伺服器，上面有一台名為 VM1 的虛擬機器，⟦必須複寫到 Azure⟧。\n為了達成這個目標，⟦必須建立哪些物件⟧？請把正確的項目從清單拖到答案區。",
 items:["Hyper-V 站台（Hyper-V site）","儲存體帳戶（Storage account）","Azure Recovery Services 保存庫","Azure Traffic Manager 實例","複寫原則（Replication policy）","端點（Endpoint）"],
 tgt:["第 1 個","第 2 個","第 3 個"],
 a:[0,2,4],
 e:"把本地端 Hyper-V VM 複寫到 Azure 用的是 **Azure Site Recovery**。整組必要物件如下：\n・**Recovery Services 保存庫** — Site Recovery 與 Azure Backup 共用的容器，所有複寫設定、複寫狀態、復原點都掛在它底下。沒有它什麼都不能開始。\n・**Hyper-V 站台** — 代表一群本地端 Hyper-V 主機的邏輯容器（未搭配 VMM 的情境用這個）。建好站台之後把 Hyper-V 主機註冊進去，Azure 才知道要從哪些主機抓 VM。\n・**複寫原則** — 定義複寫頻率、要保留幾小時的復原點、應用程式一致快照的頻率，然後把原則關聯到 Hyper-V 站台。\n\n【第 1 個】→ Hyper-V 站台\n【第 2 個】→ Azure Recovery Services 保存庫\n【第 3 個】→ 複寫原則\n\n其餘三個選項為什麼不對：\n・儲存體帳戶 — 以前的傳統做法要自備儲存體帳戶當複寫目標，**現在的 Site Recovery 會自己管理受控磁碟，不需要你先建立**。這是最強的干擾項。\n・Azure Traffic Manager 實例 — 跨區域的 DNS 層流量導向，屬於高可用性架構的一環，不是複寫機制。\n・端點 — 是 Traffic Manager 或負載平衡器底下的設定物件，同樣與複寫無關。\n\n注意：原題問的是「必須建立哪些物件」，答案區的三格沒有標籤，**順序不是答案的一部分**；這裡照原始文件圖上的上下順序排。實務上的建立順序其實是**先建保存庫 → 再建 Hyper-V 站台 → 最後建複寫原則**（站台要建在保存庫底下），與圖上的順序不同，記概念不要記順序。",
 en:{q:"(Originally a DRAG DROP question)\nYour company has an Azure subscription that includes a number of Azure virtual machines (VMs), which are all part of the same virtual network.\nYour company also has an on-premises Hyper-V server that hosts a VM, named VM1, which ⟦must be replicated to Azure⟧.\nWhich of the following ⟦objects must be created⟧ to achieve this goal? Answer by dragging the correct option from the list to the answer area.",
     items:["Hyper-V site","Storage account","Azure Recovery Services Vault","Azure Traffic Manager instance","Replication policy","Endpoint"],
     tgt:["Slot 1","Slot 2","Slot 3"],
     e:"Replicating an on-premises Hyper-V VM to Azure is a job for **Azure Site Recovery**. The full set of required objects:\n・**Recovery Services vault** — the container shared by Site Recovery and Azure Backup; all replication settings, replication state and recovery points hang off it. Nothing can start without one.\n・**Hyper-V site** — a logical container representing a group of on-premises Hyper-V hosts (used in scenarios without VMM). You register the Hyper-V hosts into the site so Azure knows which hosts to pull VMs from.\n・**Replication policy** — defines replication frequency, how many hours of recovery points to retain, and app-consistent snapshot frequency; it is then associated with the Hyper-V site.\n\n[Slot 1] -> Hyper-V site\n[Slot 2] -> Azure Recovery Services Vault\n[Slot 3] -> Replication policy\n\nWhy the other three are wrong:\n・Storage account — the older classic flow required you to supply a storage account as the replication target, but **modern Site Recovery manages managed disks itself and needs no pre-created account.** This is the strongest distractor.\n・Azure Traffic Manager instance — DNS-level traffic direction across regions, part of a high-availability design rather than a replication mechanism.\n・Endpoint — a configuration object under Traffic Manager or a load balancer; likewise unrelated to replication.\n\nNote: the original question asks which objects must be created, and the three slots carry no labels, so **order is not part of the answer**. This entry follows the top-to-bottom order shown in the source document. The real-world creation order is actually **vault first, then the Hyper-V site, then the replication policy** (the site is created inside the vault), which differs from the picture — learn the set, not the order."}},

{sec:"S1", no:24, d:4, t:"點對站連到對等互連的網路", tEn:"P2S to a peered network",
 q:"注意：本題與另外數題的情境完全相同，但每一題提出的解法不同，請個別判斷解法是否達成目標。\n你的公司的 Azure 訂用帳戶包含兩個 Azure 網路，名為 VirtualNetworkA 與 VirtualNetworkB。\nVirtualNetworkA 有一個 VPN 閘道，設定為使用⟦靜態路由⟧；公司的本地端網路與 VirtualNetworkA 之間也有一條站對站（site-to-site）VPN 連線。\n你從一台 Windows 10 工作站設定了一條連到 VirtualNetworkA 的⟦點對站（point-to-site）VPN 連線⟧。在 VirtualNetworkA 與 VirtualNetworkB 之間設定虛擬網路對等互連之後，你確認可以從公司的本地端網路存取 VirtualNetworkB。\n但你發現⟦從那台 Windows 10 工作站無法連到 VirtualNetworkB⟧。你必須讓這台工作站能連到 VirtualNetworkB。\n⟦解法：你在 VirtualNetworkA 上選取「允許閘道傳輸（Allow gateway transit）」設定⟧。這個解法是否達成目標？",
 o:["是","否"],
 a:[1],
 e:"這一組三題考的是同一個觀念：**點對站的用戶端拿到哪些路由，是在下載用戶端設定包的那一刻決定的。**\n先看對等互連的兩個關鍵設定：\n・**允許閘道傳輸（Allow gateway transit）** — 設在「**有**閘道」的那個虛擬網路上（本題是 VirtualNetworkA），意思是「我願意把我的閘道借給對方用」。\n・**使用遠端閘道（Use remote gateways）** — 設在「**沒有**閘道」的那個虛擬網路上（VirtualNetworkB），意思是「我要借用對方的閘道」。\n這兩個要成對設定，閘道傳輸才會生效。題目說本地端（走站對站）已經連得到 VirtualNetworkB，代表**閘道傳輸其實已經設好了**——所以再去 VirtualNetworkA 上點一次「允許閘道傳輸」，什麼都不會改變。\n那為什麼點對站不通？因為點對站的用戶端是靠**用戶端設定包裡的路由表**知道哪些網段要走 VPN 通道。工作站是在對等互連建立**之前**下載並安裝設定包的，那份設定裡沒有 VirtualNetworkB 的位址範圍，所以工作站根本不會把往 VirtualNetworkB 的流量送進通道。\n**正解是重新下載並安裝 VPN 用戶端設定包**（見 `S1#26`）。每次拓撲變動——新增對等互連、改位址空間、加新的網路——都必須重新產生並重新發佈用戶端設定，否則既有用戶端看不到新網段。\n所以本題答案是「否」。\n記法：對等互連改完 → 本地端（站對站）自動生效；點對站用戶端**一定要重新拿設定包**。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company's Azure subscription includes two Azure networks named VirtualNetworkA and VirtualNetworkB.\nVirtualNetworkA includes a VPN gateway that is configured to make use of ⟦static routing⟧. Also, a site-to-site VPN connection exists between your company's on-premises network and VirtualNetworkA.\nYou have configured a ⟦point-to-site VPN connection⟧ to VirtualNetworkA from a workstation running Windows 10. After configuring virtual network peering between VirtualNetworkA and VirtualNetworkB, you confirm that you are able to access VirtualNetworkB from the company's on-premises network.\nHowever, you find that ⟦you cannot establish a connection to VirtualNetworkB from the Windows 10 workstation⟧. You have to make sure that a connection to VirtualNetworkB can be established from the Windows 10 workstation.\n⟦Solution: You choose the Allow gateway transit setting on VirtualNetworkA⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"All three questions in this set turn on one idea: **the routes a point-to-site client knows about are fixed at the moment it downloads the client configuration package.**\nFirst, the two key peering settings:\n・**Allow gateway transit** — set on the virtual network that **has** the gateway (here VirtualNetworkA); it means 'I am willing to lend my gateway'.\n・**Use remote gateways** — set on the virtual network that has **no** gateway (VirtualNetworkB); it means 'I want to borrow the other side's gateway'.\nBoth must be set for gateway transit to work. The stem states that on-premises (over site-to-site) can already reach VirtualNetworkB, which means **gateway transit is already configured** — so clicking Allow gateway transit on VirtualNetworkA again changes nothing.\nWhy does point-to-site fail then? Because a P2S client learns which prefixes to send down the tunnel from the **route table baked into its client configuration package**. The workstation downloaded and installed that package *before* peering existed, so it contains no address range for VirtualNetworkB and the client never sends VirtualNetworkB traffic into the tunnel at all.\n**The fix is to download and reinstall the VPN client configuration package** (see `S1#26`). Every topology change — new peering, changed address space, added network — requires regenerating and redistributing the client configuration, or existing clients stay blind to the new prefixes.\nSo the answer here is No.\nMnemonic: after a peering change, on-premises (site-to-site) works automatically; point-to-site clients **must fetch a new configuration package**."}},

{sec:"S1", no:25, d:4, t:"點對站連到對等互連的網路", tEn:"P2S to a peered network",
 q:"注意：本題與另外數題的情境完全相同，但每一題提出的解法不同，請個別判斷解法是否達成目標。\n你的公司的 Azure 訂用帳戶包含兩個 Azure 網路，名為 VirtualNetworkA 與 VirtualNetworkB。\nVirtualNetworkA 有一個 VPN 閘道，設定為使用⟦靜態路由⟧；公司的本地端網路與 VirtualNetworkA 之間也有一條站對站（site-to-site）VPN 連線。\n你從一台 Windows 10 工作站設定了一條連到 VirtualNetworkA 的⟦點對站（point-to-site）VPN 連線⟧。在 VirtualNetworkA 與 VirtualNetworkB 之間設定虛擬網路對等互連之後，你確認可以從公司的本地端網路存取 VirtualNetworkB。\n但你發現⟦從那台 Windows 10 工作站無法連到 VirtualNetworkB⟧。你必須讓這台工作站能連到 VirtualNetworkB。\n⟦解法：你在 VirtualNetworkB 上選取「允許閘道傳輸（Allow gateway transit）」設定⟧。這個解法是否達成目標？",
 o:["是","否"],
 a:[1],
 e:"這一題比前一題（`S1#24`）多錯一層：**不只沒解決問題，連設定的位置都放錯了。**\n對等互連的兩個設定各有各的邊：\n・**允許閘道傳輸** — 設在**有閘道**的那一邊。它的意思是「我把我的閘道借出去」。本題有閘道的是 VirtualNetworkA。\n・**使用遠端閘道** — 設在**沒有閘道**的那一邊。它的意思是「我要借用對方的閘道」。本題沒有閘道的是 VirtualNetworkB。\n所以在 VirtualNetworkB（沒有閘道）上選「允許閘道傳輸」是把兩個設定搞反了——它根本沒有閘道可以借給別人。VirtualNetworkB 該設的是「使用遠端閘道」。\n就算設對了位置也還是不通，因為真正的原因不在對等互連：題目已經說本地端走站對站可以到 VirtualNetworkB，代表閘道傳輸這一組設定本來就是好的。**問題在點對站用戶端的路由是舊的。**\n點對站用戶端只認得下載設定包時就存在的位址範圍。工作站是在對等互連之前安裝設定的，那份路由裡沒有 VirtualNetworkB，所以流量不會進通道。正解是重新下載並安裝用戶端設定包（`S1#26`）。\n答案是「否」。\n記法：「允許閘道傳輸」在**有**閘道那邊，「使用遠端閘道」在**沒有**閘道那邊。看到題目把這兩個放反，直接排除。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company's Azure subscription includes two Azure networks named VirtualNetworkA and VirtualNetworkB.\nVirtualNetworkA includes a VPN gateway that is configured to make use of ⟦static routing⟧. Also, a site-to-site VPN connection exists between your company's on-premises network and VirtualNetworkA.\nYou have configured a ⟦point-to-site VPN connection⟧ to VirtualNetworkA from a workstation running Windows 10. After configuring virtual network peering between VirtualNetworkA and VirtualNetworkB, you confirm that you are able to access VirtualNetworkB from the company's on-premises network.\nHowever, you find that ⟦you cannot establish a connection to VirtualNetworkB from the Windows 10 workstation⟧. You have to make sure that a connection to VirtualNetworkB can be established from the Windows 10 workstation.\n⟦Solution: You choose the Allow gateway transit setting on VirtualNetworkB⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"This solution is wrong on one more level than the previous one (`S1#24`): **not only does it fail to fix the problem, the setting is on the wrong side.**\nEach peering setting belongs to a specific side:\n・**Allow gateway transit** — set on the side that **has** the gateway. It means 'I am lending out my gateway'. Here that is VirtualNetworkA.\n・**Use remote gateways** — set on the side with **no** gateway. It means 'I want to borrow the other side's gateway'. Here that is VirtualNetworkB.\nSo choosing Allow gateway transit on VirtualNetworkB (which has no gateway) has the two settings backwards — it has no gateway to lend. What VirtualNetworkB should have is Use remote gateways.\nEven placed correctly it would not help, because the real cause is not peering at all: the stem already says on-premises reaches VirtualNetworkB over site-to-site, so gateway transit is evidently configured. **The problem is that the point-to-site client's routes are stale.**\nA P2S client only knows the address ranges that existed when it downloaded its configuration. This workstation installed its configuration before peering, so VirtualNetworkB is not in its route table and traffic never enters the tunnel. The fix is to download and reinstall the client configuration package (`S1#26`).\nThe answer is No.\nMnemonic: Allow gateway transit goes on the side that **has** the gateway; Use remote gateways on the side that does **not**. If a question swaps them, rule it out."}},

{sec:"S1", no:26, d:4, t:"點對站連到對等互連的網路", tEn:"P2S to a peered network",
 q:"注意：本題與另外數題的情境完全相同，但每一題提出的解法不同，請個別判斷解法是否達成目標。\n你的公司的 Azure 訂用帳戶包含兩個 Azure 網路，名為 VirtualNetworkA 與 VirtualNetworkB。\nVirtualNetworkA 有一個 VPN 閘道，設定為使用⟦靜態路由⟧；公司的本地端網路與 VirtualNetworkA 之間也有一條站對站（site-to-site）VPN 連線。\n你從一台 Windows 10 工作站設定了一條連到 VirtualNetworkA 的⟦點對站（point-to-site）VPN 連線⟧。在 VirtualNetworkA 與 VirtualNetworkB 之間設定虛擬網路對等互連之後，你確認可以從公司的本地端網路存取 VirtualNetworkB。\n但你發現⟦從那台 Windows 10 工作站無法連到 VirtualNetworkB⟧。你必須讓這台工作站能連到 VirtualNetworkB。\n⟦解法：你在那台 Windows 10 工作站上重新下載並安裝 VPN 用戶端設定包⟧。這個解法是否達成目標？",
 o:["是","否"],
 a:[0],
 e:"這是這一組三題裡唯一達成目標的解法。\n**點對站用戶端不會動態學習路由。** VPN 閘道產生的「用戶端設定包」裡就包含了一份路由清單，列出哪些位址範圍要送進 VPN 通道。用戶端安裝之後，那份路由就固定了。\n本題的時間順序正好踩到這個坑：\n1. 工作站先設定好點對站連線並安裝設定包——此時 VirtualNetworkB 還不存在於拓撲中，設定包裡只有 VirtualNetworkA 的位址範圍。\n2. 之後才建立 VirtualNetworkA ⇄ VirtualNetworkB 的對等互連，並設好「允許閘道傳輸」／「使用遠端閘道」。\n3. 本地端走站對站的流量是由**閘道**判斷路由的，閘道知道新的對等互連，所以本地端立刻就通了。\n4. 但工作站手上那份路由還是舊的，往 VirtualNetworkB 的封包不會進通道，而是被送到預設閘道然後丟掉。\n所以只要**重新產生並重新安裝用戶端設定包**，新的路由清單就會包含 VirtualNetworkB 的位址範圍，工作站立刻連得上。答案是「是」。\n什麼時候必須重發用戶端設定：\n・新增或移除虛擬網路對等互連\n・變更虛擬網路的位址空間\n・變更點對站的位址集區\n・變更通道類型或驗證方式\n・更換根憑證\n對照另外兩個解法：`S1#24` 在有閘道那邊重複設定已經生效的「允許閘道傳輸」，什麼都沒改；`S1#25` 更把「允許閘道傳輸」設在沒有閘道的 VirtualNetworkB 上，連位置都錯了。",
 en:{q:"Note: The question is included in a number of questions that depicts the identical set-up. However, every question has a distinctive result. Establish if the solution satisfies the requirements.\nYour company's Azure subscription includes two Azure networks named VirtualNetworkA and VirtualNetworkB.\nVirtualNetworkA includes a VPN gateway that is configured to make use of ⟦static routing⟧. Also, a site-to-site VPN connection exists between your company's on-premises network and VirtualNetworkA.\nYou have configured a ⟦point-to-site VPN connection⟧ to VirtualNetworkA from a workstation running Windows 10. After configuring virtual network peering between VirtualNetworkA and VirtualNetworkB, you confirm that you are able to access VirtualNetworkB from the company's on-premises network.\nHowever, you find that ⟦you cannot establish a connection to VirtualNetworkB from the Windows 10 workstation⟧. You have to make sure that a connection to VirtualNetworkB can be established from the Windows 10 workstation.\n⟦Solution: You download and re-install the VPN client configuration package on the Windows 10 workstation⟧. Does the solution meet the goal?",
     o:["Yes","No"],
     e:"This is the only solution of the three that meets the goal.\n**Point-to-site clients do not learn routes dynamically.** The client configuration package generated by the VPN gateway contains a route list naming which address ranges to send down the tunnel. Once the client installs it, those routes are fixed.\nThe sequence in this question walks straight into that:\n1. The workstation configures P2S and installs the package — at which point VirtualNetworkB is not yet in the topology, so the package carries only VirtualNetworkA's address range.\n2. Only afterwards is VirtualNetworkA ⇄ VirtualNetworkB peering created, with Allow gateway transit / Use remote gateways set.\n3. On-premises traffic over site-to-site is routed by the **gateway**, which does know about the new peering, so on-premises works immediately.\n4. But the workstation's route list is still the old one, so packets for VirtualNetworkB never enter the tunnel — they go to the default gateway and are dropped.\nSo regenerating and reinstalling the client configuration package gives the workstation a route list that includes VirtualNetworkB's range, and it connects immediately. The answer is Yes.\nWhen the client configuration must be reissued:\n・adding or removing virtual network peering\n・changing a virtual network's address space\n・changing the P2S address pool\n・changing tunnel type or authentication method\n・rotating the root certificate\nCompared with the other two: `S1#24` re-applies an Allow gateway transit setting that is already in effect and changes nothing; `S1#25` puts Allow gateway transit on VirtualNetworkB, which has no gateway, so even the placement is wrong."}},

{sec:"S1", no:27, d:4, t:"遠端工作者的連線方式", tEn:"Connectivity for remote workers",
 q:"你的公司有虛擬機器（VM）託管在 Microsoft Azure，全部位於同一個名為 VNet1 的 Azure 虛擬網路裡。\n公司有一些⟦遠端工作的使用者⟧，他們需要存取 VNet1 上的 VM。\n你需要為這些遠端工作者提供存取管道。你應該怎麼做？",
 o:["設定站對站（Site-to-Site，S2S）VPN","設定 VNet 對 VNet（VNet-to-VNet）VPN","設定點對站（Point-to-Site，P2S）VPN","在一台 Windows Server 2012 伺服器 VM 上設定 DirectAccess","設定多站台（Multi-Site）VPN"],
 a:[2],
 e:"判斷點只有一個：**要連進來的是「個別裝置」還是「整個網路」。**\n把 Azure VPN 閘道的連線型態整組列出來：\n・**點對站（P2S）** — 從**單一台用戶端電腦**建立到虛擬網路的安全連線，用戶端裝一個 VPN 用戶端就好，不需要 VPN 裝置、也不需要固定的公用 IP。適合在家或出差的個別使用者。**本題正解。**\n・**站對站（S2S）** — 把**整個本地端網路**接到虛擬網路，需要在本地端有一台具備公用 IP 的 VPN 裝置（或 RRAS），走 IPsec/IKE。適合辦公室對雲端。\n・**多站台（Multi-Site）** — 站對站的擴充，讓一個虛擬網路同時連多個本地端站台。仍然是「網路對網路」，需要每個站台各自有 VPN 裝置。\n・**VNet 對 VNet** — 把兩個 Azure 虛擬網路接起來。與遠端使用者無關。\n・**ExpressRoute** — 不走網際網路的專線，由合作夥伴提供。適合頻寬與延遲要求高的正式環境。\n本題是「遠端工作的使用者」——是人帶著各自的筆電，不是一個有 VPN 裝置的站台，所以只有點對站符合。\n逐一排除其他選項：\n・S2S、多站台 — 要求本地端有 VPN 裝置與固定公用 IP，遠端工作者的家用網路沒有這些條件。\n・VNet 對 VNet — 連的是兩個 Azure 網路，不是使用者。\n・DirectAccess — Windows Server 的本地端遠端存取技術，需要完整的 AD、PKI、IPv6 轉換基礎架構，而且**在 Azure VM 上不受支援**（官方明確不支援在 Azure IaaS VM 上執行 DirectAccess）。\n補充：現在的做法還可以用 **Azure Bastion**（只想從瀏覽器 RDP／SSH 進單台 VM，不需要 VPN），或 **Azure Virtual Desktop**。但題目問的是連到 VNet1 上的 VM 這件事本身，標準答案是 P2S。",
 en:{q:"Your company has virtual machines (VMs) hosted in Microsoft Azure. The VMs are located in a single Azure virtual network named VNet1.\nThe company has ⟦users that work remotely⟧. The remote workers require access to the VMs on VNet1.\nYou need to provide access for the remote workers. What should you do?",
     o:["Configure a Site-to-Site (S2S) VPN.","Configure a VNet-to-VNet VPN.","Configure a Point-to-Site (P2S) VPN.","Configure DirectAccess on a Windows Server 2012 server VM.","Configure a Multi-Site VPN"],
     e:"There is one deciding question: is what needs to connect **an individual device** or **a whole network**?\nThe full set of Azure VPN gateway connection types:\n・**Point-to-Site (P2S)** — a secure connection from a **single client computer** to the virtual network. The client just installs a VPN client; no VPN device and no fixed public IP required. Suits individual users at home or travelling. **The answer here.**\n・**Site-to-Site (S2S)** — joins an **entire on-premises network** to the virtual network, requiring an on-premises VPN device (or RRAS) with a public IP, over IPsec/IKE. Suits office-to-cloud.\n・**Multi-Site** — an extension of S2S letting one virtual network connect to several on-premises sites. Still network-to-network, still a VPN device per site.\n・**VNet-to-VNet** — joins two Azure virtual networks. Nothing to do with remote users.\n・**ExpressRoute** — a private circuit that avoids the internet, provided by a partner. Suits production workloads with strict bandwidth and latency needs.\nThis question involves remote *workers* — people with their own laptops, not a site with a VPN device — so only point-to-site fits.\nRuling out the rest:\n・S2S and Multi-Site — require an on-premises VPN device and a fixed public IP, which a remote worker's home network does not have.\n・VNet-to-VNet — connects two Azure networks, not users.\n・DirectAccess — a Windows Server on-premises remote access technology needing full AD, PKI and IPv6 transition infrastructure, and it is **not supported on Azure VMs** (Microsoft explicitly does not support running DirectAccess on Azure IaaS VMs).\nFurther: modern alternatives include **Azure Bastion** (browser-based RDP/SSH to a single VM with no VPN at all) and **Azure Virtual Desktop**. But for the question as asked — reaching the VMs on VNet1 — the standard answer is P2S."}}
