 s:["雲端端點上的 File1.txt 會被來自 Share1 的 File1.txt 覆蓋。",
    "Server1 上的 File1.txt 會被來自雲端端點的 File1.txt 覆蓋。",
    "來自 Share1 的 File1.txt 會複寫到 Share2。"],
 a:[1,0,1],
 e:"Share1 是第一個加入的伺服器端點，初次同步的方向是把 Share1 的檔案「上傳」到雲端端點，所以雲端的 File1.txt 會被 Share1 上傳的版本覆蓋（是）。\n這次同步是上傳，不是把雲端內容下載回 Server1，所以 Server1 本地的 File1.txt 不會被雲端版本覆蓋（否）。\n一小時後加入 Share2 為新端點，雲端端點目前的 File1.txt（來自 Share1）會下載同步到 Share2，所以 File1.txt 會複寫到 Share2（是）。",
 en:{q:"You have a sync group Sync1 with a cloud endpoint containing File1.txt. Your on-premises servers are as shown. You add Share1 as an endpoint for Sync1, then one hour later add Share2.\nFor each statement, select Yes if true, otherwise No.",
  s:["The cloud endpoint's File1.txt will be overwritten by File1.txt from Share1.",
     "On Server1, File1.txt will be overwritten by File1.txt from the cloud endpoint.",
     "File1.txt from Share1 replicates to Share2."],
  e:"Adding Share1 first triggers an initial upload sync, so the cloud copy is overwritten by Share1's version. This is an upload, not a download, so Server1's local copy is unaffected. An hour later, the cloud's File1.txt (originally from Share1) syncs down to the newly added Share2."}},

{n:733, code:"AZ104-Q733", d:2, od:2, k:"dd", fix:true, t:"File Sync 部署步驟", tEn:"File Sync deployment steps",
 src:"quiz20:260400_ans.png",
 q:"你有一台執行 Windows Server 2016 的內部部署檔案伺服器 Server1。\n你有一個包含 Azure 檔案共用的 Azure 訂用帳戶。\n你部署了一個 Azure File Sync 的 Storage Sync Service，並建立了一個同步群組。\n你需要把 Server1 的檔案同步到 Azure。\n⟦你應該依序執行哪三個動作？請把清單中正確的動作拖曳到答案區並排出正確順序。⟧",
 items:["在 Server1 上安裝 Azure File Sync 代理程式","建立內部部署資料閘道","建立 Recovery Services 保存庫","註冊 Server1","新增伺服器端點","在 Server1 上安裝 DFS 複寫伺服器角色"],
 tgt:["第一步","第二步","第三步"],
 a:[0,3,4],
 e:"解法：先在 Server1 安裝 Azure File Sync 代理程式，接著在 Storage Sync Service 中「註冊」Server1，最後把 Server1 上的資料夾新增為同步群組的伺服器端點，這樣就會開始跟雲端端點（Azure 檔案共用）同步。\n・建立內部部署資料閘道與 Site-to-Site VPN／ExpressRoute 有關，與 File Sync 無關。\n・Recovery Services 保存庫是備份用的，不是 File Sync 的元件。\n・DFS 複寫是傳統地端方案，不是 Azure File Sync 的必要元件。",
 en:{q:"You have an on-premises file server Server1 running Windows Server 2016. You have an Azure subscription with an Azure file share. You deploy an Azure File Sync Storage Sync Service and create a sync group.\nYou need to synchronize files from Server1 to Azure.\nWhich three actions should you perform in sequence?",
  items:["Install the Azure File Sync agent on Server1","Create an on-premises data gateway","Create a Recovery Services vault","Register Server1","Add a server endpoint","Install the DFS Replication server role on Server1"],
  tgt:["Step 1","Step 2","Step 3"],
  e:"Solution: install the Azure File Sync agent on Server1, register Server1 with the Storage Sync Service, then add a server endpoint to start syncing with the cloud endpoint."}},

{n:734, code:"AZ104-Q734", d:2, od:2, k:"dl", t:"儲存體複寫設定", tEn:"Storage replication config",
 src:"quiz20:262320_ans.png",
 q:"你計畫在 East US 2 地區建立一個 Azure 儲存體帳戶。\n你要建立的儲存體帳戶必須符合以下需求：\n・同步複寫。\n・當地區中單一資料中心故障時仍可保持可用。\n⟦你應該如何設定這個儲存體帳戶？⟧",
 sent:"複寫方式：{0}\n帳戶類型：{1}",
 dd:[["異地備援儲存體 (GRS)","本地備援儲存體 (LRS)","讀取權限異地備援儲存體 (RA-GRS)","區域備援儲存體 (ZRS)"],
     ["Blob 儲存體","儲存體（通用 v1）","StorageV2（通用 v2）"]],
 a:[3,2],
 e:"「同步複寫」加上「單一資料中心故障仍可用」是區域備援儲存體 (ZRS) 的定義：ZRS 會把資料同步複寫到區域內三個不同的可用區域，任何一個資料中心故障都不影響可用性。GRS／RA-GRS 是「非同步」複寫到另一個地區，不符合「同步複寫」的需求；LRS 只在單一資料中心內複寫三份，資料中心故障就無法使用。\n帳戶類型要選 StorageV2（通用 v2），才能完整支援各種儲存體服務與存取層。",
 en:{q:"You plan to create an Azure Storage account in East US 2. Requirements: replicates synchronously; remains available if a single data center in the region fails.\nHow should you configure the storage account?",
  sent:"Replication: {0}\nAccount type: {1}",
  dd:[["Geo-redundant storage (GRS)","Locally-redundant storage (LRS)","Read-access geo-redundant storage (RA-GRS)","Zone-redundant storage (ZRS)"],
      ["Blob storage","Storage (general purpose v1)","StorageV2 (general purpose v2)"]],
  e:"ZRS synchronously replicates across three availability zones in a region, so a single data center failure doesn't affect availability. GRS/RA-GRS replicate asynchronously to another region; LRS replicates only within one data center."}},

{n:735, code:"AZ104-Q735", d:3, od:5, k:"dl", t:"Recovery Services 範圍", tEn:"Recovery Services vault scope",
 src:"quiz20:267600_ans.png",
 q:"你有一個名為 Subscription1 的 Azure 訂用帳戶，內有下表所示的資源：\n| 名稱 | 類型 | 位置 |\n|---|---|---|\n| RG1、RG2 | 資源群組 | West US |\n| Vault1 | Recovery Services 保存庫 | Central US |\n| Vault2 | Recovery Services 保存庫 | West US |\n| VM1 | 虛擬機器 | Central US |\n| storage1 | 儲存體帳戶 | West US |\n| SQL1 | Azure SQL 資料庫 | East US |\n在 storage1 中，你建立了一個名為 blob1 的 Blob 容器與一個名為 share1 的檔案共用。\n⟦Vault1 與 Vault2 各自可以備份哪些資源？⟧",
 sent:"Vault1 可用來備份：{0}\nVault2 可用來備份：{1}",
 dd:[["僅 VM1","僅 VM1 和 share1","僅 VM1 和 SQL1","僅 VM1、storage1 和 SQL1","VM1、blob1、share1 和 SQL1"],
     ["僅 storage1","僅 share1","僅 VM1 和 share1","僅 blob1 和 share1","僅 storage1 和 SQL1"]],
 a:[0,1],
 e:"Recovery Services 保存庫要備份的資源必須與保存庫在同一個地區。Vault1 在 Central US，清單裡只有 VM1 也在 Central US，所以 Vault1 只能備份 VM1（SQL1 在 East US、storage1 在 West US，地區都不符）。\nVault2 在 West US，storage1 與 share1 都在 West US，但 Recovery Services 保存庫不支援直接備份儲存體帳戶或 Blob 容器，只支援 Azure 檔案共用（透過 Azure Backup 的檔案共用備份）、VM、SQL 等特定工作負載，所以 Vault2 只能備份 share1，不能備份 storage1 帳戶本身或 blob1 容器。",
 en:{q:"You have Subscription1 with the resources shown (RG1/RG2 in West US, Vault1 in Central US, Vault2 in West US, VM1 in Central US, storage1 in West US, SQL1 in East US). In storage1 you create blob container blob1 and file share share1.\nWhich resources can be backed up to Vault1 and Vault2?",
  sent:"Vault1 can be used to back up: {0}\nVault2 can be used to back up: {1}",
  dd:[["VM1 only","VM1 and share1 only","VM1 and SQL1 only","VM1, storage1, and SQL1 only","VM1, blob1, share1, and SQL1"],
      ["storage1 only","share1 only","VM1 and share1 only","blob1 and share1 only","storage1 and SQL1 only"]],
  e:"A Recovery Services vault can only back up resources in the same region. Vault1 (Central US) can only back up VM1. Vault2 (West US) can back up share1 (Azure file share backup is supported), but not the storage account itself or a blob container, since Recovery Services vaults don't support those workloads."}},

{n:736, code:"AZ104-Q736", d:2, od:2, k:"dl", t:"AzCopy 驗證方式", tEn:"AzCopy authentication",
 src:"quiz20:273120_ans.png",
 q:"你有一個名為 storage1 的 Azure 儲存體帳戶，同時使用 Azure Blob 儲存體與 Azure 檔案儲存體。\n你要使用 AzCopy 把資料複製到 storage1 的 Blob 儲存體與檔案儲存體中。\n⟦你應該對每一種儲存體使用哪種驗證方式？⟧",
 sent:"複製到 Blob 儲存體：{0}\n複製到檔案儲存體：{1}",
 dd:[["僅 Azure AD","僅共用存取簽章 (SAS)","存取金鑰與 SAS","Azure AD 與 SAS","Azure AD、存取金鑰與 SAS"],
     ["僅 Azure AD","僅共用存取簽章 (SAS)","存取金鑰與 SAS","Azure AD 與 SAS","Azure AD、存取金鑰與 SAS"]],
 a:[3,1],
 e:"AzCopy 複製到 Blob 儲存體時，可以用 Azure AD 身分或 SAS 權杖驗證（兩者都支援），但不支援直接用存取金鑰；複製到 Azure 檔案儲存體時，AzCopy 目前只支援 SAS 權杖，不支援 Azure AD 驗證。",
 en:{q:"You have a storage account storage1 using both Azure Blob storage and Azure File storage. You need to use AzCopy to copy data to both.\nWhich authentication method should you use for each?",
  sent:"Blob storage: {0}\nFile storage: {1}",
  dd:[["Azure AD only","Shared access signatures (SAS) only","Access keys and SAS","Azure AD and SAS","Azure AD, access keys, and SAS"],
      ["Azure AD only","Shared access signatures (SAS) only","Access keys and SAS","Azure AD and SAS","Azure AD, access keys, and SAS"]],
  e:"AzCopy supports both Azure AD and SAS for Blob storage, but not access keys directly. For Azure File storage, AzCopy currently only supports SAS, not Azure AD."}},

{n:737, code:"AZ104-Q737", d:2, od:2, k:"dd", fix:true, t:"準備訂用帳戶 File Sync", tEn:"Prepare subscription for File Sync",
 src:"quiz20:280320_ans.png",
 q:"你有一個包含 Azure 檔案共用的 Azure 訂用帳戶。\n你有一台執行 Windows Server 2016 的內部部署伺服器 Server1。\n你打算在 Server1 與 Azure 檔案共用之間設定 Azure File Sync。\n你需要為這個計畫在 Azure 訂用帳戶中做好準備。\n⟦你應該執行哪兩個動作？請把正確的動作拖曳到對應的目標位置。⟧",
 items:["建立 Storage Sync Service","安裝 Azure File Sync 代理程式","建立同步群組","執行伺服器註冊"],
 tgt:["第一步","第二步"],
 a:[0,1],
 e:"要準備 Azure File Sync，第一步是在 Azure 入口網站建立 Storage Sync Service 資源（雲端端這一側的核心資源）；第二步是在 Server1 上安裝 Azure File Sync 代理程式，讓伺服器能與 Storage Sync Service 通訊、之後完成註冊與新增端點。建立同步群組與執行伺服器註冊都是接下來的步驟，不屬於這兩個先決動作。",
 en:{q:"You have an Azure subscription with an Azure file share. You have an on-premises server Server1 running Windows Server 2016. You plan to set up Azure File Sync between Server1 and the Azure file share.\nYou need to prepare the subscription for the planned Azure File Sync.\nWhich two actions should you perform?",
  items:["Create a Storage Sync Service","Install the Azure File Sync agent","Create a sync group","Run Server Registration"],
  tgt:["First action","Second action"],
  e:"Create a Storage Sync Service resource first, then install the Azure File Sync agent on Server1 so it can communicate with the service and later be registered."}},

{n:738, code:"AZ104-Q738", d:2, od:2, k:"hs", t:"File Sync 端點新增", tEn:"Adding File Sync endpoints",
 src:"quiz20:282000_ans.png",
 q:"你的 Azure 訂用帳戶中有下表所示的檔案共用：\n| 名稱 | 位置 |\n|---|---|\n| share1 | West US |\n| share3 | East US |\n你有下列內部部署檔案共用：\n| 名稱 | 伺服器 | 路徑 |\n|---|---|---|\n| data1 | Server1 | D:\\Folder1 |\n| data2 | Server2 | E:\\Folder2 |\n| data3 | Server3 | E:\\Folder2 |\n你建立了一個名為 Sync1 的 Azure 檔案同步群組，並執行以下動作：\n・把 share1 加為 Sync1 的雲端端點。\n・把 data1 加為 Sync1 的伺服器端點。\n・把 Server1 與 Server2 註冊到 Sync1。\n⟦以下每項敘述，正確請選「是」，不正確請選「否」。⟧",
 s:["share3 可以新增為 Sync1 的另一個雲端端點。",
    "data2 可以新增為 Sync1 的另一個伺服器端點。",
    "data3 可以新增為 Sync1 的另一個伺服器端點。"],
 a:[0,1,0],
 e:"一個同步群組只能有一個雲端端點，Sync1 已經用 share1 當雲端端點，不能再加 share3（否）。\ndata2 在 Server2 上，而 Server2 已經註冊到 Sync1，可以直接新增為另一個伺服器端點（是）。\ndata3 在 Server3 上，但題目只有註冊 Server1 和 Server2 到 Sync1，Server3 還沒註冊，所以不能把 data3 加為伺服器端點（否）——必須先註冊 Server3 才行。",
 en:{q:"You have the Azure file shares and on-premises file shares shown. You create a sync group Sync1: add share1 as the cloud endpoint; add data1 as a server endpoint; register Server1 and Server2.\nFor each statement, select Yes if true, otherwise No.",
  s:["share3 can be added as an additional cloud endpoint for Sync1.",
     "data2 can be added as an additional server endpoint for Sync1.",
     "data3 can be added as an additional server endpoint for Sync1."],
  e:"Only one cloud endpoint per sync group, so share3 cannot be added. data2 is on the already-registered Server2, so it can be added. data3 is on Server3, which hasn't been registered to Sync1, so it cannot be added yet."}},

{n:739, code:"AZ104-Q739", d:2, od:2, k:"dl", t:"物件複寫設定", tEn:"Object replication config",
 src:"quiz20:296400_ans.png",
 q:"你有一個名為 storage1 的 Azure 儲存體帳戶，用來存放圖片。\n你要建立一個新的儲存體帳戶，並透過物件複寫 (object replication) 把 storage1 裡的圖片複寫到新帳戶。\n⟦你應該如何設定這個新帳戶？⟧",
 sent:"帳戶類型：{0}\n要在新帳戶中建立的物件類型：{1}",
 dd:[["僅 StorageV2","StorageV2 或 FileStorage","StorageV2 或 BlobStorage","StorageV2、BlobStorage 或 FileStorage"],
     ["容器 (Container)","檔案共用 (File share)","資料表 (Table)","佇列 (Queue)"]],
 a:[2,0],
 e:"物件複寫只支援一般用途 v2（StorageV2）或 BlobStorage 帳戶類型，不支援 FileStorage；目的端帳戶要先建立一個容器 (container) 來對應來源容器，才能設定複寫規則，檔案共用／資料表／佇列都不是物件複寫的對象。",
 en:{q:"You have a storage account storage1 that stores images. You need to create a new storage account and replicate the images using object replication.\nHow should you configure the new account?",
  sent:"Account type: {0}\nObject type to create in the new account: {1}",
  dd:[["StorageV2 only","StorageV2 or FileStorage only","StorageV2 or BlobStorage only","StorageV2, BlobStorage, or FileStorage"],
      ["Container","File share","Table","Queue"]],
  e:"Object replication only supports StorageV2 or BlobStorage accounts, not FileStorage. The destination account needs a container created to match the source container."}},

{n:740, code:"AZ104-Q740", d:2, od:2, k:"dd", t:"AzCopy 跨帳戶驗證", tEn:"AzCopy cross-account auth",
 src:"quiz20:301920_ans.png",
 q:"你的 Azure 訂用帳戶中有下表所示的儲存體帳戶：\n| 名稱 | Azure AD 驗證 | 內容 |\n|---|---|---|\n| storage1 | 已啟用 | 一個名為 container1 的 Blob 容器，公用存取層級為「無公用存取」 |\n| storage2 | 已啟用 | 一個名為 share1 的檔案共用 |\n你打算用 AzCopy 把一個 Blob 從 container1 直接複製到 share1。\n你需要為每個帳戶識別要使用的驗證方式。\n⟦針對每個帳戶，你應該辨識出哪種驗證方式？請把正確的驗證方式拖曳到對應的帳戶。⟧",
 items:["OAuth","匿名 (Anonymous)","儲存體帳戶存取金鑰 (storage account access key)","共用存取簽章 (SAS) 權杖"],
 tgt:["storage1（來源，容器為私人存取）","storage2（目的地，含檔案共用 share1）"],
 a:[3,3],
 e:"AzCopy 目前不支援用 Azure AD (OAuth) 驗證存取 Azure 檔案共用，就算來源與目的地儲存體都已啟用 Azure AD 驗證也一樣，只要牽涉到檔案共用，就必須改用共用存取簽章 (SAS) 權杖；由於本題是把 Blob 直接複製到檔案共用（storage2 的 share1），且 container1 又是私人存取（不能匿名讀取），兩邊都要用 SAS 權杖。",
 en:{q:"You have the storage accounts shown (both Azure AD enabled; storage1 has a private container1; storage2 has file share share1). You plan to use AzCopy to copy a blob from container1 directly to share1.\nWhich authentication method should you identify for each account?",
  items:["OAuth","Anonymous","A storage account access key","A shared access signature (SAS) token"],
  tgt:["storage1 (source, private container)","storage2 (destination, contains file share share1)"],
  e:"AzCopy doesn't support Azure AD (OAuth) authentication for Azure file shares even when enabled, so operations involving a file share must use a SAS token. Since container1 has no public access, SAS is also required on the source."}},

{n:741, code:"AZ104-Q741", d:2, od:2, k:"hs", t:"生命週期管理規則", tEn:"Lifecycle management rules",
 src:"quiz20:305520_ans.png",
 q:"你有一個 Azure 訂用帳戶，內有一個名為 storage1 的儲存體帳戶，設定了下表的生命週期管理規則：\n| 規則 | Blob 前置字元 | 若 Blob 最後修改超過（天） | 動作 |\n|---|---|---|---|\n| Rule1 | container1/ | 3 天 | 移到封存儲存體 |\n| Rule2 | 不適用 | 5 天 | 移到冷儲存體 |\n| Rule3 | container2/ | 10 天 | 刪除該 Blob |\n| Rule4 | container2/ | 15 天 | 移到封存儲存體 |\n6 月 1 日，你在 storage1 中儲存了兩個 Blob：\n| 名稱 | 位置 | 存取層 |\n|---|---|---|\n| File1 | container1 | 熱 (Hot) |\n| File2 | container2 | 熱 (Hot) |\n⟦以下每項敘述，正確請選「是」，不正確請選「否」。⟧",
 s:["6 月 6 日時，File1 會被存放在冷 (Cool) 存取層。",
    "6 月 1 日時，File2 會被存放在冷 (Cool) 存取層。",
    "6 月 16 日時，File2 會被存放在封存 (Archive) 存取層。"],
 a:[0,0,0],
 e:"File1 位於 container1，符合 Rule1（container1/ 前置字元、超過 3 天）：6 月 6 日距離 6 月 1 日已超過 3 天，Rule1 會把 File1 直接移到封存層，而不是冷層，所以第一句是「否」。\n第二句問的是 6 月 1 日當天，Blob 剛儲存、修改時間是 0 天，還沒有任何規則的天數條件被觸發，File1、File2 都還在熱層，所以「否」。\nFile2 位於 container2，同時符合 Rule3（10 天後刪除）與 Rule4（15 天後封存）。生命週期規則會依序套用，Rule3 的 10 天條件會先觸發，把 File2 直接刪除；等到 6 月 16 日（15 天後）Rule4 才要生效時，File2 早就已經被 Rule3 刪除了，所以不會存在於封存層，第三句也是「否」。",
 en:{q:"You have a storage account storage1 with the lifecycle management rules shown. On June 1, you store two blobs as shown.\nFor each statement, select Yes if true, otherwise No.",
  s:["On June 6, File1 will be stored in the Cool access tier.",
     "On June 1, File2 will be stored in the Cool access tier.",
     "On June 16, File2 will be stored in the Archive access tier."],
  e:"File1 matches Rule1 (container1/, 3 days) and is moved directly to Archive by June 6, not Cool. On June 1 (day 0), no day-based rule has triggered yet, so both blobs remain Hot. File2 matches both Rule3 (delete after 10 days) and Rule4 (archive after 15 days); Rule3 triggers first and deletes File2 before Rule4 would ever apply, so it's never in Archive."}},

{n:742, code:"AZ104-Q742", d:2, od:2, k:"dl", t:"生命週期規則 JSON", tEn:"Lifecycle rule JSON",
 src:"quiz20:307200_ans.png",
 q:"你有一個名為 storage1 的 Azure 儲存體帳戶，內有一個名為 container1 的容器。\n你需要替 storage1 建立一個生命週期管理規則，在 90 天後自動把 container1 裡的 Blob 移到成本最低的存取層。\n⟦你應該如何完成這個規則？⟧\n\n\"actions\": { \"baseBlob\": { {0}: { \"daysAfterModificationGreaterThan\": 90 } } },\n\"filters\": { {1}: [ \"container1/\" ] }",
 sent:"動作要選擇：{0}（將 Blob 轉為最低成本的層級）\n篩選條件要選擇：{1}（依容器前置字元篩選）",
 dd:[["啟用從冷層自動轉回熱層 (enableAutoTierToHotFromCool)","轉為封存層 (tierToArchive)","轉為冷層 (tierToCool)"],
     ["依 Blob 索引比對 (blobIndexMatch)","依 Blob 類型比對 (blobTypes)","依前置字元比對 (prefixMatch)"]],
 a:[1,2],
 e:"成本最低的存取層是封存層 (Archive)，所以動作要選 tierToArchive（而不是轉去冷層 tierToCool，冷層成本比封存層高）。\n要依容器路徑（container1/）篩選要套用規則的 Blob，篩選條件要用 prefixMatch（前置字元比對），blobIndexMatch 是依 Blob 索引標籤篩選、blobTypes 是依 Blob 型別（區塊/附加）篩選，都不是依路徑前置字元篩選。",
 en:{q:"You have a storage account storage1 with a container container1. You need to create a lifecycle management rule that automatically moves blobs in container1 to the lowest-cost tier after 90 days.\nHow should you complete the rule?",
  sent:"Action: {0} (moves blobs to the lowest-cost tier)\nFilter: {1} (matches by container prefix)",
  dd:[["enableAutoTierToHotFromCool","tierToArchive","tierToCool"],
      ["blobIndexMatch","blobTypes","prefixMatch"]],
  e:"Archive is the lowest-cost tier, so the action is tierToArchive. Filtering by container path requires prefixMatch."}},

{n:743, code:"AZ104-Q743", d:3, od:5, k:"dd", fix:true, t:"VM 備份區域備援", tEn:"VM backup zone redundancy",
 src:"quiz20:309120_ans.png",

const BANK_DOC = BANK_AZ104; // 別名，給沿用自 AZ900 的引擎程式碼用

/* 目前作答中的題庫（由上方來源切換決定） */
let BANK = BANK_DOC;

/* =====================================================================
   英文版題目：以中文題目為鍵，與中文題庫解耦，缺漏時自動退回中文。
   格式 "中文題目": [英文題目, [英文選項…（順序須與中文一致）], 英文解析]
   ===================================================================== */
const EN = {};
function mergeEN(){
  let n = 0;
  [].forEach(q=>{      /* EN 對照表只對應題庫 A；題庫 B 的英文直接寫在資料裡 */
    const e = EN[q.q];
    if(!e) return;
    if(e[1].length !== q.o.length){ console.warn("EN 選項數不符:", q.q); return; }
    q.en = {q:e[0], o:e[1].slice(), e:e[2]};
    n++;
  });
  EN.__count = n;
}

/* =====================================================================

   官方中譯常有出入，這裡以考試實際會看到的英文原詞為準。

};
/* 長詞優先，避免「可用性區域」被短詞「區域」先吃掉 */
const GLOSSARY_KEYS = Object.keys(GLOSSARY_MAP).sort((a,b)=>b.length-a.length);
const GLOSSARY_RE = new RegExp(GLOSSARY_KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "g");

function withTerms(s){
  const seen = {};
  const str = String(s);
  return str.replace(GLOSSARY_RE, (m, ...args)=>{
    const at = args[args.length - 2];        // replace 的倒數第二個參數是位移
    if(seen[m]) return m;                    // 同一段只補第一次
    seen[m] = 1;
    const en = GLOSSARY_MAP[m];
    /* Quiz20 題庫的選項本來就寫成「中文（English）」，後面已經有同一個英文了就別再補一次，
       否則會變成「可擴縮性（Scalability）（Scalability）」 */
    const after = str.slice(at + m.length, at + m.length + en.length + 6);
    if(new RegExp("^\\s*[（(]\\s*" + en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(after)) return m;
    return m + "（" + en + "）";
  });
}

/* =====================================================================
   螢光筆標記：題目文字中用 ⟦…⟧ 包住的片段會以螢光筆呈現。
   只標題目裡的關鍵條件，絕不標選項 —— 標了等於直接送答案。
   ===================================================================== */
const HL_RE = /⟦([^⟧]*)⟧/g;
const stripHl = s => String(s).replace(HL_RE, "$1");
/* 寫進 DOM（不使用 innerHTML，避免題目文字被當成 HTML） */
function paintHl(el, s){
  el.textContent = "";
  let last = 0, m;
  HL_RE.lastIndex = 0;
  while((m = HL_RE.exec(String(s))) !== null){
    if(m.index > last) el.append(document.createTextNode(String(s).slice(last, m.index)));
    const mk = document.createElement("mark");
    mk.className = "hl"; mk.textContent = m[1];
    el.append(mk);
    last = m.index + m[0].length;
  }
  if(last < String(s).length) el.append(document.createTextNode(String(s).slice(last)));
}
/* 成績單是用 innerHTML 組的：先跳脫，再把標記換成 <mark> */
const escHl = s => esc(String(s))
  .replace(/⟦/g, '<mark class="hl">').replace(/⟧/g, "</mark>")
  .replace(/\n/g, "<br>");

/* =====================================================================
   題型
   ---------------------------------------------------------------------
   mc  單選／複選            o[] 選項            a=[正解索引…]
   hs  HOTSPOT 是非表        s[] 敘述            a=[1,0,1]（1 是 / 0 否），逐句對應
   dd  DRAG DROP 配對        items[] 可拖曳項目   tgt[] 答案區描述
                                                a=[itemIdx…]，逐格對應 tgt
   dl  HOTSPOT 下拉選單      sent 含 {0}{1} 的句子 dd[][] 每格的選項清單
                                                a=[optIdx…]，逐格對應 dd
   ===================================================================== */
const kindOf = q => q.k || "mc";
const slotCount = q => {
  const k = kindOf(q);
  return k === "hs" ? q.s.length : k === "dd" ? q.tgt.length : k === "dl" ? q.dd.length : 0;
};

/* 依目前語言取出題目的文字。EN 缺漏時自動退回中文，不會出現空白題目。*/
function view(q){
  const en = S.lang === "en" && q.en, zhen = S.lang === "zhen";
  const T = s => zhen ? withTerms(s) : s;
  const src = en ? q.en : q;
  const V = {q:T(src.q), e:T(src.e || q.e), en:!!en};
  switch(kindOf(q)){
    case "hs": V.s = (src.s || q.s).map(T); break;
    case "dd": V.items = (src.items || q.items).map(T);
               V.tgt   = (src.tgt   || q.tgt  ).map(T); break;
    case "dl": V.sent = T(src.sent || q.sent);
               V.dd   = (src.dd || q.dd).map(list => list.map(T)); break;
    default:   V.o = (src.o || q.o).map(T);
  }
  return V;
}

/* ---------------------------------------------------------------------
   作答狀態：一律用陣列表示，好讓四種題型共用計分與成績單
     mc → [已選索引…]（排序過）
     hs → [1|0|null …] 每句一格
     dd → [itemIdx|null …] 每個答案區一格
     dl → [optIdx|null …] 每個下拉一格
   --------------------------------------------------------------------- */
function blankAns(q){
  const n = slotCount(q);
  return kindOf(q) === "mc" ? [] : new Array(n).fill(null);
}
const ansEmpty = (q, ans) => kindOf(q) === "mc"
  ? !ans.length
  : ans.every(v => v === null);
const ansFull = (q, ans) => kindOf(q) === "mc"
  ? !!ans.length
  : ans.every(v => v !== null);
/* 複選題要選滿幾項；單選與其他題型回傳 0 */
const mcNeed  = q => (kindOf(q) === "mc" && q.a.length > 1) ? q.a.length : 0;
/* 原廠考試的規則：複選題一定要「剛好」選滿 N 項才放你走 */
const mcShort = (q, ans) => { const n = mcNeed(q); return n > 0 && (ans || []).length !== n; };
/* 一題算不算「作答完成」：有作答，而且複選題有選滿 N 項（只選一半不算） */
const ansDone = (q, ans) => !!ans && !ansEmpty(q, ans) && !mcShort(q, ans);
/* 逐格比對；mc 因為順序無關，改用集合比對 */
const ansOK = (q, ans) => kindOf(q) === "mc"
  ? sameSet(ans, q.a)
  : ans.length === q.a.length && q.a.every((v,i) => ans[i] === v);
const YN = (v, en) => v === 1 ? (en ? "Yes" : "是") : v === 0 ? (en ? "No" : "否") : (en ? "—" : "—");

const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sameSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));

/* 題庫撰寫時正確答案都排在最前面，每輪重洗選項順序並重新對應答案索引，
   否則「一律選 A」就會全對。
   -----------------------------------------------------------------
   第二個參數 p 是先前洗牌的結果：帶進來就照著洗回一模一樣的順序，
   關掉瀏覽器再回來才有辦法把「你選的是第幾個選項」對回同一個選項。
   洗完會把用到的順序記在 q._p，存進度時就是存這個。 */
function permuteOptions(q, p){
  /* 有存過就重播，沒有（或長度對不上，題庫被改過）就重新洗 */
  const pick = (n, saved) =>
    (Array.isArray(saved) && saved.length === n && saved.every(v => Number.isInteger(v) && v >= 0 && v < n))
      ? saved.slice()
      : shuffle(Array.from({length:n}, (_,i)=>i));

  switch(kindOf(q)){

  /* --- HOTSPOT 是非表：洗敘述的順序 ---------------------------------
     每一句各自作答，順序不帶答案資訊；但洗過之後就沒辦法把整題背成
     「YNY」這種答案樣式，必須真的逐句判斷。 */
  case "hs": {
    if(q.s.length <= 1) return;
    const order = pick(q.s.length, p && p.s);
    q.s = order.map(i => q.s[i]);
    q.a = order.map(i => q.a[i]);
    if(q.en && q.en.s) q.en.s = order.map(i => q.en.s[i]);
    q._p = {s:order};
    return;
  }

  /* --- DRAG DROP 配對：可拖曳項目與答案區兩邊都洗 ------------------- */
  case "dd": {
    const iOrd = pick(q.items.length, p && p.i);          // iOrd[新位置] = 舊索引
    q.items = iOrd.map(i => q.items[i]);
    if(q.en && q.en.items) q.en.items = iOrd.map(i => q.en.items[i]);
    q.a = q.a.map(old => iOrd.indexOf(old));              // 答案改指向新的項目位置
    /* q.fix：答案區的上下順序本身就是題意（例如縱深防禦由外而內的巢狀分層），
       這種題目只洗可拖曳的項目，答案區維持原順序 */
    let tOrd = null;
    if(q.tgt.length > 1 && !q.fix){
      tOrd = pick(q.tgt.length, p && p.t);
      q.tgt = tOrd.map(i => q.tgt[i]);
      q.a   = tOrd.map(i => q.a[i]);
      if(q.en && q.en.tgt) q.en.tgt = tOrd.map(i => q.en.tgt[i]);
    }
    q._p = {i:iOrd, t:tOrd};
    return;
  }

  /* --- HOTSPOT 下拉：每一格各自洗自己的選項清單 --------------------- */
  case "dl": {
    const ords = [];
    q.dd.forEach((list, g)=>{
      if(list.length <= 1){ ords[g] = null; return; }
      const order = pick(list.length, p && p.d && p.d[g]);
      q.dd[g] = order.map(i => list[i]);
      if(q.en && q.en.dd && q.en.dd[g]) q.en.dd[g] = order.map(i => q.en.dd[g][i]);
      q.a[g] = order.indexOf(q.a[g]);
      ords[g] = order;
    });
    q._p = {d:ords};
    return;
  }

  /* --- 單選／複選：是非題（只有兩個選項）維持原順序，才對得上原文件的 A/B --- */
  default: {
    /* q.fix：選項的順序本身就是題目的一部分——答案區是入口網站的截圖
       （側欄、設定清單、刀鋒節點、工具列、服務磁磚），原廠考試給的就是那個畫面，
       洗過就跟文件對不起來了。有 ico 的題目基本上都該設 fix。 */
    if(q.o.length <= 2 || q.fix) return;
    const order = pick(q.o.length, p && p.o);          // order[新位置] = 舊索引
    q.o = order.map(i => q.o[i]);
    if(q.en && q.en.o) q.en.o = order.map(i => q.en.o[i]);   // 英文選項必須跟著一起換位
    if(q.ico) q.ico = order.map(i => q.ico[i]);              // 服務圖示也要，不然洗完圖會對到別的選項
    q.a = q.a.map(old => order.indexOf(old)).sort((x,y)=>x-y);
    q._p = {o:order};
  }
  }
}

function poolFor(tab){
  if(tab === 4) return BANK.filter(q => wrongSet.has(q.q));
  if(tab === 5) return BANK.filter(q => starSet.has(q.q));
  if(tab === 0) return BANK.slice();
  return BANK.filter(q => q.d === tab);
}

/* =====================================================================
   分頁進度：每個分頁（連同題庫來源）各自記住自己做到哪
   -----------------------------------------------------------------
   出題時每一題都複製一份再洗選項，洗到的是複本而不是題庫本體，
   所以「01 洗牌」不會把「02 已經作答的選項編號」對應到別的答案去。
   進度只在兩種情況歸零：這個分頁的題目全部做完，或自己按「重新開始」。
   ===================================================================== */
const cloneQ = typeof structuredClone === "function"
  ? (q => structuredClone(q))
  : (q => JSON.parse(JSON.stringify(q)));

const SESS = {};                                  /* key -> 該分頁的進度 */
const sessKey = () => S.src + ":" + S.tab;

/* 題目在題庫裡的位置：存進度時只存編號，不存整份題目，才不會塞爆 localStorage */
let bankPos = null, bankPosOf = null;
function posOf(q){
  if(bankPosOf !== BANK){ bankPos = new Map(); BANK.forEach((x,i)=>bankPos.set(x,i)); bankPosOf = BANK; }
  const v = bankPos.get(q);
  return v === undefined ? -1 : v;
}

/* 題庫指紋：題庫改過（加題、改字）就讓舊進度自動作廢，
   免得存下來的題號對到別題、答案全部錯位 */
const SIG = new WeakMap();
function sigOf(bank){
  if(SIG.has(bank)) return SIG.get(bank);
  let h = 5381;
  for(const q of bank){
    const s = q.q;
    for(let i=0;i<s.length;i++) h = (((h * 33) ^ s.charCodeAt(i)) >>> 0);
  }
  const sig = bank.length + "." + h.toString(36);
  SIG.set(bank, sig);
  return sig;
}

/* ---- 進度存進 localStorage：關掉瀏覽器隔天回來還接得下去 ---- */
const SESS_PREFIX = "az104.sess.v1|";
const sessLS = (src, tab) => SESS_PREFIX + src + "|" + tab;

function sessToJSON(s){
  const n = s.pool.length;
  return {
    n: s.pool.map(q => q._n),                       /* 出過哪些題、什麼順序 */
    p: s.pool.map(q => q._p || 0),                  /* 每題的選項洗牌結果 */
    a: Array.from({length:n}, (_,i) => s.answers[i] || null),
    g: Array.from({length:n}, (_,i) => s.gr[i] ? (s.gr[i].reveal ? 2 : 1) : 0),
    i: s.idx, r: s.right, t: s.total
  };
}
function sessFromJSON(o, bank){
  if(!o || !Array.isArray(o.n) || !o.n.length) return null;
  const pool = [];
  for(let k=0;k<o.n.length;k++){
    const src = bank[o.n[k]];
    if(!src) return null;                           /* 題號對不上就整份作廢 */
    const c = cloneQ(src); c._n = o.n[k];
    permuteOptions(c, (o.p && o.p[k]) || null);
    pool.push(c);
  }
  const trim = a => { while(a.length && a[a.length-1] === undefined) a.pop(); return a; };
  return {
    pool,
    idx:   Math.min(Math.max(o.i|0, 0), pool.length - 1),
    answers: trim((o.a || []).map(a => Array.isArray(a) ? a : undefined)),
    gr:      trim((o.g || []).map(g => g ? {reveal: g === 2} : undefined)),
    right: o.r|0, total: o.t|0
  };
}

function persistSess(src, tab){
  try{
    const s = SESS[src + ":" + tab];
    /* 還停在第 1 題、也還沒作答，就不算進度：不寫檔，免得每次開頁面都留一份 */
    if(!s || !s.pool.length || (!s.idx && !s.total)){ localStorage.removeItem(sessLS(src, tab)); return; }
    const o = sessToJSON(s);
    o.sig = sigOf(BANK_DOC);
    localStorage.setItem(sessLS(src, tab), JSON.stringify(o));
  }catch(e){}                                       /* 空間不夠就只留在記憶體裡 */
}

function restoreSessions(){
  ["doc"].forEach(src=>{
    const bank = BANK_DOC;
    if(!bank.length) return;
    const sig = sigOf(bank);
    for(let tab=0; tab<=5; tab++){
      let raw = null;
      try{ raw = localStorage.getItem(sessLS(src, tab)); }catch(e){ return; }
      if(!raw) continue;
      let s = null;
      try{
        const o = JSON.parse(raw);
        if(o.sig === sig) s = sessFromJSON(o, bank);
      }catch(e){}
      if(s) SESS[src + ":" + tab] = s;
      else try{ localStorage.removeItem(sessLS(src, tab)); }catch(e){}
    }
  });
}

function saveSess(){
  if(S.exam || !S.pool.length) return;
  SESS[sessKey()] = {
    pool:S.pool, idx:S.idx, answers:S.answers, gr:S.gr,
    right:S.right, total:S.total
  };
  persistSess(S.src, S.tab);
}
function loadSess(){
  const s = SESS[sessKey()];
  if(!s || !s.pool.length) return false;
  /* 錯題本／星號題的內容會隨著作答與打星號變動：
     回到這個分頁時，把新符合條件、之前沒出過的題目補到隊伍最後面，
     已經做過的進度照樣保留。 */
  if(S.tab === 4 || S.tab === 5){
    const have = new Set(s.pool.map(q => q.q));
    poolFor(S.tab).forEach(q=>{
      if(have.has(q.q)) return;
      const c = cloneQ(q); c._n = posOf(q); permuteOptions(c); s.pool.push(c);
    });
  }
  S.pool = s.pool; S.idx = s.idx; S.answers = s.answers; S.gr = s.gr;
  S.right = s.right; S.total = s.total;
  if(S.idx >= S.pool.length) S.idx = S.pool.length - 1;   /* 補題後回到最後一題 */
  return true;
}
const dropSess = () => {
  delete SESS[sessKey()];
  try{ localStorage.removeItem(sessLS(S.src, S.tab)); }catch(e){}
};

/* 分頁上的小圓點：標出哪些分頁還有沒做完的進度 */
function paintTabProgress(){
  document.querySelectorAll("nav.tabs button").forEach((b,i)=>{
    const s = SESS[S.src + ":" + i];
    /* 剛開一輪、還停在第 1 題又沒作答，就不算「有進度」，免得每個分頁都亮點 */
    const on = !!(s && s.pool.length && (s.idx > 0 || s.total > 0));
    let dot = b.querySelector(".dot");
    if(!on){ if(dot) dot.remove(); return; }
    if(!dot){ dot = document.createElement("i"); dot.className = "dot"; b.append(dot); }
    dot.title = S.lang === "en"
      ? `in progress — question ${s.idx+1} of ${s.pool.length}`
      : `還沒做完 · 做到第 ${s.idx+1} / ${s.pool.length} 題`;
  });
}

/* =====================================================================
   出題
   ===================================================================== */
/* fresh=true 代表「重新開始」：丟掉舊進度重新洗牌 */
function startRound(fresh){
  stopTimer();
  closeOverview();
  S.ended = false;
  S.flags = []; S.notes = [];
  report.classList.remove("show"); report.innerHTML = "";

  /* 練習模式：先看看這個分頁有沒有沒做完的進度，有就接著做 */
  if(!S.exam && !fresh && loadSess()){ S.logged = false; renderQ(); return; }

  /* 按「重新開始」把做到一半的進度丟掉之前，先把這一輪的成績封存起來 */
  if(fresh && !S.exam && S.pool.length) logRound(null);

  S.idx = 0; S.right = 0; S.total = 0;
  S.answers = []; S.gr = []; S.logged = false;
  const build = list => list.map(q=>{
    const c = cloneQ(q); c._n = posOf(q); permuteOptions(c); return c;
  });
  if(S.exam){
    /* 模擬考一律隨機抽題，不看設定裡的出題順序——真的考試就是隨機的 */
    S.pool = build(shuffle(BANK.slice()).slice(0, Math.min(EXAM_N, BANK.length)));
    startTimer();
  } else {
    dropSess();
    /* 練習：依設定決定順序。seq＝題庫本身的順序（Quiz20 題庫就是 #1、#2… 照題號排），
       rand＝洗牌打散，免得照著題號背答案。選項順序照樣每輪重洗，不受這裡影響。 */
    const list = poolFor(S.tab);
    S.pool = build(S.order === "rand" ? shuffle(list) : list);
  }
  renderQ();
}

function renderQ(){
  verdict.className = "verdict"; verdict.textContent = "";
  expl.className = "expl"; expl.innerHTML = "";
  S.ans = []; S.graded = false;
  qbox.innerHTML = ""; qtools.innerHTML = "";

  if(!S.pool.length){
    const en = S.lang === "en";
    eyebrow.textContent = S.tab === 4 ? (en?"Review list":"錯題本")
                        : S.tab === 5 ? (en?"Starred":"星號題")
                        : (en?"No questions":"沒有題目");
    scoreEl.textContent = "0 / 0";
    barFill.style.width = "0%";
    starBtn.hidden = true;
    const docEmpty = S.src === "doc" && !BANK_DOC.length;
    qbox.innerHTML = '<div class="empty">' +
      (docEmpty
        ? (en ? "The Quiz20 question bank has not been imported yet."
              : "Quiz20 題庫還沒有匯入題目。<br>轉錄完成後這裡就會出現題目。")
        : S.tab === 4
        ? (en ? "Your review list is empty.<br>Anything you answer incorrectly elsewhere lands here for a focused retry."
              : "錯題本目前是空的。<br>在其他分頁答錯的題目會自動收進來，可以之後專門重練。")
        : S.tab === 5
        ? (en ? "You have not starred anything yet.<br>Hit ☆ on any question to file it here for extra drilling."
              : "還沒有打星號的題目。<br>在任何一題按「☆ 加強練習」，那一題就會收進這裡專門加強。")
        : (en ? "No questions in this category." : "這個分類沒有題目。")) + "</div>";
    setActions();
    paintTabProgress();
    return;
  }
  if(S.idx >= S.pool.length){ finishRound(); return; }

  const q = S.pool[S.idx];
  const V = view(q);
  const multi = kindOf(q) === "mc" && q.a.length > 1;
  const EN = S.lang === "en";
  S.ans = blankAns(q);

  eyebrow.textContent = (S.exam ? (EN ? "Mock exam · " : "模擬考 · ") : "") +
    (EN ? `Q ${S.idx+1} / ${S.pool.length} · ${dname(q.d)}`
        : `第 ${S.idx+1} / ${S.pool.length} 題 · ${dname(q.d)}`);
  scoreEl.textContent = S.exam
    ? (EN ? `answered ${answeredCount()} / ${S.pool.length}` : `已作答 ${answeredCount()} / ${S.pool.length}`)
    : `${S.right} / ${S.total}`;
  barFill.style.width = ((S.idx) / S.pool.length * 100).toFixed(1) + "%";

  const p = document.createElement("div");
  p.className = "prompt";
  const meta = document.createElement("p");
  meta.className = "meta";
  meta.textContent = `${dname(q.d)} · ${(EN && q.tEn) ? q.tEn : q.t}`
                   + (q.n ? (EN ? ` · #${q.n}` : ` · 第 ${q.n} 題`) : "");
  /* 這一題是把第一版拆開的子題合併還原回來的，不是直接從原始文件轉錄。
     還沒回頭逐字核對前先標出來，讓作答的人知道措辭可能與原文有出入。 */
  /* q.ext：這一題**不在原始 PDF 裡**（作者當初沒收錄那個題號），是由外部來源補進來的。
     不能用 mg/vf 表示——那兩個的意思分別是「子題合併還原」與「已與原始文件核對」，
     對這種題目都不成立。給它自己的徽章，讓作答的人一眼分得出來源。 */
  if(q.mg || q.ext){
    const chk = document.createElement("span");
    chk.className = "chk " + (q.ext ? "ext" : (q.vf ? "done" : "wait"));
    chk.textContent = q.ext ? (EN ? "＋ not in the source PDF" : "＋ 原文件沒有，外部補入")
                    : q.vf  ? (EN ? "✓ checked against source" : "✓ 已核對原文")
                            : (EN ? "⚠ not yet checked" : "⚠ 尚未核對原文");
    chk.title = q.ext
      ? (EN ? "This question number is absent from the source PDF; the item was recovered from external question banks. See the box below for what was found and how reliable it is."
            : "這個題號在原始 PDF 裡是空的，本題是由外部題庫來源補進來的。點開下方對照框可以看到找到了什麼、可信度如何。")
      : q.vf
      ? (EN ? "This item was rebuilt from split sub-questions and has since been checked word-for-word against the original document."
            : "這一題是由拆開的子題合併還原的，已回頭與原始文件逐字核對過。")
      : (EN ? "This item was rebuilt from split sub-questions and has not yet been checked against the original document — the wording may differ slightly. The answer itself is unaffected."
            : "這一題是由拆開的子題合併還原的，還沒回頭與原始文件核對，措辭可能與原文略有出入。答案本身不受影響。");
    /* 存了原文就讓徽章可以點，切出原始文件的樣子對照 */
    if(q.v0){
      chk.classList.add("act");
      chk.setAttribute("role","button");
      chk.tabIndex = 0;
      const toggle = ()=>{
        const box = qbox.querySelector(".v0box");
        if(box) box.classList.toggle("show");
      };
      chk.addEventListener("click", toggle);
      chk.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
    }
    meta.append(chk);
  }
  /* 題目本文用換行分段：制式前言自成一行，真正的題目與「解法：」各自另起一段 */
  p.append(meta);
  String(V.q).split("\n").forEach(seg=>{
    seg = seg.trim();
    if(!seg) return;
    const isNote = /^(注意：|Note:|（原題|DRAG DROP)/.test(stripHl(seg));
    const line = document.createElement("p");
    line.className = isNote ? "qnote" : "qtext";
    paintHl(line, seg);
    p.append(line);
  });
  /* 題目裡的表格（原題就有一張表，例如 #187 的電腦與作業系統對照）。
     只是題目的一部分，不能選，也不參與洗牌。 */
  const TB = (EN && q.en && q.en.tbl) ? q.en.tbl : q.tbl;
  if(TB){
    const t = document.createElement("table");
    t.className = "qtbl";
    const th = document.createElement("tr");
    TB.h.forEach(c=>{ const e = document.createElement("th"); e.textContent = c; th.append(e); });
    t.append(th);
    TB.r.forEach(row=>{
      const tr = document.createElement("tr");
      row.forEach(c=>{ const e = document.createElement("td"); paintHl(e, c); tr.append(e); });
      t.append(tr);
    });
    p.append(t);
  }

  multiBadge = null;
  if(multi){
    const m = document.createElement("span");
    m.className = "multi"; m.dataset.need = q.a.length;
    p.append(m);
    multiBadge = m;      /* 文字交給 paintMulti()，它會一併顯示「已選 x」 */
  }
  qbox.append(p);

  /* 原文對照框：預設收起，點題頭的核對徽章才展開 */
  if(q.v0){
    const v0 = document.createElement("div");
    v0.className = "v0box";
    const lab = document.createElement("span");
    lab.className = "lab";
    lab.textContent = EN ? "Original wording in the source document" : "原始文件上的樣子";
    v0.append(lab, document.createTextNode(q.v0));
    qbox.append(v0);
  }

  /* 回頭看已作答的題目時（模擬考的「上一題」、練習模式的「上一題」）還原先前的作答 */
  if(S.answers[S.idx]) S.ans = S.answers[S.idx].slice();

  renderTools(q, EN);
  paintStar();
  ({hs:renderHS, dd:renderDD, dl:renderDL}[kindOf(q)] || renderMC)(q, V, EN);
  setActions();
  paintMulti();

  /* 練習模式翻回批改過的題目：直接把當時的判定與解析重新畫出來，但不再重複計分 */
  if(!S.exam && S.gr[S.idx]) grade(S.gr[S.idx].reveal, false);

  saveSess();
  paintTabProgress();
}

/* ---------- 星號：練習模式限定，放在題目列上的小圖示鈕 ---------- */
function paintStar(){
  const q = S.pool[S.idx];
  const on = !!(q && starSet.has(q.q));
  const show = !!q && !S.exam && !report.classList.contains("show");
  starBtn.hidden = !show;
  if(!show) return;
  starBtn.setAttribute("aria-pressed", String(on));
  starBtn.textContent = on ? "★" : "☆";
  starBtn.title = S.lang === "en"
    ? (on ? "Starred — tap to remove from the Starred tab"
          : "Star this question so you can drill it in the Starred tab")
    : (on ? "已收進「星號題」分頁，再按一次取消"
          : "加強練習：把這題收進「星號題」分頁");
}
starBtn.addEventListener("click", ()=>{
  const q = S.pool[S.idx];
  if(!q) return;
  if(starSet.has(q.q)) starSet.delete(q.q); else starSet.add(q.q);
  saveStar();
  paintStar();
  /* 正在星號題分頁裡取消星號：這一輪照樣做完，換一輪才會消失 */
});

/* ---------- 題目上方的工具列 ----------------------------------------
   兩種模式的工具是分開的，不互相混用：
   ・練習模式＝★ 星號（長期保存，之後在「星號題」分頁專門加強）
   ・模擬考　＝⚑ 標記待複習＋備註（只屬於這一次考試，交卷後隨檢討一起看）
   兩種模式都可以用「上一題」翻回去。 */
function renderTools(q, EN){
  qtools.innerHTML = "";
  if(!q) return;

  /* 練習模式的星號在題目列上（見 paintStar），這裡只處理模擬考的標記與備註 */
  if(!S.exam) return;

  /* ---- 模擬考：仿原廠的「標記待複習」，交卷前可以從總覽跳回來重看 ---- */
  const flag = document.createElement("button");
  flag.type = "button"; flag.className = "tbtn flag";
  const note = document.createElement("textarea");
  note.className = "notebox";
  note.placeholder = EN ? "Optional note — what made you unsure? (visible on the review screen)"
                        : "備註（選填）：哪裡卡住、在猶豫哪兩個選項……交卷前的總覽看得到";
  note.value = S.notes[S.idx] || "";
  note.addEventListener("input", ()=>{ S.notes[S.idx] = note.value; });

  const paintFlag = ()=>{
    const on = !!S.flags[S.idx];
    flag.setAttribute("aria-pressed", String(on));
    flag.textContent = on ? (EN ? "⚑ Flagged for review" : "⚑ 已標記待複習")
                          : (EN ? "⚑ Flag for review"    : "⚑ 標記待複習");
    note.hidden = !on;
  };
  flag.title = EN ? "Mark this question so you can come back to it before submitting"
                  : "把這題標記起來，交卷前可以從「作答總覽」跳回來再看一次";
  flag.addEventListener("click", ()=>{
    S.flags[S.idx] = !S.flags[S.idx];
    paintFlag();
    if(S.flags[S.idx]) note.focus();
  });
  paintFlag();
  qtools.append(flag, note);
}

/* ---------- 複選題的「需選 N 項」徽章 --------------------------------
   原廠考試對複選題是硬性的：選滿 N 項才放你走，也不讓你多選第 N+1 項。
   這裡把規則做出來，順便把「已選幾項」即時寫在徽章上。 */
let multiBadge = null, multiTimer = 0;
function paintMulti(){
  const m = multiBadge;
  if(!m) return;
  clearTimeout(multiTimer);
  const need = +m.dataset.need, got = S.ans.length, EN = S.lang === "en";
  m.textContent = EN ? `select ${need} · ${got} selected` : `需選 ${need} 項 · 已選 ${got}`;
  m.classList.remove("warn");
  m.classList.toggle("done", got === need);
}
/* 擋下來的時候閃一下徽章，並把原因寫上去，過幾秒自己還原 */
function bumpMulti(msg){
  const m = multiBadge;
  if(!m) return;
  clearTimeout(multiTimer);
  m.classList.remove("warn"); void m.offsetWidth;   /* 重播動畫 */
  m.classList.add("warn");
  m.textContent = msg;
  multiTimer = setTimeout(paintMulti, 2200);
}
/* 沒選滿就想繼續：擋住並說明還差幾項 */
function nagMulti(q){
  const EN = S.lang === "en", need = mcNeed(q), got = S.ans.length;
  verdict.className = "verdict show fail";
  verdict.textContent = got < need
    ? (EN ? `This question needs ${need} selections — you have ${got}. Pick ${need - got} more before moving on.`
          : `這題需選 ${need} 項，目前只選了 ${got} 項，再選 ${need - got} 項才能繼續。`)
    : (EN ? `This question needs exactly ${need} selections — you have ${got}. Deselect ${got - need}.`
          : `這題只能選 ${need} 項，目前選了 ${got} 項，請取消 ${got - need} 項。`);
  bumpMulti(EN ? `${got} / ${need} selected` : `已選 ${got} / ${need} 項`);
  verdict.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* 作答有變動時：把答案存起來，模擬考另外更新「已作答」計數 */
const answeredCount = () => S.pool.filter((q,i) => ansDone(q, S.answers[i])).length;
function ansChanged(){
  S.answers[S.idx] = S.ans.slice();
  paintMulti();
  /* 補齊之後，把剛才「還差幾項」的提醒收掉（批改後的判定不能動） */
  if(!S.graded && verdict.classList.contains("show")) verdict.className = "verdict";
  if(!S.exam) return;
  const n = answeredCount();
  scoreEl.textContent = S.lang === "en"
    ? `answered ${n} / ${S.pool.length}` : `已作答 ${n} / ${S.pool.length}`;
}

/* ---------- 單選／複選 ---------- */
function renderMC(q, V, EN){
  const multi = q.a.length > 1;
  const box = document.createElement("div");
  /* q.look：原題的答案區長什麼樣子就照著畫。
     "nav"   入口網站的深色左側欄（#168）
     "icons" 只有圖示、沒有文字的工具列（#215）——原廠考試就只給一張圖，
             名稱只留在 aria-label 與成績單裡，作答時看不到，才不會變成送分題 */
  box.className = "opts" + (q.look ? " look-" + q.look : "");
  V.o.forEach((text, i)=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    b.setAttribute("aria-pressed","false"); b.dataset.i = i;
    const k = document.createElement("span");
    k.className = "key"; k.textContent = LETTER[i];
    const t = document.createElement("span");
    t.textContent = stripHl(text);      /* 選項一律不標，免得直接洩題 */
    /* 原題的答案區是入口網站的服務列，有存圖示就一起畫出來 */
    if(q.ico && q.ico[i]){
      const im = document.createElement("img");
      im.className = "oico"; im.src = q.ico[i];
      if(q.look === "icons"){
        /* 只給圖：名稱不顯示，但要留給螢幕報讀與鍵盤操作 */
        im.alt = stripHl(text);
        b.setAttribute("aria-label", LETTER[i] + "　" + stripHl(text));
        b.title = stripHl(text);
        b.append(k, im);
      }
      else { im.alt = ""; b.append(k, im, t); }   /* 名稱就在旁邊，圖示純裝飾 */
    }
    else b.append(k, t);
    b.addEventListener("click", ()=>{
      if(S.graded) return;
      const at = S.ans.indexOf(i);
      if(multi){
        if(at >= 0) S.ans.splice(at,1);
        /* 已經選滿 N 項＝不再吃第 N+1 項，跟原廠考試一樣要先取消一個 */
        else if(S.ans.length >= q.a.length){
          bumpMulti(EN ? `select ${q.a.length} — deselect one first`
                       : `最多 ${q.a.length} 項，請先取消一個`);
          return;
        }
        else S.ans.push(i);
      }
      else S.ans = [i];
      S.ans.sort((x,y)=>x-y);
      [...box.children].forEach(c => c.setAttribute("aria-pressed", S.ans.includes(+c.dataset.i)));
      ansChanged();
    });
    box.append(b);
  });
  qbox.append(box);
  [...box.children].forEach(c => c.setAttribute("aria-pressed", S.ans.includes(+c.dataset.i)));
}

/* ---------- HOTSPOT 是非表：每一句各自選「是 / 否」 ---------- */
function renderHS(q, V, EN){
  const box = document.createElement("div");
  box.className = "hs";
  V.s.forEach((text, i)=>{
    const row = document.createElement("div");
    row.className = "hrow"; row.dataset.i = i;
    const st = document.createElement("span");
    st.className = "st";
    paintHl(st, text);                  /* 敘述本身可以標重點，它不是選項 */
    const yn = document.createElement("span");
    yn.className = "yn";
    [[1, EN?"Yes":"是"], [0, EN?"No":"否"]].forEach(([val, label])=>{
      const b = document.createElement("button");
      b.type = "button"; b.dataset.v = val; b.textContent = label;
      b.setAttribute("aria-pressed", String(S.ans[i] === val));
      b.addEventListener("click", ()=>{
        if(S.graded) return;
        S.ans[i] = val;
        [...yn.children].forEach(c => c.setAttribute("aria-pressed", String(S.ans[i] === +c.dataset.v)));
        ansChanged();
      });
      yn.append(b);
    });
    row.append(st, yn);
    box.append(row);
  });
  qbox.append(box);
}

/* ---------- DRAG DROP 配對：把左邊的項目拖到右邊的答案區 ---------- */
function renderDD(q, V, EN){
  const box = document.createElement("div");
  box.className = "dd";

  const bankLab = document.createElement("p");
  bankLab.className = "lab";
  bankLab.textContent = EN ? "Drag from here (each item may be used once, more than once, or not at all)"
                           : "從這裡拖曳（每個項目可以用一次、多次或完全不用）";
  const bank = document.createElement("div");
  bank.className = "bank";

  let sel = null;                       /* 觸控／點擊操作：先選項目，再點答案格 */
  const chips = V.items.map((text, i)=>{
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.dataset.i = i;
    c.draggable = true; c.textContent = stripHl(text);
    c.setAttribute("aria-pressed","false");
    c.addEventListener("click", ()=>{
      if(S.graded) return;
      sel = (sel === i) ? null : i;
      chips.forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.i === sel)));
    });
    c.addEventListener("dragstart", ev=>{
      if(S.graded){ ev.preventDefault(); return; }
      ev.dataTransfer.setData("text/plain", String(i));
      ev.dataTransfer.effectAllowed = "copy";
      c.classList.add("dragging");
    });
    c.addEventListener("dragend", ()=> c.classList.remove("dragging"));
    bank.append(c);
    return c;
  });

  const rows = document.createElement("div");
  rows.className = "rows";
  const slots = [];
  V.tgt.forEach((text, t)=>{
    const row = document.createElement("div");
    row.className = "drow"; row.dataset.t = t;
    const slot = document.createElement("button");
    slot.type = "button"; slot.className = "slot"; slot.dataset.t = t;
    const desc = document.createElement("span");
    desc.className = "desc";
    paintHl(desc, text);                /* 答案區的描述是題目的一部分，可以標重點 */

    const paint = ()=>{
      const v = S.ans[t];
      slot.textContent = v === null || v === undefined
        ? (EN ? "drop here" : "拖曳到這裡")
        : stripHl(V.items[v]);
      slot.classList.toggle("filled", v !== null && v !== undefined);
    };
    const put = v =>{
      if(S.graded) return;
      S.ans[t] = v;
      paint(); ansChanged();
    };
    slot.addEventListener("click", ()=>{
      if(S.graded) return;
      if(sel !== null){ put(sel); sel = null; chips.forEach(x => x.setAttribute("aria-pressed","false")); }
      else put(null);                   /* 沒有選取中的項目就當作清空這一格 */
    });
    slot.addEventListener("dragover", ev=>{ if(!S.graded){ ev.preventDefault(); slot.classList.add("over"); } });
    slot.addEventListener("dragleave", ()=> slot.classList.remove("over"));
    slot.addEventListener("drop", ev=>{
      ev.preventDefault(); slot.classList.remove("over");
      const v = parseInt(ev.dataTransfer.getData("text/plain"), 10);
      if(!isNaN(v)) put(v);
    });
    paint();
    row.append(slot, desc);
    rows.append(row);
    slots.push(slot);
  });

  const tgtLab = document.createElement("p");
  tgtLab.className = "lab";
  tgtLab.textContent = EN ? "Answer area" : "答案區";

  /* q.nest：原題的答案區是一層包一層的同心方框（#227 的縱深防禦）。
     陣列從最外層排到最內層，字串＝固定的層、null＝要拖進去的空格（依序吃 tgt）。
     只在 fix:true 時成立——答案區的上下順序本身就是題意，不能洗。 */
  const NEST = (EN && q.en && q.en.nest) ? q.en.nest : q.nest;
  if(NEST){
    const wrap = document.createElement("div");
    wrap.className = "nest";
    let cur = wrap, slotAt = 0;
    NEST.forEach(lab=>{
      const lay = document.createElement("div");
      lay.className = "nlay";
      const row = document.createElement("div");
      row.className = "nrow";
      if(lab === null){
        row.classList.add("nslot");
        row.append(slots[slotAt++]);      /* 沿用上面已經接好事件的那顆 slot */
      }
      else row.textContent = lab;
      lay.append(row);
      cur.append(lay);
      cur = lay;                          /* 下一層畫在這一層裡面，自然形成同心 */
    });
    box.append(bankLab, bank, tgtLab, wrap);
    qbox.append(box);
    return;
  }

  box.append(bankLab, bank, tgtLab, rows);
  qbox.append(box);
}

/* ---------- HOTSPOT 下拉選單：句子中挖空，用下拉挑答案 ---------- */
function renderDL(q, V, EN){
  const box = document.createElement("div");
  box.className = "dl";
  const sent = document.createElement("div");
  sent.className = "sent";

  String(V.sent).split("\n").forEach(lineTxt=>{
    if(!lineTxt.trim()) return;
    const ln = document.createElement("span");
    ln.className = "ln";
    /* 句子用 {0} {1} 標出下拉的位置，其餘文字照原樣（含螢光筆標記） */
    let last = 0, m;
    const re = /\{(\d+)\}/g;
    while((m = re.exec(lineTxt)) !== null){
      if(m.index > last){
        const frag = document.createElement("span");
        paintHl(frag, lineTxt.slice(last, m.index));
        ln.append(frag);
      }
      const g = +m[1];
      const sel = document.createElement("select");
      sel.dataset.g = g;
      const ph = document.createElement("option");
      ph.value = ""; ph.textContent = EN ? "— select —" : "— 請選擇 —";
      sel.append(ph);
      (V.dd[g] || []).forEach((opt, oi)=>{
        const o = document.createElement("option");
        o.value = String(oi); o.textContent = stripHl(opt);
        sel.append(o);
      });
      sel.value = (S.ans[g] === null || S.ans[g] === undefined) ? "" : String(S.ans[g]);
      sel.classList.toggle("picked", sel.value !== "");
      sel.addEventListener("change", ()=>{
        if(S.graded) return;
        S.ans[g] = sel.value === "" ? null : +sel.value;
        sel.classList.toggle("picked", sel.value !== "");
        ansChanged();
      });
      ln.append(sel);
      last = m.index + m[0].length;
    }
    if(last < lineTxt.length){
      const frag = document.createElement("span");
      paintHl(frag, lineTxt.slice(last));
      ln.append(frag);
    }
    sent.append(ln);
  });

  box.append(sent);
  qbox.append(box);
}

/* =====================================================================
   批改後在題目本體上標出對錯（四種題型各自的畫法）
   ===================================================================== */
function markBody(q, V, mine, EN){
  switch(kindOf(q)){

  case "hs":
    [...qbox.querySelectorAll(".hs .hrow")].forEach((row, i)=>{
      const right = mine[i] === q.a[i];
      row.classList.add(right ? "ok" : "bad");
      [...row.querySelectorAll(".yn button")].forEach(b=>{
        b.disabled = true;
        const v = +b.dataset.v;
        if(v === q.a[i]) b.classList.add("ans");
        else if(v === mine[i]) b.classList.add("wrongpick");
      });
      const mk = document.createElement("span");
      mk.className = "mk"; mk.textContent = right ? "✓" : "✗";
      row.append(mk);
    });
    return;

  case "dd":
    qbox.querySelectorAll(".dd .chip").forEach(c => { c.disabled = true; c.draggable = false; });
    [...qbox.querySelectorAll(".dd .drow")].forEach((row, t)=>{
      const right = mine[t] === q.a[t];
      row.classList.add(right ? "ok" : "bad");
      const slot = row.querySelector(".slot");
      slot.disabled = true;
      if(!right){
        const fix = document.createElement("span");
        fix.className = "fix";
        fix.textContent = (EN ? "correct: " : "正解：") + stripHl(V.items[q.a[t]]);
        row.querySelector(".desc").append(fix);
      }
    });
    return;

  case "dl":
    [...qbox.querySelectorAll(".dl select")].forEach(sel=>{
      const g = +sel.dataset.g;
      sel.disabled = true;
      sel.classList.remove("picked");
      sel.classList.add(mine[g] === q.a[g] ? "ok" : "bad");
      if(mine[g] !== q.a[g]){
        const fix = document.createElement("span");
        fix.className = "fix";
        fix.textContent = (EN ? "correct: " : "正解：") + stripHl(V.dd[g][q.a[g]]);
        sel.parentNode.append(fix);
      }
    });
    return;

  default:
    [...qbox.querySelectorAll(".opt")].forEach((b,i)=>{
      b.disabled = true;
      const isAns = q.a.includes(i), isMine = mine.includes(i);
      if(isAns && isMine) b.classList.add("ok");
      else if(isAns) b.classList.add("miss");
      else if(isMine) b.classList.add("bad");
    });
  }
}

/* 把 S.ans 重新畫回畫面上（切換語言重繪後要用） */
function reflectAns(q){
  const V = view(q), EN = S.lang === "en";
  switch(kindOf(q)){
    case "hs":
      [...qbox.querySelectorAll(".hs .hrow")].forEach((row,i)=>{
        [...row.querySelectorAll(".yn button")].forEach(b =>
          b.setAttribute("aria-pressed", String(S.ans[i] === +b.dataset.v)));
      });
      return;
    case "dd":
      [...qbox.querySelectorAll(".dd .slot")].forEach((slot,t)=>{
        const v = S.ans[t];
        const has = v !== null && v !== undefined;
        slot.textContent = has ? stripHl(V.items[v]) : (EN ? "drop here" : "拖曳到這裡");
        slot.classList.toggle("filled", has);
      });
      return;
    case "dl":
      [...qbox.querySelectorAll(".dl select")].forEach(sel=>{
        const g = +sel.dataset.g, v = S.ans[g];
        sel.value = (v === null || v === undefined) ? "" : String(v);
        sel.classList.toggle("picked", sel.value !== "");
      });
      return;
    default:
      qbox.querySelectorAll(".opt").forEach(c =>
        c.setAttribute("aria-pressed", String(S.ans.includes(+c.dataset.i))));
  }
}

/* 判定列上的「正確答案：…」文字 */
function answerText(q, V, EN){
  const sep = EN ? ", " : "、";
  switch(kindOf(q)){
    case "hs": return q.a.map(v => YN(v, EN)).join(sep);
    case "dd": return q.a.map(v => stripHl(V.items[v])).join(sep);
    case "dl": return q.a.map((v,g) => stripHl(V.dd[g][v])).join(sep);
    default:   return q.a.map(i => LETTER[i]).join(sep);
  }
}

/* 底部動作列：同一時間只留「現在真的會用到」的按鈕，用不到的直接收起來，
   不要留一排灰掉或意思重複的鈕（例如批改完之後還擺兩顆「下一題」）。 */
function setActions(){
  const en = S.lang === "en";
  const last = S.idx >= S.pool.length - 1;
  btnCheck.dataset.mode = "";          /* 離開成績單畫面 */
  paintJump();
  btnPrev.title = en ? "Back (←)" : "上一題（←）";
  btnPrev.setAttribute("aria-label", en ? "Back" : "上一題");
  btnPrev.hidden = false;
  btnPrev.disabled = !S.pool.length || S.idx <= 0;

  if(S.exam){
    /* 考試：下一題（最後一題就沒有）／作答總覽／交卷 */
    btnCheck.hidden = last;
    btnCheck.textContent = en ? "Next" : "下一題";
    btnCheck.disabled = false;
    btnCheck.className = "act primary";

    btnReveal.hidden = false;
    btnReveal.textContent = en ? "Overview" : "作答總覽";
    btnReveal.disabled = false;
    btnReveal.className = last ? "act primary" : "act";

    btnNext.hidden = false;
    btnNext.textContent = en ? "Submit" : "交卷";
    btnNext.disabled = false;
    btnNext.className = "act ghost";
    btnNext.title = en ? "Submit — the review screen opens first"
                       : "交卷：先跳出「作答總覽」讓你確認，不會直接給分";
    return;
  }

  btnCheck.className = "act primary";
  btnCheck.disabled  = !S.pool.length;
  if(S.graded){
    /* 批改完了：只剩往下走這一件事 */
    btnCheck.hidden = false;
    btnCheck.textContent = en ? "Next" : "下一題";
    btnReveal.hidden = true;
    btnNext.hidden = true;
  } else {
    /* 作答中：批改／看答案／跳過。練習是拿來練的，不想現在處理的題目直接跳掉，
       不批改就不計分、也不會被丟進錯題本，之後用「上一題」或題號欄回來重做。
       只有最後一題不給跳——跳過去就是結算這一輪，手滑的代價太大。 */
    btnCheck.hidden = false;
    btnCheck.textContent = en ? "Check" : "批改";
    btnReveal.hidden = false;
    btnReveal.textContent = en ? "Show answer" : "看答案";
    btnReveal.disabled = !S.pool.length;
    btnReveal.className = "act";
    btnNext.hidden = last || !S.pool.length;
    btnNext.textContent = en ? "Skip" : "跳過";
    btnNext.disabled = false;
    btnNext.className = "act ghost";
    btnNext.title = en ? "Skip — not graded, not scored (→)"
                       : "跳過這題：不計分、不算錯，之後可以用「上一題」或題號欄回來（→）";
  }
}

/* =====================================================================
   練習模式：批改
   ===================================================================== */
/* rescore=false 用於切換語言後重繪同一題：只重畫，不重複計分 */
function grade(revealOnly, rescore){
  if(rescore === undefined) rescore = true;
  if(!S.pool.length || S.idx >= S.pool.length) return;
  const q = S.pool[S.idx];
  const V = view(q);
  const EN = S.lang === "en";
  const mine = S.ans.slice();
  if(!revealOnly && ansEmpty(q, mine)){
    verdict.className = "verdict show fail";
    verdict.textContent = EN ? "Nothing answered yet — make a selection first."
                             : "還沒有作答，先選一個再按批改。";
    return;
  }
  /* 複選題沒選滿「需選 N 項」：原廠考試不讓你送，這裡也一樣先擋下來 */
  if(!revealOnly && mcShort(q, mine)){ nagMulti(q); return; }
  /* 多格題型只填了一部分：先提醒補齊，避免不小心送出半套答案 */
  if(!revealOnly && kindOf(q) !== "mc" && !ansFull(q, mine)){
    verdict.className = "verdict show fail";
    verdict.textContent = EN ? "Some blanks are still empty — fill them all in first."
                             : "還有空格沒填，全部填完再按批改。";
    return;
  }
  const ok = ansOK(q, mine);
  markBody(q, V, mine, EN);

  if(!S.graded && rescore){
    if(!revealOnly){
      S.total++;
      if(ok){ S.right++; wrongSet.delete(q.q); }
      else wrongSet.add(q.q);
    } else {
      wrongSet.add(q.q);   /* 直接看答案＝這題還不熟，留在錯題本 */
    }
    saveWrong();
    recordAttempt(q.q, ok, !!revealOnly);
    scoreEl.textContent = `${S.right} / ${S.total}`;
  }
  S.graded = true;
  S.lastReveal = revealOnly;
  /* 記下這一題的作答與批改狀態，之後用「上一題」翻回來、或切走再切回來都還原得回去 */
  S.answers[S.idx] = mine.slice();
  S.gr[S.idx] = {reveal:!!revealOnly};
  setActions();
  paintMulti();     /* 批改後把徽章收回穩定狀態，不要留著剛才的紅字提醒 */
  saveSess();

  verdict.className = "verdict show " + (ok && !revealOnly ? "pass" : "fail");
  const ansTxt = answerText(q, V, EN);
  const hintTxt = kindOf(q) === "mc"
    ? (EN ? "　(solid green = you got it; dashed green = correct answer you missed; red = wrong pick)"
          : "　（實線綠框＝答對；虛線綠框＝漏掉的正確答案；紅框＝選錯）")
    : (EN ? "　(green = correct; red = your wrong pick)" : "　（綠＝正解；紅＝你選錯的地方）");
  if(revealOnly){
    verdict.textContent = (EN ? `Answer: ${ansTxt}` : `正確答案：${ansTxt}`) + hintTxt;
  } else if(ok){
    verdict.textContent = EN ? `✓ Correct　Answer: ${ansTxt}` : `✓ 答對了　正確答案：${ansTxt}`;
  } else {
    verdict.textContent = EN ? `✗ Incorrect　Answer: ${ansTxt}　saved to Review list`
                             : `✗ 答錯了　正確答案：${ansTxt}　已收進「錯題本」分頁`;
  }

  /* Quiz20 題庫沒有解析，就只顯示出處，不要留一個空框 */
  expl.className = "expl show";
  const lab = q.n
    ? (EN ? `Explanation · ${q.code || ('#' + q.n)}` : `解析 · ${q.code || ('第 ' + q.n + ' 題')}`)
    : (EN ? "Explanation · " : "解析 · ") + q.t;
  expl.innerHTML = '<span class="lab">' + esc(lab) + "</span>";
  if(V.e){
    const body = document.createElement("span");
    paintHl(body, V.e);
    expl.append(body);
  }
  else if(!q.n) expl.className = "expl";
  if(EN && !q.en){
    const note = document.createElement("div");
    note.style.cssText = "margin-top:6px;font-size:.8rem;opacity:.75";
    note.textContent = "(English version not available for this item — showing the original.)";
    expl.append(note);
  }
  verdict.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function nextQ(){
  if(S.idx >= S.pool.length - 1){
    if(!S.exam && !S.graded && S.pool.length){ /* 最後一題還沒批改就直接看結果也可以 */ }
    S.idx++;
    finishRound();
    return;
  }
  S.idx++;
  renderQ();
  window.scrollTo(0, 0);
}

/* 回到上一題：練習模式會連同當時的作答與批改結果一起還原 */
function prevQ(){
  if(S.idx <= 0 || !S.pool.length) return;
  S.idx--;
  renderQ();
  window.scrollTo(0, 0);
}

/* =====================================================================
   作答總覽：仿原廠考試的 Review screen
   交卷不會直接算分，一定先跳到這裡；確認過每一題（尤其是標記待複習的）才真的交卷
   ===================================================================== */
function closeOverview(){ ovwrap.classList.remove("show"); ovwrap.innerHTML = ""; }

function openOverview(submitting){
  if(!S.exam || !S.pool.length) return;
  const EN = S.lang === "en";
  const blanks = [], flagged = [];
  S.pool.forEach((q,i)=>{
    if(!ansDone(q, S.answers[i])) blanks.push(i);   /* 複選只選一半＝還沒作答完 */
    if(S.flags[i]) flagged.push(i);
  });

  const cells = S.pool.map((q,i)=>{
    const done = ansDone(q, S.answers[i]);
    const cls = ["ovcell", done ? "done" : "blank", S.flags[i] ? "flag" : "", i === S.idx ? "cur" : ""]
                .filter(Boolean).join(" ");
    return `<button type="button" class="${cls}" data-i="${i}">${i+1}</button>`;
  }).join("");

  const num = (n, warn) => warn && n ? `<span class="warnnum">${n}</span>` : String(n);
  const sub = EN
    ? `${S.pool.length - blanks.length} of ${S.pool.length} answered · ${num(blanks.length,true)} unanswered · ${num(flagged.length,true)} flagged for review`
    : `已作答 ${S.pool.length - blanks.length} / ${S.pool.length} 題 · 未作答 ${num(blanks.length,true)} 題 · 標記待複習 ${num(flagged.length,true)} 題`;

  const notes = flagged.length ? '<div class="ovnotes"><span class="lab">' +
      (EN ? "Flagged for review" : "標記待複習") + "</span>" +
      flagged.map(i=>{
        const memo = (S.notes[i] || "").trim();
        return `<button type="button" class="ovnote" data-i="${i}">` +
               `<span class="n">${EN?"Q":"第 "}${i+1}${EN?"":" 題"}</span>` +
               `<span class="memo">${esc(memo || (EN ? "(no note)" : "（沒有備註）"))}</span></button>`;
      }).join("") + "</div>" : "";

  ovwrap.innerHTML =
    '<div class="ovcard">' +
      `<h2>${EN ? (submitting ? "Submit your exam?" : "Question overview") : (submitting ? "確定要交卷嗎？" : "作答總覽")}</h2>` +
      `<p class="ovsub">${sub}</p>` +
      `<p class="ovsub">${EN ? "Tap any number to jump straight back to that question. Nothing is graded until you press Submit."
                             : "點題號可以直接跳回那一題重看；按下「確定交卷」之前都不會計分。"}</p>` +
      '<div class="ovlegend">' +
        `<span><i class="done"></i>${EN?"answered":"已作答"}</span>` +
        `<span><i class="blank"></i>${EN?"unanswered":"未作答"}</span>` +
        `<span><i class="flag"></i>${EN?"flagged":"標記待複習"}</span>` +
      "</div>" +
      `<div class="ovgrid">${cells}</div>` + notes +
      '<div class="ovbtns">' +
        `<button type="button" class="go" data-act="back">${EN ? "Keep working" : "返回作答"}</button>` +
        `<button type="button" data-act="submit">${EN ? "Submit &amp; grade" : "確定交卷、給分"}</button>` +
      "</div>" +
    "</div>";
  ovwrap.classList.add("show");
}

el("statBtn").addEventListener("click", openStat);

statwrap.addEventListener("click", e=>{
  if(!statwrap.classList.contains("show")) return;
  if(e.target === statwrap){ closeStat(); return; }

  /* 常錯題：點一下就打星號／取消星號 */
  const wq = e.target.closest("[data-star]");
  if(wq){
    const k = wq.dataset.star;
    if(starSet.has(k)) starSet.delete(k); else starSet.add(k);
    saveStar();
    const on = starSet.has(k);
    wq.setAttribute("aria-pressed", String(on));
    wq.querySelector(".st").textContent = on ? "★" : "☆";
    paintTabProgress();
    return;
  }

  const act = e.target.closest("[data-act]");
  if(!act) return;
  const EN = S.lang === "en";
  const msg = el("stmsg");
  const say = (t, bad)=>{ if(msg){ msg.textContent = t; msg.className = "stmsg" + (bad ? " bad" : ""); } };

  switch(act.dataset.act){
  case "close": closeStat(); return;

  case "export":
    try{ say((EN ? "Exported: " : "已匯出：") + exportSave()); }
    catch(err){ say((EN ? "Export failed: " : "匯出失敗：") + err.message, true); }
    return;

  case "import":
    say(EN ? "Importing replaces everything currently saved in this browser."
           : "匯入會覆蓋這個瀏覽器目前的所有資料，建議先匯出一份備份。");
    el("impFile").value = "";
    el("impFile").click();
    return;

  case "clear": {
    /* 只清統計與歷史，星號和錯題本留著；按兩次才算數 */
    if(act.dataset.armed !== "1"){
      act.dataset.armed = "1";
      act.classList.add("armed");
      act.textContent = EN ? "Tap again to clear" : "再按一次確認清除";
      say(EN ? "This clears attempt stats and round history. Stars and the review list are kept."
             : "會清掉「各領域答對率、常錯題、歷次成績」；星號與錯題本會留著。", true);
      setTimeout(()=>{
        if(act.dataset.armed === "1"){
          act.dataset.armed = "0"; act.classList.remove("armed");
          act.textContent = EN ? "Clear stats" : "清除統計與紀錄";
        }
      }, 4000);
      return;
    }
    qstat = QSTAT[S.src] = {};
    hist  = HIST[S.src]  = [];
    saveQstat(); saveHist();
    S.logged = false;
    openStat();
    el("stmsg").textContent = EN ? "Stats cleared." : "統計與歷次成績已清除。";
    return;
  }
  }
});

el("impFile").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const EN = S.lang === "en";
  const rd = new FileReader();
  rd.onload = ()=>{
    const msg = el("stmsg");
    try{
      const n = importSave(String(rd.result));
      if(msg){ msg.className = "stmsg"; msg.textContent = (EN ? `Imported ${n} entries — reloading…` : `已匯入 ${n} 筆資料，重新載入中…`); }
      setTimeout(()=>location.reload(), 500);
    }catch(err){
      if(msg){ msg.className = "stmsg bad"; msg.textContent = (EN ? "Import failed: " : "匯入失敗：") + err.message; }
    }
  };
  rd.onerror = ()=>{
    const msg = el("stmsg");
    if(msg){ msg.className = "stmsg bad"; msg.textContent = EN ? "Could not read the file." : "讀不到這個檔案。"; }
  };
  rd.readAsText(f);
});

/* 事件掛在容器上，只掛一次；內容每次重畫也不會累積監聽器 */
ovwrap.addEventListener("click", e=>{
  if(!ovwrap.classList.contains("show")) return;
  if(e.target === ovwrap){ closeOverview(); return; }       /* 點背景＝返回作答 */
  const cell = e.target.closest("[data-i]");
  if(cell){ closeOverview(); S.idx = +cell.dataset.i; renderQ(); window.scrollTo(0,0); return; }
  const act = e.target.closest("[data-act]");
  if(!act) return;

  if(act.dataset.act === "submit") finishRound();
});

   ===================================================================== */
const closeStat = () => { statwrap.classList.remove("show"); statwrap.innerHTML = ""; };

const pad2 = n => String(n).padStart(2, "0");
function stampOf(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* 三個領域各自的答對率：拿長期統計（不是單一輪）來算，看得出真正的強弱 */
function domainStats(){
  const out = {1:{n:0,w:0,seen:0,tot:0}, 2:{n:0,w:0,seen:0,tot:0}, 3:{n:0,w:0,seen:0,tot:0}};
  BANK.forEach(q=>{
    const d = out[q.d];
    if(!d) return;
    d.tot++;
    const r = qstat[q.q];
    if(!r || !r.n) return;
    d.seen++; d.n += r.n; d.w += r.w;
  });
  return out;
}

/* 一直做錯的題目：做過兩次以上、錯得最多的排前面 */
function weakQuestions(limit){
  const byText = new Map();
  BANK.forEach(q => byText.set(q.q, q));
  return Object.keys(qstat)
    .map(k => ({k, r:qstat[k], q:byText.get(k)}))
    .filter(x => x.q && x.r.w > 0)
    .sort((a,b) => (b.r.w - a.r.w) || ((b.r.w/b.r.n) - (a.r.w/a.r.n)) || (b.r.t - a.r.t))
    .slice(0, limit);
}
