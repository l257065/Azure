  footHint.innerHTML = S.exam ? (en ? HINT.exam_en : HINT.exam_zh)
                              : (en ? HINT.practice_en : HINT.practice_zh);
  try{ localStorage.setItem(LANG_KEY, S.lang); }catch(e){}
}

function setLang(lang){
  if(LANGS.indexOf(lang) < 0 || lang === S.lang) return;
  S.lang = lang;
  applyLang();
  /* 只重畫當前題目：保留已選答案與已批改狀態，不重出題、不重複計分 */
  if(report.classList.contains("show")){ finishRound(); return; }
  const keep = S.ans.slice(), wasGraded = S.graded, wasReveal = S.lastReveal;
  renderQ();
  const q = S.pool[S.idx];
  if(q && keep.length){ S.ans = keep; reflectAns(q); }
  if(wasGraded) grade(wasReveal, false);
}

el("langSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-lang]");
  if(b) setLang(b.dataset.lang);
});

/* =====================================================================
   題庫來源：自製題庫 ⇄ 文件題庫（分數、錯題本、模擬考各自獨立）
   ===================================================================== */
function setSource(src){
  if(src !== "mine" && src !== "doc") return;
  if(src === S.src) return;
  S.src = src;
  BANK = src === "mine" ? BANK_MINE : BANK_DOC;
  wrongSet = WRONG[src];
  starSet  = STAR[src];
  qstat    = QSTAT[src];
  hist     = HIST[src];
  closeStat(); closeCfg();
  el("srcSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.src === src);
  });
  try{ localStorage.setItem(SRC_KEY, src); }catch(e){}
  applyLang();          /* 頂列的題庫標籤要跟著換 */
  P_reset();
  startRound();
  window.scrollTo(0, 0);
}
/* 換題庫等於重開一輪：分數歸零，模擬考也結束 */
function P_reset(){
  closeOverview();
  if(S.exam){
    S.exam = false;
    el("examBtn").setAttribute("aria-pressed","false");
    timerEl.hidden = true; stopTimer();
    applyLang();
  }
  S.right = 0; S.total = 0;
  S.answers = []; S.gr = []; S.flags = []; S.notes = [];
}
el("srcSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-src]");
  if(b) setSource(b.dataset.src);
});

/* 主題切換 */
/* =====================================================================
   設定面板：題庫來源、主題、重新開始這一輪
   這三個都是「設定一次就很少動」的，收進來讓頂列只留常用的東西
   ===================================================================== */
const openCfg  = ()=>{ paintCfg(); cfgwrap.classList.add("show"); };
const closeCfg = ()=>{ cfgwrap.classList.remove("show"); resetArm(false); };

function setTheme(mode){
  if(mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
  else { document.documentElement.removeAttribute("data-theme"); mode = "system"; }
  try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
  paintCfg();
}
const themeMode = () => document.documentElement.getAttribute("data-theme") || "system";

function paintCfg(){
  el("srcSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.src === S.src));
  });
  el("orderSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.order === S.order));
  });
  const m = themeMode();
  el("themeSeg").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.theme === m));
  });
}

/* 重新開始：按兩次才算數，避免一個手滑把整輪進度洗掉 */
let cfgArmed = false, cfgArmId = null;
function resetArm(on){
  cfgArmed = on;
  const b = el("cfgReset"), en = S.lang === "en";
  b.classList.toggle("armed", on);
  b.textContent = on ? (en ? "↻ Tap again to confirm" : "↻ 再按一次確認重來")
                     : (en ? "↻ Restart" : "↻ 重新開始");
  if(cfgArmId){ clearTimeout(cfgArmId); cfgArmId = null; }
  if(on) cfgArmId = setTimeout(()=>resetArm(false), 4000);
}

el("cfgBtn").addEventListener("click", openCfg);
el("cfgClose").addEventListener("click", closeCfg);
cfgwrap.addEventListener("click", e=>{ if(e.target === cfgwrap) closeCfg(); });
el("themeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-theme]");
  if(b) setTheme(b.dataset.theme);
});

/* 出題順序：只管練習模式。這一輪一題都還沒動就直接照新順序重出，
   已經做了一半就留到下一輪——不會為了換順序把作答進度默默洗掉。 */
function setOrder(mode){
  if(mode !== "seq" && mode !== "rand") return;
  if(mode === S.order){ paintCfg(); return; }
  S.order = mode;
  try{ localStorage.setItem(ORDER_KEY, mode); }catch(e){}
  paintCfg();
  if(!S.exam && S.idx === 0 && S.total === 0 && !S.graded && !answeredCount()
     && !report.classList.contains("show")){
    startRound(true);
    window.scrollTo(0, 0);
  }
}
el("orderSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-order]");
  if(b) setOrder(b.dataset.order);
});
el("cfgReset").addEventListener("click", ()=>{
  if(!cfgArmed){ resetArm(true); return; }
  resetArm(false);
  closeCfg();
  startRound(true);
  window.scrollTo(0, 0);
});

/* =====================================================================
   題數說明：逐段列出題數，並解釋缺號是原始文件本身就跳號而不是漏做。
   數字全部從 BANK_DOC 現算，之後補題就會自己跟著更新。
   ===================================================================== */
const closeInfo = () => { infowrap.classList.remove("show"); infowrap.innerHTML = ""; };

function docGaps(){
  const src = BANK_DOC.filter(hasSrc);
  if(!src.length) return {total:0, gaps:[], secs:[]};

  const by = new Map();
  src.forEach(q=>{
    if(!by.has(q.sec)) by.set(q.sec, []);
    by.get(q.sec).push(q.no);
  });

  const secs = [], gaps = [];
  [...by.entries()]
    .sort((a,b) => secRank(a[0]) - secRank(b[0]))
    .forEach(([sec, nos])=>{
      const max = Math.max(...nos), seen = new Set(nos), miss = [];
      for(let i = 1; i <= max; i++) if(!seen.has(i)) miss.push(i);
      miss.forEach(no => gaps.push({sec, no}));
      secs.push({sec, total:nos.length, max, gaps:miss});
    });
  return {total:src.length, gaps, secs};
}

function infoBtnTitle(en){
  const g = docGaps();
  if(!g.gaps.length) return en ? `Question count: all ${g.total} questions are present, no gaps`
                                : `題數說明：全部 ${g.total} 題都在，沒有跳號`;
  return en ? `Question count: ${g.total} questions by section, and which numbers the PDF skips`
            : `題數說明：${g.total} 題的逐段分布，以及原文跳掉哪些題號`;
}

function openInfo(){
  const EN = S.lang === "en";
  const g = docGaps();
  const hasGaps = g.gaps.length > 0;
  const chip = x => `<i>${secName(x.sec, EN)} #${x.no}</i>`;
  const chips = g.gaps.map(chip).join("");

  /* 逐段一行：段名、段內題數、段內跳掉的題號 */
  const secRows = g.secs.map(s => {
    const miss = s.gaps.length
      ? `<em>#${s.gaps.join("</em> <em>#")}</em>`
      : (EN ? "<i>no gaps</i>" : "<i>沒有跳號</i>");
    return `<div class="inforow"><b>${secName(s.sec, EN)}</b>`
         + `<span>${s.total} ${EN ? "questions" : "題"}</span>`
         + `<span class="miss">${miss}</span></div>`;
  }).join("");

  const body = EN ? `
    <h2>${hasGaps ? `${g.total} questions, by section`
                  : `All ${g.total} questions are present, no gaps`}</h2>
    <p class="ovsub">Nothing is missing — the document bank is complete.</p>
    <div class="infosec">
      <span class="lab">Where the numbers come from</span>
      <p>Each question carries the position it has in the source PDF — the section plus the <em>Question #</em> printed on it. The PDF is split into <em>Question Set 1–6</em>, <em>Testlet 1–10</em> (case studies) and the <em>NewQ</em> supplements, and <b>each section restarts its numbering at 1</b>, so it takes both parts to name a question.</p>
      <p>That is why a gap <b>only means anything inside one section</b>: Question Set 1 ends at #40 and Question Set 2 starts again at #1.</p>
      <div class="inforows">${secRows}</div>
    </div>
    ${hasGaps ? `<div class="infosec">
      <span class="lab">Skipped numbers</span>
      <p>These ${g.gaps.length} numbers do not exist in the source PDF. Every page was checked one by one — they were never transcribed because there is nothing there to transcribe. Typing one into the jump box will simply find nothing.</p>
      <div class="infonums">${chips}</div>
    </div>` : ""}` : `
    <h2>${hasGaps ? `${g.total} 題的逐段分布` : `全部 ${g.total} 題都在，沒有跳號`}</h2>
    <p class="ovsub">沒有漏做，文件題庫已經是完整的。</p>
    <div class="infosec">
      <span class="lab">題號是怎麼來的</span>
      <p>每一題都直接帶著它在原始文件裡的位置——所屬區段，加上題目上印的 <em>Question #</em>。來源 PDF 分成 <em>Question Set 1–6</em>、<em>Testlet 1–10</em>（案例研究）與兩份 <em>NewQ</em> 增題，而且<b>每一段的題號都從 1 重新算</b>，所以要兩格才認得出是哪一題。</p>
      <p>也因此，<b>缺號只在同一段之內才有意義</b>：題組 1 到 #40 就結束，題組 2 又從 #1 開始。</p>
      <div class="inforows">${secRows}</div>
    </div>
    ${hasGaps ? `<div class="infosec">
      <span class="lab">跳掉的題號</span>
      <p>這 ${g.gaps.length} 個題號在原始 PDF 裡根本不存在。已經逐頁比對確認過，不是轉錄時漏掉，是原本就沒有這幾題。把它們打進跳題欄也只會找不到題目。</p>
      <div class="infonums">${chips}</div>
    </div>` : ""}`;

  infowrap.innerHTML = `<div class="ovcard">${body}
    <div class="ovbtns"><button type="button" class="go" data-act="close">${EN ? "Got it" : "知道了"}</button></div>
  </div>`;
  infowrap.classList.add("show");
}

el("infoBtn").addEventListener("click", openInfo);
infowrap.addEventListener("click", e=>{
  if(e.target === infowrap || e.target.closest('[data-act="close"]')) closeInfo();
});

/* 使用說明：收合狀態記起來，不用每次都收 */
hintBox.addEventListener("toggle", ()=>{
  try{ localStorage.setItem(HINT_KEY, hintBox.open ? "1" : "0"); }catch(e){}
});

/* 鍵盤：A-F 選項、Enter 批改／下一題 */
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const k = e.key.toUpperCase();
  const li = LETTER.indexOf(k);
  if(li > -1){
    const b = qbox.querySelectorAll(".opt")[li];
    if(b && !b.disabled){ b.click(); e.preventDefault(); }
    return;
  }
  if(e.key === "Enter"){ btnCheck.click(); e.preventDefault(); }
});

/* sticky 表頭高度 */
const topBar = document.querySelector("header.top");
const syncTop = () => document.documentElement.style.setProperty("--topH", topBar.offsetHeight + "px");
syncTop();
addEventListener("resize", syncTop);
addEventListener("orientationchange", syncTop);
if(window.ResizeObserver) new ResizeObserver(syncTop).observe(topBar);

try{
  const saved = localStorage.getItem(LANG_KEY);
  if(LANGS.indexOf(saved) > -1) S.lang = saved;
  const savedSrc = localStorage.getItem(SRC_KEY);
  if(savedSrc === "doc" && BANK_DOC.length){    /* 文件題庫還沒匯入就不還原 */
    S.src = "doc"; BANK = BANK_DOC; wrongSet = WRONG.doc; starSet = STAR.doc;
    /* qstat 與 hist 也要一起換。漏掉這兩個的話，在文件題庫重新整理之後，
       統計與歷次成績會讀到自製題庫那一份，而且新的紀錄也寫進自製題庫的鍵，
       兩份題庫「各自獨立」的保證就破了。setSource() 有換，這裡原本漏了。 */
    qstat = QSTAT.doc; hist = HIST.doc;
  }
  const savedTab = parseInt(localStorage.getItem(TAB_KEY), 10);
  if(savedTab >= 0 && savedTab <= TAB_MAX) S.tab = savedTab;
  if(localStorage.getItem(HINT_KEY) === "1") hintBox.open = true;
  const savedOrder = localStorage.getItem(ORDER_KEY);
  if(savedOrder === "seq" || savedOrder === "rand") S.order = savedOrder;
}catch(e){}
document.querySelectorAll("nav.tabs button").forEach((b,i)=>b.setAttribute("aria-selected", i === S.tab));
mergeEN();
restoreSessions();     /* 上次沒做完的分頁進度，關掉瀏覽器再回來也接得下去 */
applyLang();
startRound();
</script>
