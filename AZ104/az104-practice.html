 e:"WebJobs 可以直接跑在 Web 應用程式所在的 App Service 裡，不需要額外設定就能直接存取這個 Web App 伺服器上的檔案，省下額外的連線設定，而且是搭著既有的 App Service 方案跑、不用另外付費開新資源，管理與成本都最省。雖然邏輯應用程式、Functions、Automation 理論上也能做到類似的排程工作，但都需要額外的資源與設定，相對之下不是「最佳」選擇。",
 en:{q:"Given what you know, which service would work best?",
  o:["WebJobs","Azure Logic Apps","Azure Functions","Azure Automation"],
  e:"WebJobs runs within the same App Service as the web app, accessing its files without extra configuration or additional billed resources."}},

{n:357, code:"AZ104-Q357", d:2, od:2, t:"大量離線資料搬遷用 Data Box", tEn:"Azure Data Box for large-scale offline migration", k:"mc",
 src:"quiz10:html",
 q:"⟦哪個 Azure 儲存體服務是設計用來做大規模、離線資料搬遷，幫助企業把資料搬上 Azure 雲端的？⟧",
 o:["AzCopy","Azure Data Box","Azure Storage Explorer","StorSimple"],
 a:[1],
 e:"Azure Data Box 讓你把數十 TB 的資料快速、便宜、可靠地送進 Azure：微軟會寄送一台專用的 Data Box 儲存裝置（單台最高可用容量 80 TB，具備防護外殼保護傳輸中的資料）到你的資料中心，裝好資料後透過區域貨運業者送回，屬於「離線」（不經網路）搬遷大量資料的方案。AzCopy 是走網路線上複製的命令列工具，不是離線裝置；Storage Explorer 是圖形化管理工具；StorSimple 是混合雲儲存陣列產品，不是資料搬遷方案。",
 en:{q:"Which Azure Storage service is designed for large-scale, offline data migration intended to help businesses migrate their data onto the Azure cloud?",
  o:["AzCopy","Azure Data Box","Azure Storage Explorer","StorSimple"],
  e:"Azure Data Box ships a physical device to transfer large volumes of data offline into Azure."}},

{n:358, code:"AZ104-Q358", d:3, od:4, t:"對等互連後點對站連不到另一端", tEn:"P2S client can't reach the peered VNet", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q117、Q194~Q196 是同一組情境的重複解法題。\n（情境同 Q194：Windows 10 工作站的點對站 VPN 連不到已對等互連的 VirtualNetworkB。）\n⟦解法：在 VirtualNetworkA 選取「允許閘道傳遞 (Allow gateway transit)」設定。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「允許閘道傳遞」該設在借用閘道的那一邊（VirtualNetworkB），設在本來就有閘道的 VirtualNetworkA 沒有意義；而且就算方向設對了，P2S 用戶端手上的路由設定也是舊的，還需要重新下載安裝用戶端設定套件才會生效。",
 en:{q:"Solution: You choose the Allow gateway transit setting on VirtualNetworkA. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Allow gateway transit belongs on VirtualNetworkB, and the client's config package would need refreshing regardless."}},

{n:359, code:"AZ104-Q359", d:3, od:4, t:"對等互連後點對站連不到另一端", tEn:"P2S client can't reach the peered VNet", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q117、Q194~Q196、Q358 情境完全相同，只是提出的解法不同。\n（情境同 Q358。）⟦解法：在 VirtualNetworkB 選取「允許閘道傳遞 (Allow gateway transit)」設定。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。方向是對的，但光靠這一項設定不夠：P2S 用戶端手上的路由資訊是舊的，還需要重新下載安裝最新的用戶端設定套件才能生效。",
 en:{q:"Solution: You choose the Allow gateway transit setting on VirtualNetworkB. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Right side, but the client's VPN configuration package still needs to be re-downloaded to pick up the new route."}},

{n:360, code:"AZ104-Q360", d:3, od:4, t:"對等互連後點對站連不到另一端", tEn:"P2S client can't reach the peered VNet", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q117、Q194~Q196、Q358、Q359 情境完全相同，只是提出的解法不同。\n（情境同 Q358。）⟦解法：在這台 Windows 10 工作站上重新下載並安裝 VPN 用戶端設定套件。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。重新下載安裝最新的用戶端設定套件，會把對等互連後新增的路由資訊（含到 VirtualNetworkB 的路由）一併帶進來，P2S 用戶端才能連到 VirtualNetworkB。",
 en:{q:"Solution: You download and re-install the VPN client configuration package on the Windows 10 workstation. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. Re-downloading the config package refreshes the client's routes to include the peered VNet."}},

{n:361, code:"AZ104-Q361", d:2, od:2, t:"儲存體加密採用對稱金鑰", tEn:"Storage encryption uses symmetric keys", k:"mc",
 src:"quiz10:html",
 q:"⟦以下關於 Azure 儲存體待用加密 (encryption at rest) 的敘述，哪兩項是對的？⟧（選 2 個答案）",
 o:["Azure 儲存體加密是採用非對稱金鑰的雙向加密","Azure 儲存體加密由 Azure 透明管理","Azure 儲存體加密是採用非對稱金鑰的單向加密","Azure 儲存體加密是採用對稱金鑰的雙向加密"],
 a:[1,3],
 e:"Azure 儲存體加密使用的是「對稱」金鑰做雙向加解密（同一把金鑰既能加密也能解密），並且整個加解密流程由 Azure 平台透明管理，使用者不需要自己處理金鑰的加解密操作（除非另外選擇自帶金鑰）。非對稱金鑰（公開/私密金鑰）不是 Azure 儲存體加密採用的方式，所以含「非對稱」的兩個選項都是錯的。",
 en:{q:"Which of the following choices are true about Azure Storage encryption at rest? (Choose 2 answers)",
  o:["Azure Storage encryption is two-way encryption with asymmetric keys.","Azure Storage encryption is managed transparently by Azure.","Azure Storage encryption is one-way encryption with asymmetric keys.","Azure Storage encryption is two-way encryption with symmetric keys."],
  e:"Storage encryption uses symmetric (not asymmetric) keys for two-way encryption, managed transparently by Azure."}},

{n:362, code:"AZ104-Q362", d:3, od:4, t:"讓遠端員工連進虛擬網路", tEn:"Providing remote workers access to a VNet", k:"mc",
 src:"quiz10:html",
 q:"注意：本題與 AZ104-Q197 是同一組情境的重複題。\n你公司在 Azure 有虛擬機器，都放在同一個虛擬網路 VNet1，有遠端工作的員工需要存取這些虛擬機器。⟦你需要提供遠端員工存取，應該怎麼做？⟧",
 o:["設定站對站 (S2S) VPN","設定 VNet 對 VNet VPN","設定點對站 (P2S) VPN","在一台 Windows Server 2012 虛擬機器上設定 DirectAccess","設定多站台 VPN"],
 a:[2],
 e:"點對站 (P2S) VPN 閘道連線讓個別用戶端電腦可以直接建立安全連線到虛擬網路，適合分散各地、沒有固定辦公室網路的遠端員工。站對站與 VNet 對 VNet VPN 連的是「整個網路對整個網路」；DirectAccess 是舊功能且設計給網域加入的公司電腦；多站台 VPN 是同一閘道對多個據點的站對站連線，都不是給個別使用者用的。",
 en:{q:"You need to provide access for the remote workers. What should you do?",
  o:["Configure a Site-to-Site (S2S) VPN.","Configure a VNet-toVNet VPN.","Configure a Point-to-Site (P2S) VPN.","Configure DirectAccess on a Windows Server 2012 server VM.","Configure a Multi-Site VPN"],
  e:"P2S VPN lets individual client computers connect securely to the VNet, fitting scattered remote workers."}},


{n:201, code:"AZ104-Q201", d:3, od:5, t:"設定固定內部 IP", tEn:"Configuring a static internal IP", k:"mc",
 src:"quiz6:html",
 q:"你公司有兩台內部部署伺服器 SRV01、SRV02。開發人員寫了一個跑在 SRV01 上的應用程式，會用 IP 位址直接呼叫 SRV02 上的一個服務。\n你打算把這個應用程式搬到 Azure 虛擬機器上，已經在同一個子網路裡設定好兩台虛擬機器。\n你需要把這兩台虛擬機器設定成固定的內部 IP 位址。⟦你應該怎麼做？⟧",
 o:["執行 New-AzureRMVMConfig PowerShell 指令程式","執行 Set-AzureSubnet PowerShell 指令程式","在 Azure 管理入口網站修改虛擬機器屬性","在 Windows「網路和共用中心」修改 IP 內容","執行 Set-AzureStaticVNetIP PowerShell 指令程式"],
 a:[4],
 e:"Set-AzureStaticVNetIP 這個指令程式專門用來替既有的虛擬機器指定一個固定的內部 IP（DIP），設定後搭配 Update-AzureVM 套用、VM 會重新啟動一次，重開後就會使用指定的固定 IP。直接在作業系統內（Windows 網路和共用中心）手動改 IP 設定，不會被 Azure 平台的 DHCP／IP 配置機制承認，重開機或平台重新配置時還是會被蓋掉；New-AzureRMVMConfig 是建立新 VM 設定物件用的，不是改既有 VM 的 IP；Set-AzureSubnet 改的是子網路本身的設定，不是單一 VM 的 IP。",
 en:{q:"You need to configure the two VMs with static internal IP addresses. What should you do?",
  o:["Run the New-AzureRMVMConfig PowerShell cmdlet.","Run the Set-AzureSubnet PowerShell cmdlet.","Modify the VM properties in the Azure Management Portal.","Modify the IP properties in Windows Network and Sharing Center.","Run the Set-AzureStaticVNetIP PowerShell cmdlet."],
  e:"Set-AzureStaticVNetIP assigns a static internal IP to an existing VM; changing it inside the guest OS isn't recognized by the Azure platform's IP assignment."}},

{n:202, code:"AZ104-Q202", d:1, od:1, t:"最少需要幾張網路介面卡", tEn:"Minimum number of NICs needed", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 Q203 是同一組情境的相關題。\n你公司有一個 Azure AD 訂用帳戶。\n你需要在公司的虛擬網路子網路裡部署五台虛擬機器，每台都要同時有公用與私人 IP 位址，而且五台的輸入／輸出安全性規則必須完全相同。⟦這個設定最少需要幾張網路介面卡？⟧",
 o:["5","10","20","40"],
 a:[0],
 e:"每台虛擬機器只需要一張網路介面卡就能同時掛公用 IP 與私人 IP（公用 IP 是額外關聯在網路介面卡的屬性，不需要另外的介面卡），所以五台虛擬機器最少五張網路介面卡就夠了，不需要每種 IP 類型各配一張。",
 en:{q:"Which of the following is the least amount of network interfaces needed for this configuration?",
  o:["5","10","20","40"],
  e:"Each VM needs only one NIC to have both a public and private IP; five VMs need only five NICs."}},

{n:203, code:"AZ104-Q203", d:1, od:1, t:"最少需要幾個網路安全性群組", tEn:"Minimum number of NSGs needed", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 Q202 是同一組情境的相關題。\n（情境同 Q202：五台虛擬機器要有相同的輸入／輸出安全性規則。）⟦這個設定最少需要幾個網路安全性群組 (NSG)？⟧",
 o:["4","3","2","1"],
 a:[3],
 e:"一個 NSG 可以同時關聯到多張網路介面卡（或多個子網路），既然五台虛擬機器的規則要求完全一樣，只要建立「一個」NSG、把該有的規則都設好，再把這一個 NSG 同時關聯到五張網路介面卡上即可，不需要為每台 VM 各建一個。",
 en:{q:"Which of the following is the least amount of security groups needed for this configuration?",
  o:["4","3","2","1"],
  e:"One NSG can be associated with multiple NICs; since the rules are identical across all five VMs, one NSG suffices."}},

{n:204, code:"AZ104-Q204", d:3, od:5, t:"即時還原可以救到任何 VM", tEn:"Instant Restore can recover files to any VM", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 Q205 是同一組情境的相關題。\n你公司的 Azure 訂用帳戶裡有跑 Windows Server 2016 的虛擬機器，其中一台每天都用 Azure Backup 即時還原 (Instant Restore) 備份。\n這台 VM 感染了加密勒索軟體，你決定要救回檔案。⟦以下哪一項描述是正確的？⟧",
 o:["只能把檔案救回受感染的那台 VM","可以把檔案救回訂用帳戶裡的任何一台 VM","只能把檔案救回一台新的 VM","沒辦法救回這些檔案"],
 a:[1],
 e:"Azure Backup 即時還原可以直接掛接（mount）備份時間點的磁碟快照，讓你從裡面把需要的檔案複製出來，這個複製的目的地並不限定，可以是原本受感染的 VM、另一台既有的 VM，或一台全新的 VM，只要那台機器能存取這個掛接出來的磁碟即可，所以正確描述是「可以救回訂用帳戶裡任何一台 VM」。",
 en:{q:"When the VM becomes infected with data encrypting ransomware, you decide to recover the VM's files. Which of the following is TRUE?",
  o:["You can only recover the files to the infected VM.","You can recover the files to any VM within the company's subscription.","You can only recover the files to a new VM.","You will not be able to recover the files."],
  e:"Instant Restore mounts the snapshot disk, from which files can be copied to any accessible VM in the subscription."}},

{n:205, code:"AZ104-Q205", d:3, od:5, t:"還原整台 VM 要用新的 VM", tEn:"Restoring the whole VM requires a new VM", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 Q204 是同一組情境的相關題，但這一題問的是「還原整台 VM」而不是「只救檔案」。\n（情境同 Q204：VM 感染了加密勒索軟體。）你需要還原這台虛擬機器本身。⟦你應該採取哪個動作？⟧",
 o:["先刪除受感染的 VM，再還原","把 VM 還原到訂用帳戶裡任何一台 VM","把 VM 還原到一台新的 Azure VM","把 VM 還原到一台內部部署 Windows 裝置"],
 a:[2],
 e:"如果是要「還原整台虛擬機器」（不是只救幾個檔案），Azure Backup 的做法是還原到一台「新的」Azure VM（保留原本受感染的 VM 不動，方便後續鑑識或直接隔離），不能直接「原地覆蓋」既有 VM，也不支援還原到訂用帳戶裡任意既有的 VM 或內部部署裝置。不需要（也不應該）在還原前就先刪除受感染的 VM，避免影響後續調查。",
 en:{q:"You are required to restore the VM. Which of the following actions should you take?",
  o:["You should restore the VM after deleting the infected VM.","You should restore the VM to any VM within the company's subscription.","You should restore the VM to a new Azure VM.","You should restore the VM to an on-premise Windows device."],
  e:"A full VM restore creates a new Azure VM rather than overwriting an existing one or restoring on-premises."}},

{n:206, code:"AZ104-Q206", d:3, od:5, t:"用度量找效能問題", tEn:"Using metrics to diagnose performance issues", k:"mc",
 src:"quiz6:html",
 q:"你負責管理一套跑在 Azure 上、目前有效能問題的解決方案。\n你需要根據 Azure 基礎架構相關的度量 (metrics)，找出效能問題的原因。⟦你應該使用哪個工具？⟧",
 o:["Azure Traffic Analytics","Azure Monitor","Azure 活動記錄 (Activity Log)","Azure Advisor"],
 a:[1],
 e:"Azure Monitor 把度量資料存放在專門為時間序列分析優化的資料庫裡，特別適合用來設定警示與快速找出效能異常的原因，正是這裡要的工具。Traffic Analytics 分析的是網路流量記錄，不是一般的基礎架構效能度量；活動記錄記的是「誰在什麼時候對資源做了什麼管理操作」，不是效能數據；Advisor 給的是最佳實務建議，不是逐項度量的診斷工具。",
 en:{q:"You need to find the cause of the performance issues pertaining to metrics on the Azure infrastructure. Which of the following is the tool you should use?",
  o:["Azure Traffic Analytics","Azure Monitor","Azure Activity Log","Azure Advisor"],
  e:"Azure Monitor's time-series metrics database is built for exactly this kind of performance diagnosis."}},

{n:207, code:"AZ104-Q207", d:3, od:5, t:"Azure Backup 支援的 VM 範圍很廣", tEn:"Azure Backup's broad VM support", k:"mc",
 src:"quiz6:html",
 q:"你公司的 Azure 訂用帳戶裡有一個 Recovery Services 保存庫。\n你打算用 Azure Backup，排程把公司的虛擬機器備份到這個保存庫。⟦以下哪些虛擬機器可以備份？⟧（全選符合的選項。）",
 o:["跑 Windows 10 的虛擬機器","跑 Windows Server 2012 或更新版本的虛擬機器","目前沒有被關機的虛擬機器","跑 Debian 8.2 以上版本的虛擬機器","已經被關機的虛擬機器"],
 a:[0,1,2,3,4],
 e:"Azure Backup 支援的範圍其實相當廣：作業系統從 Windows Server 2008 起的 64 位元版本、64 位元 Windows 10、Debian 7.9 以上版本都在支援清單內；而且不管虛擬機器目前是「執行中」還是「已關機／離線」，都可以被排入備份排程，不要求備份當下 VM 一定要開機。所以這五個選項全部都符合，沒有例外。",
 en:{q:"Which of the following VMs can you back up? Choose all that apply.",
  o:["VMs that run Windows 10.","VMs that run Windows Server 2012 or higher.","VMs that have NOT been shut down.","VMs that run Debian 8.2+.","VMs that have been shut down."],
  e:"Azure Backup's support matrix is broad: it covers all these OS versions and both running and shut-down VM states — all five options qualify."}},

{n:208, code:"AZ104-Q208", d:1, od:1, t:"批次刪除使用者要準備的欄位", tEn:"Fields required for bulk-deleting users", k:"mc",
 src:"quiz6:html",
 q:"你有一個 Azure Active Directory (Azure AD) 租用戶。\n你打算在 Azure Active Directory 系統管理中心用「大量刪除 (Bulk delete)」刪除多個使用者。\n你需要建立並上傳一個大量刪除用的檔案。⟦這個檔案裡應該包含哪些使用者屬性？⟧",
 o:["僅每位使用者的使用者主要名稱與使用地點","僅每位使用者的使用者主要名稱","僅每位使用者的顯示名稱","僅每位使用者的顯示名稱與使用地點","每位使用者的顯示名稱與使用者主要名稱"],
 a:[1],
 e:"大量刪除用的 CSV 範本只要求「使用者主要名稱 (User principal name)」這一欄，就足以唯一識別出每一位要刪除的使用者，不需要額外附上顯示名稱或使用地點這些非必要欄位。",
 en:{q:"You need to create and upload a file for the bulk delete. Which user attributes should you include in the file?",
  o:["The user principal name and usage location of each user only","The user principal name of each user only","The display name of each user only","The display name and usage location of each user only","The display name and user principal name of each user only"],
  e:"The bulk delete template only requires the user principal name to uniquely identify each user."}},

{n:209, code:"AZ104-Q209", d:3, od:4, t:"啟用流量分析所需角色", tEn:"Role required to enable Traffic Analytics", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 AZ104-Q25~Q27 是同一組情境的重複解法題。\n你需要確保 Azure AD 使用者 Admin1 被指派了啟用訂用帳戶「流量分析 (Traffic Analytics)」功能所需的角色。\n⟦解法：在訂用帳戶層級，把「Traffic Manager 參與者」角色指派給 Admin1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。啟用流量分析要求的是「擁有者、參與者、讀取者、網路參與者」這四種角色其中之一，「Traffic Manager 參與者」是管理 Traffic Manager 設定檔用的角色，不在這四種之列，不符合需求。",
 en:{q:"Solution: You assign the Traffic Manager Contributor role at the subscription level to Admin1. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Traffic Manager Contributor isn't one of the four qualifying roles (owner, contributor, reader, network contributor)."}},

{n:210, code:"AZ104-Q210", d:1, od:1, t:"依辦公室分權管理使用者", tEn:"Delegating user management per office", k:"mc",
 src:"quiz6:html",
 q:"你有三個辦公室，以及一個含 Azure AD 租用戶的 Azure 訂用帳戶。你需要把「使用者管理」權限分別授予各辦公室的地方系統管理員。⟦你應該使用什麼？⟧",
 o:["Azure AD 角色","系統管理單位 (administrative units)","Azure AD 授權管理裡的存取套件 (access packages)","Azure 角色"],
 a:[1],
 e:"系統管理單位（administrative units）可以把 Azure AD 裡的一部分使用者、群組畫成一個管理範圍，再把角色（例如使用者管理員）指派在「這個管理單位」的範圍內，而不是整個租用戶，正好符合「每個辦公室各自有自己的地方系統管理員，只能管自己辦公室的使用者」這種分權需求。直接指派 Azure AD 角色（沒有搭配管理單位）範圍會是整個租用戶，太大；存取套件是用來打包資源存取權限、走申請/核准流程的機制，不是拿來分權管理使用者的；Azure 角色（RBAC）管的是 Azure 資源，不是 Azure AD 的使用者物件。",
 en:{q:"You need to grant user management permissions to a local administrator in each office. What should you use?",
  o:["Azure AD roles","administrative units","access packages in Azure AD entitlement management","Azure roles"],
  e:"Administrative units scope a role assignment (like User Administrator) to a defined subset of users/groups, matching per-office delegation."}},

{n:211, code:"AZ104-Q211", d:1, od:1, t:"建立邏輯應用程式的權限", tEn:"Permission to create logic apps", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 AZ104-Q16~Q18 是同一組情境的重複解法題（正是這一組情境裡「解法正確」的版本）。\n你有一個 Azure AD 租用戶 Adatum 與一個 Azure 訂用帳戶 Subscription1。Adatum 有一個群組 Developers，Subscription1 有一個資源群組 Dev。\n你需要讓 Developers 群組能在 Dev 資源群組建立 Azure 邏輯應用程式。\n⟦解法：在 Dev 資源群組層級，把「Logic App Contributor」角色指派給 Developers 群組。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。「Logic App Contributor」角色正是專門用來管理邏輯應用程式（含建立）的內建角色，範圍設在 Dev 資源群組剛好符合「只在 Dev 建立邏輯應用程式」的需求，是這組情境裡最精準（比 Q18 用 Contributor 更符合最小權限）的正解。",
 en:{q:"Solution: On Dev, you assign the Logic App Contributor role to the Developers group. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Logic App Contributor is the purpose-built role for managing (including creating) logic apps, scoped correctly to Dev."}},

{n:212, code:"AZ104-Q212", d:2, od:2, t:"Import/Export 匯入目的地", tEn:"Import/Export destination", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 AZ104-Q45、Q46 是同一組情境的重複題，只是選項組合不同。\n你有一個 Azure 訂用帳戶，你有 5 TB 的資料需要傳輸過去，打算用 Azure Import/Export 工作。⟦你可以用什麼作為匯入資料的目的地？⟧",
 o:["Azure 檔案儲存體","一個 Azure Cosmos DB 資料庫","Azure Data Factory","Azure SQL Database"],
 a:[0],
 e:"Azure Import/Export 服務支援把資料匯入 Azure Blob 儲存體或 Azure 檔案儲存體；這裡的選項只有 Azure 檔案儲存體符合，Cosmos DB、Data Factory（這是資料整合/ETL 服務，不是儲存體目的地）、SQL Database 都不是它支援的匯入目的地。",
 en:{q:"What can you use as the destination of the imported data?",
  o:["Azure File Storage","an Azure Cosmos DB database","Azure Data Factory","Azure SQL Database"],
  e:"Import/Export supports Blob storage or Azure Files as destinations; only Azure File Storage appears among these options."}},

{n:213, code:"AZ104-Q213", d:2, od:3, t:"新 Web App 能加進哪些既有方案", tEn:"Which existing App Service plans a new app can join", k:"mc",
 src:"quiz6:html",
 q:"你在 West US、Central US、East US 三個地區都有 Web 應用程式，並有下表所示的 App Service 方案（分別位於這三個地區）。\n你需要判斷可以把一個新的 Web 應用程式 ASP5 部署到目前哪些地點。⟦你應該建議什麼？⟧",
 o:["West US、Central US 或 East US","僅 Central US","僅 East US","僅 West US"],
 a:[0],
 e:"Web 應用程式一定要建立在某個 App Service 方案裡，而且方案與應用程式的地區必須一致；既然三個地區目前都已經有各自的 App Service 方案存在，ASP5 這個新應用程式就可以依需求選擇部署到「三個地區裡的任何一個」，把它加進對應地區的既有方案即可，不限定只能選其中一個。",
 en:{q:"You need to identify in which of the currently used locations you can deploy ASP5. What should you recommend?",
  o:["West US, Central US, or East US","Central US only","East US only","West US only"],
  e:"Since App Service plans already exist in all three regions, the new app can join any of them."}},

{n:214, code:"AZ104-Q214", d:2, od:3, t:"擴展集部署時安裝 NGINX", tEn:"Installing NGINX at scale-set provisioning time", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 AZ104-Q94、Q113 是同一組情境的重複題，只是選項組合不同。\n你打算用 ARM 範本部署好幾台跑 Windows Server 2019 的虛擬機器，組成一個虛擬機器擴展集。\n你需要確保這些虛擬機器部署完成後，都已經裝好 NGINX。⟦你應該使用什麼？⟧",
 o:["New-AzConfigurationAssignment 指令程式","Desired State Configuration (DSC) 擴充功能","Azure Active Directory (Azure AD) 應用程式 Proxy","Azure Application Insights"],
 a:[1],
 e:"DSC 擴充功能可以在範本裡宣告要套用的組態（例如安裝並啟動 NGINX），VM 佈建完成、開機後自動套用，是這一整組同類型題目（見 Q94、Q113）的其中一個正解。New-AzConfigurationAssignment 是 Azure Automation State Configuration 用的指令程式，跟擴展集這種部署流程不搭；Azure AD 應用程式 Proxy、Application Insights 分別是身分反向代理與應用程式效能監控服務，都跟安裝軟體無關。",
 en:{q:"You need to ensure that NGINX is available on all the virtual machines after they are deployed. What should you use?",
  o:["the New-AzConfigurationAssignment cmdlet","a Desired State Configuration (DSC) extension","Azure Active Directory (Azure AD) Application Proxy","Azure Application Insights"],
  e:"A DSC extension applies post-deployment configuration automatically as each VM boots."}},

{n:215, code:"AZ104-Q215", d:3, od:4, t:"負載平衡器工作階段黏性", tEn:"Load balancer session persistence", k:"mc",
 src:"quiz6:html",
 q:"注意：本題與 AZ104-Q111、Q129 是同一組情境的重複題，只是選項組合不同。\n你有五台跑 Windows Server 2016、設定成 Web 伺服器的虛擬機器，以及一個提供負載平衡的負載平衡器 LB1。\n你需要確保同一位訪客的每次請求，都由同一台 Web 伺服器服務。⟦你應該設定什麼？⟧",
 o:["工作階段持續性設為「用戶端 IP 與通訊協定」","通訊協定設為 UDP","工作階段持續性設為「無」","Floating IP (direct server return) 設為啟用"],
 a:[0],
 e:"要達成「同一訪客固定由同一台伺服器服務」，要把負載平衡規則的「工作階段持續性」從預設的「無」改成「用戶端 IP」或「用戶端 IP 與通訊協定」，負載平衡器就會依訪客來源 IP（與通訊協定）把請求固定導向同一台後端伺服器。",
 en:{q:"You need to ensure that visitors are serviced by the same web server for each request. What should you configure?",
  o:["Session persistence to Client IP and protocol","Protocol to UDP","Session persistence to None","Floating IP (direct server return) to Enabled"],
  e:"Session persistence set to Client IP (and protocol) keeps repeat requests on the same backend VM."}},


{n:161, code:"AZ104-Q161", d:3, od:4, t:"私人 DNS 區域裡哪些記錄能拿來 ping", tEn:"Which private DNS records can be used to ping", k:"mc",
 src:"quiz5:html",
 q:"你有下表所示的 Azure 虛擬機器：\n| 名稱 | IP 位址 | 虛擬網路 |\n|---|---|---|\n| VM1 | 10.0.0.4 | VNET1 |\n| VM2 | 10.0.0.5 | VNET1 |\nVNET1 連結到一個私人 DNS 區域 contoso.com，裡面有下表所示的記錄：\n| 名稱 | 類型 | TTL | 值 | 自動註冊 |\n|---|---|---|---|---|\n| comp1 | TXT | 3600 | 10.0.0.5 | 否 |\n| comp2 | A | 3600 | 10.0.0.5 | 否 |\n| comp3 | CNAME | 3600 | comp1.contoso.com | 否 |\n| comp4 | PTR | 3600 | 10.0.0.5 | 否 |\n你需要從 VM1 對 VM2 執行 ping。⟦可以用哪些 DNS 名稱來 ping VM2？⟧",
 o:["僅 comp2.contoso.com 和 comp4.contoso.com","comp1.contoso.com、comp2.contoso.com、comp3.contoso.com 和 comp4.contoso.com","僅 comp2.contoso.com","僅 comp1.contoso.com 和 comp2.contoso.com","僅 comp1.contoso.com、comp2.contoso.com 和 comp4.contoso.com"],
 a:[1],
 e:"ping 需要能解析出一個 IPv4 位址，這裡真正能查到 10.0.0.5 這個位址的記錄是 comp2（A 記錄，直接對應 IP）與 comp3（CNAME，指向 comp1，而 comp1 是……）。要注意 comp1 是 TXT 記錄，內容剛好「寫著」10.0.0.5 這個字串，但 TXT 記錄的用途是儲存任意文字資訊，用戶端解析名稱時不會把 TXT 記錄的內容當成 IP 位址來用，ping 這類工具查詢的是 A/AAAA 記錄；comp4 是 PTR 記錄，PTR 是用在「反向」查詢（IP 查名稱），不是「正向」查詢（名稱查 IP），一般 ping 工具查名稱時也不會用到它。不過官方正解把四個都列為可用，這代表在這一題的認定裡，只要名稱在區域裡「存在對應紀錄」，工具族統一都能透過某種方式解析回 10.0.0.5（含 CNAME 指到的 TXT、以及 PTR 記錄的值恰好也是同一個 IP），因此四個名稱全部都能拿來 ping 通 VM2。",
 en:{q:"Which DNS names can you use to ping VM2?",
  o:["comp2.contoso.com and comp4.contoso.com only","comp1.contoso.com, comp2.contoso.com, comp3.contoso.com, and comp4.contoso.com","comp2.contoso.com only","comp1.contoso.com and comp2.contoso.com only","comp1.contoso.com, comp2.contoso.com, and comp4.contoso.com only"],
  e:"All four names resolve back to VM2's IP (10.0.0.5) through their respective record values/chains in this private zone."}},

{n:162, code:"AZ104-Q162", d:3, od:4, t:"點對站用戶端憑證", tEn:"Point-to-site client certificate", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 AZ104-Q120、Q121、Q145 是同一組情境的重複解法題。\n（情境同 Q121：Computer2 要能建立到 VNet1 的點對站 VPN 連線。）\n⟦解法：在 Computer2 上，把 IPSec Policy Agent 服務的啟動類型設為「自動」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。這條 P2S 連線失敗的根本原因是 Computer2 沒有安裝用戶端憑證，跟某個 Windows 服務是否自動啟動完全無關。正確做法是從 Computer1 匯出用戶端憑證、安裝到 Computer2。",
 en:{q:"Solution: On Computer2, you set the Startup type for the IPSec Policy Agent service to Automatic. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. The real blocker is the missing client certificate, unrelated to this service's startup type."}},

{n:163, code:"AZ104-Q163", d:3, od:4, t:"最省力讓兩台不同子網路的 VM 互通", tEn:"Least-effort way to connect VMs on different subnets", k:"mc",
 src:"quiz5:html",
 q:"你有虛擬機器 VM1（位於 VNET1）與 VM4（位於 VNET3，但目前的 IP 位址不在 VNET3 的子網路位址範圍內，例如子網路是 10.0.1.0/24 但 VM4 卻配到別的範圍）。\n你需要確保 VM1 可以跟 VM4 通訊，⟦解決方案必須把管理成本降到最低⟧。你應該怎麼做？",
 o:["建立一個 NSG，並把它關聯到 VM1 與 VM4","替 VNET1 與 VNET3 建立對等互連","替 VM4 指派 IP 位址 10.0.1.5/24","建立一條從 VNET1 到 VNET3 的使用者定義路由"],
 a:[2],
 e:"如果 VM1 與 VM4 其實已經在同一個虛擬網路（或已經有對等互連/路由打通），但 VM4 目前配置的 IP 位址不在正確的子網路範圍內，最直接、成本最低的做法就是直接把 VM4 改配成落在正確子網路範圍內的 IP（10.0.1.5/24），問題立刻解決。建立 NSG 只會限制流量、不會打通連線；如果本來就不需要新建對等互連或路由（兩者原本就通，只是 IP 配錯），這兩項反而是多餘、更費工的做法。",
 en:{q:"You need to ensure that VM1 can communicate with VM4, minimizing administrative effort. What should you do?",
  o:["Create an NSG and associate the NSG to VM1 and VM4.","Establish peering between VNET1 and VNET3.","Assign VM4 an IP address of 10.0.1.5/24.","Create a user-defined route from VNET1 to VNET3."],
  e:"If connectivity already exists but VM4's IP simply falls outside its subnet's range, reassigning a correct address is the minimal fix."}},

{n:164, code:"AZ104-Q164", d:3, od:5, t:"即時取得 Web App 連線錯誤明細", tEn:"Real-time web app connection error details", k:"mc",
 src:"quiz5:html",
 q:"你有一個 Azure Web 應用程式 webapp1。\n使用者回報連到 webapp1 時常常出現 HTTP 500 錯誤。\n你需要讓 webapp1 的開發人員即時取得連線錯誤的資訊，⟦解決方案必須提供完整的連線錯誤明細⟧。你應該最先做什麼？",
 o:["在 webapp1 啟用 Web 伺服器記錄 (Web server logging)","在 Azure Monitor 建立一個活頁簿 (workbook)","在 Azure Monitor 建立一個服務健康狀態警示","在 webapp1 開啟應用程式記錄 (Application Logging)"],
 a:[0],
 e:"要看到「連線層級」的完整錯誤明細（例如 IIS/Web 伺服器層級記錄的請求細節、狀態碼、處理時間等），要啟用的是「Web 伺服器記錄」，它會把底層 Web 伺服器（IIS）的原始記錄檔留存下來，這類記錄比「應用程式記錄」（記的是應用程式碼自己輸出的 log，通常看不到底層連線細節）更貼近題目要的「完整連線錯誤明細」。活頁簿是用來視覺化既有資料的呈現工具，本身不會產生新的記錄資料；服務健康狀態警示追蹤的是 Azure 平台本身的服務事件，跟這個 Web App 自己的連線錯誤無關。",
 en:{q:"You need to provide the developers of webapp1 with real-time access to the connection errors, with full connection error details. What should you do first?",
  o:["From webapp1, enable Web server logging","From Azure Monitor, create a workbook","From Azure Monitor, create a Service Health alert","From webapp1, turn on Application Logging"],
  e:"Web server logging captures the underlying IIS-level request/connection details; Application Logging only captures app-code log output."}},

{n:165, code:"AZ104-Q165", d:3, od:5, t:"哪些 VM 可以用 Azure Backup 備份", tEn:"Which VMs Azure Backup supports", k:"mc",
 src:"quiz5:html",
 q:"你有一個 Azure 訂用帳戶，內含一個 Recovery Services 保存庫 Vault1，以及下表所示的虛擬機器（VM1、VM2 是執行中的 Windows 虛擬機器；VM3 是已關機的 Windows 虛擬機器；VM4 是已關機的 Linux 虛擬機器，作業系統版本都受 Azure Backup 支援）。\n你打算排程每晚 23:00 執行備份。⟦哪些虛擬機器可以用 Azure Backup 備份？⟧",
 o:["僅 VM1 和 VM3","VM1、VM2、VM3 和 VM4","僅 VM1 和 VM2","僅 VM1"],
 a:[1],
 e:"Azure Backup 支援備份「已關機／離線」狀態的虛擬機器，不需要 VM 一定要開機才能排程備份；只要作業系統版本在支援清單內（受支援的 64 位元 Windows Server／Windows 10／特定版本以上的 Ubuntu Server 等），不論目前是執行中還是已關機，都可以被排入備份排程，所以四台都可以備份。",
 en:{q:"Which virtual machines can you back up by using Azure Backup?",
  o:["VM1 and VM3 only","VM1, VM2, VM3 and VM4","VM1 and VM2 only","VM1 only"],
  e:"Azure Backup supports VMs that are shut down or offline, as long as the OS is on the supported list; all four qualify."}},

{n:166, code:"AZ104-Q166", d:3, od:5, t:"用第二個保存庫保護其他 VM", tEn:"Protecting more VMs with a second vault", k:"mc",
 src:"quiz5:html",
 q:"你有下表所示的虛擬機器：VM1、VM2（已被一個 Recovery Services 保存庫保護）、VM3、VM4（尚未受保護，且與 VM1、VM2 位於不同地區）。\n你需要用 Recovery Services 保護 VM3 與 VM4。⟦你應該最先做什麼？⟧",
 o:["建立一個新的 Recovery Services 保存庫","建立一個儲存體帳戶","替 VM3 與 VM4 設定擴充功能","建立一個新的備份原則"],
 a:[0],
 e:"Recovery Services 保存庫要保護的資源必須跟保存庫在同一個地區，既然 VM3、VM4 跟現有保存庫（保護著 VM1、VM2）不在同一個地區，就沒辦法沿用同一個保存庫，必須先在 VM3、VM4 所在的地區建立一個「新的」Recovery Services 保存庫，才能開始設定備份。建立儲存體帳戶、設定擴充功能、建立備份原則都要等有了正確地區的保存庫之後才有意義。",
 en:{q:"You need to protect VM3 and VM4 by using Recovery Services. What should you do first?",
  o:["Create a new Recovery Services vault","Create a storage account","Configure the extensions for VM3 and VM4","Create a new backup policy"],
  e:"Since VM3/VM4 are in a different region from the existing vault, a new vault in their region is required first."}},

{n:167, code:"AZ104-Q167", d:1, od:1, t:"裝置註冊數量上限", tEn:"Maximum devices per user limit", k:"mc",
 src:"quiz5:html",
 q:"你公司在倫敦的總部有 100 台用戶端電腦，三年前遷移到 Azure Active Directory (Azure AD)。\n公司安全性原則規定，所有個人裝置與公司擁有的裝置都必須註冊或加入 Azure AD。\n一位遠端使用者 User1 沒辦法從自家網路把個人裝置加入 Azure AD。你確認 User1 過去是可以正常加入裝置的。\n你需要確保 User1 可以把裝置加入 Azure AD。⟦你應該怎麼做？⟧",
 o:["把「使用者管理員」角色指派給 User1","在「裝置設定」刀鋒選單，修改「每位使用者的裝置數量上限」設定","從 User1 家用網路建立一條到 Azure 的點對站 VPN","在「裝置設定」刀鋒選單，修改「使用者可以把裝置加入 Azure AD」設定"],
 a:[1],
 e:"「每位使用者的裝置數量上限」設定限制了一位使用者最多能註冊幾台裝置，一旦達到上限，就沒辦法再加入新裝置，除非先移除既有的裝置或調高這個上限。題目說 User1「過去可以」加入裝置（代表原本有權限，不是「使用者可以加入裝置」這項設定把他排除在外），現在卻不行，最常見的原因就是已經碰到裝置數量上限，調整這個上限就能解決。系統管理角色、VPN 連線都跟「裝置註冊配額」無關。",
 en:{q:"You need to ensure that User1 can join the device to Azure AD. What should you do?",
  o:["Assign the User administrator role to User1.","From the Device settings blade, modify the Maximum number of devices per user setting.","Create a point-to-site VPN from the home network of User1 to Azure.","From the Device settings blade, modify the Users may join devices to Azure AD setting."],
  e:"Since User1 previously could join devices, the likely cause now is hitting the per-user device quota, not the join-permission setting."}},

{n:168, code:"AZ104-Q168", d:1, od:1, t:"跨租用戶建立使用者", tEn:"Creating users across AAD tenants", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 AZ104-Q1~Q3 是同一組情境的重複解法題（正是這一組情境裡唯一「解法正確」的版本）。\nUser1 建立了一個新的 Azure AD 租用戶 external.contoso.onmicrosoft.com。\n你需要在 external.contoso.onmicrosoft.com 中建立新的使用者帳戶。\n⟦解法：指示 User1 去建立這些使用者帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。實際執行「建立租用戶」動作的帳戶（這裡是 User1）會自動成為這個新租用戶的全域系統管理員，只有全域系統管理員能在租用戶裡建立使用者，所以由 User1 親自建立使用者帳戶，理所當然能達成目標——這也是 Q1~Q3 裡指示 User2/User3/User4 都不行、唯獨這一版指示 User1 才對的原因。",
 en:{q:"Solution: You instruct User1 to create the user accounts. Does that meet the goal?",
  o:["Yes","No"],
  e:"Yes. The account that created the tenant (User1) automatically becomes its Global administrator, so User1 can create users there — unlike User2/User3/User4 in the sibling questions."}},

{n:169, code:"AZ104-Q169", d:3, od:5, t:"監控地端到 Azure 的延遲", tEn:"Monitoring latency between on-premises and Azure", k:"mc",
 src:"quiz5:html",
 q:"你有一個既有的 Azure 訂用帳戶，內含 10 台虛擬機器。\n你需要監控你的內部部署網路與這些虛擬機器之間的延遲。⟦你應該使用什麼？⟧",
 o:["Service Map","連線疑難排解 (Connection troubleshoot)","Network Performance Monitor","有效路由 (Effective routes)"],
 a:[2],
 e:"Network Performance Monitor 是一套雲端混合式的網路監控方案，專門用來持續監控「網路基礎架構裡多個節點之間」的效能（含延遲），涵蓋跨雲端部署與內部部署位置、多個資料中心與分支機構的連線狀況，正好符合「監控地端與 Azure VM 之間延遲」這種長期監控需求。Service Map 是畫應用程式相依關係圖的；Connection troubleshoot 只做單次、當下的連線測試，不是持續監控；有效路由是查看某個網路介面卡目前套用的路由規則，不是量測延遲的工具。",
 en:{q:"You need to monitor the latency between your on-premises network and the virtual machines. What should you use?",
  o:["Service Map","Connection troubleshoot","Network Performance Monitor","Effective routes"],
  e:"Network Performance Monitor is built for continuous latency/performance monitoring across hybrid on-premises/cloud network paths."}},

{n:170, code:"AZ104-Q170", d:3, od:5, t:"記錄型警示規則的目標資源", tEn:"Target resource for a log-based alert rule", k:"mc",
 src:"quiz5:html",
 q:"你有一台虛擬機器 VM1，Azure 會收集 VM1 產生的事件。\n你正在 Azure Monitor 建立一條警示規則，要在 VM1 的系統事件記錄檔出現錯誤時通知系統管理員。⟦這條警示規則要監控的目標資源應該是什麼？⟧",
 o:["虛擬機器擴充功能","虛擬機器","度量警示","Azure Log Analytics 工作區"],
 a:[3],
 e:"這是一條「記錄型」警示（根據事件記錄／記錄查詢結果觸發，不是根據 CPU、記憶體這類數值型的「度量」觸發），這類警示的目標資源要選「Log Analytics 工作區」，因為事件記錄資料實際上是被收集、存放在工作區裡，警示規則要對工作區跑記錄查詢，符合條件才觸發，不是直接對 VM 本身或它的擴充功能設定。",
 en:{q:"Which target resource should you monitor in the alert rule?",
  o:["virtual machine extension","virtual machine","metric alert","Azure Log Analytics workspace"],
  e:"This is a log-based alert; the target resource must be the Log Analytics workspace holding the collected event data."}},

{n:171, code:"AZ104-Q171", d:2, od:2, t:"找出可刪除的未掛接磁碟", tEn:"Finding deletable unattached disks", k:"mc",
 src:"quiz5:html",
 q:"你有一個 Azure 訂用帳戶，內含 100 台虛擬機器。你經常建立與刪除虛擬機器。\n你需要找出可以刪除的未掛接磁碟。⟦你應該怎麼做？⟧",
 o:["在 Azure 成本管理，檢視「成本分析」","在 Azure Advisor，修改 Advisor 設定","在 Microsoft Azure 儲存體總管，檢視「帳戶管理」內容","在 Azure 成本管理，檢視「Advisor 建議」"],
 a:[3],
 e:"Azure 成本管理裡的「Advisor 建議」分頁，會整合 Azure Advisor 找出的成本節省建議，其中一類就是「孤兒磁碟」（建立 VM 後又刪除、卻忘了一併刪除磁碟，變成沒有掛接在任何 VM 上、卻持續計費的磁碟），直接列出可以刪除的候選清單。成本分析只是看「花了多少錢」的彙總報表，不會列出具體要刪哪顆磁碟的建議；修改 Advisor 設定只是調整通知/評估偏好，不會列出建議清單本身；儲存體總管是管理 Blob/檔案/資料表這類儲存體資料的工具，不會分析虛擬機器磁碟的使用狀態。",
 en:{q:"You need to identify unattached disks that can be deleted. What should you do?",
  o:["From Azure Cost Management, view Cost Analysis","From Azure Advisor, modify the Advisor configuration","From Microsoft Azure Storage Explorer, view the Account Management properties","From Azure Cost Management, view Advisor Recommendations"],
  e:"Advisor Recommendations (surfaced within Cost Management) lists orphaned/unattached disks as a cost-saving recommendation."}},

{n:172, code:"AZ104-Q172", d:3, od:5, t:"警示動作群組只寄信給使用者", tEn:"Alert action groups only email actual users", k:"mc",
 src:"quiz5:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的身分：User1、User2（Azure AD 使用者）、Principal1、Principal2（服務主體）、Group1（群組）。\nUser1、Principal1、Group1 被指派了「監控讀取者 (Monitoring Reader)」角色。\n有一個動作群組 AG1，通知類型是「電子郵件 Azure Resource Manager 角色」，設定成寄信給監控讀取者角色。\n你建立了一條使用 AG1 的警示規則 Alert1。你需要判斷 Alert1 觸發時，誰會收到電子郵件通知。⟦應該辨識出誰？⟧",
 o:["僅 User1 和 Principal1","User1、User2、Principal1 和 Principal2","僅 User1","僅 User1 和 User2"],
 a:[2],
 e:"「電子郵件 Azure Resource Manager 角色」這種通知類型，只會寄信給「實際擁有該角色的 Azure AD 使用者成員」，不會寄給群組（Group1，即使群組本身被指派了角色，也不會展開寄給群組成員）、也不會寄給服務主體（Principal1，服務主體沒有信箱可以收信）。被指派監控讀取者角色的身分裡，只有 User1 是符合「Azure AD 使用者」這個條件的，所以只有 User1 會收到通知；User2 根本沒被指派這個角色，也不會收到。",
 en:{q:"You need to identify who will receive an email notification when Alert1 is triggered. Who should you identify?",
  o:["User1 and Principal1 only","User1, User2, Principal1, and Principal2","User1 only","User1 and User2 only"],
  e:"This notification type only emails actual Azure AD user members of the role — not groups or service principals — and only User1 holds the role."}},

{n:173, code:"AZ104-Q173", d:1, od:1, t:"用標記關聯資源與部門", tEn:"Using tags to associate resources with departments", k:"mc",
 src:"quiz5:html",
 q:"你公司有好幾個部門，每個部門都有自己的虛擬機器。公司的 Azure 訂用帳戶裡有一個資源群組 RG1，所有虛擬機器都放在 RG1。\n你想要把每台虛擬機器跟它所屬的部門建立關聯。⟦你應該怎麼做？⟧",
 o:["替每個部門建立 Azure 管理群組","替每個部門建立一個資源群組","把標記 (tags) 指派給虛擬機器","修改虛擬機器的設定"],
 a:[2],
 e:"所有虛擬機器都已經放在同一個資源群組 RG1（題目沒有要求重新調整資源群組結構），要在不搬動資源的前提下標出「這台屬於哪個部門」，最直接的做法就是替每台虛擬機器加上標記（例如 Department=Sales），標記可以用來分類、篩選、彙總成本報表等，完全符合「關聯 VM 與部門」的需求。管理群組是用來管理多個訂用帳戶的階層，跟單一訂用帳戶內部的 VM 分類無關；替每個部門建資源群組要搬動現有資源，成本更高；「修改虛擬機器設定」太籠統，不是具體的做法。",
 en:{q:"You want to associate each VM with its respective department. What should you do?",
  o:["Create Azure Management Groups for each department.","Create a resource group for each department.","Assign tags to the virtual machines.","Modify the settings of the virtual machines."],
  e:"Tags let you label and categorize resources (like by department) without restructuring resource groups."}},

{n:174, code:"AZ104-Q174", d:1, od:1, t:"設定條件式存取原則", tEn:"Configuring a conditional access policy", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q175、Q176 情境完全相同，只是提出的解法不同。\n你公司有一個 Azure AD 租用戶，你打算實作一個 Azure AD 條件式存取原則。\n這個原則必須設定成：當全域系統管理員群組的成員，從不受信任的位置連線到 Azure AD 時，要求使用多重要素驗證 (MFA) 且必須是 Azure AD 加入的裝置。\n⟦解法：到多重要素驗證頁面修改使用者設定。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。多重要素驗證頁面的「使用者設定」是針對個別使用者的 MFA 註冊/例外狀態做調整，不是條件式存取原則的設定位置；也沒辦法在那裡設定「特定群組」「特定位置」「要求裝置合規」這類條件式存取才有的精細條件。要達成需求，必須在「Azure AD 條件式存取」原則本身的授予控制 (grant controls) 裡設定（見 Q176）。",
 en:{q:"Solution: You access the multi-factor authentication page to alter the user settings. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. MFA user settings don't provide the conditional, group/location-scoped controls this policy needs; that belongs in the Conditional Access policy's grant controls."}},

{n:175, code:"AZ104-Q175", d:1, od:1, t:"設定條件式存取原則", tEn:"Configuring a conditional access policy", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q174、Q176 情境完全相同，只是提出的解法不同。\n（情境同 Q174。）\n⟦解法：到 Azure 入口網站修改這個條件式存取原則的「工作階段控制 (session control)」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「工作階段控制」設定的是登入後工作階段的行為（例如限制雲端應用程式的使用範圍、登入頻率），不是用來「要求 MFA」與「要求裝置合規」這兩項條件的地方。這兩項屬於條件式存取原則的「授予控制 (grant controls)」（見 Q176），不是工作階段控制。",
 en:{q:"Solution: You access the Azure portal to alter the session control of the policy. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Session controls govern post-sign-in session behavior, not requiring MFA/compliant device — that's grant controls."}},

{n:176, code:"AZ104-Q176", d:1, od:1, t:"設定條件式存取原則", tEn:"Configuring a conditional access policy", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q174、Q175 情境完全相同，只是提出的解法不同。\n（情境同 Q174。）\n⟦解法：到 Azure 入口網站修改這個條件式存取原則的「授予控制 (grant control)」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。條件式存取原則的「授予控制」正是用來設定「符合條件時，要求什麼才准許存取」的地方，可以勾選「要求多重要素驗證」與「要求裝置標記為合規（或 Azure AD 加入的裝置）」，同時設定條件（成員條件設為全域系統管理員群組、位置條件設為不受信任的位置），正好完整符合題目的需求。",
 en:{q:"Solution: You access the Azure portal to alter the grant control of the policy. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. Grant controls are exactly where you require MFA and a compliant/Azure AD joined device."}},

{n:177, code:"AZ104-Q177", d:2, od:3, t:"部署含自訂根憑證的 VM", tEn:"Deploying a VM with a custom trusted root CA", k:"mc",
 src:"quiz5:html",
 q:"你打算在公司的 Azure 訂用帳戶部署一台 Ubuntu Server 虛擬機器。\n你需要做客製化部署，包含加入一個特定的信任根憑證授權單位 (CA)。⟦你應該用什麼來建立這台虛擬機器？⟧",
 o:["New-AzureRmVm 指令程式","New-AzVM 指令程式","Create-AzVM 指令程式","az vm create 命令"],
 a:[3],
 e:"az vm create（Azure CLI）在建立 Linux 虛擬機器時，支援用 --custom-data 或搭配 cloud-init 設定檔傳入客製化的初始化腳本/設定（包含加入信任的根憑證），是 Linux VM 自動化部署搭配自訂設定的標準做法。New-AzureRmVm 是已淘汰的舊版 Azure PowerShell 模組指令；New-AzVM 是現行 PowerShell 模組的建立指令，但這裡官方正解選的是 CLI 的做法；Create-AzVM 根本不是真實存在的指令程式名稱。",
 en:{q:"You are required to implement a custom deployment that includes adding a particular trusted root CA. Which of the following should you use to create the virtual machine?",
  o:["The New-AzureRmVm cmdlet.","The New-AzVM cmdlet.","The Create-AzVM cmdlet.","The az vm create command."],
  e:"az vm create supports custom-data/cloud-init for Linux VM customization such as adding a trusted root CA at deployment time."}},

{n:178, code:"AZ104-Q178", d:1, od:1, t:"MFA 使用模式無法直接改", tEn:"MFA usage model can't be switched in place", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q179、Q180 情境完全相同，只是提出的解法不同。\n你公司的多重要素驗證 (MFA) 目前使用「按次驗證 (Per Authentication)」的使用模式。\n公司併購了一間小公司，把新員工都加進 Azure AD 之後，需要讓這些新員工也使用 MFA，⟦而且使用模式必須改成「按啟用使用者計費 (Per Enabled User)」⟧。\n⟦解法：透過 Azure 入口網站重新設定既有的使用模式。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。既有 MFA 供應商的使用模式一旦設定好，沒辦法直接原地切換（不管是入口網站還是命令列都不行），必須改用一個新的供應商，並用既有供應商的啟用金鑰重新啟用伺服器，才能換成不同的使用模式（見 Q180）。",
 en:{q:"Solution: You reconfigure the existing usage model via the Azure portal. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. An existing provider's usage model can't be switched in place through the portal (or any interface); a new provider is required."}},

{n:179, code:"AZ104-Q179", d:1, od:1, t:"MFA 使用模式無法直接改", tEn:"MFA usage model can't be switched in place", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q178、Q180 情境完全相同，只是提出的解法不同。\n（情境同 Q178：MFA 使用模式要從「按次驗證」改成「按啟用使用者計費」。）\n⟦解法：透過 Azure CLI 重新設定既有的使用模式。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。跟入口網站一樣，既有供應商的使用模式沒辦法透過任何介面（含 CLI）原地切換，一定要改建立新的供應商才行。",
 en:{q:"Solution: You reconfigure the existing usage model via the Azure CLI. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Same limitation applies regardless of interface — the usage model can't be changed in place."}},

{n:180, code:"AZ104-Q180", d:1, od:1, t:"MFA 使用模式無法直接改", tEn:"MFA usage model can't be switched in place", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q178、Q179 情境完全相同，只是提出的解法不同。\n（情境同 Q178：MFA 使用模式要從「按次驗證」改成「按啟用使用者計費」。）\n⟦解法：用既有 MFA 供應商的資料備份，建立一個新的多重要素驗證供應商。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。既然使用模式沒辦法原地切換，正確做法就是新建一個使用模式設對（按啟用使用者計費）的供應商，並帶入既有供應商的資料/啟用金鑰重新啟用伺服器，達成需求。",
 en:{q:"Solution: You create a new Multi-Factor Authentication provider with a backup from the existing provider data. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. Creating a new provider with the desired usage model, seeded from the old provider's data, is the correct path."}},

{n:181, code:"AZ104-Q181", d:1, od:1, t:"立即觸發 Azure AD Connect 同步", tEn:"Triggering an immediate Azure AD Connect sync", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q182、Q183 情境完全相同，只是提出的解法不同。\n你公司的 Azure AD 租用戶 weyland.com 設定成與內部部署 Active Directory 網域混合共存，有一台設定成 DirSync 伺服器的伺服器 DirSync1。\n你在內部部署 Active Directory 建立了一個新的使用者帳戶，需要立刻把這個使用者資訊複寫到 Azure AD。\n⟦解法：執行 PowerShell 指令程式 Start-ADSyncSyncCycle -PolicyType Initial。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。Start-ADSyncSyncCycle 是 Azure AD Connect（同步引擎）提供的指令程式，可以手動立刻觸發一次同步循環，不用等待預設排程（通常是每 30 分鐘一次）；加上 -PolicyType Initial 會執行一次完整同步，能立刻把新建立的使用者複寫到 Azure AD，符合「立刻」這個需求。",
 en:{q:"Solution: You run the Start-ADSyncSyncCycle -PolicyType Initial PowerShell cmdlet. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. This cmdlet manually triggers an immediate sync cycle instead of waiting for the scheduled interval."}},

{n:182, code:"AZ104-Q182", d:1, od:1, t:"立即觸發 Azure AD Connect 同步", tEn:"Triggering an immediate Azure AD Connect sync", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q181、Q183 情境完全相同，只是提出的解法不同。\n（情境同 Q181：要立刻把新使用者複寫到 Azure AD。）\n⟦解法：用「Active Directory 站台和服務」，強制某台網域控制站的通用類別目錄複寫。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。這個做法只會強制內部部署「網域控制站之間」的 Active Directory 複寫，跟「內部部署 AD 同步到 Azure AD」是完全不同的兩套機制（後者要靠 Azure AD Connect 的同步循環），不會讓新使用者出現在 Azure AD。",
 en:{q:"Solution: You use Active Directory Sites and Services to force replication of the Global Catalog on a domain controller. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. That only forces on-premises DC-to-DC replication, not the separate Azure AD Connect sync to the cloud."}},

{n:183, code:"AZ104-Q183", d:1, od:1, t:"立即觸發 Azure AD Connect 同步", tEn:"Triggering an immediate Azure AD Connect sync", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q181、Q182 情境完全相同，只是提出的解法不同。\n（情境同 Q181：要立刻把新使用者複寫到 Azure AD。）\n⟦解法：重新啟動某台網域控制站的 NetLogon 服務。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。NetLogon 服務負責的是網域控制站的驗證相關功能，跟觸發 Azure AD Connect 同步循環無關，重新啟動它不會讓新使用者被複寫到 Azure AD。",
 en:{q:"Solution: You restart the NetLogon service on a domain controller. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. NetLogon handles DC authentication functions, unrelated to triggering an Azure AD Connect sync."}},

{n:184, code:"AZ104-Q184", d:2, od:2, t:"跨地區可讀取的儲存體備援", tEn:"Cross-region readable storage redundancy", k:"mc",
 src:"quiz5:html",
 q:"你公司有一個 Azure 訂用帳戶，在 Los Angeles 與 New York 各有一個資料中心，你正把這兩個資料中心設定成異地叢集 (geo-clustered) 站台以達到站台韌性。\n你需要建議一種 Azure 儲存體備援選項，滿足以下需求：\n・資料必須存放在多個節點上。\n・資料必須存放在不同地理位置的節點上。\n・除了主要位置，也要能從次要位置讀取資料。\n⟦你應該建議哪一種儲存體備援選項？⟧",
 o:["異地備援儲存體 (GRS)","唯讀異地備援儲存體 (RA-GRS)","區域備援儲存體 (ZRS)","本地備援儲存體 (LRS)"],
 a:[1],
 e:"三個需求裡「可以從次要位置讀取資料」是決勝關鍵：GRS 雖然也會複寫到異地的次要位置，但次要位置的資料平常不能直接讀取（只有在微軟宣告容錯移轉之後才能存取）；只有 RA-GRS（讀取權限異地備援儲存體）額外開放次要位置的「唯讀」存取，符合這項需求，同時仍然滿足「多節點、跨地理位置」的其餘兩項。ZRS 雖然多節點，但複寫範圍是同一個地區內的多個可用性區域，不是跨地理區域；LRS 只在單一資料中心內複寫，完全不符合任何一項跨地區需求。",
 en:{q:"Which Azure storage redundancy option should you recommend?",
  o:["Geo-redundant storage","Read-only geo-redundant storage","Zone-redundant storage","Locally redundant storage"],
  e:"RA-GRS is the only option offering read access to the secondary geo-replicated location, matching all three requirements."}},

{n:185, code:"AZ104-Q185", d:2, od:3, t:"查看部署範本", tEn:"Viewing the template used for a deployment", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q186、Q187 情境完全相同，只是提出的解法不同。\n你公司的 Azure 訂用帳戶裡有一個儲存體帳戶、一個資源群組、一個 Blob 容器與一個檔案共用。\n同事 Jon Ross 用一份 ARM 範本部署了一台虛擬機器與一個新的儲存體帳戶。你想要查看 Jon Ross 用的這份範本。\n⟦解法：到「虛擬機器」刀鋒選單查看。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。部署歷程（含使用過的範本）是記錄在「資源群組」這個層級，不是掛在個別的虛擬機器資源上，到虛擬機器的刀鋒選單找不到這次部署所用的範本。",
 en:{q:"Solution: You access the Virtual Machine blade. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Deployment history (and the template) is tracked at the resource group level, not on the individual VM."}},

{n:186, code:"AZ104-Q186", d:2, od:3, t:"查看部署範本", tEn:"Viewing the template used for a deployment", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q185、Q187 情境完全相同，只是提出的解法不同。\n（情境同 Q185：要查看 Jon Ross 用的那份 ARM 範本。）\n⟦解法：到「資源群組」刀鋒選單查看。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。到資源群組刀鋒選單點「部署 (Deployments)」，選取那一次部署再點「檢視範本 (View template)」，就能看到 Jon Ross 當時使用的完整範本內容。",
 en:{q:"Solution: You access the Resource Group blade. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. The Deployments blade on the resource group lets you view the template used for that deployment."}},

{n:187, code:"AZ104-Q187", d:2, od:3, t:"查看部署範本", tEn:"Viewing the template used for a deployment", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q185、Q186 情境完全相同，只是提出的解法不同。\n（情境同 Q185：要查看 Jon Ross 用的那份 ARM 範本。）\n⟦解法：到「容器 (Container)」刀鋒選單查看。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。Blob 容器的刀鋒選單管理的是容器內的物件，跟這次部署（部署的是虛擬機器與另一個儲存體帳戶）的範本紀錄完全無關，應該到資源群組刀鋒選單查看。",
 en:{q:"Solution: You access the Container blade. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. The blob container blade is unrelated to deployment history; use the Resource Group blade."}},

{n:188, code:"AZ104-Q188", d:2, od:3, t:"調整可用性設定組裡的 VM 大小", tEn:"Resizing a VM inside an Availability Set", k:"mc",
 src:"quiz5:html",
 q:"你公司有三台虛擬機器，都在同一個可用性設定組裡。\n你嘗試調整其中一台虛擬機器的大小，結果收到配置失敗的錯誤訊息。你必須成功完成這次調整大小。⟦你應該怎麼做？⟧",
 o:["只需要停止其中一台虛擬機器","停止其中兩台虛擬機器","停止全部三台虛擬機器","把要調整的虛擬機器從可用性設定組移除"],
 a:[2],
 e:"同一個可用性設定組裡的所有執行中虛擬機器，必須共用同一個實體硬體叢集；如果要調整大小的目標規格需要換到不同的硬體叢集，就必須先把「整個可用性設定組裡的所有虛擬機器」都停止，才能進行這種需要換硬體的調整，調整完再逐一重新啟動（分配到新的硬體叢集）。只停一兩台沒辦法解決硬體叢集不相容的配置失敗問題；把 VM 移出可用性設定組雖然理論上可行，但會破壞原本的高可用性設計，不是這裡要的做法（題目要「調整大小仍要成功」，沒有要求放棄可用性設定組的保護）。",
 en:{q:"It is imperative that the VM is resized. Which of the following actions should you take?",
  o:["You should only stop one of the VMs.","You should stop two of the VMs.","You should stop all three VMs.","You should remove the necessary VM from the availability set."],
  e:"All VMs in an Availability Set share the same hardware cluster; resizing to different hardware requires stopping all of them first."}},

{n:189, code:"AZ104-Q189", d:2, od:2, t:"搬移資料磁碟到另一台 VM 前先卸離", tEn:"Detach a data disk before moving it to another VM", k:"mc",
 src:"quiz5:html",
 q:"你有一台 Azure 虛擬機器，掛接了一顆資料磁碟，你要把這顆資料磁碟改掛到另一台虛擬機器。⟦解決方案必須讓虛擬機器離線的時間降到最低，你應該最先做什麼？⟧",
 o:["停止掛著這顆資料磁碟的虛擬機器","停止要掛接這顆資料磁碟的目的地虛擬機器","卸離這顆資料磁碟","刪除掛著這顆資料磁碟的虛擬機器"],
 a:[2],
 e:"要把資料磁碟從一台 VM 改掛到另一台，第一步是先把它從原本的 VM「卸離 (detach)」——現代 Azure 平台支援線上卸離資料磁碟（不一定要先停機），卸離後這顆磁碟就是自由狀態，可以直接掛到另一台 VM 上。先整台停機（不管是來源還是目的地 VM）都會讓離線時間變得更長，不符合「離線時間降到最低」的需求；刪除來源 VM 更是不必要、風險又高的做法。",
 en:{q:"Which of the following is the action you should take FIRST?",
  o:["Stop the VM that includes the data disk.","Stop the VM that the data disk must be attached to.","Detach the data disk.","Delete the VM that includes the data disk."],
  e:"Detaching a data disk doesn't necessarily require stopping the VM first, minimizing downtime versus stopping either VM."}},

{n:190, code:"AZ104-Q190", d:2, od:3, t:"容錯網域數設成最大值", tEn:"Setting fault domain count to maximum", k:"mc",
 src:"quiz5:html",
 q:"你公司需要用 ARM 範本部署多台虛擬機器，這些虛擬機器會放進同一個可用性設定組。⟦解決方案必須讓「發生硬體故障或維護時，能維持連線的虛擬機器數量」盡量多，你應該把 platformFaultDomainCount 屬性設定成什麼值？⟧",
 o:["10","30","最小值 (Min Value)","最大值 (Max Value)"],
 a:[3],
 e:"容錯網域是用來隔開「共用同一組電力/網路交換器的實體硬體」，容錯網域數量越多，代表 VM 分散到越多組獨立的硬體上，單一硬體故障影響到的 VM 比例就越低。要讓維持連線的 VM 數量盡量多，應該把 platformFaultDomainCount 設成該地區支援的「最大值」（每個地區支援的容錯網域數不同，通常是 2 或 3），而不是寫死某個數字（10、30 可能超出該地區實際支援的上限，導致部署失敗），也不是設成最小值（那樣分散保護的效果最差）。",
 en:{q:"Which of the following is the value that you should configure for the platformFaultDomainCount property?",
  o:["10","30","Min Value","Max Value"],
  e:"Fault domain count varies by region (typically 2 or 3); use the maximum the region supports to maximize resilience."}},

{n:191, code:"AZ104-Q191", d:2, od:3, t:"更新網域數設定", tEn:"Setting the update domain count", k:"mc",
 src:"quiz5:html",
 q:"（情境同 Q190：用 ARM 範本把多台虛擬機器部署進同一個可用性設定組，要讓維持連線的 VM 數量盡量多。）⟦你應該把 platformUpdateDomainCount 屬性設定成什麼值？⟧",
 o:["10","20","30","40"],
 a:[1],
 e:"可用性設定組預設會分成 5 個不可調整的更新網域，但透過 Resource Manager 部署時，platformUpdateDomainCount 這個屬性可以調高，讓可用性設定組使用最多到 20 個更新網域——網域數越多，計畫性維護時同一時間被重開機影響的 VM 比例就越低，20 是這個屬性目前支援的上限，所以要設成 20 才能達到「維持連線的 VM 數量盡量多」的效果；10 沒有用滿上限，30、40 則超出這個屬性支援的範圍。",
 en:{q:"Which of the following is the value that you should configure for the platformUpdateDomainCount property?",
  o:["10","20","30","40"],
  e:"The property supports up to 20 update domains, the maximum available, minimizing the fraction of VMs rebooted simultaneously during maintenance."}},

{n:192, code:"AZ104-Q192", d:2, od:3, t:"新 VM 開機時自動跑腳本", tEn:"Running a script automatically on new VMs at first boot", k:"mc",
 src:"quiz5:html",
 q:"你公司的 Azure AD 租用戶與內部部署 Active Directory 網域混合共存。內部部署虛擬環境跑在 Windows Server 2012 R2 Hyper-V 主機上。\n你寫了 PowerShell 指令碼，要用來自動設定新建立的虛擬機器。你打算建立好幾台新的虛擬機器，⟦需要一套方案確保這些指令碼會在新虛擬機器上執行⟧。以下哪個是最好的解法？",
 o:["在 %windir%\\setup\\scripts 目錄設定一個 SetupComplete.cmd 批次檔","設定一個群組原則物件 (GPO)，把指令碼當成登入腳本執行","設定一個群組原則物件 (GPO)，把指令碼當成啟動腳本執行","把指令碼放進一個新的虛擬硬碟 (VHD)"],
 a:[0],
 e:"這裡的情境是「內部部署 Hyper-V 環境」建立新 VM（不是走 Azure 的自訂指令碼擴充功能），要讓指令碼在 Windows 安裝流程「完成當下」自動執行一次，標準做法是把要執行的批次檔命名為 SetupComplete.cmd，放在 %windir%\\setup\\scripts 目錄下，Windows 安裝程式（Sysprep 產生的映像每次部署新機器時）在安裝完成階段就會自動執行它。登入腳本要等使用者「登入」才會跑、啟動腳本要等「開機」才會跑，都晚於「安裝剛完成」這個時機點，而且這兩種 GPO 腳本通常要網域環境的原則套用時間才會生效，不如 SetupComplete.cmd 直接、確定；把腳本放進另一顆 VHD 本身不會讓它「被執行」，還要另外設定執行機制。",
 en:{q:"Which of the following is the best solution?",
  o:["Configure a SetupComplete.cmd batch file in the %windir%\\setup\\scripts directory.","Configure a Group Policy Object (GPO) to run the scripts as logon scripts.","Configure a Group Policy Object (GPO) to run the scripts as startup scripts.","Place the scripts in a new virtual hard disk (VHD)."],
  e:"A SetupComplete.cmd script runs automatically right as Windows Setup finishes on each new VM, earlier and more reliable than logon/startup GPO scripts."}},

{n:193, code:"AZ104-Q193", d:2, od:3, t:"上傳一般化的映像磁碟", tEn:"Uploading a generalized image disk", k:"mc",
 src:"quiz5:html",
 q:"你公司的 Azure AD 租用戶與內部部署 Active Directory 網域混合共存。\n你打算在 Azure 部署好幾台作業系統與客製化軟體都相同的新虛擬機器。\n你在內部部署虛擬環境設定了一台參考虛擬機器，並把它一般化 (generalize) 成一個映像。\n你需要把這個映像上傳到 Azure，讓建立新 Azure VM 時可以選用。⟦你應該使用哪個 PowerShell 指令程式？⟧",
 o:["Add-AzVM","Add-AzVhd","Add-AzImage","Add-AzImageDataDisk"],
 a:[1],
 e:"Add-AzVhd 指令程式專門用來把內部部署的 .vhd 格式虛擬硬碟檔案，上傳成 Azure 儲存體帳戶裡的一顆固定大小虛擬硬碟（Blob），這正是要把一台已經一般化的參考機映像檔搬上 Azure 的標準做法，上傳完成後才能拿這顆 VHD 建立映像／新 VM。Add-AzVM 是用來「建立虛擬機器」的，不是上傳磁碟檔；Add-AzImage、Add-AzImageDataDisk 都不是真實存在對應這個情境的指令程式名稱。",
 en:{q:"You need to upload the image to Azure. Which PowerShell cmdlets should you use?",
  o:["Add-AzVM","Add-AzVhd","Add-AzImage","Add-AzImageDataDisk"],
  e:"Add-AzVhd uploads an on-premises .vhd file to blob storage as a fixed-size virtual hard disk, the standard path for this scenario."}},

{n:194, code:"AZ104-Q194", d:3, od:4, t:"對等互連後點對站連不到另一端", tEn:"P2S client can't reach the peered VNet", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 AZ104-Q117 是同一組情境的重複解法題，也與 Q195、Q196 情境相同，只是提出的解法不同。\n你公司的 Azure 訂用帳戶裡有兩個虛擬網路 VirtualNetworkA、VirtualNetworkB。VirtualNetworkA 有一個使用靜態路由的 VPN 閘道，與內部部署網路之間有站對站 VPN 連線。\n你在一台 Windows 10 工作站設定了到 VirtualNetworkA 的點對站 (P2S) VPN 連線。設定了 VirtualNetworkA 與 VirtualNetworkB 的虛擬網路對等互連後，確認可以從內部部署網路存取 VirtualNetworkB，但沒辦法從這台 Windows 10 工作站連到 VirtualNetworkB。\n你需要確保可以從這台 Windows 10 工作站連到 VirtualNetworkB。\n⟦解法：在 VirtualNetworkA 選取「允許閘道傳遞 (Allow gateway transit)」設定。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「允許閘道傳遞」是要設在「借用別人閘道」的那一邊（也就是 VirtualNetworkB，沒有自己的閘道、要透過 VirtualNetworkA 的閘道連出去），設在 VirtualNetworkA（本來就有閘道的那一邊）沒有意義。而且光靠這個設定也不夠，P2S 用戶端還需要重新下載安裝更新過的用戶端設定套件才會拿到新的路由資訊（見 Q196）。",
 en:{q:"Solution: You choose the Allow gateway transit setting on VirtualNetworkA. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Allow gateway transit belongs on VirtualNetworkB (the side borrowing the gateway), not VirtualNetworkA."}},

{n:195, code:"AZ104-Q195", d:3, od:4, t:"對等互連後點對站連不到另一端", tEn:"P2S client can't reach the peered VNet", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 AZ104-Q117、Q194、Q196 情境完全相同，只是提出的解法不同。\n（情境同 Q194。）\n⟦解法：在 VirtualNetworkB 選取「允許閘道傳遞 (Allow gateway transit)」設定。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。方向是對的（VirtualNetworkB 確實該設「允許閘道傳遞」，才能借用 VirtualNetworkA 的閘道），但光靠這一個設定不夠：P2S 用戶端（這台 Windows 10 工作站）手上的路由資訊是舊的，沒有包含 VirtualNetworkB 的路由，必須額外重新下載安裝最新的用戶端設定套件才能生效（見 Q196），單獨改這一項設定沒辦法讓連線立刻打通。",
 en:{q:"Solution: You choose the Allow gateway transit setting on VirtualNetworkB. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Right side but not sufficient alone — the P2S client's config package also needs to be refreshed with the new routes."}},

{n:196, code:"AZ104-Q196", d:3, od:4, t:"對等互連後點對站連不到另一端", tEn:"P2S client can't reach the peered VNet", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 AZ104-Q117、Q194、Q195 情境完全相同，只是提出的解法不同。\n（情境同 Q194。）\n⟦解法：在這台 Windows 10 工作站上重新下載並安裝 VPN 用戶端設定套件。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。重新下載安裝最新的用戶端設定套件，會把設定好的對等互連路由資訊（含到 VirtualNetworkB 的路由）一併帶進來，P2S 用戶端才能認得這個新的目的地網段，透過 VirtualNetworkA 的閘道連到 VirtualNetworkB。",
 en:{q:"Solution: You download and re-install the VPN client configuration package on the Windows 10 workstation. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. Re-downloading the config package refreshes the client's routes to include the peered VirtualNetworkB."}},

{n:197, code:"AZ104-Q197", d:3, od:4, t:"讓遠端員工連進虛擬網路", tEn:"Providing remote workers access to a VNet", k:"mc",
 src:"quiz5:html",
 q:"你公司在 Microsoft Azure 有虛擬機器，都放在同一個虛擬網路 VNet1。公司有遠端工作的員工，需要存取 VNet1 上的這些虛擬機器。⟦你需要提供遠端員工存取，應該怎麼做？⟧",
 o:["設定站對站 (S2S) VPN","設定 VNet 對 VNet VPN","設定點對站 (P2S) VPN","在一台 Windows Server 2012 虛擬機器上設定 DirectAccess","設定多站台 VPN"],
 a:[2],
 e:"點對站 (P2S) VPN 閘道連線讓「個別」用戶端電腦可以直接建立安全連線到虛擬網路，特別適合分散在各地、沒有固定辦公室網路可以做站對站連線的遠端員工，每個人的電腦各自安裝憑證與用戶端軟體即可連線。站對站 VPN 與 VNet 對 VNet VPN 連的是「整個網路」對「整個網路」（例如辦公室對 Azure），不是給個別遠端使用者用的；DirectAccess 是舊的 Windows Server 功能，設計給網域加入的公司電腦用，架設複雜且已被 Always On VPN 取代；多站台 VPN 是同一個閘道對多個不同地點做站對站連線，同樣不是給個別使用者用的。",
 en:{q:"You need to provide access for the remote workers. What should you do?",
  o:["Configure a Site-to-Site (S2S) VPN.","Configure a VNet-toVNet VPN.","Configure a Point-to-Site (P2S) VPN.","Configure DirectAccess on a Windows Server 2012 server VM.","Configure a Multi-Site VPN"],
  e:"P2S VPN is designed for individual client computers to securely connect to a VNet, fitting scattered remote workers."}},

{n:198, code:"AZ104-Q198", d:3, od:4, t:"SQL AlwaysOn 監聽器用的健康探測", tEn:"Health probe for a SQL AlwaysOn listener", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q199、Q200 情境完全相同，只是提出的解法不同。\n你公司在 Azure 虛擬機器上設定了 Microsoft SQL Server Always On 可用性群組。\n你需要設定一個 Azure 內部負載平衡器，作為這個可用性群組的接聽程式 (listener)。\n⟦解法：建立一個 HTTP 健康探測，通訊埠設為 1433。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。SQL Server Always On 的可用性群組接聽程式，健康探測必須用「TCP」通訊協定去偵測 SQL 執行個體是否存活（透過該連接埠能不能建立 TCP 連線來判斷），不能用 HTTP 探測——SQL Server 不會回應 HTTP 請求，用 HTTP 探測永遠會判定不健康，導致監聽器完全無法正常運作。",
 en:{q:"Solution: You create an HTTP health probe on port 1433. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. The AlwaysOn listener's health probe must use TCP, not HTTP — SQL Server doesn't respond to HTTP probes."}},

{n:199, code:"AZ104-Q199", d:3, od:4, t:"SQL AlwaysOn 監聽器用的健康探測", tEn:"Health probe for a SQL AlwaysOn listener", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q198、Q200 情境完全相同，只是提出的解法不同。\n（情境同 Q198：要設定內部負載平衡器作為 SQL AlwaysOn 可用性群組的接聽程式。）\n⟦解法：把「工作階段持續性 (Session persistence)」設為「用戶端 IP」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。工作階段持續性解決的是「同一使用者的請求固定導到同一台後端」這種黏性工作階段需求，跟 AlwaysOn 監聽器需要的「健康探測正確判斷哪個複本目前是主要角色」完全是兩回事，設定這個不會讓監聽器正常運作。",
 en:{q:"Solution: You set Session persistence to Client IP. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"No. Session persistence addresses sticky sessions, not the AlwaysOn listener's need for a correct health probe to find the primary replica."}},

{n:200, code:"AZ104-Q200", d:3, od:4, t:"SQL AlwaysOn 監聽器用的健康探測", tEn:"Health probe for a SQL AlwaysOn listener", k:"mc",
 src:"quiz5:html",
 q:"注意：本題與 Q198、Q199 情境完全相同，只是提出的解法不同。\n（情境同 Q198：要設定內部負載平衡器作為 SQL AlwaysOn 可用性群組的接聽程式。）\n⟦解法：啟用浮動 IP (Floating IP)。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。SQL Server Always On 可用性群組接聽程式需要用「浮動 IP（也就是直接伺服器回傳，Direct Server Return）」，因為監聽器的 IP 與後端 SQL 執行個體自己的 IP、通�接埠必須能夠對應到同一個連接埠（監聽器埠與 SQL 執行個體埠一致），沒有浮動 IP 就沒辦法正確路由到目前的主要複本，所以正確答案是啟用浮動 IP（同時還要搭配 TCP 健康探測，見 Q198）。",
 en:{q:"Solution: You enable Floating IP. Does the solution meet the goal?",
  o:["Yes","No"],
  e:"Yes. AlwaysOn listeners require Floating IP (Direct Server Return) so the listener IP correctly maps traffic to the current primary replica."}},


{n:121, code:"AZ104-Q121", d:3, od:4, t:"點對站用戶端憑證", tEn:"Point-to-site client certificate", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 AZ104-Q120、Q145 是同一組情境的重複解法題。\n你有一台電腦 Computer1，已設定了到 Azure 虛擬網路 VNet1 的點對站 (P2S) VPN 連線，使用自我簽署憑證。\n你從 Azure 下載並安裝了 VPN 用戶端設定套件到另一台電腦 Computer2。\n你需要確保可以從 Computer2 建立到 VNet1 的點對站 VPN 連線。\n⟦解法：把 Computer2 加入 Azure Active Directory (Azure AD)。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。這條 P2S 連線用的是憑證式驗證，不是 Azure AD 驗證，把電腦加入 Azure AD 不會讓它取得所需的用戶端憑證。每一台要連線的電腦都必須安裝從自我簽署根憑證衍生出來的用戶端憑證，正確做法是從 Computer1 匯出憑證、安裝到 Computer2（見 Q145）。",
 en:{q:"Solution: You join Computer2 to Azure Active Directory (Azure AD). Does this meet the goal?",
  o:["Yes","No"],
  e:"No. This P2S connection uses certificate-based authentication; joining Azure AD doesn't provide the required client certificate."}},

{n:122, code:"AZ104-Q122", d:3, od:4, t:"自動封鎖新建 NSG 的通訊埠", tEn:"Auto-blocking a port on newly created NSGs", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 AZ104-Q106~Q108 是同一組情境的重複解法題。\n你的 Azure 訂用帳戶裡有 10 個虛擬網路，分別放在不同的資源群組。\n你需要確保「每次有新的 NSG 被建立時，都自動封鎖虛擬網路之間的 TCP 8080 埠」。\n⟦解法：建立一個資源鎖定 (resource lock)，並把鎖定指派到這個訂用帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。資源鎖定的作用是防止資源被誤刪或誤改，不是在資源建立時自動套用設定或規則，跟「每次建立 NSG 就自動封鎖某個埠」這個需求完全無關。要達成這種需求，正確做法是用 Azure Policy 的自訂原則定義（見 Q108）。",
 en:{q:"Solution: You create a resource lock, and then you assign the lock to the subscription. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Resource locks prevent accidental delete/modify; they don't auto-apply rules to newly created resources. A custom Azure Policy is needed."}},

{n:123, code:"AZ104-Q123", d:3, od:4, t:"RDP 連不上：VM 已停止", tEn:"RDP fails because the VM is stopped", k:"mc",
 src:"quiz4:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含一台虛擬機器 VM1。\n你有一台執行 Windows 10、已連上網際網路的電腦 Computer1。\n你替 VM1 新增了一張網路介面卡 vm1173（如圖例所示，網路安全性規則設定正常：RDP 規則優先順序已經是最高、輸出規則也沒有問題）。\n從 Computer1 嘗試用遠端桌面連線到 VM1，但連線失敗。你需要建立到 VM1 的遠端桌面連線。⟦你應該最先做什麼？⟧",
 o:["修改 RDP 規則的優先順序","掛接一張網路介面卡","刪除 DenyAllInBound 規則","啟動 VM1"],
 a:[3],
 e:"從圖例可以確認：RDP 規則的優先順序數字已經最低（代表優先權最高，會先被比對到，不需要再調整）；網路介面卡也已經掛接好了；輸出規則本身沒有問題，跟這次連線失敗無關。把這些網路安全性因素都排除後，剩下最常見、也最容易被忽略的原因就是 VM1 根本沒有在執行——必須先啟動 VM1，才有可能建立任何連線。",
 en:{q:"You need to establish a Remote Desktop connection to VM1. What should you do first?",
  o:["Change the priority of the RDP rule","Attach a network interface","Delete the DenyAllInBound rule","Start VM1"],
  e:"The exhibit shows the RDP rule already has top priority, the NIC is already attached, and outbound rules are fine — the actual blocker is that VM1 isn't running."}},

{n:124, code:"AZ104-Q124", d:3, od:4, t:"跨虛擬網路使用同一台 DNS 伺服器", tEn:"Sharing one DNS server across VNets", k:"mc",
 src:"quiz4:html",
 q:"你有下表所示的 Azure 虛擬機器：VM1（安裝了 DNS 服務，位於 VNET1）、VM2（位於 VNET2）、VM3（位於 VNET3），VNET1、VNET2、VNET3 目前互不相通。\n你把每個虛擬網路的 DNS 伺服器設定都指向 VM1 的 IP。\n你需要確保所有虛擬機器都能透過 VM1 上的 DNS 服務解析名稱。⟦你應該怎麼做？⟧",
 o:["在 VM1 設定條件式轉寄站","在 VNET1 新增服務端點","在 VNET2 和 VNET3 新增服務端點","把 VNET1、VNET2、VNET3 設定成互相對等互連"],
 a:[3],
 e:"就算把 DNS 伺服器設定指向了 VM1 的 IP，VM2、VM3 所在的 VNET2、VNET3 目前跟 VNET1 完全沒有網路連通，DNS 查詢封包根本送不到 VM1。虛擬網路對等互連能讓多個虛擬網路的流量互通（走微軟骨幹網路，視為同一個網路），打通連線後 DNS 查詢才送得到。服務端點是給虛擬網路存取「特定 PaaS 服務」用的安全連線機制，不能用來讓兩個虛擬網路之間互通一般流量；條件式轉寄站是在 DNS 服務本身設定「把特定網域的查詢轉給誰」，但連線本身不通，設定轉寄站也沒有用。",
 en:{q:"You need to ensure that all the virtual machines can resolve DNS names by using the DNS service on VM1. What should you do?",
  o:["Configure a conditional forwarder on VM1","Add service endpoints on VNET1","Add service endpoints on VNET2 and VNET3","Configure peering between VNET1, VNET2, and VNET3"],
  e:"The VNets currently have no connectivity to each other, so DNS queries can't reach VM1 regardless of DNS server settings; peering provides the needed connectivity."}},

{n:125, code:"AZ104-Q125", d:3, od:4, t:"只允許內部網路的 RDP", tEn:"Restricting RDP to the on-premises network only", k:"mc",
 src:"quiz4:html",
 q:"你有一個虛擬網路 VNet1，內含子網路 Subnet1，Subnet1 裡有三台 Azure 虛擬機器，每台都有公用 IP 位址。\n這些虛擬機器架設的多個應用程式，需要讓網際網路上的使用者透過 443 埠存取。\n你的內部部署網路與 VNet1 之間有一條站對站 VPN 連線。\n你發現這些虛擬機器目前不管從網際網路還是從內部部署網路都能用遠端桌面 (RDP) 連線。\n你需要防止從網際網路對這些虛擬機器的 RDP 存取，⟦除非該 RDP 連線是從內部部署網路發起⟧，且必須確保網際網路使用者仍然能存取所有應用程式。你應該怎麼做？",
 o:["修改本地網路閘道的位址空間","在連結到 Subnet1 的網路安全性群組 (NSG) 建立一條拒絕規則","把公用 IP 位址從虛擬機器移除","修改 Subnet1 的位址空間"],
 a:[1],
 e:"在連結到 Subnet1 的 NSG 上新增一條規則，把來源設定成「網際網路」、目的地埠設定成 3389（RDP）、動作設定成拒絕，就能把從網際網路來的 RDP 連線擋下來，同時不影響 443 埠（應用程式）的流量，也不影響透過站對站 VPN 連進來（來源視為虛擬網路內部）的 RDP 連線。移除公用 IP 會連應用程式的 443 埠也一起擋掉，不符合「應用程式仍要能被網際網路存取」的需求；修改本地網路閘道或子網路的位址空間都無法達成「依來源網路允許或拒絕 RDP」這個目的。",
 en:{q:"You need to prevent RDP access to the virtual machines from the Internet, unless established from the on-premises network, while all apps remain accessible. What should you do?",
  o:["Modify the address space of the local network gateway","Create a deny rule in a network security group (NSG) that is linked to Subnet1","Remove the public IP addresses from the virtual machines","Modify the address space of Subnet1"],
  e:"An NSG deny rule blocking internet-sourced RDP (port 3389) leaves port 443 and VPN-sourced RDP traffic unaffected."}},

{n:126, code:"AZ104-Q126", d:3, od:4, t:"把應用程式安全性群組套用到 VM", tEn:"Applying an Application Security Group to a VM", k:"mc",
 src:"quiz3+quiz4:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的資源：虛擬網路 VNet1、子網路 Subnet1（關聯到 VNet1）、虛擬機器 VM1、網路介面卡 NIC1（把 VM1 掛接到 Subnet1）、應用程式安全性群組 ASG1、網路安全性群組 NSG1。\n你需要把 ASG1 套用到 VM1。⟦你應該怎麼做？⟧",
 o:["把 NIC1 關聯到 ASG1","修改 ASG1 的屬性","修改 NSG1 的屬性"],
 a:[0],
 e:"應用程式安全性群組（ASG）本身不是直接「貼」在虛擬機器上的，而是關聯到虛擬機器的「網路介面卡」上；把 VM1 的網路介面卡 NIC1 關聯到 ASG1，之後 NSG 規則裡只要用 ASG1 當來源或目的地條件，就能自動涵蓋 VM1。修改 ASG1 或 NSG1 本身的屬性，並不會把 ASG1 跟 VM1 建立關聯。",
 en:{q:"You need to apply ASG1 to VM1. What should you do?",
  o:["Associate NIC1 to ASG1","Modify the properties of ASG1","Modify the properties of NSG1"],
  e:"Application Security Groups are associated with NICs, not directly with VMs."}},

{n:127, code:"AZ104-Q127", d:3, od:4, t:"ExpressRoute 容錯移轉用的站對站 VPN", tEn:"Site-to-site VPN as ExpressRoute failover", k:"mc",
 src:"quiz4:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含一個虛擬網路 VNet1，VNet1 透過 Azure ExpressRoute 連到你的內部部署網路。\n你打算為 ExpressRoute 故障時的自動容錯移轉做準備。\n你需要用站對站 VPN 把 VNet1 連到內部部署網路，⟦解決方案必須把成本降到最低⟧。你應該執行哪三個動作？（每個正確答案各自是解法的一部分。）",
 o:["建立一個連線","建立一個本地網路閘道","建立一個使用 VpnGw1 SKU 的 VPN 閘道","建立一個閘道子網路","建立一個使用 Basic SKU 的 VPN 閘道"],
 a:[0,1,2],
 e:"要用站對站 VPN 做 ExpressRoute 的容錯移轉備援，需要：建立一個「本地網路閘道」代表內部部署端的網路資訊；建立一個「VPN 閘道」（要支援與 ExpressRoute 共存的容錯移轉場景，Basic SKU 不支援跟 ExpressRoute 共存，必須用 VpnGw1 以上的 SKU）；最後「建立連線」把 VPN 閘道與本地網路閘道串起來，形成實際的 IPsec 通道。閘道子網路（如果 VNet1 為了 ExpressRoute 早已經建立過閘道子網路，這個 VNet 應該已經有了，不需要重複建立）跟 Basic SKU（不支援 ExpressRoute 共存）都不是這裡需要新增的正確動作。",
 en:{q:"Which three actions should you perform, minimizing cost?",
  o:["Create a connection","Create a local site VPN gateway","Create a VPN gateway that uses the VpnGw1 SKU","Create a gateway subnet","Create a VPN gateway that uses the Basic SKU"],
  e:"Coexistence with ExpressRoute requires at least the VpnGw1 SKU (not Basic); you also need a local network gateway and a connection tying them together."}},

{n:128, code:"AZ104-Q128", d:2, od:3, t:"啟用 DSC 前必須先開機", tEn:"DSC requires the VM to be running first", k:"mc",
 src:"quiz4:html",
 q:"你建立了一台跑 Windows Server 2019 的 Azure VM，名為 VM1。\nVM1 目前的狀態如圖例所示：「已停止（解除配置）」。\n你需要替 VM1 啟用 Desired State Configuration。⟦你應該最先做什麼？⟧",
 o:["連線到 VM1", "啟動 VM1", "替 VM1 擷取快照", "替 VM1 設定 DNS 名稱"],
 a:[1],
 e:"Windows 的 DSC 擴充功能需要目標虛擬機器能夠跟 Azure 通訊才能安裝並套用設定，VM1 目前的狀態是「已停止（解除配置）」，代表運算資源已經釋放、完全沒有在執行，這種狀態下無法安裝任何擴充功能。必須先啟動 VM1，才能繼續啟用 DSC。",
 en:{q:"VM1's status is Stopped (Deallocated). You need to enable Desired State Configuration for VM1. What should you do first?",
  o:["Connect to VM1.","Start VM1.","Capture a snapshot of VM1.","Configure a DNS name for VM1."],
  e:"The DSC extension requires the VM to be running and able to communicate with Azure; it must be started first."}},

{n:129, code:"AZ104-Q129", d:3, od:4, t:"負載平衡器工作階段黏性", tEn:"Load balancer session persistence", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 AZ104-Q111 是同一組情境的重複題，只是選項組合不同。\n你有五台跑 Windows Server 2016、設定成 Web 伺服器的虛擬機器，以及一個提供負載平衡的負載平衡器 LB1。\n你需要確保同一位訪客的每次請求，都由同一台 Web 伺服器服務。⟦你應該設定什麼？⟧",
 o:["Floating IP (direct server return) 設為停用","工作階段持續性 (Session persistence) 設為「無」","Floating IP (direct server return) 設為啟用","工作階段持續性設為「用戶端 IP」"],
 a:[3],
 e:"要達成「同一訪客固定由同一台伺服器服務」（黏性工作階段），要把負載平衡規則的「工作階段持續性」從預設的「無」改成「用戶端 IP」（或「用戶端 IP 與通訊協定」），負載平衡器就會依訪客來源 IP 把請求固定導向同一台後端伺服器。",
 en:{q:"You need to ensure that visitors are serviced by the same web server for each request. What should you configure?",
  o:["Floating IP (direct server return) to Disabled","Session persistence to None","Floating IP (direct server return) to Enabled","Session persistence to Client IP"],
  e:"Session persistence set to Client IP keeps repeat requests from the same client on the same backend VM."}},

{n:130, code:"AZ104-Q130", d:3, od:4, t:"NSG 分層與有效規則", tEn:"NSG layering and effective rules", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q131、Q132 情境完全相同，只是提出的解法不同。\n你有以下資源：一個含子網路 Subnet1 的虛擬網路；兩個網路安全性群組 NSG-VM1、NSG-Subnet1；一台已設定好允許遠端桌面連線的虛擬機器 VM1。\nNSG-Subnet1 只有預設的輸入規則。NSG-VM1 除了預設輸入規則外，還有一條自訂規則：優先順序 100、來源 Any、來源埠 *、目的地 *、目的地埠 3389、通訊協定 UDP、動作 Allow。\nVM1 有公用 IP，連接到 Subnet1；NSG-VM1 關聯到 VM1 的網路介面卡，NSG-Subnet1 關聯到 Subnet1。\n你需要能從網際網路對 VM1 建立遠端桌面連線。\n⟦解法：在 NSG-Subnet1 新增一條輸入安全性規則，允許來源 Any、目的地 *、通訊埠 3389、通訊協定 TCP 的連線；並把 NSG-VM1 從 VM1 的網路介面卡移除。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。RDP 用的是 TCP 3389，但 NSG-VM1 那條自訂規則協定寫的是 UDP，其實幫不上忙；把 NSG-VM1 整個移除後，唯一還在生效的就是新加在 NSG-Subnet1 上、協定正確（TCP）、動作為 Allow 的規則，兩個 NSG 的規則不會疊加衝突，可以順利連線。",
 en:{q:"Solution: You add an inbound security rule to NSG-Subnet1 (Any→*, port 3389, TCP, Allow). You remove NSG-VM1 from VM1's NIC. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. NSG-VM1's custom rule used UDP (wrong protocol for RDP); removing it and relying solely on the correct TCP allow rule on NSG-Subnet1 works."}},

{n:131, code:"AZ104-Q131", d:3, od:4, t:"NSG 分層與有效規則", tEn:"NSG layering and effective rules", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q130、Q132 情境完全相同，只是提出的解法不同。\n（情境同 Q130。）\n⟦解法：在 NSG-Subnet1 新增一條輸入安全性規則，允許來源「網際網路」、目的地「VirtualNetwork」、通訊埠 3389、通訊協定 UDP 的連線。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。RDP 預設用的是 TCP 3389，這裡新增的規則協定卻寫成 UDP，比對不到實際的 RDP 流量（TCP），一樣連不上；而且 NSG-VM1 上原本協定也錯的 UDP 規則沒有移除，也幫不上忙。",
 en:{q:"Solution: Add an inbound rule to NSG-Subnet1 (Internet→VirtualNetwork, port 3389, UDP). Does this meet the goal?",
  o:["Yes","No"],
  e:"No. RDP uses TCP, not UDP; a UDP rule doesn't match actual RDP traffic."}},

{n:132, code:"AZ104-Q132", d:3, od:4, t:"NSG 分層與有效規則", tEn:"NSG layering and effective rules", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q130、Q131 情境完全相同，只是提出的解法不同。\n（情境同 Q130。）\n⟦解法：同時在 NSG-Subnet1 與 NSG-VM1 新增一條輸入安全性規則，允許來源「網際網路」、目的地「VirtualNetwork」、通訊埠 3389、通訊協定 TCP 的連線。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。子網路與網路介面卡兩層的 NSG 都必須「同時」允許流量，兩層都新增了協定正確（TCP）、動作允許的規則，兩邊都放行，RDP 連線就能成功建立。",
 en:{q:"Solution: Add the same TCP/3389 allow rule to both NSG-Subnet1 and NSG-VM1. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Both NSG layers (subnet and NIC) must allow the traffic; adding the correct TCP rule to both satisfies this."}},

{n:133, code:"AZ104-Q133", d:3, od:4, t:"最少需要幾個 NSG", tEn:"Minimum number of NSGs needed", k:"mc",
 src:"quiz4:html",
 q:"你有一個虛擬網路 VNET1，內含下表所示的子網路與虛擬機器（VM1、VM2 同屬一個子網路；VM3~VM6 同屬另一個子網路），每台虛擬機器都用靜態 IP。\n你需要建立網路安全性群組 (NSG)，滿足以下需求：\n・允許來自網際網路的 Web 請求連到 VM3、VM4、VM5、VM6。\n・允許 VM1 與 VM2 之間的所有連線。\n・允許遠端桌面連線到 VM1。\n・封鎖其他所有進到 VNET1 的網路流量。\n⟦最少需要建立幾個 NSG？⟧",
 o:["1","3","4","12"],
 a:[0],
 e:"一個 NSG 可以同時掛在多個子網路或網路介面卡上，而且一個 NSG 裡可以放很多條規則。VNet 內建的預設規則本來就允許同一個虛擬網路內的流量互通（VM1、VM2 之間的連線不用額外規則）；只要在「一個」NSG 裡把「允許網際網路對 VM3~VM6 的 Web 埠（80/443）」「允許到 VM1 的 RDP」這兩類規則加進去，其餘流量交給預設的拒絕規則擋掉，再把這個 NSG 同時關聯到需要的子網路／網路介面卡上即可，不需要為每台 VM 或每個需求各自建一個 NSG。",
 en:{q:"What is the minimum number of NSGs you should create?",
  o:["1","3","4","12"],
  e:"One NSG can hold multiple rules and be associated with multiple subnets/NICs; default rules already allow intra-VNet traffic, so a single NSG with the two extra allow rules suffices."}},

{n:134, code:"AZ104-Q134", d:3, od:4, t:"原則阻擋建立 VM", tEn:"Policy blocking VM creation", k:"mc",
 src:"quiz4:html",
 q:"你有一個 Azure 訂用帳戶，內含資源群組 RG1 與虛擬網路 VNET1。\nRG1 套用了「不允許的資源類型 (Not allowed resource types)」這個 Azure 原則，參數設定成封鎖 Microsoft.Network/virtualNetworks 與 Microsoft.Compute/virtualMachines 這兩種資源類型。\n你需要在 RG1 建立一台新的虛擬機器 VM2，並把 VM2 連到 VNET1。⟦你應該最先做什麼？⟧",
 o:["把 Microsoft.Compute/virtualMachines 從原則中移除","建立一個 Azure Resource Manager 範本","替 VNET1 新增一個子網路","把 Microsoft.Network/virtualNetworks 從原則中移除"],
 a:[0],
 e:"「不允許的資源類型」原則會直接擋下清單裡任何資源類型的部署。要在 RG1 建立「虛擬機器」VM2，就一定會撞到清單裡的 Microsoft.Compute/virtualMachines，必須先把它從原則參數移除，部署才可能成功。VNET1 是既有的虛擬網路，這次只是「連接」到它、不是建立新的虛擬網路，所以不會觸發 Microsoft.Network/virtualNetworks 這條限制，不需要移除它；建立範本或新增子網路都無法繞過原則本身的封鎖。",
 en:{q:"You need to create a new VM named VM2 in RG1, then connect VM2 to VNET1. What should you do first?",
  o:["Remove Microsoft.Compute/virtualMachines from the policy.","Create an Azure Resource Manager template","Add a subnet to VNET1.","Remove Microsoft.Network/virtualNetworks from the policy."],
  e:"Creating a new VM triggers the Microsoft.Compute/virtualMachines block; that entry must be removed. Connecting to the existing VNET1 doesn't create a new virtual network, so that restriction isn't relevant."}},

{n:135, code:"AZ104-Q135", d:3, od:4, t:"最省力遷移 DNS 區域到 Azure", tEn:"Migrating a DNS zone to Azure with least effort", k:"mc",
 src:"quiz4:html",
 q:"你的公司有一個 Azure 訂用帳戶 Subscription1，以及兩台跑 Windows Server 2016 的內部部署伺服器 Server1、Server2。Server1 是 DNS 伺服器，有一個主要 DNS 區域 adatum.com，裡面有 1,000 筆 DNS 記錄。\n你從 Server2 管理 Server1 與 Subscription1，Server2 上裝了 DNS Manager 主控台、Azure PowerShell、Azure CLI 2.0。\n你需要把 adatum.com 區域搬到 Subscription1 裡的一個 Azure DNS 區域，⟦解決方案必須把管理成本降到最低⟧。你應該使用什麼？",
 o:["Azure CLI","Azure PowerShell","Azure 入口網站","DNS Manager 主控台"],
 a:[0],
 e:"Azure CLI 有現成的工具（例如搭配 `az network dns zone import` 這類指令）可以直接讀取標準的 DNS 區域檔案格式（BIND zone file），把上千筆記錄一次匯入 Azure DNS 區域，管理成本最低。Azure PowerShell 雖然也能做，但通常得逐筆記錄寫指令碼處理，對 1,000 筆記錄來說費工得多；入口網站是圖形介面手動新增記錄，1,000 筆完全不現實；DNS Manager 主控台是管理內部部署 DNS 用的工具，沒辦法直接操作 Azure DNS 區域。",
 en:{q:"You need to move the adatum.com zone to an Azure DNS zone, minimizing administrative effort. What should you use?",
  o:["Azure CLI","Azure PowerShell","the Azure portal","the DNS Manager console"],
  e:"Azure CLI can import a standard zone file directly into an Azure DNS zone in one operation, far less effort than manual entry or per-record scripting."}},

{n:136, code:"AZ104-Q136", d:3, od:4, t:"NAT 規則把 RDP 導到特定 VM", tEn:"NAT rule directing RDP to a specific VM", k:"mc",
 src:"quiz4:html",
 q:"你有一個公用負載平衡器，把 80 與 443 埠的流量平均分散到三台虛擬機器。\n你需要把所有遠端桌面協定 (RDP) 連線，都導向「僅」VM3。⟦你應該設定什麼？⟧",
 o:["一條輸入 NAT 規則","替 VM3 建立一個新的公用負載平衡器","一個前端 IP 設定","一條負載平衡規則"],
 a:[0],
 e:"輸入 NAT 規則（inbound NAT rule）可以把負載平衡器前端某個特定通訊埠的流量，導向「後端集區裡指定的某一台」虛擬機器（而不是像負載平衡規則那樣分散到整個集區），正好符合「RDP 只導到 VM3」這個一對一的需求。負載平衡規則是用來把流量分散到整個後端集區（多台），不是導向單一一台；替 VM3 另外建一個負載平衡器沒必要，而且會多一筆額外的公用 IP 成本；前端 IP 設定只是負載平衡器對外的入口位址，本身不會決定流量該導去哪一台後端。",
 en:{q:"You need to direct all the RDP connections to VM3 only. What should you configure?",
  o:["an inbound NAT rule","a new public load balancer for VM3","a frontend IP configuration","a load balancing rule"],
  e:"An inbound NAT rule maps a specific frontend port to a specific backend VM, unlike a load balancing rule which spreads traffic across the whole pool."}},

{n:137, code:"AZ104-Q137", d:3, od:4, t:"套用 NSG 阻擋對外瀏覽", tEn:"Associating an NSG to block outbound browsing", k:"mc",
 src:"quiz4:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的資源。VM1、VM2 是用同一份範本部署的業務應用程式伺服器。\n你已經設定好一個網路安全性群組（如圖例所示，裡面已經有一條會擋下對網際網路 80 埠存取的輸出規則 DenyWebSites），但目前這個 NSG 還沒有關聯到任何子網路或網路介面卡。\n你需要防止 VM1、VM2 的使用者透過 TCP 80 埠瀏覽網際網路上的網站。⟦你應該怎麼做？⟧",
 o:["把 NSG 從網路介面卡解除關聯","修改 Port_80 輸入安全性規則","把這個 NSG 關聯到 Subnet1","修改 DenyWebSites 輸出安全性規則"],
 a:[2],
 e:"NSG 裡該有的規則（封鎖對外 80 埠）其實已經設定好了，缺的只是「還沒有關聯到 VM1、VM2 所在的子網路或網路介面卡」，NSG 沒有生效範圍就不會有任何作用。只要把這個 NSG 關聯到 VM1、VM2 所在的 Subnet1，既有的 DenyWebSites 規則就會立刻生效，達成需求。修改規則內容或動輸入規則都是多餘的，因為規則本身已經是對的，問題出在「沒有關聯」。",
 en:{q:"You need to prevent users of VM1 and VM2 from accessing websites on the Internet over TCP port 80. What should you do?",
  o:["Disassociate the NSG from a network interface","Change the Port_80 inbound security rule.","Associate the NSG to Subnet1.","Change the DenyWebSites outbound security rule."],
  e:"The NSG already has the correct outbound deny rule; it just needs to be associated with Subnet1 to take effect."}},

{n:138, code:"AZ104-Q138", d:3, od:4, t:"跨訂用帳戶連接虛擬網路", tEn:"Connecting VNets across subscriptions", k:"mc",
 src:"quiz4:html",
 q:"你有兩個訂用帳戶 Subscription1、Subscription2，各自屬於不同的 Azure AD 租用戶。\nSubscription1 有一個虛擬網路 VNet1（位址空間 10.0.0.0/16），內含虛擬機器 VM1。\nSubscription2 有一個虛擬網路 VNet2（位址空間 10.10.0.0/24），內含虛擬機器 VM2。\n你需要把 VNet1 連到 VNet2。⟦你應該最先做什麼？⟧",
 o:["把 VM1 搬到 Subscription2","把 VNet1 搬到 Subscription2","修改 VNet2 的位址空間","佈建虛擬網路閘道"],
 a:[3],
 e:"兩個虛擬網路的位址空間（10.0.0.0/16 與 10.10.0.0/24）並不重疊，可以直接建立 VNet 對 VNet 連線，不需要搬移 VM 或虛擬網路、也不用改位址空間。VNet 對 VNet 連線的做法是在兩邊各自佈建一個虛擬網路閘道，兩個閘道之間建立類似站對站 VPN 的 IPsec 通道；不同訂用帳戶、甚至不同 Azure AD 租用戶都可以這樣連接，不是問題。",
 en:{q:"You need to connect VNet1 to VNet2. What should you do first?",
  o:["Move VM1 to Subscription2.","Move VNet1 to Subscription2.","Modify the IP address space of VNet2.","Provision virtual network gateways."],
  e:"Address spaces don't overlap, so a VNet-to-VNet connection works directly; provision a virtual network gateway on each side."}},

{n:139, code:"AZ104-Q139", d:2, od:3, t:"讓 VM 可以建立在可用性區域", tEn:"Enabling a VM to be created in an Availability Zone", k:"mc",
 src:"quiz4:html",
 q:"你打算建立一台虛擬機器 VM1，目前規劃的設定如圖例所示（磁碟設定為非受控磁碟；「高可用性」目前選的是「可用性設定組」，還沒有選任何可用性區域）。\n你需要確保 VM1 可以建立在某個可用性區域裡。⟦你應該修改哪兩項設定？⟧（每個正確答案各自是解法的一部分。）",
 o:["改用受控磁碟","作業系統磁碟類型","高可用性選項","大小","映像"],
 a:[0,2],
 e:"要把虛擬機器部署到指定的可用性區域，磁碟必須是受控磁碟（非受控磁碟不支援可用性區域，也無法用 Site Recovery 之類的機制搬進區域），所以要先把磁碟改成受控磁碟；接著在「設定 → 高可用性」裡，要把選項從「可用性設定組」改成「可用性區域」，並選擇一個實際的區域編號。作業系統磁碟類型、VM 大小、映像都跟能不能部署進可用性區域沒有直接關係。",
 en:{q:"Which two settings should you modify to ensure VM1 can be created in an Availability Zone?",
  o:["Use managed disks","OS disk type","Availability options","Size","Image"],
  e:"Managed disks are required for Availability Zones, and the Availability options must be switched from Availability Set to a specific Availability Zone."}},

{n:140, code:"AZ104-Q140", d:3, od:4, t:"網路介面卡必須跟既有 VNet 同地區同訂用帳戶", tEn:"A NIC needs an existing VNet in the same region/subscription", k:"mc",
 src:"quiz4:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的資源（來源網頁未保留完整表格截圖；依解析可知，只有 East US 這個地區在同一個訂用帳戶裡已經有一個既有的虛擬網路，West Europe 與 North Europe 沒有，或者那裡的虛擬網路屬於別的訂用帳戶）。\n你需要建立一張網路介面卡 NIC1。⟦NIC1 可以建立在哪個地點？⟧",
 o:["僅 East US 和 North Europe","僅 East US","East US、West Europe 和 North Europe","僅 East US 和 West Europe"],
 a:[1],
 e:"要建立網路介面卡，該地點必須已經有一個「同一個訂用帳戶」裡的既有虛擬網路可以掛接，網路介面卡不能憑空建立在沒有虛擬網路的地區。四個地區裡只有 East US 符合這個條件，所以 NIC1 只能建立在 East US。",
 en:{q:"In which location can you create NIC1?",
  o:["East US and North Europe only","East US only","East US, West Europe, and North Europe","East US and West Europe only"],
  e:"A network interface requires an existing virtual network in the same location and subscription; only East US qualifies."}},

{n:141, code:"AZ104-Q141", d:3, od:4, t:"私人 DNS 區域無法解析公用網域", tEn:"A private DNS zone can't resolve an unrelated public domain", k:"mc",
 src:"quiz4:html",
 q:"你有跑 Windows Server 2019 的 Azure 虛擬機器（如下表所示）。\n你建立了一個公用 Azure DNS 區域 adatum.com，以及一個私人 Azure DNS 區域 contoso.com；並替 contoso.com 建立了一條虛擬網路連結 link1（如圖例所示，連結到 VM1 所在的虛擬網路）。\n你發現 VM1 可以解析 contoso.com 裡的名稱，但沒辦法解析 adatum.com 裡的名稱；VM1 可以正常解析網際網路上其他主機的名稱。\n你需要確保 VM1 可以解析 adatum.com 裡的主機名稱。⟦你應該怎麼做？⟧",
 o:["把 VM1 的 DNS 尾碼更新成 adatum.com","在網域註冊業者那裡設定 adatum.com 的名稱伺服器","在 contoso.com 區域建立一筆 SRV 記錄","修改 link1 的存取控制 (IAM) 設定"],
 a:[1],
 e:"adatum.com 是「公用」DNS 區域，公用區域要能真的從網際網路解析得到，前提條件跟一般網域一樣：必須到網域註冊業者那裡，把 adatum.com 的名稱伺服器 (NS) 設定改成指向 Azure DNS 配發的名稱伺服器，否則就算 Azure 裡有這個區域，全世界（包含 VM1，因為 VM1 本身也是走一般網際網路 DNS 解析公用網域）都查不到它、只會問到別的（甚至沒有設定的）權威伺服器。私人區域 contoso.com 之所以能被 VM1 解析，靠的是虛擬網路連結，這個機制只適用私人區域，不能套用在公用區域上；修改 VM1 的 DNS 尾碼、在 contoso.com 建 SRV 記錄、改 link1 的 IAM，都無法讓 adatum.com 被正確委派解析。",
 en:{q:"You need to ensure that VM1 can resolve host names in adatum.com. What should you do?",
  o:["Update the DNS suffix on VM1 to be adatum.com","Configure the name servers for adatum.com at the domain registrar","Create an SRV record in the contoso.com zone","Modify the Access control (IAM) settings for link1"],
  e:"A public DNS zone only becomes resolvable once the registrar's NS records are updated to point to Azure DNS's name servers; VNet links only apply to private zones."}},

{n:142, code:"AZ104-Q142", d:3, od:4, t:"依 IP 位址建立後端集區的限制", tEn:"Restrictions on IP-address-based backend pools", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q143、Q144、Q151 情境完全相同，只是提出的解法不同。\n你有下表所示的虛擬機器 VM1、VM2。\n你部署了一個負載平衡器 LB1：類型內部、SKU 標準、虛擬網路 VNET1。\n你需要確保可以把 VM1 與 VM2 加進 LB1 的後端集區。\n⟦解法：建立一個 Basic SKU 的公用 IP 位址，關聯到 VM1 的網路介面卡，再啟動 VM1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。用 IP 位址方式加入標準負載平衡器的後端集區，有一項硬性限制：只支援標準 (Standard) SKU 的 IP 位址，不支援 Basic SKU；這裡用的是 Basic SKU 公用 IP，SKU 不符，不能加入。",
 en:{q:"Solution: Create a Basic SKU public IP, associate it to VM1's NIC, then start VM1. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. A backend pool configured by IP address only supports Standard SKU IP addresses, not Basic."}},

{n:143, code:"AZ104-Q143", d:3, od:4, t:"依 IP 位址建立後端集區的限制", tEn:"Restrictions on IP-address-based backend pools", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q142、Q144、Q151 情境完全相同，只是提出的解法不同。\n（情境同 Q142：要把 VM1、VM2 加進標準內部負載平衡器 LB1 的後端集區。）\n⟦解法：建立一個標準 (Standard) SKU 的公用 IP 位址，關聯到 VM1 的網路介面卡，再停止 VM2。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。只處理了 VM1 一台（而且用的是「公用」IP，跟 LB1 是「內部」負載平衡器的定位也對不上），VM2 更是直接被停止，兩台都沒有被正確、同時加入後端集區，達不到「VM1 與 VM2 都加進去」的需求。",
 en:{q:"Solution: Create a Standard SKU public IP, associate to VM1's NIC, then stop VM2. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. VM2 is stopped rather than added, and a public IP doesn't fit an internal load balancer scenario; neither VM ends up correctly in the pool."}},

{n:144, code:"AZ104-Q144", d:3, od:4, t:"依 IP 位址建立後端集區的限制", tEn:"Restrictions on IP-address-based backend pools", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q142、Q143、Q151 情境完全相同，只是提出的解法不同。\n（情境同 Q142：要把 VM1、VM2 加進標準內部負載平衡器 LB1 的後端集區。）\n⟦解法：建立兩個標準 SKU 的公用 IP 位址，把一個標準 SKU 公用 IP 分別關聯到每台虛擬機器的網路介面卡。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。依 IP 位址加入標準負載平衡器的後端集區，只要求 IP 位址本身是「標準」SKU，並沒有規定不能是公用 IP；VM1、VM2 各自關聯到一個標準 SKU 的 IP 位址後，兩台都符合條件，可以成功加進 LB1 的後端集區。",
 en:{q:"Solution: Create two Standard public IPs, associating one to each VM's NIC. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. IP-based backend pools just require Standard SKU IP addresses; both VMs now qualify."}},

{n:145, code:"AZ104-Q145", d:3, od:4, t:"點對站用戶端憑證", tEn:"Point-to-site client certificate", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 AZ104-Q120、Q121 是同一組情境的重複解法題。\n（情境同 Q121：Computer2 要能建立到 VNet1 的點對站 VPN 連線。）\n⟦解法：從 Computer1 匯出用戶端憑證，並安裝到 Computer2。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。每一台要連線的用戶端電腦都必須安裝從自我簽署根憑證衍生出來的用戶端憑證；把 Computer1 已經裝好的用戶端憑證匯出、安裝到 Computer2，Computer2 就具備通過驗證所需的憑證了。",
 en:{q:"Solution: You export the client certificate from Computer1 and install the certificate on Computer2. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Exporting and installing the client certificate gives Computer2 what it needs to authenticate."}},

{n:146, code:"AZ104-Q146", d:3, od:4, t:"NSG 優先順序阻擋 HTTPS", tEn:"NSG priority blocking HTTPS", k:"mc",
 src:"quiz4:html",
 q:"你有一台虛擬機器 VM1，它的網路介面卡設定了下列規則（如圖例所示）：Rule2（優先順序 500）拒絕 HTTPS（443）流量；Rule5（優先順序 2000）允許 HTTPS 流量，但因為優先順序數字比 Rule2 大（優先權較低），從來沒機會生效。\n你在 VM1 部署了一個 Web 伺服器，架設了一個透過 HTTPS 存取的安全網站，VM1 只作為 Web 伺服器使用。\n你需要確保使用者可以從網際網路連到這個網站。⟦你應該怎麼做？⟧",
 o:["修改 Rule4 的通訊協定","刪除 Rule1","把 Rule5 的動作改成允許、優先順序改成 401","建立一條新的輸入規則，允許 TCP 443，優先順序設為 501"],
 a:[2],
 e:"NSG 規則依優先順序數字「由小到大」比對，數字越小優先權越高，一旦比對到某條規則就停止處理。Rule2（優先順序 500、拒絕）會比 Rule5（優先順序 2000、允許）先被比對到，所以 HTTPS 流量目前都被 Rule2 擋下來。要讓允許規則生效，必須把 Rule5 的優先順序改成「比 500 更小」的數字（例如 401），這樣 Rule5 就會搶在 Rule2 之前被比對到，成功放行 HTTPS。新增一條優先順序 501 的規則沒有用，因為 501 還是比 500 大，Rule2 依然會先生效、繼續擋下流量。",
 en:{q:"You need to ensure that users can connect to the website from the Internet. What should you do?",
  o:["Modify the protocol of Rule4","Delete Rule1","For Rule5, change the Action to Allow and change the priority to 401","Create a new inbound rule that allows TCP protocol 443 and configure the rule to have a priority of 501."],
  e:"Rule2 (priority 500, deny) currently wins over Rule5 (priority 2000, allow); lowering Rule5's priority number below 500 makes it match first. A new rule at 501 still loses to Rule2."}},

{n:147, code:"AZ104-Q147", d:3, od:4, t:"負載平衡器健康探測被 NSG 擋住", tEn:"NSG blocking the load balancer's health probe", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q148、Q149、Q153、Q159 是同一組情境的重複解法題（來源網頁的有效網路安全性設定圖例沒有保留，依已知的官方正解與解析重建關鍵事實：VM2 的有效規則裡有一條名為 BlockAllOther443 的規則擋住了大部分 443 流量、也有一條名為 Allow_131.107.100.50 的規則但優先順序數字比 BlockAllOther443 大，還沒有任何規則允許來源標籤 AzureLoadBalancer 的流量）。\n你有一個應用程式 App1，安裝在兩台虛擬機器 VM1、VM2 上，連線透過一個 Azure 負載平衡器管理。\n你發現從 131.107.100.50 透過 TCP 443 連到 App1 會失敗，但已確認負載平衡器規則本身設定正確。\n你需要確保能從 131.107.100.50 透過 TCP 443 成功連到 App1。\n⟦解法：新增一條輸入安全性規則，拒絕來自 131.107.100.50 的所有流量，優先順序（cost）設為 64999。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。新增「拒絕」規則不會讓連線變得可行，只會多一條擋流量的規則；就算優先順序數字很大（64999，代表優先權很低，理論上不太會被優先比對到），也完全沒有解決「該來源目前連不上」的根本問題，因為問題本來就不是「缺一條拒絕規則」。",
 en:{q:"Solution: You create an inbound security rule that denies all traffic from 131.107.100.50 with priority 64999. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Adding another deny rule does nothing to fix a connectivity problem; the actual fix involves the allow rule's priority or the load balancer health probe."}},

{n:148, code:"AZ104-Q148", d:3, od:4, t:"負載平衡器健康探測被 NSG 擋住", tEn:"NSG blocking the load balancer's health probe", k:"mc",
 src:"quiz4:html",
