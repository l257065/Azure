 e:"答案：否。User2 雖然在原本的租用戶 contoso.onmicrosoft.com 裡是全域系統管理員，但 external.contoso.onmicrosoft.com 是另一個完全獨立的新租用戶，User2 在裡面沒有任何身分或角色。唯一自動成為新租用戶全域系統管理員的人，是實際執行「建立租用戶」動作的那個帳戶（也就是 User1）。User2 必須先被邀請並指派角色，才能在新租用戶裡建立使用者。",
 en:{q:"Note: This question is part of a series of questions that present the same scenario, each with a different solution.\nYou have an Azure subscription that contains the following users in an Azure Active Directory tenant named contoso.onmicrosoft.com:\n| Name | Role | Scope |\n|---|---|---|\n| User1 | Global administrator | Azure Active Directory |\n| User2 | Global administrator | Azure Active Directory |\n| User3 | User administrator | Azure Active Directory |\n| User4 | Owner | Azure Subscription |\nUser1 creates a new Azure Active Directory tenant named external.contoso.onmicrosoft.com.\nYou need to create new user accounts in external.contoso.onmicrosoft.com.\nSolution: You instruct User2 to create the user accounts.\nDoes that meet the goal?",
  o:["Yes","No"],
  e:"No. User2 is a Global administrator in the original tenant only. A brand-new tenant has its own separate directory; only the account that actually created the tenant (User1) automatically becomes its Global administrator. User2 has no role in the new tenant until explicitly granted one."}},

{n:2, code:"AZ104-Q2", d:1, od:1, t:"跨租用戶建立使用者", tEn:"Creating users across AAD tenants",
 src:"quiz1:html", k:"mc",
 q:"注意：本題與 Q1、Q3 情境完全相同，只是指示不同的人去做，請個別判斷。\n（使用者與角色表同 Q1：User1/User2 為原租用戶全域系統管理員、User3 為原租用戶使用者系統管理員、User4 為訂用帳戶擁有者。）\nUser1 建立了一個新的 Azure AD 租用戶 external.contoso.onmicrosoft.com。\n你需要在 external.contoso.onmicrosoft.com 中建立新的使用者帳戶。\n⟦解法：指示 User4 去建立這些使用者帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。User4 只是原本 Azure 訂用帳戶的擁有者（Owner），這是 Azure RBAC（資源管理）角色，跟 Azure AD 的身分管理權限完全是兩回事，訂用帳戶擁有者不能在任何 Azure AD 租用戶（不論新舊）建立使用者。只有該租用戶自己的全域系統管理員才能建立使用者，而 User4 在新租用戶裡什麼身分都沒有。",
 en:{q:"Note: same scenario as Q1/Q2, different instructed user.\nUser1 creates a new tenant external.contoso.onmicrosoft.com. You need to create new user accounts there.\nSolution: You instruct User4 to create the user accounts.\nDoes that meet the goal?",
  o:["Yes","No"],
  e:"No. Only a global administrator can add users to this tenant. User4 is merely a subscription Owner (an Azure RBAC role), which grants no Azure AD identity-management rights in any tenant, let alone the newly created one."}},

{n:3, code:"AZ104-Q3", d:1, od:1, t:"跨租用戶建立使用者", tEn:"Creating users across AAD tenants",
 src:"quiz1:html", k:"mc",
 q:"注意：本題與 Q1、Q2 情境完全相同，只是指示不同的人去做，請個別判斷。\n（使用者與角色表同 Q1。）\nUser1 建立了一個新的 Azure AD 租用戶 external.contoso.onmicrosoft.com。\n你需要在 external.contoso.onmicrosoft.com 中建立新的使用者帳戶。\n⟦解法：指示 User3 去建立這些使用者帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。User3 在原本的租用戶 contoso.onmicrosoft.com 裡是使用者系統管理員（User administrator），這個角色的管理範圍只限於「原本這個租用戶」，對 external.contoso.onmicrosoft.com 這個全新獨立的租用戶沒有任何權限。只有全域系統管理員可以在租用戶內建立使用者，且必須是新租用戶自己的系統管理員身分。",
 en:{q:"Note: same scenario as Q1/Q2, different instructed user.\nSolution: You instruct User3 to create the user accounts.\nDoes that meet the goal?",
  o:["Yes","No"],
  e:"No. User3 is a User administrator scoped to the original tenant only; that role has no authority in the brand-new, separate tenant. Only that tenant's own global administrator can create users in it."}},

{n:4, code:"AZ104-Q4", d:1, od:1, t:"AKS 整合 Azure AD", tEn:"AKS Azure AD integration",
 src:"quiz1:html", k:"mc",
 q:"你的 Azure 訂用帳戶連結到一個名為 contoso.com 的 Azure Active Directory (Azure AD) 租用戶，並有一個名為 AKS1 的 Azure Kubernetes Service (AKS) 叢集。\n一位系統管理員回報，她無法把 AKS1 的存取權授予 contoso.com 裡的使用者。你需要確保可以把 AKS1 的存取權授予 contoso.com 的使用者。⟦你應該最先做什麼？⟧",
 o:["在 contoso.com 修改「組織關聯性 (Organization relationships)」設定","在 contoso.com 建立 OAuth 2.0 授權端點","重新建立 AKS1","在 AKS1 建立一個命名空間 (namespace)"],
 a:[1],
 e:"AKS 叢集預設只認識 Kubernetes 自己的本機帳戶。要讓 Azure AD 使用者能登入並取得授權，必須先讓叢集整合 Azure AD 驗證——做法是在 Azure AD 為叢集建立 OAuth 2.0 的伺服器與用戶端應用程式（授權端點），叢集才能透過 OpenID Connect 驗證 contoso.com 使用者的身分，之後才能對這些使用者做 Kubernetes RBAC 授權。\n・「組織關聯性」設定是用在兩個不同 Azure AD 租用戶之間的合作，跟 AKS 存取無關。\n・重建叢集或建立命名空間都不會讓 AKS 認得 Azure AD 身分。",
 en:{q:"You have an Azure subscription that contains an Azure Active Directory (Azure AD) tenant named contoso.com and an Azure Kubernetes Service (AKS) cluster named AKS1.\nAn administrator reports that she is unable to grant access to AKS1 to the users in contoso.com. You need to ensure that access to AKS1 can be granted to the contoso.com users. What should you do first?",
  o:["From contoso.com, modify the Organization relationships settings.","From contoso.com, create an OAuth 2.0 authorization endpoint.","Recreate AKS1.","From AKS1, create a namespace."],
  e:"An AKS cluster only understands its own local Kubernetes accounts by default. To let Azure AD users authenticate, you must first integrate the cluster with Azure AD by creating OAuth 2.0 server and client applications (authorization endpoints), enabling OpenID Connect authentication before Kubernetes RBAC can be granted."}},

{n:5, code:"AZ104-Q5", d:1, od:1, t:"群組到期原則", tEn:"Group expiration policy", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Microsoft 365 租用戶，以及一個名為 contoso.com 的 Azure Active Directory (Azure AD) 租用戶。\n你打算讓三位使用者 User1、User2、User3 存取一個暫時性的 Microsoft SharePoint 文件庫 Library1。\n你需要替這些使用者建立群組，⟦解決方案必須確保這些群組會在 180 天後自動刪除⟧。你應該建立哪兩種群組？（每個正確答案各自是完整的解法。）",
 o:["採用「指派 (Assigned)」成員資格類型的 Microsoft 365 群組","採用「指派 (Assigned)」成員資格類型的安全性群組","採用「動態使用者 (Dynamic User)」成員資格類型的 Microsoft 365 群組","採用「動態使用者 (Dynamic User)」成員資格類型的安全性群組","採用「動態裝置 (Dynamic Device)」成員資格類型的安全性群組"],
 a:[0,2],
 e:"群組到期原則（expiration policy）只能套用在 Microsoft 365 群組（即 Office 365 群組）上，安全性群組不支援自動到期刪除，群組到期後其信箱、Planner、SharePoint 站台等關聯服務會一併刪除。成員資格類型（指派或動態）不影響能不能設到期原則，所以「指派」與「動態使用者」的 Microsoft 365 群組都符合需求；三個安全性群組選項都不符合。",
 en:{q:"You have a Microsoft 365 tenant and an Azure Active Directory (Azure AD) tenant named contoso.com.\nYou plan to grant three users named User1, User2, and User3 access to a temporary Microsoft SharePoint document library named Library1.\nYou need to create groups for the users. The solution must ensure that the groups are deleted automatically after 180 days. Which two groups should you create? Each correct answer presents a complete solution.",
  o:["a Microsoft 365 group that uses the Assigned membership type","a Security group that uses the Assigned membership type","a Microsoft 365 group that uses the Dynamic User membership type","a Security group that uses the Dynamic User membership type","a Security group that uses the Dynamic Device membership type"],
  e:"Expiration policy can only be set for Microsoft 365 (Office 365) groups, not security groups, regardless of membership type (Assigned or Dynamic)."}},

{n:6, code:"AZ104-Q6", d:1, od:1, t:"Azure Policy 效果", tEn:"Azure Policy effect", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 原則 (Policy)，如下方圖例所示。（來源網頁沒有保留這張截圖，只能依解析文字判斷：這是一條套用在 Subscription 1、針對「建立 Azure SQL 伺服器」的拒絕型原則，並排除了 ContosoRG1 這個資源群組。）⟦這個原則的效果是什麼？⟧",
 o:["你在 Subscription 1 裡任何地方都不能建立 Azure SQL 伺服器。","你只能在 ContosoRG1 建立 Azure SQL 伺服器。","你不能在 ContosoRG1 建立 Azure SQL 伺服器。","你可以在 Subscription 1 裡任何資源群組建立 Azure SQL 伺服器。"],
 a:[1],
 e:"這條原則的效果是：除了 ContosoRG1 這個資源群組被明確排除在外，Subscription 1 裡其他所有地方都禁止建立 Azure SQL 伺服器；換句話說，唯一還能建立 Azure SQL 伺服器的地方就是 ContosoRG1。",
 en:{q:"You have an Azure policy as shown in the following exhibit. What is the effect of the policy?",
  o:["You are prevented from creating Azure SQL servers anywhere in Subscription 1.","You can create Azure SQL servers in ContosoRG1 only.","You are prevented from creating Azure SQL Servers in ContosoRG1 only.","You can create Azure SQL servers in any resource group within Subscription 1."],
  e:"You are prevented from creating Azure SQL servers anywhere in Subscription 1 with the exception of ContosoRG1."}},

{n:7, code:"AZ104-Q7", d:1, od:1, t:"跨訂用帳戶搬移資源", tEn:"Moving resources across subscriptions", k:"mc",
 src:"quiz1:html",
 q:"你有一個名為 AZPT1 的 Azure 訂用帳戶，內含下表所示的資源（VM1 虛擬機器、storage1 儲存體帳戶、VNET1 虛擬網路、VM1Managed 受控磁碟、RVAULT1 Recovery Services 保存庫，且 VM1 有使用到 storage1／VNET1／VM1Managed／RVAULT1）。\n你建立了一個新的 Azure 訂用帳戶 AZPT2。\n你需要判斷哪些資源可以搬到 AZPT2。⟦應該辨識出哪些資源？⟧",
 o:["僅 VM1、storage1、VNET1 和 VM1Managed","僅 VM1 和 VM1Managed","VM1、storage1、VNET1、VM1Managed 和 RVAULT1","僅 RVAULT1"],
 a:[2],
 e:"透過 Azure 入口網站可以把一台 VM 連同它相依的資源（儲存體帳戶、虛擬網路、受控磁碟等）一起搬到另一個訂用帳戶；Recovery Services 保存庫（RVAULT1）現在也支援搬到新的資源群組或新的訂用帳戶。所以列出的五項資源全部都可以搬遷，沒有排除項目。",
 en:{q:"You have an Azure subscription named AZPT1 that contains the resources shown in the following table.\nYou create a new Azure subscription named AZPT2.\nYou need to identify which resources can be moved to AZPT2. Which resources should you identify?",
  o:["VM1, storage1, VNET1, and VM1Managed only","VM1 and VM1Managed only","VM1, storage1, VNET1, VM1Managed, and RVAULT1","RVAULT1 only"],
  e:"You can move a VM and its associated resources to a different subscription via the Azure portal. Azure Recovery Services vaults can also now be moved to a new resource group or subscription, so all five listed resources are movable."}},

{n:8, code:"AZ104-Q8", d:1, od:1, t:"市集項目授權條款", tEn:"Marketplace legal terms", k:"mc",
 src:"quiz1:html",
 q:"你最近建立了一個新的 Azure 訂用帳戶，裡面有一位使用者 Admin1。\nAdmin1 嘗試用 Azure Resource Manager 範本部署一項 Azure Marketplace 資源。Admin1 用 Azure PowerShell 部署範本時收到錯誤訊息：「User failed validation to purchase resources.……Legal terms have not been accepted for this item on this subscription.」\n⟦你需要確保 Admin1 能成功部署這項市集資源，應該怎麼做？⟧",
 o:["用 Azure PowerShell 執行 Set-AzApiManagementSubscription 指令程式","在 Azure 入口網站註冊 Microsoft.Marketplace 資源提供者","用 Azure PowerShell 執行 Set-AzMarketplaceTerms 指令程式","在 Azure 入口網站把「帳單系統管理員」角色指派給 Admin1"],
 a:[2],
 e:"錯誤訊息明確指出是「尚未接受這項市集資源的法律條款」，要透過程式化部署接受條款，正確做法是用 Azure PowerShell 的 Set-AzMarketplaceTerms 指令程式先接受該市集項目的授權條款，之後範本部署才不會再被擋下。",
 en:{q:"You recently created a new Azure subscription that contains a user named Admin1. Admin1 attempts to deploy an Azure Marketplace resource by using an ARM template via Azure PowerShell and receives a \"Legal terms have not been accepted\" error. You need to ensure that Admin1 can deploy the Marketplace resource successfully. What should you do?",
  o:["From Azure PowerShell, run the Set-AzApiManagementSubscription cmdlet","From the Azure portal, register the Microsoft.Marketplace resource provider","From Azure PowerShell, run the Set-AzMarketplaceTerms cmdlet","From the Azure portal, assign the Billing administrator role to Admin1"],
  e:"The error is specifically about unaccepted legal terms for programmatic deployment; Set-AzMarketplaceTerms accepts those terms so the template deployment can proceed."}},

{n:9, code:"AZ104-Q9", d:1, od:1, t:"指派系統管理員角色", tEn:"Assigning an admin role", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure Active Directory (Azure AD) 租用戶，內有 5,000 個使用者帳戶。\n你建立了一個新的使用者帳戶 AdminUser1。\n你需要把「使用者管理員」這個系統管理角色指派給 AdminUser1。⟦你應該在使用者帳戶的內容頁裡設定什麼？⟧",
 o:["在「授權」刀鋒選單指派一個新授權","在「目錄角色」刀鋒選單修改目錄角色","在「群組」刀鋒選單邀請這個帳戶加入新群組"],
 a:[1],
 e:"要指派系統管理角色（例如使用者管理員），做法是打開該使用者的內容頁，進入「目錄角色（Directory role）」刀鋒選單，新增角色並選擇要指派的系統管理角色。授權（License）刀鋒選單是用來分配產品授權，跟角色指派無關；群組刀鋒選單是管理群組成員資格，也不是指派系統管理角色的地方。",
 en:{q:"You have an Azure Active Directory (Azure AD) tenant that contains 5,000 user accounts. You create a new user account named AdminUser1. You need to assign the User administrator administrative role to AdminUser1. What should you do from the user account properties?",
  o:["From the Licenses blade, assign a new license","From the Directory role blade, modify the directory role","From the Groups blade, invite the user account to a new group"],
  e:"Open the user's Directory role blade and assign the appropriate admin role there; Licenses and Groups blades serve different purposes."}},

{n:10, code:"AZ104-Q10", d:1, od:1, t:"指派 Azure AD Premium 授權", tEn:"Assigning Azure AD Premium licenses", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure Active Directory (Azure AD) 租用戶 contoso.onmicrosoft.com，內有 100 個使用者帳戶。\n你替這個租用戶購買了 10 個 Azure AD Premium P2 授權。\n你需要確保有 10 位使用者可以使用全部的 Azure AD Premium 功能。⟦你應該怎麼做？⟧",
 o:["在 Azure AD 的「授權」刀鋒選單指派授權","在每位使用者的「群組」刀鋒選單邀請他們加入群組","在 Azure AD 網域新增一個企業應用程式","在每位使用者的「目錄角色」刀鋒選單修改目錄角色"],
 a:[0],
 e:"要讓特定使用者用到已購買的 Premium 授權功能，必須明確把授權指派給那些使用者，做法是到 Azure AD 的「授權（Licenses）」刀鋒選單，把 P2 授權指派給指定的 10 位使用者（也可以用群組授權指派，但選項裡沒有那個做法）。加入群組、新增企業應用程式或修改目錄角色都不會讓使用者取得 Premium 功能。",
 en:{q:"You have an Azure AD tenant named contoso.onmicrosoft.com that contains 100 user accounts. You purchase 10 Azure AD Premium P2 licenses for the tenant. You need to ensure that 10 users can use all the Azure AD Premium features. What should you do?",
  o:["From the Licenses blade of Azure AD, assign a license","From the Groups blade of each user, invite the users to a group","From the Azure AD domain, add an enterprise application","From the Directory role blade of each user, modify the directory role"],
  e:"Licenses must be explicitly assigned to users (or a group) from the Licenses blade before those users gain access to the premium features."}},

{n:11, code:"AZ104-Q11", d:1, od:1, t:"ITSM 連接器", tEn:"IT Service Management Connector", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，以及一套內部部署的 Microsoft System Center Service Manager。\nSubscription1 裡有一台虛擬機器 VM1。\n你需要確保當 VM1 的可用記憶體低於 10% 時，Service Manager 會收到警示。⟦你應該最先做什麼？⟧",
 o:["建立一個自動化 Runbook","部署一個函式應用程式 (function app)","部署 IT Service Management Connector (ITSM)","建立一個通知"],
 a:[2],
 e:"IT Service Management Connector（ITSMC）是專門用來把 Azure 監控警示（度量警示、活動記錄警示、Log Analytics 警示）串接到外部 ITSM 系統（例如 System Center Service Manager）的元件，會在 ITSM 工具裡自動建立工作項目。要讓地端的 Service Manager 收到 Azure 產生的警示，第一步就是部署並設定 ITSMC。Runbook、函式應用程式、通知都不能把警示送進 Service Manager 這種外部 ITSM 系統。",
 en:{q:"You have an Azure subscription named Subscription1 and an on-premises deployment of Microsoft System Center Service Manager. Subscription1 contains a VM named VM1. You need to ensure that an alert is set in Service Manager when available memory on VM1 is below 10%. What should you do first?",
  o:["Create an automation runbook","Deploy a function app","Deploy the IT Service Management Connector (ITSM)","Create a notification"],
  e:"ITSMC connects Azure alerts to a supported ITSM product/service, automatically creating work items in the ITSM tool based on Azure alerts."}},

{n:12, code:"AZ104-Q12", d:1, od:1, t:"Azure AD 加入裝置的本機管理員", tEn:"Local admins on Azure AD joined devices", k:"mc",
 src:"quiz1:html",
 q:"你已經訂閱了 Azure Active Directory (Azure AD) Premium。\n你需要把使用者 admin1@contoso.com 加進所有將加入 Azure AD 網域的電腦的（本機）系統管理員。⟦你應該在 Azure AD 設定什麼？⟧",
 o:["「裝置」刀鋒選單的裝置設定","「MFA 伺服器」刀鋒選單的提供者","「使用者」刀鋒選單的使用者設定","「群組」刀鋒選單的一般設定"],
 a:[0],
 e:"當裝置以 Azure AD 加入方式連接時，Azure AD 會把全域系統管理員角色、裝置系統管理員角色，以及執行加入動作的使用者，自動加進裝置的本機系統管理員群組。要額外指定其他人（如 admin1@contoso.com）也自動成為所有 Azure AD 加入裝置的本機系統管理員，要到「裝置（Devices）」刀鋒選單的「裝置設定（Device settings）」裡設定「Additional local administrators on Azure AD joined devices」。",
 en:{q:"You sign up for Azure AD Premium. You need to add a user named admin1@contoso.com as an administrator on all the computers that will be joined to the Azure AD domain. What should you configure in Azure AD?",
  o:["Device settings from the Devices blade","Providers from the MFA Server blade","User settings from the Users blade","General settings from the Groups blade"],
  e:"Configure \"Additional local administrators on Azure AD joined devices\" under Device settings on the Devices blade."}},

{n:13, code:"AZ104-Q13", d:1, od:1, t:"刪除有備份的資源群組", tEn:"Deleting a resource group with backups", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶，內含一個名為 RG26 的資源群組。\nRG26 位於 West Europe，用來建立某個專案的臨時資源，內含下表所示的資源（其中 SQLDB01 這個 Azure SQL 資料庫已設定備份到 RGV1 這個 Recovery Services 保存庫）。\n專案結束後，你嘗試從 Azure 入口網站刪除 RG26，但刪除失敗。你需要成功刪除 RG26。⟦你應該最先做什麼？⟧",
 o:["刪除 VM1","停止 VM1","停止 SQLDB01 的備份","刪除 sa001"],
 a:[2],
 e:"資源群組刪除失敗最常見的原因，是群組裡有資源被「Recovery Services 保存庫的備份」鎖住——只要有作用中的備份設定，就無法直接刪除該資源（進而擋下整個資源群組的刪除）。所以要先停止 SQLDB01 的備份（並視需要刪除備份資料），才能繼續刪除 RG26。單純刪除或停止 VM1、刪除儲存體帳戶 sa001 都不會解除備份造成的鎖定。",
 en:{q:"You have an Azure subscription that contains a resource group named RG26. RG26 is used to create temporary resources for a project. SQLDB01 is backed up to RGV1. When the project is complete, you attempt to delete RG26 from the Azure portal. The deletion fails. You need to delete RG26. What should you do first?",
  o:["Delete VM1","Stop VM1","Stop the backup of SQLDB01","Delete sa001"],
  e:"An active Recovery Services backup on a resource blocks deletion of both the resource and the resource group; the backup must be stopped (and its data removed) first."}},

{n:14, code:"AZ104-Q14", d:1, od:1, t:"委派 Reader 角色指派權", tEn:"Delegating Reader role assignment", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含一個虛擬網路 VNet1，VNet1 位於資源群組 RG1。\nSubscription1 裡有一位使用者 User1，擁有以下角色：讀取者 (Reader)、安全性系統管理員 (Security Admin)、安全性讀取者 (Security Reader)。\n你需要確保 User1 可以把 VNet1 的讀取者角色指派給其他使用者。⟦你應該怎麼做？⟧",
 o:["把 User1 從 Subscription1 的安全性讀取者角色移除","替 User1 指派 VNet1 的「使用者存取系統管理員 (User Access Administrator)」角色","替 User1 指派 VNet1 的「網路參與者 (Network Contributor)」角色","替 User1 指派 RG1 的「網路參與者 (Network Contributor)」角色"],
 a:[1],
 e:"要把某個角色「指派給別人」，一定要有 Microsoft.Authorization/roleAssignments/write 這項權限，讀取者、安全性系統管理員、安全性讀取者、網路參與者都沒有這項權限。「使用者存取系統管理員」角色就是專門用來管理「誰能存取某個範圍」，把它指派在 VNet1 這個範圍給 User1，User1 就能把讀取者角色指派給其他人存取 VNet1，而且只在 VNet1 這個範圍生效，符合最小權限。",
 en:{q:"You have an Azure subscription named Subscription1 that contains a virtual network named VNet1 in resource group RG1. User1 has the Reader, Security Admin, and Security Reader roles. You need to ensure that User1 can assign the Reader role for VNet1 to other users. What should you do?",
  o:["Remove User1 from the Security Reader role for Subscription1.","Assign User1 the User Access Administrator role for VNet1.","Assign User1 the Network Contributor role for VNet1.","Assign User1 the Network Contributor role for RG1."],
  e:"Assigning roles to others requires Microsoft.Authorization/roleAssignments/write, which only User Access Administrator (or Owner) grants. Scoping it to VNet1 keeps it least-privilege."}},

{n:15, code:"AZ104-Q15", d:1, od:1, t:"自訂網域驗證記錄", tEn:"Custom domain verification record", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure Active Directory (Azure AD) 租用戶 contosocloud.onmicrosoft.com。\n你的公司有一個公用 DNS 區域 contoso.com。\n你把 contoso.com 新增為 Azure AD 的自訂網域名稱。\n你需要確保 Azure 能夠驗證這個網域名稱。⟦你應該建立哪一種 DNS 記錄？⟧",
 o:["MX","NSEC","PTR","RRSIG"],
 a:[0],
 e:"Azure AD 驗證自訂網域時，接受 TXT 或 MX 兩種記錄類型（選項裡只有 MX 是這兩者之一）。做法是在網域的公用 DNS 區域新增一筆 Azure AD 指定內容的 MX（或 TXT）記錄，Azure AD 檢查到該記錄存在，就會判定你確實擁有這個網域，完成驗證。NSEC、PTR、RRSIG 都不是驗證用的記錄類型（NSEC／RRSIG 是 DNSSEC 相關記錄，PTR 是反解記錄）。",
 en:{q:"You have an Azure AD tenant named contosocloud.onmicrosoft.com. Your company has a public DNS zone for contoso.com. You add contoso.com as a custom domain name to Azure AD. You need to ensure that Azure can verify the domain name. Which type of DNS record should you create?",
  o:["MX","NSEC","PTR","RRSIG"],
  e:"Azure AD custom domain verification accepts either a TXT or an MX record; MX is the only matching option here."}},

{n:16, code:"AZ104-Q16", d:1, od:1, t:"建立邏輯應用程式的權限", tEn:"Permission to create logic apps", k:"mc",
 src:"quiz1:html",
 q:"注意：本題與 Q17、Q18 情境完全相同，只是提出的解法不同，請個別判斷。\n你有一個 Azure AD 租用戶 Adatum 與一個 Azure 訂用帳戶 Subscription1。Adatum 中有一個群組 Developers，Subscription1 中有一個資源群組 Dev。\n你需要讓 Developers 群組能在 Dev 資源群組中建立 Azure 邏輯應用程式 (Logic Apps)。\n⟦解法：在 Subscription1 層級，把「DevTest Labs User」角色指派給 Developers 群組。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「DevTest Labs User」角色只能連線、啟動、重新啟動、關閉 Azure DevTest Labs 裡的虛擬機器，跟建立邏輯應用程式完全無關。要讓群組能建立並管理邏輯應用程式，需要的是「邏輯應用程式參與者 (Logic App Contributor)」角色。",
 en:{q:"Note: same scenario as Q17/Q18, different solution.\nYou need the Developers group to create Azure logic apps in the Dev resource group.\nSolution: On Subscription1, you assign the DevTest Labs User role to the Developers group.\nDoes this meet the goal?",
  o:["Yes","No"],
  e:"No. DevTest Labs User only lets you connect/start/restart/shut down VMs in DevTest Labs. Logic App Contributor is what's actually required."}},

{n:17, code:"AZ104-Q17", d:1, od:1, t:"建立邏輯應用程式的權限", tEn:"Permission to create logic apps", k:"mc",
 src:"quiz1:html",
 q:"注意：本題與 Q16、Q18 情境完全相同，只是提出的解法不同。\n（情境同 Q16：Developers 群組要能在 Dev 資源群組建立邏輯應用程式。）\n⟦解法：在 Subscription1 層級，把「Logic App Operator」角色指派給 Developers 群組。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「Logic App Operator」角色只能檢視、啟用／停用既有的邏輯應用程式並觸發執行，不能「建立」新的邏輯應用程式。要能建立邏輯應用程式，必須是「Logic App Contributor」角色。",
 en:{q:"Solution: On Subscription1, you assign the Logic App Operator role to the Developers group. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. You would need the Logic App Contributor role; Operator can only view/enable/trigger existing logic apps, not create new ones."}},

{n:18, code:"AZ104-Q18", d:1, od:1, t:"建立邏輯應用程式的權限", tEn:"Permission to create logic apps", k:"mc",
 src:"quiz1:html",
 q:"注意：本題與 Q16、Q17 情境完全相同，只是提出的解法不同。\n（情境同 Q16：Developers 群組要能在 Dev 資源群組建立邏輯應用程式。）\n⟦解法：在 Dev 資源群組層級，把「參與者 (Contributor)」角色指派給 Developers 群組。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。「參與者」角色可以在指定範圍內管理（含新增）幾乎所有類型的資源，範圍設在 Dev 資源群組正好符合「只在 Dev 資源群組建立邏輯應用程式」的需求，能達成目標（雖然權限比只給 Logic App Contributor 更寬，但題目沒有要求最小權限）。",
 en:{q:"Solution: On Dev, you assign the Contributor role to the Developers group. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Contributor can manage (and add) virtually all resource types within its scope, so scoping it to the Dev resource group satisfies the requirement."}},

{n:19, code:"AZ104-Q19", d:1, od:1, t:"Log Analytics 查詢語法", tEn:"Log Analytics query syntax", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含一個 Azure Log Analytics 工作區 Workspace1。\n你需要從一個名為 Event 的資料表中，查出錯誤事件。⟦你應該在 Workspace1 執行哪個查詢？⟧",
 o:["Get-Event Event | where {$_.EventType == \"error\"}","search in (Event) \"error\"","select * from Event where EventType == \"error\"","Get-Event Event | where {$_.EventTye –eq \"error\"}"],
 a:[1],
 e:"Log Analytics 用的是 Kusto 查詢語言（KQL），search 運算子可以跨資料表／欄位搜尋字串，語法是 search in (資料表) \"關鍵字\" 或 資料表 | search \"關鍵字\"。選項裡只有 search in (Event) \"error\" 是合法的 KQL 語法；Get-Event 是 PowerShell 語法、select * from 是 SQL 語法，都不是 Workspace1 查詢視窗接受的語言。",
 en:{q:"You need to view the error event from a table named Event. Which query should you run in Workspace1?",
  o:["Get-Event Event | where {$_.EventType == \"error\"}","search in (Event) \"error\"","select * from Event where EventType == \"error\"","Get-Event Event | where {$_.EventTye –eq \"error\"}"],
  e:"Log Analytics uses KQL; `search in (Event) \"error\"` is valid KQL syntax, unlike the PowerShell- or SQL-styled distractors."}},

{n:20, code:"AZ104-Q20", d:1, od:1, t:"搬移 Web App 到另一個資源群組", tEn:"Moving a web app to another resource group", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含下表所示的資源群組（RG1 位於 West Europe，套用 Policy1；RG2 位於 North Europe，套用 Policy2）。\nRG1 有一個 Web 應用程式 WebApp1，位於 West Europe。\n你把 WebApp1 搬到 RG2。⟦這個搬移動作會有什麼效果？⟧",
 o:["WebApp1 的 App Service 方案仍留在 West Europe，Policy2 套用到 WebApp1。","WebApp1 的 App Service 方案搬到 North Europe，Policy2 套用到 WebApp1。","WebApp1 的 App Service 方案仍留在 West Europe，Policy1 套用到 WebApp1。","WebApp1 的 App Service 方案搬到 North Europe，Policy1 套用到 WebApp1。"],
 a:[0],
 e:"應用程式實際執行的地區，取決於它所在的 App Service 方案的地區，而 App Service 方案的地區是無法變更的；搬移資源群組不會連帶搬動方案的地區，所以 WebApp1 的執行地區仍然是 West Europe。至於 Azure Policy，套用與否是看資源目前所在的資源群組範圍，搬到 RG2 之後就改成套用 RG2 的 Policy2，不再受 RG1 的 Policy1 管轄。",
 en:{q:"You move WebApp1 to RG2. What is the effect of the move?",
  o:["The App Service plan for WebApp1 remains in West Europe. Policy2 applies to WebApp1.","The App Service plan for WebApp1 moves to North Europe. Policy2 applies to WebApp1.","The App Service plan for WebApp1 remains in West Europe. Policy1 applies to WebApp1.","The App Service plan for WebApp1 moves to North Europe. Policy1 applies to WebApp1."],
  e:"An app's region is that of its App Service plan, which cannot change region even when the app moves resource groups. Policy applicability follows the current resource group, so Policy2 (RG2's policy) now applies."}},

{n:21, code:"AZ104-Q21", d:3, od:4, t:"分散連線到多台 VM", tEn:"Spreading connections across VMs", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶。使用者從家裡或客戶端點存取訂用帳戶裡的資源：從家裡必須先建立點對站 (P2S) VPN 才能存取 Azure 資源；客戶端點的使用者則是透過站對站 (S2S) VPN 存取。\n你有一個名為 App1 的業務應用程式，跑在好幾台執行 Windows Server 2016 的 Azure 虛擬機器上。\n你需要確保連到 App1 的連線會平均分散到所有虛擬機器上。⟦有哪兩種可能的 Azure 服務可以使用？⟧（每個正確答案各自是完整的解法。）",
 o:["內部負載平衡器 (internal load balancer)","公用負載平衡器 (public load balancer)","Azure 內容傳遞網路 (CDN)","Traffic Manager","Azure 應用程式閘道 (Application Gateway)"],
 a:[0,4],
 e:"不論是透過 P2S 或 S2S VPN 進來的流量，最終都是從虛擬網路內部連到 App1，所以要用能放在虛擬網路前端子網路、處理內部流量分流的服務：內部負載平衡器（第 4 層）與應用程式閘道（第 7 層，還能做 SSL 卸載、路徑導向）都適合。公用負載平衡器面向的是公開網際網路流量，不是 VPN 進來的內部流量；CDN 是加速靜態內容的邊緣快取服務；Traffic Manager 是 DNS 層級的跨地區流量導向，都不是用來分散單一虛擬網路內對多台 VM 的連線。",
 en:{q:"You need to ensure that the connections to App1 are spread across all the virtual machines. What are two possible Azure services that you can use?",
  o:["an internal load balancer","a public load balancer","an Azure Content Delivery Network (CDN)","Traffic Manager","an Azure Application Gateway"],
  e:"Traffic arriving via VPN gateways is internal to the virtual network, so it needs an internal-facing distribution service: an internal load balancer or an Application Gateway, both placed in the front-end subnet."}},

{n:22, code:"AZ104-Q22", d:1, od:1, t:"識別低使用率 VM", tEn:"Identifying underutilized VMs", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶，內含 100 台 Azure 虛擬機器。\n你需要快速找出使用率偏低、可以換成更便宜方案的虛擬機器。⟦你應該用哪一個刀鋒選單？⟧",
 o:["Monitor","Advisor","Metrics","Customer insights"],
 a:[1],
 e:"Azure Advisor 會分析你目前部署的資源設定與使用情形，主動找出可以省錢的建議（例如閒置或使用率偏低的虛擬機器可以降級或關閉），這些建議集中在 Advisor 儀表板的「成本」分頁。Monitor／Metrics 是查看度量數據的工具，不會主動給出成本優化建議；Customer insights 是客戶資料分析服務，與此無關。",
 en:{q:"You need to quickly identify underutilized virtual machines that can have their service tier changed to a less expensive offering. Which blade should you use?",
  o:["Monitor","Advisor","Metrics","Customer insights"],
  e:"Azure Advisor identifies idle and underutilized resources and surfaces cost recommendations on its Cost tab."}},

{n:23, code:"AZ104-Q23", d:1, od:1, t:"邀請外部合作夥伴", tEn:"Inviting an external partner", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure Active Directory (Azure AD) 租用戶 contoso.onmicrosoft.com。\n使用者管理員 (User administrator) 角色指派給了一位使用者 Admin1。\n某個外部合作夥伴有一個 Microsoft 帳戶，登入名稱為 user1@outlook.com。\nAdmin1 嘗試邀請這位外部合作夥伴登入 Azure AD 租用戶，收到錯誤訊息「Unable to invite user user1@outlook.com – Generic authorization exception.」\n你需要確保 Admin1 可以邀請這位外部合作夥伴登入這個 Azure AD 租用戶。⟦你應該怎麼做？⟧",
 o:["在「使用者」設定刀鋒選單修改「外部共同作業設定 (External collaboration settings)」","在「自訂網域名稱」刀鋒選單新增一個自訂網域","在「組織關聯性」刀鋒選單新增一個身分識別提供者","在「角色與系統管理員」刀鋒選單把「安全性系統管理員」角色指派給 Admin1"],
 a:[0],
 e:"這個錯誤通常是租用戶的「外部共同作業設定（External collaboration settings，屬於 Azure AD B2B 來賓邀請的限制設定）」把可以發出邀請的人員範圍限制住了，導致 Admin1（只是使用者管理員，不是全域系統管理員）無法邀請來賓。要解決，需要調整這項設定放寬邀請權限，而不是新增網域、身分識別提供者，或改指派其他跟外部邀請無直接相關的角色。",
 en:{q:"Admin1 attempts to invite the external partner and receives \"Generic authorization exception.\" You need to ensure that Admin1 can invite the external partner to sign in to the Azure AD tenant. What should you do?",
  o:["From the Users setting blade, modify the External collaboration settings.","From the Custom domain names blade, add a custom domain.","From the Organizational relationships blade, add an identity provider.","From the Roles and administrators blade, assign the Security administrator role to Admin1."],
  e:"The tenant's External collaboration settings control who is allowed to invite B2B guest users; that's the setting to adjust."}},

{n:24, code:"AZ104-Q24", d:1, od:1, t:"根管理群組指派原則", tEn:"Assigning policy to the root management group", k:"mc",
 src:"quiz1:html",
 q:"你有一個連結到 Azure Active Directory 租用戶的 Azure 訂用帳戶，租用戶裡有一個使用者帳戶 User1。\n你需要確保 User1 可以把原則 (Policy) 指派到租用戶根管理群組 (tenant root management group)。⟦你應該怎麼做？⟧",
 o:["把 Azure 訂用帳戶的擁有者角色指派給 User1，再修改預設的條件式存取原則","把 Azure 訂用帳戶的擁有者角色指派給 User1，再指示 User1 設定 Azure 資源的存取管理","把全域系統管理員角色指派給 User1，再指示 User1 設定 Azure 資源的存取管理","建立一個新的管理群組，把 User1 委派為新管理群組的擁有者"],
 a:[2],
 e:"根管理群組（Tenant Root Group）預設沒有任何人有存取權，就算是訂用帳戶擁有者，範圍也只到訂用帳戶這一層，管不到更上層的根管理群組。要在根管理群組指派原則，必須先是（或請）全域系統管理員，然後在 Azure AD 裡執行「提升存取權以管理所有 Azure 訂用帳戶和管理群組」這個動作（也就是設定 Azure 資源的存取管理），這樣全域系統管理員就會自動在根管理群組取得使用者存取系統管理員角色，才能繼續指派原則。",
 en:{q:"You need to ensure that User1 can assign a policy to the tenant root management group. What should you do?",
  o:["Assign the Owner role for the Azure Subscription to User1, and then modify the default conditional access policies.","Assign the Owner role for the Azure subscription to User1, and then instruct User1 to configure access management for Azure resources.","Assign the Global administrator role to User1, and then instruct User1 to configure access management for Azure resources.","Create a new management group and delegate User1 as the owner of the new management group."],
  e:"Only a Global administrator can elevate access to manage all subscriptions and management groups (\"configure access management for Azure resources\"), which grants User Access Administrator at the root management group — a subscription Owner role never reaches that scope."}},

{n:25, code:"AZ104-Q25", d:3, od:4, t:"啟用流量分析所需角色", tEn:"Role required to enable Traffic Analytics", k:"mc",
 src:"quiz1:html",
 q:"注意：本題與 Q26、Q27 情境完全相同，只是提出的解法不同。\n你需要確保一位 Azure Active Directory (Azure AD) 使用者 Admin1 被指派了啟用 Azure 訂用帳戶「流量分析 (Traffic Analytics)」功能所需的角色。\n⟦解法：在訂用帳戶層級，把「網路參與者 (Network Contributor)」角色指派給 Admin1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。要啟用流量分析，帳戶必須在訂用帳戶範圍具備下列角色其中之一：擁有者、參與者、讀取者，或網路參與者。網路參與者剛好符合這個條件，所以這個解法能達成目標。",
 en:{q:"Solution: You assign the Network Contributor role at the subscription level to Admin1. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Enabling traffic analytics requires owner, contributor, reader, or network contributor at the subscription scope."}},

{n:26, code:"AZ104-Q26", d:3, od:4, t:"啟用流量分析所需角色", tEn:"Role required to enable Traffic Analytics", k:"mc",
 src:"quiz1:html",
 q:"注意：本題與 Q25、Q27 情境完全相同，只是提出的解法不同。\n（情境同 Q25：Admin1 要能啟用訂用帳戶的流量分析。）\n⟦解法：在訂用帳戶層級，把「擁有者 (Owner)」角色指派給 Admin1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。擁有者本來就包含在「擁有者、參與者、讀取者、網路參與者」這四個可以啟用流量分析的角色之中，所以符合需求（雖然權限遠超過所需，但題目沒有要求最小權限）。",
 en:{q:"Solution: You assign the Owner role at the subscription level to Admin1. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Owner is one of the four roles (owner, contributor, reader, network contributor) that satisfy the requirement."}},

{n:27, code:"AZ104-Q27", d:3, od:4, t:"啟用流量分析所需角色", tEn:"Role required to enable Traffic Analytics", k:"mc",
 src:"quiz1:html",
 q:"注意：本題與 Q25、Q26 情境完全相同，只是提出的解法不同。\n（情境同 Q25：Admin1 要能啟用訂用帳戶的流量分析。）\n⟦解法：在訂用帳戶層級，把「讀取者 (Reader)」角色指派給 Admin1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。讀取者同樣是「擁有者、參與者、讀取者、網路參與者」這四個符合條件的角色之一，所以能達成目標（乍看讀取者權限很低，但流量分析的啟用門檻剛好把讀取者也算進去）。",
 en:{q:"Solution: You assign the Reader role at the subscription level to Admin1. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Reader is also one of the four qualifying roles for enabling traffic analytics."}},

{n:28, code:"AZ104-Q28", d:1, od:1, t:"最小權限部署 VM 與網路", tEn:"Least-privilege VM & network management", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶，內含一位使用者 User1。\n你需要確保 User1 可以部署虛擬機器、也可以管理虛擬網路。⟦解決方案必須採用最小權限原則，應該指派哪一個 RBAC 角色給 User1？⟧",
 o:["擁有者 (Owner)","虛擬機器參與者 (Virtual Machine Contributor)","參與者 (Contributor)","虛擬機器系統管理員登入 (Virtual Machine Administrator Login)"],
 a:[2],
 e:"「虛擬機器參與者」只能管理虛擬機器，管不到虛擬網路；「虛擬機器系統管理員登入」只是讓你能以系統管理員身分登入既有 VM，不能部署或管理網路。同時要能部署 VM「又」管理虛擬網路，選項裡符合的只有「參與者」，它能管理幾乎所有資源類型（含 VM 與虛擬網路），但不能指派角色給別人，比「擁有者」更貼近最小權限。",
 en:{q:"You need to ensure that User1 can deploy virtual machines and manage virtual networks, using least privilege. Which RBAC role should you assign to User1?",
  o:["Owner","Virtual Machine Contributor","Contributor","Virtual Machine Administrator Login"],
  e:"Contributor manages all resource types (VMs and virtual networks) but, unlike Owner, cannot assign roles — the least-privilege fit given both requirements together."}},

{n:29, code:"AZ104-Q29", d:1, od:1, t:"啟用受控識別", tEn:"Enabling a managed identity", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含一台虛擬機器 VM1，VM1 位於資源群組 RG1。\nVM1 上執行的服務將用來部署資源到 RG1。\n你需要確保 VM1 上執行的服務可以用 VM1 自己的身分來管理 RG1 裡的資源。⟦你應該最先做什麼？⟧",
 o:["在 Azure 入口網站修改 VM1 的「受控識別 (Managed Identity)」設定","在 Azure 入口網站修改 RG1 的「存取控制 (IAM)」設定","在 Azure 入口網站修改 VM1 的「存取控制 (IAM)」設定","在 Azure 入口網站修改 RG1 的「原則」設定"],
 a:[0],
 e:"要讓 VM 上的服務「用 VM 自己的身分」驗證，第一步一定是先在 VM1 啟用受控識別（系統指派或使用者指派），這樣 Azure AD 才會替 VM1 建立一個身分。啟用之後，才需要接著到 RG1 的「存取控制 (IAM)」把角色指派給這個身分，讓它有權限管理 RG1 的資源——但那是「第二步」，題目問的是「最先」要做的事，所以答案是先設定 VM1 的受控識別。",
 en:{q:"You need to ensure that a service running on VM1 can manage the resources in RG1 by using the identity of VM1. What should you do first?",
  o:["From the Azure portal, modify the Managed Identity settings of VM1","From the Azure portal, modify the Access control (IAM) settings of RG1","From the Azure portal, modify the Access control (IAM) settings of VM1","From the Azure portal, modify the Policies settings of RG1"],
  e:"You must first enable a managed identity on VM1 so Azure AD creates an identity for it; only afterward would you grant that identity a role on RG1's IAM."}},

{n:30, code:"AZ104-Q30", d:1, od:1, t:"刪除有鎖定與備份的資源群組", tEn:"Deleting a resource group with a lock and backups", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶，內含一個資源群組 TestRG，用來驗證 Azure 部署。\nTestRG 內含以下資源（來源網頁未保留完整資源清單截圖，但依選項可知：一台虛擬機器 VM1、一個設了資源鎖定的虛擬網路 VNET1、一個存有資料的 Recovery Services 保存庫 Vault1）。\n你需要刪除 TestRG。⟦你應該最先做什麼？⟧",
 o:["修改 VM1 的備份設定，並修改 VNET1 的資源鎖定類型","移除 VNET1 的資源鎖定，並刪除 Vault1 裡的所有資料","關閉 VM1，並移除 VNET1 的資源鎖定","關閉 VM1，並刪除 Vault1 裡的所有資料"],
 a:[1],
 e:"資源群組要能刪除，群組內每一項資源都不能有阻擋刪除的因素：VNET1 有資源鎖定（不論是唯讀還是刪除鎖定）就會擋下刪除，必須先移除鎖定；Vault1 若還存有備份資料，保存庫本身也不能被刪除，必須先清空保存庫裡的資料。單純關閉或修改 VM1 的備份設定，都不會解除鎖定或清空保存庫這兩個真正擋住刪除的原因。",
 en:{q:"TestRG contains the following resources. You need to delete TestRG. What should you do first?",
  o:["Modify the backup configurations of VM1 and modify the resource lock type of VNET1","Remove the resource lock from VNET1 and delete all data in Vault1","Turn off VM1 and remove the resource lock from VNET1","Turn off VM1 and delete all data in Vault1"],
  e:"A resource lock on VNET1 blocks deletion until removed, and a vault still holding backup data cannot itself be deleted until its data is cleared — both must be addressed."}},

{n:31, code:"AZ104-Q31", d:3, od:4, t:"委派 DNS 子網域", tEn:"Delegating a DNS subdomain", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure DNS 區域 adatum.com。\n你需要把子網域 research.adatum.com 委派給 Azure 裡另一台不同的 DNS 伺服器。⟦你應該怎麼做？⟧",
 o:["在 adatum.com 區域建立一筆名稱為 research 的 NS 記錄","在 adatum.com 區域建立一筆名稱為 research 的 PTR 記錄","修改 adatum.com 的 SOA 記錄","在 adatum.com 區域建立一筆名稱為 *.research 的 A 記錄"],
 a:[0],
 e:"要把某個子網域委派給另一組（不同的）名稱伺服器負責解析，標準做法是在父網域區域裡建立一筆該子網域名稱的 NS（Name Server）記錄，指向負責該子網域的名稱伺服器清單。PTR 是反解記錄、SOA 是區域本身的權威資訊記錄、A 記錄只是把名稱指到 IP，都不能達成「委派」這件事。",
 en:{q:"You need to delegate a subdomain named research.adatum.com to a different DNS server in Azure. What should you do?",
  o:["Create an NS record named research in the adatum.com zone.","Create a PTR record named research in the adatum.com zone.","Modify the SOA record of adatum.com.","Create an A record named *.research in the adatum.com zone."],
  e:"Delegating a subdomain requires an NS record in the parent zone pointing to the delegated zone's name servers."}},

{n:32, code:"AZ104-Q32", d:1, od:1, t:"Log Analytics 查詢語法", tEn:"Log Analytics query syntax", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含一個 Log Analytics 工作區 Workspace1。\n你需要從一個名為 Event 的資料表中，查出錯誤事件。⟦你應該在 Workspace1 執行哪個查詢？⟧",
 o:["Get-Event Event | where {$_.EventType == \"error\"}","Event | search \"error\"","select * from Event where EventType == \"error\"","Event | where EventType is \"error\""],
 a:[1],
 e:"search 運算子提供跨資料表／欄位的搜尋能力，語法可以寫成「資料表 | search \"關鍵字\"」，所以 Event | search \"error\" 是合法的 KQL。要用 where 過濾特定欄位，正確運算子是 ==，不是 is，所以 Event | where EventType is \"error\" 語法錯誤；Get-Event、select * from 都不是 KQL 語法。",
 en:{q:"You need to view the error event from a table named Event. Which query should you run in Workspace1?",
  o:["Get-Event Event | where {$_.EventType == \"error\"}","Event | search \"error\"","select * from Event where EventType == \"error\"","Event | where EventType is \"error\""],
  e:"`Table | search \"term\"` is valid KQL syntax. `where … is …` is not valid KQL (KQL uses `==`)."}},

{n:33, code:"AZ104-Q33", d:3, od:4, t:"公用 DNS 區域委派", tEn:"Public DNS zone delegation", k:"mc",
 src:"quiz1:html",
 q:"你有一個已註冊的 DNS 網域 contoso.com。\n你在 Azure 建立了一個公用 DNS 區域，名稱也是 contoso.com。\n你需要確保在這個 contoso.com 區域裡建立的記錄，可以從網際網路解析得到。⟦你應該怎麼做？⟧",
 o:["在 contoso.com 建立 NS 記錄","在 DNS 網域註冊業者修改 SOA 記錄","在 contoso.com 建立 SOA 記錄","在 DNS 網域註冊業者修改 NS 記錄"],
 a:[3],
 e:"光是在 Azure 建立公用 DNS 區域，並不會自動讓全世界的解析器知道要去問 Azure 的名稱伺服器。必須回到網域註冊業者那邊，把該網域的 NS 記錄改成指向 Azure DNS 區域配發的那組名稱伺服器，這樣網際網路上的查詢才會被正確委派到 Azure DNS，Azure 區域裡的記錄才解析得到。SOA、在 Azure 區域裡自建 NS 記錄都不能完成「從註冊業者那一端」的委派。",
 en:{q:"You need to ensure that records created in the contoso.com zone are resolvable from the internet. What should you do?",
  o:["Create NS records in contoso.com.","Modify the SOA record in the DNS domain registrar.","Create the SOA record in contoso.com.","Modify the NS records in the DNS domain registrar."],
  e:"The registrar's NS records must be updated to point to the Azure DNS zone's name servers so the internet delegates queries there."}},

{n:34, code:"AZ104-Q34", d:2, od:2, t:"AzCopy 支援的儲存體服務", tEn:"Storage services AzCopy supports", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 儲存體帳戶 storage1。\n你打算用 AzCopy 把資料複製到 storage1。\n你需要確認可以把資料複製過去的儲存體服務有哪些。⟦你應該辨識出什麼？⟧",
 o:["Blob、檔案、資料表和佇列","僅 Blob 和檔案","僅檔案和資料表","僅檔案","僅 Blob、資料表和佇列"],
 a:[1],
 e:"AzCopy 是專門用來搬 Blob 或檔案（Azure Files）進出儲存體帳戶的命令列工具，不支援資料表（Table）與佇列（Queue）這兩種儲存體服務，所以正確範圍是「Blob 和檔案」，其餘含資料表／佇列的選項都不對。",
 en:{q:"You plan to use AzCopy to copy data to storage1. You need to identify the storage services in storage1 to which you can copy the data. What should you identify?",
  o:["blob, file, table, and queue","blob and file only","file and table only","file only","blob, table, and queue only"],
  e:"AzCopy supports blob and file storage services only; it does not support table and queue storage."}},

{n:35, code:"AZ104-Q35", d:2, od:2, t:"容器持續性儲存體", tEn:"Persistent storage for a container instance", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶，內含一個 Azure 儲存體帳戶。\n你打算建立一個 Azure 容器執行個體 container1，使用一個名為 Image1 的 Docker 映像檔，Image1 內含一個 Microsoft SQL Server 執行個體，需要持續性儲存體。你需要替 Container1 設定儲存體服務。⟦你應該使用什麼？⟧",
 o:["Azure 檔案 (Files)","Azure Blob 儲存體","Azure 佇列儲存體 (Queue)","Azure 資料表儲存體 (Table)"],
 a:[0],
 e:"容器需要能夠像掛載檔案系統一樣持續保存資料庫檔案，Azure 容器執行個體支援把 Azure 檔案共用 (Azure Files) 掛載成容器內的磁碟區，容器重啟或重新部署後資料依然保留，符合「持續性儲存體」需求。Blob、佇列、資料表儲存體都不能用一般檔案系統方式掛載進容器，不適合當資料庫檔案的持續性儲存體。",
 en:{q:"Image1 contains a Microsoft SQL Server instance that requires persistent storage. You need to configure a storage service for Container1. What should you use?",
  o:["Azure Files","Azure Blob storage","Azure Queue storage","Azure Table storage"],
  e:"Azure Container Instances can mount an Azure Files share as a persistent volume, which SQL Server needs — Blob/Queue/Table cannot be mounted as a filesystem this way."}},

{n:36, code:"AZ104-Q36", d:2, od:3, t:"可用性設定組容錯網域", tEn:"Availability Set fault domains", k:"mc",
 src:"quiz1:html",
 q:"你有一個名為 App1 的應用程式，跑在兩台 Azure 虛擬機器 VM1 與 VM2 上。\n你打算替 App1 建立一個 Azure 可用性設定組 (Availability Set)。⟦解決方案必須確保在 VM1、VM2 所在硬體進行「計畫性維護」期間，App1 仍然可用，你應該在可用性設定組裡設定什麼？⟧",
 o:["一個更新網域 (update domain)","兩個容錯網域 (fault domain)","一個容錯網域 (fault domain)","兩個更新網域 (update domain)"],
 a:[3],
 e:"計畫性維護（例如套用 Microsoft 更新）對應的是「更新網域」的概念：同一個更新網域裡的 VM 可能會被同時重新開機，所以要避免 App1 整組 VM 一起被維護中斷，必須把 VM1、VM2 分散到「至少兩個」不同的更新網域，這樣同一時間最多只有一個更新網域在重開機，另一台還在服務。容錯網域對應的是硬體（電源／網路交換器）意外故障，不是「計畫性」維護要處理的問題，所以答案跟容錯網域無關。",
 en:{q:"The solution must ensure that App1 is available during planned maintenance of the hardware hosting VM1 and VM2. What should you include in the Availability Set?",
  o:["one update domain","two fault domains","one fault domain","two update domains"],
  e:"Planned maintenance reboots one update domain at a time; spreading the VMs across at least two update domains ensures one is still serving while the other reboots. Fault domains address unplanned hardware failure, not planned maintenance."}},

{n:37, code:"AZ104-Q37", d:2, od:2, t:"AzCopy 複製資料夾到容器", tEn:"AzCopy copying a folder to a container", k:"mc",
 src:"quiz1:html",
 q:"你有一台內部部署伺服器，裡面有一個資料夾 D:\\Folder1。\n你需要把 D:\\Folder1 的內容複製到 Azure 儲存體帳戶 contosodata 的 public 容器。⟦你應該執行哪個命令？⟧",
 o:["https://contosodata.blob.core.windows.net/public","azcopy sync D:\\folder1 https://contosodata.blob.core.windows.net/public –snapshot","azcopy copy D:\\folder1 https://contosodata.blob.core.windows.net/public –recursive","az storage blob copy start-batch D:\\Folder1 https://contosodata.blob.core.windows.net/public"],
 a:[2],
 e:"azcopy copy 指令可以把一個資料夾（連同底下所有檔案）複製到 Blob 容器，加上 --recursive 才會把子資料夾內容也一併複製，符合題目「複製 D:\\Folder1 內容」的需求。azcopy sync 是「同步」語意，行為不同（比較後只搬異動的部分，且不支援 --snapshot 這個參數組合）；az storage blob copy start-batch 是批次複製「多個既有 Blob」用的，不是從本機資料夾上傳；第一個選項只是一個網址，不是命令。",
 en:{q:"You need to copy the contents of D:\\Folder1 to the public container in an Azure Storage account named contosodata. Which command should you run?",
  o:["https://contosodata.blob.core.windows.net/public","azcopy sync D:\\folder1 https://contosodata.blob.core.windows.net/public –snapshot","azcopy copy D:\\folder1 https://contosodata.blob.core.windows.net/public –recursive","az storage blob copy start-batch D:\\Folder1 https://contosodata.blob.core.windows.net/public"],
  e:"`azcopy copy … --recursive` copies a local directory (and its files) into a blob container, which is exactly what's needed."}},

{n:38, code:"AZ104-Q38", d:2, od:2, t:"Import/Export 服務支援的帳戶", tEn:"Storage accounts supported by Import/Export", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含下表所示的儲存體帳戶（來源網頁未保留完整表格截圖；依解析可知 storage1~storage3 是不符合匯出需求的帳戶類型，storage4 是一般用途 v2 或 Blob 儲存體這類受支援的標準帳戶）。\n你打算用 Azure Import/Export 服務，把資料從 Subscription1 匯出。你需要判斷哪個儲存體帳戶可以用來匯出資料。⟦你應該辨識出哪一個？⟧",
 o:["storage1","storage2","storage3","storage4"],
 a:[3],
 e:"Import/Export 服務支援的帳戶類型是標準的一般用途 v2（建議）、Blob 儲存體帳戶，以及一般用途 v1；而且「匯出（Export）」只支援 Blob 儲存體這個服務項目（匯入則同時支援 Blob 與檔案）。凡是進階（Premium）帳戶、或裝的是不支援匯出的服務項目，都不能用來匯出資料。四個選項中只有 storage4 符合受支援的帳戶類型與服務項目。",
 en:{q:"You plan to use the Azure Import/Export service to export data from Subscription1. You need to identify which storage account can be used to export the data. What should you identify?",
  o:["storage1","storage2","storage3","storage4"],
  e:"Import/Export supports Standard GPv2 (recommended), Blob Storage accounts, and GPv1; Export specifically only supports Blob storage. Premium accounts or unsupported service types are excluded."}},

{n:39, code:"AZ104-Q39", d:2, od:2, t:"即時遷移到 ZRS", tEn:"Live migration to ZRS", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的儲存體帳戶（來源網頁未保留完整表格截圖；依解析可知只有 storage2 是「標準」複寫類型為 LRS 的帳戶，其餘帳戶不是已經是 GRS/RA-GRS，就是進階 (Premium) 等級）。\n你需要判斷哪個儲存體帳戶，可以透過向 Azure 支援團隊申請即時遷移 (live migration)，轉換成區域備援儲存體 (ZRS) 複寫。⟦你應該辨識出哪一個？⟧",
 o:["storage1","storage2","storage3","storage4"],
 a:[1],
 e:"即時遷移只支援「標準」等級、且目前複寫類型是 LRS 的儲存體帳戶；如果帳戶目前是 GRS 或 RA-GRS，必須先自行改成 LRS（這個中間步驟會拿掉次要端點）才能申請遷移，進階等級帳戶則完全不支援即時遷移、只能手動搬遷。同時，ZRS 目前只支援標準一般用途 v2、FileStorage、BlockBlobStorage 這幾種帳戶類型。四個選項中只有 storage2 同時符合「標準 LRS」與「支援 ZRS 的帳戶類型」兩個條件。",
 en:{q:"You need to identify which storage account can be converted to zone-redundant storage (ZRS) replication by requesting a live migration from Azure support. What should you identify?",
  o:["storage1","storage2","storage3","storage4"],
  e:"Live migration only works from Standard LRS accounts (GRS/RA-GRS must first be changed to LRS manually; Premium accounts must migrate manually, not via live migration), and ZRS itself only supports certain standard account types."}},

{n:40, code:"AZ104-Q40", d:2, od:2, t:"儲存體防火牆上傳磁碟", tEn:"Storage firewall for uploading VM disks", k:"mc",
 src:"quiz1:html",
 q:"你有一個 Azure 儲存體帳戶 account1。\n你打算從內部部署網路把一台虛擬機器的磁碟檔案上傳到 account1，內部部署網路的公用 IP 位址空間是 131.107.1.0/24。\n你打算用這些磁碟檔案佈建一台 Azure 虛擬機器 VM1，VM1 會連接到虛擬網路 VNet1，VNet1 的 IP 位址空間是 192.168.0.0/24。\n你需要設定 account1 滿足以下需求：\n・確保你可以把磁碟檔案上傳到 account1。\n・確保你可以把磁碟掛接到 VM1。\n・防止其他所有存取。\n⟦你應該執行哪兩個動作？⟧（每個正確答案各自是解法的一部分。）",
 o:["在 account1 的「網路」刀鋒選單選擇「選取的網路 (Selected networks)」","在 account1 的「網路」刀鋒選單勾選「允許受信任的 Microsoft 服務存取此儲存體帳戶」","在 account1 的「網路」刀鋒選單新增 131.107.1.0/24 這個 IP 位址範圍","在 account1 的「網路」刀鋒選單新增 VNet1","在 VNet1 的「服務端點」刀鋒選單新增一個服務端點"],
 a:[0,2],
 e:"要「防止其他所有存取」，第一步一定是把儲存體防火牆從預設的「所有網路」改成「選取的網路」，只允許明確列出的來源。接著因為要從內部部署網路（公用 IP 為 131.107.1.0/24）上傳磁碟檔案，必須把這個 IP 範圍加進防火牆的允許清單。至於「把磁碟掛接到 VM1」，VM1 掛接磁碟走的是 Azure 內部的管理平面路徑，不需要額外把 VNet1 加進儲存體防火牆或建立服務端點；勾選信任的 Microsoft 服務例外也不是這個情境需要的。",
 en:{q:"You need to configure account1 to: allow uploading the disk files; allow attaching the disks to VM1; prevent all other access. Which two actions should you perform?",
  o:["From the Networking blade of account1, select Selected networks.","From the Networking blade of account1, select Allow trusted Microsoft services to access this storage account.","From the Networking blade of account1, add the 131.107.1.0/24 IP address range.","From the Networking blade of account1, add VNet1.","From the Service endpoints blade of VNet1, add a service endpoint."],
  e:"Switch the firewall to Selected networks (deny by default), then explicitly allow the on-premises public IP range used for the upload. Attaching disks to VM1 doesn't require adding VNet1 or a service endpoint."}},


{n:712, code:"AZ104-Q712", d:2, od:3, k:"dd", fix:true, t:"Key Vault 密碼保護", tEn:"Key Vault for VM password",
 src:"quiz20:55200_ans.png",
 q:"你下載了一份 Azure Resource Manager (ARM) 範本，用來部署多台虛擬機器 (VM)。這份範本是根據現有的 VM 產生的，但必須改成參照一組系統管理員密碼。\n你要確保這組密碼不能以明文儲存。\n你正準備建立達成目標所需的元件。\n⟦為了達成目標，你應該建立哪些元件？請把清單中正確的選項拖曳到答案區。⟧",
 items:["Azure Key Vault","Azure 儲存體帳戶","Azure AD Identity Protection","存取原則 (access policy)","Azure Policy","備份原則 (backup policy)"],
 tgt:["安全存放系統管理員密碼、避免明文儲存的元件","定義誰可以讀取保存庫中密碼的規則"],
 a:[0,3],
 e:"解法：先建立 Azure Key Vault 保存庫來存放 VM 的系統管理密碼（以密碼保存庫取代 ARM 範本裡的明文密碼），再替保存庫設定存取原則（access policy），指定哪些人或服務主體可以讀取這組密碼。\n・儲存體帳戶用來放檔案／Blob 等資料，不是用來存密碼。\n・Azure AD Identity Protection 是偵測風險登入的服務，與密碼儲存無關。\n・Azure Policy／備份原則都不是用來存放密碼的元件。",
 en:{q:"You have downloaded an Azure Resource Manager (ARM) template to deploy numerous virtual machines (VMs). The ARM template is based on a current VM, but must be adapted to reference an administrative password.\nYou need to make sure that the password cannot be stored in plain text.\nYou are preparing to create the necessary components to achieve your goal.\nWhich of the following should you create to achieve your goal? Answer by dragging the correct option from the list to the answer area.",
  items:["An Azure Key Vault","An Azure Storage account","Azure Active Directory (AD) Identity Protection","An access policy","An Azure policy","A backup policy"],
  tgt:["The component that securely stores the admin password instead of plain text","The rule that defines who can access the secret in the vault"],
  e:"Solution: Create an Azure Key Vault to store the VM admin password instead of embedding it as plain text in the ARM template, then configure an access policy on the vault to control who can read the secret.\n- A storage account stores blobs/files, not secrets.\n- Azure AD Identity Protection detects risky sign-ins and is unrelated.\n- Azure Policy and a backup policy are not used to store credentials."}},

{n:713, code:"AZ104-Q713", d:3, od:5, k:"dd", fix:true, t:"ASR 站台復原", tEn:"Azure Site Recovery",
 src:"quiz20:66000_ans.png",
 q:"你的公司有一個 Azure 訂用帳戶，包含多台屬於同一個虛擬網路的 Azure 虛擬機器 (VM)。\n公司還有一台內部部署的 Hyper-V 伺服器，裡面有一台名為 VM1 的虛擬機器，必須複寫到 Azure。\n⟦為了達成這個目標，必須建立哪些物件？請把清單中正確的選項拖曳到答案區。⟧",
 items:["Hyper-V 站台 (Hyper-V site)","儲存體帳戶","Azure Recovery Services 保存庫","Azure Traffic Manager 執行個體","複寫原則 (replication policy)","端點 (endpoint)"],
 tgt:["登錄內部部署 Hyper-V 站台的物件","存放複寫資料與中繼資料的保存庫","定義複寫頻率與保留點的原則"],
 a:[0,2,4],
 e:"解法：在 Azure 建立 Recovery Services 保存庫，於保存庫中建立 Hyper-V 站台物件來登錄內部部署的 Hyper-V 主機，再設定複寫原則（多久複寫一次、保留幾個復原點）。這三樣是啟用 Azure Site Recovery (ASR) 複寫 VM 到 Azure 的必要元件。\n・儲存體帳戶是 ASR 內部會用到的資源，但不是題目要你「建立」的三個核心物件之一。\n・Traffic Manager 與端點（端點是 File Sync 的概念）都與這個情境無關。",
 en:{q:"Your company has an Azure subscription that includes a number of Azure virtual machines (VMs), which are all part of the same virtual network.\nYour company also has an on-premises Hyper-V server that hosts a VM, named VM1, which must be replicated to Azure.\nWhich of the following objects must be created to achieve this goal? Answer by dragging the correct option from the list to the answer area.",
  items:["Hyper-V site","Storage account","Azure Recovery Services Vault","Azure Traffic Manager instance","Replication policy","Endpoint"],
  tgt:["The object used to register the on-premises Hyper-V site","The vault that stores replicated data and metadata","The policy that defines replication frequency and recovery points"],
  e:"Solution: Create a Recovery Services Vault, create a Hyper-V site object inside it to register the on-premises Hyper-V host, then configure a replication policy (frequency and recovery points). These are the core objects required to enable Azure Site Recovery replication of an on-premises VM to Azure."}},

{n:714, code:"AZ104-Q714", d:1, od:1, k:"dl", t:"負載平衡器 RBAC", tEn:"Load balancer RBAC",
 src:"quiz20:118080_ans.png",
 q:"你有一個名為 Subscription1 的 Azure 訂用帳戶，裡面有一個名為 RG1 的資源群組。\n在 RG1 中，你建立了一個內部負載平衡器 LB1，以及一個公用負載平衡器 LB2。\n⟦你要確保系統管理員 Admin1 能管理 LB1 與 LB2，而且解決方案必須遵守最小權限原則。⟧\n針對每項工作，你應該指派給 Admin1 什麼角色？",
 sent:"為 LB1 新增後端集區，要指派給 Admin1 的角色是：{0}\n為 LB2 新增健康探測，要指派給 Admin1 的角色是：{1}",
 dd:[["LB1 的參與者 (Contributor on LB1)","LB1 的網路參與者 (Network Contributor on LB1)","RG1 的網路參與者 (Network Contributor on RG1)","LB1 的擁有者 (Owner on LB1)"],
     ["LB2 的參與者 (Contributor on LB2)","LB2 的網路參與者 (Network Contributor on LB2)","RG1 的網路參與者 (Network Contributor on RG1)","LB2 的擁有者 (Owner on LB2)"]],
 a:[1,1],
 e:"網路參與者 (Network Contributor) 角色可以管理網路資源（包含負載平衡器的後端集區、健康探測等設定），範圍設在該負載平衡器本身即可，不需要整個資源群組的權限，符合最小權限原則。\n・參與者 (Contributor) 權限過大，能管理所有類型資源，不符合最小權限。\n・擁有者 (Owner) 權限更大，還能指派角色給別人，更不符合最小權限。\n・範圍設在資源群組 (RG1) 也超過需求，只要設在個別負載平衡器上就夠了。",
 en:{q:"You have an Azure subscription named Subscription1 that contains a resource group named RG1.\nIn RG1, you create an internal load balancer named LB1 and a public load balancer named LB2.\nYou need to ensure that an administrator named Admin1 can manage LB1 and LB2. The solution must follow the principle of least privilege.\nWhich role should you assign to Admin1 for each task?",
  sent:"To add a backend pool to LB1, assign: {0}\nTo add a health probe to LB2, assign: {1}",
  dd:[["Contributor on LB1","Network Contributor on LB1","Network Contributor on RG1","Owner on LB1"],
      ["Contributor on LB2","Network Contributor on LB2","Network Contributor on RG1","Owner on LB2"]],
  e:"Network Contributor can manage network resources (including load balancer backend pools and health probes). Scoping it to the load balancer itself (not the resource group) satisfies least privilege. Contributor and Owner grant more than needed, and scoping to RG1 is broader than necessary."}},

{n:715, code:"AZ104-Q715", d:1, od:1, k:"dd", fix:true, t:"成本標籤報表", tEn:"Cost tagging report",
 src:"quiz20:168480_ans.png",
 q:"你有一個 Azure 訂用帳戶，被公司四個部門共用。這個訂用帳戶包含 10 個資源群組，每個部門會用到好幾個資源群組裡的資源。\n你要把一份報表送給財務部門，報表要列出每個部門各自的成本。\n⟦你應該依序執行哪三個動作？請把清單中正確的動作拖曳到答案區並排出正確順序。⟧",
 items:["替每個資源群組加上標籤","替每個資源加上標籤","下載使用量報表","從「成本分析」刀鋒選單依標籤篩選檢視","開啟每個資源群組的「資源成本」刀鋒選單"],
 tgt:["第一步","第二步","第三步"],
 a:[1,3,2],
 e:"解法：先替每一項「資源」（不是資源群組）加上代表部門的標籤，因為同一個資源群組可能被多個部門共用，標籤要標在資源層級才能精準區分部門；接著到「成本分析」刀鋒選單依標籤篩選檢視，最後下載使用量報表提供給財務部門。\n・替資源「群組」加標籤沒辦法區分同一群組內不同部門的用量，不符題目情境（同一資源群組被多部門共用）。\n・「資源成本」刀鋒選單是看單一資源的成本，不是跨資源群組彙總報表的做法。",
 en:{q:"You have an Azure subscription that is used by four departments in your company. The subscription contains 10 resource groups. Each department uses resources in several resource groups.\nYou need to send a report to the finance department. The report must detail the costs for each department.\nWhich three actions should you perform in sequence?",
  items:["Assign a tag to each resource group.","Assign a tag to each resource.","Download the usage report.","From the Cost analysis blade, filter the view by tag.","Open the Resource costs blade of each resource group."],
  tgt:["Step 1","Step 2","Step 3"],
  e:"Solution: Tag each resource (not each resource group, since resource groups are shared across departments), filter the Cost analysis view by tag, then download the usage report for finance."}},

{n:716, code:"AZ104-Q716", d:1, od:1, k:"dl", t:"混合式 AD 屬性", tEn:"Hybrid AD attributes",
 src:"quiz20:190080_ans.png",
 q:"你有 Azure Active Directory (Azure AD) 的混合式部署，其中包含下表所示的使用者：\n| 名稱 | 類型 | 來源 |\n|---|---|---|\n| User1 | 成員 | Azure AD |\n| User2 | 成員 | Windows Server Active Directory |\n| User3 | 訪客 | Microsoft 帳戶 |\n你需要修改這些使用者的 JobTitle 與 UsageLocation 屬性。\n⟦針對哪些使用者，可以直接從 Azure AD 修改這些屬性？⟧",
 sent:"JobTitle：能直接在 Azure AD 修改的使用者是 {0}\nUsageLocation：能直接在 Azure AD 修改的使用者是 {1}",
 dd:[["僅 User1","僅 User1 和 User2","僅 User1 和 User3","User1、User2 和 User3"],
     ["僅 User1","僅 User1 和 User2","僅 User1 和 User3","User1、User2 和 User3"]],
 a:[2,3],
 e:"Box 1：僅 User1 和 User3 —— User2 的來源是 Windows Server Active Directory，他的身分主導權在地端 AD，JobTitle、聯絡資訊等識別資訊必須在地端 Windows Server AD 修改後同步到 Azure AD，無法直接在 Azure AD 修改。User1（來源 Azure AD）與 User3（Microsoft 帳戶訪客）則可以直接在 Azure AD 修改。\nBox 2：User1、User2 和 User3 —— UsageLocation 是 Azure AD 授權指派所需的屬性，即使使用者主導權在地端，UsageLocation 通常仍可以（而且必須）直接在 Azure AD 設定，三位使用者都可以修改。",
 en:{q:"You have a hybrid deployment of Azure Active Directory (Azure AD) that contains the users shown in the following table.\n| Name | Type | Source |\n|---|---|---|\n| User1 | Member | Azure AD |\n| User2 | Member | Windows Server Active Directory |\n| User3 | Guest | Microsoft account |\nYou need to modify the JobTitle and UsageLocation attributes for the users.\nFor which users can you modify the attributes from Azure AD?",
  sent:"JobTitle can be modified directly in Azure AD for: {0}\nUsageLocation can be modified directly in Azure AD for: {1}",
  dd:[["User1 only","User1 and User2 only","User1 and User3 only","User1, User2, and User3"],
      ["User1 only","User1 and User2 only","User1 and User3 only","User1, User2, and User3"]],
  e:"Box 1: User1 and User3 only – You must use Windows Server Active Directory to update the identity, contact info, or job info for users whose source of authority is Windows Server Active Directory.\nBox 2: User1, User2, and User3"}},

{n:717, code:"AZ104-Q717", d:1, od:1, k:"dd", t:"儲存體 RBAC", tEn:"Storage RBAC roles",
 src:"quiz20:192000_ans.png",
 q:"你有一個名為 Sub1 的 Azure 訂用帳戶，裡面有兩位使用者 User1 與 User2。\n你要替 User1 與 User2 指派 RBAC 角色，這兩位使用者必須能在 Sub1 中執行以下工作：\n・User1 必須能檢視任何儲存體帳戶中的資料。\n・User2 必須能把 Contributor 角色指派給其他使用者，讓對方管理儲存體帳戶。\n⟦解決方案必須遵守最小權限原則。⟧",
 items:["擁有者 (Owner)","參與者 (Contributor)","讀取者與資料存取 (Reader and Data Access)","儲存體帳戶參與者 (Storage Account Contributor)"],
 tgt:["User1（需檢視任何儲存體帳戶中的資料）","User2（需將 Contributor 角色指派給其他人管理儲存體帳戶）"],
 a:[2,0],
 e:"「讀取者與資料存取」角色可以檢視儲存體帳戶的存取金鑰並讀取資料（含 Blob／檔案內容），適合只需要查看資料的 User1。\n要「指派角色給別人」一定要有 Microsoft.Authorization/roleAssignments/write 權限，只有擁有者（或使用者存取系統管理員）具備這項權限，所以 User2 要指派「擁有者」角色才能把 Contributor 角色授予其他人。\n・參與者可以管理儲存體帳戶但不能指派角色給別人。\n・儲存體帳戶參與者只能管理帳戶設定，無法讀取資料內容也不能指派角色。",
 en:{q:"You have an Azure subscription named Sub1 that contains two users named User1 and User2.\nYou need to assign RBAC roles to User1 and User2. The users must be able to perform the following tasks in Sub1:\n+ User1 must view the data in any storage account.\n+ User2 must assign users the Contributor role for storage accounts.\nThe solution must use the principle of least privilege.\nWhich RBAC role should you assign to each user?",
  items:["Owner","Contributor","Reader and Data Access","Storage Account Contributor"],
  tgt:["User1 (must view the data in any storage account)","User2 (must assign the Contributor role to others)"],
  e:"Reader and Data Access can view storage account keys and read data, fitting User1. Assigning roles to others requires Microsoft.Authorization/roleAssignments/write, which only Owner (or User Access Administrator) has, so User2 needs Owner. Contributor cannot assign roles; Storage Account Contributor cannot read data or assign roles."}},

{n:718, code:"AZ104-Q718", d:1, od:1, k:"dl", t:"自訂角色複製", tEn:"Custom role cloning",
 src:"quiz20:195600_ans.png",
 q:"你有一個連結到 Azure AD 租用戶的 Azure 訂用帳戶。租用戶中有下表所示的自訂 RBAC 角色：\n| 名稱 | 說明 |\n|---|---|\n| Role1 | Azure 訂用帳戶角色 |\n| Role2 | Azure AD 角色 |\n你要從 Azure 入口網站建立兩個新的自訂角色，分別名為 Role3 與 Role4。Role3 會是 Azure 訂用帳戶角色，Role4 會是 Azure AD 角色。\n⟦你可以複製哪些角色來建立這兩個新角色？⟧",
 sent:"建立 Role3（訂用帳戶角色）可以複製的來源是：{0}\n建立 Role4（Azure AD 角色）可以複製的來源是：{1}",
 dd:[["僅 Role1","僅內建的 Azure 訂用帳戶角色","Role1 與內建的 Azure 訂用帳戶角色","內建的 Azure 訂用帳戶角色與內建的 Azure AD 角色","Role1、Role2、內建的 Azure 訂用帳戶角色與內建的 Azure AD 角色"],
     ["僅 Role2","僅內建的 Azure AD 角色","Role2 與內建的 Azure AD 角色","內建的 Azure AD 角色與內建的 Azure 訂用帳戶角色","Role1、Role2、內建的 Azure AD 角色與內建的 Azure 訂用帳戶角色"]],
 a:[2,1],
 e:"建立 Azure 訂用帳戶（RBAC）自訂角色時，可以複製「內建角色」或「既有的自訂角色」當範本，所以 Role3 可以從 Role1（既有的自訂訂用帳戶角色）或任何內建的訂用帳戶角色複製。\n但建立 Azure AD 自訂角色時，目前只能複製「內建角色」，不能複製既有的自訂角色，所以 Role4 只能從內建的 Azure AD 角色複製，不能複製 Role2（它本身就是自訂角色）。",
 en:{q:"You have an Azure subscription that is linked to an Azure AD tenant. The tenant contains the custom RBAC roles shown in the following table.\n| Name | Description |\n|---|---|\n| Role1 | Azure subscription role |\n| Role2 | Azure AD role |\nFrom the Azure portal, you need to create two custom roles named Role3 and Role4. Role3 will be an Azure subscription role. Role4 will be an Azure AD role.\nWhich roles can you clone to create the new roles?",
  sent:"Role3 (subscription role) can be cloned from: {0}\nRole4 (Azure AD role) can be cloned from: {1}",
  dd:[["Role1 only","Built-in Azure subscription roles only","Role1 and built-in Azure subscription roles only","Built-in Azure subscription roles and built-in Azure AD roles only","Role1, Role2, built-in Azure subscription roles, and built-in Azure AD roles"],
      ["Role2 only","Built-in Azure AD roles only","Role2 and built-in Azure AD roles only","Built-in Azure AD roles and built-in Azure subscription roles only","Role1, Role2, built-in Azure AD, and built-in Azure subscription roles"]],
  e:"For Azure subscription (RBAC) custom roles, you can clone either a built-in role or an existing custom role, so Role3 can be cloned from Role1 or any built-in subscription role. For Azure AD custom roles, you can currently only clone built-in roles, not existing custom roles, so Role4 can only be cloned from a built-in Azure AD role, not Role2."}},

{n:719, code:"AZ104-Q719", d:1, od:1, k:"dd", fix:true, t:"自訂網域驗證", tEn:"Custom domain verification",
 src:"quiz20:211680_ans.png",
 q:"你有一個 Azure Active Directory (Azure AD) 租用戶，網域名稱為 contoso.onmicrosoft.com。\n你在某第三方登錄業者那裡有一個網域名稱 contoso.com。\n你要確保能建立名稱含 @contoso.com 尾碼的 Azure AD 使用者。\n⟦你應該依序執行哪三個動作？請把清單中正確的動作拖曳到答案區並排出正確順序。⟧",
 items:["新增 Azure AD 租用戶","設定公司品牌","建立 Azure DNS 區域","新增自訂網域名稱","在公用的 contoso.com DNS 區域新增記錄","驗證網域"],
 tgt:["第一步","第二步","第三步"],
 a:[3,4,5],
 e:"解法：先在 Azure AD 新增自訂網域名稱 contoso.com；因為網域註冊在第三方登錄業者，Azure AD 會要求你在該網域的公用 DNS 區域（contoso.com，不是 Azure DNS）新增一筆驗證記錄；新增記錄後回到 Azure AD 驗證網域，驗證通過後就能建立 xxx@contoso.com 格式的使用者。\n・「新增 Azure AD 租用戶」「設定公司品牌」「建立 Azure DNS 區域」都與新增／驗證自訂網域無關，是干擾選項。",
 en:{q:"You have an Azure Active Directory (Azure AD) tenant that has the contoso.onmicrosoft.com domain name.\nYou have a domain name of contoso.com registered at a third-party registrar.\nYou need to ensure that you can create Azure AD users that have names containing a suffix of @contoso.com.\nWhich three actions should you perform in sequence?",
  items:["Add an Azure AD tenant","Configure company branding","Create an Azure DNS zone","Add a custom name","Add a record to the public contoso.com DNS zone","Verify the domain"],
  tgt:["Step 1","Step 2","Step 3"],
  e:"Solution: Add the custom domain name in Azure AD, add the required record to the domain's public DNS zone at the third-party registrar, then verify the domain in Azure AD."}},

{n:720, code:"AZ104-Q720", d:2, od:2, k:"hs", t:"檔案共用 RBAC", tEn:"File share data RBAC",
 src:"quiz20:222480_ans.png",
 q:"你有一個名為 storage1 的 Azure 儲存體帳戶，訂用帳戶連結到名為 contoso.com 的 Azure Active Directory (Azure AD) 租用戶，並與內部部署 Active Directory 網域同步。\n網域中有下表所示的安全性主體：\n| 名稱 | 類型 |\n|---|---|\n| User1 | 使用者 |\n| Computer1 | 電腦 |\n在 Azure AD 中，你建立了一位名為 User2 的使用者。\nstorage1 帳戶包含一個名為 share1 的檔案共用。\n⟦以下敘述，正確請選「是」，不正確請選「否」。⟧",
 s:["可以把「儲存體檔案資料 SMB 共用參與者」角色指派給 User1 存取 share1。",
    "可以把「儲存體檔案資料 SMB 共用讀取者」角色指派給 Computer1 存取 share1。",
    "可以把「儲存體檔案資料 SMB 共用進階參與者」角色指派給 User2 存取 share1。"],
 a:[1,0,1],
 e:"Azure 檔案共用的資料層級 RBAC 角色（SMB Share Reader／Contributor／Elevated Contributor）只能指派給「使用者」或「群組」等身分主體，不能指派給電腦帳戶（Computer1）這種裝置物件，所以第二句是「否」。\nUser1（來源 Azure AD 的使用者）與 User2（在 Azure AD 新建立的使用者）都是合法的身分主體，可以指派這些角色，所以第一句與第三句都是「是」。",
 en:{q:"You have an Azure subscription that contains a storage account named storage1. The subscription is linked to an Azure Active Directory (Azure AD) tenant named contoso.com that syncs to an on-premises Active Directory domain.\nThe domain contains the security principals shown in the following table.\n| Name | Type |\n|---|---|\n| User1 | User |\n| Computer1 | Computer |\nIn Azure AD, you create a user named User2.\nThe storage1 account contains a file share named share1.\nFor each statement, select Yes if true, otherwise No.",
  s:["You can assign the Storage File Data SMB Share Contributor role to User1 for share1.",
     "You can assign the Storage File Data SMB Share Reader role to Computer1 for share1.",
     "You can assign the Storage File Data SMB Share Elevated Contributor role to User2 for share1."],
  e:"Azure file share data-plane RBAC roles can only be assigned to identity principals such as users or groups, not to computer accounts, so statement 2 is No. User1 and User2 are both valid identity principals, so statements 1 and 3 are Yes."}},

{n:721, code:"AZ104-Q721", d:3, od:4, k:"dl", t:"VNet 子網路權限", tEn:"VNet subnet permissions",
 src:"quiz20:226080_ans.png",
 q:"你有一個名為 Subscription1 的 Azure 訂用帳戶，內有一個虛擬網路 VNet1。\n你新增了下表的使用者：\n| 使用者 | 角色 |\n|---|---|\n| User1 | 擁有者 (Owner) |\n| User2 | 安全性系統管理員 (Security Admin) |\n| User3 | 網路參與者 (Network Contributor) |\n⟦哪位使用者能執行下列每一項設定？⟧",
 sent:"新增子網路到 VNet1：{0}\n將 Reader 角色指派給某位使用者以存取 VNet1：{1}",
 dd:[["僅 User1","僅 User3","僅 User1 和 User3","僅 User2 和 User3","User1、User2 和 User3"],
     ["僅 User1","僅 User2","僅 User3","僅 User1 和 User2","僅 User2 和 User3","User1、User2 和 User3"]],
 a:[2,0],
 e:"新增子網路需要對 VNet1 有網路寫入權限，擁有者（User1）與網路參與者（User3）都具備這項權限，所以是「User1 和 User3」；安全性系統管理員（User2）沒有一般資源的寫入權限，無法新增子網路。\n指派角色給別人一定要有 Microsoft.Authorization/roleAssignments/write 權限，只有擁有者（User1）具備，所以只有 User1 能把 Reader 角色指派給別人；安全性系統管理員與網路參與者都沒有指派角色的權限。",
 en:{q:"You have an Azure subscription named Subscription1 that contains a virtual network VNet1.\nYou add the users in the following table.\n| User | Role |\n|---|---|\n| User1 | Owner |\n| User2 | Security Admin |\n| User3 | Network Contributor |\nWhich user can perform each configuration?",
  sent:"Add a subnet to VNet1: {0}\nAssign the Reader role to a user for VNet1: {1}",
  dd:[["User1 only","User3 only","User1 and User3 only","User2 and User3 only","User1, User2, and User3"],
      ["User1 only","User2 only","User3 only","User1 and User2 only","User2 and User3 only","User1, User2, and User3"]],
  e:"Adding a subnet requires write access to the VNet, which Owner and Network Contributor both have; Security Admin does not. Assigning a role to another user requires Microsoft.Authorization/roleAssignments/write, which only Owner has."}},

{n:722, code:"AZ104-Q722", d:1, od:1, k:"dl", t:"鎖定與標籤範圍", tEn:"Locks & tags scope",
 src:"quiz20:229680_ans.png",
 q:"你有下列 Azure 資源：Tenant Root Group → MG1（管理群組）→ Sub1（訂用帳戶）→ RG1（資源群組）→ VM1（虛擬機器）。\n你計畫追蹤資源使用量並防止資源被刪除。\n⟦可以在哪些資源上套用鎖定 (lock) 與標籤 (tag)？⟧",
 sent:"可以套用鎖定 (locks) 的資源範圍：{0}\n可以套用標籤 (tags) 的資源範圍：{1}",
 dd:[["僅 RG1 和 VM1","僅 Sub1 和 RG1","僅 Sub1、RG1 和 VM1","僅 MG1、Sub1、RG1 和 VM1","Tenant Root Group、MG1、Sub1、RG1 和 VM1"],
     ["僅 RG1 和 VM1","僅 Sub1 和 RG1","僅 Sub1、RG1 和 VM1","僅 MG1、Sub1、RG1 和 VM1","Tenant Root Group、MG1、Sub1、RG1 和 VM1"]],
 a:[2,2],
 e:"資源鎖定 (lock) 可以套用在訂用帳戶、資源群組與個別資源上，但不能套用在管理群組 (management group) 上，所以範圍是 Sub1、RG1、VM1 三層。\n標籤 (tag) 同樣可以套用在訂用帳戶、資源群組與資源上，但管理群組不支援標籤，所以答案與鎖定一樣是 Sub1、RG1、VM1。",
 en:{q:"You have the Azure resources shown: Tenant Root Group → MG1 (management group) → Sub1 (subscription) → RG1 (resource group) → VM1 (virtual machine).\nYou plan to track resource usage and prevent the deletion of resources.\nTo which resources can you apply locks and tags?",
  sent:"Locks can be applied to: {0}\nTags can be applied to: {1}",
  dd:[["RG1 and VM1 only","Sub1 and RG1 only","Sub1, RG1, and VM1 only","MG1, Sub1, RG1, and VM1 only","Tenant Root Group, MG1, Sub1, RG1, and VM1"],
      ["RG1 and VM1 only","Sub1 and RG1 only","Sub1, RG1, and VM1 only","MG1, Sub1, RG1, and VM1 only","Tenant Root Group, MG1, Sub1, RG1, and VM1"]],
  e:"Locks can be applied to subscriptions, resource groups, and individual resources, but not to management groups. Tags follow the same scope, since management groups don't support tags either."}},

{n:723, code:"AZ104-Q723", d:1, od:1, k:"dl", t:"IAM 角色範圍", tEn:"IAM role scope",
 src:"quiz20:235200_ans.png",
 q:"你有一個名為 LB1 的 Azure Load Balancer。\n你替一位名為 User1 的使用者指派了下列角色指派 (role assignments)：\n| 角色 | 範圍 |\n|---|---|\n| 使用者存取系統管理員 (User Access Administrator) | 此資源（LB1） |\n| 虛擬機器參與者 (Virtual Machine Contributor) | 資源群組（繼承） |\n⟦請根據圖示資訊，用下拉式選單選出能完成每句敘述的答案。⟧",
 sent:"User1 可以對 LB1 執行：{0}\nUser1 可以對該資源群組執行：{1}",
 dd:[["刪除","建立 NAT 規則","將存取權指派給其他使用者"],
     ["刪除虛擬機器","修改負載平衡規則","部署 AKS 叢集"]],
 a:[2,0],
 e:"User1 在 LB1 這個資源本身被指派了「使用者存取系統管理員」角色，這個角色專門用來管理「誰能存取這個範圍」，也就是可以把存取權指派給其他使用者，但不能修改／刪除資源本身。\nUser1 在上層資源群組（繼承）被指派了「虛擬機器參與者」角色，這個角色可以管理虛擬機器（包含刪除虛擬機器），但不能修改負載平衡器規則或部署 AKS 叢集（那些不屬於 VM Contributor 的權限範圍）。",
 en:{q:"You have an Azure Load Balancer named LB1.\nYou assign a user named User1 the roles shown: User Access Administrator (scope: this resource, LB1); Virtual Machine Contributor (scope: resource group, inherited).\nUse the drop-down menus to select the answer choice that completes each statement based on the graphic.",
  sent:"User1 can [answer choice] LB1: {0}\nUser1 can [answer choice] the resource group: {1}",
  dd:[["delete","create a NAT rule for","assign access to other users for"],
      ["delete a virtual machine from","modify the load balancing rules in","deploy an Azure Kubernetes Service (AKS) cluster to"]],
  e:"User Access Administrator scoped to LB1 lets User1 assign access to others for that resource, but not modify/delete it. Virtual Machine Contributor (inherited from the resource group) lets User1 delete VMs, but not modify load balancer rules or deploy an AKS cluster."}},

{n:724, code:"AZ104-Q724", d:2, od:2, k:"dl", t:"受控識別存取儲存體", tEn:"Managed identity storage access",
 src:"quiz20:240480_ans.png",
 q:"你有一個名為 storage1 的 Azure 儲存體帳戶。\n你有一個 Azure App Service 應用程式 App1，以及一個執行於 Azure 容器執行個體的應用程式 App2。每個應用程式都使用受控識別 (managed identity)。\n你需要確保 App1 與 App2 都能讀取 storage1 中的 Blob，解決方案必須符合以下需求：\n・盡量減少使用的密碼數量。\n・確保 App2 只能在接下來 30 天內讀取 storage1。\n⟦針對每個應用程式，你應該在 storage1 中設定什麼？⟧",
 sent:"App1 應該使用：{0}\nApp2 應該使用：{1}",
 dd:[["存取金鑰 (Access keys)","進階安全性 (Advanced security)","存取控制 (IAM)","共用存取簽章 (SAS)"],
     ["存取金鑰 (Access keys)","進階安全性 (Advanced security)","存取控制 (IAM)","共用存取簽章 (SAS)"]],
 a:[2,3],
 e:"App1 用受控識別，要「盡量少用密碼」，最適合的做法是透過 Azure RBAC（存取控制 IAM）把資料層級角色（例如 Storage Blob Data Reader）指派給 App1 的受控識別，完全不需要任何金鑰或權杖。\nApp2 跑在 Azure 容器執行個體，且要求「只能在未來 30 天內讀取」——這是明確的時間限制，只有共用存取簽章 (SAS) 可以設定到期時間，所以 App2 要用 SAS。\n存取金鑰沒有時間限制而且是帳戶層級的最高權限，不符合兩邊「盡量少用密碼」與「限時」的需求。",
 en:{q:"You have an Azure Storage account named storage1. You have an Azure App Service app named App1 and an app named App2 that runs in an Azure container instance. Each app uses a managed identity.\nYou need to ensure that App1 and App2 can read blobs from storage1. Requirements: minimize the number of secrets used; ensure App2 can only read from storage1 for the next 30 days.\nWhat should you configure in storage1 for each app?",
  sent:"App1 should use: {0}\nApp2 should use: {1}",
  dd:[["Access keys","Advanced security","Access control (IAM)","Shared access signatures (SAS)"],
      ["Access keys","Advanced security","Access control (IAM)","Shared access signatures (SAS)"]],
  e:"App1 should use Access control (IAM) to grant its managed identity a data-plane role, avoiding secrets entirely. App2 needs a time-limited SAS since it must only read for the next 30 days. Access keys have no time limit and grant account-level access, failing both requirements."}},

{n:725, code:"AZ104-Q725", d:2, od:2, k:"dl", t:"建立儲存體帳戶", tEn:"Create storage account",
 src:"quiz20:242400_ans.png",
 q:"你要建立一個 Azure 儲存體帳戶，符合以下需求：\n・盡量省錢\n・支援熱、冷、封存三種 Blob 存取層\n・在託管該帳戶的 Azure 區域發生災難時仍能容錯\n⟦你應該如何完成這道命令？⟧\n\naz storage account create -g RG1 -n storageaccount1 --kind {0} --sku {1}",
 sent:"--kind：{0}\n--sku：{1}",
 dd:[["FileStorage","Storage","StorageV2"],
     ["Standard_GRS","Standard_LRS","Standard_RAGRS","Premium_LRS"]],
 a:[2,0],
 e:"要同時支援熱、冷、封存三種 Blob 存取層，帳戶類型必須是 StorageV2（通用 v2），FileStorage／Storage（通用 v1）都不支援存取層設定。\n要在區域發生災難時仍可容錯，而且要盡量省錢，選 GRS（異地備援儲存體）最符合：GRS 會非同步複寫到配對的次要區域，費用比 RA-GRS（多讀取端點）、Premium_LRS（只在單一區域、成本更高）都低，同時滿足「支援跨區容錯」與「盡量省錢」兩個條件。",
 en:{q:"You need to create an Azure Storage account that: minimizes costs; supports hot, cool, and archive blob tiers; provides fault tolerance if a disaster affects the Azure region where the account resides.\nHow should you complete the command?\n\naz storage account create -g RG1 -n storageaccount1 --kind {0} --sku {1}",
  sent:"--kind: {0}\n--sku: {1}",
  dd:[["FileStorage","Storage","StorageV2"],
      ["Standard_GRS","Standard_LRS","Standard_RAGRS","Premium_LRS"]],
  e:"Blob access tiers require StorageV2. GRS provides cross-region fault tolerance at lower cost than RA-GRS or Premium_LRS, satisfying both the fault-tolerance and cost-minimization requirements."}},

{n:726, code:"AZ104-Q726", d:2, od:2, k:"dd", fix:true, t:"Import/Export 服務", tEn:"Import/Export service",
 src:"quiz20:246000_ans.png",
 q:"你有一個包含儲存體帳戶的 Azure 訂用帳戶。\n你有一台執行 Windows Server 2016 的內部部署伺服器 Server1，裡面有 2 TB 的資料。\n你要透過 Azure Import/Export 服務把資料傳輸到儲存體帳戶。\n⟦你應該依序執行哪些動作？請把清單中所有動作拖曳到答案區並排出正確順序。⟧",
 items:["從 Azure 入口網站更新匯入工作","從 Azure 入口網站建立匯入工作","把外接磁碟接上 Server1，然後執行 waimportexport.exe","從 Server1 卸下外接磁碟，並寄送到 Azure 資料中心"],
 tgt:["第一步","第二步","第三步","第四步"],
 a:[2,1,3,0],
 e:"解法：先把外接磁碟接上 Server1，執行 waimportexport.exe 工具把要傳輸的資料寫入磁碟（同時產生工作所需的中繼資料）；接著從 Azure 入口網站建立匯入工作，登記這批磁碟的資訊；然後把磁碟從 Server1 卸下，寄送到 Azure 資料中心；資料中心收到磁碟、匯入完成後，最後回到入口網站更新匯入工作狀態。",
 en:{q:"You have an Azure subscription that contains a storage account.\nYou have an on-premises server named Server1 that runs Windows Server 2016. Server1 has 2 TB of data.\nYou need to transfer the data to the storage account by using the Azure Import/Export service.\nIn which order should you perform the actions? Move all actions to the answer area and arrange them in the correct order.",
  items:["From the Azure portal, update the import job","From the Azure portal, create an import job","Attach an external disk to Server1 and then run waimportexport.exe","Detach the external disks from Server1 and ship the disks to an Azure data center"],
  tgt:["Step 1","Step 2","Step 3","Step 4"],
  e:"Solution: Attach the disk and run waimportexport.exe to prepare the data and job metadata; create the import job in the Azure portal; detach the disk and ship it to the data center; update the import job in the portal once processed."}},

{n:727, code:"AZ104-Q727", d:2, od:2, k:"hs", t:"Azure File Sync 基礎", tEn:"Azure File Sync basics",
 src:"quiz20:247920_ans.png",
 q:"你的 Azure 訂用帳戶裡有下表所示的 Azure 檔案共用：\n| 名稱 | 所在儲存體帳戶 | 位置 |\n|---|---|---|\n| share1 | storage1 | West US |\n你有下列內部部署伺服器：\n| 名稱 | 資料夾 |\n|---|---|\n| Server1 | D:\\Folder1, E:\\Folder2 |\n| Server2 | D:\\Data |\n你建立了一個名為 Sync1 的 Storage Sync Service，以及一個名為 Group1 的 Azure File Sync 群組，Group1 使用 share1 作為雲端端點。\n你把 Server1 與 Server2 都在 Sync1 中註冊。你把 Server1 上的 D:\\Folder1 新增為 Group1 的伺服器端點。\n⟦以下每項敘述，正確請選「是」，不正確請選「否」。⟧",
 s:["share2 可以新增為 Group1 的另一個雲端端點。",
    "Server1 上的 E:\\Folder2 可以新增為 Group1 的另一個伺服器端點。",
    "Server2 上的 D:\\Data 可以新增為 Group1 的另一個伺服器端點。"],
 a:[0,1,1],
 e:"一個同步群組（sync group）只能有一個雲端端點，Group1 已經用 share1 當雲端端點，所以不能再加 share2（否）。\n一台已註冊的伺服器（Server1）可以在同一個同步群組裡新增多個不同資料夾當伺服器端點，所以 Server1 的 E:\\Folder2 可以再加為 Group1 的另一個伺服器端點（是）。\nServer2 已經在 Sync1 註冊過，同樣可以把它的資料夾（D:\\Data）加為 Group1 的伺服器端點（是）。",
 en:{q:"You have Azure file shares as shown, and on-premises servers as shown. You create a Storage Sync Service named Sync1 and an Azure File Sync group named Group1. Group1 uses share1 as a cloud endpoint. You register Server1 and Server2 in Sync1. You add D:\\Folder1 on Server1 as a server endpoint of Group1.\nFor each statement, select Yes if true, otherwise No.",
  s:["share2 can be added as an additional cloud endpoint for Group1.",
     "E:\\Folder2 on Server1 can be added as an additional server endpoint for Group1.",
     "D:\\Data on Server2 can be added as an additional server endpoint for Group1."],
  e:"A sync group can have only one cloud endpoint, so share2 cannot be added (No). A registered server can contribute multiple server endpoints in the same sync group, so both additional endpoints are allowed (Yes, Yes)."}},

{n:728, code:"AZ104-Q728", d:2, od:2, k:"dd", fix:true, t:"檔案共用 UNC 路徑", tEn:"File share UNC path",
 src:"quiz20:249600_ans.png",
 q:"你有一個名為 Subscription1 的 Azure 訂用帳戶。\n你建立了一個名為 contosostorage 的 Azure 儲存體帳戶，接著建立了一個名為 data 的檔案共用。\n⟦你應該在腳本中使用哪個 UNC 路徑來參照 data 檔案共用？請把正確的值拖曳到對應的目標位置。⟧",
 items:["blob","blob.core.windows.net","contosostorage","data","file","file.core.windows.net","portal.azure.com","subscription1"],
 tgt:["\\\\【儲存體帳戶名稱】.","【服務端點】\\【檔案共用名稱】"],
 a:[2,4],
 e:"Azure 檔案共用的 UNC 路徑格式是 \\\\<儲存體帳戶名稱>.file.core.windows.net\\<共用名稱>，所以要填入 contosostorage（帳戶名稱）與 data（共用名稱），中間固定接 file.core.windows.net 服務端點。\n・blob / blob.core.windows.net 是 Blob 儲存體的端點，不是檔案共用（SMB）用的。\n・portal.azure.com、subscription1 與 UNC 路徑無關。",
 en:{q:"You have an Azure subscription named Subscription1. You create an Azure Storage account named contosostorage, then create a file share named data.\nWhich UNC path should you use to reference the data file share in a script?",
  items:["blob","blob.core.windows.net","contosostorage","data","file","file.core.windows.net","portal.azure.com","subscription1"],
  tgt:["\\\\[storage account name].","[service endpoint]\\[file share name]"],
  e:"An Azure file share UNC path follows \\\\<storage account>.file.core.windows.net\\<share name>, so the answer is contosostorage and data with the fixed file.core.windows.net endpoint in between."}},

{n:729, code:"AZ104-Q729", d:2, od:2, k:"dl", t:"AzCopy 建立容器", tEn:"AzCopy create container",
 src:"quiz20:251520_ans.png",
 q:"你有一個包含 Azure 儲存體帳戶的 Azure 訂用帳戶。\n你打算把一台內部部署虛擬機器映像複製到一個名為 vmimages 的容器。\n你需要為這個計畫中的映像建立容器。\n⟦你應該執行哪個命令？⟧\n\nazcopy {0} 'https://mystorageaccount.{1}.core.windows.net/vmimages'",
 sent:"azcopy {0}\n目標網址的服務端點：{1}",
 dd:[["make","sync","copy"],
     ["blob","dfs","queue","table","images","file"]],
 a:[0,0],
 e:"建立一個新的容器要用 azcopy make 指令；要建立 Blob 容器，目標網址要用 blob 服務端點（blob.core.windows.net），不是 dfs（Data Lake）、queue、table 或 file（檔案共用）端點。",
 en:{q:"You have an Azure subscription that contains an Azure Storage account.\nYou plan to copy an on-premises virtual machine image to a container named vmimages.\nYou need to create the container for the planned image.\nWhich command should you run?\n\nazcopy {0} 'https://mystorageaccount.{1}.core.windows.net/vmimages'",
  sent:"azcopy {0}\nService endpoint: {1}",
  dd:[["make","sync","copy"],
      ["blob","dfs","queue","table","images","file"]],
  e:"azcopy make creates a new container. Since it's a blob container, the endpoint must be blob.core.windows.net."}},

{n:730, code:"AZ104-Q730", d:2, od:2, k:"dl", t:"File Sync 雲端分層", tEn:"File Sync cloud tiering",
 src:"quiz20:253200_ans.png",
 q:"你有一個 Azure File Sync 群組，包含下表所示的端點：\n| 名稱 | 類型 |\n|---|---|\n| Endpoint1 | 雲端端點 |\n| Endpoint2 | 伺服器端點 |\n| Endpoint3 | 伺服器端點 |\nEndpoint3 已啟用雲端分層 (cloud tiering)。\n你在 Endpoint1 新增了一個名為 File1 的檔案，並在 Endpoint2 新增了一個名為 File2 的檔案。\n⟦新增這些檔案後的 24 小時內，File1 與 File2 會出現在哪些端點？⟧",
 sent:"File1：{0}\nFile2：{1}",
 dd:[["僅 Endpoint1 only","僅 Endpoint3","Endpoint2 和 Endpoint3","Endpoint1、Endpoint2 和 Endpoint3"],
     ["僅 Endpoint2","僅 Endpoint3","Endpoint2 和 Endpoint3","Endpoint1、Endpoint2 和 Endpoint3"]],
 a:[1,3],
 e:"同步群組裡的所有端點最終都會同步到彼此，24 小時內三個端點都會拿到 File1 與 File2 的中繼資料／內容，差別只在於「本機是否保留完整檔案內容」：\nEndpoint3 啟用了雲端分層，磁碟空間不足時會把不常用的檔案內容換成只留下指標（stub），但檔案本身仍然「存在」於該端點（可透過指標隨選下載），所以 File1 會出現在 Endpoint3（可能是 stub 形式，但仍算存在）；本題選項設計上把「出現」對應到雲端端點與有分層的端點，Endpoint1、Endpoint2 這種一般伺服器端點是完整檔案同步。\nFile2 則同步到全部三個端點（Endpoint1、Endpoint2、Endpoint3）。",
 en:{q:"You have an Azure File Sync group with the endpoints shown. Cloud tiering is enabled for Endpoint3. You add File1 to Endpoint1 and File2 to Endpoint2.\nOn which endpoints will File1 and File2 be available within 24 hours?",
  sent:"File1: {0}\nFile2: {1}",
  dd:[["Endpoint1 only","Endpoint3 only","Endpoint2 and Endpoint3","Endpoint1, Endpoint2, and Endpoint3"],
      ["Endpoint2 only","Endpoint3 only","Endpoint2 and Endpoint3","Endpoint1, Endpoint2, and Endpoint3"]],
  e:"All endpoints in a sync group eventually sync with each other; cloud tiering only affects whether the local copy is a full file or a tiered stub, not whether the file is available."}},

{n:731, code:"AZ104-Q731", d:2, od:2, k:"dl", t:"儲存體防火牆", tEn:"Storage firewall & VNet",
 src:"quiz20:255120_ans.png",
 q:"你有多台 Azure 虛擬機器連接到一個名為 VNet1 的虛擬網路。\n你依照下圖設定了一個 Azure 儲存體帳戶：允許存取設為「選取的網路」，只加入了 VNet1 的 Prod 子網路（位址範圍 10.2.0.0/24，已啟用服務端點），VNet1 本身的位址範圍是 10.2.0.0/16；「允許受信任的 Microsoft 服務存取此儲存體帳戶」等例外選項均未勾選。\n⟦請根據圖示資訊，用下拉式選單選出能完成每句敘述的答案。⟧",
 sent:"位於 10.2.9.0/24 子網路的虛擬機器，{0}能連線到該儲存體帳戶裡的檔案共用。\nAzure Backup {1}能備份該儲存體帳戶裡虛擬機器的非受控磁碟。",
 dd:[["永遠","僅備份期間","絕不"],
     ["永遠","僅備份期間","絕不"]],
 a:[2,2],
 e:"儲存體防火牆設定成只允許「選取的網路」，而且清單裡只加入並啟用了 Prod 子網路（10.2.0.0/24）的服務端點，10.2.9.0/24 並不在允許清單中，所以該子網路的 VM 永遠連不到檔案共用（絕不）。\nAzure Backup 這類「受信任的 Microsoft 服務」要繞過儲存體防火牆，必須勾選「允許受信任的 Microsoft 服務存取此儲存體帳戶」例外，題目設定裡這個選項並未勾選，所以 Azure Backup 也絕不能存取、備份這個帳戶裡的非受控磁碟。",
 en:{q:"You have several Azure virtual machines on VNet1. You configure an Azure Storage account as shown in the exhibit (firewall set to selected networks, only the Prod subnet 10.2.0.0/24 enabled; trusted Microsoft services exception not checked).\nUse the drop-down menus to select the answer choice that completes each statement.",
  sent:"VMs on the 10.2.9.0/24 subnet will have network connectivity to the file shares in the storage account {0}.\nAzure Backup will be able to back up the unmanaged hard disks of the VMs in the storage account {1}.",
  dd:[["always","during a backup","never"],
      ["always","during a backup","never"]],
  e:"10.2.9.0/24 is not in the allowed subnet list, so connectivity is never available. Since the trusted Microsoft services exception is not checked, Azure Backup can never bypass the firewall either."}},

{n:732, code:"AZ104-Q732", d:2, od:2, k:"hs", t:"File Sync 衝突處理", tEn:"File Sync conflict handling",
 src:"quiz20:256800_ans.png",
 q:"你有一個名為 Sync1 的同步群組，含一個雲端端點，雲端端點裡已有一個名為 File1.txt 的檔案。\n你的內部部署網路有多台執行 Windows Server 2016 的伺服器，設定如下表：\n| 伺服器 | 共用 | 共用內容 |\n|---|---|---|\n| Server1 | Share1 | File1.txt, File2.txt |\n| Server2 | Share2 | File2.txt, File3.txt |\n你把 Share1 新增為 Sync1 的端點。一小時後，你把 Share2 新增為 Sync1 的端點。\n⟦以下每項敘述，正確請選「是」，不正確請選「否」。⟧",
