const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sameSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));

/* 題庫撰寫時正確答案都排在最前面，每輪重洗選項順序並重新對應答案索引，
   否則「一律選 A」就會全對。
   -----------------------------------------------------------------
   第二個參數 p 是先前洗牌的結果：帶進來就照著洗回一模一樣的順序，
   關掉瀏覽器再回來才有辦法把「你選的是第幾個選項」對回同一個選項。
   洗完會把用到的順序記在 q._p，存進度時就是存這個。 */
function permuteOptions(q, p){
  /* 有存過就重播，沒有（或長度對不上，題庫被改過）就重新洗 */
  const pick = (n, saved) =>
    (Array.isArray(saved) && saved.length === n && saved.every(v => Number.isInteger(v) && v >= 0 && v < n))
      ? saved.slice()
      : shuffle(Array.from({length:n}, (_,i)=>i));

  switch(kindOf(q)){

  /* --- HOTSPOT 是非表：洗敘述的順序 ---------------------------------
     每一句各自作答，順序不帶答案資訊；但洗過之後就沒辦法把整題背成
     「YNY」這種答案樣式，必須真的逐句判斷。 */
  case "hs": {
    if(q.s.length <= 1) return;
    const order = pick(q.s.length, p && p.s);
    q.s = order.map(i => q.s[i]);
    q.a = order.map(i => q.a[i]);
    if(q.en && q.en.s) q.en.s = order.map(i => q.en.s[i]);
    q._p = {s:order};
    return;
  }

  /* --- DRAG DROP 配對：可拖曳項目與答案區兩邊都洗 ------------------- */
  case "dd": {
    const iOrd = pick(q.items.length, p && p.i);          // iOrd[新位置] = 舊索引
    q.items = iOrd.map(i => q.items[i]);
    if(q.en && q.en.items) q.en.items = iOrd.map(i => q.en.items[i]);
    q.a = q.a.map(old => iOrd.indexOf(old));              // 答案改指向新的項目位置
    /* q.fix：答案區的上下順序本身就是題意（例如縱深防禦由外而內的巢狀分層），
       這種題目只洗可拖曳的項目，答案區維持原順序 */
    let tOrd = null;
    if(q.tgt.length > 1 && !q.fix){
      tOrd = pick(q.tgt.length, p && p.t);
      q.tgt = tOrd.map(i => q.tgt[i]);
      q.a   = tOrd.map(i => q.a[i]);
      if(q.en && q.en.tgt) q.en.tgt = tOrd.map(i => q.en.tgt[i]);
    }
    q._p = {i:iOrd, t:tOrd};
    return;
  }

  /* --- HOTSPOT 下拉：每一格各自洗自己的選項清單 --------------------- */
  case "dl": {
    const ords = [];
    q.dd.forEach((list, g)=>{
      if(list.length <= 1){ ords[g] = null; return; }
      const order = pick(list.length, p && p.d && p.d[g]);
      q.dd[g] = order.map(i => list[i]);
      if(q.en && q.en.dd && q.en.dd[g]) q.en.dd[g] = order.map(i => q.en.dd[g][i]);
      q.a[g] = order.indexOf(q.a[g]);
      ords[g] = order;
    });
    q._p = {d:ords};
    return;
  }

  /* --- 單選／複選：是非題（只有兩個選項）維持原順序，才對得上原文件的 A/B --- */
  default: {
    /* q.fix：選項的順序本身就是題目的一部分——答案區是入口網站的截圖
       （側欄、設定清單、刀鋒節點、工具列、服務磁磚），原廠考試給的就是那個畫面，
       洗過就跟文件對不起來了。有 ico 的題目基本上都該設 fix。 */
    if(q.o.length <= 2 || q.fix) return;
    const order = pick(q.o.length, p && p.o);          // order[新位置] = 舊索引
    q.o = order.map(i => q.o[i]);
    if(q.en && q.en.o) q.en.o = order.map(i => q.en.o[i]);   // 英文選項必須跟著一起換位
    if(q.ico) q.ico = order.map(i => q.ico[i]);              // 服務圖示也要，不然洗完圖會對到別的選項
    q.a = q.a.map(old => order.indexOf(old)).sort((x,y)=>x-y);
    q._p = {o:order};
  }
  }
}

function poolFor(tab){
  if(tab === TAB_WRONG) return BANK.filter(q => wrongSet.has(q.q));
  if(tab === TAB_STAR)  return BANK.filter(q => starSet.has(q.q));
  if(tab === 0) return BANK.slice();
  return BANK.filter(q => q.d === tab);
}

/* =====================================================================
   分頁進度：每個分頁（連同題庫來源）各自記住自己做到哪
   -----------------------------------------------------------------
   出題時每一題都複製一份再洗選項，洗到的是複本而不是題庫本體，
   所以「01 洗牌」不會把「02 已經作答的選項編號」對應到別的答案去。
   進度只在兩種情況歸零：這個分頁的題目全部做完，或自己按「重新開始」。
   ===================================================================== */
const cloneQ = typeof structuredClone === "function"
  ? (q => structuredClone(q))
  : (q => JSON.parse(JSON.stringify(q)));

const SESS = {};                                  /* key -> 該分頁的進度 */
const sessKey = () => S.src + ":" + S.tab;

/* 題目在題庫裡的位置：存進度時只存編號，不存整份題目，才不會塞爆 localStorage */
let bankPos = null, bankPosOf = null;
function posOf(q){
  if(bankPosOf !== BANK){ bankPos = new Map(); BANK.forEach((x,i)=>bankPos.set(x,i)); bankPosOf = BANK; }
  const v = bankPos.get(q);
  return v === undefined ? -1 : v;
}

/* 題庫指紋：題庫改過（加題、改字）就讓舊進度自動作廢，
   免得存下來的題號對到別題、答案全部錯位 */
const SIG = new WeakMap();
function sigOf(bank){
  if(SIG.has(bank)) return SIG.get(bank);
  let h = 5381;
  for(const q of bank){
    const s = q.q;
    for(let i=0;i<s.length;i++) h = (((h * 33) ^ s.charCodeAt(i)) >>> 0);
  }
  const sig = bank.length + "." + h.toString(36);
  SIG.set(bank, sig);
  return sig;
}

/* ---- 進度存進 localStorage：關掉瀏覽器隔天回來還接得下去 ---- */
const SESS_PREFIX = "az104.sess.v1|";
const sessLS = (src, tab) => SESS_PREFIX + src + "|" + tab;

function sessToJSON(s){
  const n = s.pool.length;
  return {
    n: s.pool.map(q => q._n),                       /* 出過哪些題、什麼順序 */
    p: s.pool.map(q => q._p || 0),                  /* 每題的選項洗牌結果 */
    a: Array.from({length:n}, (_,i) => s.answers[i] || null),
    g: Array.from({length:n}, (_,i) => s.gr[i] ? (s.gr[i].reveal ? 2 : 1) : 0),
    i: s.idx, r: s.right, t: s.total
  };
}
function sessFromJSON(o, bank){
  if(!o || !Array.isArray(o.n) || !o.n.length) return null;
  const pool = [];
  for(let k=0;k<o.n.length;k++){
    const src = bank[o.n[k]];
    if(!src) return null;                           /* 題號對不上就整份作廢 */
    const c = cloneQ(src); c._n = o.n[k];
    permuteOptions(c, (o.p && o.p[k]) || null);
    pool.push(c);
  }
  const trim = a => { while(a.length && a[a.length-1] === undefined) a.pop(); return a; };
  return {
    pool,
    idx:   Math.min(Math.max(o.i|0, 0), pool.length - 1),
    answers: trim((o.a || []).map(a => Array.isArray(a) ? a : undefined)),
    gr:      trim((o.g || []).map(g => g ? {reveal: g === 2} : undefined)),
    right: o.r|0, total: o.t|0
  };
}

function persistSess(src, tab){
  try{
    const s = SESS[src + ":" + tab];
    /* 還停在第 1 題、也還沒作答，就不算進度：不寫檔，免得每次開頁面都留一份 */
    if(!s || !s.pool.length || (!s.idx && !s.total)){ localStorage.removeItem(sessLS(src, tab)); return; }
    const o = sessToJSON(s);
    o.sig = sigOf(src === "mine" ? BANK_MINE : BANK_DOC);
    localStorage.setItem(sessLS(src, tab), JSON.stringify(o));
  }catch(e){}                                       /* 空間不夠就只留在記憶體裡 */
}

function restoreSessions(){
  ["mine","doc"].forEach(src=>{
    const bank = src === "mine" ? BANK_MINE : BANK_DOC;
    if(!bank.length) return;
    const sig = sigOf(bank);
    for(let tab=0; tab<=TAB_MAX; tab++){
      let raw = null;
      try{ raw = localStorage.getItem(sessLS(src, tab)); }catch(e){ return; }
      if(!raw) continue;
      let s = null;
      try{
        const o = JSON.parse(raw);
        if(o.sig === sig) s = sessFromJSON(o, bank);
      }catch(e){}
      if(s) SESS[src + ":" + tab] = s;
      else try{ localStorage.removeItem(sessLS(src, tab)); }catch(e){}
    }
  });
}

function saveSess(){
  if(S.exam || !S.pool.length) return;
  SESS[sessKey()] = {
    pool:S.pool, idx:S.idx, answers:S.answers, gr:S.gr,
    right:S.right, total:S.total
  };
  persistSess(S.src, S.tab);
}
function loadSess(){
  const s = SESS[sessKey()];
  if(!s || !s.pool.length) return false;
  /* 錯題本／星號題的內容會隨著作答與打星號變動：
     回到這個分頁時，把新符合條件、之前沒出過的題目補到隊伍最後面，
     已經做過的進度照樣保留。 */
  if(S.tab === TAB_WRONG || S.tab === TAB_STAR){
    const have = new Set(s.pool.map(q => q.q));
    poolFor(S.tab).forEach(q=>{
      if(have.has(q.q)) return;
      const c = cloneQ(q); c._n = posOf(q); permuteOptions(c); s.pool.push(c);
    });
  }
  S.pool = s.pool; S.idx = s.idx; S.answers = s.answers; S.gr = s.gr;
  S.right = s.right; S.total = s.total;
  if(S.idx >= S.pool.length) S.idx = S.pool.length - 1;   /* 補題後回到最後一題 */
  return true;
}
const dropSess = () => {
  delete SESS[sessKey()];
  try{ localStorage.removeItem(sessLS(S.src, S.tab)); }catch(e){}
};

/* 分頁上的小圓點：標出哪些分頁還有沒做完的進度 */
function paintTabProgress(){
  document.querySelectorAll("nav.tabs button").forEach((b,i)=>{
    const s = SESS[S.src + ":" + i];
    /* 剛開一輪、還停在第 1 題又沒作答，就不算「有進度」，免得每個分頁都亮點 */
    const on = !!(s && s.pool.length && (s.idx > 0 || s.total > 0));
    let dot = b.querySelector(".dot");
    if(!on){ if(dot) dot.remove(); return; }
    if(!dot){ dot = document.createElement("i"); dot.className = "dot"; b.append(dot); }
    dot.title = S.lang === "en"
      ? `in progress — question ${s.idx+1} of ${s.pool.length}`
      : `還沒做完 · 做到第 ${s.idx+1} / ${s.pool.length} 題`;
  });
}

/* =====================================================================
   出題
   ===================================================================== */
/* fresh=true 代表「重新開始」：丟掉舊進度重新洗牌 */
function startRound(fresh){
  stopTimer();
  closeOverview();
  S.ended = false;
  S.flags = []; S.notes = [];
  report.classList.remove("show"); report.innerHTML = "";

  /* 練習模式：先看看這個分頁有沒有沒做完的進度，有就接著做 */
  if(!S.exam && !fresh && loadSess()){ S.logged = false; renderQ(); return; }

  /* 按「重新開始」把做到一半的進度丟掉之前，先把這一輪的成績封存起來 */
  if(fresh && !S.exam && S.pool.length) logRound(null);

  S.idx = 0; S.right = 0; S.total = 0;
  S.answers = []; S.gr = []; S.logged = false;
  const build = list => list.map(q=>{
    const c = cloneQ(q); c._n = posOf(q); permuteOptions(c); return c;
  });
  if(S.exam){
    /* 模擬考一律隨機抽題，不看設定裡的出題順序——真的考試就是隨機的 */
    S.pool = build(shuffle(BANK.slice()).slice(0, Math.min(EXAM_N, BANK.length)));
    startTimer();
  } else {
    dropSess();
    /* 練習：依設定決定順序。seq＝題庫本身的順序（文件題庫就是 #1、#2… 照題號排），
       rand＝洗牌打散，免得照著題號背答案。選項順序照樣每輪重洗，不受這裡影響。 */
    const list = poolFor(S.tab);
    S.pool = build(S.order === "rand" ? shuffle(list) : list);
  }
  renderQ();
}

function renderQ(){
  verdict.className = "verdict"; verdict.textContent = "";
  expl.className = "expl"; expl.innerHTML = "";
  S.ans = []; S.graded = false;
  qbox.innerHTML = ""; qtools.innerHTML = "";

  if(!S.pool.length){
    const en = S.lang === "en";
    eyebrow.textContent = S.tab === TAB_WRONG ? (en?"Review list":"錯題本")
                        : S.tab === TAB_STAR ? (en?"Starred":"星號題")
                        : (en?"No questions":"沒有題目");
    scoreEl.textContent = "0 / 0";
    barFill.style.width = "0%";
    starBtn.hidden = true;
    const docEmpty = S.src === "doc" && !BANK_DOC.length;
    qbox.innerHTML = '<div class="empty">' +
      (docEmpty
        ? (en ? "The document question bank has not been imported yet."
              : "文件題庫還沒有匯入題目。<br>轉錄完成後這裡就會出現題目，切回「自製題庫」可以照常練習。")
        : S.tab === TAB_WRONG
        ? (en ? "Your review list is empty.<br>Anything you answer incorrectly elsewhere lands here for a focused retry."
              : "錯題本目前是空的。<br>在其他分頁答錯的題目會自動收進來，可以之後專門重練。")
        : S.tab === TAB_STAR
        ? (en ? "You have not starred anything yet.<br>Hit ☆ on any question to file it here for extra drilling."
              : "還沒有打星號的題目。<br>在任何一題按「☆ 加強練習」，那一題就會收進這裡專門加強。")
        : (en ? "No questions in this category." : "這個分類沒有題目。")) + "</div>";
    setActions();
    paintTabProgress();
    return;
  }
  if(S.idx >= S.pool.length){ finishRound(); return; }

  const q = S.pool[S.idx];
  const V = view(q);
  const multi = kindOf(q) === "mc" && q.a.length > 1;
  const EN = S.lang === "en";
  S.ans = blankAns(q);

  eyebrow.textContent = (S.exam ? (EN ? "Mock exam · " : "模擬考 · ") : "") +
    (EN ? `Q ${S.idx+1} / ${S.pool.length} · ${dname(q.d)}`
        : `第 ${S.idx+1} / ${S.pool.length} 題 · ${dname(q.d)}`);
  scoreEl.textContent = S.exam
    ? (EN ? `answered ${answeredCount()} / ${S.pool.length}` : `已作答 ${answeredCount()} / ${S.pool.length}`)
    : `${S.right} / ${S.total}`;
  barFill.style.width = ((S.idx) / S.pool.length * 100).toFixed(1) + "%";

  const p = document.createElement("div");
  p.className = "prompt";
  const meta = document.createElement("p");
  meta.className = "meta";
  meta.textContent = `${dname(q.d)} · ${(EN && q.tEn) ? q.tEn : q.t}`
                   + (hasSrc(q) ? ` · ${srcLabel(q, EN)}` : "");
  /* 這一題是把第一版拆開的子題合併還原回來的，不是直接從原始文件轉錄。
     還沒回頭逐字核對前先標出來，讓作答的人知道措辭可能與原文有出入。 */
  /* q.ext：這一題**不在原始 PDF 裡**（作者當初沒收錄那個題號），是由外部來源補進來的。
     不能用 mg/vf 表示——那兩個的意思分別是「子題合併還原」與「已與原始文件核對」，
     對這種題目都不成立。給它自己的徽章，讓作答的人一眼分得出來源。 */
  if(q.mg || q.ext){
    const chk = document.createElement("span");
    chk.className = "chk " + (q.ext ? "ext" : (q.vf ? "done" : "wait"));
    chk.textContent = q.ext ? (EN ? "＋ not in the source PDF" : "＋ 原文件沒有，外部補入")
                    : q.vf  ? (EN ? "✓ checked against source" : "✓ 已核對原文")
                            : (EN ? "⚠ not yet checked" : "⚠ 尚未核對原文");
    chk.title = q.ext
      ? (EN ? "This question number is absent from the source PDF; the item was recovered from external question banks. See the box below for what was found and how reliable it is."
            : "這個題號在原始 PDF 裡是空的，本題是由外部題庫來源補進來的。點開下方對照框可以看到找到了什麼、可信度如何。")
      : q.vf
      ? (EN ? "This item was rebuilt from split sub-questions and has since been checked word-for-word against the original document."
            : "這一題是由拆開的子題合併還原的，已回頭與原始文件逐字核對過。")
      : (EN ? "This item was rebuilt from split sub-questions and has not yet been checked against the original document — the wording may differ slightly. The answer itself is unaffected."
            : "這一題是由拆開的子題合併還原的，還沒回頭與原始文件核對，措辭可能與原文略有出入。答案本身不受影響。");
    /* 存了原文就讓徽章可以點，切出原始文件的樣子對照 */
    if(q.v0){
      chk.classList.add("act");
      chk.setAttribute("role","button");
      chk.tabIndex = 0;
      const toggle = ()=>{
        const box = qbox.querySelector(".v0box");
        if(box) box.classList.toggle("show");
      };
      chk.addEventListener("click", toggle);
      chk.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
    }
    meta.append(chk);
  }
  /* 題目本文用換行分段：制式前言自成一行，真正的題目與「解法：」各自另起一段 */
  p.append(meta);
  String(V.q).split("\n").forEach(seg=>{
    seg = seg.trim();
    if(!seg) return;
    const isNote = /^(注意：|Note:|（原題|DRAG DROP)/.test(stripHl(seg));
    const line = document.createElement("p");
    line.className = isNote ? "qnote" : "qtext";
    paintHl(line, seg);
    p.append(line);
  });
  /* 題目裡的表格（原題就有一張表，例如 #187 的電腦與作業系統對照）。
     只是題目的一部分，不能選，也不參與洗牌。 */
  const TB = (EN && q.en && q.en.tbl) ? q.en.tbl : q.tbl;
  if(TB){
    const t = document.createElement("table");
    t.className = "qtbl";
    const th = document.createElement("tr");
    TB.h.forEach(c=>{ const e = document.createElement("th"); e.textContent = c; th.append(e); });
    t.append(th);
    TB.r.forEach(row=>{
      const tr = document.createElement("tr");
      row.forEach(c=>{ const e = document.createElement("td"); paintHl(e, c); tr.append(e); });
      t.append(tr);
    });
    p.append(t);
  }

  multiBadge = null;
  if(multi){
    const m = document.createElement("span");
    m.className = "multi"; m.dataset.need = q.a.length;
    p.append(m);
    multiBadge = m;      /* 文字交給 paintMulti()，它會一併顯示「已選 x」 */
  }
  qbox.append(p);

  /* 原文對照框：預設收起，點題頭的核對徽章才展開 */
  if(q.v0){
    const v0 = document.createElement("div");
    v0.className = "v0box";
    const lab = document.createElement("span");
    lab.className = "lab";
    lab.textContent = EN ? "Original wording in the source document" : "原始文件上的樣子";
    v0.append(lab, document.createTextNode(q.v0));
    qbox.append(v0);
  }

  /* 回頭看已作答的題目時（模擬考的「上一題」、練習模式的「上一題」）還原先前的作答 */
  if(S.answers[S.idx]) S.ans = S.answers[S.idx].slice();

  renderTools(q, EN);
  paintStar();
  ({hs:renderHS, dd:renderDD, dl:renderDL}[kindOf(q)] || renderMC)(q, V, EN);
  setActions();
  paintMulti();

  /* 練習模式翻回批改過的題目：直接把當時的判定與解析重新畫出來，但不再重複計分 */
  if(!S.exam && S.gr[S.idx]) grade(S.gr[S.idx].reveal, false);

  saveSess();
  paintTabProgress();
}

/* ---------- 星號：練習模式限定，放在題目列上的小圖示鈕 ---------- */
function paintStar(){
  const q = S.pool[S.idx];
  const on = !!(q && starSet.has(q.q));
  const show = !!q && !S.exam && !report.classList.contains("show");
  starBtn.hidden = !show;
  if(!show) return;
  starBtn.setAttribute("aria-pressed", String(on));
  starBtn.textContent = on ? "★" : "☆";
  starBtn.title = S.lang === "en"
    ? (on ? "Starred — tap to remove from the Starred tab"
          : "Star this question so you can drill it in the Starred tab")
    : (on ? "已收進「星號題」分頁，再按一次取消"
          : "加強練習：把這題收進「星號題」分頁");
}
starBtn.addEventListener("click", ()=>{
  const q = S.pool[S.idx];
  if(!q) return;
  if(starSet.has(q.q)) starSet.delete(q.q); else starSet.add(q.q);
  saveStar();
  paintStar();
  /* 正在星號題分頁裡取消星號：這一輪照樣做完，換一輪才會消失 */
});

/* ---------- 題目上方的工具列 ----------------------------------------
   兩種模式的工具是分開的，不互相混用：
   ・練習模式＝★ 星號（長期保存，之後在「星號題」分頁專門加強）
   ・模擬考　＝⚑ 標記待複習＋備註（只屬於這一次考試，交卷後隨檢討一起看）
   兩種模式都可以用「上一題」翻回去。 */
function renderTools(q, EN){
  qtools.innerHTML = "";
  if(!q) return;

  /* 練習模式的星號在題目列上（見 paintStar），這裡只處理模擬考的標記與備註 */
  if(!S.exam) return;

  /* ---- 模擬考：仿原廠的「標記待複習」，交卷前可以從總覽跳回來重看 ---- */
  const flag = document.createElement("button");
  flag.type = "button"; flag.className = "tbtn flag";
  const note = document.createElement("textarea");
  note.className = "notebox";
  note.placeholder = EN ? "Optional note — what made you unsure? (visible on the review screen)"
                        : "備註（選填）：哪裡卡住、在猶豫哪兩個選項……交卷前的總覽看得到";
  note.value = S.notes[S.idx] || "";
  note.addEventListener("input", ()=>{ S.notes[S.idx] = note.value; });

  const paintFlag = ()=>{
    const on = !!S.flags[S.idx];
    flag.setAttribute("aria-pressed", String(on));
    flag.textContent = on ? (EN ? "⚑ Flagged for review" : "⚑ 已標記待複習")
                          : (EN ? "⚑ Flag for review"    : "⚑ 標記待複習");
    note.hidden = !on;
  };
  flag.title = EN ? "Mark this question so you can come back to it before submitting"
                  : "把這題標記起來，交卷前可以從「作答總覽」跳回來再看一次";
  flag.addEventListener("click", ()=>{
    S.flags[S.idx] = !S.flags[S.idx];
    paintFlag();
    if(S.flags[S.idx]) note.focus();
  });
  paintFlag();
  qtools.append(flag, note);
}

/* ---------- 複選題的「需選 N 項」徽章 --------------------------------
   原廠考試對複選題是硬性的：選滿 N 項才放你走，也不讓你多選第 N+1 項。
   這裡把規則做出來，順便把「已選幾項」即時寫在徽章上。 */
let multiBadge = null, multiTimer = 0;
function paintMulti(){
  const m = multiBadge;
  if(!m) return;
  clearTimeout(multiTimer);
  const need = +m.dataset.need, got = S.ans.length, EN = S.lang === "en";
  m.textContent = EN ? `select ${need} · ${got} selected` : `需選 ${need} 項 · 已選 ${got}`;
  m.classList.remove("warn");
  m.classList.toggle("done", got === need);
}
/* 擋下來的時候閃一下徽章，並把原因寫上去，過幾秒自己還原 */
function bumpMulti(msg){
  const m = multiBadge;
  if(!m) return;
  clearTimeout(multiTimer);
  m.classList.remove("warn"); void m.offsetWidth;   /* 重播動畫 */
  m.classList.add("warn");
  m.textContent = msg;
  multiTimer = setTimeout(paintMulti, 2200);
}
/* 沒選滿就想繼續：擋住並說明還差幾項 */
function nagMulti(q){
  const EN = S.lang === "en", need = mcNeed(q), got = S.ans.length;
  verdict.className = "verdict show fail";
  verdict.textContent = got < need
    ? (EN ? `This question needs ${need} selections — you have ${got}. Pick ${need - got} more before moving on.`
          : `這題需選 ${need} 項，目前只選了 ${got} 項，再選 ${need - got} 項才能繼續。`)
    : (EN ? `This question needs exactly ${need} selections — you have ${got}. Deselect ${got - need}.`
          : `這題只能選 ${need} 項，目前選了 ${got} 項，請取消 ${got - need} 項。`);
  bumpMulti(EN ? `${got} / ${need} selected` : `已選 ${got} / ${need} 項`);
  verdict.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* 作答有變動時：把答案存起來，模擬考另外更新「已作答」計數 */
const answeredCount = () => S.pool.filter((q,i) => ansDone(q, S.answers[i])).length;
function ansChanged(){
  S.answers[S.idx] = S.ans.slice();
  paintMulti();
  /* 補齊之後，把剛才「還差幾項」的提醒收掉（批改後的判定不能動） */
  if(!S.graded && verdict.classList.contains("show")) verdict.className = "verdict";
  if(!S.exam) return;
  const n = answeredCount();
  scoreEl.textContent = S.lang === "en"
    ? `answered ${n} / ${S.pool.length}` : `已作答 ${n} / ${S.pool.length}`;
}

/* ---------- 單選／複選 ---------- */
function renderMC(q, V, EN){
  const multi = q.a.length > 1;
  const box = document.createElement("div");
  /* q.look：原題的答案區長什麼樣子就照著畫。
     "nav"   入口網站的深色左側欄（#168）
     "icons" 只有圖示、沒有文字的工具列（#215）——原廠考試就只給一張圖，
             名稱只留在 aria-label 與成績單裡，作答時看不到，才不會變成送分題 */
  box.className = "opts" + (q.look ? " look-" + q.look : "");
  V.o.forEach((text, i)=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    b.setAttribute("aria-pressed","false"); b.dataset.i = i;
    const k = document.createElement("span");
    k.className = "key"; k.textContent = LETTER[i];
    const t = document.createElement("span");
    t.textContent = stripHl(text);      /* 選項一律不標，免得直接洩題 */
    /* 原題的答案區是入口網站的服務列，有存圖示就一起畫出來 */
    if(q.ico && q.ico[i]){
      const im = document.createElement("img");
      im.className = "oico"; im.src = q.ico[i];
      if(q.look === "icons"){
        /* 只給圖：名稱不顯示，但要留給螢幕報讀與鍵盤操作 */
        im.alt = stripHl(text);
        b.setAttribute("aria-label", LETTER[i] + "　" + stripHl(text));
        b.title = stripHl(text);
        b.append(k, im);
      }
      else { im.alt = ""; b.append(k, im, t); }   /* 名稱就在旁邊，圖示純裝飾 */
    }
    else b.append(k, t);
    b.addEventListener("click", ()=>{
      if(S.graded) return;
      const at = S.ans.indexOf(i);
      if(multi){
        if(at >= 0) S.ans.splice(at,1);
        /* 已經選滿 N 項＝不再吃第 N+1 項，跟原廠考試一樣要先取消一個 */
        else if(S.ans.length >= q.a.length){
          bumpMulti(EN ? `select ${q.a.length} — deselect one first`
                       : `最多 ${q.a.length} 項，請先取消一個`);
          return;
        }
        else S.ans.push(i);
      }
      else S.ans = [i];
      S.ans.sort((x,y)=>x-y);
      [...box.children].forEach(c => c.setAttribute("aria-pressed", S.ans.includes(+c.dataset.i)));
      ansChanged();
    });
    box.append(b);
  });
  qbox.append(box);
  [...box.children].forEach(c => c.setAttribute("aria-pressed", S.ans.includes(+c.dataset.i)));
}

/* ---------- HOTSPOT 是非表：每一句各自選「是 / 否」 ---------- */
function renderHS(q, V, EN){
  const box = document.createElement("div");
  box.className = "hs";
  V.s.forEach((text, i)=>{
    const row = document.createElement("div");
    row.className = "hrow"; row.dataset.i = i;
    const st = document.createElement("span");
    st.className = "st";
    paintHl(st, text);                  /* 敘述本身可以標重點，它不是選項 */
    const yn = document.createElement("span");
    yn.className = "yn";
    [[1, EN?"Yes":"是"], [0, EN?"No":"否"]].forEach(([val, label])=>{
      const b = document.createElement("button");
      b.type = "button"; b.dataset.v = val; b.textContent = label;
      b.setAttribute("aria-pressed", String(S.ans[i] === val));
      b.addEventListener("click", ()=>{
        if(S.graded) return;
        S.ans[i] = val;
        [...yn.children].forEach(c => c.setAttribute("aria-pressed", String(S.ans[i] === +c.dataset.v)));
        ansChanged();
      });
      yn.append(b);
    });
    row.append(st, yn);
    box.append(row);
  });
  qbox.append(box);
}

/* ---------- DRAG DROP 配對：把左邊的項目拖到右邊的答案區 ---------- */
function renderDD(q, V, EN){
  const box = document.createElement("div");
  box.className = "dd";

  const bankLab = document.createElement("p");
  bankLab.className = "lab";
  bankLab.textContent = EN ? "Drag from here (each item may be used once, more than once, or not at all)"
                           : "從這裡拖曳（每個項目可以用一次、多次或完全不用）";
  const bank = document.createElement("div");
  bank.className = "bank";

  let sel = null;                       /* 觸控／點擊操作：先選項目，再點答案格 */
  const chips = V.items.map((text, i)=>{
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.dataset.i = i;
    c.draggable = true; c.textContent = stripHl(text);
    c.setAttribute("aria-pressed","false");
    c.addEventListener("click", ()=>{
      if(S.graded) return;
      sel = (sel === i) ? null : i;
      chips.forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.i === sel)));
    });
    c.addEventListener("dragstart", ev=>{
      if(S.graded){ ev.preventDefault(); return; }
      ev.dataTransfer.setData("text/plain", String(i));
      ev.dataTransfer.effectAllowed = "copy";
      c.classList.add("dragging");
    });
    c.addEventListener("dragend", ()=> c.classList.remove("dragging"));
    bank.append(c);
    return c;
  });

  const rows = document.createElement("div");
  rows.className = "rows";
  const slots = [];
  V.tgt.forEach((text, t)=>{
    const row = document.createElement("div");
    row.className = "drow"; row.dataset.t = t;
    const slot = document.createElement("button");
    slot.type = "button"; slot.className = "slot"; slot.dataset.t = t;
    const desc = document.createElement("span");
    desc.className = "desc";
    paintHl(desc, text);                /* 答案區的描述是題目的一部分，可以標重點 */

    const paint = ()=>{
      const v = S.ans[t];
      slot.textContent = v === null || v === undefined
        ? (EN ? "drop here" : "拖曳到這裡")
        : stripHl(V.items[v]);
      slot.classList.toggle("filled", v !== null && v !== undefined);
    };
    const put = v =>{
      if(S.graded) return;
      S.ans[t] = v;
      paint(); ansChanged();
    };
    slot.addEventListener("click", ()=>{
      if(S.graded) return;
      if(sel !== null){ put(sel); sel = null; chips.forEach(x => x.setAttribute("aria-pressed","false")); }
      else put(null);                   /* 沒有選取中的項目就當作清空這一格 */
    });
    slot.addEventListener("dragover", ev=>{ if(!S.graded){ ev.preventDefault(); slot.classList.add("over"); } });
    slot.addEventListener("dragleave", ()=> slot.classList.remove("over"));
    slot.addEventListener("drop", ev=>{
      ev.preventDefault(); slot.classList.remove("over");
      const v = parseInt(ev.dataTransfer.getData("text/plain"), 10);
      if(!isNaN(v)) put(v);
    });
    paint();
    row.append(slot, desc);
    rows.append(row);
    slots.push(slot);
  });

  const tgtLab = document.createElement("p");
  tgtLab.className = "lab";
  tgtLab.textContent = EN ? "Answer area" : "答案區";

  /* q.nest：原題的答案區是一層包一層的同心方框（#227 的縱深防禦）。
     陣列從最外層排到最內層，字串＝固定的層、null＝要拖進去的空格（依序吃 tgt）。
     只在 fix:true 時成立——答案區的上下順序本身就是題意，不能洗。 */
  const NEST = (EN && q.en && q.en.nest) ? q.en.nest : q.nest;
  if(NEST){
    const wrap = document.createElement("div");
    wrap.className = "nest";
    let cur = wrap, slotAt = 0;
    NEST.forEach(lab=>{
      const lay = document.createElement("div");
      lay.className = "nlay";
      const row = document.createElement("div");
      row.className = "nrow";
      if(lab === null){
        row.classList.add("nslot");
        row.append(slots[slotAt++]);      /* 沿用上面已經接好事件的那顆 slot */
      }
      else row.textContent = lab;
      lay.append(row);
      cur.append(lay);
      cur = lay;                          /* 下一層畫在這一層裡面，自然形成同心 */
    });
    box.append(bankLab, bank, tgtLab, wrap);
    qbox.append(box);
    return;
  }

  box.append(bankLab, bank, tgtLab, rows);
  qbox.append(box);
}

/* ---------- HOTSPOT 下拉選單：句子中挖空，用下拉挑答案 ---------- */
function renderDL(q, V, EN){
  const box = document.createElement("div");
  box.className = "dl";
  const sent = document.createElement("div");
  sent.className = "sent";

  String(V.sent).split("\n").forEach(lineTxt=>{
    if(!lineTxt.trim()) return;
    const ln = document.createElement("span");
    ln.className = "ln";
    /* 句子用 {0} {1} 標出下拉的位置，其餘文字照原樣（含螢光筆標記） */
    let last = 0, m;
    const re = /\{(\d+)\}/g;
    while((m = re.exec(lineTxt)) !== null){
      if(m.index > last){
        const frag = document.createElement("span");
        paintHl(frag, lineTxt.slice(last, m.index));
        ln.append(frag);
      }
      const g = +m[1];
      const sel = document.createElement("select");
      sel.dataset.g = g;
      const ph = document.createElement("option");
      ph.value = ""; ph.textContent = EN ? "— select —" : "— 請選擇 —";
      sel.append(ph);
      (V.dd[g] || []).forEach((opt, oi)=>{
        const o = document.createElement("option");
        o.value = String(oi); o.textContent = stripHl(opt);
        sel.append(o);
      });
      sel.value = (S.ans[g] === null || S.ans[g] === undefined) ? "" : String(S.ans[g]);
      sel.classList.toggle("picked", sel.value !== "");
      sel.addEventListener("change", ()=>{
        if(S.graded) return;
        S.ans[g] = sel.value === "" ? null : +sel.value;
        sel.classList.toggle("picked", sel.value !== "");
        ansChanged();
      });
      ln.append(sel);
      last = m.index + m[0].length;
    }
    if(last < lineTxt.length){
      const frag = document.createElement("span");
      paintHl(frag, lineTxt.slice(last));
      ln.append(frag);
    }
    sent.append(ln);
  });

  box.append(sent);
  qbox.append(box);
}

/* =====================================================================
   批改後在題目本體上標出對錯（四種題型各自的畫法）
   ===================================================================== */
function markBody(q, V, mine, EN){
  switch(kindOf(q)){

  case "hs":
    [...qbox.querySelectorAll(".hs .hrow")].forEach((row, i)=>{
      const right = mine[i] === q.a[i];
      row.classList.add(right ? "ok" : "bad");
      [...row.querySelectorAll(".yn button")].forEach(b=>{
        b.disabled = true;
        const v = +b.dataset.v;
        if(v === q.a[i]) b.classList.add("ans");
        else if(v === mine[i]) b.classList.add("wrongpick");
      });
      const mk = document.createElement("span");
      mk.className = "mk"; mk.textContent = right ? "✓" : "✗";
      row.append(mk);
    });
    return;

  case "dd":
    qbox.querySelectorAll(".dd .chip").forEach(c => { c.disabled = true; c.draggable = false; });
    [...qbox.querySelectorAll(".dd .drow")].forEach((row, t)=>{
      const right = mine[t] === q.a[t];
      row.classList.add(right ? "ok" : "bad");
      const slot = row.querySelector(".slot");
      slot.disabled = true;
      if(!right){
        const fix = document.createElement("span");
        fix.className = "fix";
        fix.textContent = (EN ? "correct: " : "正解：") + stripHl(V.items[q.a[t]]);
        row.querySelector(".desc").append(fix);
      }
    });
    return;

  case "dl":
    [...qbox.querySelectorAll(".dl select")].forEach(sel=>{
      const g = +sel.dataset.g;
      sel.disabled = true;
      sel.classList.remove("picked");
      sel.classList.add(mine[g] === q.a[g] ? "ok" : "bad");
      if(mine[g] !== q.a[g]){
        const fix = document.createElement("span");
        fix.className = "fix";
        fix.textContent = (EN ? "correct: " : "正解：") + stripHl(V.dd[g][q.a[g]]);
        sel.parentNode.append(fix);
      }
    });
    return;

  default:
    [...qbox.querySelectorAll(".opt")].forEach((b,i)=>{
      b.disabled = true;
      const isAns = q.a.includes(i), isMine = mine.includes(i);
      if(isAns && isMine) b.classList.add("ok");
      else if(isAns) b.classList.add("miss");
      else if(isMine) b.classList.add("bad");
    });
  }
}

/* 把 S.ans 重新畫回畫面上（切換語言重繪後要用） */
function reflectAns(q){
  const V = view(q), EN = S.lang === "en";
  switch(kindOf(q)){
    case "hs":
      [...qbox.querySelectorAll(".hs .hrow")].forEach((row,i)=>{
        [...row.querySelectorAll(".yn button")].forEach(b =>
          b.setAttribute("aria-pressed", String(S.ans[i] === +b.dataset.v)));
      });
      return;
    case "dd":
      [...qbox.querySelectorAll(".dd .slot")].forEach((slot,t)=>{
        const v = S.ans[t];
        const has = v !== null && v !== undefined;
        slot.textContent = has ? stripHl(V.items[v]) : (EN ? "drop here" : "拖曳到這裡");
        slot.classList.toggle("filled", has);
      });
      return;
    case "dl":
      [...qbox.querySelectorAll(".dl select")].forEach(sel=>{
        const g = +sel.dataset.g, v = S.ans[g];
        sel.value = (v === null || v === undefined) ? "" : String(v);
        sel.classList.toggle("picked", sel.value !== "");
      });
      return;
    default:
      qbox.querySelectorAll(".opt").forEach(c =>
        c.setAttribute("aria-pressed", String(S.ans.includes(+c.dataset.i))));
  }
}

/* 判定列上的「正確答案：…」文字 */
function answerText(q, V, EN){
  const sep = EN ? ", " : "、";
  switch(kindOf(q)){
    case "hs": return q.a.map(v => YN(v, EN)).join(sep);
    case "dd": return q.a.map(v => stripHl(V.items[v])).join(sep);
    case "dl": return q.a.map((v,g) => stripHl(V.dd[g][v])).join(sep);
    default:   return q.a.map(i => LETTER[i]).join(sep);
  }
}

/* 底部動作列：同一時間只留「現在真的會用到」的按鈕，用不到的直接收起來，
   不要留一排灰掉或意思重複的鈕（例如批改完之後還擺兩顆「下一題」）。 */
function setActions(){
  const en = S.lang === "en";
  const last = S.idx >= S.pool.length - 1;
  btnCheck.dataset.mode = "";          /* 離開成績單畫面 */
  paintJump();
  btnPrev.title = en ? "Back (←)" : "上一題（←）";
  btnPrev.setAttribute("aria-label", en ? "Back" : "上一題");
  btnPrev.hidden = false;
  btnPrev.disabled = !S.pool.length || S.idx <= 0;

  if(S.exam){
    /* 考試：下一題（最後一題就沒有）／作答總覽／交卷 */
    btnCheck.hidden = last;
    btnCheck.textContent = en ? "Next" : "下一題";
    btnCheck.disabled = false;
    btnCheck.className = "act primary";

    btnReveal.hidden = false;
    btnReveal.textContent = en ? "Overview" : "作答總覽";
    btnReveal.disabled = false;
    btnReveal.className = last ? "act primary" : "act";

    btnNext.hidden = false;
    btnNext.textContent = en ? "Submit" : "交卷";
    btnNext.disabled = false;
    btnNext.className = "act ghost";
    btnNext.title = en ? "Submit — the review screen opens first"
                       : "交卷：先跳出「作答總覽」讓你確認，不會直接給分";
    return;
  }

  btnCheck.className = "act primary";
  btnCheck.disabled  = !S.pool.length;
  if(S.graded){
    /* 批改完了：只剩往下走這一件事 */
    btnCheck.hidden = false;
    btnCheck.textContent = en ? "Next" : "下一題";
    btnReveal.hidden = true;
    btnNext.hidden = true;
  } else {
    /* 作答中：批改／看答案／跳過。練習是拿來練的，不想現在處理的題目直接跳掉，
       不批改就不計分、也不會被丟進錯題本，之後用「上一題」或題號欄回來重做。
       只有最後一題不給跳——跳過去就是結算這一輪，手滑的代價太大。 */
    btnCheck.hidden = false;
    btnCheck.textContent = en ? "Check" : "批改";
    btnReveal.hidden = false;
    btnReveal.textContent = en ? "Show answer" : "看答案";
    btnReveal.disabled = !S.pool.length;
    btnReveal.className = "act";
    btnNext.hidden = last || !S.pool.length;
    btnNext.textContent = en ? "Skip" : "跳過";
    btnNext.disabled = false;
    btnNext.className = "act ghost";
    btnNext.title = en ? "Skip — not graded, not scored (→)"
                       : "跳過這題：不計分、不算錯，之後可以用「上一題」或題號欄回來（→）";
  }
}

/* =====================================================================
   練習模式：批改
   ===================================================================== */
/* rescore=false 用於切換語言後重繪同一題：只重畫，不重複計分 */
function grade(revealOnly, rescore){
  if(rescore === undefined) rescore = true;
  if(!S.pool.length || S.idx >= S.pool.length) return;
  const q = S.pool[S.idx];
  const V = view(q);
  const EN = S.lang === "en";
  const mine = S.ans.slice();
  if(!revealOnly && ansEmpty(q, mine)){
    verdict.className = "verdict show fail";
    verdict.textContent = EN ? "Nothing answered yet — make a selection first."
                             : "還沒有作答，先選一個再按批改。";
    return;
  }
  /* 複選題沒選滿「需選 N 項」：原廠考試不讓你送，這裡也一樣先擋下來 */
  if(!revealOnly && mcShort(q, mine)){ nagMulti(q); return; }
  /* 多格題型只填了一部分：先提醒補齊，避免不小心送出半套答案 */
  if(!revealOnly && kindOf(q) !== "mc" && !ansFull(q, mine)){
    verdict.className = "verdict show fail";
    verdict.textContent = EN ? "Some blanks are still empty — fill them all in first."
                             : "還有空格沒填，全部填完再按批改。";
    return;
  }
  const ok = ansOK(q, mine);
  markBody(q, V, mine, EN);

  if(!S.graded && rescore){
    if(!revealOnly){
      S.total++;
      if(ok){ S.right++; wrongSet.delete(q.q); }
      else wrongSet.add(q.q);
    } else {
      wrongSet.add(q.q);   /* 直接看答案＝這題還不熟，留在錯題本 */
    }
    saveWrong();
    recordAttempt(q.q, ok, !!revealOnly);
    scoreEl.textContent = `${S.right} / ${S.total}`;
  }
  S.graded = true;
  S.lastReveal = revealOnly;
  /* 記下這一題的作答與批改狀態，之後用「上一題」翻回來、或切走再切回來都還原得回去 */
  S.answers[S.idx] = mine.slice();
  S.gr[S.idx] = {reveal:!!revealOnly};
  setActions();
  paintMulti();     /* 批改後把徽章收回穩定狀態，不要留著剛才的紅字提醒 */
  saveSess();

  verdict.className = "verdict show " + (ok && !revealOnly ? "pass" : "fail");
  const ansTxt = answerText(q, V, EN);
  const hintTxt = kindOf(q) === "mc"
    ? (EN ? "　(solid green = you got it; dashed green = correct answer you missed; red = wrong pick)"
          : "　（實線綠框＝答對；虛線綠框＝漏掉的正確答案；紅框＝選錯）")
    : (EN ? "　(green = correct; red = your wrong pick)" : "　（綠＝正解；紅＝你選錯的地方）");
  if(revealOnly){
    verdict.textContent = (EN ? `Answer: ${ansTxt}` : `正確答案：${ansTxt}`) + hintTxt;
  } else if(ok){
    verdict.textContent = EN ? `✓ Correct　Answer: ${ansTxt}` : `✓ 答對了　正確答案：${ansTxt}`;
  } else {
    verdict.textContent = EN ? `✗ Incorrect　Answer: ${ansTxt}　saved to Review list`
                             : `✗ 答錯了　正確答案：${ansTxt}　已收進「錯題本」分頁`;
  }

  /* 文件題庫沒有解析，就只顯示出處，不要留一個空框 */
  expl.className = "expl show";
  const lab = hasSrc(q)
    ? (EN ? `Explanation · PDF ${srcLabel(q, true)}` : `解析 · 原始文件 ${srcLabel(q, false)}`)
    : (EN ? "Explanation · " : "解析 · ") + q.t;
  expl.innerHTML = '<span class="lab">' + esc(lab) + "</span>";
  if(V.e){
    const body = document.createElement("span");
    paintHl(body, V.e);
    expl.append(body);
  }
  else if(!hasSrc(q)) expl.className = "expl";
  if(EN && !q.en){
    const note = document.createElement("div");
    note.style.cssText = "margin-top:6px;font-size:.8rem;opacity:.75";
    note.textContent = "(English version not available for this item — showing the original.)";
    expl.append(note);
  }
  verdict.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function nextQ(){
  if(S.idx >= S.pool.length - 1){
    if(!S.exam && !S.graded && S.pool.length){ /* 最後一題還沒批改就直接看結果也可以 */ }
    S.idx++;
    finishRound();
    return;
  }
  S.idx++;
  renderQ();
  window.scrollTo(0, 0);
}

/* 回到上一題：練習模式會連同當時的作答與批改結果一起還原 */
function prevQ(){
  if(S.idx <= 0 || !S.pool.length) return;
  S.idx--;
  renderQ();
  window.scrollTo(0, 0);
}

/* =====================================================================
   作答總覽：仿原廠考試的 Review screen
   交卷不會直接算分，一定先跳到這裡；確認過每一題（尤其是標記待複習的）才真的交卷
   ===================================================================== */
function closeOverview(){ ovwrap.classList.remove("show"); ovwrap.innerHTML = ""; }

function openOverview(submitting){
  if(!S.exam || !S.pool.length) return;
  const EN = S.lang === "en";
  const blanks = [], flagged = [];
  S.pool.forEach((q,i)=>{
    if(!ansDone(q, S.answers[i])) blanks.push(i);   /* 複選只選一半＝還沒作答完 */
    if(S.flags[i]) flagged.push(i);
  });

  const cells = S.pool.map((q,i)=>{
    const done = ansDone(q, S.answers[i]);
    const cls = ["ovcell", done ? "done" : "blank", S.flags[i] ? "flag" : "", i === S.idx ? "cur" : ""]
                .filter(Boolean).join(" ");
    return `<button type="button" class="${cls}" data-i="${i}">${i+1}</button>`;
  }).join("");

  const num = (n, warn) => warn && n ? `<span class="warnnum">${n}</span>` : String(n);
  const sub = EN
    ? `${S.pool.length - blanks.length} of ${S.pool.length} answered · ${num(blanks.length,true)} unanswered · ${num(flagged.length,true)} flagged for review`
    : `已作答 ${S.pool.length - blanks.length} / ${S.pool.length} 題 · 未作答 ${num(blanks.length,true)} 題 · 標記待複習 ${num(flagged.length,true)} 題`;

  const notes = flagged.length ? '<div class="ovnotes"><span class="lab">' +
      (EN ? "Flagged for review" : "標記待複習") + "</span>" +
      flagged.map(i=>{
        const memo = (S.notes[i] || "").trim();
        return `<button type="button" class="ovnote" data-i="${i}">` +
               `<span class="n">${EN?"Q":"第 "}${i+1}${EN?"":" 題"}</span>` +
               `<span class="memo">${esc(memo || (EN ? "(no note)" : "（沒有備註）"))}</span></button>`;
      }).join("") + "</div>" : "";

  ovwrap.innerHTML =
    '<div class="ovcard">' +
      `<h2>${EN ? (submitting ? "Submit your exam?" : "Question overview") : (submitting ? "確定要交卷嗎？" : "作答總覽")}</h2>` +
      `<p class="ovsub">${sub}</p>` +
      `<p class="ovsub">${EN ? "Tap any number to jump straight back to that question. Nothing is graded until you press Submit."
                             : "點題號可以直接跳回那一題重看；按下「確定交卷」之前都不會計分。"}</p>` +
      '<div class="ovlegend">' +
        `<span><i class="done"></i>${EN?"answered":"已作答"}</span>` +
        `<span><i class="blank"></i>${EN?"unanswered":"未作答"}</span>` +
        `<span><i class="flag"></i>${EN?"flagged":"標記待複習"}</span>` +
      "</div>" +
      `<div class="ovgrid">${cells}</div>` + notes +
      '<div class="ovbtns">' +
        `<button type="button" class="go" data-act="back">${EN ? "Keep working" : "返回作答"}</button>` +
        `<button type="button" data-act="submit">${EN ? "Submit &amp; grade" : "確定交卷、給分"}</button>` +
      "</div>" +
    "</div>";
  ovwrap.classList.add("show");
}

el("statBtn").addEventListener("click", openStat);

statwrap.addEventListener("click", e=>{
  if(!statwrap.classList.contains("show")) return;
  if(e.target === statwrap){ closeStat(); return; }

  /* 常錯題：點一下就打星號／取消星號 */
  const wq = e.target.closest("[data-star]");
  if(wq){
    const k = wq.dataset.star;
    if(starSet.has(k)) starSet.delete(k); else starSet.add(k);
    saveStar();
    const on = starSet.has(k);
    wq.setAttribute("aria-pressed", String(on));
    wq.querySelector(".st").textContent = on ? "★" : "☆";
    paintTabProgress();
    return;
  }

  const act = e.target.closest("[data-act]");
  if(!act) return;
  const EN = S.lang === "en";
  const msg = el("stmsg");
  const say = (t, bad)=>{ if(msg){ msg.textContent = t; msg.className = "stmsg" + (bad ? " bad" : ""); } };

  switch(act.dataset.act){
  case "close": closeStat(); return;

  case "export":
    try{ say((EN ? "Exported: " : "已匯出：") + exportSave()); }
    catch(err){ say((EN ? "Export failed: " : "匯出失敗：") + err.message, true); }
    return;

  case "import":
    say(EN ? "Importing replaces everything currently saved in this browser."
           : "匯入會覆蓋這個瀏覽器目前的所有資料，建議先匯出一份備份。");
    el("impFile").value = "";
    el("impFile").click();
    return;

  case "clear": {
    /* 只清統計與歷史，星號和錯題本留著；按兩次才算數 */
    if(act.dataset.armed !== "1"){
      act.dataset.armed = "1";
      act.classList.add("armed");
      act.textContent = EN ? "Tap again to clear" : "再按一次確認清除";
      say(EN ? "This clears attempt stats and round history. Stars and the review list are kept."
             : "會清掉「各領域答對率、常錯題、歷次成績」；星號與錯題本會留著。", true);
      setTimeout(()=>{
        if(act.dataset.armed === "1"){
          act.dataset.armed = "0"; act.classList.remove("armed");
          act.textContent = EN ? "Clear stats" : "清除統計與紀錄";
        }
      }, 4000);
      return;
    }
    qstat = QSTAT[S.src] = {};
    hist  = HIST[S.src]  = [];
    saveQstat(); saveHist();
    S.logged = false;
    openStat();
    el("stmsg").textContent = EN ? "Stats cleared." : "統計與歷次成績已清除。";
    return;
  }
  }
});

el("impFile").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const EN = S.lang === "en";
  const rd = new FileReader();
  rd.onload = ()=>{
    const msg = el("stmsg");
    try{
      const n = importSave(String(rd.result));
      if(msg){ msg.className = "stmsg"; msg.textContent = (EN ? `Imported ${n} entries — reloading…` : `已匯入 ${n} 筆資料，重新載入中…`); }
      setTimeout(()=>location.reload(), 500);
    }catch(err){
      if(msg){ msg.className = "stmsg bad"; msg.textContent = (EN ? "Import failed: " : "匯入失敗：") + err.message; }
    }
  };
  rd.onerror = ()=>{
    const msg = el("stmsg");
    if(msg){ msg.className = "stmsg bad"; msg.textContent = EN ? "Could not read the file." : "讀不到這個檔案。"; }
  };
  rd.readAsText(f);
});

/* 事件掛在容器上，只掛一次；內容每次重畫也不會累積監聽器 */
ovwrap.addEventListener("click", e=>{
  if(!ovwrap.classList.contains("show")) return;
  if(e.target === ovwrap){ closeOverview(); return; }       /* 點背景＝返回作答 */

/* =====================================================================
   統計面板：領域強弱、一直做錯的題目、歷次成績、匯出／匯入
   ===================================================================== */
const closeStat = () => { statwrap.classList.remove("show"); statwrap.innerHTML = ""; };

const pad2 = n => String(n).padStart(2, "0");
function stampOf(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* 三個領域各自的答對率：拿長期統計（不是單一輪）來算，看得出真正的強弱 */
function domainStats(){
  const out = {};
  for(let d = 1; d <= D_MAX; d++) out[d] = {n:0, w:0, seen:0, tot:0};
  BANK.forEach(q=>{
    const d = out[q.d];
    if(!d) return;
    d.tot++;
    const r = qstat[q.q];
    if(!r || !r.n) return;
    d.seen++; d.n += r.n; d.w += r.w;
  });
  return out;
}

/* 一直做錯的題目：做過兩次以上、錯得最多的排前面 */
function weakQuestions(limit){
  const byText = new Map();
  BANK.forEach(q => byText.set(q.q, q));
  return Object.keys(qstat)
    .map(k => ({k, r:qstat[k], q:byText.get(k)}))
    .filter(x => x.q && x.r.w > 0)
    .sort((a,b) => (b.r.w - a.r.w) || ((b.r.w/b.r.n) - (a.r.w/a.r.n)) || (b.r.t - a.r.t))
    .slice(0, limit);
}

function openStat(){
  const EN = S.lang === "en";
  const ds = domainStats();
  const weak = weakQuestions(15);
  const bankName = S.src === "mine" ? (EN ? "own bank" : "自製題庫") : (EN ? "document bank" : "文件題庫");

  /* --- 目前這一輪 --- */
  const nowPct = S.total ? Math.round(S.right/S.total*100) : 0;
  const now = '<div class="stnow">' +
    `<span class="big mono">${S.total ? nowPct + "%" : "—"}</span>` +
    `<span class="cap">` +
    (EN ? `this round: ${S.right} / ${S.total} correct` : `這一輪：答對 ${S.right} / ${S.total} 題`) +
    (S.pool.length ? (EN ? ` · question ${S.idx+1} of ${S.pool.length}` : ` · 做到第 ${S.idx+1} / ${S.pool.length} 題`) : "") +
    "</span></div>";

  /* --- 領域強弱 --- */
  let bars = "";
  [1,2,3].forEach(d=>{
    const s = ds[d];
    const done = s.n - s.w;
    const pct = s.n ? Math.round(done/s.n*100) : 0;
    const cls = !s.n ? "" : pct >= 80 ? "hi" : pct < 60 ? "lo" : "";
    bars += `<div class="dbar ${cls}"><span class="nm" title="${esc(dname(d))}">` +
      `<i>0${d}</i>${esc(dname(d))}</span>` +
      `<span class="track"><i style="width:${s.n ? pct : 0}%"></i></span>` +
      `<span class="pc">${s.n ? `<b>${pct}%</b>` : (EN?"n/a":"未做")}</span></div>` +
      `<p class="dhint">` +
      (s.n ? (EN ? `${done} / ${s.n} attempts correct · ${s.seen} of ${s.tot} questions tried`
                 : `作答 ${s.n} 次答對 ${done} 次 · 這個領域 ${s.tot} 題中做過 ${s.seen} 題`)
           : (EN ? `not attempted yet · ${s.tot} questions` : `還沒做過 · 這個領域共 ${s.tot} 題`)) + "</p>";
  });

  /* --- 常錯題 --- */
  const weakHtml = weak.length
    ? weak.map(x=>{
        const rate = Math.round(x.r.w / x.r.n * 100);
        const recent = (x.r.l || "").split("").map(c => c === "1" ? "✓" : "✗").join("");
        const on = starSet.has(x.k);
        return `<button type="button" class="wq" data-star="${esc(x.k)}" aria-pressed="${on}">` +
          `<span class="rate">${rate}%</span>` +
          `<span class="tx">${esc(stripHl(x.q.q).split("\n").filter(Boolean).pop()).slice(0,90)}` +
          `<small>${esc(dname(x.q.d))} · ${esc(x.q.t)} · ` +
          (EN ? `wrong ${x.r.w} of ${x.r.n}` : `做 ${x.r.n} 次錯 ${x.r.w} 次`) +
          (x.r.v ? (EN ? ` · revealed ${x.r.v}` : ` · 看答案 ${x.r.v} 次`) : "") +
          (recent ? ` · ${EN?"recent":"最近"} ${recent}` : "") + "</small></span>" +
          `<span class="st">${on ? "★" : "☆"}</span></button>`;
      }).join("")
    : `<p class="none">${EN ? "Nothing here yet — answer some questions first." : "還沒有資料，先做幾題就會出現。"}</p>`;

  /* --- 歷次成績 --- */
  const rows = hist.slice(0, 20);
  const histHtml = rows.length
    ? rows.map((h,i)=>{
        const pct = h.t ? Math.round(h.r/h.t*100) : 0;
        /* 跟「上一筆同類型」比，才不會拿模擬考去比單一領域的練習 */
        let prev = null;
        for(let j=i+1;j<rows.length;j++){ if(rows[j].k === h.k && rows[j].tab === h.tab){ prev = rows[j]; break; } }
        const dl = prev && prev.t ? pct - Math.round(prev.r/prev.t*100) : null;
        const dcls = dl === null ? "" : dl > 0 ? "up" : dl < 0 ? "dn" : "";
        const dtxt = dl === null ? "—" : (dl > 0 ? "▲" : dl < 0 ? "▼" : "＝") + (dl ? Math.abs(dl) : "");
        const per = [1,2,3].map(d => (h.d && h.d[d] && h.d[d][1]) ? `${h.d[d][0]}/${h.d[d][1]}` : "–").join(" ");
        const label = h.k === "exam" ? (EN?"exam":"模擬考")
                    : (EN ? TAB_EN[h.tab] : TAB_ZH[h.tab]);
        return `<div class="hrow2"><span class="when">${stampOf(h.ts)}</span>` +
          `<span class="kind ${h.k === "exam" ? "exam" : ""}">${esc(label)}</span>` +
          `<span class="dd3" title="${EN?"by domain 01 / 02 / 03":"三個領域 01 / 02 / 03"}">${per}</span>` +
          `<span class="sc"><b>${pct}%</b> <small>${h.r}/${h.t}</small></span>` +
          `<span class="dl2 ${dcls}">${dtxt}</span></div>`;
      }).join("")
    : `<p class="none">${EN ? "No finished rounds yet. A round is filed when you finish it or press Restart."
                            : "還沒有紀錄。整輪做完、或按「重新開始」時就會把那一輪存成一筆。"}</p>`;

  statwrap.innerHTML =
    '<div class="ovcard">' +
      `<h2>${EN ? "Your stats" : "統計"}</h2>` +
      `<p class="ovsub">${EN ? `Bank: ${bankName}. Stats and history are kept per bank.`
                             : `目前題庫：${bankName}（兩份題庫的統計與紀錄各自獨立）`}</p>` +

      '<div class="stsec">' + now + "</div>" +

      '<div class="stsec"><span class="lab">' +
        (EN ? "Domain strength (all-time)" : "各領域答對率（長期累計）") + "</span>" + bars + "</div>" +

      '<div class="stsec"><span class="lab">' +
        (EN ? "Questions you keep getting wrong" : "一直做錯的題目") + "</span>" +
        `<p class="dhint" style="margin-bottom:8px">${EN ? "Tap one to star it, then drill them all in the Starred tab."
                                                        : "點一下就打星號，之後到「星號題」分頁專門練這些。"}</p>` +
        weakHtml + "</div>" +

      '<div class="stsec"><span class="lab">' +
        (EN ? "Round history — newest first" : "歷次成績（一輪一筆，新的在上面）") + "</span>" +
        histHtml + "</div>" +

      '<div class="stsec"><span class="lab">' + (EN ? "Save file" : "存檔") + "</span>" +
        `<p class="dhint">${EN ? "Export everything (progress, stats, history, stars, review list) as one JSON file, or import it on another device."
                               : "把全部資料（作答進度、統計、歷次成績、星號、錯題本）匯出成一個 JSON 檔，也可以在別台電腦匯入。"}</p>` +
        '<div class="stbtns">' +
          `<button type="button" data-act="export">${EN ? "⬇ Export" : "⬇ 匯出存檔"}</button>` +
          `<button type="button" data-act="import">${EN ? "⬆ Import" : "⬆ 匯入存檔"}</button>` +
          `<button type="button" class="danger" data-act="clear">${EN ? "Clear stats" : "清除統計與紀錄"}</button>` +
        "</div>" +
        '<p class="stmsg" id="stmsg"></p>' +
      "</div>" +

      '<div class="ovbtns">' +
        `<button type="button" class="go" data-act="close">${EN ? "Close" : "關閉"}</button>` +
      "</div>" +
    "</div>";
  statwrap.classList.add("show");
}

/* 匯出：把所有 az104.* 的資料包成一個檔 */
function exportSave(){
  const out = {app:"az104-practice", v:1, ts:Date.now(), data:{}};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("az104.") === 0) out.data[k] = localStorage.getItem(k);
  }
  const d = new Date();
  const name = `az104-progress-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
  const blob = new Blob([JSON.stringify(out)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  return name;
}

/* 匯入：整包覆蓋，所以先問過再做 */
function importSave(text){
  const o = JSON.parse(text);
  if(!o || o.app !== "az104-practice" || !o.data || typeof o.data !== "object")
    throw new Error("not an az104 save file");
  const keys = Object.keys(o.data).filter(k => k.indexOf("az104.") === 0);
  if(!keys.length) throw new Error("save file is empty");
  const old = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("az104.") === 0) old.push(k);
  }
  old.forEach(k => localStorage.removeItem(k));
  keys.forEach(k => localStorage.setItem(k, String(o.data[k])));
  return keys.length;
}

/* =====================================================================
   把「這一輪」封存成一筆成績紀錄
   整輪做完、或按「重新開始」把進度歸零時都會呼叫，所以每一輪各自獨立，
   統計面板才比得出來這次跟上次有沒有進步。
   ===================================================================== */
function logRound(rows){
  if(S.logged) return;
  const byD = {1:[0,0], 2:[0,0], 3:[0,0]};
  let right = 0, total = 0;

  if(rows){                                   /* 模擬考：逐題結果已經算好了 */
    rows.forEach(r=>{
      total++; if(r.ok) right++;
      const d = byD[r.q.d]; if(d){ d[1]++; if(r.ok) d[0]++; }
    });
  } else {                                    /* 練習：只算真的按過「批改」的題目 */
    S.pool.forEach((q,i)=>{
      const g = S.gr[i];
      if(!g || g.reveal) return;
      const ok = ansOK(q, S.answers[i] || blankAns(q));
      total++; if(ok) right++;
      const d = byD[q.d]; if(d){ d[1]++; if(ok) d[0]++; }
    });
  }
  if(!total) return;
  S.logged = true;
  pushHist({ts:Date.now(), k:S.exam ? "exam" : "practice", tab:S.tab, r:right, t:total, d:byD});
}

/* =====================================================================
   結算
   ===================================================================== */
function finishRound(){
  stopTimer();
  closeOverview();
  dropSess();                 /* 這個分頁整輪做完了，進度才歸零 */
  paintTabProgress();
  qbox.innerHTML = ""; qtools.innerHTML = "";
  starBtn.hidden = true;
  verdict.className = "verdict"; expl.className = "expl";
  barFill.style.width = "100%";

  let right = S.right, total = S.total;
  const rows = [];
  if(S.exam){
    right = 0; total = S.pool.length;
    S.pool.forEach((q,i)=>{
      const mine = S.answers[i] || blankAns(q);
      const ok = ansOK(q, mine);
      if(ok){ right++; wrongSet.delete(q.q); } else wrongSet.add(q.q);
      rows.push({q, mine, ok});
      /* 考試沒作答的題目不列入長期統計，免得時間到留白把「常錯題」灌爆 */
      if(!ansEmpty(q, mine)) recordAttempt(q.q, ok, false);
    });
    saveWrong();
  }
  logRound(S.exam ? rows : null);

  const EN = S.lang === "en";
  const pct = total ? Math.round(right/total*100) : 0;
  const passed = pct >= PASS;
  eyebrow.textContent = S.exam ? (EN ? "Mock exam · Result" : "模擬考 · 成績單")
                               : (EN ? "Round complete" : "這一輪結束");
  scoreEl.textContent = `${right} / ${total}`;

  let html = '<div class="bigscore">' +
    `<div class="pct ${passed?"pass":"fail"} mono">${pct}%</div>` +
    `<div class="cap">` +
    (EN ? `${right} / ${total} correct　` : `答對 ${right} / ${total} 題　`) +
    (S.exam ? (passed ? (EN?`at or above the ${PASS}% pass mark`:`達到 ${PASS}% 及格線`)
                      : (EN?`below the ${PASS}% pass mark`:`未達 ${PASS}% 及格線`)) : "") + "</div></div>";

  if(S.exam){
    const byD = {1:[0,0],2:[0,0],3:[0,0]};
    rows.forEach(r=>{ byD[r.q.d][1]++; if(r.ok) byD[r.q.d][0]++; });
    html += '<div class="dbreak">';
    [1,2,3].forEach(d=>{
      const [a,b] = byD[d];
      html += `<div class="row"><span>${esc(dname(d))}</span><span class="n">${a} / ${b}</span></div>`;
    });
    html += "</div>";

    html += '<div class="rev">';
    rows.forEach((r,i)=>{
      const RV = view(r.q);
      const sep = EN ? ", " : "、";
      const answered = !ansEmpty(r.q, r.mine);
      let body, mineTxt, corTxt;

      switch(kindOf(r.q)){

      /* 是非表：逐句列出你的判斷與正解 */
      case "hs":
        body = RV.s.map((text, si)=>{
          const my = r.mine[si], cor = r.q.a[si];
          const cls = my === cor ? "ok" : (my === null || my === undefined ? "none" : "bad");
          return `<div class="rh ${cls}"><span class="t">${escHl(text)}</span>` +
                 `<span class="yn">${EN?"you":"你"} ${YN(my,EN)} / ${EN?"ans":"正解"} ${YN(cor,EN)}</span></div>`;
        }).join("");
        mineTxt = answered ? r.mine.map(v=>YN(v,EN)).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map(v=>YN(v,EN)).join(sep);
        break;

      /* 配對：逐格列出描述、你放的項目與正解 */
      case "dd":
        body = RV.tgt.map((text, ti)=>{
          const my = r.mine[ti], cor = r.q.a[ti];
          const cls = my === cor ? "ok" : (my === null || my === undefined ? "none" : "bad");
          const myTxt = (my === null || my === undefined) ? (EN?"—":"—") : stripHl(RV.items[my]);
          return `<div class="rh ${cls}"><span class="t">${escHl(text)}</span>` +
                 `<span class="yn">${esc(myTxt)} / ${esc(stripHl(RV.items[cor]))}</span></div>`;
        }).join("");
        mineTxt = answered ? r.mine.map(v => v==null ? "—" : stripHl(RV.items[v])).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map(v => stripHl(RV.items[v])).join(sep);
        break;

      /* 下拉：逐格列出你選的與正解 */
      case "dl":
        body = RV.dd.map((list, g)=>{
          const my = r.mine[g], cor = r.q.a[g];
          const cls = my === cor ? "ok" : (my === null || my === undefined ? "none" : "bad");
          const myTxt = (my === null || my === undefined) ? (EN?"—":"—") : stripHl(list[my]);
          return `<div class="rh ${cls}"><span class="t">${EN?"Blank":"第"} ${g+1} ${EN?"":"格"}</span>` +
                 `<span class="yn">${esc(myTxt)} / ${esc(stripHl(list[cor]))}</span></div>`;
        }).join("");
        mineTxt = answered ? r.mine.map((v,g) => v==null ? "—" : stripHl(RV.dd[g][v])).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map((v,g) => stripHl(RV.dd[g][v])).join(sep);
        break;

      /* 單選／複選：全部選項都列出來，讓你看得到錯的錯在哪，而不是只給一個字母 */
      default:
        body = RV.o.map((text, oi)=>{
          const isAns = r.q.a.includes(oi), isMine = r.mine.includes(oi);
          const cls = isAns ? (isMine ? "ok" : "miss") : (isMine ? "bad" : "none");
          const tag = isAns
            ? (isMine ? (EN ? "✓ correct · your pick" : "✓ 正解 · 你選的")
                      : (EN ? "✓ correct answer"      : "✓ 正解"))
            : (isMine ? (EN ? "✗ your pick"           : "✗ 你選的") : "");
          /* 有服務圖示的題目，檢討時也要帶著圖，才跟作答畫面對得起來 */
          const ico = r.q.ico && r.q.ico[oi]
            ? `<img class="oico" src="${r.q.ico[oi]}" alt="">` : "";
          return `<div class="ro ${cls}"><span class="k">${LETTER[oi]}</span>${ico}` +
                 `<span class="t">${esc(stripHl(text))}</span>` +
                 (tag ? `<span class="tag">${tag}</span>` : "") + "</div>";
        }).join("");
        mineTxt = answered ? r.mine.map(x=>LETTER[x]).join(sep) : (EN?"not answered":"未作答");
        corTxt  = r.q.a.map(x=>LETTER[x]).join(sep);
      }

      const sentTxt = kindOf(r.q) === "dl"
        ? `<p class="ln">${escHl(String(RV.sent).replace(/\{(\d+)\}/g, (m,g)=>"＿＿＿"))}</p>` : "";

      /* 考試時標記過的題目，檢討時把標記與備註一起帶出來 */
      const memo = (S.notes[i] || "").trim();
      const flagTxt = S.flags[i]
        ? `<p class="ln flagln">⚑ <b>${EN?"you flagged this":"你標記過這題"}</b>` +
          (memo ? `：${esc(memo)}` : "") + "</p>"
        : "";

      html += `<div class="item ${r.ok?"right":"wrong"}">` +
        `<p class="q">${r.ok?"✓":"✗"} ${i+1}. ${escHl(RV.q)}</p>` + sentTxt + flagTxt +
        `<div class="ropts">${body}</div>` +
        `<p class="ln">${EN?"Your answer":"你的答案"}：<span class="you">${esc(mineTxt)}</span>　` +
        `${EN?"Correct":"正確答案"}：<span class="cor">${esc(corTxt)}</span></p>` +
        `<p class="ln">${escHl(RV.e)}</p></div>`;
    });
    html += "</div>";
  } else {
    html += '<p class="hint">' + (EN
      ? "Hit “New round” to go again. Anything you missed is waiting in the Review list."
      : "按「再來一輪」重新出題（順序看「⚙ 設定 → 出題順序」）；答錯的題目已收進「錯題本」分頁。") + "</p>";
  }

  report.innerHTML = html;
  report.classList.add("show");
  /* 成績單上只需要一顆「再來一輪」，其餘按鈕收起來 */
  btnCheck.hidden = false; btnCheck.className = "act primary"; btnCheck.disabled = false;
  btnCheck.textContent = EN ? "New round" : "再來一輪";
  btnCheck.dataset.mode = "again";
  btnPrev.hidden = true; btnReveal.hidden = true; btnNext.hidden = true;
  paintJump();                /* 成績單畫面沒有「當前題目」，跳題先關掉 */
  window.scrollTo(0, 0);
}

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* =====================================================================
   模擬考計時
   ===================================================================== */
function fmt(s){ const m = Math.floor(s/60); return m + ":" + String(s%60).padStart(2,"0"); }
function startTimer(){
  S.left = EXAM_SEC;
  timerEl.hidden = false; timerEl.classList.remove("warn");
  timerEl.textContent = "⏱ " + fmt(S.left);
  S.timerId = setInterval(()=>{
    S.left--;
    timerEl.textContent = "⏱ " + fmt(Math.max(0,S.left));
    if(S.left <= 300) timerEl.classList.add("warn");
    if(S.left <= 0){ stopTimer(); finishRound(); }
  }, 1000);
}
function stopTimer(){
  if(S.timerId){ clearInterval(S.timerId); S.timerId = null; }
  if(!S.exam) timerEl.hidden = true;
}

/* =====================================================================
   跳題：輸入題號直接跳到那一題
   -----------------------------------------------------------------
   練習模式認的是「題目上標的題號」（文件題庫在題目本文上方標的 第 N 題 / #N），
   不是「本輪第幾題」——本輪順序是洗過的，本輪第 189 題可能是文件的第 316 題，
   要跳的當然是題目自己的號碼。自製題庫沒有題號，才用「本輪第幾題」。
   模擬考例外：那裡畫面上到處都是「作答總覽」的 1～40 編號，所以先當本輪的
   第幾題，超出範圍再拿題目自己的題號找一次。
   跳到哪裡都會在旁邊寫清楚是照哪一種號碼跳的。
   ===================================================================== */
const jumpForm = el("jumpForm"), jumpNo = el("jumpNo"), jumpBtn = el("jumpBtn"), jumpMsg = el("jumpMsg");
let jumpMsgId = null;

function sayJump(txt, bad){
  jumpMsg.textContent = txt || "";
  jumpMsg.className = "jmsg" + (bad ? " bad" : "");
  if(jumpMsgId){ clearTimeout(jumpMsgId); jumpMsgId = null; }
  if(txt) jumpMsgId = setTimeout(()=>{ jumpMsg.textContent = ""; jumpMsg.className = "jmsg"; }, 3000);
}

/* 沒題目、或整輪做完正在看成績單時就不給跳 */
const jumpOff = () => !S.pool.length || report.classList.contains("show");
/* 這一輪的題目有沒有來源座標（文件題庫有，自製題庫沒有） */
const jumpNumbered = () => S.pool.some(hasSrc);
/* 這個分頁跳得到的來源題號有哪些段：分類分頁、錯題本只含部分題目，所以不是連號 */
function jumpRange(en){
  const by = new Map();
  S.pool.filter(hasSrc).forEach(q=>{
    const r = by.get(q.sec) || {lo:Infinity, hi:-Infinity};
    r.lo = Math.min(r.lo, q.no); r.hi = Math.max(r.hi, q.no);
    by.set(q.sec, r);
  });
  return [...by.entries()]
    .sort((a,b) => secRank(a[0]) - secRank(b[0]))
    .map(([sec, r]) => secName(sec, en) + " " + (r.lo === r.hi ? "#" + r.lo
                                                              : `#${r.lo}-${r.hi}`))
    .join("、");
}

function paintJump(){
  const EN = S.lang === "en";
  const off = jumpOff();
  const cur = S.pool[S.idx];
  const numbered = jumpNumbered();
  jumpForm.dataset.off = off ? "1" : "0";
  jumpNo.disabled = jumpBtn.disabled = off;
  /* 提示框裡放目前這一題的來源題號，一眼就知道這個欄位吃什麼寫法 */
  jumpNo.placeholder = hasSrc(cur)
    ? cur.sec.replace(/^S/, "") + "-" + cur.no
    : (EN ? "no." : "題號");
  jumpBtn.textContent = EN ? "Go" : "跳題";
  /* 一個數字＝本輪第幾題；「段-題號」＝原始文件上的位置。兩種寫法都吃 */
  jumpForm.title = numbered
    ? (EN ? `Two ways to jump, then press Enter:\n`
          + `  17     — no. 17 of this round (same numbering as the overview, 1-${S.pool.length})\n`
          + `  2-17   — Question Set 2, question #17 as printed in the PDF\n`
          + `  T3-2   — Testlet 3, question #2\n`
          + `  N63    — NewQ #63\n`
          + `This tab holds ${S.pool.length} questions: ${jumpRange(true)}. Press / to focus.`
          : `兩種寫法，打完按 Enter：\n`
          + `  17     — 本輪第 17 題（和「作答總覽」的編號一樣，本輪 1-${S.pool.length} 題）\n`
          + `  2-17   — 原始文件的題組 2 第 17 題\n`
          + `  T3-2   — 案例 3 第 2 題\n`
          + `  N63    — 增題 NewQ 第 63 題\n`
          + `這個分頁收了 ${S.pool.length} 題：${jumpRange(false)}。按 / 鍵可以快速跳到這個欄位。`)
    : (EN ? `Type a question number (1-${S.pool.length}, same numbering as the overview) and press Enter. Press / to focus.`
          : `輸入題號按 Enter 直接跳到那一題（本輪 1-${S.pool.length} 題，和「作答總覽」的編號一樣）。按 / 鍵可以快速跳到這個欄位。`);
  if(off) sayJump("");
}

function jumpTo(raw){
  const EN = S.lang === "en";
  if(jumpOff()) return false;
  const want = parseJump(raw);
  if(!want){
    sayJump(EN ? "Type 17 for no. 17 of this round, or 2-17 / T3-2 / N63 for the number printed in the PDF."
               : "打 17 跳本輪第 17 題；打 2-17、T3-2、N63 跳原始文件上的題號。", true);
    return false;
  }

  const n = want.pos;
  let i = -1, byNo = false;
  if(want.sec){                                    /* 「段-題號」＝原始文件上的位置 */
    i = S.pool.findIndex(q => hasSrc(q) && q.sec === want.sec && q.no === want.no);
    byNo = i >= 0;
  } else if(n >= 1 && n <= S.pool.length){
    i = n - 1;                                     /* 一個數字＝本輪第幾題 */
  }
  if(i < 0){
    sayJump(want.sec
      ? (EN ? `${secName(want.sec, true)} #${want.no} is not in this tab (${S.pool.length} questions: ${jumpRange(true)}).`
            : `這個分頁裡沒有${secName(want.sec, false)}第 ${want.no} 題（這裡收了 ${S.pool.length} 題：${jumpRange(false)}）。`)
      : (EN ? `No question ${n} in this round (1-${S.pool.length}).`
            : `這一輪沒有第 ${n} 題（可跳 1-${S.pool.length} 題）。`), true);
    return false;
  }
  /* 跳到哪一題就講清楚是照哪一種號碼跳的，免得和另一種號碼搞混 */
  const lab = srcLabel(S.pool[i], EN);
  const where = byNo
    ? (EN ? `${lab} — no. ${i+1} of ${S.pool.length} this round`
          : `${lab}（本輪第 ${i+1} / ${S.pool.length} 題）`)
    : (EN ? `no. ${i+1} of this round${lab ? ` — ${lab}` : ""}`
          : `本輪第 ${i+1} 題${lab ? `（題目上標的是${lab}）` : ""}`);
  if(i === S.idx){
    sayJump((EN ? "Already on " : "已經在") + where + (EN ? "." : "了。"));
    return true;
  }
  closeOverview();
  S.idx = i;
  renderQ();
  window.scrollTo(0, 0);
  sayJump((EN ? "Jumped to " : "跳到") + where + (EN ? "." : "。"));
  return true;
}

jumpForm.addEventListener("submit", e=>{
  e.preventDefault();
  if(jumpTo(jumpNo.value)){ jumpNo.value = ""; jumpNo.blur(); }
});
/* 在輸入框裡按 Esc＝放棄跳題，把鍵盤還給作答（A-F、←／→） */
jumpNo.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ jumpNo.value = ""; jumpNo.blur(); e.stopPropagation(); }
});

/* =====================================================================
   事件
   ===================================================================== */
/* 模擬考沒作答就想往下一題：擋住並說明（原廠考試也是這樣，不給空著跳過）。
   練習模式有「跳過」，走不到這裡。 */
function nagUnanswered(part){
  const EN = S.lang === "en";
  verdict.className = "verdict show fail";
  verdict.textContent = part
    ? (EN ? "Some blanks are still empty — fill them all in before moving on."
          : "還有空格沒填，全部填完才能繼續。")
    : (EN ? "You have not answered this question yet. Answer it before moving on"
          + " — or jump to another number from the Overview to come back later."
          : "你還沒作答，答完才能按「下一題」；想先擱著晚點再看，可以從「作答總覽」跳到別題。");
  verdict.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* 模擬考往下一題之前的關卡（回傳 true＝擋下來了）：
   沒作答、複選題沒選滿、多格題型沒填完，都不放行——跟原廠考試一樣沒有「跳過」。
   「上一題」「作答總覽」「交卷」不受限制，真的想擱著就從總覽跳到別題。 */
function examGate(){
  const q = S.pool[S.idx];
  if(!q) return false;
  if(ansEmpty(q, S.ans)){ nagUnanswered(false); return true; }
  if(mcShort(q, S.ans)){ nagMulti(q); return true; }
  if(!ansFull(q, S.ans)){ nagUnanswered(true); return true; }
  return false;
}

btnPrev.addEventListener("click", prevQ);
btnCheck.addEventListener("click", ()=>{
  if(btnCheck.dataset.mode === "again"){ startRound(true); return; }
  if(S.exam){
    /* 複選題要選滿「需選 N 項」才能往下走，跟原廠考試一致 */
    if(examGate()) return;
    /* 最後一題的「下一題」不會直接交卷，而是先開總覽讓你檢查 */
    if(S.idx >= S.pool.length-1) openOverview(true); else { S.idx++; renderQ(); window.scrollTo(0,0); }
    return;
  }
  if(S.graded) nextQ(); else grade(false);
});
btnReveal.addEventListener("click", ()=>{
  if(S.exam){ openOverview(false); return; }
  grade(true);
});
btnNext.addEventListener("click", ()=>{
  if(S.exam){ openOverview(true); return; }   /* 交卷＝先進確認畫面，不直接給分 */
  nextQ();                                    /* 練習模式：跳過＝不批改直接走，這題不計分 */
});

/* 鍵盤：← → 翻題，Esc 關掉總覽 */
document.addEventListener("keydown", e=>{
  if(e.target.matches("input, textarea, select")) return;
  if(e.key === "Escape"){
    if(infowrap.classList.contains("show")){ closeInfo(); return; }
    if(cfgwrap.classList.contains("show")){ closeCfg(); return; }
    if(statwrap.classList.contains("show")){ closeStat(); return; }
    if(ovwrap.classList.contains("show")){ closeOverview(); return; }
  }
  if(ovwrap.classList.contains("show") || statwrap.classList.contains("show")
     || cfgwrap.classList.contains("show") || infowrap.classList.contains("show")) return;
  if(e.key === "/" && !jumpNo.disabled){ jumpNo.focus(); jumpNo.select(); e.preventDefault(); return; }
  if(e.key === "ArrowLeft" && !btnPrev.disabled){ prevQ(); }
  else if(e.key === "ArrowRight" && S.pool.length && S.idx < S.pool.length-1){
    /* 模擬考的 → 還是要過關卡（不能空著跳過）；練習模式的 → 就是「跳過」 */
    if(S.exam && examGate()) return;
    S.idx++; renderQ(); window.scrollTo(0,0);
  }
});

document.querySelectorAll("nav.tabs button").forEach((b,i)=>{
  b.addEventListener("click", ()=>{
    if(S.exam){   /* 模擬考進行中切分頁＝放棄本次考試 */

/* =====================================================================
   題數說明：逐段列出題數，並解釋缺號是原始文件本身就跳號而不是漏做。
   數字全部從 BANK_DOC 現算，之後補題就會自己跟著更新。
   ===================================================================== */
const closeInfo = () => { infowrap.classList.remove("show"); infowrap.innerHTML = ""; };

function docGaps(){
  const src = BANK_DOC.filter(hasSrc);
  if(!src.length) return {total:0, gaps:[], secs:[]};

  const by = new Map();
  src.forEach(q=>{
    if(!by.has(q.sec)) by.set(q.sec, []);
    by.get(q.sec).push(q.no);
  });

  const secs = [], gaps = [];
  [...by.entries()]
    .sort((a,b) => secRank(a[0]) - secRank(b[0]))
    .forEach(([sec, nos])=>{
      const max = Math.max(...nos), seen = new Set(nos), miss = [];
      for(let i = 1; i <= max; i++) if(!seen.has(i)) miss.push(i);
      miss.forEach(no => gaps.push({sec, no}));
      secs.push({sec, total:nos.length, max, gaps:miss});
    });
  return {total:src.length, gaps, secs};
}

function infoBtnTitle(en){
  const g = docGaps();
  if(!g.gaps.length) return en ? `Question count: all ${g.total} questions are present, no gaps`
                                : `題數說明：全部 ${g.total} 題都在，沒有跳號`;
  return en ? `Question count: ${g.total} questions by section, and which numbers the PDF skips`
            : `題數說明：${g.total} 題的逐段分布，以及原文跳掉哪些題號`;
}

function openInfo(){
  const EN = S.lang === "en";
  const g = docGaps();
  const hasGaps = g.gaps.length > 0;
  const chip = x => `<i>${secName(x.sec, EN)} #${x.no}</i>`;
  const chips = g.gaps.map(chip).join("");

  /* 逐段一行：段名、段內題數、段內跳掉的題號 */
  const secRows = g.secs.map(s => {
    const miss = s.gaps.length
      ? `<em>#${s.gaps.join("</em> <em>#")}</em>`
      : (EN ? "<i>no gaps</i>" : "<i>沒有跳號</i>");
    return `<div class="inforow"><b>${secName(s.sec, EN)}</b>`
         + `<span>${s.total} ${EN ? "questions" : "題"}</span>`
         + `<span class="miss">${miss}</span></div>`;
  }).join("");

  const body = EN ? `
    <h2>${hasGaps ? `${g.total} questions, by section`
                  : `All ${g.total} questions are present, no gaps`}</h2>
    <p class="ovsub">Nothing is missing — the document bank is complete.</p>
    <div class="infosec">
      <span class="lab">Where the numbers come from</span>
      <p>Each question carries the position it has in the source PDF — the section plus the <em>Question #</em> printed on it. The PDF is split into <em>Question Set 1–6</em>, <em>Testlet 1–10</em> (case studies) and the <em>NewQ</em> supplements, and <b>each section restarts its numbering at 1</b>, so it takes both parts to name a question.</p>
      <p>That is why a gap <b>only means anything inside one section</b>: Question Set 1 ends at #40 and Question Set 2 starts again at #1.</p>
      <div class="inforows">${secRows}</div>
    </div>
    ${hasGaps ? `<div class="infosec">
      <span class="lab">Skipped numbers</span>
      <p>These ${g.gaps.length} numbers do not exist in the source PDF. Every page was checked one by one — they were never transcribed because there is nothing there to transcribe. Typing one into the jump box will simply find nothing.</p>
      <div class="infonums">${chips}</div>
    </div>` : ""}` : `
    <h2>${hasGaps ? `${g.total} 題的逐段分布` : `全部 ${g.total} 題都在，沒有跳號`}</h2>
    <p class="ovsub">沒有漏做，文件題庫已經是完整的。</p>
    <div class="infosec">
      <span class="lab">題號是怎麼來的</span>
      <p>每一題都直接帶著它在原始文件裡的位置——所屬區段，加上題目上印的 <em>Question #</em>。來源 PDF 分成 <em>Question Set 1–6</em>、<em>Testlet 1–10</em>（案例研究）與兩份 <em>NewQ</em> 增題，而且<b>每一段的題號都從 1 重新算</b>，所以要兩格才認得出是哪一題。</p>
      <p>也因此，<b>缺號只在同一段之內才有意義</b>：題組 1 到 #40 就結束，題組 2 又從 #1 開始。</p>
      <div class="inforows">${secRows}</div>
    </div>
    ${hasGaps ? `<div class="infosec">
      <span class="lab">跳掉的題號</span>
      <p>這 ${g.gaps.length} 個題號在原始 PDF 裡根本不存在。已經逐頁比對確認過，不是轉錄時漏掉，是原本就沒有這幾題。把它們打進跳題欄也只會找不到題目。</p>
      <div class="infonums">${chips}</div>
    </div>` : ""}`;

  infowrap.innerHTML = `<div class="ovcard">${body}
    <div class="ovbtns"><button type="button" class="go" data-act="close">${EN ? "Got it" : "知道了"}</button></div>
  </div>`;
  infowrap.classList.add("show");
}

/* 使用說明：收合狀態記起來，不用每次都收 */
hintBox.addEventListener("toggle", ()=>{
  try{ localStorage.setItem(HINT_KEY, hintBox.open ? "1" : "0"); }catch(e){}
});

/* 鍵盤：A-F 選項、Enter 批改／下一題 */
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const k = e.key.toUpperCase();
  const li = LETTER.indexOf(k);
  if(li > -1){
    const b = qbox.querySelectorAll(".opt")[li];
    if(b && !b.disabled){ b.click(); e.preventDefault(); }
    return;
  }
  if(e.key === "Enter"){ btnCheck.click(); e.preventDefault(); }
});

/* sticky 表頭高度 */
const topBar = document.querySelector("header.top");
const syncTop = () => document.documentElement.style.setProperty("--topH", topBar.offsetHeight + "px");
syncTop();
addEventListener("resize", syncTop);
addEventListener("orientationchange", syncTop);
if(window.ResizeObserver) new ResizeObserver(syncTop).observe(topBar);

try{
  const saved = localStorage.getItem(LANG_KEY);
  if(LANGS.indexOf(saved) > -1) S.lang = saved;
  const savedSrc = localStorage.getItem(SRC_KEY);
  if(savedSrc === "doc" && BANK_DOC.length){    /* 文件題庫還沒匯入就不還原 */
    S.src = "doc"; BANK = BANK_DOC; wrongSet = WRONG.doc; starSet = STAR.doc;
    /* qstat 與 hist 也要一起換。漏掉這兩個的話，在文件題庫重新整理之後，
       統計與歷次成績會讀到自製題庫那一份，而且新的紀錄也寫進自製題庫的鍵，
       兩份題庫「各自獨立」的保證就破了。setSource() 有換，這裡原本漏了。 */
    qstat = QSTAT.doc; hist = HIST.doc;
  }
  const savedTab = parseInt(localStorage.getItem(TAB_KEY), 10);
  if(savedTab >= 0 && savedTab <= TAB_MAX) S.tab = savedTab;
  if(localStorage.getItem(HINT_KEY) === "1") hintBox.open = true;
  const savedOrder = localStorage.getItem(ORDER_KEY);
  if(savedOrder === "seq" || savedOrder === "rand") S.order = savedOrder;
}catch(e){}
document.querySelectorAll("nav.tabs button").forEach((b,i)=>b.setAttribute("aria-selected", i === S.tab));
mergeEN();
restoreSessions();     /* 上次沒做完的分頁進度，關掉瀏覽器再回來也接得下去 */
applyLang();
startRound();
</script>

</body>
</html>
