 q:"注意：本題與 Q147、Q149、Q153、Q159 情境完全相同，只是提出的解法不同（背景重建說明同 Q147）。\n⟦解法：刪除 BlockAllOther443 這條輸入安全性規則。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。直接刪除這條規則雖然可能解除某部分阻擋，但這麼做等於把 443 對「所有」來源全面開放，既不精準也不是官方認可的解法；真正的問題在於「允許特定來源的規則優先順序不夠高」或「負載平衡器的健康探測流量沒有被放行」，直接刪除既有規則不是正確的處理方式。",
 en:{q:"Solution: You delete the BlockAllOther443 inbound security rule. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Deleting the rule opens 443 broadly rather than fixing the actual priority/health-probe issue."}},

{n:149, code:"AZ104-Q149", d:3, od:4, t:"負載平衡器健康探測被 NSG 擋住", tEn:"NSG blocking the load balancer's health probe", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q147、Q148、Q153、Q159 情境完全相同，只是提出的解法不同（背景重建說明同 Q147）。\n⟦解法：修改 Allow_131.107.100.50 這條輸入安全性規則的優先順序。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。既然已經有一條允許 131.107.100.50 的規則存在，只是優先順序數字比擋下流量的 BlockAllOther443 規則大（優先權較低，比對不到就先被擋規則攔截），只要把這條允許規則的優先順序數字調小，讓它排在擋下規則之前生效，就能讓這個來源的流量成功放行。",
 en:{q:"Solution: You modify the priority of the Allow_131.107.100.50 inbound security rule. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. The allow rule already exists but loses to the deny rule on priority; lowering its priority number lets it match first."}},

{n:150, code:"AZ104-Q150", d:3, od:4, t:"AKS 網路類型：Pod 要有可路由的 IP", tEn:"AKS network type giving pods routable IPs", k:"mc",
 src:"quiz4:html",
 q:"你打算部署一個 Azure Kubernetes Service (AKS) 叢集，支援一個應用程式 App1。內部部署的用戶端要直接用 Pod 的 IP 位址連到 App1。\n你需要替 AKS 叢集選擇支援這種需求的網路類型。⟦你應該選擇什麼？⟧",
 o:["kubenet", "Azure Container Networking Interface (CNI)", "混合連線端點 (Hybrid Connection endpoints)", "Azure Private Link"],
 a:[1],
 e:"用 Azure CNI 時，每個 Pod 都會從虛擬網路子網路直接拿到一個 IP 位址，這個 IP 在整個虛擬網路（甚至對等互連、VPN 連進來的內部部署網路）裡都是可以直接路由存取的，符合「用戶端要用 Pod 的 IP 直接連線」的需求。kubenet（AKS 預設）的 Pod IP 只存在於邏輯上獨立的位址空間，節點會做 NAT 轉換，Pod 本身的 IP 不能被虛擬網路外部直接路由存取；混合連線端點、Private Link 都是別的用途的服務，AKS 的網路模式只有 kubenet 與 Azure CNI 這兩種選擇。",
 en:{q:"On-premises clients connect to App1 by using the IP address of the pod. What should you choose?",
  o:["kubenet", "Azure Container Networking Interface (CNI)", "Hybrid Connection endpoints", "Azure Private Link"],
  e:"Azure CNI assigns each pod a directly routable VNet IP address; kubenet pods use NAT and aren't directly reachable."}},

{n:151, code:"AZ104-Q151", d:3, od:4, t:"依 IP 位址建立後端集區的限制", tEn:"Restrictions on IP-address-based backend pools", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q142、Q143、Q144 情境完全相同，只是提出的解法不同。\n（情境同 Q142：要把 VM1、VM2 加進標準內部負載平衡器 LB1 的後端集區。）\n⟦解法：把公用 IP 位址從 VM2 的網路介面卡解除關聯。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。解除關聯公用 IP 跟「能不能依 IP 位址加入標準負載平衡器的後端集區」這個限制條件（IP 必須是標準 SKU）完全沒有關係，也沒有幫 VM1 或 VM2 完成加入後端集區這個動作。",
 en:{q:"Solution: You disassociate the public IP address from the network interface of VM2. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. This doesn't address the Standard-SKU requirement or actually add either VM to the backend pool."}},

{n:152, code:"AZ104-Q152", d:3, od:4, t:"Azure 內部反解 FQDN", tEn:"Azure internal reverse-DNS FQDN", k:"mc",
 src:"quiz4:html",
 q:"你有一個 Azure 訂用帳戶，內含兩台虛擬機器：VM1（私人 IP 10.0.0.4）與 VM2，兩者在同一個虛擬網路內。\n你從 VM2 對 10.0.0.4 做反向 DNS 查詢。⟦會傳回哪個 FQDN？⟧",
 o:["vm1.core.windows.net","vm1.azure.com","vm1.westeurope.cloudapp.azure.com","vm1.internal.cloudapp.net"],
 a:[3],
 e:"Azure 提供的內建 DNS 服務，對虛擬網路「內部」的私人 IP 做反向查詢時，回傳的是 `<主機名稱>.internal.cloudapp.net` 這種格式的內部 FQDN，跟對外公用的 `<名稱>.<地區>.cloudapp.azure.com` 格式是分開的兩套命名。所以從同一個虛擬網路內部查 VM1 的私人 IP，會得到 vm1.internal.cloudapp.net。",
 en:{q:"You perform a reverse DNS lookup for 10.0.0.4 from VM2. Which FQDN will be returned?",
  o:["vm1.core.windows.net","vm1.azure.com","vm1.westeurope.cloudapp.azure.com","vm1.internal.cloudapp.net"],
  e:"Azure's built-in DNS returns the internal FQDN format <hostname>.internal.cloudapp.net for private IP reverse lookups within the VNet."}},

{n:153, code:"AZ104-Q153", d:3, od:4, t:"負載平衡器健康探測被 NSG 擋住", tEn:"NSG blocking the load balancer's health probe", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q147、Q148、Q149、Q159 情境完全相同，只是提出的解法不同（背景重建說明同 Q147）。\n⟦解法：新增一條輸入安全性規則，允許來源標籤為 AzureLoadBalancer 的所有流量，優先順序設為 150。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。負載平衡器會定期對後端執行個體發送健康探測（探測流量的來源標記為 AzureLoadBalancer），如果 NSG 沒有放行這個來源，探測會被擋下、負載平衡器就會判定該後端「不健康」，進而不把任何使用者流量（包含 131.107.100.50 這個原本合法的來源）導向它，看起來就像連線失敗。用一個優先順序數字夠小（150，優先權高）的規則放行 AzureLoadBalancer 來源，健康探測就能通過，後端恢復健康狀態，使用者連線也就能成功導入。",
 en:{q:"Solution: You create an inbound security rule that allows any traffic from the AzureLoadBalancer source with priority 150. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Load balancer health probes come from the AzureLoadBalancer tag; if NSG blocks them, the backend is marked unhealthy and stops receiving real traffic. Allowing it with high priority fixes the probe, restoring connectivity."}},

{n:154, code:"AZ104-Q154", d:3, od:4, t:"檢查兩台 VM 間流量三小時", tEn:"Inspecting traffic between two VMs for three hours", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q155、Q156、Q158 情境完全相同，只是提出的解法不同。\n你管理一個位於 West US 地區的虛擬網路 VNet1，裡面有兩台跑 Windows Server 的虛擬機器 VM1、VM2。\n你需要檢視從 VM1 到 VM2、為期三小時的完整網路流量。\n⟦解法：在 Azure Network Watcher 建立一個封包擷取 (packet capture)。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。Network Watcher 的封包擷取功能可以針對指定虛擬機器建立擷取工作階段，設定擷取時間（可以長達數小時），完整記錄進出的流量封包，用來做網路異常診斷，正好符合「檢視完整流量」這個需求。",
 en:{q:"Solution: From Azure Network Watcher, you create a packet capture. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Network Watcher's packet capture can run for a set duration (up to hours), fully recording traffic for diagnosis."}},

{n:155, code:"AZ104-Q155", d:3, od:4, t:"檢查兩台 VM 間流量三小時", tEn:"Inspecting traffic between two VMs for three hours", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q154、Q156、Q158 情境完全相同，只是提出的解法不同。\n（情境同 Q154：要檢視 VM1 到 VM2 三小時的完整流量。）\n⟦解法：在 Azure Network Watcher 建立一個連線監視器 (connection monitor)。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。連線監視器持續回報的是「可達性、延遲、拓樸變化」這類摘要性的連線健康狀態，不是完整的封包內容記錄，沒辦法拿來檢視「完整的網路流量」內容，這裡要的是封包擷取而不是連線監視器。",
 en:{q:"Solution: From Azure Network Watcher, you create a connection monitor. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Connection monitor reports reachability/latency summaries, not full packet-level traffic content."}},

{n:156, code:"AZ104-Q156", d:3, od:4, t:"檢查兩台 VM 間流量三小時", tEn:"Inspecting traffic between two VMs for three hours", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q154、Q155、Q158 情境完全相同，只是提出的解法不同。\n（情境同 Q154：要檢視 VM1 到 VM2 三小時的完整流量。）\n⟦解法：在效能監視器 (Performance Monitor) 建立一個資料收集器集合 (Data Collector Set)。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。Windows 內建的效能監視器收集的是作業系統效能計數器（CPU、記憶體、磁碟等指標），不是網路封包內容，無法用來檢視兩台機器之間的完整網路流量，應該用 Network Watcher 的連線監視器或封包擷取功能。",
 en:{q:"Solution: From Performance Monitor, you create a Data Collector Set (DCS). Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Performance Monitor collects OS performance counters, not network packet traffic; use Network Watcher instead."}},

{n:157, code:"AZ104-Q157", d:3, od:4, t:"建立輸入 NAT 規則前的先決條件", tEn:"Prerequisite before creating inbound NAT rules", k:"mc",
 src:"quiz4:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的資源，以及一個依下表設定好的負載平衡器 LB1。\n你打算建立新的輸入 NAT 規則，滿足以下需求：\n・讓網際網路可以透過 3389 埠，用遠端桌面連到 VM1。\n・讓網際網路可以透過 3389 埠，用遠端桌面連到 VM2。\n⟦在建立這些新的輸入 NAT 規則之前，你應該先在 LB1 建立什麼？⟧",
 o:["一個前端 IP 位址","一條負載平衡規則","一個健康探測","一個後端集區"],
 a:[0],
 e:"輸入 NAT 規則一定要綁定在負載平衡器的「前端 IP 設定」上（外部連線要先打到某個前端 IP 的某個埠，才能被 NAT 規則導向後端特定 VM 的對應埠）。如果 LB1 目前還沒有可用的前端 IP 設定，就必須先建立，才能繼續設定輸入 NAT 規則。負載平衡規則、健康探測、後端集區都是負載平衡器的其他功能，不是建立 NAT 規則的必要前提。",
 en:{q:"What should you create on LB1 before you can create the new inbound NAT rules?",
  o:["a frontend IP address","a load balancing rule","a health probe","a backend pool"],
  e:"Inbound NAT rules bind to a frontend IP configuration, which must exist first."}},

{n:158, code:"AZ104-Q158", d:3, od:4, t:"檢查兩台 VM 間流量三小時", tEn:"Inspecting traffic between two VMs for three hours", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q154、Q155、Q156 情境完全相同，只是提出的解法不同。\n（情境同 Q154：要檢視 VM1 到 VM2 三小時的完整流量。）\n⟦解法：在 Azure Monitor 對「輸入網路流量 (Network In)」與「輸出網路流量 (Network Out)」建立度量 (metric)。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。這兩個度量只會給出流量的總量（進出多少位元組）這種彙總統計數字，看不到實際的封包內容或針對「VM1 到 VM2」這樣特定一對一連線的細節，無法拿來檢視完整的網路流量。",
 en:{q:"Solution: From Azure Monitor, you create a metric on Network In and Network Out. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. These metrics only give aggregate byte counts, not full packet-level traffic detail for a specific VM-to-VM connection."}},

{n:159, code:"AZ104-Q159", d:3, od:4, t:"負載平衡器健康探測被 NSG 擋住", tEn:"NSG blocking the load balancer's health probe", k:"mc",
 src:"quiz4:html",
 q:"注意：本題與 Q147、Q148、Q149、Q153 情境完全相同，只是提出的解法不同（背景重建說明同 Q147）。\n⟦解法：新增一條輸入安全性規則，拒絕來自 131.107.100.50 的所有流量，優先順序設為 64999。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。跟 Q147 是同一個解法（只是欄位名稱從「cost」換成「優先順序」，意思一樣），新增拒絕規則沒有解決真正的問題（允許規則優先順序不夠高、或健康探測被擋），達不成目標。",
 en:{q:"Solution: You create an inbound security rule that denies all traffic from 131.107.100.50 with priority 64999. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Same as Q147 — adding a deny rule doesn't address the real priority/health-probe issue."}},

{n:160, code:"AZ104-Q160", d:3, od:4, t:"對等互連前要先解決位址空間重疊", tEn:"Resolving overlapping address spaces before peering", k:"mc",
 src:"quiz4:html",
 q:"你有一個虛擬網路 VNet1，如圖例所示，位址空間是 10.2.0.0/16，目前沒有任何裝置連接到它。\n你打算把 VNet1 對等互連到另一個虛擬網路 VNet2，VNet2 的位址空間同樣是 10.2.0.0/16。\n你需要建立這個對等互連。⟦你應該最先做什麼？⟧",
 o:["修改 VNet1 的位址空間","替 VNet1 新增一個閘道子網路","在 VNet1 與 VNet2 各自建立一個子網路","在 VNet2 設定一個服務端點"],
 a:[0],
 e:"兩個虛擬網路要建立對等互連，位址空間絕對不能重疊；這裡 VNet1 與 VNet2 的位址空間完全相同（都是 10.2.0.0/16），必然重疊，對等互連一定會被拒絕。因為 VNet1 目前還沒有任何裝置連接，改它的位址空間影響最小、最安全，所以應該先修改 VNet1 的位址空間，讓兩邊不再重疊，才能繼續建立對等互連。閘道子網路、一般子網路、服務端點都無法解決位址空間重疊這個根本問題。",
 en:{q:"You need to create the peering. What should you do first?",
  o:["Modify the address space of VNet1.","Add a gateway subnet to VNet1.","Create a subnet on VNet1 and VNet2.","Configure a service endpoint on VNet2."],
  e:"VNet1 and VNet2 share the same address space (10.2.0.0/16); peering requires non-overlapping spaces, so VNet1's address space must change first (safest since nothing is connected to it yet)."}},


{n:81, code:"AZ104-Q81", d:2, od:3, t:"維護期間維持最低 VM 數量", tEn:"Keeping a minimum VM count during maintenance", k:"mc",
 src:"quiz3:html",
 q:"你打算把一套分散式的內部部署應用程式 App1，搬到 Azure 訂用帳戶，搬移後 App1 會跑在好幾台 Azure 虛擬機器上。\n你需要確保在 Azure 計畫性維護期間，App1 仍然至少有 8 台虛擬機器在執行。⟦你應該建立什麼？⟧",
 o:["一個含 10 個執行個體的虛擬機器擴展集","一個含三個容錯網域、一個更新網域的可用性設定組","一個含 10 個更新網域、一個容錯網域的可用性設定組","一個含 12 個執行個體的虛擬機器擴展集"],
 a:[0],
 e:"計畫性維護是依「更新網域」分批進行，同一時間只會有一個更新網域被重開機。擴展集預設會把執行個體平均分散到最多 5 個更新網域，10 台執行個體平均分到 5 個更新網域，同一時間最多只有 2 台受影響、重開機，還有至少 8 台繼續服務，符合需求。可用性設定組最多只能放 2 個容錯網域、20 個更新網域，但選項裡「三個容錯網域、一個更新網域」或「10 個更新網域、一個容錯網域」代表所有 VM 全擠在同一個更新網域，維護時會一次全部中斷；12 台的擴展集雖然也能撐住 8 台，但沒有 10 台這個選項精簡、且此題重點是「用擴展集」這個機制本身，10 台是官方標準答案。",
 en:{q:"You need to ensure that App1 always runs on at least eight virtual machines during planned Azure maintenance. What should you create?",
  o:["one virtual machine scale set that has 10 virtual machines instances","one Availability Set that has three fault domains and one update domain","one Availability Set that has 10 update domains and one fault domain","one virtual machine scale set that has 12 virtual machines instances"],
  e:"A scale set of 10 instances spreads across multiple update domains, so planned maintenance only reboots one domain at a time, leaving at least 8 instances running."}},

{n:82, code:"AZ104-Q82", d:2, od:3, t:"VM 事件記錄警示所需元件", tEn:"Components required for a VM event-log alert", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 AZ104-Q64~Q66、Q104 是同一組情境的重複解法題，只是提出的解法不同。\n你有一台執行 Windows Server 2016 的虛擬機器 VM1。\n你需要在 VM1 的系統事件記錄檔一小時內出現超過兩筆錯誤事件時，觸發 Azure 警示。\n⟦解法：在 VM1 上建立一個事件訂閱 (event subscription)，在 Azure Monitor 建立警示，來源指定為 VM1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「事件訂閱」不是這裡需要的機制，Azure Monitor 的記錄型警示規則也不能直接把來源指定成單一 VM 本身。正確做法是建立 Log Analytics 工作區、在 VM1 安裝 Microsoft Monitoring Agent，把事件記錄送進工作區，警示規則的來源指向工作區。",
 en:{q:"Solution: You create an event subscription on VM1 and specify VM1 as the alert source. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. You need a Log Analytics workspace with the Monitoring Agent installed on VM1, with the alert sourced from the workspace."}},

{n:83, code:"AZ104-Q83", d:2, od:3, t:"立即把 VM 移到別的主機", tEn:"Moving a VM to a different host immediately", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q84、Q85、Q103 情境完全相同，只是提出的解法不同。\n你有一台虛擬機器 VM1，是用一份自訂 ARM 範本 ARM1.json 部署的。\n你收到通知，VM1 即將受到維護作業影響。\n你需要立刻把 VM1 移到不同的主機。\n⟦解法：在「概觀 (Overview)」刀鋒選單，把這台虛擬機器搬到不同的訂用帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。搬到不同的訂用帳戶並不會讓 VM 換到不同的實體主機，這是資源管理層面的操作，跟底層硬體無關。要立刻換到不同實體主機，正確做法是「重新部署 (Redeploy)」VM，Azure 會把它搬到基礎架構裡的新節點並重新開機。",
 en:{q:"Solution: From the Overview blade, you move the virtual machine to a different subscription. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Moving to a different subscription doesn't change the underlying physical host; you need to redeploy the VM."}},

{n:84, code:"AZ104-Q84", d:2, od:3, t:"立即把 VM 移到別的主機", tEn:"Moving a VM to a different host immediately", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q83、Q85、Q103 情境完全相同，只是提出的解法不同。\n（情境同 Q83：VM1 即將受維護影響，需要立刻換到不同主機。）\n⟦解法：在「重新部署 (Redeploy)」刀鋒選單，點選「重新部署」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。「重新部署」會把 VM 搬到 Azure 基礎架構裡的新節點（新的實體主機），然後重新開機，同時保留原本的設定與相依資源，正是解決「即將受維護影響」這個問題最直接的方式。",
 en:{q:"Solution: From the Redeploy blade, you click Redeploy. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Redeploy moves the VM to a new node and powers it back on, retaining its configuration and associated resources."}},

{n:85, code:"AZ104-Q85", d:2, od:3, t:"立即把 VM 移到別的主機", tEn:"Moving a VM to a different host immediately", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q83、Q84、Q103 情境完全相同，只是提出的解法不同。\n（情境同 Q83：VM1 即將受維護影響，需要立刻換到不同主機。）\n⟦解法：在「更新管理 (Update management)」刀鋒選單，點選「啟用」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「更新管理」啟用的是作業系統修補程式的管理功能，跟把 VM 換到不同實體主機完全無關。正確做法仍然是使用「重新部署」功能。",
 en:{q:"Solution: From the Update management blade, you click Enable. Does this meet the goal?",

  e:"No. Update management handles OS patching, unrelated to moving the VM to a different physical host; use Redeploy instead."}},

{n:86, code:"AZ104-Q86", d:2, od:3, t:"新增自訂網域到 Web App", tEn:"Adding a custom domain to a web app", k:"mc",

 q:"你有一個 Azure 訂用帳戶，內含一個 Web 應用程式 webapp1。\n你需要把自訂網域 www.contoso.com 加到 webapp1。⟦你應該最先做什麼？⟧",
 o:["建立一筆 DNS 記錄","新增一個連接字串","上傳一張憑證","停止 webapp1"],

{n:87, code:"AZ104-Q87", d:2, od:3, t:"把 VM 連到另一個虛擬網路", tEn:"Connecting a VM to a different VNet", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 AZ104-Q67~Q69 是同一組情境的重複解法題。\n你有一個 Azure 訂用帳戶，內含下表所示的資源（VM1 連接到 VNET1）。\n你需要把 VM1 連到 VNET2。\n⟦解法：建立一張新的網路介面卡，並把它加到 VM1。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。VM 建立時綁定的虛擬網路無法事後更換，就算新增一張網路介面卡，這張網卡也連不到 VNET2，因為 VM1 本身仍然歸屬於 VNET1。正確做法是刪除 VM1、重新建立，並在建立時把新的網路介面接到 VNET2。",
 en:{q:"Solution: You create a new network interface, and then you add the network interface to VM1. Does this meet the goal?",

  e:"No. A VM's VNet binding can't be changed after creation; delete and recreate the VM with a new NIC on VNET2."}},

{n:88, code:"AZ104-Q88", d:1, od:1, t:"Azure AD 加入裝置的本機系統管理員", tEn:"Local admins on an Azure AD joined device", k:"mc",
 src:"quiz3:html",
 q:"你有一個 Azure AD 租用戶 adatum.com，內含下表所示的使用者：\n| 使用者 | 身分 |\n|---|---|\n| User1 | 一般使用者 |\n| User2 | 全域系統管理員 |\n| User3 | 一般使用者 |\n| User4 | 一般使用者 |\nadatum.com 的設定如下：\n・「使用者可以把裝置加入 Azure AD」設定為僅 User1。\n・「Azure AD 加入裝置的其他本機系統管理員」設定為「無」。\n你把 Windows 10 部署到一台電腦 Computer1，User1 把 Computer1 加入 adatum.com。\n你需要判斷 Computer1 本機系統管理員群組的成員。⟦哪些使用者是本機系統管理員群組的成員？⟧",
 o:["僅 User1","僅 User2","僅 User1 和 User2","僅 User1、User2 和 User3","User1、User2、User3 和 User4"],
 a:[2],
 e:"Azure AD 加入裝置時，預設會把三種身分自動加進本機系統管理員群組：全域系統管理員（此處為 User2）、裝置系統管理員角色的成員、以及「執行加入動作的使用者」（此處是 User1）。「其他本機系統管理員」這項設定已經設為無，代表沒有額外指定的人。所以本機系統管理員只有 User1（裝置擁有者/加入者）與 User2（全域系統管理員），User3、User4 都不是。",

{n:89, code:"AZ104-Q89", d:2, od:3, t:"跨地區的 VM 備份保存庫", tEn:"Vault region matching for VM backup", k:"mc",
 src:"quiz3:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含一個 Recovery Services 保存庫 Vault1，以及下表所示的虛擬機器（來源網頁未保留完整表格截圖；依解析可知只有部分虛擬機器與 Vault1 位於同一個地區）。\n你打算用 Vault1 備份盡量多台虛擬機器。⟦哪些虛擬機器可以備份到 Vault1？⟧",
 o:["僅 VM1","僅 VM3 和 VMC","VM1、VM2、VM3、VMA、VMB 和 VMC","僅 VM1、VM3、VMA 和 VMC","僅 VM1 和 VM3"],
 a:[3],
 e:"Recovery Services 保存庫要保護的虛擬機器，必須跟保存庫在同一個地區；如果虛擬機器分散在好幾個地區，就要在每個地區各自建立一個保存庫。這題只有 VM1、VM3、VMA、VMC 跟 Vault1 在同一地區，其餘（VM2、VMB）在別的地區，不能用 Vault1 備份。",

{n:90, code:"AZ104-Q90", d:2, od:3, t:"設定 AKS 叢集自動調整", tEn:"Configuring AKS cluster autoscaler", k:"mc",

{n:91, code:"AZ104-Q91", d:2, od:3, t:"把容器映像部署到 AKS", tEn:"Deploying a container image to AKS", k:"mc",
 src:"quiz3:html",
 q:"你在 Azure 訂用帳戶裡建立了以下資源：一個 Azure Container Registry 執行個體 Registry1，以及一個 Azure Kubernetes Service (AKS) 叢集 Cluster1。你在管理工作站上建立了一個容器映像 App1。\n你需要把 App1 部署到 Cluster1。⟦你應該最先做什麼？⟧",
 o:["執行 docker push 命令","建立一個 App Service 方案","執行 az acr build 命令","執行 az aks create 命令"],

{n:92, code:"AZ104-Q92", d:2, od:3, t:"設定鄰近放置群組", tEn:"Configuring a proximity placement group", k:"mc",

{n:93, code:"AZ104-Q93", d:2, od:3, t:"查看資源建立時間", tEn:"Viewing resource creation time", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 AZ104-Q53~Q55 是同一組情境的重複解法題。\n你有一個 Azure 訂用帳戶 Subscription1，內含一個資源群組 RG1，裡面的資源都是用範本部署的。\n你需要查看這些資源的建立日期與時間。\n⟦解法：在「訂用帳戶」刀鋒選單選取該訂用帳戶，再點選「資源提供者 (Resource providers)」。⟧這個解法是否達成目標？",

{n:94, code:"AZ104-Q94", d:2, od:3, t:"擴展集部署時安裝 NGINX", tEn:"Installing NGINX at scale-set provisioning time", k:"mc",
 src:"quiz3:html",
 q:"你打算用 ARM 範本部署好幾台跑 Windows Server 2019 的 Azure 虛擬機器，組成一個虛擬機器擴展集。\n你需要確保這些虛擬機器部署完成後，都已經裝好 NGINX。⟦你應該使用什麼？⟧",
 o:["Azure App Service 的部署中心 (Deployment Center)","Desired State Configuration (DSC) 擴充功能","New-AzConfigurationAssignment 指令程式","Microsoft Intune 裝置設定原則"],
 a:[1],
 e:"虛擬機器擴充功能是在部署後自動執行設定／自動化的小型套件，DSC 擴充功能可以在範本裡宣告要套用的組態設定（例如安裝並啟動 NGINX），VM 佈建完成、開機後就會自動套用。部署中心是 App Service（PaaS Web App）的持續部署功能，不適用於 IaaS 虛擬機器；New-AzConfigurationAssignment 是 Azure Automation State Configuration 用的指令程式，跟這裡的部署流程不搭；Intune 設定原則管的是裝置合規/MDM，不是虛擬機器佈建時的軟體安裝機制。",
 en:{q:"You need to ensure that NGINX is available on all the virtual machines after they are deployed. What should you use?",
  o:["Deployment Center in Azure App Service","A Desired State Configuration (DSC) extension","the New-AzConfigurationAssignment cmdlet","a Microsoft Intune device configuration profile"],
  e:"A DSC (or custom script) extension applies post-deployment configuration automatically as each VM boots."}},

{n:95, code:"AZ104-Q95", d:2, od:3, t:"還原備份到不同的 VM", tEn:"Restoring a backup to a different VM", k:"mc",
 src:"quiz3:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的資源，全部虛擬機器都跑 Windows Server 2016。\n你在 VM1 上用 Windows Server Backup 備份了一個資料夾 Folder1（如圖例所示）。\n你打算把這份備份還原到另一台虛擬機器。你需要把備份還原到 VM2。⟦你應該最先做什麼？⟧",
 o:["在 VM1 安裝 Windows Server Backup 功能","在 VM2 安裝 Microsoft Azure Recovery Services 代理程式","在 VM1 安裝 Microsoft Azure Recovery Services 代理程式","在 VM2 安裝 Windows Server Backup 功能"],
 a:[1],
 e:"要把某台伺服器（VM1）用 Windows Server Backup 做的備份，還原到另一台伺服器（VM2），必須先在「目的地」VM2 安裝 Microsoft Azure Recovery Services (MARS) 代理程式，透過這個代理程式登入保存庫、瀏覽並取回備份資料進行還原。VM1 已經完成備份，不需要再裝一次備份相關元件；VM2 也不需要裝 Windows Server Backup 功能，因為還原是透過 MARS 代理程式進行的。",
 en:{q:"You need to restore the backup to VM2. What should you do first?",
  o:["From VM1, install the Windows Server Backup feature.","From VM2, install the Microsoft Azure Recovery Services Agent.","From VM1, install the Microsoft Azure Recovery Services Agent.","From VM2, install the Windows Server Backup feature."],
  e:"Install the MARS agent on the destination VM2 so it can connect to the vault and retrieve the backup for restore."}},

{n:96, code:"AZ104-Q96", d:3, od:4, t:"新網路介面卡必須同地區", tEn:"A new NIC must match the VM's region", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q97、Q98 情境完全相同，只是提出的解法不同。\n你有一個 Azure 訂用帳戶 Subscription1，內含下表所示的資源：VM1（位於 West US，透過網路介面卡 NIC1 連接到虛擬網路 VNET2）、資源群組 RG1（West US）、資源群組 RG2（West US）。\n你需要替 VM1 建立一張新的網路介面卡 NIC2。\n⟦解法：在 RG1、West US 建立 NIC2。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。要替 VM1 掛接新的網路介面卡，這張網卡必須跟 VM1（以及它連接的虛擬網路）位於「同一個地區」，這裡是 West US；資源群組本身可以是任何一個（RG1 或 RG2 都在 West US，選哪個資源群組不影響能不能掛接），只要地區對就符合需求。",
 en:{q:"Solution: You create NIC2 in RG1 and West US. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. A NIC must be in the same region as the VM/VNet (West US); the resource group choice doesn't matter."}},

{n:97, code:"AZ104-Q97", d:3, od:4, t:"新網路介面卡必須同地區", tEn:"A new NIC must match the VM's region", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q96、Q98 情境完全相同，只是提出的解法不同。\n（情境同 Q96：VM1 位於 West US，需要替它建立新的網路介面卡 NIC2。）\n⟦解法：在 RG2、Central US 建立 NIC2。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。網路介面卡必須跟它要連接的虛擬機器與虛擬網路位於同一個地區。VM1 位於 West US，NIC2 卻建在 Central US，地區不符，無法掛接到 VM1。",
 en:{q:"Solution: You create NIC2 in RG2 and Central US. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. The region (Central US) doesn't match VM1's region (West US)."}},

{n:98, code:"AZ104-Q98", d:3, od:4, t:"新網路介面卡必須同地區", tEn:"A new NIC must match the VM's region", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q96、Q97 情境完全相同，只是提出的解法不同。\n（情境同 Q96：VM1 位於 West US，需要替它建立新的網路介面卡 NIC2。）\n⟦解法：在 RG2、West US 建立 NIC2。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。地區同樣是 West US，跟 VM1 相符，資源群組選 RG2 也沒問題（資源群組不影響能不能掛接），符合需求。",
 en:{q:"Solution: You create NIC2 in RG2 and West US. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. The region matches (West US); resource group choice is irrelevant."}},

{n:99, code:"AZ104-Q99", d:2, od:3, t:"部署 YAML 檔到 AKS", tEn:"Deploying a YAML file to AKS", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q100、Q101 情境完全相同，只是提出的解法不同。\n你部署了一個 Azure Kubernetes Service (AKS) 叢集 AKS1。\n你需要把一個 YAML 檔部署到 AKS1。\n⟦解法：從 Azure Cloud Shell 執行 az aks 命令。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。az aks 系列命令是用來管理 AKS「叢集本身」（建立、調整節點數、取得憑證等），不是用來把 Kubernetes 資源清單（YAML）部署進叢集裡的工具。",
 en:{q:"Solution: From Azure Cloud Shell, you run az aks. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. az aks manages the cluster itself, not deploying Kubernetes manifests into it."}},

{n:100, code:"AZ104-Q100", d:2, od:3, t:"部署 YAML 檔到 AKS", tEn:"Deploying a YAML file to AKS", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q99、Q101 情境完全相同，只是提出的解法不同。\n（情境同 Q99：要把 YAML 檔部署到 AKS1。）\n⟦解法：從 Azure Cloud Shell 執行 kubectl 用戶端。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。kubectl 是 Kubernetes 官方的命令列工具，專門用來把 YAML 資源清單套用（apply）到叢集，是部署工作負載到 AKS 的標準做法。",
 en:{q:"Solution: From Azure Cloud Shell, you run the kubectl client. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. kubectl is the standard tool for applying YAML manifests to a Kubernetes cluster."}},

{n:101, code:"AZ104-Q101", d:2, od:3, t:"部署 YAML 檔到 AKS", tEn:"Deploying a YAML file to AKS", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q99、Q100 情境完全相同，只是提出的解法不同。\n（情境同 Q99：要把 YAML 檔部署到 AKS1。）\n⟦解法：從 Azure CLI 執行 azcopy。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。azcopy 是搬移 Blob／檔案儲存體資料用的工具，跟部署 Kubernetes 資源清單完全無關。",
 en:{q:"Solution: From Azure CLI, you run azcopy. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. azcopy moves blob/file storage data and has nothing to do with deploying Kubernetes manifests."}},

{n:102, code:"AZ104-Q102", d:2, od:3, t:"備份預檢警告狀態", tEn:"Backup pre-check Warning status", k:"mc",
 src:"quiz3:html",
 q:"你打算備份一台 Azure 虛擬機器 VM1，發現「備份預檢 (Backup Pre-Check)」狀態顯示「警告 (Warning)」。⟦這個警告狀態可能的原因是什麼？⟧",
 o:["VM1 已停止","VM1 沒有安裝最新版本的 Azure VM 代理程式 (WaAppAgent.exe)","VM1 有一顆非受控磁碟","Recovery Services 保存庫無法使用"],
 a:[1],
 e:"「警告」狀態代表 VM 目前的設定有一些可能導致備份間歇性失敗的問題，並附上建議的處理步驟；沒有安裝最新版的 Azure VM 代理程式就是這類問題的典型例子。VM 停止、有非受控磁碟、保存庫無法使用，這幾種情況通常會直接顯示「錯誤」等級的狀態或讓備份根本無法設定，而不是「警告」。",
 en:{q:"You discover that the Backup Pre-Check status displays Warning. What is a possible cause?",
  o:["VM1 is stopped.","VM1 does not have the latest version of the Azure VM Agent (WaAppAgent.exe) installed.","VM1 has an unmanaged disk.","A Recovery Services vault is unavailable."],
  e:"Warning flags configuration issues that could cause intermittent backup failures, such as an outdated VM Agent."}},

{n:103, code:"AZ104-Q103", d:2, od:3, t:"立即把 VM 移到別的主機", tEn:"Moving a VM to a different host immediately", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q83、Q84、Q85 情境完全相同，只是提出的解法不同。\n（情境同 Q83：VM1 即將受維護影響，需要立刻換到不同主機。）\n⟦解法：在「概觀 (Overview)」刀鋒選單，把這台虛擬機器搬到不同的資源群組。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。搬到不同的資源群組同樣只是資源管理層面的操作，不會讓 VM 換到不同的實體主機。正確做法仍然是使用「重新部署」功能。",
 en:{q:"Solution: From the Overview blade, you move the virtual machine to a different resource group. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Moving resource groups doesn't change the underlying physical host; use Redeploy instead."}},

{n:104, code:"AZ104-Q104", d:2, od:3, t:"VM 事件記錄警示所需元件", tEn:"Components required for a VM event-log alert", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 AZ104-Q64~Q66、Q82 是同一組情境的重複解法題。\n（情境同 Q82：VM1 一小時內出現超過兩筆錯誤事件時要觸發警示。）\n⟦解法：建立一個 Log Analytics 工作區並設定「代理程式設定」，在 VM1 上安裝 Microsoft Monitoring Agent，在 Azure Monitor 建立警示，來源指定為這個 Log Analytics 工作區。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。Log Analytics 代理程式安裝在 VM1 上後，會把事件記錄等監控資料送進工作區；Azure Monitor 的警示規則定期對工作區跑記錄查詢，符合條件就觸發警示，完全符合需求。",
 en:{q:"Solution: You create a workspace with Agent configuration settings, install the Monitoring Agent on VM1, and alert with the workspace as source. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. This is the correct chain: agent on the VM feeds the workspace, the alert rule queries the workspace."}},

{n:105, code:"AZ104-Q105", d:3, od:4, t:"用 IP flow verify 檢查 NSG 阻擋", tEn:"Using IP flow verify to check NSG blocking", k:"mc",
 src:"quiz3:html",
 q:"（本題節錄自一個更大的案例情境：Contoso 的技術需求之一是確保 VM3 可以透過 TCP 8080 埠對 Montreal 辦公室的應用程式伺服器建立對外連線。）\n你發現 VM3 沒有達到這項技術需求。你需要確認問題是否跟網路安全性群組 (NSG) 有關。⟦你應該使用什麼工具？⟧",
 o:["VNet1 的圖表 (Diagram)","Azure Monitor 的診斷設定","Traffic Manager 設定檔的「診斷並解決問題」","Azure Advisor 的安全性建議","Azure Network Watcher 的 IP flow verify"],
 a:[4],
 e:"IP flow verify 可以指定來源/目的地 IP、通訊埠、通訊協定與流量方向，直接檢查某個封包是否會被允許或拒絕，如果是被 NSG 規則擋下的，還會回報是哪一條規則造成的，正好符合「確認問題是否跟 NSG 有關」的需求。VNet 圖表只是拓樸視覺化；Azure Monitor 診斷設定是收集記錄用的；Traffic Manager 的診斷工具跟 NSG 無關；Advisor 的安全性建議是概略性的最佳實務提示，不會針對特定連線做逐條規則的判斷。",
 en:{q:"You need to verify whether the issue relates to the NSGs. What should you use?",
  o:["Diagram in VNet1","Diagnostic settings in Azure Monitor","Diagnose and solve problems in Traffic Manager profiles","The security recommendations in Azure Advisor","IP flow verify in Azure Network Watcher"],
  e:"IP flow verify tests whether a specific packet is allowed or denied and identifies the exact NSG rule responsible."}},

{n:106, code:"AZ104-Q106", d:3, od:4, t:"自動封鎖新建 NSG 的通訊埠", tEn:"Auto-blocking a port on newly created NSGs", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q107、Q108 情境完全相同，只是提出的解法不同。\n你的 Azure 訂用帳戶裡有 10 個虛擬網路，分別放在不同的資源群組。\n另一位系統管理員打算在這個訂用帳戶建立好幾個網路安全性群組 (NSG)。\n你需要確保「每次有新的 NSG 被建立時，都自動封鎖虛擬網路之間的 TCP 8080 埠」。\n⟦解法：在「資源提供者」刀鋒選單，取消註冊 Microsoft.ClassicNetwork 提供者。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。取消註冊資源提供者，跟「新建 NSG 時自動套用規則」完全無關。要達成「每次建立就自動套用某個規則」這種需求，應該用 Azure Policy 的原則定義，設定成套用效果（例如 Deny 或 Modify），在資源建立時自動生效。",
 en:{q:"Solution: From the Resource providers blade, you unregister the Microsoft.ClassicNetwork provider. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. You need an Azure Policy definition that auto-applies a rule to NSGs as they're created."}},

{n:107, code:"AZ104-Q107", d:3, od:4, t:"自動封鎖新建 NSG 的通訊埠", tEn:"Auto-blocking a port on newly created NSGs", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q106、Q108 情境完全相同，只是提出的解法不同。\n（情境同 Q106：要讓每個新建的 NSG 自動封鎖虛擬網路之間的 TCP 8080 埠。）\n⟦解法：把一個內建的原則定義，指派給這個訂用帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。內建原則定義涵蓋的是常見情境，但不一定剛好有「新建 NSG 時自動封鎖特定通訊埠（TCP 8080）」這麼精準客製化的內建規則。要達成這個具體需求，必須自己撰寫一個「自訂」原則定義，再指派給訂用帳戶。",
 en:{q:"Solution: You assign a built-in policy definition to the subscription. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Built-in policies don't cover this specific requirement; a custom policy definition is needed."}},

{n:108, code:"AZ104-Q108", d:3, od:4, t:"自動封鎖新建 NSG 的通訊埠", tEn:"Auto-blocking a port on newly created NSGs", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 Q106、Q107 情境完全相同，只是提出的解法不同。\n（情境同 Q106：要讓每個新建的 NSG 自動封鎖虛擬網路之間的 TCP 8080 埠。）\n⟦解法：設定一個自訂原則定義，並把它指派給這個訂用帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。自己寫一個自訂原則定義，指定套用條件（偵測到新建的 NSG）與效果（自動加入封鎖 TCP 8080 的規則），再指派到訂用帳戶範圍，就能讓這個規則在每次建立 NSG 時自動套用，符合需求。",
 en:{q:"Solution: You configure a custom policy definition, and then you assign the policy to the subscription. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. A custom policy definition tailored to this exact requirement, assigned at the subscription, auto-applies to every new NSG."}},

{n:109, code:"AZ104-Q109", d:3, od:4, t:"量測 VM 間的往返時間", tEn:"Measuring round-trip time between VMs", k:"mc",
 src:"quiz3:html",
 q:"你有兩個虛擬網路 VNet1、VNet2。VNet1 裡有一台虛擬機器 VM1，VNet2 裡有一台虛擬機器 VM2。\nVM1 跑一個前端應用程式，會連到 VM2 取得資料。\n使用者回報前端應用程式變慢了。\n你需要查看從 VM1 到 VM2 封包的平均往返時間 (RTT)。⟦你應該使用哪個 Azure Network Watcher 功能？⟧",
 o:["IP flow verify","連線疑難排解 (Connection troubleshoot)","連線監視器 (Connection monitor)","NSG 流程記錄檔"],
 a:[2],
 e:"連線監視器（Connection monitor）會以固定間隔持續監控兩端之間的連線，回報可達性、延遲（含 RTT）與網路拓樸的變化趨勢，適合用來觀察「一段時間內」的效能表現。IP flow verify 只檢查某個封包會不會被允許/拒絕，不量測延遲；連線疑難排解只做「當下一次」的連線測試，不是持續監控；NSG 流程記錄檔記錄的是允許/拒絕的流量記錄，不提供 RTT 這類效能數據。",
 en:{q:"You need to view the average round-trip time (RTT) of the packets from VM1 to VM2. Which Azure Network Watcher feature should you use?",
  o:["IP flow verify","Connection troubleshoot","Connection monitor","NSG flow logs"],
  e:"Connection monitor continuously monitors reachability, latency (RTT), and topology changes over time."}},

{n:110, code:"AZ104-Q110", d:3, od:4, t:"設定點對站連線", tEn:"Enabling a point-to-site connection", k:"mc",
 src:"quiz3:html",
 q:"你有一個 Azure 訂用帳戶，內含一個政策型 (policy-based) 虛擬網路閘道 GW1，以及一個虛擬網路 VNet1。\n你需要確保可以從內部部署電腦建立點對站 (P2S) 連線到 VNet1。⟦你應該執行哪兩個動作？⟧（每個正確答案各自是解法的一部分。）",
 o:["替 VNet1 新增一個服務端點","重設 GW1","建立一個路由型 (route-based) 虛擬網路閘道","替 GW1 新增一個連線","刪除 GW1","替 VNet1 新增一個公用 IP 位址空間"],
 a:[2,4],
 e:"點對站 (P2S) VPN 只支援「路由型 (route-based)」閘道，不支援政策型 (policy-based) 閘道。GW1 目前是政策型，沒辦法直接升級成路由型，所以要先刪除 GW1，再建立一個新的路由型虛擬網路閘道，才能繼續設定 P2S 連線。服務端點是給虛擬網路存取特定 PaaS 服務用的，跟 P2S 無關；P2S 連線本身也不需要額外的公用 IP 位址空間掛在 VNet1 上。",
 en:{q:"You need to ensure that you can configure a point-to-site connection from an on-premises computer to VNet1. Which two actions should you perform?",
  o:["Add a service endpoint to VNet1","Reset GW1","Create a route-based virtual network gateway","Add a connection to GW1","Delete GW1","Add a public IP address space to VNet1"],
  e:"P2S requires a route-based gateway; since GW1 is policy-based and can't be converted, delete it and create a new route-based gateway."}},

{n:111, code:"AZ104-Q111", d:3, od:4, t:"負載平衡器工作階段黏性", tEn:"Load balancer session persistence", k:"mc",
 src:"quiz3:html",
 q:"你有五台跑 Windows Server 2016、設定成 Web 伺服器的 Azure 虛擬機器。\n你有一個負載平衡器 LB1，替這些虛擬機器提供負載平衡服務。你需要確保同一位訪客的每次請求，都由同一台 Web 伺服器服務。⟦你應該設定什麼？⟧",
 o:["Floating IP (direct server return) 設為啟用","Floating IP (direct server return) 設為停用","一個健康探測 (health probe)","工作階段持續性 (Session persistence) 設為「用戶端 IP 與通訊協定」"],
 a:[3],
 e:"要讓同一位訪客的請求都固定分到同一台後端伺服器（俗稱 sticky session／黏性工作階段），要把負載平衡規則的「工作階段持續性」設定從預設的「無」改成「用戶端 IP」或「用戶端 IP 與通訊協定」，負載平衡器就會依訪客的來源 IP（與協定）把請求固定導向同一台後端。Floating IP 是給某些應用程式需要看到真實目的地 IP 的情境用的、跟工作階段黏性無關；健康探測只負責偵測後端是否存活，不影響流量分配的一致性。",
 en:{q:"You need to ensure that visitors are serviced by the same web server for each request. What should you configure?",
  o:["Floating IP (direct server return) to Enabled","Floating IP (direct server return) to Disabled","a health probe","Session persistence to Client IP and Protocol"],
  e:"Session persistence (sticky sessions) keyed on client IP ensures repeat requests land on the same backend server."}},

{n:112, code:"AZ104-Q112", d:3, od:4, t:"Web App 連線到內部部署 SMB 共用", tEn:"Web app connecting to an on-premises SMB share", k:"mc",
 src:"quiz3:html",
 q:"你的內部部署網路有一個 SMB 共用 Share1。\n你的 Azure 訂用帳戶裡有一個 Web 應用程式 webapp1，以及一個虛擬網路 VNET1。\n你需要確保 webapp1 可以連線到 Share1。⟦你應該部署什麼？⟧",
 o:["一個 Azure 應用程式閘道","一個 Azure Active Directory (Azure AD) 應用程式 Proxy","一個 Azure 虛擬網路閘道"],
 a:[2],
 e:"要讓 Azure 這一端能連到內部部署網路，標準做法是部署站對站 (Site-to-Site) VPN，也就是建立一個 Azure 虛擬網路閘道，透過 IPsec/IKE 通道把 Azure 虛擬網路與內部部署網路連通（webapp1 再透過區域 VNet 整合連進 VNET1）。應用程式閘道是第 7 層流量負載平衡/路由服務，不是用來打通站台間連線的；Azure AD 應用程式 Proxy 是讓「外部使用者」存取內部部署「Web 應用程式」用的反向代理，方向跟這裡的需求相反，也不是給一般 SMB 共用用的。",
 en:{q:"You need to ensure that webapp1 can connect to Share1. What should you deploy?",
  o:["an Azure Application Gateway","an Azure Active Directory (Azure AD) Application Proxy","an Azure Virtual Network Gateway"],
  e:"A Site-to-Site VPN (Virtual Network Gateway) connects the Azure VNet to the on-premises network so webapp1 (VNet-integrated) can reach Share1."}},

{n:113, code:"AZ104-Q113", d:3, od:4, t:"擴展集部署時安裝 NGINX", tEn:"Installing NGINX at scale-set provisioning time", k:"mc",
 src:"quiz3:html",
 q:"注意：本題與 AZ104-Q94 是同一組情境的重複題，只是選項組合不同。\n你打算用 ARM 範本部署好幾台跑 Windows Server 2019 的虛擬機器，組成一個虛擬機器擴展集。\n你需要確保這些虛擬機器部署完成後，都已經裝好 NGINX。⟦你應該使用什麼？⟧",
 o:["Publish-AzVMDscConfiguration 指令程式","Azure Application Insights","Azure 自訂指令碼擴充功能 (Custom Script Extension)","New-AzConfigurationAssignement 指令程式"],
 a:[2],
 e:"自訂指令碼擴充功能 (Custom Script Extension) 可以在範本裡指定一段安裝腳本（例如 apt-get install nginx 或?對應的 Windows 安裝方式），VM 佈建完成、開機後會自動執行，達成「部署完成後就裝好 NGINX」的需求（跟 Q94 的 DSC 擴充功能是同一類「後置部署自動化」機制，這裡選項換成了 Custom Script Extension，同樣是官方支援的正解）。Publish-AzVMDscConfiguration 只是「發布」DSC 設定用的指令程式，不是直接安裝軟體的機制；Application Insights 是應用程式效能監控服務；New-AzConfigurationAssignement 是 Azure Automation State Configuration 指派設定用的指令程式，都不符合這裡的情境。",
 en:{q:"You need to ensure that NGINX is available on all the virtual machines after they are deployed. What should you use?",
  o:["the Publish-AzVMDscConfiguration cmdlet","Azure Application Insights","Azure Custom Script Extension","the New-AzConfigurationAssignement cmdlet"],
  e:"The Custom Script Extension runs an install script automatically as each VM is provisioned — the same class of post-deployment automation as the DSC extension in Q94, just a different valid tool."}},

{n:114, code:"AZ104-Q114", d:3, od:4, t:"連接多個地端資料中心到 Azure", tEn:"Connecting multiple on-premises datacenters to Azure", k:"mc",
 src:"quiz3:html",
 q:"你的公司有三個辦公室，分別位於 Miami、Los Angeles、New York，每個辦公室都有自己的資料中心。\n你的 Azure 訂用帳戶在 East US 與 West US 兩個地區都有資源，兩地各有一個虛擬網路，且已互相對等互連。\n你需要把這三個資料中心都連進這個訂用帳戶，⟦解決方案必須把資料中心之間的網路延遲降到最低⟧。你應該建立什麼？",
 o:["三個 Azure 應用程式閘道與一個內部部署資料閘道","三個虛擬中樞 (virtual hub) 與一個虛擬 WAN","三個虛擬 WAN 與一個虛擬中樞","三個內部部署資料閘道與一個 Azure 應用程式閘道"],
 a:[1],
 e:"Azure 虛擬 WAN 的架構是「一個虛擬 WAN」搭配「多個地區的虛擬中樞 (virtual hub)」，每個分支據點（這裡是三個辦公室）就近連到離自己最近的虛擬中樞，虛擬中樞之間再透過微軟骨幹網路互連，能有效降低分支之間與分支到 Azure 之間的延遲，這正是虛擬 WAN 設計來解決的情境。應用程式閘道、內部部署資料閘道都不是用來打通多個實體據點與 Azure 之間網路連線的服務。",
 en:{q:"You need to connect the datacenters to the subscription, minimizing network latency. What should you create?",
  o:["three Azure Application Gateways and one On-premises data gateway","three virtual hubs and one virtual WAN","three virtual WANs and one virtual hub","three On-premises data gateways and one Azure Application Gateway"],
  e:"Virtual WAN uses one WAN with multiple regional virtual hubs, letting each branch connect to its nearest hub over Microsoft's backbone."}},

{n:115, code:"AZ104-Q115", d:3, od:4, t:"虛擬網路對等互連的位址限制", tEn:"Address-space restriction on VNet peering", k:"mc",
 src:"quiz3:html",
 q:"你有下表所示的 Azure 虛擬網路（來源網頁未保留完整表格截圖；依解析可知 VNet2 的位址空間與 VNet1 重疊，VNet3、VNet4 則不重疊）。⟦從 VNet1 可以跟哪些虛擬網路建立對等互連連線？⟧",
 o:["僅 VNet2 和 VNet3","僅 VNet2","僅 VNet3 和 VNet4","VNet2、VNet3 和 VNet4"],
 a:[2],
 e:"兩個虛擬網路要建立對等互連，位址空間絕對不能重疊。VNet2 的位址空間跟 VNet1 重疊，所以 VNet1 沒辦法跟 VNet2 建立對等互連；VNet3、VNet4 不重疊，可以互連。",
 en:{q:"To which virtual networks can you establish a peering connection from VNet1?",
  o:["VNet2 and VNet3 only","VNet2 only","VNet3 and VNet4 only","VNet2, VNet3, and VNet4"],
  e:"VNet2's address space overlaps with VNet1's, so peering with VNet2 is impossible; VNet3 and VNet4 don't overlap."}},

{n:116, code:"AZ104-Q116", d:3, od:4, t:"NVA 高可用性負載平衡", tEn:"HA load balancing for NVAs", k:"mc",
 src:"quiz3:html",
 q:"你有一個虛擬網路 VNet1，裡面有四個子網路：Gateway、Perimeter、NVA、Production。\nNVA 子網路裡有兩台網路虛擬設備 (NVA)，負責在 Perimeter 子網路與 Production 子網路之間做網路流量檢測。\n你需要替這兩台 NVA 設定 Azure 負載平衡器，⟦解決方案必須符合：NVA 要用主動-主動 (active-active) 架構、支援自動容錯移轉；NVA 要能把流量負載平衡到 Production 子網路上兩個不同 IP 位址的服務⟧。你應該執行哪三個動作？（每個正確答案各自是解法的一部分。）",
 o:["部署一個基本 (basic) 負載平衡器","部署一個標準 (standard) 負載平衡器","新增兩條同時啟用 HA Ports 與 Floating IP 的負載平衡規則","新增兩條啟用 HA Ports、但停用 Floating IP 的負載平衡規則","新增一個前端 IP 設定、一個後端集區與一個健康探測","新增一個前端 IP 設定、兩個後端集區與一個健康探測"],
 a:[1,2,5],
 e:"HA Ports（讓所有埠的流量都能被負載平衡、達成主動-主動＋自動容錯移轉）只有「標準」等級負載平衡器才支援，基本等級沒有。因為 Production 子網路上有兩個不同 IP 位址的服務，需要「兩個」後端集區分別對應；負載平衡規則要同時啟用 HA Ports（處理所有流量）與 Floating IP（因為後端埠會被重複使用，需要 Floating IP 才不會衝突）。",
 en:{q:"Which three actions should you perform?",
  o:["Deploy a basic load balancer","Deploy a standard load balancer","Add two load balancing rules that have HA Ports and Floating IP enabled","Add two load balancing rules that have HA Ports enabled and Floating IP disabled","Add a frontend IP configuration, a backend pool, and a health probe","Add a frontend IP configuration, two backend pools, and a health probe"],
  e:"HA Ports require a Standard load balancer; two backend pools are needed for the two differently-addressed services; rules need both HA Ports and Floating IP enabled since backend ports are reused."}},

{n:117, code:"AZ104-Q117", d:3, od:4, t:"對等互連後點對站連不到另一端", tEn:"P2S client can't reach the peered VNet", k:"mc",
 src:"quiz3:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，內含兩個虛擬網路 VNet1、VNet2。VNet1 有一個使用靜態路由的虛擬網路閘道 VPNGW1，你的內部部署網路與 VNet1 之間有一條站對站 VPN 連線。\n你在一台執行 Windows 10 的電腦 Client1 上，設定了一條到 VNet1 的點對站 (P2S) VPN 連線。\n你把 VNet1 與 VNet2 設定了虛擬網路對等互連。你確認可以從內部部署網路連到 VNet2，但 Client1 卻連不到 VNet2。你需要讓 Client1 能連到 VNet2。⟦你應該怎麼做？⟧",
 o:["在 Client1 上重新下載並安裝 VPN 用戶端設定套件","在 VNet1 選取「允許閘道傳遞 (Allow gateway transit)」","在 VNet2 選取「允許閘道傳遞 (Allow gateway transit)」","在 VPNGW1 啟用 BGP"],
 a:[0],
 e:"對等互連設定好之後，P2S 用戶端要能連到對方虛擬網路，VPN 用戶端設定套件裡的路由資訊也要跟著更新才能認得新的目的地網段；重新下載並安裝最新的用戶端設定套件，就會把 VNet2 的路由資訊帶進 Client1，讓它能透過 VNet1 的閘道連到 VNet2。「允許閘道傳遞」是給「另一個沒有自己閘道的虛擬網路」借用對方閘道用的設定，這裡 VNet2 本身不需要自己的閘道（是要透過 VNet1 的閘道連進來），啟用 BGP 也不是這裡連線失敗的原因。",
 en:{q:"Client1 is unable to connect to VNet2. You need to ensure that you can connect Client1 to VNet2. What should you do?",
  o:["Download and re-install the VPN client configuration package on Client1.","Select Allow gateway transit on VNet1.","Select Allow gateway transit on VNet2.","Enable BGP on VPNGW1"],
  e:"Re-downloading the client config package refreshes its routes to include the newly peered VNet2."}},

{n:118, code:"AZ104-Q118", d:3, od:4, t:"NSG 只能套用在同區域同訂用帳戶的子網路", tEn:"NSGs only apply within the same region/subscription", k:"mc",
 src:"quiz3:html",
 q:"你有一個 Azure 訂用帳戶，內含下表所示的資源（來源網頁未保留完整表格截圖；依解析可知只有 VNet3 跟 NSG1 位於同一個地區與同一個訂用帳戶）。⟦NSG1 可以套用在哪些虛擬網路的子網路上？⟧",
 o:["僅 VNet1 的子網路","僅 VNet2 和 VNet3 的子網路","僅 VNet2 的子網路","僅 VNet3 的子網路","VNet1、VNet2 和 VNet3 的子網路"],
 a:[3],
 e:"每個 Azure 資源都是建立在特定的地區與訂用帳戶底下，資源（這裡是 NSG）只能套用在跟它自己同一個地區、同一個訂用帳戶的虛擬網路子網路上。四個選項裡只有 VNet3 同時符合這兩個條件。",
 en:{q:"To which subnets can you apply NSG1?",
  o:["the subnets on VNet1 only","the subnets on VNet2 and VNet3 only","the subnets on VNet2 only","the subnets on VNet3 only","the subnets on VNet1, VNet2, and VNet3"],
  e:"A resource can only apply to resources in the same region and subscription; only VNet3 matches both."}},

{n:119, code:"AZ104-Q119", d:3, od:4, t:"Web App 存取虛擬網路內的資料庫", tEn:"Web app accessing a database inside a VNet", k:"mc",
 src:"quiz3:html",
 q:"你有一個 Azure Web 應用程式 webapp1。\n你有一個虛擬網路 VNET1，以及一台跑 MySQL 資料庫的虛擬機器 VM1，VM1 連接到 VNET1。\n你需要確保 webapp1 可以存取 VM1 上的資料。⟦你應該怎麼做？⟧",
 o:["部署一個內部負載平衡器","把 VNET1 對等互連到另一個虛擬網路","把 webapp1 連到 VNET1","部署一個 Azure 應用程式閘道"],
 a:[2],
 e:"要讓 Web 應用程式（PaaS 服務）能存取虛擬網路裡的資源，標準做法是「區域虛擬網路整合 (VNet Integration)」，也就是把 webapp1 連到 VNET1，這樣 webapp1 就能透過虛擬網路直接連到 VM1 上的 MySQL 資料庫。內部負載平衡器、對等互連、應用程式閘道都不是讓 PaaS Web App 加入虛擬網路的機制。",
 en:{q:"You need to ensure that webapp1 can access the data hosted on VM1. What should you do?",
  o:["Deploy an internal load balancer","Peer VNET1 to another virtual network","Connect webapp1 to VNET1","Deploy an Azure Application Gateway"],
  e:"VNet Integration (connecting webapp1 to VNET1) lets the web app reach resources inside the virtual network directly."}},

{n:120, code:"AZ104-Q120", d:3, od:4, t:"點對站用戶端憑證", tEn:"Point-to-site client certificate", k:"mc",
 src:"quiz3:html",
 q:"你有一台電腦 Computer1，已經設定了到 Azure 虛擬網路 VNet1 的點對站 (P2S) VPN 連線，這個連線使用自我簽署憑證。\n你從 Azure 下載並安裝了 VPN 用戶端設定套件到另一台電腦 Computer2。\n你需要確保可以從 Computer2 建立到 VNet1 的點對站 VPN 連線。\n⟦解法：修改 Azure Active Directory (Azure AD) 驗證原則。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。這個 P2S 連線用的是憑證式驗證，不是 Azure AD 驗證，修改 Azure AD 驗證原則不會有任何作用。每一台要連線的用戶端電腦都必須安裝對應根憑證衍生出來的「用戶端憑證」，正確做法是從 Computer1 匯出用戶端憑證，再匯入安裝到 Computer2；沒有安裝用戶端憑證，驗證就會失敗。",
 en:{q:"Solution: You modify the Azure Active Directory (Azure AD) authentication policies. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. This P2S connection uses certificate-based authentication, not Azure AD; export the client certificate from Computer1 and install it on Computer2 instead."}},


{n:41, code:"AZ104-Q41", d:2, od:2, t:"Import/Export 匯出支援的資料", tEn:"Data exportable via Import/Export", k:"mc",
 src:"quiz2:html",
 q:"你的 Azure 訂用帳戶裡，資料分別存放在下表所示的位置：\n| 名稱 | 類型 |\n|---|---|\n| container1 | Blob 容器 |\n| share1 | Azure 檔案共用 |\n| DB1 | SQL 資料庫 |\n| Table1 | Azure 資料表 |\n你打算用一個名為 Export1 的 Azure Import/Export 匯出工作，把資料匯出。你需要判斷哪一項資料可以用 Export1 匯出。⟦你應該辨識出哪一項？⟧",
 o:["DB1","container1","share1","Table1"], a:[1],
 e:"Azure Import/Export 服務的「匯出（Export）」功能只支援 Blob 儲存體，不支援檔案共用、SQL 資料庫或資料表儲存體，所以只有 container1（Blob 容器）可以用 Export1 匯出。（匯入功能則同時支援 Blob 與檔案兩種服務，但這裡問的是匯出。）",
 en:{q:"You have Azure subscription that includes data in following locations:\n| Name | Type |\n|---|---|\n| container1 | Blob container |\n| share1 | Azure files share |\n| DB1 | SQL database |\n| Table1 | Azure Table |\nYou plan to export data by using Azure import/export job named Export1. You need to identify the data that can be exported by using Export1. Which data should you identify?",
  o:["DB1","container1","share1","Table1"],
  e:"Export via Azure Import/Export only supports Blob storage, not file shares, SQL databases, or table storage."}},

{n:42, code:"AZ104-Q42", d:2, od:2, t:"部署 Azure File Sync", tEn:"Deploying Azure File Sync", k:"mc",
 src:"quiz2:html",
 q:"你的 Azure 訂用帳戶裡有下表所示的資源：\n| 名稱 | 類型 |\n|---|---|\n| RG1 | 資源群組 |\n| store1 | Azure 儲存體帳戶 |\n| Sync1 | Azure File Sync |\nstore1 裡有一個名為 data 的檔案共用，裡面有 5,000 個檔案。\n你需要把 data 檔案共用裡的檔案，同步到一台內部部署伺服器 Server1。⟦你應該執行哪三個動作？⟧（每個正確答案各自是解法的一部分。）",
 o:["建立一個容器執行個體","註冊 Server1","在 Server1 上安裝 Azure File Sync 代理程式","下載一個自動化指令碼","建立一個同步群組"],
 a:[1,2,4],
 e:"解法：先在 Server1 安裝 Azure File Sync 代理程式，讓伺服器能與 Storage Sync Service 通訊；接著把 Server1「註冊」到 Storage Sync Service，建立信任關係；最後建立一個同步群組，設定雲端端點（對應 store1 的 data 檔案共用），把 Server1 上的資料夾加為伺服器端點，開始同步。\n・建立容器執行個體、下載自動化指令碼都不是 File Sync 部署流程的一部分。",
 en:{q:"You have an Azure subscription that contains the resources in the following table. Store1 contains a file share named data. Data contains 5,000 files. You need to synchronize the files in the file share named data to an on-premises server named Server1. Which three actions should you perform?",
  o:["Create a container instance","Register Server1","Install the Azure File Sync agent on Server1","Download an automation script","Create a sync group"],
  e:"Install the Azure File Sync agent on Server1, register Server1 with the Storage Sync Service, then create a sync group with a cloud endpoint (the data file share) and a server endpoint on Server1."}},

{n:43, code:"AZ104-Q43", d:2, od:2, t:"Import/Export 準備磁碟前的檔案", tEn:"Files to prepare before Import/Export drives", k:"mc",
 src:"quiz2:html",
 q:"你打算用 Azure Import/Export 服務把檔案複製到儲存體帳戶。⟦在準備匯入工作用的磁碟之前，你應該先建立哪兩個檔案？⟧（每個正確答案各自是解法的一部分。）",
 o:["一個 XML 資訊清單檔","一個 dataset CSV 檔","一個 JSON 設定檔","一個 PowerShell PS1 檔","一個 driveset CSV 檔"],
 a:[1,4],
 e:"用 Azure Import/Export 服務準備磁碟前，要先在工具所在的根目錄修改兩個 CSV 檔：driveset.csv（登記要用哪些磁碟機、加密金鑰等磁碟層級設定）與 dataset.csv（登記要匯入或匯出的檔案／資料夾清單），準備好這兩個檔案後才能執行 WAImportExport 工具準備磁碟。",
 en:{q:"You plan to use the Azure Import/Export service to copy files to a storage account. Which two files should you create before you prepare the drives for the import job?",
  o:["an XML manifest file","a dataset CSV file","a JSON configuration file","a PowerShell PS1 file","a driveset CSV file"],
  e:"Modify driveset.csv (drive-level settings) and dataset.csv (files/folders to import) in the tool's root folder before preparing the drives."}},

{n:44, code:"AZ104-Q44", d:2, od:2, t:"刪除有備份資料的保存庫", tEn:"Deleting a vault that holds backup data", k:"mc",
 src:"quiz2:html",
 q:"你有一個用來測試備份的 Recovery Services 保存庫，裡面測試用的備份含兩台受保護的虛擬機器。\n你需要刪除這個 Recovery Services 保存庫。⟦你應該最先做什麼？⟧",
 o:["在 Recovery Services 保存庫刪除備份資料","修改每台虛擬機器的災難復原內容","修改每台虛擬機器的鎖定","在 Recovery Services 保存庫停止每個備份項目的備份"],
 a:[3],
 e:"只要保存庫還登記著資源的備份、存有備份資料，就無法直接刪除。要清空保存庫，必須先到「備份項目 (Backup Items)」清單，把每一個備份項目的備份「停止」（停止時可以一併選擇刪除備份資料），解除保存庫的相依關係之後才能真正刪除保存庫本身。修改 VM 的災難復原內容或鎖定，都不會清除保存庫裡的備份資料。",
 en:{q:"You have a Recovery Service vault used to test backups. The test backups contain two protected virtual machines. You need to delete the Recovery Services vault. What should you do first?",
  o:["From the Recovery Service vault, delete the backup data.","Modify the disaster recovery properties of each virtual machine.","Modify the locks of each virtual machine.","From the Recovery Service vault, stop the backup of each backup item."],
  e:"You can't delete a vault that still holds backup data; stop the backup of each backup item first to remove the dependency."}},

{n:45, code:"AZ104-Q45", d:2, od:2, t:"Import/Export 匯入目的地", tEn:"Import/Export destination", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1。\n你有 5 TB 的資料需要傳輸到 Subscription1，打算用 Azure Import/Export 工作。⟦你可以用什麼作為匯入資料的目的地？⟧",
 o:["虛擬機器","Azure Cosmos DB 資料庫","Azure 檔案儲存體","Azure File Sync 的 Storage Sync Service"],
 a:[2],
 e:"Azure Import/Export 服務可以把大量資料匯入 Azure Blob 儲存體或 Azure 檔案儲存體，Azure 檔案共用的容量上限剛好是 5 TB，符合題目資料量。虛擬機器、Cosmos DB、Storage Sync Service 都不是這個服務支援的匯入目的地。（本題與 Q46 是同一組情境的不同選項版本，兩題官方正解分別是 Azure 檔案儲存體與 Azure Blob 儲存體，都對。）",
 en:{q:"You have an Azure subscription named Subscription1. You have 5 TB of data that you need to transfer to Subscription1. You plan to use an Azure Import/Export job. What can you use as the destination of the imported data?",
  o:["a virtual machine","an Azure Cosmos DB database","Azure File Storage","the Azure File Sync Storage Sync Service"],
  e:"Import/Export can import data into Blob storage or Azure Files; a file share's max size (5 TB) matches the scenario."}},

{n:46, code:"AZ104-Q46", d:2, od:2, t:"Import/Export 匯入目的地", tEn:"Import/Export destination", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q45 情境完全相同，只是選項組合不同。\n（情境同 Q45：5 TB 資料要透過 Azure Import/Export 工作傳輸到 Subscription1。）⟦你可以用什麼作為匯入資料的目的地？⟧",
 o:["Azure Cosmos DB 資料庫","Azure Blob 儲存體","Azure Data Lake Store","Azure File Sync 的 Storage Sync Service"],
 a:[1],
 e:"Azure Import/Export 服務支援把資料匯入 Azure Blob 儲存體或 Azure 檔案儲存體；這裡的選項只有 Blob 儲存體符合，Cosmos DB、Data Lake Store、Storage Sync Service 都不是支援的目的地。",
 en:{q:"Solution scenario same as Q45, different options. What can you use as the destination of the imported data?",
  o:["an Azure Cosmos DB database","Azure Blob storage","Azure Data Lake Store","the Azure File Sync Storage Sync Service"],
  e:"Import/Export supports Blob storage or Azure Files as destinations; only Blob storage appears among these options."}},

{n:47, code:"AZ104-Q47", d:2, od:2, t:"換一個保存庫備份 VM", tEn:"Moving a VM's backup to another vault", k:"mc",
 src:"quiz2:html",
 q:"你有兩台 Azure 虛擬機器 VM1、VM2，以及兩個 Recovery Services 保存庫 RSV1、RSV2。\nVM2 目前備份在 RSV1。\n你需要改成把 VM2 備份到 RSV2。⟦你應該最先做什麼？⟧",
 o:["在 RSV1 刀鋒選單，點選「備份項目」並停止 VM2 的備份","在 RSV2 刀鋒選單，點選「備份」，選取虛擬機器的備份，再點「備份」","在 VM2 刀鋒選單，點選「災難復原」，點「複寫設定」，選擇 RSV2 作為 Recovery Services 保存庫","在 RSV1 刀鋒選單，點選「備份工作」並匯出 VM2 的工作"],
 a:[0],
 e:"一台虛擬機器同一時間只能被一個 Recovery Services 保存庫保護。VM2 目前備份在 RSV1，要改成備份到 RSV2，必須先到 RSV1 停止 VM2 的備份，解除 RSV1 與 VM2 的關聯，之後才能到 RSV2 重新設定 VM2 的備份。",
 en:{q:"VM2 is backed up to RSV1. You need to back up VM2 to RSV2. What should you do first?",
  o:["From the RSV1 blade, click Backup items and stop the VM2 backup","From the RSV2 blade, click Backup...","From the VM2 blade, click Disaster recovery...select RSV2","From the RSV1 blade, click Backup Jobs and export the VM2 job"],
  e:"A VM can only be protected by one vault at a time; stop the backup at RSV1 first."}},

{n:48, code:"AZ104-Q48", d:2, od:2, t:"升級帳戶以支援 ZRS", tEn:"Upgrading an account to enable ZRS", k:"mc",
 src:"quiz2:html",
 q:"你有一個一般用途 v1 的 Azure 儲存體帳戶 storage1，使用本地備援儲存體 (LRS)。\n你需要確保儲存體帳戶裡的資料，在可用性區域故障時仍受保護，⟦解決方案必須把成本與管理成本降到最低⟧。你應該最先做什麼？",
 o:["建立一個新的儲存體帳戶","設定物件複寫規則","把帳戶升級成一般用途 v2","修改 storage1 的複寫設定"],
 a:[2],
 e:"要在可用性區域故障時仍受保護，複寫方式要改成 ZRS（區域備援儲存體），但 ZRS 只支援一般用途 v2（以及 FileStorage、BlockBlobStorage）帳戶類型，storage1 目前是一般用途 v1，選單裡不會有 ZRS 選項。做法是先原地把帳戶升級成一般用途 v2（不用建立新帳戶、不用搬資料，符合『最省成本與管理成本』），升級後才能把複寫設定改成 ZRS。",
 en:{q:"You have a general-purpose v1 storage account using LRS. You need to protect the data if a zone fails, minimizing costs and effort. What should you do first?",
  o:["Create a new storage account.","Configure object replication rules.","Upgrade the account to general-purpose v2.","Modify the Replication setting of storage1."],
  e:"ZRS requires GPv2 (or FileStorage/BlockBlobStorage); upgrade the v1 account in place first, then switch replication to ZRS."}},

{n:49, code:"AZ104-Q49", d:2, od:2, t:"生命週期管理支援的帳戶", tEn:"Accounts eligible for lifecycle management", k:"mc",
 src:"quiz2:html",
 q:"你的 Azure 訂用帳戶裡有下表所示的儲存體帳戶（來源網頁未保留完整表格截圖；依解析可知 storage1~storage3 屬於一般用途 v2、進階區塊 Blob，或 Blob 儲存體帳戶，storage4 是生命週期管理不支援的帳戶類型，例如一般用途 v1 或 FileStorage）。\n你打算用生命週期管理原則管理帳戶裡的資料。⟦生命週期管理原則可以套用在哪些儲存體帳戶？⟧",
 o:["僅 storage1","僅 storage1 和 storage2","僅 storage3 和 storage4","僅 storage1、storage2 和 storage3","storage1、storage2、storage3 和 storage4"],
 a:[3],
 e:"生命週期管理原則只支援一般用途 v2、進階區塊 Blob (premium block blob) 帳戶，以及 Blob 儲存體帳戶裡的區塊與附加 Blob，不支援一般用途 v1 或 FileStorage 這類帳戶。四個帳戶裡有三個屬於受支援類型，只有 storage4 不支援。",
 en:{q:"You have the storage accounts shown. You plan to manage the data by using lifecycle management rules. To which storage accounts can you apply lifecycle management rules?",
  o:["storage1 only","storage1 and storage2 only","storage3 and storage4 only","storage1, storage2, and storage3 only","storage1, storage2, storage3, and storage4"],
  e:"Lifecycle management supports GPv2, premium block blob, and Blob Storage accounts; it does not affect unsupported account types like GPv1 or FileStorage."}},

{n:50, code:"AZ104-Q50", d:2, od:2, t:"BlockBlobStorage 需要進階效能", tEn:"BlockBlobStorage requires Premium performance", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶。你打算在 Azure 入口網站建立一個儲存體帳戶 storage1，設定如下：\n・效能：標準 (Standard)\n・複寫：區域備援儲存體 (ZRS)\n・預設存取層：冷 (Cool)\n・階層命名空間：停用\n你需要確保可以把 storage1 的帳戶類型 (Account kind) 設定成 BlockBlobStorage。⟦你應該先修改哪一項設定？⟧",
 o:["效能 (Performance)","複寫 (Replication)","預設存取層 (Access tier)","階層命名空間 (Hierarchical namespace)"],
 a:[0],
 e:"BlockBlobStorage 這個帳戶類型只能用在「進階 (Premium)」效能層級，標準層級不支援。要先把「效能」從標準改成進階，才能接著選擇 BlockBlobStorage 作為帳戶類型（進階帳戶也不會有「存取層」這個設定，因為進階帳戶沒有存取層概念）。",
 en:{q:"You need to ensure that you can set Account kind for storage1 to BlockBlobStorage. Which setting should you modify first?",
  o:["Performance","Replication","Access tier (default)","Hierarchical namespace"],
  e:"BlockBlobStorage requires Premium performance; Standard doesn't support it."}},

{n:51, code:"AZ104-Q51", d:2, od:2, t:"Azure 檔案共用的 SMB 埠", tEn:"SMB port for Azure file shares", k:"mc",
 src:"quiz2:html",
 q:"你建立了一個 Azure 儲存體帳戶 contosostorage，打算建立一個檔案共用 data。\n使用者要從執行 Windows 10 的家用電腦，把 data 檔案共用對應成磁碟機。⟦你應該開放家用電腦與 data 檔案共用之間的哪個對外埠？⟧",
 o:["80","443","445","3389"],
 a:[2],
 e:"透過網際網路連線到 Azure 檔案共用用的是 SMB（Server Message Block）通訊協定，需要開放對外的 TCP 445 埠。80／443 是給網頁伺服器 HTTP/HTTPS 用的，3389 是遠端桌面 (RDP) 用的，都跟掛接檔案共用無關。",
 en:{q:"Users need to map a drive to the data file share from home computers running Windows 10. Which outbound port should you open?",
  o:["80","443","445","3389"],
  e:"SMB (used to connect to Azure file shares over the internet) requires TCP port 445."}},

{n:52, code:"AZ104-Q52", d:2, od:2, t:"不可變儲存體", tEn:"Immutable storage", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 儲存體帳戶 storage1，內含一個 Blob 容器 container1。\n你需要防止 container1 裡新加入的內容，在一年內被修改。⟦你應該設定什麼？⟧",
 o:["存取層","存取原則","存取控制 (IAM)","存取層級"],
 a:[1],
 e:"要讓容器裡新加入的內容在指定期間內不能被修改或刪除（不可變儲存體），要在容器上設定「存取原則 (access policy)」裡的時間型保留原則，鎖定該期間內的資料。存取層是熱/冷/封存三種成本分層，跟資料能不能被修改無關；存取控制 (IAM) 管的是誰有權限；「存取層級」是容器的公開/私人設定，同樣不是鎖資料的機制。",
 en:{q:"You need to prevent new content added to container1 from being modified for one year. What should you configure?",
  o:["the access tier","an access policy","the Access control (IAM) settings","the access level"],
  e:"A time-based retention access policy on the container locks new content for the specified duration."}},

{n:53, code:"AZ104-Q53", d:2, od:3, t:"查看資源建立時間", tEn:"Viewing resource creation time", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q54、Q55 情境完全相同，只是提出的解法不同。\n你有一個 Azure 訂用帳戶 Subscription1，內含一個資源群組 RG1。RG1 裡的資源都是用範本部署的。\n你需要查看 RG1 裡這些資源的建立日期與時間。\n⟦解法：在「訂用帳戶」刀鋒選單選取該訂用帳戶，再點選「程式化部署 (Programmatic deployment)」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「程式化部署」是用來管理市集項目授權條款的地方，跟查看部署歷程無關。要查看資源的建立時間，應該到 RG1 刀鋒選單點選「部署 (Deployments)」，裡面會列出這個資源群組的部署歷程，包含每次部署的時間。",
 en:{q:"Solution: From the Subscriptions blade, you select the subscription, and then click Programmatic deployment. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Programmatic deployment manages Marketplace legal terms, not deployment history. Use RG1's Deployments blade instead."}},

{n:54, code:"AZ104-Q54", d:2, od:3, t:"查看資源建立時間", tEn:"Viewing resource creation time", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q53、Q55 情境完全相同，只是提出的解法不同。\n（情境同 Q53：要查看 RG1 裡資源的建立日期與時間。）\n⟦解法：在 RG1 刀鋒選單點選「自動化指令碼 (Automation script)」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。「自動化指令碼」是把目前資源的設定匯出成範本／指令碼下載，不是查看部署歷程與時間的地方。正確做法是到 RG1 的「部署 (Deployments)」刀鋒選單查看部署歷程。",
 en:{q:"Solution: From the RG1 blade, you click Automation script. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Automation script exports current settings as a template/script, not deployment history."}},

{n:55, code:"AZ104-Q55", d:2, od:3, t:"查看資源建立時間", tEn:"Viewing resource creation time", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q53、Q54 情境完全相同，只是提出的解法不同。\n（情境同 Q53：要查看 RG1 裡資源的建立日期與時間。）\n⟦解法：在 RG1 刀鋒選單點選「部署 (Deployments)」。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。RG1 的「部署 (Deployments)」刀鋒選單會列出這個資源群組完整的部署歷程，包含每次部署的日期與時間，正是題目要找的資訊。",
 en:{q:"Solution: From the RG1 blade, you click Deployments. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. The Deployments blade lists the full deployment history including timestamps."}},

{n:56, code:"AZ104-Q56", d:2, od:3, t:"監控 Linux VM", tEn:"Monitoring a Linux VM", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，裡面部署了一台 Linux 虛擬機器 VM1。\n你需要監控 VM1 的度量與記錄檔。⟦你應該使用什麼？⟧",
 o:["Azure HDInsight","Linux 診斷擴充功能 (LAD) 3.0","AzurePerformanceDiagnostics 擴充功能","Azure Analysis Services"],
 a:[1],
 e:"要監控 Linux 虛擬機器的度量與記錄檔，應該安裝 Linux 診斷擴充功能（LAD）3.0，它會把 VM 的系統度量與記錄檔資料送到 Azure。HDInsight 是巨量資料分析服務、AzurePerformanceDiagnostics 是 Windows 專用的效能診斷工具、Analysis Services 是資料分析引擎，都不是用來監控單一 VM 度量記錄的工具。",
 en:{q:"You need to monitor the metrics and the logs of VM1 (Linux). What should you use?",
  o:["Azure HDInsight","Linux Diagnostic Extension (LAD) 3.0","the AzurePerformanceDiagnostics extension","Azure Analysis Services"],
  e:"LAD 3.0 downloads the diagnostic agent onto the Linux server to collect metrics and logs."}},

{n:57, code:"AZ104-Q57", d:2, od:3, t:"防護資料中心層級故障", tEn:"Protecting against datacenter-level failure", k:"mc",
 src:"quiz2:html",
 q:"你打算部署三台 Azure 虛擬機器 VM1、VM2、VM3，用來架設一個 Web 應用程式 App1。\n你需要確保單一 Azure 資料中心無法使用時，至少還有兩台虛擬機器可用。⟦你應該怎麼部署？⟧",
 o:["三台虛擬機器全部放在同一個可用性區域","所有虛擬機器放在同一個可用性設定組","每台虛擬機器各自放在不同的可用性區域","每台虛擬機器各自放在不同的可用性設定組"],
 a:[2],
 e:"可用性區域（Availability Zone）是實體上分開、各自獨立供電與網路的資料中心，能防護「整個資料中心」層級的故障；可用性設定組（Availability Set）防護的是「同一個資料中心內」的機架/更新網域層級故障，資料中心本身故障時整組還是會一起中斷。要確保單一資料中心故障時仍有 VM 存活，必須把三台 VM 分散到不同的可用性區域。",
 en:{q:"You need to ensure that at least two virtual machines are available if a single Azure datacenter becomes unavailable. What should you deploy?",
  o:["all three virtual machines in a single Availability Zone","all virtual machines in a single Availability Set","each virtual machine in a separate Availability Zone","each virtual machine in a separate Availability Set"],
  e:"Availability Zones are physically separate datacenters; only spreading VMs across zones survives a whole-datacenter failure."}},

{n:58, code:"AZ104-Q58", d:2, od:3, t:"從範本庫部署 VM 可設定的項目", tEn:"What's configurable when deploying from a saved VM template", k:"mc",
 src:"quiz2:html",
 q:"你有一台執行 Windows Server 2019 的 Azure 虛擬機器 VM1。\n你把 VM1 存成一個範本 Template1，存進 Azure Resource Manager 範本庫。\n你打算用 Template1 部署一台虛擬機器 VM2。⟦在部署 VM2 的過程中，你可以設定什麼？⟧",
 o:["作業系統","系統管理員使用者名稱","虛擬機器大小","資源群組"],
 a:[3],
 e:"直接把既有 VM「存成範本」（沒有先泛化 / sysprep 成可重複使用的映像）會把作業系統、VM 大小、系統管理員使用者名稱這些值都寫死在範本裡，部署時不能再改。但「要部署到哪個資源群組」從來就不是範本本身的內容，而是每次部署時另外指定的部署參數，跟範本內容無關，所以任何一次部署都可以自由選擇資源群組。",
 en:{q:"You save VM1 as a template named Template1 to the ARM template library. You plan to deploy VM2 from Template1. What can you configure during the deployment of VM2?",
  o:["operating system","administrator username","virtual machine size","resource group"],
  e:"Saving a VM directly as a template (without generalizing/sysprep) bakes in OS, size, and admin username as fixed values. Resource group is always a deployment-time choice, independent of the template's content."}},

{n:59, code:"AZ104-Q59", d:2, od:3, t:"排程調整 VM 效能", tEn:"Scheduling a VM performance boost", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶，內含一台虛擬機器 VM1，跑著一套不支援多個作用中執行個體的財務報表應用程式 App1。\n每個月底 App1 執行時，VM1 的 CPU 使用率都會飆高。\n你需要建立一個排程的 Runbook，在每月月底提升 VM1 的處理器效能。⟦這個 Runbook 應該包含什麼工作？⟧",
 o:["把 Azure Performance Diagnostics 代理程式加到 VM1","修改 VM1 的 VM 大小屬性","把 VM1 加進一個擴展集","增加訂用帳戶的 vCPU 配額","把 Desired State Configuration (DSC) 擴充功能加到 VM1"],
 a:[1],
 e:"App1 不支援多個作用中執行個體，代表沒辦法用「擴展集」這種水平擴充（多開幾台）的方式分攤負載，只能用垂直擴充（換成規格更大的 VM）來提升單台的效能，也就是排程修改 VM1 的「VM 大小 (size)」屬性。Performance Diagnostics 代理程式只負責蒐集效能診斷資料，不會提升效能；增加訂用帳戶的 vCPU 配額只是拉高上限，VM1 本身的大小不會自動變；DSC 擴充功能是用來維持設定一致性，不是用來調整硬體規格的。",
 en:{q:"You need to create a scheduled runbook to increase the processor performance of VM1 at the end of each month. What task should you include in the runbook?",
  o:["Add the Azure Performance Diagnostics agent to VM1.","Modify the VM size property of VM1.","Add VM1 to a scale set.","Increase the vCPU quota for the subscription.","Add a Desired State Configuration (DSC) extension to VM1."],
  e:"Since App1 doesn't support multiple active instances, scale set (scale-out) isn't an option — the runbook must scale up by changing VM1's size property."}},

{n:60, code:"AZ104-Q60", d:2, od:3, t:"重新部署 VM 會遺失什麼", tEn:"What redeploying a VM loses", k:"mc",
 src:"quiz2:html",
 q:"你有一台執行 Windows Server 2019 的 Azure 虛擬機器 VM1，部署時磁碟機使用預設設定。\n你以使用者 User1 登入 VM1，執行了以下動作：\n・在 C 磁碟機建立檔案。\n・在 D 磁碟機建立檔案。\n・修改螢幕保護程式的逾時設定。\n・變更桌面背景。\n你打算重新部署 VM1。⟦重新部署後，哪些變更會遺失？⟧",
 o:["修改過的螢幕保護程式逾時設定","新的桌面背景","D 磁碟機上的新檔案","C 磁碟機上的新檔案"],
 a:[2],
 e:"Azure VM 預設的 D 磁碟機是「暫存磁碟 (temporary disk)」，資料只存在該台實體主機上，VM 重新部署（搬到另一台實體主機）、重新調整大小等操作都可能清空這顆磁碟，所以 D 磁碟機上新建的檔案會遺失。C 磁碟機是作業系統磁碟，內容（含系統設定如螢幕保護程式逾時、桌面背景、C 磁碟機上的檔案）都會持續保存、隨 VM 一起搬移，不會因為重新部署而消失。",
 en:{q:"You plan to redeploy VM1. Which changes will be lost after you redeploy VM1?",
  o:["the modified screen saver timeout","the new desktop background","the new files on drive D","the new files on drive C"],
  e:"Drive D is the ephemeral temporary disk local to the host machine and can be wiped on redeploy; drive C (the OS disk) and its settings persist."}},

{n:61, code:"AZ104-Q61", d:2, od:3, t:"上傳 VM 磁碟前要轉換格式", tEn:"Converting a disk before uploading a VM", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶，以及一台內部部署虛擬機器 VM1。VM1 的設定如圖例所示（磁碟格式為 VHDX）。\n你需要確保可以把 VM1 掛接的磁碟，當成 Azure 虛擬機器的範本使用。⟦你應該修改 VM1 的什麼？⟧",
 o:["記憶體","網路介面卡","硬碟","處理器","整合服務 (Integration Services)"],
 a:[2],
 e:"從圖例可以看到磁碟格式是 VHDX。要把內部部署的虛擬機器磁碟上傳到 Azure 當範本，Azure 只支援第 1 代（generation 1）、VHD 格式、固定大小的磁碟（上限 1,023 GB）。VHDX 是 Hyper-V 較新的磁碟格式，必須先轉換成 VHD、並把動態擴充磁碟轉成固定大小磁碟，才能上傳。記憶體、網路卡、處理器、整合服務都不是「磁碟格式」的問題，跟能不能當範本上傳無關。",
 en:{q:"You need to ensure that you can use the disks attached to VM1 as a template for Azure virtual machines. What should you modify on VM1?",
  o:["the memory","the network adapters","the hard drive","the processor","Integration Services"],
  e:"The exhibit shows a VHDX disk; Azure only supports generation 1, fixed-size VHD disks, so the VHDX must be converted to VHD (and fixed size) before upload."}},

{n:62, code:"AZ104-Q62", d:2, od:3, t:"查看部署範本", tEn:"Viewing the template used for a deployment", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，被公司好幾個部門使用，內含下表所示的資源（VM1、storage2、container1 皆位於資源群組 RG1）。\n另一位系統管理員用一份 Azure Resource Manager 範本，部署了一台虛擬機器 VM1 與一個 Azure 儲存體帳戶 storage2。\n你需要查看這次部署所用的範本。⟦應該從哪個刀鋒選單查看範本？⟧",
 o:["VM1","RG1","storage2","container1"],
 a:[1],
 e:"ARM 部署（包含這種一次部署多項資源的範本）的部署歷程紀錄在「資源群組」這個層級，不是掛在個別資源上。要查看用過的範本，要到 RG1 刀鋒選單點「部署 (Deployments)」，選取那一次部署，再點「檢視範本 (View template)」，即可看到當時使用的完整範本內容。單獨看 VM1 或 storage2 各自的刀鋒選單，不會有這次多資源部署的範本紀錄。",
 en:{q:"You need to view the template used for the deployment. From which blade can you view the template that was used for the deployment?",
  o:["VM1","RG1","storage2","container1"],
  e:"Deployment history (and the template used) is tracked at the resource group level, so it's viewed from RG1's Deployments blade."}},

{n:63, code:"AZ104-Q63", d:2, od:3, t:"回復到先前版本的 Web App", tEn:"Reverting a web app to a previous version", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure Web 應用程式 App1，跑在 Web 應用程式 webapp1 上，webapp1 有下表所示的部署位置：\n| 名稱 | 用途 |\n|---|---|\n| webapp1-prod | 正式環境 |\n| webapp1-test | 測試環境 |\n你在 webapp1-test 測試了 App1 的幾項變更，也備份了 App1。\n你把 webapp1-test 與 webapp1-prod 互換，結果發現 App1 出現效能問題。\n你需要盡快回復到 App1 先前的版本。⟦你應該怎麼做？⟧",
 o:["重新部署 App1","互換部署位置","複製 App1","還原 App1 的備份"],
 a:[1],
 e:"部署位置互換（slot swap）的原理是交換兩個位置的虛擬 IP（等於交換網址），既然剛剛才把 test 換成 prod，只要「再互換回來一次」就能立刻把正式環境換回原本沒問題的版本，幾乎是瞬間完成、沒有停機。重新部署、複製 App1 都比互換慢得多；還原備份也比直接互換回去更費工、更慢。",
 en:{q:"You need to revert to the previous version of App1 as quickly as possible. What should you do?",
  o:["Redeploy App1","Swap the slots","Clone App1","Restore the backup of App1"],
  e:"Swapping slots just exchanges virtual IPs again, instantly reverting to the previous slot's version — far faster than redeploying, cloning, or restoring a backup."}},

{n:64, code:"AZ104-Q64", d:2, od:3, t:"VM 事件記錄警示所需元件", tEn:"Components required for a VM event-log alert", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q65、Q66 情境完全相同，只是提出的解法不同。\n你有一台執行 Windows Server 2016 的虛擬機器 VM1。\n你需要在 VM1 的系統事件記錄檔一小時內出現超過兩筆錯誤事件時，觸發 Azure 警示。\n⟦解法：建立一個 Azure Log Analytics 工作區並設定資料設定，把「Microsoft Monitoring Agent VM 擴充功能」加到 VM1，在 Azure Monitor 建立警示，來源指定為這個 Log Analytics 工作區。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。這裡混淆了兩種安裝方式：應該在 VM1 上直接「安裝 Microsoft Monitoring Agent（代理程式本身）」，而不是加裝「Microsoft Monitoring Agent VM 擴充功能」這個名字很像但不是同一件事的元件。少了正確的代理程式，VM1 的事件記錄不會送進 Log Analytics 工作區，警示自然也就抓不到資料。",
 en:{q:"Solution: You create a Log Analytics workspace, add the Microsoft Monitoring Agent VM extension to VM1, and create an alert with the workspace as source. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. You must install the Microsoft Monitoring Agent itself on VM1, not the VM extension of the same name."}},

{n:65, code:"AZ104-Q65", d:2, od:3, t:"VM 事件記錄警示所需元件", tEn:"Components required for a VM event-log alert", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q64、Q66 情境完全相同，只是提出的解法不同。\n（情境同 Q64：要在 VM1 一小時內出現超過兩筆錯誤事件時觸發警示。）\n⟦解法：建立一個 Azure Log Analytics 工作區並設定資料設定，在 VM1 上安裝 Microsoft Monitoring Agent，在 Azure Monitor 建立警示，來源指定為這個 Log Analytics 工作區。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。Log Analytics 代理程式（Microsoft Monitoring Agent）安裝在 VM1 上後，會把作業系統與工作負載的監控資料（含事件記錄）送進指定的 Log Analytics 工作區；Azure Monitor 的警示規則可以定期對這個工作區跑記錄查詢，符合條件（一小時內超過兩筆錯誤事件）就觸發警示，完全符合需求。",
 en:{q:"Solution: You install the Microsoft Monitoring Agent on VM1 (not the extension). Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. The Log Analytics agent installed directly on VM1 forwards event log data to the workspace, which the alert rule queries."}},

{n:66, code:"AZ104-Q66", d:2, od:3, t:"VM 事件記錄警示所需元件", tEn:"Components required for a VM event-log alert", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q64、Q65 情境完全相同，只是提出的解法不同。\n（情境同 Q64：要在 VM1 一小時內出現超過兩筆錯誤事件時觸發警示。）\n⟦解法：建立一個 Azure 儲存體帳戶並設定共用存取簽章 (SAS)，在 VM1 上安裝 Microsoft Monitoring Agent，在 Azure Monitor 建立警示，來源指定為這個儲存體帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。就算裝對了代理程式，Azure Monitor 的記錄型警示規則要抓的資料來源必須是 Log Analytics 工作區，不能直接指定成儲存體帳戶（SAS）；正確作法是建立 Log Analytics 工作區，把代理程式收集到的資料送進工作區，警示規則的來源指向工作區，而不是儲存體帳戶。",
 en:{q:"Solution: You create a storage account with SAS, install the Microsoft Monitoring Agent on VM1, and specify the storage account as the alert source. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Log-based Azure Monitor alerts require a Log Analytics workspace as the source, not a storage account."}},

{n:67, code:"AZ104-Q67", d:3, od:4, t:"把 VM 連到另一個虛擬網路", tEn:"Connecting a VM to a different VNet", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q68、Q69 情境完全相同，只是提出的解法不同。\n你有一個 Azure 訂用帳戶，內含下表所示的資源（VM1 連接到 VNET1，VNET1 與 VNET2 位於不同資源群組，兩者沒有連通）。\n你需要把 VM1 連到 VNET2。\n⟦解法：把 VM1 搬到 RG2，再替 VM1 新增一張網路介面卡。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。VM 建立時連接的虛擬網路無法事後更改（只能換同一個虛擬網路裡的子網路，換不了虛擬網路本身）；就算把 VM1 搬到 RG2、新增網路介面卡，這張新網卡也沒辦法連到 VNET2，因為 VM1 本身仍然綁定 VNET1。正確做法是刪除 VM1、用同一顆磁碟重新建立 VM1，並在建立時把新的網路介面接到 VNET2。",
 en:{q:"VM1 connects to VNET1. You need to connect VM1 to VNET2. Solution: You move VM1 to RG2, and then you add a new network interface to VM1. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. A VM's VNet cannot be changed after creation (only its subnet can); you must delete and recreate the VM to attach it to a different VNet."}},

{n:68, code:"AZ104-Q68", d:3, od:4, t:"把 VM 連到另一個虛擬網路", tEn:"Connecting a VM to a different VNet", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q67、Q69 情境完全相同，只是提出的解法不同。\n（情境同 Q67：VM1 連接到 VNET1，需要改連到 VNET2。）\n⟦解法：刪除 VM1，重新建立 VM1，並替新的 VM1 建立一張新的網路介面卡，連到 VNET2。⟧這個解法是否達成目標？",
 o:["是","否"], a:[0],
 e:"答案：是。虛擬機器連接的虛擬網路只能在「建立時」決定，事後無法更換，唯一可靠的做法就是刪除 VM1（磁碟資料會保留）、用同一顆磁碟重新建立一台 VM1，並在建立過程中把新的網路介面接到 VNET2。",
 en:{q:"Solution: You delete VM1, recreate VM1, and create a new network interface connected to VNET2. Does this meet the goal?",
  o:["Yes","No"],
  e:"Yes. Since a VM's VNet can only be set at creation time, delete-and-recreate with a new NIC on VNET2 is the correct approach."}},

{n:69, code:"AZ104-Q69", d:3, od:4, t:"把 VM 連到另一個虛擬網路", tEn:"Connecting a VM to a different VNet", k:"mc",
 src:"quiz2:html",
 q:"注意：本題與 Q67、Q68 情境完全相同，只是提出的解法不同。\n（情境同 Q67：VM1 連接到 VNET1，需要改連到 VNET2。）\n⟦解法：關閉 VM1，再替 VM1 新增一張網路介面卡。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
 e:"答案：否。就算先關機，VM 綁定的虛擬網路還是無法更換，關機狀態下新增的網路介面卡一樣連不到 VNET2。正確做法仍然是刪除 VM1、重新建立，並在建立時把新的網路介面接到 VNET2。",
 en:{q:"Solution: You turn off VM1, and then you add a new network interface to VM1. Does this meet the goal?",
  o:["Yes","No"],
  e:"No. Powering off doesn't change the fact that the VM's VNet can't be swapped; delete-and-recreate is still required."}},

{n:70, code:"AZ104-Q70", d:3, od:4, t:"AKS 對外 DNS 記錄", tEn:"AKS public DNS record", k:"mc",
 src:"quiz2:html",
 q:"你部署了一個 Azure Kubernetes Service (AKS) 叢集 Cluster1，使用下表所示的 IP 位址（其中僅 131.107.2.1 是公用 IP，其餘 10.0.10.11、172.17.7.1、192.168.10.2 都屬於內部私人位址範圍）。\n你需要讓網際網路上的使用者可以存取 Cluster1 裡執行的應用程式。⟦DNS 記錄裡應該填入哪個 IP 位址？⟧",
 o:["131.107.2.1","10.0.10.11","172.17.7.1","192.168.10.2"],
 a:[0],
 e:"要讓網際網路上的使用者連進來，DNS 記錄一定要指向一個「公用」IP 位址——也就是叢集對外服務（例如 LoadBalancer 類型的 Kubernetes Service）配發到的公用 IP。10.0.10.11、172.17.7.1、192.168.10.2 都屬於 RFC 1918 私人位址範圍（分別像是子網路內部位址、容器橋接網段、內部管理位址），從網際網路連不到；只有 131.107.2.1 是公用位址，所以 DNS 記錄要填這一個。",
 en:{q:"You need to provide internet users with access to the applications that run in Cluster1. Which IP address should you include in the DNS record for Cluster1?",
  o:["131.107.2.1","10.0.10.11","172.17.7.1","192.168.10.2"],
  e:"Only 131.107.2.1 is a public IP; the others are private RFC 1918 ranges unreachable from the internet."}},

{n:71, code:"AZ104-Q71", d:2, od:3, t:"最省成本的 App Service 方案數", tEn:"Minimum App Service plans for cost", k:"mc",
 src:"quiz2:html",
 q:"你有一份部署範本 Template1，用來部署 10 個 Azure Web 應用程式。\n你需要判斷在部署 Template1 之前，應該先建立什麼，⟦解決方案必須把 Azure 成本降到最低⟧。你應該辨識出什麼？",
 o:["五個 Azure 應用程式閘道","一個 App Service 方案","10 個 App Service 方案","一個 Azure Traffic Manager","一個 Azure 應用程式閘道"],
 a:[1],
 e:"Azure Web 應用程式一定要建立在某個 App Service 方案裡，但一個 App Service 方案可以同時容納多個 Web 應用程式（只要它們規格需求相容），不需要每個應用程式各自一個方案。要用最低成本部署 10 個 Web 應用程式，最省的做法就是先建立「一個」App Service 方案，讓這 10 個應用程式共用同一份運算資源。應用程式閘道與 Traffic Manager 都是流量管理／路由服務，不是拿來「裝」Web 應用程式的地方，跟這裡的需求無關。",
 en:{q:"You need to identify what to deploy before you deploy Template1 to minimize Azure costs. What should you identify?",
  o:["five Azure Application Gateways","one App Service plan","10 App Service plans","one Azure Traffic Manager","one Azure Application Gateway"],
  e:"Multiple web apps can share a single App Service plan, which minimizes cost compared to one plan per app."}},

{n:72, code:"AZ104-Q72", d:2, od:3, t:"哪個變更會造成停機", tEn:"Which change causes downtime", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶，內含一台 24 小時營運的業務應用程式虛擬機器 VM1。VM1 有一張網路介面卡、一顆受控磁碟，目前大小是 D4s v3。\n你打算對 VM1 做以下變更：\n・把大小改成 D8s v3。\n・新增一顆 500 GB 的受控磁碟。\n・加裝 Puppet Agent 擴充功能。\n・啟用 Desired State Configuration Management。\n⟦哪一項變更會造成 VM1 停機？⟧",
 o:["啟用 Desired State Configuration Management","新增一顆 500 GB 的受控磁碟","把大小改成 D8s v3","加裝 Puppet Agent 擴充功能"],
 a:[2],
 e:"變更虛擬機器的大小 (size) 時，VM 必須先進入停止狀態才能套用新規格（換到不同硬體世代時尤其一定要停機），所以這項變更會造成停機。新增資料磁碟、加裝擴充功能（Puppet Agent）、啟用 DSC，這幾項都可以在 VM 執行中直接進行，不需要停機。",
 en:{q:"Which change will cause downtime for VM1?",
  o:["Enable Desired State Configuration Management","Add a 500-GB managed disk","Change the size to D8s v3","Add the Puppet Agent extension"],
  e:"Resizing a VM requires it to be in a stopped state while the resize is applied."}},

{n:73, code:"AZ104-Q73", d:2, od:3, t:"測試後才上線更新", tEn:"Testing an update before going live", k:"mc",
 src:"quiz2:html",
 q:"你有一個應用程式 App1，跑在 Azure Web 應用程式 webapp1 上。\n開發人員把 App1 的更新上傳到一個 Git 儲存庫 Git1。\nwebapp1 有下表所示的部署位置（webapp1-test 測試環境、webapp1-prod 正式環境）。\n你需要確保 App1 的更新在提供給使用者之前先經過測試。⟦你應該執行哪兩個動作？⟧（每個正確答案各自是解法的一部分。）",
 o:["互換部署位置","把 App1 更新部署到 webapp1-prod，然後測試更新","停止 webapp1-prod","把 App1 更新部署到 webapp1-test，然後測試更新","停止 webapp1-test"],
 a:[0,3],
 e:"正確流程：先把更新部署到「測試」環境 webapp1-test 並在那裡測試，確認沒問題後，再把 webapp1-test 與 webapp1-prod 互換（swap），讓測試過的版本正式上線、原本的正式版本退回測試位置（如果新版有問題也能立刻互換回去）。直接把更新部署到 webapp1-prod 測試，等於讓使用者直接暴露在還沒驗證過的版本前，不符合「先測試再上線」的需求；停止任一個位置也不是必要動作。",
 en:{q:"You need to ensure that the App1 update is tested before the update is made available to users. Which two actions should you perform?",
  o:["Swap the slots","Deploy the App1 update to webapp1-prod, and then test the update","Stop webapp1-prod","Deploy the App1 update to webapp1-test, and then test the update","Stop webapp1-test"],
  e:"Deploy and test the update in the test slot first, then swap slots to promote it to production."}},

{n:74, code:"AZ104-Q74", d:3, od:4, t:"記錄連線嘗試", tEn:"Logging connection attempts", k:"mc",
 src:"quiz2:html",
 q:"你有一個 Azure 訂用帳戶 Subscription1，已註冊下列資源提供者：Authorization、Automation、Resources、Compute、KeyVault、Network、Storage、Billing、Web。\nSubscription1 裡有一台虛擬機器 VM1，設定如下：私人 IP 10.0.0.4（動態）、網路安全性群組 NSG1、無公用 IP、可用性設定組 AVSet、子網路 10.0.0.0/24、非受控磁碟、位於 East US。\n你需要記錄所有連線到 VM1 的成功與失敗嘗試。⟦你應該執行哪三個動作？⟧（每個正確答案各自是解法的一部分。）",
 o:["在 East US 地區啟用 Azure Network Watcher","新增一個 Azure Network Watcher 連線監視器","註冊 MicrosoftLogAnalytics 提供者","建立一個 Azure 儲存體帳戶","註冊 Microsoft.Insights 資源提供者","啟用 Azure Network Watcher 流程記錄檔 (flow logs)"],
 a:[0,4,5],
 e:"要記錄透過網路安全性群組（NSG1）的所有連線嘗試，用的是 Network Watcher 的「NSG 流程記錄檔」功能。做法：先在 VM1 所在地區（East US）啟用 Network Watcher；NSG 流程記錄需要 Microsoft.Insights 這個資源提供者，所以要註冊它；接著才能啟用 NSG 的流程記錄檔功能，記錄資料會寫進儲存體帳戶（Subscription1 已經有 Storage 提供者，不需要另外建立新帳戶這個動作本身不是必要步驟）。連線監視器是另一種診斷工具（量測延遲/可達性），不是記錄所有連線嘗試用的；MicrosoftLogAnalytics 提供者不是流程記錄檔需要的提供者。",
 en:{q:"You need to record all the successful and failed connection attempts to VM1. Which three actions should you perform?",
  o:["Enable Azure Network Watcher in the East US Azure region.","Add an Azure Network Watcher connection monitor.","Register the MicrosoftLogAnalytics provider.","Create an Azure Storage account.","Register the Microsoft.Insights resource provider.","Enable Azure Network Watcher flow logs."],
  e:"NSG flow logging (Network Watcher) requires: Network Watcher enabled in the region, the Microsoft.Insights provider registered, and flow logs enabled."}},

{n:75, code:"AZ104-Q75", d:2, od:3, t:"最快建立 5 台執行個體的擴展集", tEn:"Fastest way to deploy a 5-instance scale set", k:"mc",
 src:"quiz2:html",
 q:"你需要盡快部署一個含 5 個執行個體的 Azure 虛擬機器擴展集。⟦你應該怎麼做？⟧",
 o:["部署五台獨立的虛擬機器，再各自修改可用性區域設定","部署五台獨立的虛擬機器，再各自修改大小設定","部署一個設定成「VM（虛擬機器）」自動調度模式的擴展集","部署一個設定成 ScaleSetVM 自動調度模式的擴展集"],
 a:[3],
 e:"ScaleSetVM（傳統的「一致 Uniform」自動調度模式）本來就是設計來一次部署一批「規格完全一致」的執行個體，一次部署就能直接生出 5 台完全相同的 VM，是最快的做法。較新的「VM（Flexible）」自動調度模式把每個執行個體當成獨立資源管理，彈性更高但單次部署的機制更複雜、不是最快捷徑；分別部署五台獨立 VM、再逐台調整設定，步驟更多、更慢。",
 en:{q:"You need to deploy an Azure virtual machine scale set that contains five instances as quickly as possible. What should you do?",
  o:["Deploy five virtual machines and modify Availability Zones for each.","Deploy five virtual machines and modify Size for each.","Deploy one scale set set to VM (virtual machines) orchestration mode.","Deploy one scale set set to ScaleSetVM orchestration mode."],
  e:"Uniform orchestration (ScaleSetVM) is built to provision a batch of identical instances in one deployment — the fastest path to five identical VMs."}},

{n:76, code:"AZ104-Q76", d:2, od:3, t:"跨作業系統的 App Service 方案數", tEn:"App Service plans across OS platforms", k:"mc",
 src:"quiz2:html",
 q:"你打算建立下表所示的 Azure Web 應用程式（其中一部分是跑在 Windows Server 上的 ASP.NET 4.7 應用程式，另一部分是跑在 Linux 上的 .NET Core／PHP／Ruby 應用程式）。⟦最少需要建立幾個 App Service 方案？⟧",
 o:["1","2","3","4"],
 a:[1],
 e:"一個 App Service 方案在建立時就固定綁死作業系統（Windows 或 Linux），不能讓 Windows 專屬的 ASP.NET 4.7 應用程式跟 Linux 上的 .NET Core／PHP／Ruby 應用程式共用同一個方案。所以最少要兩個方案：一個 Windows 方案給 ASP.NET 4.7 用，一個 Linux 方案給 .NET Core、PHP、Ruby 這些共用（同平台的應用程式本來就能共用同一個方案）。",
 en:{q:"What is the minimum number of App Service plans you should create for the web apps?",
  o:["1","2","3","4"],
  e:"An App Service plan is fixed to one OS; Windows-hosted ASP.NET and Linux-hosted apps need at least two separate plans."}},

{n:77, code:"AZ104-Q77", d:2, od:3, t:"範本密碼安全儲存", tEn:"Securely storing a template password", k:"mc",
 src:"quiz2:html",
 q:"你下載了一份根據現有虛擬機器產生的 Azure Resource Manager 範本，準備用來部署 100 台虛擬機器。\n你需要修改範本，讓它參照一組系統管理員密碼，⟦必須防止這組密碼以明文儲存⟧。你應該建立什麼來存放這組密碼？\n（本題與 AZ104-Q712 是同一種情境的重複題型。）",
 o:["一個 Azure Key Vault 與一個存取原則","一個 Azure 儲存體帳戶與一個存取原則","一個 Recovery Services 保存庫與一個備份原則","Azure Active Directory (AD) Identity Protection 與一個 Azure 原則"],
 a:[0],
 e:"解法：建立 Azure Key Vault 來存放系統管理員密碼，範本部署時改成從 Key Vault 動態取得密碼參數值，密碼就完全不會以明文寫進範本的參數檔裡，並用存取原則控制誰能讀取這個密碼。儲存體帳戶用來放檔案/Blob，不是存密碼的地方；Recovery Services 保存庫是備份用的；Identity Protection 是偵測風險登入的服務，都跟密碼儲存無關。",
 en:{q:"You need to modify the template to reference an administrative password. You must prevent the password from being stored in plain text. What should you create to store the password?",
  o:["an Azure Key Vault and an access policy","an Azure Storage account and an access policy","a Recovery Services vault and a backup policy","Azure Active Directory (AD) Identity Protection and an Azure policy"],
  e:"Retrieve the admin password from an Azure Key Vault during deployment (governed by an access policy) instead of embedding it as plain text."}},

{n:78, code:"AZ104-Q78", d:2, od:3, t:"擴展集開機自動安裝 Web 伺服器", tEn:"Auto-installing web server components on scale set VMs", k:"mc",
 src:"quiz2:html",
 q:"你打算自動化部署一個使用 Windows Server 2016 Datacenter 映像的虛擬機器擴展集。\n你需要確保擴展集的虛擬機器佈建時，就已經安裝好 Web 伺服器元件。⟦你應該執行哪兩個動作？⟧（每個正確答案各自是解法的一部分。）",
 o:["上傳一個設定指令碼","建立一個自動化帳戶","建立一個 Azure 原則","修改 Azure Resource Manager 範本的 extensionProfile 區段","在 Azure 入口網站建立一個新的虛擬機器擴展集"],
 a:[3,4],
 e:"虛擬機器擴展集可以搭配 Azure Desired State Configuration (DSC) 擴充功能，讓每台執行個體上線時自動套用設定（例如安裝 Web 伺服器角色）。做法是把 DSC 擴充功能寫進 ARM 範本的 extensionProfile 區段，再用這份範本在入口網站建立新的擴展集，這樣佈建出來的每台 VM 都會自動套用 DSC 設定、安裝好 Web 伺服器元件。上傳指令碼、建立自動化帳戶、建立 Azure 原則都不是「佈建時自動套用設定」的機制。",
 en:{q:"You need to ensure that when the scale set virtual machines are provisioned, they have web server components installed. Which two actions should you perform?",
  o:["Upload a configuration script","Create an automation account","Create an Azure policy","Modify the extensionProfile section of the ARM template","Create a new virtual scale set in the Azure portal"],
  e:"Add the DSC extension to the template's extensionProfile section, then deploy the scale set from that template so each instance auto-configures on boot."}},

{n:79, code:"AZ104-Q79", d:2, od:3, t:"範本部署到指定地區", tEn:"Deploying a template to a specific region", k:"mc",
 src:"quiz2:html",
 q:"你有一份 ARM 範本 Template1，用來部署一台 Azure 虛擬機器。\nTemplate1 的 variables 區段裡有：`\"location\": \"westeurope\"`。\n（來源網頁未保留 resources 區段的完整內容截圖；依正解可知，該 VM 資源的 location 屬性是直接寫死的字串，並沒有透過 `[variables('location')]` 引用 variables 區段的值。）\n你需要用 Template1 把虛擬機器部署到 West US 地區。⟦你應該怎麼做？⟧",
 o:["修改 resources 區段裡的 location 為 westus","部署時另外選擇 West US","修改 variables 區段裡的 location 為 westus"],
 a:[0],
 e:"如果 resources 區段裡這個資源的 location 屬性是直接寫死的字串（沒有透過 `[variables('location')]` 去引用 variables 區段），那麼不管怎麼改 variables 區段的值都不會影響到這個資源實際部署的地區，因為兩者根本沒有關聯；唯一有效的做法是直接到 resources 區段，把這個資源的 location 屬性改成 westus。部署精靈本身通常也沒有「地區」這種可以覆寫範本內容的通用選項（地區是每個資源各自的屬性，不是部署層級的全域設定）。",
 en:{q:"You need to deploy the virtual machine to the West US location by using Template1. What should you do?",
  o:["Modify the location in the resource section to westus","Select West US during the deployment","Modify the location in the variables section to westus"],
  e:"If the resource's location property is a hardcoded string rather than referencing the variable, only editing the resource section's location value has any effect."}},

{n:80, code:"AZ104-Q80", d:2, od:3, t:"啟用預備位置需要先擴大規模", tEn:"Scaling up to enable staging slots", k:"mc",
 src:"quiz2:html",
 q:"你建立了一個 App Service 方案 Plan1 與一個 Azure Web 應用程式 webapp1。\n你發現無法建立預備位置 (staging slot)。\n你需要替 Plan1 建立一個預備位置。⟦你應該最先做什麼？⟧",
 o:["在 Plan1 把 App Service 方案「擴大規模 (scale up)」","在 webapp1 修改應用程式設定","在 webapp1 新增自訂網域","在 Plan1 把 App Service 方案「擴充執行個體 (scale out)」"],
 a:[0],
 e:"部署位置（deployment slot）這個功能只有標準 (Standard)、進階 (Premium) 或隔離 (Isolated) 定價層才有，方案目前的定價層太低，選單裡才會沒有建立位置的選項。要解決，必須先把方案「擴大規模 (scale up)」，把定價層升到 Standard 以上，升級後才能繼續建立預備位置。「擴充執行個體 (scale out)」增加的是執行個體「數量」，不會改變定價層，解決不了這個問題；修改應用程式設定、新增自訂網域都跟啟用部署位置無關。",
 en:{q:"You discover that the option to create a staging slot is unavailable. What should you do first?",
  o:["From Plan1, scale up the App Service plan","From webapp1, modify the Application settings","From webapp1, add a custom domain","From Plan1, scale out the App Service plan"],
  e:"Deployment slots require Standard/Premium/Isolated tier; scale up (change pricing tier) first, since scale out only adds instance count."}},


{n:1, code:"AZ104-Q1", d:1, od:1, t:"跨租用戶建立使用者", tEn:"Creating users across AAD tenants",
 src:"quiz1:html", k:"mc",
 q:"注意：本題與另外兩題（Q2、Q3）情境完全相同，只是指示不同的人去做，請個別判斷解法是否達成目標。\n你的 Azure 訂用帳戶所屬的 Azure AD 租用戶 contoso.onmicrosoft.com 中有下表的使用者：\n| 使用者 | 角色 | 範圍 |\n|---|---|---|\n| User1 | 全域系統管理員 | Azure AD |\n| User2 | 全域系統管理員 | Azure AD |\n| User3 | 使用者系統管理員 | Azure AD |\n| User4 | 擁有者 | Azure 訂用帳戶 |\nUser1 建立了一個新的 Azure AD 租用戶，名為 external.contoso.onmicrosoft.com。\n你需要在 external.contoso.onmicrosoft.com 中建立新的使用者帳戶。\n⟦解法：指示 User2 去建立這些使用者帳戶。⟧這個解法是否達成目標？",
 o:["是","否"], a:[1],
